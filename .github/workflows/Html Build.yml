name: Build and upload release/webapp artifacts

on:
  push:
    branches: [ 2025-Desktop ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Gradle Wrapper exists
        run: |
          echo "===== Checking root directory for Gradle files ====="
          ls -la
          if [ ! -f "gradlew" ]; then
            echo "❌ Error: gradlew not found in root directory. Please commit Gradle Wrapper files."
            exit 1
          fi

      - name: Execute gradlew html:build (generate release/webapp)
        run: |
          chmod +x gradlew
          ./gradlew html:build --refresh-dependencies
        env:
          GRADLE_OPTS: "-Dorg.gradle.logging.level=info"

      - name: Verify release/webapp directory exists
        run: |
          echo "===== Checking build output directory ====="
          if [ ! -d "release/webapp" ]; then
            echo "❌ Error: release/webapp directory not found. Build may have failed."
            exit 1
          fi
          echo "===== Listing contents of release/webapp ====="
          ls -la release/webapp

      - name: Package release/webapp into zip
        run: |
          zip -r webapp-output.zip release/webapp/

      - name: Upload artifact (retained for 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: webapp-build
          path: webapp-output.zip
          retention-days: 1