name: 构建测试Web并上传工件

# 触发条件：可根据需要调整（如push到特定分支、手动触发等）
on:
  push:
    branches: [ 2025-Desktop ]  # 替换为你的目标分支
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-upload:
    runs-on: ubuntu-latest  # 使用Ubuntu环境运行
    
    steps:
      # 1. 检出代码仓库
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 执行构建脚本
      - name: 执行buildTestWeb.sh
        run: |
          # 赋予脚本执行权限
          chmod +x html/buildTestWeb.sh
          # 执行脚本
          /html/buildTestWeb.sh
        # 如果脚本执行失败，工作流会自动终止

      # 3. 将生成的文件打包为zip（请根据实际生成的文件路径调整）
      - name: 打包输出文件
        run: |
          # 假设脚本生成的文件在html/test-web目录下，可根据实际情况修改
          zip -r test-web-output.zip ../release/webapp/
        # 注意：如果生成文件在其他路径，需要修改这里的源路径

      # 4. 上传zip文件为工件，保留1天
      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: test-web-build  # 工件名称
          path: test-web-output.zip  # 要上传的zip文件路径
          retention-days: 1  # 保留1天
