name: 构建测试Web并上传工件

on:
  push:
    branches: [ 2025-Desktop ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 执行buildTestWeb.sh
        run: |
          # 赋予脚本本身执行权限
          chmod +x html/buildTestWeb.sh
          # 执行脚本（相对路径）
          ./html/buildTestWeb.sh

      - name: 打包输出文件（修正路径为release/webapp）
        run: |
          # 构建产物在根目录的release/webapp下
          zip -r test-web-output.zip release/webapp/

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: test-web-build
          path: test-web-output.zip
          retention-days: 1