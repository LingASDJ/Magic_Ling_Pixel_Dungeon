name: 构建测试Web并上传工件

on:
  push:
    branches: [ 2022-Desktop ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 执行buildTestWeb.sh
        run: |
          chmod +x html/buildTestWeb.sh
          ./html/buildTestWeb.sh
        env:
          GRADLE_OPTS: "-Dorg.gradle.logging.level=info"  # 输出详细构建日志

      - name: 检查构建产物目录（调试用）
        run: |
          echo "===== 根目录结构 ====="
          ls -la
          echo "===== html目录结构 ====="
          ls -la html
          echo "===== html/build目录 ====="
          ls -la html/build || echo "html/build不存在"

      - name: 打包输出文件（根据实际路径调整）
        run: |
          # 替换为调试后确认的产物路径
          zip -r test-web-output.zip html/build/

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: test-web-build
          path: test-web-output.zip
          retention-days: 1