name: Auto Sync Desktop to Android

on:
  push:
    branches:
      - 2025-Desktop

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for nosync in commit messages
        id: check_commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Latest commit message: $COMMIT_MSG"
          
          if echo "$COMMIT_MSG" | grep -qi "nosync"; then
            echo "::warning::Skipping sync due to 'nosync' in commit message"
            echo "skip_sync=true" >> $GITHUB_OUTPUT
          else
            echo "No 'nosync' found, proceeding with sync"
            echo "skip_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Git user info
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Checkout target branch (2025-Android)
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          git fetch origin
          git checkout 2025-Android
          git pull origin 2025-Android

      - name: Backup Android-specific code
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          # 创建备份目录并备份安卓特定代码
          mkdir -p /tmp/android_backup
          cp -r "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/android/" /tmp/android_backup/ 2>/dev/null || true
          echo "Android-specific code backed up"

      - name: Merge folder from 2025-Desktop to 2025-Android
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          # 从Desktop分支合并代码
          git checkout 2025-Desktop -- core/src/main
          echo "Desktop code merged"

      - name: Restore Android-specific code
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          # 恢复安卓特定代码
          if [ -d "/tmp/android_backup/android" ]; then
            rm -rf "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/android"
            mkdir -p "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon"
            cp -r /tmp/android_backup/android/ "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/"
            echo "Android-specific code restored"
          else
            echo "No Android-specific code to restore"
          fi

      - name: Commit and push changes
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          git add core/src/main
          # 检查是否有更改需要提交
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync core/src/main from 2025-Desktop branch (preserved Android-specific code)"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git 2025-Android
          fi

      - name: Skip sync notification
        if: steps.check_commit.outputs.skip_sync == 'true'
        run: |
          echo "Sync skipped due to 'nosync' in commit message"