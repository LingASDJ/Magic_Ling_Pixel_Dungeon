name: Auto Sync Desktop to Android
on:
  push:
    branches: [ DesktopMaster ]
permissions:
  contents: write
concurrency:
  group: sync-desktop-to-android
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for nosync in commit messages
        id: check_commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_ENV
          echo "commit_author=$(git log -1 --pretty=%an)" >> $GITHUB_ENV
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_ENV
          if echo "$COMMIT_MSG" | grep -qi "nosync"; then
            echo "::warning::Skipping sync due to 'nosync'"
            echo "skip_sync=true" >> $GITHUB_OUTPUT
          else
            echo "skip_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Git user info
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Checkout target branch (Android)
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          git fetch origin
          git checkout Android
          git pull origin Android

      - name: Backup Android-specific code
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          set -e
          mkdir -p /tmp/android_backup/scenes /tmp/android_backup/crashhandler /tmp/seed_backup
          # android 目录
          if [ -d "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/android" ]; then
            cp -r "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/android" /tmp/android_backup/
          fi
          # seedfinder 目录（关键修复）
          if [ -d "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/custom/seedfinder" ]; then
            cp -r "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/custom/seedfinder" /tmp/seed_backup/
          fi
          # 其余已知安卓特有文件
          for f in \
            "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/custom/utils/CrashHandler.java" \
            "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/TexturePackScene.java" \
            "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/BackupSaveScene.java" ; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/android_backup/$(dirname "${f#core/src/main/java/}")"
              cp "$f" "/tmp/android_backup/${f#core/src/main/java/}"
            fi
          done
          # 【按需扩充】SPDSettings.java 等共用但安卓有差异的文件
          # if [ -f "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/SPDSettings.java" ]; then
          #   cp "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/SPDSettings.java" /tmp/android_backup/
          # fi

      - name: Merge folder from Desktop to Android
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          set -e
          git checkout DesktopMaster -- core/src/main
          echo "Desktop code merged"

      - name: Restore Android-specific code
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          set -e
          # android 目录
          if [ -d "/tmp/android_backup/android" ]; then
            rm -rf "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/android"
            cp -r /tmp/android_backup/android "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/"
          fi
          # seedfinder 目录（关键修复：路径是 /tmp/seed_backup/seedfinder）
          if [ -d "/tmp/seed_backup/seedfinder" ]; then
            rm -rf "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/custom/seedfinder"
            cp -r /tmp/seed_backup/seedfinder "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/custom/"
          fi
          # 其余已知安卓特有文件
          if [ -d "/tmp/android_backup/custom" ]; then
            cp -r /tmp/android_backup/custom "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/"
          fi
          if [ -d "/tmp/android_backup/scenes" ]; then
            cp -r /tmp/android_backup/scenes "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/"
          fi

      - name: Commit and push changes
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          set -e
          git add core/src/main
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync from DesktopMaster (triggered by ${{ env.commit_sha }})" -m "Original commit by ${{ env.commit_author }}: ${{ env.commit_msg }}"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" Android
          fi

      - name: Skip sync notification
        if: steps.check_commit.outputs.skip_sync == 'true'
        run: |
          echo "Sync skipped due to 'nosync': ${{ env.commit_msg }}"
