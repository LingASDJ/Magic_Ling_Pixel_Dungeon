name: Auto Sync Desktop to Android

on:
  push:
    branches:
      - 2025-Desktop

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for nosync in commit messages
        id: check_commit
        run: |
          # 获取触发这次工作流的提交信息
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          
          echo "Triggered by commit: $COMMIT_SHA"
          echo "Author: $COMMIT_AUTHOR"
          echo "Message: $COMMIT_MSG"
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_ENV
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_ENV
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_ENV
          
          if echo "$COMMIT_MSG" | grep -qi "nosync"; then
            echo "::warning::Skipping sync due to 'nosync' in commit message"
            echo "skip_sync=true" >> $GITHUB_OUTPUT
          else
            echo "No 'nosync' found, proceeding with sync"
            echo "skip_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Git user info
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Checkout target branch (2025-Android)
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          git fetch origin
          git checkout 2025-Android
          git pull origin 2025-Android

      - name: Backup Android-specific code
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          # 创建备份目录
          mkdir -p /tmp/android_backup
          
          # 备份安卓分支上的安卓特定代码
          if [ -d "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/android" ]; then
            cp -r "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/android" /tmp/android_backup/
            echo "Android-specific code backed up"
          fi
          
          # 备份 CrashHandler.java
          if [ -f "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/custom/utils/CrashHandler.java" ]; then
            mkdir -p /tmp/android_backup/crashhandler
            cp "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/custom/utils/CrashHandler.java" /tmp/android_backup/crashhandler/
            echo "CrashHandler.java backed up"
          fi

          # 新增：备份 TexturePackScene.java
          if [ -f "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/TexturePackScene.java" ]; then
            mkdir -p /tmp/android_backup/scenes
            cp "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/TexturePackScene.java" /tmp/android_backup/scenes/
            echo "TexturePackScene.java backed up"
          fi

      - name: Merge folder from 2025-Desktop to 2025-Android
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          # 从Desktop分支合并代码
          git checkout 2025-Desktop -- core/src/main
          echo "Desktop code merged"

      - name: Restore Android-specific code
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          # 恢复安卓特定代码
          if [ -d "/tmp/android_backup/android" ]; then
            # 删除从Desktop分支带来的安卓代码（如果有的话）
            rm -rf "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/android" 2>/dev/null || true
            # 恢复备份的安卓代码
            mkdir -p "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon"
            cp -r /tmp/android_backup/android "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/"
            echo "Android-specific code restored"
          fi
          
          # 恢复 CrashHandler.java
          if [ -f "/tmp/android_backup/crashhandler/CrashHandler.java" ]; then
            mkdir -p "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/custom/utils/"
            cp /tmp/android_backup/crashhandler/CrashHandler.java "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/custom/utils/"
            echo "CrashHandler.java restored"
          fi

          # 新增：恢复 TexturePackScene.java
          if [ -f "/tmp/android_backup/scenes/TexturePackScene.java" ]; then
            mkdir -p "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/"
            cp /tmp/android_backup/scenes/TexturePackScene.java "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/"
            echo "TexturePackScene.java restored"
          fi

      - name: Commit and push changes
        if: steps.check_commit.outputs.skip_sync == 'false'
        run: |
          git add core/src/main
          # 检查是否有更改需要提交
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync from 2025-Desktop (triggered by ${{ env.commit_sha }})
          
            Original commit by ${{ env.commit_author }}:
            ${{ env.commit_msg }}"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git 2025-Android
          fi

      - name: Skip sync notification
        if: steps.check_commit.outputs.skip_sync == 'true'
        run: |
          echo "Sync skipped due to 'nosync' in commit message: ${{ env.commit_msg }}"
