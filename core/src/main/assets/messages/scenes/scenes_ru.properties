scenes.gamenewsscene$newsinfo.metered_network=При подключении к сети с лимитным трафиком, например, для передачи мобильных данных, мы не будем отправлять вам информацию о новых обновлениях, чтобы сохранить ваши деньги на счету мобильного телефона.\n\nПожалуйста, подключитесь к Wi-Fi и повторите попытку. \n\nТеперь нажмите на кнопку ниже, чтобы продолжить игру.

