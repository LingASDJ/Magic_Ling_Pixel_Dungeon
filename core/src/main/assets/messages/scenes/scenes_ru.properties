scenes.gamenewsscene.no_inter=Поскольку вы подключены к лимитированной сети, такой как мобильные данные. Мы отключили оповещения обновлений, чтобы избежать непредвиденного расхода трафика.\n\nЕсли вам нужно включить их, перейдите в настройки игры, чтобы включить отсутствие Wi-Fi, и отображение наличие нового обновления.\n\nТеперь нажмите на кнопку ниже, чтобы продолжить игру.
