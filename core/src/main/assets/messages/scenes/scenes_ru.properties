scenes.heroselectscene.daily_desc=Каждый ежедневный забег использует сид, сгенерированный на основе сегодняшней даты.\nЗаработать очки можно не более одного раза в день (сброс  происходит в 0:00 по UTC или в 08:00 по пекинскому времени)!\n\nВы можете зарабатывать очки в ежедневном забеге и отправлять их на сервер, чтобы соревноваться с другими игроками.\n\nСегодня вы еще не испытывали удачу, хотите начать ежедневный забег?
