scenes.eulascene.title=MLPD-EULA
scenes.eulascene.desc=Лицензионное соглашение Magic Ling Pixel Dungeon\nДата вступления в силу: 1 сентября 2025 г.\n\nПожалуйста, внимательно прочтите это соглашение. Устанавливая, копируя или используя это программное обеспечение, вы соглашаетесь соблюдать условия данного соглашения. Если вы не согласны, прекратите использовать данное программное обеспечение.\n\nI. Лицензирование\n1.1 Разработчик («Лицензиар») предоставляет вам («Лицензиар») неисключительную, непередаваемую, ограниченную личную некоммерческую лицензию на установку и использование Magic Ling Pixel Dungeon (Программное обеспечение) на вашем устройстве в соответствии с условиями текущего cоглашения.\n\nII. Ограничения использования\nВы соглашаетесь не участвовать в следующих действиях (включая прямое или косвенное содействие третьим лицам):\n1. Технический взлом: обратная разработка, декомпиляция, дизассемблирование или модификация программного кода через неофициальные интерфейсы;\n2. Подделка логотипа: удаление, скрытие или подделка знаков авторских прав, цифровых водяных знаков или технических мер защиты в программном обеспечении;\n3. Злоупотребление функциями: использование уязвимостей программного обеспечения для создания/распространения мошеннических инструментов или вмешательство в привычный опыт других пользователей;\n4. Коммерческое использование: коммерческое использование в любой форме, такой как продажа, лизинг, внедрение рекламы, монетизация денежных потоков и т. д.;\n5. Противоправное распространение: распространение программного обеспечения или производного контента через неофициальные каналы (включая, помимо прочего, сайты взломов, частные серверы и сайты интеграции модов).\n\nIII. Конфиденциальность данных\nДанное программное обеспечение собирает следующие данные через Google Firebase SDK в строгом соответствии с принципом минимальной необходимости:\n\nA. Базовые данные (Android)\n- Информация об устройстве: бренд, модель, версия операционной системы, разрешение экрана, объем памяти/оперативки, root-права;\n- Диагностика при эксплуатации: журналы сбоев, трассировки стека ошибок, длительность сессии, частота срабатывания событий;\n- Статистический портрет: анализ географического распределения пользователей, находящихся в провинциальных административных районах, посредством неточного расположения IP-адресов;\n- Привычки использования: ежедневная/ежемесячная активность, часы использования функциональных модулей (анализ в реальном времени через Firebase Realtime Database).\n\nB. Игровые данные (Android)\n- Записи прогресса: количество пройденных уровней, процент завершения глав DLC/побочек, количество побежденных боссов;\n- Статистика испытаний: уровень сложности и завершение испытаний 13-го уровня и выше;\n- Анализ AI: анонимный анализ моделей поведения игроков с помощью модели Gemini AI для корректировки игрового баланса и принятия решений по развитию.\n\nC. Правила обработки персональных данных\n- Анонимизация: все данные хешируются и не связаны напрямую с личностью человека;\n- Передача третьим лицам: данные размещаются на Google Firebase, и на них распространяется политика конфиденциальности (подробнее см. firebase.google.com/terms);\n- Права пользователя: сбор данных может быть отключен с помощью настроек в программном обеспечении (некоторые основные функции могут стать ограниченными).\n\nIV. Сторонние библиотеки\nПри использовании данного программного обеспечения вам будут предоставлены следующие сторонние зависимые библиотеки, за исключением Windows, которая имеет свою структуру библиотек, остальные представляют ядро ​​для служб библиотек зависимостей.\n\nОбозначения библиотек:\n\nAndroid: Смартфон. \nWindows: Персональный компьютер. \nWatch: Умные часы.\n\nСписок библиотек:\n\nNetiHarderBase64 (библиотека анализа) (Android/Windows)\nОсновные функции: предоставляет функции кодирования и декодирования Base64.\nОсновное назначение: используется для шифрования и дешифрования данных для обеспечения безопасности передачи данных.\nПолитика конфиденциальности: эта библиотека не собирает напрямую никакие пользовательские данные.\n\nGMSV4.4.2 (Android)\nОсновные функции: обеспечение поддержки сервиса Google Play, помощь в обновлении приложений, рассылка уведомлений и т. д.\nОсновное назначение: улучшение пользовательского опыта и оптимизация производительности приложений.\nПолитика конфиденциальности: службы Google Play собирают некоторые пользовательские данные в соответствии с политикой конфиденциальности. Для получения подробной информации см. Политику конфиденциальности Google.\n\nFirebaseCrashlyticsBomV3.3 (Android)\nОсновные функции: сбор данных о сбоях приложения и предоставление подробных отчетов для помощи разработчикам в исправлении ошибок.\nОсновное назначение: повышение стабильности приложения и устранение ошибок.\nПолитика конфиденциальности: журналы ошибок, собираемые Crashlytics, являются анонимными и не содержат никакой персональной информации. Передача данных осуществляется в соответствии с политикой конфиденциальности Firebase.\n\nFirebase-Bom V33.13.0(Android)\nОсновные функции: базовая библиотека зависимостей Firebase для интеграции FirebaseSDK.\nОсновные назначение: поддержка базы данных в реальном времени, аутентификации и других функций.\nПолитика конфиденциальности: Firebase обрабатывает данные, включая информацию об устройстве и его использовании, в соответствии со своей политикой конфиденциальности.\n\n6TailLunar: 1.7.4 (библиотека лунного календаря) (Android/Windows)\nОсновные функции: предоставляет функции расчета лунного календаря и преобразования дат.\nОсновное назначение: используется для отображения и расчета по лунному календарю.\nПолитика конфиденциальности: эта библиотека не подразумевает сбор персональных пользовательских данных.\n\nLibGDXV1.12.0 (Android/Windows)\nОсновные функции: среда разработки игр, предоставляющая графику, физический движок, обработку ввода и другие функции.\nОсновное назначение: помогает разрабатывать 2D и 3D-игры, обеспечивает обработку графики, звуковые эффекты и моделирование физики.\nПолитика конфиденциальности: библиотека LibGDX не собирает пользовательские данные.\n\nAppcompatV1.6.1 (Watch)\nОсновная функция: обеспечивает поддержку совместимости для приложений, чтобы гарантировать постоянную производительность на различных версиях устройств Android.\nОсновное назначение: обеспечивает совместимость пользовательского интерфейса между версиями и часами.\nПолитика конфиденциальности: эта библиотека не собирает никакие пользовательские данные.\n\nBlankUtilCodex (Android/Windows)\nОсновные функции: предоставляет общую библиотеку инструментов для упрощения процесса разработки.\nОсновное назначение: включает общие функции разработки, такие как обработка строк и хранение данных.\nПолитика конфиденциальности: эта библиотека не подразумевает сбор пользовательских данных.\n\nJenly1314.AppUpdater: app-updater: 1.2.0 (Android/Windows)\nОсновные функции: автоматическая проверка и обновление приложений.\nОсновное назначение: гарантировать автоматическое обновление приложений с использованием последних функций и исправлений.\nПолитика конфиденциальности: эта библиотека не собирает пользовательские данные, но может требовать подключение к сети для обновления.\n\nFastxmlJacksonV2.14.3 (Android/Windows)\nОсновные функции: предоставляет функции анализа и генерации данных в формате JSON.\nОсновное назначение: обработка обмена данными в формате JSON.\nПолитика конфиденциальности: эта библиотека не подразумевает сбор или обработку персональных данных.\n\nLuaJava (Android/Windows)\nОсновные функции: обеспечивает синтаксический анализ языка Lua.\nОсновное назначение: анализирует скрипты Lua для оптимизации кода и управления модификациями.\nПолитика конфиденциальности: эта библиотека не предполагает сбора и обработки персональных данных.\n\nV. Остальные обязательства\n1. Huimeng Moling не несет ответственности за убытки, вызванные форс-мажорными обстоятельствами. Форс-мажорные обстоятельства, упомянутые в настоящем Соглашении, включают: стихийные бедствия, изменения в законах, правилах или правительственных постановлениях, причины, присущие характеристикам сетевых услуг, такие как сбои отечественных и зарубежных основных операторов телекоммуникаций, технические неисправности компьютеров или Интернета, ограничения покрытия Интернета, компьютерные вирусы, хакерские атаки и другие объективные обстоятельства, которые невозможно предвидеть, избежать или преодолеть.\n2. Названия всех пунктов настоящего Соглашения приведены исключительно для удобства, и не имеют фактического значения, и не могут быть использованы в качестве основы для толкования смысла настоящего Соглашения и соответствующих с ним пунктов.\n3. Если какой-либо пункт настоящего Соглашения будет признан полностью или частично недействительным, или не имеющим исковой силы по какой-либо причине, остальные пункты настоящего Соглашения останутся действительными и имеют исковую силу.\n4. Настоящее Соглашение вступает в силу с даты его публикации, и представляет собой полное соглашение между вами и филиалом Huimeng Moling по его использованию и заменяет любые предыдущие соглашения и договоренности, достигнутые между двумя сторонами по тем же вопросам.\n5. Если у вас есть какие-либо комментарии или предложения по данному Соглашению или данной Услуге, отправьте электронное письмо на адрес электронной почты нашей службы поддержки клиентов: _clingsd@gmail.com_\n6. Сбор данных на устройствах кроме Android все еще находится в процессе разработки, если в будущем появятся новые услуги, они будут обновлены в этом соглашении, и всем пользователям будет предложено повторно прочитать его.\n\nВажно:\nИнструкции по отключению сбора данных: пользователи Android могут отключить сбор данных в меню Настройки > Настройки подключения > Журнал событий FireBase»;\n\nЕсли вы ещё не примете данное соглашение, игра будет немедленно закрыта. _Если вы хотите отключить сбор данных после принятия, пожалуйста, ознакомьтесь с важной информацией выше_.
