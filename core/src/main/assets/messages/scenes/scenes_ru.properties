scenes.yuantastonescene.icetown_content=Этот городок хранит древнюю историю, что даже коренных жителей почти не осталось. И лишь недавно, он вновь расцвел, когда триумвират поверхности поручил героям обследовать здешнее подземелье.\n\nЗдесь стоит гостиница, где отдыхают уставшие путешественники. А самой гостиницей заправляет таинственная хозяйка, чьё прошлое покрыто мраком... В этих краях круглый год падает снег, из-за чего нет ощущения смены года. Кажется, само это место было навсегда оставлено богами...

