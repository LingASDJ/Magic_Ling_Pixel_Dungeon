actors.mobs.npcs.magehand.name=法師之手
actors.mobs.npcs.magehand.desc=敕靈天女身旁的隨從，能夠通過各類法杖提供各類支援，並且自身完全無敵。
actors.mobs.npcs.magehand.wand_equipped=法師之手裝配了%s，現在它將為你保駕護航。
actors.mobs.npcs.magehand.wand_used=法師之手釋放了來自%s的力量！
actors.mobs.npcs.magehand.wand_unequipped=卸下了%s
actors.mobs.npcs.magehand.desc_equipped_wand=已裝備的法杖：%s
actors.mobs.npcs.magehand.desc_charges=當前法杖充能：%s/%s
actors.mobs.npcs.magehand.desc_colddown=當前攻擊冷卻還剩：%s回合
actors.mobs.npcs.magehand.out_of_range=瞬移超出英雄可視範圍！
actors.mobs.npcs.magehand.desc_staff=老魔杖：%s
actors.mobs.npcs.magehand$handshield.name=有形之手
actors.mobs.npcs.magehand$handshield.desc=法師之手汲取了護盾的精華，能在短時間使你的防禦大幅提升，使你能更好地抵禦物理攻擊。\n\n當前增加的護甲值：0~%d。\n距離效果結束還有：%s 回合。
actors.mobs.npcs.magehand$wndmagehand.cant_unidentified=你還沒有鑑定這個法杖，無法裝配在法師之手上。
actors.mobs.npcs.magehand$wndmagehand.cant_equip=你只能在法師之手上裝配未裝備在自身的老魔杖。

actors.mobs.npcs.magehand$magehandcontrol.hand=法師之手

actors.mobs.npcs.magehand$wndmagehand.title=法師之手控制器
actors.mobs.npcs.magehand$wndmagehand.desc=為法師之手裝備法杖，所有法杖施法後的冷卻為3回合。\n\n只有裝配了老魔杖法師之手才可以近戰，法杖施法總是高於近戰，除非處於冷卻期間或裝配的法杖暫無充能。
actors.mobs.npcs.magehand$wndmagehand.wand_prompt=選擇要裝備的法杖
actors.mobs.npcs.magehand$magehandcontrol.name=法師之手控制器
actors.mobs.npcs.magehand$magehandcontrol.desc=控制法師之手的法杖裝備，可以裝配各類法杖，瞬移，攻擊，巡查等一系列功能。\n\n你可以點擊裝配法杖進行裝配，或使用遊戲螢幕右下角的快捷按鈕。
actors.mobs.npcs.magehand$magehandcontrol.ac_hand=裝配法杖
actors.mobs.npcs.magehand$magehandcontrol.ac_direct=瞬移
actors.mobs.npcs.magehand$magehandcontrol.ac_summon_hand=召喚
actors.mobs.npcs.magehand$magehandcontrol.ac_target_enemy=攻擊
actors.mobs.npcs.magehand$magehandcontrol.ac_toggle_patrol=巡查/跟隨
actors.mobs.npcs.magehand$magehandcontrol.patrol_start=法師之手開始巡查，不再和英雄一同跟隨。
actors.mobs.npcs.magehand$magehandcontrol.patrol_stop=法師之手停止巡查，開始和英雄一同跟隨。

