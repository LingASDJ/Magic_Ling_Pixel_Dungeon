actors.mobs.greenstingcv.rankings_desc=被綠野精靈國王勸阻，不再向前，災難仍在繼續……
actors.mobs.greenstingcv.desc=曾經是叢林的王者，在這個時間線由於災難的發生，漸漸的遷移到矮人王都下方生存，並且聯合最初的元素族群和豺狼族群殲滅了矮人。\n\n曾經那位冒充矮人國王的死靈法師已經不見了蹤影……據說有_兩位矮人_帶著殘留的軍隊撤到了曾經的惡魔所在的領地……\n\n而它被元素和豺狼尊稱為王……，就連礦洞的的生物都對它畢恭畢敬。
