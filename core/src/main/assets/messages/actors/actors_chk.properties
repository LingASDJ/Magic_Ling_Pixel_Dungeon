actors.mobs.bosses.qliphoth.name=克里弗斯之果
actors.mobs.bosses.qliphoth.explo_kill=在最後關頭，克里弗斯之果巨大的爆炸將你炸的渣都不剩……
actors.mobs.bosses.qliphoth.desc=這顆鮮紅的果實將周圍一切生物都化作自身的養分。身旁的觸手會將不慎走進的小動物們絞殺，腐化成纏繞在四周的瘴氣。但當它們感受到你手上拿著的提燈時，卻表現出畏懼火焰的樣子。\n\n極少有冒險者能對這株植物作出描述，在得到的隻言片語中，你唯一能確定的就是“它是森林至暗的中心”。
actors.mobs.bosses.qliphoth.notice=觸手正在不斷蠕動，試圖靠近你。
actors.mobs.bosses.qliphoth.summon=中間的果子拍打著地面，新生的藤蔓捲土重來。
actors.mobs.bosses.qliphoth.an_argy=所有藤蔓都被摧毀，果子暴怒著拍打地面，它似乎要開始對你發起襲擊了！
actors.mobs.bosses.qliphoth.dead=養分……汲取……失敗……，果實破裂聲中好像夾雜著一絲悲鳴。
actors.mobs.bosses.qliphoth.onlyfish=_幻影魚尚未死亡之前，果子處於無敵狀態。_
actors.mobs.bosses.qliphothlasher.name=克里弗斯之藤
actors.mobs.bosses.qliphothlasher.desc=藤蔓沒有智慧，它們的存在價值就是保護果實。不論是不小心靠近果實的“小動物”，還是企圖清理枯藤更進一步的冒險者，都被這些藤蔓絞死成孕育果實的肥料了。\n\n_這根藤蔓將會週期性對距離4格內的可見英雄發起攻擊，造成殘廢效果，並每回合回復兩點血量。_\n\n對於非英雄單位，觸手將伸出枝幹將其捕獲並蠶食。
actors.mobs.bosses.qliphothlasher.rankings_desc=被克里弗斯之果的藤蔓纏繞窒息而死.....
actors.mobs.bosses.crivusfruits$diedblobs.rankings_desc=被克里弗斯之果的紅霧氣體窒息而死.......
actors.mobs.bosses.crivusfruits$diedblobs.name= 致命紅霧
actors.mobs.bosses.qliphoth$invisibility_fogs.desc=被果子絞死的生物形成的一個瘴氣區域，你可能感覺到噁心，所以視野會降低。但這些屍骨形成的氣體或許可以讓果子的藤蔓認為你是死物。
actors.mobs.bosses.crivusfruits.name=克里弗斯之果
actors.mobs.bosses.crivusfruits.desc=這顆鮮紅的果實將周圍一切生物都化作自身的養分。身旁的觸手會將不慎走進的小動物們絞殺，腐化成纏繞在四周的瘴氣。但當它們感受到你手上拿著的提燈時，卻表現出畏懼火焰的樣子。\n\n極少有冒險者能對這株植物作出描述，在得到的隻言片語中，你唯一能確定的就是“它是森林至暗的中心”。
actors.mobs.bosses.crivusfruits.notice=觸手正在不斷蠕動，試圖靠近你
actors.mobs.bosses.crivusfruits.anargy=觸手的蠕動變為猛烈抽搐，拍打中釋放出更多有毒氣體
actors.mobs.bosses.crivusfruits.died!!!=所有藤蔓都停止了抽動，果實的顏色似乎更加鮮紅了
actors.mobs.bosses.crivusfruits.!!!=克里弗斯之果正在汲取魔力釋放範圍更大的紅色毒霧!
actors.mobs.bosses.crivusfruits.dead=養分……汲取……失敗……，果實破裂聲中好像夾雜著一絲悲鳴。
actors.mobs.bosses.crivusfruits.weapon=你已經連續3局未獲得生命樹，觸發保底機制，同時你的保底機制次數重設為0。

actors.mobs.bosses.crivusfruits$diedblobs.desc=一團紅色的毒霧從克里弗斯之果周圍散發而出，你的潛意識告訴你這種東西會對你造成極大的傷害。
actors.mobs.bosses.crivusfruits$diedblobs.csed=果實爆開後迸射出一些氣味清新的紅色氣體，用來做空氣清新劑似乎挺不錯的。

actors.mobs.bosses.crivusfruitslasher.name=魔化藤
actors.mobs.bosses.crivusfruitslasher.desc=藤蔓沒有智慧，它們的存在價值就是保護果實。不論是不小心靠近果實的“小動物”，還是企圖清理枯藤更進一步的冒險者，都被這些藤蔓絞死成孕育果實的肥料了。
actors.mobs.bosses.crivusfruitslasher.frost_kill=克里弗斯之果發出的酸蝕氣霧徹底殺死了你……
actors.mobs.bosses.crivusfruits.frost_kill=克里弗斯之果發出的酸蝕氣霧徹底殺死了你……

actors.mobs.npcs.pinkling.name=紫澪
actors.mobs.npcs.pinkling.desc=一位始終微笑著的少女。她天真活潑乃至略帶稚氣的容顏，很好的將她資深冒險家的身份隱藏了起來。她長久佇立於此，迎接一位又一位冒險家。
actors.mobs.npcs.pinkling.messages1=你好啊，我是紫澪，一位冒險家。此前我一直在外調查深海相關事宜，長久未歸，現在回來雪景小鎮了。
actors.mobs.npcs.pinkling.messages2=現在已是年後了，小鎮沒那麼熱鬧了呢。
actors.mobs.npcs.pinkling.messages3=又要踏上征途了嗎？那祝你好運，我這裡有一些書籍，也許能幫到你哦。

actors.mobs.npcs.zero.normal.smallblue.name=小藍
actors.mobs.npcs.zero.normal.smallblue.desc=這位神秘的女僕只是整日在此寫一些無聊的繁雜瑣事，她美其名曰歷史不得遺忘，但寫的僅僅只是諸如每天發生了何事罷了
actors.mobs.npcs.zero.normal.smallblue.messages1=每一寸空氣嘶吼著刀劍的嗡鳴聲，%s，你的功績為你帶來的榮光，我在此向您致敬。
actors.mobs.npcs.zero.normal.smallblue.messages2=啊？想知道我到底從哪來嗎？歷史具有多面，我源自於傷口，血流不止，無法癒合。
actors.mobs.npcs.zero.normal.smallblue.messages3=我為你在旅途中祈禱 %s 我喜歡認真對待生活的人，那努力活著的樣子...
actors.mobs.npcs.zero.normal.smallblue.messages4=啊咧？還不走嗎“生命是束純淨的火焰，我們內心都擁有一顆無形的太陽...

