actors.mobs.lb.blacksoul.name=暗影
actors.mobs.lb.blacksoul.desc=由於重生十字架的緣故,因此你再次重生了。但你先前的東西都被自己的暗影亡魂奪走了,殺死它,奪回自己的一切！
