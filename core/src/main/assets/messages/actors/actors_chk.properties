actors.buffs.deadsoul.name=前世的回想
actors.buffs.deadsoul.desc=你的亡魂帶走了你前世的一切，殺死它，奪回自己的一切！
actors.buffs.championenemy$deadsoulsx.name=前世迴響
actors.buffs.championenemy$deadsoulsx.desc=它是你前世的迴響。打敗它，奪回它的力量，讓自己重歸完整。

actors.buffs.sanity.sanityvalue=剩餘理智:%s
actors.buffs.sanity.sanitydrop=受到來自敵人的精神傷害!
actors.buffs.sanity.name=信心滿滿
actors.buffs.sanity.name2=迷茫時刻
actors.buffs.sanity.name3=恐懼襲來
actors.buffs.sanity.normal_desc=_一次次踏入地牢只會使自己的理智逐漸喪失。\n\n_你已不知道是何時再來到這個地牢，但邪惡的詭異氣氛撲面而來。這次你進入地牢你感覺到了一種名為理智的存在。但你卻不知道何時會因失去理智而被地牢吞噬，至少不是現在。\n\n}目前理智為:%s點}\n\n}你現在非常的理智，因此你完全不用擔心任何事情}

actors.buffs.sanity.crazy_desc=_由於沒有光芒的照耀或因為怪物的精神摧殘，你現在已經有一點的不理智了。_\n\n}目前理智為:%s點}\n\n}你現在有一點失去理智，建議還是儘管想辦法振作起來。}

actors.buffs.sanity.died_desc=]理智已經離你而去，臆想的怪物，殘破的信念，墮落的靈魂，你的恐懼已經成為了了現實]\n\n]目前理智為:%s點]\n\n]你已經快要完全喪失理智了，你能感受到自己的靈魂正在被蠶食，如果還不想辦法恢復自己的理智，那麼自己將會變成下一個怪物！

#
actors.hero.heroclass.slime_unlock= 從史萊姆王身上迸裂的原漿所聚合成的新個體，也許是為了模仿擊敗它的強者，這團小生命有著一定的智慧。\n\n_上半段暫無法解鎖，敬請期待。_

