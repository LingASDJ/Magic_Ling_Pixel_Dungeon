custom.utils.plot.boatplot$diedboat.rankings_desc=<#f00>古堡結局<RGB>：沉船烏龍(彩蛋)

actors.buffs.status.bloodloss.death=血族的血脈詛咒你沒能阻止……
actors.buffs.status.bloodloss.name=血脈詛咒
actors.buffs.status.bloodloss.rankings_desc=你沒能阻止血族的詛咒……

levels.rooms.special.boilerroom$candleactivepoint.name=燭台
levels.rooms.special.boilerroom$candleactivepoint.desc=這個燭台似乎有什麼用處……，你應該嘗試觸碰一下它……

levels.rooms.special.boilerroom$boilertilemap.name=壁爐
levels.rooms.special.boilerroom$boilertilemap.desc=一座神秘的壁爐放在了這裡，中間還有一個燭台矗立著……，似乎有什麼用處……

levels.rooms.special.boilerroom.yell=試煉契約已達成，祂正在等到你的到來……
levels.rooms.special.boilerroom.yell2=靈魂碎片類型不足，無法點燃壁爐……

actors.mobs.bosses.hollow.morphs.name=墨菲厄斯
actors.mobs.bosses.hollow.morphs.desc=無法理解，無法解析。認知模組出現錯誤，無法解析此數據。\n\n古堡真正的東道主，但同時也是不可名狀的外神之一。\n\n祂想拉你成為神，但你毅然拒絕！\n\n由於你見到了神的面貌，你不可能再活著出去！現在，必須面對祂了\n\n<#772F9C>完全無敵，但可以透過擊敗附近的塔來削弱祂的力量<RGB>
actors.mobs.bosses.hollow.morphs.notice=%s，和我一起在浩瀚星海進行最終的演出吧！
actors.mobs.bosses.hollow.morphs.four_tone_active=魔神環繞，眾生癲狂……
actors.mobs.bosses.hollow.morphs.phase_tone_active=沉沒來路，遍歷群星……
actors.mobs.bosses.hollow.morphs.endtalk=你確實很強，與我對話，讓我們結束這場奇蹟般的旅途吧！

actors.mobs.bosses.hollow.mycoreheart.name=宇宙之心
actors.mobs.bosses.hollow.mycoreheart.desc=一個巨大的核心，其中包含了宇宙的奧秘和能量。\n\n墨菲厄斯企圖讓核心腐化，為它所用，絕不能讓祂得逞！！！\n\n友好單位，非英雄單位攻擊核心時會立刻造成敵方大額流血，宇宙之心每次受到的傷害固定為1。\n\n修復世界支柱讓宇宙之心完全重啟，每防守5波給予一次修復權限！
actors.mobs.bosses.hollow.mycoreheart.gethp=你的英勇防衛，我看在眼裡，宇宙之心似乎在和你產生共鳴……
actors.mobs.bosses.hollow.mycoreheart.not_count=你沒有修復世界支柱的次數，防守更多波次敵人以獲得更多！！！--目前總修復次數：%s。

actors.mobs.bosses.hollow.mycoreheart.repaier=修復此世界支柱？修復需要消耗25回合，修復成功後，將獲得對應世界支柱加成。
actors.mobs.bosses.hollow.mycoreheart.enter_yes=立刻修復
actors.mobs.bosses.hollow.mycoreheart.enter_no=稍後修復

actors.mobs.bosses.hollow.mycoreheart$repaierdown.name=重啟
actors.mobs.bosses.hollow.mycoreheart$repaierdown.desc=此塔已被修復，但還需要等待內部重啟，重啟完成後，將給予你和宇宙之心增益效果！\n\n剩餘重啟回合：%s回合。

actors.mobs.bosses.hollow.mycoreheart$summoncolddown.name=幻影入侵
actors.mobs.bosses.hollow.mycoreheart$summoncolddown.desc=往日的幻影，祂正在試圖摧毀宇宙之心！\n\n下一波次進攻倒數計時：%s回合。\n\n下一回合為第%s層怪物。
actors.mobs.bosses.hollow.mycoreheart$summoncolddown.active_skills=下一波次

actors.mobs.bosses.hollow.bad.towergodsbad.name=神明之柱-損壞
actors.mobs.bosses.hollow.bad.towergodsbad.name_x=神明之柱-已修復
actors.mobs.bosses.hollow.bad.towergodsbad.desc=一座高聳的石柱，展現出神聖十字的樣貌。\n\n_此柱體已損壞，修復後，英雄獲得持續週期神器充能效果。_
actors.mobs.bosses.hollow.bad.towergodsbad.desc_x=一座高聳的石柱，展現出神聖十字的樣貌。\n\n_此柱體已完全修復，英雄獲得持續週期神器充能效果。_

actors.mobs.bosses.hollow.bad.towertimebad.name=時間之柱-損壞
actors.mobs.bosses.hollow.bad.towertimebad.name_x=時間之柱-已修復
actors.mobs.bosses.hollow.bad.towertimebad.desc=一座高聳的石柱，展現出扭曲時間的樣貌。\n\n_此柱體已損壞，修復後，此柱體讓敵人獲得週期性殘廢效果，而英雄獲得週期極速效果。_
actors.mobs.bosses.hollow.bad.towertimebad.desc_x=一座高聳的石柱，展現出扭曲時間的樣貌。\n\n_此柱體已完全修復，此柱體讓敵人獲得週期性殘廢效果，而英雄獲得週期極速效果。_

actors.mobs.bosses.hollow.bad.towermachinebad.name=機械之柱-損壞
actors.mobs.bosses.hollow.bad.towermachinebad.desc=一座高聳的石柱，展現出輪齒機械的樣貌。\n\n_此柱體已損壞，修復後，此柱體讓敵人獲得週期性易傷效果，而英雄獲得週期激素湧動效果。_
actors.mobs.bosses.hollow.bad.towermachinebad.name_x=機械之柱-已修復
actors.mobs.bosses.hollow.bad.towermachinebad.desc_x=一座高聳的石柱，展現出輪齒機械的樣貌。\n\n_此柱體已完全修復，此柱體讓敵人獲得週期性易傷效果，而英雄獲得週期激素湧動效果。_

actors.mobs.bosses.hollow.bad.towermindbad.name=思維之柱-損壞
actors.mobs.bosses.hollow.bad.towermindbad.desc=一座高聳的石柱，展現出無常思緒的樣貌。\n\n_此柱體已損壞，修復後，此柱體讓敵人獲得週期性暈眩效果，而英雄獲得週期淨化屏障效果。_
actors.mobs.bosses.hollow.bad.towermindbad.name_x=思維之柱-已修復
actors.mobs.bosses.hollow.bad.towermindbad.desc_x=一座高聳的石柱，展現出無常思緒的樣貌。\n\n_此柱體已完全修復，此柱體讓敵人獲得週期性暈眩效果，而英雄獲得週期淨化屏障效果。_

actors.mobs.bosses.hollow.towergods.name=神明之柱
actors.mobs.bosses.hollow.towergods.desc=一座高聳的石柱，展現出神聖十字的樣貌。\n神明起源於此，周天信仰匯聚於此。\n“神明，宇宙意志與權柄的具現。”\n宇宙無言，唯有神明能向你展示這份崇高。勿要為自己的渺小彷徨，一同來追隨祂們的腳步。\n\n遠道而來之人，忽略這傲慢誑語。\n祂自視甚高，殊不知於宇宙而言祂亦是不值一提。\n去擊潰這一份狂傲，為神明二字正名。

actors.mobs.bosses.hollow.towertime.name=時間之柱
actors.mobs.bosses.hollow.towertime.desc=一座高聳的石柱，展現出扭曲時間的樣貌。\n歷史的洪流凝結於此，述說著宇宙的記憶。\n“時間，宇宙中恆常不變之物。”\n箴言被如此銘刻在石柱之上。\n從宇宙有記憶開始，時間就隨其同行。從時間的彼端至此，它仍在悄無聲息的前進。\n\n遠道而來之人，勿要被表象所惑。\n時間從未開口述說自身，悖論是神明的謊言。\n請為我們掃除虛妄，尋回時間最初的準線。

actors.mobs.bosses.hollow.towermachine.name=機械之柱
actors.mobs.bosses.hollow.towermachine.desc=一座高聳的石柱，展現出輪齒機械的樣貌。\n它以齒輪的交錯闡述秩序，展現原始律動的巨大能量。\n“機械，科技與秩序的象徵。”\n一個空有熵增的宇宙是空虛混亂的，唯有秩序能為宇宙萬物指明正道。\n\n遠道而來之人，摒棄這無用之物。\n機械始於人的巧思，而非神明，秩序同樣由自我維持。\n來拆毀這偷來的造物，自己來定義秩序。

actors.mobs.bosses.hollow.towermind.name=思維之柱
actors.mobs.bosses.hollow.towermind.desc=一座高聳的石柱，展現出無常思緒的樣貌。\n遍宇靈光匯聚於此，述說著宇宙的思緒。\n“思維，宇宙中最偉大的力量。”\n箴言被如此銘刻在石柱之上。\n從前，物質主導著宇宙的發展方向。始於一個想法，宇宙有了自己的思維與意志，真正擁有了生命。\n\n遠道而來之人，無視這虛與委蛇。\n神明將其思維強加於宇宙，僭越者所述皆為妄言。\n請為我們掃除謬論，澄清宇宙的所思所想。

actors.mobs.bosses.hollow.yogsoul$attackdamagemagic.name=深空惡意
actors.mobs.bosses.hollow.yogsoul$attackdamagemagic.desc=來自猶格·索托斯的惡意附著在黑山羊-莎布·尼古拉絲，奈亞·拉托提普，以及祂自己身上\n\n祂們周圍7*7範圍內的敵人每回合將受到_4心魔損傷_。\n\n剩餘回合時長：%s回合。

actors.mobs.bosses.hollow.shubniggurath$diedgalaxy$bombitem.name=秩序之石
actors.mobs.bosses.hollow.shubniggurath$diedgalaxy$bombitem.desc=智者們熟知世間的一切象徵都並非空洞無物，而示於此處之事便是其中之一……這種力量無可名狀、不可言喻，亦無法被常人所理解；它只可存在於某些掩蓋其本質的緯紗之下，存在於某些詩意盎然的離奇故事中
actors.mobs.bosses.hollow.shubniggurath$diedgalaxy$bombitem.cant_pickup=你無法拾取這個秩序之石

actors.mobs.bosses.hollow.nyarlathotep.name=奈亞·拉托提普
actors.mobs.bosses.hollow.nyarlathotep.desc=超越光與暗的領域，直達於難以抑止的太虛；就在這座隱藏在宇宙之中的、令人作嘔的墓地裡，從超越時間、超越想像的黑暗房間中傳來瘋狂敲打巨鼓的聲響，以及長笛細微、單調、褻瀆的音色。應和這可憎的敲擊和吹奏，那些龐大而黑暗的終極之神——那些盲目、喑啞、痴愚的蕃神們——正緩慢、笨拙、荒謬地跳起舞蹈。而它們的靈魂就是奈亞拉托提普。\n\n這是它在這個宇宙的化身之一，但靈魂早已不在，祂利用它來傳播混沌，傳播痴愚……\n\n_攻擊時有 50% 機率在場上創建一個不隱藏的隨機陷阱（不含造成上下樓效果的陷阱）\n玩家直接踩到陷阱時受到 10 點心魔損傷（翻倍後為 20 點）\n奈亞子的近戰攻擊會造成 7~14 點心魔損傷。\n奈亞子遺失目標時，每 3 回合會在場上隨機位置瞬移。\n\n真實心魔（被動）：奈亞子在場期間，玩家受到的心魔損傷翻倍；且玩家每次受到心魔損傷時，會同時受到相當於該損傷值 50%~100% 的魔法傷害。通過 “真實心魔” 效果造成的魔法傷害，將為場上所有單位回復對應數值的生命值。_

actors.mobs.bosses.hollow.yogsoul.name=猶格·索托斯
actors.mobs.bosses.hollow.yogsoul.desc=猶格·索托斯知曉大門所在。因為猶格·索托斯即是門，猶格·索托斯即是門匙，即是看門者。過去在她，現在在她，未來亦在她，因為萬物皆在猶格·索托斯。她知曉舊日支配者曾於何處突破；她亦知曉舊日支配者將於何處再次突破。她知曉這世上的哪些土地曾飽受彼之蹂躪；其也知曉哪些土地仍舊承載彼之踐踏；她亦知曉為何當彼踐踏受難之土時，卻無人得以眼見彼之容貌……猶格·索托斯即是門之匙，憑藉此門無數空間在此匯聚。\n\n這是它在這個宇宙的化身之一，但靈魂早已不在，祂利用它來執行秩序，傳承規則……\n\n_當近身無目標時，持續引導施法，按固定回合循環觸發以下效果：\n每 5 回合，為場上所有友軍提升 5% 初始生命值上限，並立即回復 5% 最大生命值，持續鞏固團隊生存能力。\n每 10 回合，使場上所有友軍獲得持續 5 回合的心魔侵蝕光環，對自身 7×7 範圍內的敵方單位每回合造成 4 點心魔損傷，形成區域壓制態勢。\n每 15 回合，自身根據已損失生命值回復 10%~20% 最大生命值。_

actors.mobs.bosses.hollow.shubniggurath.name=莎布·尼古拉絲
actors.mobs.bosses.hollow.shubniggurath.desc=她是萬物之母，不可言喻者的妻子。有說法稱它生出了包括克蘇魯在內的幾乎所有的舊日支配者，乃至一切生命，甚至一切修復、孕育生命的咒術可能都與其有關。\n\n這是它在這個宇宙的化身之一，但是是一具沒有靈魂的空殼，祂利用它來傳播瘟疫，傳播絕望……\n\n_當受到物理攻擊時，分裂為兩個個體，分別繼承原有的一半血量，分身繼承本體的全部機制。\n若連續 8 回合未受到傷害，則自動分裂一次，兩個分身都能全額繼承原有血量。\n黑山羊無基礎傷害，但若分裂在玩家視野中發生，玩家將受到 8 點心魔損傷。\n黑山羊分身存在時，本體始終無法死亡，且本體血量降為0後立刻回復至1000，重設血量5次後即可無視分身斬殺本體並消滅場上所有分身。\n黑山羊與她的分身至多存在18個，超過無法自動分裂，攻擊也無法再分裂。_

actors.mobs.mob.name_old=往日的幻影
actors.mobs.mob.desc_old=來自墨菲厄斯召喚的怪物，其形態與地牢的怪物高度相似。但它們將優先鎖定宇宙之心進行攻擊，請你務必保衛好宇宙之心！！！

actors.mobs.bosses.hollow.towermachine$starcanon.name=星空粒子高爆彈
actors.mobs.bosses.hollow.towermachine$starcanon.desc=由機械之柱發射出的爆彈，似乎可以引爆星空。不過由於機械之柱年久失修，爆彈威力大打折扣。不過雖說不能引爆星空，但炸死幾個平平常常的生物還是沒什麼問題。\n\n你還在看描述？瓜兮兮的，快跑！！！不然你就只能在這裡等死了！
actors.mobs.bosses.hollow.towermachine.starcanon_kill=你被星空粒子高爆彈炸的四分五裂，消散在宇宙之中……

actors.mobs.bosses.hollow.towertime$dreamfireghost.name=星空怨靈
actors.mobs.bosses.hollow.towertime$dreamfireghost.desc=被時間之柱擬構出來的怨靈，可以造成磷火傷害。

actors.mobs.bosses.hollow.towermachine$deadalive.name=亡者歸來
actors.mobs.bosses.hollow.towermachine$deadalive.desc=這個生物已經被機械之柱復活，不過由於機械之柱的力量殘缺，它很快將會再次回歸宇宙的懷抱。\n\n此生物將在%s回合徹底消逝。

actors.mobs.bosses.hollow.towermachine$machineattackcooleddown.name=重裝彈藥……
actors.mobs.bosses.hollow.towermachine$machineattackcooleddown.desc=機械之柱正在重新填裝彈藥，在此期間將不能進行任何攻擊。\n\n%s回合後，機械之柱將填裝完成。

actors.mobs.bosses.hollow.towergods$attackup_palf.name=神聖裁決
actors.mobs.bosses.hollow.towergods$attackup_palf.desc=神明之柱的賜予你的力量，將使得你的傷害提升50%%。\n\n剩餘效果時長：%s回合

actors.mobs.bosses.hollow.double_towergods$attackup_palf.name=神聖審判
actors.mobs.bosses.hollow.double_towergods$attackup_palf.desc=神明之柱的賜予你的力量，將使得你的傷害提升100%%。\n\n剩餘效果時長：%s回合

actors.mobs.bosses.hollow.towermind$mindcore.name=思想混沌模組
actors.mobs.bosses.hollow.towermind$mindcore.desc=混沌的思想，可以讓你感受到宇宙誕生之初的混亂。\n\n思維之柱尚未被摧毀時，此單位無法死亡。但0血會吐出被繳械的物品。
actors.mobs.bosses.hollow.towermind$mindcore.desc_items=這個模組上已經存在一個被繳械的物品：_%s_。

actors.mobs.bosses.hollow.towermind.yell_steal_item=思想正在侵蝕你，你感覺你的%s被繳械了！

actors.mobs.bosses.hollow.towerparalysis.name=柱體癱瘓
actors.mobs.bosses.hollow.towerparalysis.desc=因為其他柱子被擊破了，這些柱子將會癱瘓一段時間。在此期間柱子將無法釋放任何技能，且受到的傷害提升25%%。\n\n剩餘效果時長：%s回合

actors.mobs.npcs.zero.whitelingland.name=澪
actors.mobs.npcs.zero.whitelingland.desc=在一場場冒險裡，她始終注視著你的身影。她靜立在漫天風雪之中，周身卻無半分寒風靠近，一片安寧。\n\n如果你遇見了她，不妨上前與她搭話，聽聽她藏在風雪裡的過往。
actors.mobs.npcs.zero.whitelingland.message1=你好啊，%s。歡迎你再次來到這片雪景小鎮。
actors.mobs.npcs.zero.whitelingland.message2=我看著你在地牢中面對困難，抗衡古神，抵禦來自外界的侵擾……\n\n一路走來，你真的很勇敢。
actors.mobs.npcs.zero.whitelingland.message3=嗯，我似乎說漏了些什麼，不過，你想必早已察覺到我的身份了，對嗎？
actors.mobs.npcs.zero.whitelingland.message4=我是祂曾經的一部分，冬鈴本是世間寒冰本源之力，是我親手塑造了如今的她。
actors.mobs.npcs.zero.whitelingland.message5=這裡的風雪雖狂，卻傷不到你我分毫，%s，一定要繼續追查下去。這柄法杖贈予你，至於其他的補給，就當是我向你收取的一點小費吧。

actors.mobs.npcs.zero.whitelingland.a_message5=哦，對了，相逢即是有緣，我這裡還有一串項鍊，便送給你吧。請戴上它吧，希望有這微薄的力量能對你有所幫助。
actors.mobs.npcs.zero.whitelingland.b_message5=這補給也許可以幫到你，希望你能喜歡。
actors.mobs.npcs.zero.whitelingland.message6=時間差不多了，我們下次見吧，%s，祝你好運……
actors.mobs.npcs.zero.whitelingland.c_message1=她已經不再理你，看起來像是睡著了……
actors.mobs.npcs.zero.whitelingland.c_message2=周圍盤旋起了水晶粒子，似乎在保護著她。
actors.mobs.npcs.zero.whitelingland.c_message3=還是不要再打擾她了吧.......
actors.mobs.npcs.zero.whitelingland.def_verb_1=願世界祝福你……
actors.mobs.npcs.zero.whitelingland.def_verb_2=你會獲得救贖嗎？

actors.buffs.status.ankhcount.name=重生限制
actors.buffs.status.ankhcount.desc=你已經被魔女詛咒，你手中的重生十字架暫時被魔女收回，只有在死亡或者擊敗魔女後才能獲得，並且所有十字架會在返還時移除祝福效果。\n\n當前十字架數量：%s

actors.buffs.status.whiteblastswordstatus.name=白浪·判決
actors.buffs.status.whiteblastswordstatus.desc=對以自身為中心造成相當於攻擊力120%%的物理傷害並使其周圍所有敵人眩暈8回合，然後給予周圍所有敵人%s層中毒。
actors.buffs.status.whiteblastswordstatus.active_skills=釋放技能

actors.mobs.npcs.hollow.slicegirl.name=幽寂
actors.mobs.npcs.hollow.slicegirl.desc=一個穿著華麗法袍的少女，她似乎在看著你，但你卻看不清她的眼神。
actors.mobs.npcs.hollow.slicegirl.message1=請稍等一下......
actors.mobs.npcs.hollow.slicegirl.message2=你是冒險家嗎?
actors.mobs.npcs.hollow.slicegirl.choice1=(點頭)
actors.mobs.npcs.hollow.slicegirl.message3=冒險家，請你務必阻止墨菲厄斯......
actors.mobs.npcs.hollow.slicegirl.message4=這座古堡可能只是他計劃的開始，沒人知道他還會做出什麼出格的事情來！
actors.mobs.npcs.hollow.slicegirl.choice2=(詢問名字)
actors.mobs.npcs.hollow.slicegirl.message5=你可以叫我幽寂，你叫我什麼都可以。
actors.mobs.npcs.hollow.slicegirl.message6=冒險家，我們得抓緊了。我的祝福會幫到你的，我會在深處等著你……

actors.buffs.status.slicedeadbless.name=幽寂祝福
actors.buffs.status.slicedeadbless.desc=和名為幽寂的少女對話後獲得的祝福，但你目前並沒有感覺有什麼用……
actors.buffs.status.slicedeadbless.desc_plus1=你感覺有一股強大的能量環繞在你周圍，離你最近的敵人將受到一次_閃電光束攻擊_，造成_%s點傷害_。
actors.buffs.status.slicedeadbless.desc_plus2=你感覺自己健步如飛……--獲得1.25倍全局移速加成。
actors.buffs.status.slicedeadbless.desc_plus3=你感覺自己力大無窮--獲得臨時力量+3
actors.buffs.status.slicedeadbless.desc_plus4=你在陷入最後的絕境時，將會獲得救贖……\n\n[？？？]
actors.buffs.status.slicedeadbless.desc_cooldown=閃電光束恢復：%s回合
actors.buffs.status.slicedeadbless.bless=當前祝福強度：%s

actors.mobs.npcs.hollow.slicealter.name=？？？
actors.mobs.npcs.hollow.slicealter.desc=在一個石製的台子上放著一塊類似人形的物品。\n\n這是用來幹什麼的?
actors.mobs.npcs.hollow.slicealter.message1=啊，冒險家，你怎麼了?
actors.mobs.npcs.hollow.slicealter.message2=頭有點暈......
actors.mobs.npcs.hollow.slicealter.message3=我們在這裡休息一下吧，看來祂的法術增強了。
actors.mobs.npcs.hollow.slicealter.message4=你沒有感覺嗎?
actors.mobs.npcs.hollow.slicealter.message5=……

custom.utils.plot.hollow.slicedogplot.message1=唉?刻耳柏洛斯怎麼在這裡?
custom.utils.plot.hollow.slicedogplot.message2=好像是在這休息呢。
custom.utils.plot.hollow.slicedogplot.message3=刻耳柏洛斯靜靜地趴在地上，好像睡著了。

### Holiday Event
custom.utils.gregorian.dwj=活動-端午節
custom.utils.gregorian.dwj_desc=端午節活動期間，地牢生成不同類型的_粽子_\n未完成過_魚人號_的玩家將會通過巨魔鐵匠前往\n\n已經完成過魚人號的玩家不會再次前往此地方\n<#299947>祝各位端午安康！玩得高興！<RGB>

custom.utils.gregorian.hween=命運之韻-古堡謎團
custom.utils.gregorian.hween_desc=地牢之外，<#F00>不祥的血月<RGB>悄然升起。並且根據曦月冒險家協會調查，地牢的深處出現了異動，協會要求各位立刻前往地牢調查！\n\n<#6E2E95>古堡活動第一階段現已開啟！祝各位玩得高興！<RGB>\n\n<#FF8400>血月期間，古堡事件開啟，肉餡餅替換為南瓜派。<RGB>\n\n古堡進入指南：\n1.每大層獵殺魂靈精英，在_4，9，14，19，23層_必定生成魂靈精英。注意如果_先前的精英未獵殺，則後面的仍會生成，但是由於漏了之前的，你的靈魂碎片類型將不夠_，那麼你的古堡先決條件就已經不滿足。\n2.背包中攜帶_五大靈魂碎片_，前往24層神秘房間共鳴碎片後即可前往古堡。\n\n古堡進階指南：\n_-_ 至少完成一次冥河結局，即可在27層發現隱藏道路，前往開啟，進入古堡第二階段故事

custom.utils.gregorian.none=魔綾活動板
custom.utils.gregorian.none_desc=當前無任何活動區間，或你在啟動遊戲時網路出現故障。\n\n如果是第二類情況，請你開啟遊戲前保持網路暢通，以獲取最新活動數據。
custom.utils.gregorian.remaining_days=剩餘天數: %s日
custom.utils.gregorian.remaining_full=%s小時 %s分鐘 %s秒

custom.utils.gregorian.dev_birthday=綾的生日慶典
custom.utils.gregorian.dev_birthday_desc=感謝大家支持《魔綾像素地牢》！\n\n綾的生日活動期間，開局隨機贈1個有益藏品、2瓶核子可樂與1個祝福重生十字架。\n\n旅館NPC「澪」固定生成，Boss鈷幣掉落翻倍。

custom.utils.gregorian.cyj=活動-重陽節
custom.utils.gregorian.cyj_desc=活動還未載入……

custom.utils.gregorian.mej=特別委託-晚宴邀請
custom.utils.gregorian.mej_desc=在新版本使用_敕靈天女_擊敗矮人將軍後。\n\n可獲得限定皮膚：_晚宴邀請_服裝。\n\n活動結束後，需在下個版本更新後以_1500鈷幣_購買。


custom.utils.gregorian.gqj=活動-國慶節
custom.utils.gregorian.gqj_desc=<#ffff00>錦繡山河披盛裝，萬家燈火映輝煌；共祝華夏永昌盛，國泰民安歲月長！<RGB>\n\n國慶節期間，常規0層生成2個盲盒+一個根骨秘藥。\n\n並且在非_縮產節食_挑戰下，食物恢復的飽腹度+30點。\n\n<#f00> 以我初心敬黨心，以我奮鬥敬時代。致敬偉大祖國，生日快樂！<RGB>

custom.utils.gregorian.zqj=活動-中秋節
custom.utils.gregorian.zqj_desc=<#ffff00>皓月當空灑清輝，中秋良宵念摯心。祝願佳節多好運，月圓人圓事事圓。<RGB>\n\n中秋期間，悲傷幽靈特別任務生成，完成後獲得限定徽章。

custom.utils.gregorian.cj=五載同行，共赴新程
custom.utils.gregorian.cj_desc=五年攜手相伴，我們並肩走過風雨與榮光；新征程已啟，願繼續同心同行，奔赴更美好的未來。\n\n五周年慶典期間將有以下效果：\n_-_ 法伊娜新年特別劇情\n_-_ 擊敗Boss的鈷幣將雙倍掉落\n_-_ 清蒸荷葉魚替換肉餡餅生成\n_-_ 桃源祈願活動復刻，低於13挑時，地牢內有55%機率生成桃園祈願間

custom.utils.gregorian.pqj=復刻-桃源祈願
custom.utils.gregorian.pqj_desc=地牢深處將55%機率生成 「桃源祈願間」 \n\n通過支付鈷幣，獲得獎勵，為你的冒險添燈加彩！！！

custom.utils.gregorian.yx=歡天喜地鬧元宵-預載
custom.utils.gregorian.yx_desc=活動下個版本載入

custom.utils.gregorian.qmj=春鸞夢語-探尋新生
custom.utils.gregorian.qmj_desc=節日的氛圍散去了，一切回歸日常。對地牢的調查仍未結束，更多謎團尚未解開……\n\n_-_ 神秘怪物回歸，每層有機率生成，擊敗後獲得特殊補給\n_-_ 獻祭房的裝備保底+1\n_-_ 肉餡餅將被替換為清明特殊食物青丸\n_-_ 商人將售賣 復活節蛋，開封後獲得隨機補給/隨機怪物/隨機精英Buff\n\n夢醒時分，她尚未遠去……

custom.utils.gregorian.no_activity=無活動
custom.utils.gregorian.end_activity=活動已結束

actors.buffs.championenemy$deadsoulcrack.name=魂靈精英
actors.buffs.championenemy$deadsoulcrack.desc=魂靈精英死亡時掉落靈魂碎片，且免疫所有氣體。

actors.mobs.npcs.hollow.cerbussleep.name=睡著的刻耳柏洛斯
actors.mobs.npcs.hollow.cerbussleep.desc=一隻大狗正在這裡熟睡，安全起見，建議還是不要去打擾它……
actors.mobs.npcs.hollow.cerbussleep.sleep=刻耳柏洛斯靜靜地趴在地上，好像睡著了。
actors.mobs.npcs.hollow.cerbussleep.touch_good=你輕輕地撫摸著刻耳柏洛斯，毛髮很暖和，刻耳柏洛斯似乎沒什麼反應。
actors.mobs.npcs.hollow.cerbussleep.touch_dog=刻耳柏洛斯好像有些生氣了......

actors.mobs.hollow.minigame.ghost_anger.name=紅色幽靈
actors.mobs.hollow.minigame.ghost_anger.desc=在迷宮中巡邏，會一直鎖定對這裡有威脅的你！

actors.mobs.hollow.minigame.ghost_pink.name=粉色幽靈
actors.mobs.hollow.minigame.ghost_pink.desc=在迷宮中巡邏，喜歡和其他幽靈結伴同行。

actors.mobs.hollow.minigame.ghost_smart.name=橙色幽靈
actors.mobs.hollow.minigame.ghost_smart.desc=在迷宮中巡邏，很難猜到下一步它如何行動。好在它偶爾與其他幽靈同行。

actors.mobs.hollow.minigame.ghost_junko.name=青色幽靈
actors.mobs.hollow.minigame.ghost_junko.desc=在迷宮中巡邏，十分的聰明，偶爾還會和紅色幽靈從不同方向包圍入侵者。

levels.hollow.moveboxhollowactorlevel$box.name=箱子
levels.hollow.moveboxhollowactorlevel$box.desc=可以推向直線任意位置的一個箱子，致敬推箱子遊戲。

levels.rooms.hollow.locked.goldmobsroom$guard.name=豺狼巡捕
levels.rooms.hollow.locked.goldmobsroom$guard.desc=在自己的寶藏領地巡邏。如果被它發現，你將陷入一場惡戰。

actors.mobs.hollow.allsearch.shadowhunstman.name=影子獵人
actors.mobs.hollow.allsearch.shadowhunstman.desc=已經完全失去理智的獵人，可以持續恢復生命。受到非魔法傷害時，將反射本次傷害的20%給敵人。很難想像會有這樣的怪物存在於這裡。

levels.rooms.hollow.utils.mobsutilsroom$redgolem.name=血紅魔像
levels.rooms.hollow.utils.mobsutilsroom$redgolem.desc=血紅魔像組長是矮人精英們試圖利用魔法的新應用彌補機械設備長久以來的缺陷的產物。它們雖不似DM-300那樣龐大笨重，但仍具有不可小覷的破壞力。\n\n烈焰魔像組長和普通魔像不同，它因為更加靈活且矮小，能通過門，而且矮人給它注入的魔法可以附加火和毒的力量。\n\n不過它的本體相當脆弱，這應該是它沒有被量產的根本原因。

levels.rooms.hollow.utils.mobsutilsroom$redsnake.name=血紅巨蛇
levels.rooms.hollow.utils.mobsutilsroom$redsnake.desc=曾經是下水道的精英生物，因為掌握極其強大的麻痺魔法，被派到這裡來維持秩序。\n\n犧牲了自身的閃避，換來了極高的血量和發射魔彈有機率導致釋放麻痺氣體。

levels.rooms.hollow.utils.mobsutilsroom$redtorchhuntsman.name=血紅賞金獵人組長
levels.rooms.hollow.utils.mobsutilsroom$redtorchhuntsman.desc=這些賞金獵人曾經想來到這個地牢終結最終的黑暗，沒想到現在卻被地牢暗處的黑暗魔力給腐蝕。現在他們毫無神志，這些生物遊蕩在監獄附近，等待下一個來到這個地牢的可憐人。\n\n他們身經百戰，因此更加危險，務必小心！

levels.rooms.hollow.utils.mobsutilsroom$redmagicshieldman.name=血紅魔盾獵人組長
levels.rooms.hollow.utils.mobsutilsroom$redmagicshieldman.desc=曾經去過_水晶之城_的他們，現在已經完全墮入瘋狂。\n\n他們的唯一願望就是:阻止任何一個前進的_冒險者_\n\n受此地區環境影響，它變得更加瘋狂，變得_更加健壯且具有威脅_，並且<#f00>敵我不分<RGB>！
levels.rooms.hollow.utils.mobsutilsroom$redmagicshieldman$deadsora.name=狂暴
levels.rooms.hollow.utils.mobsutilsroom$redmagicshieldman$deadsora.desc=這個獵人組長的死亡已經不可避免，但他想拉你作為陪葬品！\n\n時間的推移或是外界的傷害都會消磨護盾。在護盾消散殆盡之際，他徹底消亡。然而，一定要小心，在這一階段獵人轉變為_四連擊_且有敵人倒下時_可延續狂暴時間_！\n\n剩餘的護盾：%d。

levels.hollow.allsearchhollowactorlevel$recordtimedead.name=隱秘行動
levels.hollow.allsearchhollowactorlevel$recordtimedead.desc=我們即將開始行動，再次確認行動目標。\n\n獵殺敵人，獲取獎勵，務必邊打邊搜，最後盡快安全撤離！\n\n牢記以下事項，交戰搜索，搞定就撤！\n\n距離被敵軍總部發現還有：%s回合。

levels.rooms.hollow.utils.mobsutilsroom$redspider.name=血紅巨型蜘蛛組長
levels.rooms.hollow.utils.mobsutilsroom$redspider.desc=紅色而多毛的巨型蜘蛛們會試著去躲避直接的戰鬥，它們更喜歡在遠處等待其獵物捲入電網，在劇毒中慢慢死去。它們也能向遠處噴吐電網，讓其中的敵人被電的酥脆。

levels.rooms.hollow.utils.mobsutilsroom$redshaman.name=血紅薩滿長老組長
levels.rooms.hollow.utils.mobsutilsroom$redshaman.desc==豺狼家族最年長的豺狼，你光看著這個血紅的骷髏頭就知道這東西並不好惹。它相當具有威脅，盡量不要去招惹它！

actors.buffs.status.scoreminigame.name=劇院演出計分板
actors.buffs.status.scoreminigame.desc=演出現在正式開始，你是否能完成這場盛大的演出？
actors.buffs.status.scoreminigame.socre=第一幕-吃豆人--演出得分：%s-_%s級_\n\n第二幕-推箱子--演出得分：%s-_%s級_\n\n第三幕-全面搜查--演出得分：%s-_%s級_\n\n演出綜合評估等級：_%s級_\n\n註：每幕演出的最終得分在演出結束後自動計入。

windows.winallsearchstatus.fail=全面搜查-撤離失敗
windows.winallsearchstatus.success=全面搜查-撤離成功
windows.winallsearchstatus.timeout=全面搜查-行動超時
windows.winallsearchstatus.score=全面搜查得分：%s分\n\n所有價值物品：%s個\n\n拾取低價值物品：%s個\n\n拾取中價值物品：%s個\n\n拾取高價值物品：%s個
windows.winallsearchstatus.quest=提交得分，進入最終評估

levels.hollow.allsearchhollowactorlevel$pinkprism$1.name=啟用傳送法陣核心？
levels.hollow.allsearchhollowactorlevel$pinkprism$1.quest_start_prompt=一旦你啟用了傳送法陣核心，敵人將會兵臨城下。\n\n你需要防守好撤離點，一旦你_距離傳送法陣核心超過5格_，傳送法陣核心將自動關閉。_你將需要重新啟用傳送法陣基點！！！_
levels.hollow.allsearchhollowactorlevel$pinkprism$1.enter_yes=立即啟用
levels.hollow.allsearchhollowactorlevel$pinkprism$1.enter_no=暫不啟用

actors.buffs.status.activepoint.name=傳送法陣基點狀態
actors.buffs.status.activepoint.desc=需要啟用兩個傳送法陣基點，方可前往撤離區進行防守然後成功撤離，啟用2個後，請在200回合內抵達撤離法陣。\n\n已啟用的法陣：%s個\n\n已啟用後的超時回合：%s回合。

actors.mobs.hollow.allsearch.helpteleportpoint$1.name=啟用此傳送法陣基點？
actors.mobs.hollow.allsearch.helpteleportpoint$1.quest_start_prompt=你每個傳送基點_至多啟用兩次_，並且需要<#FFA500>啟用A/B傳送法陣<RGB>基點。才能啟用撤離的傳送法陣據點，然後前往最終撤離點防守。\n\n但要注意，啟用傳送法陣將會造成警報，將會吸引敵人，確實要啟用撤離點嗎？\n\n_法陣基點已啟用次數：%s次_ 超過2次將無法啟用
