actors.buffs.status.magicabsorb.name=魔力汲取計算機
actors.buffs.status.magicabsorb.desc=魔力汲取中介效果計數，開發模式測試，正式效果不會顯示該Buff。\n\n距離效果觸發還有：%s 回合。

### OLD BATTLEMAGE
actors.hero.herosubclass.oldbattlemage=戰鬥巫女
actors.hero.herosubclass.oldbattlemage_desc=戰鬥巫女使用魔杖近戰時會附帶類似附魔的額外效果，效果取決於魔杖所灌注的法杖種類，每種法杖各不相同。用魔杖近戰打擊還會為其恢復0.5點充能。
actors.hero.herosubclass.oldbattlemage_short_desc=_戰鬥巫女_在使用魔杖近戰攻擊時會附帶額外的法術效果。這些效果取決於魔杖內灌注的法杖種類。

actors.hero.talent.repower_attack.title=蓄能打擊
actors.hero.talent.repower_attack.desc=_+1：_戰鬥巫女使用魔杖施法後，魔杖的首次近戰攻擊將造成_16%額外傷害_，且額外效果具有_50%強度提升_。\n\n_+2：_戰鬥巫女使用魔杖施法後，魔杖的首次近戰攻擊將造成_33%額外傷害_，且額外效果具有_100%強度提升_。\n\n_+3：_戰鬥巫女使用魔杖施法後，魔杖的首次近戰攻擊將造成_50%額外傷害_，且額外效果具有_150%強度提升_。

actors.hero.talent.charge_magic.title=充能秘術
actors.hero.talent.charge_magic.desc=_+1：_當戰鬥巫女用魔杖近戰擊中敵人時，會獲得相當於_0.5回合_的神器充能效果。\n\n_+2：_當戰鬥巫女用魔杖近戰擊中敵人時，會獲得相當於_1回合_的神器充能效果。\n\n_+3：_當戰鬥巫女用魔杖近戰擊中敵人時，會獲得相當於_1.5回合_的神器充能效果。

actors.hero.talent.shielding_block.title=盈能屏障
actors.hero.talent.shielding_block.desc=_+1：_戰鬥巫女的魔杖滿充能時，其上的每級升級都會在他下一次使用魔杖施法時使自身獲得_0.67點護盾_。\n\n_+2：_戰鬥巫女的魔杖滿充能時，其上的每級升級都會在他下一次使用魔杖施法時使自身獲得_1.33點護盾_。\n\n_+3：_戰鬥巫女的魔杖滿充能時，其上的每級升級都會在他下一次使用魔杖施法時使自身獲得_2點護盾_。

### RARE MOBS
actors.mobs.rare.giantflowerslime.name=巨型繁花史萊姆
actors.mobs.rare.giantflowerslime.desc=相對來說比較稀有的繁花史萊姆，因為體型更大導致粘上了更多的植物和種子，並因此導致攻擊可能會產生植物的效果。

actors.mobs.rare.newborncrab.name=新生螃蟹
actors.mobs.rare.newborncrab.desc=叢林螃蟹的青年體，甲殼還未發育成熟，因此防禦會更脆弱，但是速度會更快，動作會更靈活。

actors.mobs.rare.dm111.name=dm-111
actors.mobs.rare.dm111.desc=dm100的加強版本，其實是第一版加強，但是第二版已經叫dm200了，擁有更強的火力，更厚重的裝甲，並且可以蓄力放電制服犯人，但是引擎沒有跟上，所以移動速度會更慢。
actors.mobs.rare.dm111.zap_kill=閃電球將你徹底擊殺…

actors.mobs.rare.guardcapital.name=獄卒小隊長
actors.mobs.rare.guardcapital.desc=作為獄卒的小頭領，相比其他獄卒更加強壯，但不使用鎖鏈將犯人拉近而是更習慣將犯人擊退或配合其他獄卒遠程攻擊。

actors.mobs.rare.verycoldrat.name=極寒冰鼠
actors.mobs.rare.verycoldrat.desc=長期的寒冷環境與冰系魔力導致其體內魔力狂暴而又非常不穩定，切記小心。
actors.mobs.rare.verycoldrat.bomb=周圍的空氣開始迅速凝結，可能有什麼事情要發生了。

actors.mobs.rare.bloodsswarm.name=血紅蠅群
actors.mobs.rare.bloodsswarm.desc=因為過於寒冷導致血紅蒼蠅依靠擠一起取暖，一起行動，攻擊會導致它們分裂開，非常危險。

actors.mobs.rare.ghoulplus.name=矮人屍山
actors.mobs.rare.ghoulplus.desc=矮人屍群擁有可以源源不斷戰鬥的能力，但是魔法總是不那麼可靠，所以他們在恢復的時候粘到一起了，並且在不停的吸收其他的屍群。

actors.mobs.rare.warlockhead.name=矮人首席術士
actors.mobs.rare.warlockhead.desc=矮人術士是矮人中的掌權者，而這位更是術士的領導者，他對黑暗魔法的掌握遠超其他術士，可以對目標造成更加嚴重的影響。

actors.mobs.rare.demonfodder.name=“惡魔盛宴”
actors.mobs.rare.demonfodder.desc=惡魔世界中非原生的存在，天生比正常的惡魔弱小。透過被其他的惡魔蠶食，它會成為強大惡魔的一部分。
actors.mobs.rare.demonfodder.leap=“惡魔盛宴”正在準備撲殺……

actors.mobs.rare.spawnevil.name=惡孽血巢
actors.mobs.rare.spawnevil.desc=這一團矮人血肉比其他血巢更加活躍，濃厚的血氣和死氣正是惡魔們最好的食糧。
actors.mobs.rare.spawnevil.on_death=此處的惡魔能量似乎隨著血巢的毀滅而有所減弱。

actors.mobs.rare.deadeye.name=毀滅魔眼
actors.mobs.rare.deadeye.desc=魔眼是一種邪眼的變體，擁有和邪眼一樣的能力，但是比邪眼更容易發現敵人，其的死亡凝視比邪眼更具破壞性，也許你不應該和他硬碰硬
actors.mobs.rare.deadeye.disintegrate=毀滅魔眼的死亡凝視摧毀了你的：
actors.mobs.rare.deadeye.and=和
actors.mobs.rare.deadeye.deathgaze_kill=死亡凝視奪取了你的生命…




### Kuzimi
actors.mobs.npcs.hiro.name=久住
actors.mobs.npcs.hiro.desc=為重點懲戒對象單獨關押的囚犯，原先是時間魔女，現已被卸除魔女之名。來自翼綾的枷鎖讓她如今無法大量動用魔力，連離開這裡都是天方夜譚。
actors.mobs.npcs.hiro.hello=你好啊，%s。
actors.mobs.npcs.hiro.talk_hello=初次見面，我先自我介紹一下吧，我叫久住，算是這所監獄的重點關照對象。
actors.mobs.npcs.hiro.talk_hello_no=這是我們的第%s次見面了。不需要我再做自我介紹了吧？

actors.mobs.npcs.hiro.talk_ano_1=請不要如此戒備，我沒有惡意。我有一筆交易想和你談談，要聽聽嗎？
actors.mobs.npcs.hiro.talk_ano_2=如果你在地牢外遇見了沅汐，請告訴她，我早已過世了……作為交換，我會為你的旅途提供一些幫助。
actors.mobs.npcs.hiro.talk_ano_3=……你是同意了嗎？
actors.mobs.npcs.hiro.talk_ano_4=十分感謝……如我所言，這是給你的謝禮。
actors.mobs.npcs.hiro.talk_ano_5=當然，我們的交易還會繼續。帶它一起去吧。

actors.mobs.npcs.hiro.talk_cno_1=祝一路平安……
actors.mobs.npcs.hiro.talk_cno_2=請一定要活著離開地牢。

actors.mobs.npcs.hiro.talk_btk_1=謝謝你……
actors.mobs.npcs.hiro.talk_btk_2=這朵花真的很漂亮，就和原先的那朵一樣。
actors.mobs.npcs.hiro.talk_btk_3=該說你身上有沅汐的影子嗎…？

actors.mobs.npcs.hiro.talk_btk_4=不，我能察覺到，你身上的某些東西似乎發生了永遠的改變。
actors.mobs.npcs.hiro.talk_btk_5=也許你自己也沒有意識到這一點。你若想要看看你的過去，就把那面具交給我吧。

actors.mobs.npcs.hiro.talk_hiro=與此同時，久住握住了你的手，你感覺一股暖流流向了時之花……

actors.mobs.npcs.hiro.talk_ctk_1=這是一個重大的選擇呢……希望你不會後悔。

actors.mobs.npcs.hiro.quest_start_prompt=要探尋你的過去嗎？
actors.mobs.npcs.hiro.enter_yes=是
actors.mobs.npcs.hiro.enter_no=否

actors.mobs.npcs.hiro.def_verb=
actors.mobs.npcs.hiro.def_verb_3=你的行為沒什麼必要。

actors.buffs.hunger$hungerstats.name=飢餓
actors.buffs.hunger$hungerstats.desc=你能感受到自己的肚子在不斷尋求食物，不過還不算那麼嚴重。\n\n飢餓會在你在地牢裡花費時間的同時緩慢累計，直到你餓得難以忍受。在你極度飢餓時生命值會停止回復並且開始緩慢減少 。\n\n合理利用食物非常重要！如果你有足夠的生命值來維持飢餓，你就該等到一會食物更多的時候再吃。正確的配給可以讓食物更有效地發揮作用！

actors.buffs.hunger$starvingstats.name=極度飢餓
actors.buffs.hunger$starvingstats.desc=你的飢餓程度已經危及生命了。\n\n飢餓會在你在地牢裡花費時間的同時緩慢累計，直到你餓得難以忍受。在你極度飢餓時生命值會停止回復並且開始緩慢減少 。\n\n合理利用食物非常重要！如果你有足夠的生命值來維持飢餓，你就該等到一會食物更多的時候再吃。正確的配給可以讓食物更有效地發揮作用！

actors.buffs.allybuff.name=無法結盟

actors.buffs.sleep.name=沉睡
actors.blobs.corrosivegas.name=酸蝕氣體
actors.blobs.confusiongas.name=暈眩氣體
actors.blobs.toxicgas.name=毒氣氣體
actors.blobs.brokenarmorfire.name=無用之盾氣體




### 五周年
actors.mobs.npcs.zero.fiveyears.mintcat.name=薄綠
actors.mobs.npcs.zero.fiveyears.mintcat.desc=薄綠喜歡躲在自己的秘密基地安靜地讀書，也喜歡和朋友們一起玩鬧，她喜歡爬樹，喜歡冒險，喜歡所有新奇而有趣的東西。\n她會小步小步地跟隨在信任的人身後，也會突然被其他東西吸引，蹦蹦跳跳地離開。\n如果收到了來自女孩的小禮物，就算只是一塊其貌不揚還沾著泥土的礦石，也請收下吧，那一定都是她很喜歡的東西，無論如何都想要與你分享。\n\n春節時期，她換上了融入中華韻味的盛裝，舉著 “大吉” 橫幅蹦蹦跳跳地湊到你面前，要把一整年的好運都送給你。
actors.mobs.npcs.zero.mint.message1_ny=新年快樂，%s。
actors.mobs.npcs.zero.mint.message2_ny=地牢裡危機重重，不要踩到陷阱或是掉進坑裡哦~
actors.mobs.npcs.zero.mint.message3_ny=這是我的一點心意，祝你一路順風。欸，我怎麼會知道你的名字？這是秘密哦~~

actors.mobs.npcs.zero.fiveyears.sdragonblue.name=小藍
actors.mobs.npcs.zero.fiveyears.sdragonblue.desc=一位藍髮的一位小龍女，新年還換上了一套紅衣服，一定是未來的龍皇吧？
actors.mobs.npcs.zero.fiveyears.sdragonblue.messages1=新的一年年裡記得好好吃飯呀……
actors.mobs.npcs.zero.fiveyears.sdragonblue.messages2=沒人聊天呢……有人說話也挺好的
actors.mobs.npcs.zero.fiveyears.sdragonblue.messages3=記得活著回來呀……

actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.name=曉夢
actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.desc=一位來自未知世界的訪客……
actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.messages1=從某種意義來說…年獸可能也是神仙？
actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.messages2=我應該找個機會去把那大眼珠子炸了，但是泡泡在這裡我有點慫…
actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.messages3=好吧，開個玩笑，新年快樂！
actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.messages4=其他人怎麼還不過來，再不過來我要吃完了（｡ò ∀ ó｡）

actors.mobs.npcs.zero.fiveyears.mengdongxynewyears.name=孟冬下元
actors.mobs.npcs.zero.fiveyears.mengdongxynewyears.desc=一位斗篷下的神秘人，似乎在說地牢決鬥的事情……
actors.mobs.npcs.zero.fiveyears.mengdongxynewyears.messages1=新年好啊朋友，這是給你的，新春卡包。
actors.mobs.npcs.zero.fiveyears.mengdongxynewyears.messages2=有抽到什麼高罕卡嗎，有空來打牌啊。
actors.mobs.npcs.zero.fiveyears.mengdongxynewyears.messages3=這道魔法烤綿羊味道不錯，再撒點烈焰花粉就更好了。

actors.mobs.npcs.zero.fiveyears.slylnewyears.name=冷
actors.mobs.npcs.zero.fiveyears.slylnewyears.desc=沒有人知道她的身份，她總是對即將前往聖境密林的冒險者默默注視著……
actors.mobs.npcs.zero.fiveyears.slylnewyears.messages1=歌一曲，酒一觴，邀君醉瓊漿，東風盈暖房。
actors.mobs.npcs.zero.fiveyears.slylnewyears.messages2=長空穹宇飛玉屑，千樹黃金縷，萬里起福燈。
actors.mobs.npcs.zero.fiveyears.slylnewyears.messages3=金龍潛翔祥雲瑞，霧隱星河燈火明。
actors.mobs.npcs.zero.fiveyears.slylnewyears.messages4=瑞雪映門闕，華章待奏鳴，祈年豐殷駐春風。

actors.mobs.npcs.zero.fiveyears.deepseanewyears.name=深海
actors.mobs.npcs.zero.fiveyears.deepseanewyears.desc=原本該出現在海邊的傢伙，此刻正在參加一場晚會，靠近後會聽到她嘀嘀咕咕的抱怨餐桌上怎麼沒有大餅。
actors.mobs.npcs.zero.fiveyears.deepseanewyears.messages1=新年快樂～\n\n雜魚醬，新的一年有沒有長進吶？這份‘險境求生餅’送給你，我曾經在海裡迷路時靠它撐了三天，嘛，希望你不會迷路啦。
actors.mobs.npcs.zero.fiveyears.deepseanewyears.messages2=吃了我的餅，就算是我罩的了。
actors.mobs.npcs.zero.fiveyears.deepseanewyears.messages3=新年別學我一直摸魚啊雜魚～
actors.mobs.npcs.zero.fiveyears.deepseanewyears.messages4=願你來年的旅途...有趣到讓我也想跟著去瞧瞧。

actors.mobs.npcs.zero.fiveyears.luowhitenewyears.name=落白
actors.mobs.npcs.zero.fiveyears.luowhitenewyears.desc=透過橙色的凌空大盾，是那位頭上長角的收藏家，他怎麼跑旅館裡賣武器來了？
actors.mobs.npcs.zero.fiveyears.luowhitenewyears.messages1=新年又見雪飛花，瑞雪再兆豐收年，今年的佳餚格外美味呢。
actors.mobs.npcs.zero.fiveyears.luowhitenewyears.messages2=萬家燈火通明，邀你我共賞華燈盛放。
actors.mobs.npcs.zero.fiveyears.luowhitenewyears.messages3=這個你收好，傳說可以破財消災，辟邪懲惡。
actors.mobs.npcs.zero.fiveyears.luowhitenewyears$lfroad.name=燈火通明
actors.mobs.npcs.zero.fiveyears.luowhitenewyears$lfroad.desc=做工精美的方形燈籠，點亮它便能探明前路。

actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.name=蓮娜
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.desc=理所當然地，她和地牢內的“蓮娜”一模一樣，並且知道你搶劫的事實，讓你十分心虛。好在她是真實的蓮娜，且接受了你的幫助，看起來不像要找你算帳。\n\n新年的到來，也讓她放下手頭上的瑣事，親自駕臨雪景小鎮，來和妹妹短暫團聚。
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages1=喲，這不是這幾年總在商店裡零元購的%s嘛。
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages2=今天是喜慶的日子，你先前所做的那些事，目前就先按下不表了。
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages3=當然，是你的出現，讓我和妹妹得以掙脫無解的宿命。也正因如此，我才能在這裡，與妹妹好好團聚。
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages4=其實我們還有一位大姐，只是她遠在幽深的深海之中，或許有一天你可以見到她……
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages5=雖然我們現在並非敵對關係，但我在地牢之內的映象對你未必友好，小心點囉。
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages6=新年快樂，%s。我還要和妹妹多說說話，就不打擾你啦。

actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.name=冬鈴
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.desc=通過你的幫助，“冰雪魔女”得以從黑魔法的腐蝕中脫出，她的正身也與你成為了朋友。新年的到來，也讓她和姐姐得以放下手頭上的瑣事短暫團聚。
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages1=我曾為了執念深入地牢，這意念驅使著我放下人性，步入混沌……
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages2=也正因如此，我落入了祂的圈套，淪為任憑擺布的傀儡。
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages3=多謝你將我從迷夢中喚醒，也多謝你助力我的姐姐在無止輪迴中尋回自我。
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages4=我在意識完全喪失之前，將我的經歷以日記的形式寫作了一本書。似乎，如今它已經廣為流傳了。
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages5=你可能看過了，不過還是給你一本吧。這本書對於你破解地牢的謎團或許有所幫助。
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages6=對了，還有一個不情之請——我們的大姐，現在正在深海，和我們失聯許久了，如果你能找到她的話，請告訴我她的近況，順便告訴她，我們一切安好……
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages7=說的有點多了吧，不浪費你太多時間了，把這些東西拿上吧。祝你新年快樂哦，%s。

actors.mobs.npcs.zero.fiveyears.yuyenewyears.name=雨夜
actors.mobs.npcs.zero.fiveyears.yuyenewyears.desc=穿著一披藍色斗篷的怪人，斗篷之下會是什麼呢？
actors.mobs.npcs.zero.fiveyears.yuyenewyears.messages1=我們都是城市的河流。\n我們孤獨，但在同一個時代，匯流向海。
actors.mobs.npcs.zero.fiveyears.yuyenewyears.messages2=很多年後，我們都將再一次回到這裡。只是那時候我已不再是我，你也不再是你。\n珍惜當下吧；珍惜這個值得期待的過去的未來，也珍惜這個值得回憶的未來的過去。
actors.mobs.npcs.zero.fiveyears.yuyenewyears.messages3=願時間自有溫柔的雙手，庇佑你，迷途的旅人。

actors.mobs.npcs.zero.fiveyears.nyznewyears.name=奈亞子
actors.mobs.npcs.zero.fiveyears.nyznewyears.desc=自翼綾事件後就一直在地牢調查的商人。主要售賣炸彈產品和一些神秘的書。
actors.mobs.npcs.zero.fiveyears.nyznewyears.messages1=年新樂快！！！
actors.mobs.npcs.zero.fiveyears.nyznewyears.messages2=“嗨呀！從混沌虛空給你的‘新春祝福’哦～”
actors.mobs.npcs.zero.fiveyears.nyznewyears.messages3=新年快樂，你知道嗎？ling或許患上戀咕癖，所以古堡才....無法回答

actors.mobs.npcs.zero.fiveyears.mooncatnewyears.name=月華
actors.mobs.npcs.zero.fiveyears.mooncatnewyears.desc=這是一個外貌似貓的人形生物，通體光滑雪白。據傳聞稱其曾經是盾衛或廢品商人之類的，不過他看起來什麼也沒帶。
actors.mobs.npcs.zero.fiveyears.mooncatnewyears.messages1=又一年過去了，雖然我還是貓人。
actors.mobs.npcs.zero.fiveyears.mooncatnewyears.messages2=這個拿著，就當是我給你的小小禮物，不過它可能不太聽話。
actors.mobs.npcs.zero.fiveyears.mooncatnewyears.messages3=我在尋找能讓我變回去的方法……
actors.mobs.npcs.zero.fiveyears.mooncatnewyears.messages4=新年快樂，祝你不會被什麼獸化怪物咬。

actors.mobs.npcs.zero.fiveyears.gudazinewyears.name=古達子
actors.mobs.npcs.zero.fiveyears.gudazinewyears.desc=來自異邦的英雄，不遠萬里從羅德爾的迦勒底來到此處，不知道祂是否要在這裡尋找些什麼。
actors.mobs.npcs.zero.fiveyears.gudazinewyears.messages1=新年好啊冒險家！多虧了你們我今年收到的金幣比去年更多了。
actors.mobs.npcs.zero.fiveyears.gudazinewyears.messages2=不過這地方也沒銀行什麼的我就只能堆在這裡了還好小鎮沒有小偷……
actors.mobs.npcs.zero.fiveyears.gudazinewyears.messages3=啊對了冒險家為了感謝些日子你對我的照顧你就從這堆金幣裡面拿一些走吧，就當是新年紅包了。
actors.mobs.npcs.zero.fiveyears.gudazinewyears.messages4=那麼再見了希望新的一年你還是能來多多資助我，這樣我就能換更多衣服了……（小聲）

actors.mobs.npcs.zero.fiveyears.sheepnewyears.name=魔法綿羊
actors.mobs.npcs.zero.fiveyears.sheepnewyears.desc=這是一隻魔法綿羊。為什麼叫它魔法綿羊？因為你殺不死它。它會做的事情只有邊反芻邊對你翻白眼。
actors.mobs.npcs.zero.fiveyears.sheepnewyears.messages1=祝你新年快樂咩，也祝你新年不被綿羊卡住咩，我的羊毛裡有一個東西你可以拿走咩。
actors.mobs.npcs.zero.fiveyears.sheepnewyears.messages2=咩咩咩咩咩?
actors.mobs.npcs.zero.fiveyears.sheepnewyears.messages3=咩～再次祝你新年快樂哦～

actors.mobs.npcs.zero.fiveyears.zakoflowernewyears.name=喵音·椛
actors.mobs.npcs.zero.fiveyears.zakoflowernewyears.desc=一隻可愛的的天狗少女，蘿蔔地牢群的群寵之一，在這個地牢的任務是給大家提供飯菜(雖然不免費)。走過路過就嘗一嘗吧。\n\n對了，不要叫她雜魚醬哦。小心她生氣哦。
actors.mobs.npcs.zero.fiveyears.zakoflowernewyears.messages1=燃燭提筆祝語，祈求魔綾永固。
actors.mobs.npcs.zero.fiveyears.zakoflowernewyears.messages2=來，吃了這個餅吧，祝你馬到成功哦！
actors.mobs.npcs.zero.fiveyears.zakoflowernewyears.messages3=什麼！本咕不是胖，本咕是大胃袋。


actors.mobs.npcs.zero.fiveyears.smallleafnewyears.name=小葉
actors.mobs.npcs.zero.fiveyears.smallleafnewyears.desc=地上世界名氣最大的探險家之一，據說她探秘過不少恐怖的地牢並安全生還，還有實際上是某小世界創世之神的謠言……不過你並未看出這位少女的非人之處。
actors.mobs.npcs.zero.fiveyears.smallleafnewyears.message1=又是一年春來到，看來得送你點實在的東西。
actors.mobs.npcs.zero.fiveyears.smallleafnewyears.message2=這世界上還有許多地牢等著你。

actors.mobs.npcs.zero.fiveyears.qinlinewyears.name=琴里
actors.mobs.npcs.zero.fiveyears.qinlinewyears.desc=氣流在這位少女周圍有規則的湧動起來，清風總讓人感到舒適和和煦，這也是她帶給你的直觀感受。
actors.mobs.npcs.zero.fiveyears.qinlinewyears.messages1=新年大吉事事如意，征途平安鬼怪見愁。
actors.mobs.npcs.zero.fiveyears.qinlinewyears.messages2=送你武器尋訪憑證，抽個卡看看實力。

actors.mobs.npcs.zero.fiveyears.moruosnewyears.name=摩諾絲
actors.mobs.npcs.zero.fiveyears.moruosnewyears.desc=雪景旅館的老闆娘，據說她見過了無數的冒險者來到這地牢，他們大多一去不返，但也有些能榮耀般歸來……
actors.mobs.npcs.zero.fiveyears.moruosnewyears.messages1=%s，歡迎來到雪景旅館，我是這裡的老闆娘。
actors.mobs.npcs.zero.fiveyears.moruosnewyears.messages2=近期這裡正在舉辦宴會，和他們聊聊吧。
actors.mobs.npcs.zero.fiveyears.moruosnewyears.messages3=當然，新的一年，我也有一份禮物給你。
actors.mobs.npcs.zero.fiveyears.moruosnewyears.messages4=感覺累了的話，可以前往2樓休息一下哦。
actors.mobs.npcs.zero.fiveyears.moruosnewyears.messages5=祝你能在新的一年探索到更多秘密，當然，這裡永遠會是屬於你的“安全屋”。

actors.mobs.npcs.zero.fiveyears.obsirnewyears.name=ZIOM-Observe-sir
actors.mobs.npcs.zero.fiveyears.obsirnewyears.desc=穿著黑西裝的神秘人，頭上戴著有各種顏色的帽子，而且他的樣子的皮膚根本不像人類。\n據說他跟"奸商"有一些有趣的事情。\n這人本身就不存在這個世界，但究竟為什麼會在這裡始終是個謎。\n\n死亡並非終點。
actors.mobs.npcs.zero.fiveyears.obsirnewyears.messages1=新年好朋友，有沒有拿炸彈去炸怪了?如果沒有我這剛好有一個“爆竹”。
actors.mobs.npcs.zero.fiveyears.obsirnewyears.messages2=果然即使過年了我還得上班，呃啊。
actors.mobs.npcs.zero.fiveyears.obsirnewyears.messages3=我一直都在看著你....

actors.mobs.npcs.zero.fiveyears.pinklingnewyears.name = 紫澪
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.desc = 一位始終微笑著的少女。她天真活潑乃至略帶稚氣的容顏，很好的將她資深冒險家的身份隱藏了起來。她長久佇立於此，迎接一位又一位冒險家。
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.messages1 = 總算到了呢，欸，你好呀！
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.messages2 = 你說你沒見過我？昂～我是紫澪，一位冒險家。此前我一直在外調查深海相關事宜，長久未歸，現在回來雪景小鎮過年啦。
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.messages3 = 聽說你幫了冬玲和蓮娜一把？看來你不簡單嘛，這兩姐妹的忙可不好幫。(小聲)這兩位平時兇得很，一點也不好說話呢。
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.messages4 = 這邊難得這麼熱鬧，如果你不是很急的話，不妨多待一會再走吧。
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.messages5= 唔……看來你很趕啊。那好吧，新年快樂哦，祝你的地牢之旅馬到成功！

actors.mobs.npcs.zero.fiveyears.yogstsnewyears.name=泡泡
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.desc=不知為何，你隱約覺得眼前的少女和地牢最深處的存在有某種微妙的關係？不過至少現在，她看起來只是一位有些神秘的少女而已。
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.messages1=呼……人類的祝福語該怎麼說呢？新的一年，也向我展現些“有趣”的事吧？
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.messages2=根據人類的習俗，也是對你過去一年的嘉獎，這次就特許你挑選想要的新年禮物吧？是知識，賜福，還是財富呢？
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.knows=知識
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.money=賜福
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.wealth=財富
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.all=我全都要！
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.messages3=那麼，祝你好運，小傢伙，好好運用這份難得的饋贈吧。
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.messages4=太貪婪可不是好孩子哦，也許未來某天，我會因為某些原因允許你稍微貪心一點？不過不是現在呢。
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.messages5=一路順風，小傢伙。

actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.name=自動食物製作機EX
actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.desc=這台食物機經過了深度改造。現在，它不僅能夠發揮普通食物機的作用，還能夠直接製作食物。由於提供了今天的菜餚，此刻它也成為了餐桌上的一員。
actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.messages1=您所發起的請求已經被響應。正在製作中……
actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.messages2=製作已完成，請及時取走菜品。
actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.messages3=您所發起的請求未能被響應，正在進行自檢……
actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.messages4=當前無法生成食物，請耐心等待。

actors.mobs.npcs.zero.fiveyears.choconewyears.name=Choco
actors.mobs.npcs.zero.fiveyears.choconewyears.desc=這位少女看起來有些慵懶，也或許只是沒來得及打理才趕來了新春宴會，她似乎不是很適應這裡的氛圍……
actors.mobs.npcs.zero.fiveyears.choconewyears.messages1=我是choco，需要的話，可以來找我幫忙～（眨眼）

actors.mobs.npcs.zero.fiveyears.pinkfoxnewyears.name=夏漁霧溟
actors.mobs.npcs.zero.fiveyears.pinkfoxnewyears.desc=一位幻化為人型的九尾狐狸，據說掌握金蝶的魔法，可以提供金蝶法陣為你提供嬗變法則。
actors.mobs.npcs.zero.fiveyears.pinkfoxnewyears.messages1=我要去修煉了，盡快修煉成為九尾才是正事，不過我現在餓壞了等著開飯。（肚子發出咕咕的聲音）
actors.mobs.npcs.zero.fiveyears.pinkfoxnewyears.messages2=說了別打擾我，這樣，看到那個羊了嗎，去■它吧。
actors.mobs.npcs.zero.fiveyears.pinkfoxnewyears.messages3=怎麼又來，好吧，祝你新年快樂。

actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.name=淺月深白
actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.desc=永遠懶洋洋的異世訪客。他似乎已經放下過去的某個執念了。
actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.messages1=來啦來啦，主角果然是壓軸出場的嗎~
actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.messages2=欸嘿嘿，新年快樂吶。又一年過去了，時間過得真快呢。
actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.messages3=我啊，我已經不打算回去了，就這樣在這裡挺好的。
actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.messages4=哎呀今天就別想那些有的沒的了，好好享受吧~

actors.mobs.npcs.zero.fiveyears.hknewyears.name=小騎士
actors.mobs.npcs.zero.fiveyears.hknewyears.desc=來自於另一個維度的訪問者，正在旅館這裡休息……
actors.mobs.npcs.zero.fiveyears.hknewyears.messages1=咕咕嘎嘎！你看什麼，這麼多人在旁邊站著，為什麼就來找我閒聊？
actors.mobs.npcs.zero.fiveyears.hknewyears.messages2=新年了？哦，時間過得真快呀，轉眼間這顆球又繞一圈了。
actors.mobs.npcs.zero.fiveyears.hknewyears.messages3=這個給你吧，新的一年我會繼續進地牢跟你搶東西的 ╮(‵▽′)╭
actors.mobs.npcs.zero.fiveyears.hknewyears.messages4=別生氣，反正你速度也沒我快，搶不過我。

actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.name=那些回憶
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.desc=那些回憶——一位來歷神秘的地牢商人。他知曉許多年前地牢深處發生的一切真相，卻始終緘口不言。\n\n曾是仗劍天涯的俠客，如今隱於黑暗之中，為往來冒險者提供補給與物資，卻從不會提醒他們此地潛藏的致命危險。
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.messages1=新歲倏至，辭暮迎春。古堡千載，何以贈新？
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.messages2=地牢是令人很頭疼的地方，但是此時是新年，我會送你一些東西，幫助你通關。
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.messages3=你還記得我賣的神奇法杖嗎？已經是很多年前了。魔綾地牢也陪伴了大家走過了很多年。
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.messages4=“時間永遠分岔，通向無數的將來”，現實世界的你又在做什麼呢？
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears$molotovblazebrew.name=莫洛托夫烈焰特調
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears$molotovblazebrew.desc=一瓶冒著火星的琥珀色烈酒，瓶塞纏裹著浸油火絨。\n\n飲用後可獲得治療、激素湧動、極速與火焰之力加持，但酒性剛烈，飲用後會短暫頭暈目眩。

actors.mobs.npcs.zero.fiveyears.archettonewyears.name=弦
actors.mobs.npcs.zero.fiveyears.archettonewyears.desc=自稱是一名遊歷至此的旅人，不知為何，你總覺得在哪裡見過她。
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages1=%s，你好呀，唔，沒見過我？沒關係，在此之前我可是一直在看著你哦。
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages2=做個自我介紹吧，我名弦，是一名遊歷四方的旅人，如今也是剛到這座小鎮不久，很高興與你相識。
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages3=%s，你好呀，這次的地牢之旅也祝你愉快哦
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages4=嘛…別用那種眼神看著我呀，好吧好吧，給你點禮物
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages5=好像見過這個嗎？嘻嘻
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages6=nya~，祝你一帆風順哦

actors.mobs.npcs.zero.fiveyears.archettonewyears.messages7=大夢誰先覺——你來了呀，旅人
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages8=夢境照入了現實，你很驚訝嗎？這可是你的功勞呢。對了，給你這個
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages9=去和她說說話吧

actors.mobs.npcs.zero.fiveyears.archettonewyears.messages10=nya~，祝你做個好夢哦

actors.mobs.npcs.zero.fiveyears.whiteyannewyears.name=白宴
actors.mobs.npcs.zero.fiveyears.whiteyannewyears.desc=一位白髮的少女，頭髮長的可以影響運動了。看起來天真呆然的樣子，應該是十分友善的。
actors.mobs.npcs.zero.fiveyears.whiteyannewyears.messages1=新的一年又到了，不過我怎麼感覺過了兩個年一樣，就好像我剛來不久。
actors.mobs.npcs.zero.fiveyears.whiteyannewyears.messages2=年就是這樣，過得很快又很單一一樣，和地牢一樣進去又出來，生活日復一日。
actors.mobs.npcs.zero.fiveyears.whiteyannewyears.messages3=不過，也和年一樣，帶有些許變化，讓世界變得有趣很多呢，地牢也是如此。
actors.mobs.npcs.zero.fiveyears.whiteyannewyears.messages4=還有，能吃是福，一定要好好多吃飯呀，來這個給你，包含我家人的一份噢。

actors.mobs.npcs.zero.fiveyears.whiteyannewyears$flowercake.name=桃花餅
actors.mobs.npcs.zero.fiveyears.whiteyannewyears$flowercake.desc=白宴家鄉的桃花餅，是她最喜愛的點心。\n\n即便你尚未踏足桃源島，她仍在春節之際，將這份獨一份的滋味贈予你，願它能在地牢之中助你一臂之力。
actors.mobs.npcs.zero.fiveyears.whiteyannewyears$flowercake.eat_msg=<#FF4270>清甜軟糯，滿是桃源的花香。<RGB>

actors.mobs.npcs.zero.fiveyears.atrinewyears.name=蘿蔔子
actors.mobs.npcs.zero.fiveyears.atrinewyears.desc=看起來是一個普通的女孩，新年佳節，她也來到了餐桌旁邊參加盛宴。
actors.mobs.npcs.zero.fiveyears.atrinewyears.messages1=啊，新年快樂，%s。
actors.mobs.npcs.zero.fiveyears.atrinewyears.messages2=雖然我不清楚對新年對你們意味著什麼，不過旅館裡飄來了好聞的香味，所以那一定是令人愉悅的日子，對吧？

actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.name=Bzmdr
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.desc=一位神秘的少年，穿一身黑，看起來不太好相處，他常常出現在旅館，或許你可以和他聊一聊。
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.messages1=新年快樂啊，又過了一年呢。
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.messages2=新的一年要不要體驗一點點“小”挑戰呢。
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.messages3=那拿著這個吧。
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.messages4=那好吧，如果想挑戰可以再來找我。
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.yes=是
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.no=否

actors.mobs.npcs.zero.fiveyears.bzmdrnewyears$bzmdrgift.name=bzmdr的“禮物”
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears$bzmdrgift.name_end=終末之禮
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears$bzmdrgift.desc=一個黑色盒子，打開後裡面仍是同樣大小的黑盒，彷彿永遠也無法開完。\n\n最好還是不要將它丟棄。\n\n每首次進入下層時，會隨機獲得以下效果之一，且可疊加：\n_-_ 怪物移動速度臨時提升20%%\n_-_ 怪物攻擊力提升25%%\n_-_ 怪物視野臨時+2\n_-_ 英雄力量臨時+2\n_-_ 英雄視野臨時+2\n\n每次擊敗核心Boss後所有累加的效果都將重設。\n\n英雄當前加成：\n力量加成：+%s\n視野加成：+%s
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears$bzmdrgift.magic=這物品中邪惡的魔力將它死死鎖在你的背包裡，你根本無法丟棄。
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.def_verb_1=你想幹什麼……
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.def_verb_2=找不到事情做就快點踏上征途。
actors.buffs.championenemy$unnamebless.name=未定義的權能
actors.buffs.championenemy$unnamebless.desc=神秘的權能正在影響著地牢的一切生物，小心行事！擁有此效果將得到以下加成\n\n_-_ 移速常規加成：+%s%%\n_-_ 物理傷害加成：+%s%%\n_-_ 常規視野加成：+%s

actors.mobs.npcs.zero.fiveyears.kongfunewyears.name=鴿子
actors.mobs.npcs.zero.fiveyears.kongfunewyears.desc=你並不知曉這位臉色蒼白的男人來自何方，姓甚名誰，只知道人們稱呼他為“鴿子"。
actors.mobs.npcs.zero.fiveyears.kongfunewyears.messages1=我老想吃鴿子了。最近被餅折磨的吃什麼,吐什麼，然後特別特別想吃鴿子。。。可惜餅太多了。。。對了，你喜歡吃肉餡餅嗎，喜歡的話分你點吧。。。
actors.mobs.npcs.zero.fiveyears.kongfunewyears.messages2=怎麼了，冒險者？你難道還想吃肉餡餅嗎？食物可不能多吃啊，一個足矣！好了，我要繼續浪費時間在那該死的餅上了，祝你好運，冒險者。

### 常規0層-新增
actors.mobs.npcs.zero.normal.choco.name=Choco
actors.mobs.npcs.zero.normal.choco.desc=這位少女看起來有些慵懶，也或許只是沒來得及打理才趕來了新春宴會，她似乎不是很適應這裡的氛圍……
actors.mobs.npcs.zero.normal.choco.messages1=這東西會把我弄到附近的一個隨機地點去，我用不到，扔了可惜，給你吧。
actors.mobs.npcs.zero.normal.choco.card1=我的牌怎麼跟你們比多這麼多，這是優勢嗎？
actors.mobs.npcs.zero.normal.choco.card2=攔截住她，不要不配合我……
actors.mobs.npcs.zero.normal.choco.card3=輸光了，看來沒辦法繼續玩了。

actors.mobs.npcs.zero.normal.slicedream.name=幽寂
actors.mobs.npcs.zero.normal.slicedream.desc=一個穿著華麗法袍的少女，她似乎在看著你，但你卻看不清她的眼神。
actors.mobs.npcs.zero.normal.slicedream.messages1=好久不見，%s。
actors.mobs.npcs.zero.normal.slicedream.messages2=你用困惑的眼神看向她。
actors.mobs.npcs.zero.normal.slicedream.messages3=對我出現在這裡很意外，對吧？
actors.mobs.npcs.zero.normal.slicedream.messages4=感謝你還記得我，那正是我們再次相見的憑依。
actors.mobs.npcs.zero.normal.slicedream.messages5=欸，請不要這麼做……
actors.mobs.npcs.zero.normal.slicedream.messages6=……唔，這麼快又要踏上征途了嗎？那戴上這個吧，希望會有幫助。

actors.mobs.npcs.zero.normal.slicedream.messages7=快去吧，我會在這裡等你回來哦。
actors.mobs.npcs.zero.normal.slicedream.messages8=真好呀，你的旅途一路平安。\n\n希望往後一直如此……
actors.mobs.npcs.zero.normal.slicedream.messages9=………………

actors.mobs.npcs.zero.normal.slicedream.a=抱抱幽寂
actors.mobs.npcs.zero.normal.slicedream.b=踏上征途

actors.mobs.npcs.zero.normal.ag.name=A神
actors.mobs.npcs.zero.normal.ag.desc=來歷不明的神秘少女，經常會在幻藍傳送方陣附近停留。
actors.mobs.npcs.zero.normal.ag.messages1=我的彩虹白馬擁有魔力會讓衣服和頭髮變色！
actors.mobs.npcs.zero.normal.ag.messages2=可惜在某天我的彩虹白馬走丟了能幫我找找嗎？
actors.mobs.npcs.zero.normal.ag.messages3=這個給您，希望它在危急時刻能幫助您～

actors.mobs.npcs.zero.normal.icemagicgirl.name=冬鈴
actors.mobs.npcs.zero.normal.icemagicgirl.desc=那場大戰之後，她總是來到旅館2層休息。
actors.mobs.npcs.zero.normal.icemagicgirl.messages1=%s，好久不見。
actors.mobs.npcs.zero.normal.icemagicgirl.messages2=先前麻煩你了，希望沒有給你帶來太多困擾。
actors.mobs.npcs.zero.normal.icemagicgirl.messages3=……我並不是很擅長找話題，改日再聊吧。
actors.mobs.npcs.zero.normal.icemagicgirl.messages4=這裡有一份我製作的藥劑，帶上它吧。祝一路順風。

actors.mobs.npcs.zero.normal.firemagicgirl.name=蓮娜
actors.mobs.npcs.zero.normal.firemagicgirl.desc=理所當然地，她和地牢內的“蓮娜”一模一樣，並且知道你搶劫的事情。好在她是真實的蓮娜，且接受了你的幫助，看起來不像要找你算帳。\n\n偶爾，她會放下手頭上的瑣事，來到旅館休息。
actors.mobs.npcs.zero.normal.firemagicgirl.messages1=喲，這不是這幾年總在商店裡零元購的%s嘛。
actors.mobs.npcs.zero.normal.firemagicgirl.messages2=今天我心情不錯，你先前所做的那些事，目前先不和你計較囉。
actors.mobs.npcs.zero.normal.firemagicgirl.messages3=我曾經和你說過嗎？我們還有一位大姐，只是她遠在幽深的深海之中，或許有一天你可以見到她……
actors.mobs.npcs.zero.normal.firemagicgirl.messages4=雖然我們現在並非敵對關係，但我在地牢之內的映象對你未必友好，小心點囉。

actors.mobs.npcs.zero.normal.dogdogmusic.name=犬羅
actors.mobs.npcs.zero.normal.dogdogmusic.desc=一隻白色的大狗狗，看起來就很好摸！

actors.mobs.npcs.zero.normal.dogdogmusic.star_bgm=切換 星海決戰 BGM
actors.mobs.npcs.zero.normal.dogdogmusic.sand_bgm=切換 黃金沙漠 BGM
actors.mobs.npcs.zero.normal.dogdogmusic.peach_bgm=切換 桃源島 BGM
actors.mobs.npcs.zero.normal.dogdogmusic.defitit=恢復默認BGM

actors.mobs.npcs.zero.normal.dogdogmusic.messages1=汪汪！你好啊，%s
actors.mobs.npcs.zero.normal.dogdogmusic.messages2=壁爐旁邊很暖和的汪！你也要來嗎汪！
actors.mobs.npcs.zero.normal.dogdogmusic.messages3=你可以在咱汪這裡切換音樂！
actors.mobs.npcs.zero.normal.dogdogmusic.messages4=你想要這個鈴鐺？拿去吧汪！

actors.mobs.npcs.zero.normal.dogdogmusic.ik=你知道嗎…

actors.mobs.npcs.zero.normal.dogdogmusic.dialog_1=薩卡班甲魚骨在薩卡班甲魚被擊敗後價格會翻20倍哦
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_2=主層和子層的鑰匙是通用的
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_3=火龍是巨型體型哦，這意味著它進不去一格寬的地方
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_4=怪物圖鑑中有一個怪物是不會在正常遊戲中出現的，猜猜是哪一個
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_5=有一種迅速清除場上所有迷你太陽的方式:退出重進
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_6=旅館中有一隻長得像貓的狗和一隻長得像狗的貓，經常會有旅客認錯哦
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_7=+10荊棘是可以被嬗變成升級卷軸的，同時荊棘也是唯一個等級高於10級會負提升的武器
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_8=戰鬥法師轉職其實並沒有被刪除，有一個隱藏的道具是可以轉職成這個職業的哦
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_9=還在為矮人角鬥士踢掉武器而煩惱嗎？還在為思維之柱繳械武器而擔憂嗎？快來試試強大的詛咒菱晶吧
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_10=雖然磷火和霜火都是火焰，但他們不會破壞掉腐爛之心的種子哦，不過同樣的，他們也不能被獄火附魔與火焰之力所免疫
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_11=喚魔晶柱其實是可以灌注磷火藥劑的哦
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_12=古堡小遊戲第三幕全面搜查的魔法陣撤離點在撤離倒數計時結束之前是可以多次觸發的，多開幾次你就能見到浩浩蕩蕩的怪海衝你而來了
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_13=如果你不幸被合成表裡的水晶之心騙到了 ，你可以把這個水晶之心放在煉藥鍋裡，會有一個隱藏配方哦
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_14=詭異磷魂是目前最稀有的怪物，你有見過它嗎？
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_15=遠古遺跡的一二層是必定各自刷新兩口井 的，可以找找的
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_16=炸彈匕首的炸彈是可以穿牆扔出去的，用來規避破片炸彈巨大的範圍是很有用的
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_17=對著bzmdr和小騎士多次使用遠程攻擊有驚喜喲！
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_18=水晶項鍊雖然說可以讓你傷口癒合的更快，但其實是沒有效果的
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_19=武甲背包是唯一一種可以被小偷偷走的背包，但相應的，偷武甲背包的小偷移動速度會被降低到0.5
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_20=如果你在非開發者模式下完成沉船烏龍結局會有開發者為你題詞哦

actors.mobs.npcs.zero.normal.dogdogmusic.sw_bgm=BGM切換
actors.mobs.npcs.zero.normal.dogdogmusic.sw_music=切換音樂
actors.mobs.npcs.zero.normal.dogdogmusic.sw_music_desc=汪了說了，我是魔綾幕後音樂的總製作犬，目前製作了一些音樂，你可以先來聽聽看汪。

actors.mobs.npcs.zero.normal.dogdogmusic$cicremusic.name=輕音鈴鐺
actors.mobs.npcs.zero.normal.dogdogmusic$cicremusic.desc=這隻鈴鐺與你曾見過的某隻大狗身上的鈴鐺十分神似……這根本就是同一隻吧！每當鈴舌與鈴體碰撞，便會有清脆的鈴音響起，蕩平厄難。\n\n攻擊時對範圍內所有可見目標發動「輕音」，連續攻擊時會額外觸發「回音」。\n\n輕音：對範圍內所有目標造成無來源_%s-%s物理傷害_。（在移動前最多累計觸發4次，移動後效果重計）\n\n回音：使輕音額外觸發1次。

actors.mobs.npcs.zero.normal.dogdogmusic$cicrestats.name=輕音律動
actors.mobs.npcs.zero.normal.dogdogmusic$cicrestats.desc=身形移動，便會打斷鳴響的連擊。\n攻擊奏響「輕音」，連續攻擊引動「回音」；使用頻繁會令技能暫時失效。\n\n本回合鳴響次數：%s

actors.mobs.npcs.zero.normal.rainnight.name=雨夜
actors.mobs.npcs.zero.normal.rainnight.desc=穿著一披藍色斗篷的怪人，斗篷之下會是什麼呢？
actors.mobs.npcs.zero.normal.rainnight.messages1=我們都是城市的河流。\n我們孤獨，但在同一個時代，匯流向海。
actors.mobs.npcs.zero.normal.rainnight.messages2=很多年後，我們都將再一次回到這裡。只是那時候我已不再是我，你也不再是你。\n珍惜當下吧；珍惜這個值得期待的過去的未來，也珍惜這個值得回憶的未來的過去。

actors.mobs.npcs.zero.normal.magicsheep.name=魔法綿羊
actors.mobs.npcs.zero.normal.magicsheep.desc=這是一隻魔法綿羊。為什麼叫它魔法綿羊？因為你殺不死它。它會做的事情只有邊反芻邊對你翻白眼。
actors.mobs.npcs.zero.normal.magicsheep.messages1=你好咩，要去地牢嗎咩，我的羊毛裡有一個東西你可以拿走咩。
actors.mobs.npcs.zero.normal.magicsheep.messages2=咩咩咩咩咩?
actors.mobs.npcs.zero.normal.magicsheep.messages3=咩～一路順風哦 咩～

actors.mobs.npcs.zero.normal.pinkfox.name=夏漁霧溟
actors.mobs.npcs.zero.normal.pinkfox.desc=一隻正在努力修煉成九尾的普通狐狸，此刻並無心思與人交談。
actors.mobs.npcs.zero.normal.pinkfox.messages1=不必多言，我沒空。
actors.mobs.npcs.zero.normal.pinkfox.messages2=你覺得我能幫你？或許吧。
actors.mobs.npcs.zero.normal.pinkfox.messages3=你心中所求，我已看清：%s。


actors.mobs.npcs.extra.kuzuminewyears.name=久住
actors.mobs.npcs.extra.kuzuminewyears.desc=作為重點懲戒對象單獨關押的囚犯，原先是時間魔女，現已被卸除魔女之名。來自翼綾的枷鎖讓她如今無法大量動用魔力，連離開這裡都是天方夜譚。
actors.mobs.npcs.extra.kuzuminewyears.messages1=你好啊，%s。
actors.mobs.npcs.extra.kuzuminewyears.messages2=被關在這裡我也沒有好送給你的……要不你把這個拿著吧，就當是我的新年禮物了。
actors.mobs.npcs.extra.kuzuminewyears.messages3=咕，好餓……你能給我些吃的嗎？
actors.mobs.npcs.extra.kuzuminewyears.messages5=你要留在這裡陪我嗎？不，你不屬於這裡，快踏上征途吧……
actors.mobs.npcs.extra.kuzuminewyears.yes=是
actors.mobs.npcs.extra.kuzuminewyears.no=否
actors.mobs.npcs.extra.kuzuminewyears.inv_title=請投餵久住，謝謝喵
actors.mobs.npcs.extra.kuzuminewyears.empty_1=你答應要請久住吃點好吃的，將手伸進你的背包翻找起來……
actors.mobs.npcs.extra.kuzuminewyears.empty_2=久住用期待的眼神看著你，你什麼都沒有拿出來，把兩隻空手攤開看著她。
actors.mobs.npcs.extra.kuzuminewyears.empty_3=“哈！”她撲上來咬了你一口！“那就吃你！”
actors.mobs.npcs.extra.kuzuminewyears.thanks=哇這個真的可以給我吃嗎？謝謝喵～作為報答，收下這份祝福吧。
actors.mobs.npcs.extra.kuzuminewyears$2.rankings_desc=<#ff0000>死於餓人……<RGB>
actors.mobs.npcs.extra.kuzuminewyears.kill=<#ff0000>你被飢餓的久住啃死了……<RGB>
actors.mobs.npcs.extra.kuzuminewyears.anary=“哈！”她又咬了你一口！
actors.mobs.npcs.extra.kuzuminewyears.messages4=我看到你在擺弄那朵花兒，莫非只是單純的想當成飾品嗎？如果你想讓它發揮一些實際作用的話，可以把它給我一下。可能會有點疼哦～

actors.mobs.bosses.notsync.fayinasaybye.name=法伊娜
actors.mobs.bosses.notsync.fayinasaybye.desc=她靜靜佇立在劍塚前，沉湎於往昔的回憶。火龍事件已然落幕，森林重歸平靜，可曾與她並肩飲酒、相伴同行的摯友早已不在，只剩她孤身一人，守著滿塚舊劍，唸著逝去的故人。
actors.mobs.bosses.notsync.fayinasaybye.messages1=......啊。
actors.mobs.bosses.notsync.fayinasaybye.messages2=嗯，我不冷，我很好，我過會就會回去，不用擔心我，謝謝。
actors.mobs.bosses.notsync.fayinasaybye.messages3=法伊娜沒再說話，你看著她將瓶中剩下的酒一飲而盡。
actors.mobs.bosses.notsync.fayinasaybye.messages4=.....
actors.mobs.bosses.notsync.fayinasaybye.messages5=其實你也知道......這裡是什麼地方。
actors.mobs.bosses.notsync.fayinasaybye.messages6=我不知道我被困了多久，可在我記憶中，上次我們一起喝酒，彷彿就是前幾週的事情。
actors.mobs.bosses.notsync.fayinasaybye.messages7=我們之中身高最高的那個叫利歐，他不僅個子高，人也很熱情，我們的劍壞了都是他幫忙修的。
actors.mobs.bosses.notsync.fayinasaybye.messages8=他也還挺能喝酒的，我上次看他喝了兩三瓶下去還在和莎拉聊天。
actors.mobs.bosses.notsync.fayinasaybye.messages9=莎拉也是很熱情的人，她會給我們寫卷軸，而且我們喝酒就是她組織的，不過她的酒量卻不太好.....
actors.mobs.bosses.notsync.fayinasaybye.messages10=法伊娜試圖再喝一口酒，可酒瓶裡什麼也沒有。
actors.mobs.bosses.notsync.fayinasaybye.messages11=.....
actors.mobs.bosses.notsync.fayinasaybye.messages12=現在只剩我一個人了。
actors.mobs.bosses.notsync.fayinasaybye.messages13=利歐，薩拉，鮑勃......
actors.mobs.bosses.notsync.fayinasaybye.messages14=我多麼想......
actors.mobs.bosses.notsync.fayinasaybye.messages15=......再見一見你們。

actors.mobs.npcs.extra.yuanxi.name=!!! NO TEXT FOUND !!!
actors.mobs.npcs.extra.yuanxi.desc=這名少女周身空間湧動，似乎並不想與你有什麼接觸。

actors.mobs.npcs.extra.archettoweightless.name=弦
actors.mobs.npcs.extra.archettoweightless.desc=那位神秘的少女，但是她為什麼會出現在這裡？
actors.mobs.npcs.extra.archettoweightless.messages1=你又來了呀，她已經不在這裡了哦。
actors.mobs.npcs.extra.archettoweightless.messages2=不過她遺留了一件東西在這裡呢。
actors.mobs.npcs.extra.archettoweightless.messages3=好了，剛才是開個玩笑。
actors.mobs.npcs.extra.archettoweightless.messages4=我為什麼會在這裡？她去哪了？
actors.mobs.npcs.extra.archettoweightless.messages5=這~是~秘~密~哦~

actors.mobs.npcs.extra.archettoweightless.messages6=她不會再回來了，至於她的去向？這就要你自己去探尋了呢。
actors.mobs.npcs.extra.archettoweightless.messages7=給，這次不捉弄你了。
actors.mobs.npcs.extra.archettoweightless.messages8=什麼，你還想體驗一下？那就如你所願吧。

actors.mobs.npcs.extra.archettoweightless.messages9=你手裡有個很有趣的東西呢，是要來找我交換嗎
actors.mobs.npcs.extra.archettoweightless.a=確有此意
actors.mobs.npcs.extra.archettoweightless.b=還是算了

actors.mobs.npcs.extra.archettoweightless.gift=你想給我點東西？嗯哼，那我也不能白要，這樣，根據你給出的物品，我會施予你相應價值的東西呢。
actors.mobs.npcs.extra.archettoweightless.yes=給你這個！
actors.mobs.npcs.extra.archettoweightless.no=什麼都不給

actors.mobs.npcs.extra.archettoweightless.gift_sc=這東西對你來說很珍貴吧，確定嗎
actors.mobs.npcs.extra.archettoweightless.yesa=就它了！
actors.mobs.npcs.extra.archettoweightless.not=逗逗你的
actors.mobs.npcs.extra.archettoweightless.nob=還是算了

actors.mobs.npcs.extra.archettoweightless.messages10a=好啦，交易完畢哦
actors.mobs.npcs.extra.archettoweightless.messages10b=還要再考慮考慮嘛…

actors.mobs.npcs.extra.archettoweightless.card1=還不離開嗎，迷途者？你還有屬於自己的過去要去尋回哦
actors.mobs.npcs.extra.archettoweightless.card2=還不離開嗎，迷途者？你還有屬於自己的未來要去探覓哦
actors.mobs.npcs.extra.archettoweightless.go=還不離開嗎，此處已經撐不了太久了哦

actors.mobs.npcs.extra.archettoweightless.inv_title=你想給我什麼？

actors.mobs.npcs.extra.archettoweightless.props=唔，這樣吧，給你這個，對你來說用處也不小哦
actors.mobs.npcs.extra.archettoweightless.heal=稀有的事物呢，那給予你生命的活力吧
actors.mobs.npcs.extra.archettoweightless.scroll=平凡的事物呢，那給予你知識的力量吧

#### 魔劍士-新英雄
actors.hero.spellsoword.magicpower.name=魔力
actors.hero.spellsoword.magicpower.desc=法爾塔婭精通魔力，總能在戰鬥中先發制人、旗開得勝！\n\n魔力：%s/%s點\n\n當前自我恢復魔力間隔：%s回合。
actors.hero.spellsoword.magicpower.icemagic=冰澪附魔

actors.hero.talent.magic_compression.title=魔力壓縮
actors.hero.talent.magic_compression.desc=_+1：_最大_魔力上限_提升5點。\n\n_+2：_魔力回復所需時間_-1回合_。

actors.hero.talent.guardian_blade.title=護主飛刃
actors.hero.talent.guardian_blade.desc=_+1：_魔法飛刃攻擊後有_35%機率_不消耗魔力立刻召回。\n\n_+2：_魔法飛刃攻擊後有_70%機率_不消耗魔力立刻召回。

actors.hero.talent.ice_liberation.title=冰澪解放-未完成
actors.hero.talent.ice_liberation.desc=_+1：_冰澪附魔和劍淵繚繞的持續時間增加_3回合_。\n\n_+2：_冰澪附魔和劍淵繚繞的持續時間增加_6回合_。

actors.hero.talent.cold_hardy_constitution.title=耐寒體質
actors.hero.talent.cold_hardy_constitution.desc=_+1：_法爾塔婭身上的_凍傷_效果不會造成減益。\n\n_+2：_法爾塔婭可以_解除自身下1次受到的凍結_，這個效果有_33回合_冷卻時間。

actors.hero.talent.malicious_speculation.title=惡意揣測
actors.hero.talent.malicious_speculation.desc=_+1：_法爾塔婭在裝備_未鑑定_的武器和護甲時，如果其上有_未發現的詛咒_，撤銷_本次穿戴並顯示詛咒_。這個效果僅_可觸發3次_。法爾塔婭鑑定武器和護甲的速度提升至_原本的125%_。\n\n+2：在+1基礎上，額外_增加3次_觸發機會，且效果對_戒指和神器_也會生效。法爾塔婭鑑定武器和護甲的速度提升_至原本的150%_。\n\n【測試期間暫無上限】
actors.hero.talent.er_id=惡意揣測
actors.hero.talent.er_ik=這件_%s_上面攜帶了_%s_，已自動卸下。

actors.hero.talent.magicpower_food.title=魔力一餐
actors.hero.talent.magicpower_food.desc=_+1：_進食僅消耗1回合，且進食後立刻_回復4點魔力_。通過該天賦回復的魔力允許超出_最大魔力上限_。\n\n_+2：_進食僅消耗1回合，且進食後立刻_回復6點魔力_。通過該天賦回復的魔力允許超出_最大魔力上限_。

actors.hero.talent.magicdamage_melee.title=耀魔利刃
actors.hero.talent.magicdamage_melee.desc=_+1：_法爾塔婭的所有近戰攻擊傷害將附帶_6%魔法傷害_。\n\n_+2：_法爾塔婭的所有近戰攻擊傷害將附帶_12%魔法傷害_。

actors.hero.talent.highmagic_ankh.title=高魔護體-未完成
actors.hero.talent.highmagic_ankh.desc=受到致命傷害時，如果仍有魔力剩餘，將嘗試以200%/160%魔力代替生命值扣除。

actors.hero.talent.blood_river.title=血液湧動
actors.hero.talent.blood_river.desc=_+1：_單次受到的傷害大於等於_最大生命值的15%_時，在3回合延遲後獲得_2點魔力_。\n\n_+2：_單次受到的傷害大於等於_最大生命值的10%_時，在3回合延遲後獲得_23點魔力_。

actors.hero.talent.shield_power.title=廢能利用
actors.hero.talent.shield_power.desc=_+1：_消耗魔力時，獲得本次_1倍魔力_消耗量的護盾，這個效果有10回合冷卻時間。消耗深淵魔力時，每消耗1點深淵魔力，視為消耗了5點魔力。\n\n_+2：_消耗魔力時，獲得本次_1.5倍魔力_消耗量的護盾，這個效果有10回合冷卻時間。消耗深淵魔力時，每消耗1點深淵魔力，視為消耗了5點魔力。

#### 螃蟹王
actors.mobs.bosses.notsync.crabking.name = 螃蟹王
actors.mobs.bosses.notsync.crabking.desc = 克里弗斯之果爆炸後，果實的碎片依然汙染著叢林。所有食用碎果的小動物都在痛苦中死去了，除了這隻螃蟹。\n\n果實的力量讓它發生了變異，長大到了一個匪夷所思的地步。現在它極端好鬥，而最重要的是，它盯上你了！

actors.mobs.bosses.notsync.crabking$relooplife.name=逝者生存
actors.mobs.bosses.notsync.crabking$relooplife.desc=受到致命攻擊後激發潛能，下回合以120%的最大生命滿血復活，至多觸發2次。




