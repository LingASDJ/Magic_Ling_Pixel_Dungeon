levels.rooms.special.skeletonfishroom$bluestonedoor.name=蔚藍結晶-α
levels.rooms.special.skeletonfishroom$bluestonedoor.desc=通過蔚藍結晶的共鳴，你發現這裡有神秘的區域等待你的探索……

levels.rooms.special.skeletonfishroom$bluealtstonedoor.name=蔚藍結晶-Ω
levels.rooms.special.skeletonfishroom$bluealtstonedoor.desc=通過蔚藍結晶的共鳴，你發現這裡有神秘的區域等待你的探索……


actors.buffs.status.foundchest.name=寶藏搜尋
actors.buffs.status.foundchest.desc=你來到了擬態王的寶藏區域，看起來你還能搜查_%s/5個_寶箱怪，然後這裡就會變得不穩定，從而導致其他寶箱怪魂飛魄散離開這裡！\n\n偶爾還能看見擬態王的幼年形態，但由於這裡時空錯亂，你無法將它殺死……

actors.buffs.herodisguise.name=偽裝
actors.buffs.herodisguise.desc=幻術魔法改變了你的外貌！雖然此效果是完全裝飾性的，但無論如何感覺起來還是很奇怪。\n\n偽裝效果剩餘時長：%s回合

actors.buffs.greaterhaste.name=瞬間移動
actors.buffs.greaterhaste.desc=驚人的速度加成效果使得一切都好像在此刻靜止了。\n\n在瞬間移動的效果下，移動完全不消耗回合，但其它行動的速度仍舊。每一格移動都會消耗一回合瞬間移動。\n\n瞬間移動剩餘回合數：%d

actors.mobs.bosses.peach.whiteyan.name=白宴
actors.mobs.bosses.peach.whiteyan.desc=桃源島中的神秘少女，據傳她是此地人民所信奉的守護神。

actors.mobs.bosses.galaxy.servantavgomon.name=亞弗戈蒙之仆
actors.mobs.bosses.galaxy.servantavgomon.desc=信奉亞弗戈蒙的未知種族，雖說信奉亞弗戈蒙，但由於亞弗戈蒙太過暴怒，也有相當一部分教徒會追隨在塔維爾左右。
actors.mobs.bosses.galaxy.servantavgomon.scorpion=逃避是一種錯誤的選擇！

actors.mobs.bosses.galaxy.fourstone$magicfourstone.name=鈷黃石碑
actors.mobs.bosses.galaxy.fourstone$magicfourstone.desc=蘊含著魔法的力量，上前交互會發生什麼事？

actors.mobs.bosses.galaxy.fourstone.name=血紅石碑
actors.mobs.bosses.galaxy.fourstone.desc=蘊含著龍血的力量，上前交互會發生什麼事？

actors.mobs.bosses.galaxy.fourstone$frostfourstone.name=蔚藍石碑
actors.mobs.bosses.galaxy.fourstone$frostfourstone.desc=蘊含著寒冰的力量，上前交互會發生什麼事？

actors.mobs.bosses.galaxy.fourstone$poisonfourstone.name=蒼綠石碑
actors.mobs.bosses.galaxy.fourstone$poisonfourstone.desc=蘊含著劇毒的力量，上前交互會發生什麼事？


actors.mobs.bosses.galaxy.endyog.name=猶格·索托斯
actors.mobs.bosses.galaxy.endyog.desc=猶格·索托斯知曉大門所在。因為猶格·索托斯即是門，猶格·索托斯即是門匙，即是看門者。過去在祂，現在在祂，未來亦在祂，因為萬物皆在猶格·索托斯。”
actors.mobs.bosses.galaxy.endyog.message1=看來我沒猜錯，你確實有觸及“門”的潛力，那我就遵守約定，讓你看看這枚鑰匙的真正樣貌好了。
actors.mobs.bosses.galaxy.endyog.message2=我會繼續注視著你的。

actors.mobs.bosses.galaxy.sliverlocksword.name=銀之匙
actors.mobs.bosses.galaxy.sliverlocksword.desc=你終於見到了這枚鑰匙原本的樣貌，這柄鑰匙上覆蓋著密碼一般的阿拉伯藤蔓花紋，卻沒有任何清晰可讀的解釋和說明，也許那之中象徵著這個客觀而又漫無目的的宇宙中的目的與秘密也說不定，但你無從得知。不過你能感覺得到，這枚鑰匙中蘊含著甚至可以改變世界的強大力量。\n\n這把武器附帶紊亂附魔\n\n這把武器的等級上限為12\n+3時精準修正從1增加到2\n+6時攻擊距離從1增加到2\n+9時命中會造成遲緩

actors.mobs.npcs.zero.yetyog.scroll=現在的你應該可以觸及更深邃的智慧了，收下吧，希望對你有幫助。


actors.mobs.bosses.galaxy.sothothlasher.name=塔維爾之觸
actors.mobs.bosses.galaxy.sothothlasher.desc=由塔維爾的意識支配的不明生物，外表像是觸手，雖然看起來極具攻擊性，但對塔維爾來說，它與寵物並無二致。


actors.mobs.npcs.extra.trueyog.name=泡泡
actors.mobs.npcs.extra.trueyog.desc=不知為何，你隱約覺得眼前的少女和地牢最深處的存在有某種微妙的關係？不過至少現在，她看起來只是一位有些神秘的少女而已。
custom.utils.plot.trueyogplot.name=泡泡
custom.utils.plot.trueyogplot.message1=哎呀，你也抵達了啊。
custom.utils.plot.trueyogplot.message2=我為何在此？我可以存在於任何時間，空間之中，不必驚訝。\n\n我的殘片在此處扎根肆虐，沒想到你竟能憑一己之力將其擊潰，真是出乎意料。

actors.mobs.npcs.extra.trueyog.quest_start_prompt=既然事情已經告一段落，要與我一同返回嗎？

actors.mobs.npcs.extra.trueyog.quest_boss_prompt=你準備好開始試煉了嗎？

actors.mobs.npcs.extra.trueyog.enter_yes=是
actors.mobs.npcs.extra.trueyog.enter_no=否

actors.mobs.npcs.extra.peachgodstate.name = 白宴神像
actors.mobs.npcs.extra.peachgodstate.desc = 一個突然出現在此地的神像\n\n這座精心雕琢的神像似乎放在這裡很久了，但似乎周邊揚起的雪花和塵埃都無法靠近其分毫。不知為何，你感覺你見過它的原型……
actors.mobs.npcs.extra.peachgodstate.title = 祈願
actors.mobs.npcs.extra.peachgodstate.notenough = 口袋沒有多少鈷幣了呢……
actors.mobs.npcs.extra.peachgodstate.lucky_desc = 神像面前擺著些貢品。似乎獻祭一點鈷幣就能獲得神明的賜福，為什麼不試試呢？ \n\n 你目前已經進行了%s次獻祭
actors.mobs.npcs.extra.peachgodstate.you_now_have = 在你將鈷幣放入貢品盤內時……你發現背包裡多了些東西，你獲得了：
actors.mobs.npcs.extra.peachgodstate.single = 來一次(50鈷幣)
actors.mobs.npcs.extra.peachgodstate.ten_shots = 我要來——十次！(500鈷幣)
actors.mobs.npcs.extra.peachgodstate.cancel = 囊中羞澀，下次一定
actors.mobs.npcs.extra.peachgodstate.touchtop = 你發現放入其中的鈷幣並沒有消失，看來獻祭次數已經到上限了
actors.mobs.npcs.extra.peachgodstate.surplus = 你發現放入其中的鈷幣只消失了一部分，看來獻祭次數已經到上限了
actors.mobs.npcs.extra.peachgodstate.gold=金色傳說！！！
actors.mobs.npcs.extra.peachgodstate.lends=神話再現！！！
actors.mobs.npcs.extra.peachgodstate.hello=〖不尋常的溫暖洋溢在這個房間中。〗
actors.mobs.npcs.smallleafharddungeon.cancelselect=神像：……

custom.utils.plot.trueyogplot.message3a=既然事情已經告一段落，要與我一同返回嗎？
custom.utils.plot.trueyogplot.message4a=這樣啊，你還想繼續追尋更深處的隱秘嗎？

actors.mobs.bosses.galaxy.sothothnpc.name=塔維爾·亞特·烏姆爾·猶格·索托斯

actors.mobs.bosses.galaxy.sothotheyedied.name=塔維爾·亞特·烏姆爾·猶格·索托斯
actors.mobs.bosses.galaxy.sothotheyedied.desc=“猶格·索托斯知曉大門所在。因為猶格·索托斯即是門，猶格·索托斯即是門匙，即是看門者。過去在祂，現在在祂，未來亦在祂，因為萬物皆在猶格·索托斯。”\n祂注視著你，祂可以看穿你的一切，但祂的眼中並無惡意和殺意，有的只有一抹看不到底的深邃。畢竟如祂所說，這只是一場沒有生命危險的試煉罷了，但你依然不可掉以輕心。\n紊亂的能量匯聚在祂的手心。祂全知全能，從不失手。\n祂會從造物的毀滅中提取力量，並在其消滅達到一定數量時發動巨大的時空波動，若是猶豫而未及時逃脫，片刻之間便會化為齏粉。

actors.mobs.bosses.galaxy.abyssbook.name=深淵之書
actors.mobs.bosses.galaxy.abyssbook.desc=你早就聽聞死靈之書記錄著一切未知之物，你也早就做好了被無盡知識反噬的覺悟，但當你翻開它的時候你發現在死靈之書中間夾著的是……一本漫畫書。這時你才意識到你剛剛鏖戰的神祇全程只不過是在摸魚而已。\n\n但至少你能看懂的部分依然可以讓你隨心駕馭其中微乎其微的一部分力量。\n\n“那永恆長眠的並非亡者，在詭秘的萬古中即便死亡本身亦會消逝。”\n\n——阿卜杜拉·阿爾哈薩德
actors.mobs.bosses.galaxy.abyssbook.book_blessed=選擇你需要的祝福：XXXX

actors.mobs.bosses.galaxy.sothotheyedied.galaxy=消滅我太多的朋友可是不好的哦！
actors.mobs.bosses.galaxy.sothotheyedied.deadsling=這就是最後了，你應該不會在距離勝利一步之遙的時候倒下吧。

actors.mobs.bosses.galaxy.sothothnpc.message1=對了，還沒有完整的做過自我介紹呢。
actors.mobs.bosses.galaxy.sothothnpc.message2=吾乃塔維爾·亞特·烏姆爾·猶格·索托斯，吾即萬物歸一者，在這時間與空間的裂痕中傾盡全力與吾抗衡吧，%s！



custom.utils.plot.trueyogplot.message3b=有趣，我能感受到你身上有一縷熟悉的波動，你是否還有餘力陪我消遣片刻？
custom.utils.plot.trueyogplot.message4b=雖歷經數次變化，但你手中那枚鑰匙仍未取回最初的姿態，我可以讓它變回原本的樣貌，但同時也要考驗你是否能駕馭它而不至於在無盡的智慧之中毀滅。
custom.utils.plot.trueyogplot.message5b=放心，並無性命之虞，但我也希望你做好充足的準備再來，如何？做好決定了嗎？
custom.utils.plot.trueyogplot.message6b=也許有一天你會遇到能用得上這把鑰匙的情況，但那時，你窺見的又會是什麼樣的存在呢？

actors.mobs.bosses.galaxy.sothoth.name=塔維爾·亞特·烏姆爾
actors.mobs.bosses.galaxy.sothoth.desc=“猶格·索托斯知曉大門所在。因為猶格·索托斯即是門，猶格·索托斯即是門匙，即是看門者。過去在祂，現在在祂，未來亦在祂，因為萬物皆在猶格·索托斯。”\n祂注視著你，祂可以看穿你的一切，但祂的眼中並無惡意和殺意，有的只有一抹看不到底的深邃。畢竟如祂所說，這只是一場沒有生命危險的試煉罷了，但你依然不可掉以輕心。\n紊亂的能量匯聚在祂的手心。祂全知全能，從不失手。\n祂會從造物的毀滅中提取力量，並在其消滅達到一定數量時發動巨大的時空波動，若是猶豫而未及時逃脫，片刻之間便會化為齏粉。
actors.mobs.bosses.galaxy.sothoth.notice=吾乃塔維爾·亞特·烏姆爾·猶格·索托斯，吾即萬物歸一者，在這時間與空間的裂痕中傾盡全力與吾抗衡吧，%s。
actors.mobs.bosses.galaxy.sothoth.message=慧能之光即將到來！
actors.mobs.bosses.galaxy.sothoth.defeated=真是不可思議，你比我想像中要強大許多，那我就稍微再用幾分實力好了。
actors.mobs.bosses.galaxy.sothoth.dead=索托斯：真是遺憾，不過下次也有機會，做好準備再來嘗試吧。

