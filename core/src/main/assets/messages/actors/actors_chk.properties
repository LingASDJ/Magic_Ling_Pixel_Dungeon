actors.hero.talent.died_god.desc=-_+1_傷害提升5傷害\n\n-_+2_有護甲的時候自帶奧術護盾和樹膚\n\n-_+3_滿血的時候行動更加迅速\n\n-_+4_血量低於50的時候自帶10回合荊棘，和一個弱型治療效果\n\n-_+5_短暫拒絕死亡後 將獲得25的奧術護盾 並且力竭恢復速度減半

