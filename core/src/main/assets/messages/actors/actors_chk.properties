actors.mobs.bosses.firemagicdied.wave_2=%s,你還有兩下子嘛
actors.mobs.bosses.firemagicdied.wave_3=%s,我現在可要認真了!
actors.mobs.bosses.firemagicdied.defeated=%s,你確實是被她選中的人,現在,我已經接受你了!
actors.mobs.bosses.firemagicdied.life=命運輪迴!
