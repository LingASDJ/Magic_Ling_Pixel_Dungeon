actors.mobs.srpdhblr.desc = 這些賞金獵人曾經想來到這個地牢終結最終的黑暗，沒想到現在卻被地牢暗處的黑暗魔力給腐蝕。現在他們毫無神志，這些生物遊蕩在監獄附近，等待下一個來到這個地牢的可憐人。

actors.mobs.randombluefire.name = 詭異磷魂(狂暴)
actors.mobs.randombluefire.attack_msg_1 = 為什麼要入侵這裡？
actors.mobs.randombluefire.attack_msg_2 = 不，你不能離開這裡
actors.mobs.randombluefire.attack_msg_3 = 你不是我的王
actors.mobs.randombluefire.death_msg_1 = 死亡，即為結束！
actors.mobs.randombluefire.died = 最終，終於還是解脫了……
actors.mobs.randombluefire.desc = 矮人王國的亡魂和地牢深處溢出的魔力誕生出的詭異生物。他們擁有恐怖的能力，並且半血會進入狂暴狀態。他們的幻影可能存在這裡，必須在擊敗他們後才會消失。
actors.mobs.randombluefire.notice = 你想嘗試磷火帶來的痛苦嗎?
actors.mobs.randombluefirede.name = 詭異磷魂
actors.mobs.randombluefirede.attack_msg_1 = ……
actors.mobs.randombluefirede.attack_msg_2 = 不能違背神的意志
actors.mobs.randombluefirede.attack_msg_3 = 無知者無罪
actors.mobs.randombluefirede.death_msg_1 = 沒有任何的悲哀可以給我，你徹底激怒我了！
actors.mobs.randombluefirede.desc = 矮人王國的亡魂和地牢深處溢出的魔力誕生出的詭異生物。他們擁有恐怖的能力，並且半血會進入狂暴狀態。但是它們沒有視力，你只要不驚擾它們就好。不過，地牢的警報同樣會讓他們警覺起來。請小心行事！
actors.mobs.randombluefirede.fuck=無知者縱慾奈何，你又有什麼資格拯救我們？

actors.mobs.ogpdnqhz.name = 健壯的老鼠
actors.mobs.ogpdnqhz.desc = 這個老鼠很健壯，某些時刻可能給你致命一擊

actors.mobs.kagenonusujin.name=影子盜賊
actors.mobs.kagenonusujin.desc=這個邪魔外道的小偷為了偷取什麼寶貴之物而在此處遊蕩著。學習了來自深淵的黑暗法術的他，能夠化作黑暗中的影子潛藏其間，又立刻消逝。\n\n這個怪物會嘗試偷取玩家物品，之後將自己瞬移到地圖上另一個地方，並被魔法反噬流血同時在敵人點造成雷暴效果。\n\n如果失敗，則會因為魔法反噬而發狂導致附近的岩石掉下來！

actors.mobs.fireghost.name=紅色怨靈
actors.mobs.fireghost.desc=這隻全身赤色的怨靈由地牢深處的死靈學家們從烈焰之中喚醒，雖然它們沒有火元素強大，但也已可無限毗近。\n\n這個怪物會點燃你。

actors.mobs.blackhost.name=黑色怨靈(舊版)
actors.mobs.blackhost.desc=這隻全身黑色的怨靈是地牢深處的瘴氣影響怨靈後形成的，雖然它們很脆弱，但卻可以讓你中毒&流血&燃燒。但是他們的視力非常差。\n\n這個怪物十分危險。

actors.mobs.newblackhost.name=黑色怨靈
actors.mobs.newblackhost.desc=這隻全身黑色的怨靈是地牢深處的瘴氣影響怨靈後形成的，它們可以週期性釋放神聖詛咒火焰，敵人在裡面機率獲得一定護盾，而玩家則有機率受到詛咒和虛弱效果。\n\n這個怪物十分危險。
actors.mobs.newblackhost.charging=黑色怨靈正在準備釋放神聖詛咒火焰

actors.blobs.curseddiedblos.desc=一團聖咒火焰正在這裡肆虐\n\n英雄在裡面將會有機率獲得虛弱4回合(如果虛弱已經存在則不附加)和有機率裝備的武器被詛咒\n\n怪物在裡面有機率獲得額外不衰減的6-20護盾。

actors.mobs.ogpdlls.name = 老年老鼠
actors.mobs.ogpdlls.desc = 這個老鼠已經步入中老年，因此它的精準程度很高！

actors.mobs.flameb01.name = Flame-B01
actors.mobs.flameb01.desc = 曾經是異端神教為了阻止_地下的黑暗_而創建的火焰機器人，現在異端神教已經無處可尋，但是他們留下的罪惡依然在這裡。\n噴火器壓力為%s 度.

actors.mobs.flamec01.name = Flame-C01
actors.mobs.flamec01.desc = 曾經是異端神教為了阻止_地下的黑暗_而創建的火焰機器人，現在異端神教已經無處可尋，但是他們留下的罪惡依然在這裡。\n噴火器壓力為%s 度.\n\nC01很少見到，通常是商人雇的殺手或者是召喚的！

actors.mobs.flamec02.name = Flame-C02
actors.mobs.flamec02.desc = 曾經是異端神教為了阻止_地下的黑暗_而創建的火焰機器人，現在異端神教已經無處可尋，但是他們留下的罪惡依然在這裡。\n噴火器壓力為%s 度.\n\nC01很少見到，通常是商人雇的殺手或者是召喚的！

actors.mobs.rgoo100.name = 小粘咕-100實驗體
actors.mobs.rgoo100.desc = 這是她曾經親手製作的小粘咕，他們和大粘咕一起維持著地下都市的秩序。然而就在300年前，因為那場變化，小粘咕從此變成一個殺戮工具。但是，小粘咕一直希望有真正的冒險者來解放這個地牢！
actors.mobs.rgoo100.notice=咕-咕！
actors.mobs.rgoo100.defeated=咕……咕……
actors.mobs.rgoo100.!!!=!!!
