actors.mobs.bosses.firemagicdied.bolt_kill.rankings_desc=在蓮娜的試煉中不幸消逝……
actors.mobs.bosses.firemagicdied.ondeath=蓮娜的奪命三魂焰浪使你的靈魂被衝擊的粉碎……

actors.mobs.npcs.firemagicdiednpc.name=濁焰魔女-蓮娜
actors.mobs.npcs.firemagicdiednpc.desc=曾經是翼綾的護法之一,因為大火事件被地表三巨頭懷疑,逃亡到了雪凜峽谷……\n\n被當時的商人領主給收養,現在,她是雪凜峽谷的守護之神……
actors.mobs.npcs.firemagicdiednpc.talk_1=%s,你的戰鬥技巧確實讓我刮目相看。
actors.mobs.npcs.firemagicdiednpc.talk_2=不過，搶劫商店這種事情，希望你下次不要再做了。
actors.mobs.npcs.firemagicdiednpc.talk_3=對了，我記得我的姐姐冬鈴在地牢裡面。如果你見到了她，務必救救她……
actors.mobs.npcs.firemagicdiednpc.talk_4=我的話已經說完了……,拿下這些禮品吧，它會讓你在旅程上更加輕鬆的……
actors.mobs.npcs.firemagicdiednpc.talk_5=%s,和你剛剛決鬥過後,我有一點累了…… 接下來,商人領主會告訴你後續事宜……

actors.mobs.npcs.null.name=???
actors.mobs.npcs.null.desc=???
actors.mobs.npcs.null.why=你:你……是誰？
actors.mobs.npcs.shopking.talk=我知道你被送到這裡的緣由。
actors.mobs.npcs.null.why_2=你:…………
actors.mobs.npcs.shopking.talk_2=搶劫商店的事我可以睜一隻眼閉一隻眼，但你必須離開這裡。
actors.mobs.npcs.null.why_3=你:如果我說不呢?
actors.mobs.npcs.shopking.talk_3=……或者幫我們一個忙。
actors.mobs.npcs.shopking.talk_4=雪凜峽谷的深處，是蓮娜的居所。如果你認為自己有那膽量，就去挑戰她吧。
actors.mobs.npcs.shopking.talk_5=如果不想冒這個險，往左走可以回去。
actors.mobs.npcs.shopking.talk_6=別當個懦夫，你殺我們的守衛時可是很勇敢的。
actors.mobs.npcs.shopking.talk_7=做出你的選擇吧!
actors.mobs.npcs.shopking.talk_8=%s,你這個並不算很明智的選擇，但勇氣可嘉。
actors.mobs.npcs.shopking.talk_9=如果你準備好了,那就隨我一起見她吧!
actors.mobs.npcs.nulldied.talk_x=……
actors.mobs.npcs.nulldied.talk_r=商人領主:%s,接下來,就靠你自己了!
actors.mobs.npcs.nulldied.name=商人領主
actors.mobs.npcs.nulldied.desc=雪凜峽谷的商人領主，正是他建立了商人這個勢力。

actors.mobs.npcs.nulldiedto.talk_x=不錯，現在，是你盡情挑選商品的時間。

actors.mobs.npcs.nulldiedto.name=商人領主
actors.mobs.npcs.nulldiedto.desc=雪凜峽谷的商人領主，正是他建立了商人這個勢力。
actors.mobs.npcs.nulldiedto.leave=冒險家，快通過水晶之心離開這裡吧……



actors.mobs.npcs.nulldiedto.namex=水晶意志
actors.mobs.npcs.nulldiedto.descx=衪並不是商人領主，而是水晶之心的意志。衪正在等待你！

actors.mobs.npcs.nulldiedto.talk_a=這裡居然還有活人？哦，是你！
actors.mobs.npcs.nulldiedto.talk_b=冒險家，有一股邪惡，陰冷卻強大的力量正在向外溢出，看起來似乎只有你能改變這個局面了。
actors.mobs.npcs.nulldiedto.talk_c=下面沒什麼生物，也許是那股力量做的。倖存下來的只有那些擁有一定實力的傢伙。
actors.mobs.npcs.nulldiedto.talk_d=水晶之心正在抗拒這股力量，入口因為這股抗拒之力變成了這種樣子。
actors.mobs.npcs.nulldiedto.talk_e=下面的地形也許會有所不同，這些都是抗拒之力的具體表現。
actors.mobs.npcs.nulldiedto.talk_f=祝你好運，冒險家。我這裡也提供一點幫助你壓制不明力量的東西——當然，是得花錢的。

actors.mobs.npcs.nulldiedto.talk_g=冒險家，我們又見面了。我擔心你接下來的路程，所以又來幫助你了。
actors.mobs.npcs.nulldiedto.talk_h=祝你好運，冒險家。我這裡也提供一點幫助你壓制不明力量的東西——當然，是得花錢的。

actors.mobs.npcs.nulldiedto.talk_i=冒險家，正如我之前所說。有一股邪惡，陰冷卻強大的力量正在向外溢出，而能量點就在這更深的下方。
actors.mobs.npcs.nulldiedto.talk_j=但是由於某位的到來，你現在還不能前往那裡找死，所以你先暫時別急著去那裡……

actors.mobs.npcs.nulldiedto.talk_k=DMZERO已經徹底被摧毀了，冒險家，幹的不錯。
actors.mobs.npcs.nulldiedto.talk_l=冒險家，或許你真的是衪的救世主。
actors.mobs.npcs.nulldiedto.talk_m=感謝你這次的地牢調查行動，我會很快將這裡給恢復到最初的樣子。
actors.mobs.npcs.nulldiedto.talk_n=冒險家，這只是一個開始。你未來的艱辛坎坷之路，就要來了！
actors.mobs.npcs.nulldiedto.talk_o=冒險家，現在你可以通過水晶之心離開這裡了。謝謝你這次幫忙，我會在衪回來後告訴你的豐功偉績的。

actors.mobs.coldgurad.name=雪凜守衛
actors.mobs.coldgurad.scorpion=給我過來！
actors.mobs.coldgurad.def_verb=魔盾
actors.mobs.coldgurad.desc=雪凜峽谷的守衛，保衛著雪凜峽谷的平衡！
