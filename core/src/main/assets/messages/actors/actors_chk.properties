actors.mobs.bosses.firemagicdied.more_summon=現在，是你的試煉時間
actors.mobs.bosses.firemagicdied.death_rattle=嚐嚐這個!
actors.mobs.bosses.firemagicdied.sacrifice=全面肅清威脅到我朋友的外來者……
actors.mobs.bosses.firemagicdied.teleport_1=歸於虛無……
actors.mobs.bosses.firemagicdied.teleport_2=……最終肅清
actors.mobs.bosses.firemagicdied.lifelink_1=生命連結
actors.mobs.bosses.firemagicdied.lifelink_2=生命之歌
actors.mobs.bosses.firemagicdied.dixsdf=很好，現在 我要全力以赴了……
