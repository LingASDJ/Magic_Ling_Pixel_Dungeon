custom.utils.plot.hollow.minigame.morphspacmanendplot.message1=演出的第一幕已經結束。
custom.utils.plot.hollow.minigame.morphspacmanendplot.message2=為什麼我不是觀眾，而是出演者？
custom.utils.plot.hollow.minigame.morphspacmanendplot.message3=邀請函從來就不是只給觀眾的，對吧？
custom.utils.plot.hollow.minigame.morphspacmanendplot.message4a=你必須承認我的目光獨到。你是一個天生的偉大演員，這一點你自己也才發現，不是嗎？
custom.utils.plot.hollow.minigame.morphspacmanendplot.message4b=但我不希望你僅僅為此而故意砸我的場子，這可不是一位合格的冒險家該展現的素養。
custom.utils.plot.hollow.minigame.morphspacmanendplot.message4c=而且，你幹的不錯，不是嗎？至少，觀眾們都期待著下一環節呢。
custom.utils.plot.hollow.minigame.morphspacmanendplot.message5=總之，你還有一些準備的時間。演出第二幕馬上開始，好好表現！

custom.utils.plot.hollow.minigame.morphsmoveboxendplot.message1=只剩最後一場演出了，結束它，然後與我共演吧！
custom.utils.plot.hollow.minigame.morphsmoveboxendplot.message2=真是個瘋子……
custom.utils.plot.hollow.minigame.morphsmoveboxendplot.message3=哦，看你在舞台上如此賣力，就暫且不論這對我的糟糕評價了。
custom.utils.plot.hollow.minigame.morphsmoveboxendplot.message4=女士們，先生們，準備好了嗎？

windows.wndpacmanreadygo.title=第一幕-吃豆人
windows.wndpacmanreadygo.message=《吃豆人》（Pac-Man）是由_日本遊戲設計師岩谷徹_開發，原名“Puck-Man”源於日語擬聲詞，形象靈感來自披薩缺角和漢字“口”。\n\n在吃豆人45周年之際，冒險者？不，玩家，我誠邀你來到此劇院進行演出，但為了節目的趣味性，你只能攜帶4件物品，且只能是武器/護甲/戒指/神器，並且移動速度和攻擊距離均鎖定為1。我還會為你調配一柄專屬的+10魔彈法杖。\n\n一旦你準備好，演出隨時都可以開始。
windows.wndpacmanreadygo.confirm=第一幕-吃豆人-演出開始

