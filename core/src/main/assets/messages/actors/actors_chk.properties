levels.hollow.moveboxhollowactorlevel$threelet_go.desc=幹得不錯，冒險者。等你休整完畢後。閱讀這則邀請函，你將進入第三幕演出！
levels.hollow.moveboxhollowactorlevel$threelet_go.ac_read=閱讀

custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.game=第二幕-推箱子
custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.quest_start_prompt=《推箱子》（Sokoban）是由_日本遊戲設計師今林宏行_首創。玩法通俗易懂，箱子只可以推，不可以拉， 而且一次只能推動一個，勝利條件就是把所有的箱子都推到目的地。\n\n在推箱子44周年之際，我們的第二幕演出將與此項目共演。目標非常明確，在時間消耗完畢前完成推箱子，消耗額外時間則會扣除積分。你還可以局內重設，但這會導致演出不那麼完美，所以要扣分，一旦你完成了推箱子或者得分降低為0，那麼本場演出將結束。
custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.enter_yes=第二幕-推箱子-演出開始
custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.enter_no=稍後再說

levels.hollow.moveboxhollowactorlevel$threelet_go.game=第三幕-全面搜查
levels.hollow.moveboxhollowactorlevel$threelet_go.quest_start_prompt=搜打撤，聽到這個詞語，你是否想起了一些遊戲？在劇院演出的最後一幕中，你將前往劇院為你模擬的一個巨大地圖，這裡有著各區域心懷不甘的怪物的恐怖變種，但同樣的，也會有諸多寶藏等待你。完成這最後一場演出，你將正式與我見面！
levels.hollow.moveboxhollowactorlevel$threelet_go.enter_yes=第三幕-全面搜查-演出開始
levels.hollow.moveboxhollowactorlevel$threelet_go.enter_no=稍後再說
