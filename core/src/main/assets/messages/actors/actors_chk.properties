actors.buffs.championhero$growing.desc=英雄祝福擁有額外精準、躲避、近戰傷害與傷害減免。\n\n精準、躲避、近戰傷害加成：%1$d%%\n傷害減免：%2$d%%\n\n剩餘回合時長：

