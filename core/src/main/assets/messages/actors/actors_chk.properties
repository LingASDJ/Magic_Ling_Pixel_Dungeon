actors.mobs.ebonymimic.name=黑檀寶箱怪
actors.mobs.ebonymimic.reveal=那裡有一個寶箱怪！
actors.mobs.ebonymimic.hidden_name=可疑的輪廓
actors.mobs.ebonymimic.hidden_desc=那裡似乎有什麼東西，但它幾乎是完全透明的。
actors.mobs.ebonymimic.desc=寶箱怪是一種能隨意改變外形的魔法生物。在地牢裡它們幾乎一直以寶箱形態出現，因為這樣總能吸引疏於防備的冒險家。\n\n黑檀寶箱怪是能使自身變得幾乎隱形的極強寶箱怪。它們會潛伏在冒險家可能與之互動的事物上，不過它們也含有屬於自己的財寶。


actors.mobs.dragon.piraland.name=變異食人魚
actors.mobs.dragon.piraland.desc=這些原本溫和的動物因為異常的能量波動，變得暴躁且危險。現在它們甚至可以離開水的束縛捕食周圍的一切生物作為食物。\n\n_特殊效果：在水上行走時移速提升10%_

actors.mobs.dragon.ricerat.name=糯米老鼠
actors.mobs.dragon.ricerat.desc=來自地下的異變已經連老鼠也被感染到了，現在它們聞起來似乎有一股糯米的味道，但仍然具有非常大的威脅。\n\n必須尋找到異變源頭並處理問題源頭才能解決此次異變。
actors.mobs.dragon.ricerat.frost_kill=神秘的力量將你衝擊成粉碎……

actors.mobs.dragon.pirahaking.name=始祖食人魚-魚人號
actors.mobs.dragon.pirahaking.desc=自己辜負的，不可挽回。閉上眼，擁抱黑暗。\n\n一聲嘆息，任由絕望瀰漫。\n\n名利，責任，理想，一切在這裡結束。\n\n它似乎有多種情感混雜在一起，也許這就是異變的根本原因。擊敗魚人號，讓這一切重回寂靜。
actors.mobs.dragon.pirahaking.spear=寒冷將會“伴你同行”。
actors.mobs.dragon.pirahaking.nowater=魚人號擱淺了！但它進行了傳送！
actors.mobs.dragon.pirahaking.notice=我會讓你的靈魂與我們共舞！
actors.mobs.dragon.pirahaking.leap=靜靜等待毀滅的降臨吧。
actors.mobs.dragon.pirahaking.teleport_away=任何區域都是我行走的證明！
actors.mobs.dragon.pirahaking.defeated=…………

levels.rooms.standard.bloodcrystalroom$bloodcrt.name=猩紅結晶
levels.rooms.standard.bloodcrystalroom$bloodcrt.desc=猩紅結晶將週期性給予全敵人各種增幅效果，從以下效果抽取\n\n_-_1.憤怒：一股猛烈的怒火在你體內燃燒，增加你50%的物理攻擊傷害。\n_-_2.奧術護盾20點，可隨時間衰減。\n_-_3.磷火審判10回合，可隨時間衰減。\n_-_4.免疫魔法效果10回合，可隨時間衰減。\n_-_5.火焰之力15回合，可隨時間衰減。\n_-_6.晶觸之力15回合，可隨時間衰減。
levels.rooms.standard.bloodcrystalroom$bloodcrt.desc_info=當前樓層的結晶將_每%s回合_給予全敵人增益

actors.mobs.npcs.zero.zerodreamshop.name=蘭夢洛
actors.mobs.npcs.zero.zerodreamshop.desc=來路不明的時裝商人，售賣可以讓你搖身一變的時裝。
actors.mobs.npcs.zero.zerodreamshop.message1=你好，歡迎來到我的時裝商店。
actors.mobs.npcs.zero.zerodreamshop.message2=多買點新衣服，你也會新的感覺哦。
actors.mobs.npcs.zero.zerodreamshop.message3=要想購買時裝，你需要用一種藍色鈷幣與我交換。
actors.mobs.npcs.zero.zerodreamshop.message4=不同的商品鈷幣價格不同，歡迎你前來挑選。

actors.mobs.npcs.zero.zerodreamshop.descx=請隨意挑選，日後還會更新更多時裝。\n\n啟用時裝後，請到選擇角色界面切換皮膚。\n\n皮膚一旦生效後全局生效，護甲無法再影響皮膚狀態。
actors.mobs.npcs.zero.zerodreamshop.no=你的鈷幣不足，請有足夠的鈷幣再回來購買。
actors.mobs.npcs.zero.zerodreamshop.no_skin=你並沒有時裝自選憑證！
