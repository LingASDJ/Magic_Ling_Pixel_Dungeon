###Gold Mobs

actors.mobs.gold.goldmob.infos=_金蝶模式特殊怪物，需要小心應對。_

actors.mobs.gold.giantworm.name=巨型蠕蟲
actors.mobs.gold.giantworm.desc=叢林的汙染越來越嚴重，這些蠕蟲變得如此巨大，它們的攻擊有機率撕碎敵人的傷口，並恢復一定的血量。

actors.mobs.gold.mayfly.name=蜉蝣
actors.mobs.gold.mayfly.desc=這些遊行生物會慷慨的為其他目標施以治療，不死不休。\n\n蜉蝣會對周圍的友軍施加微弱的治療效果。

actors.mobs.gold.prisoner.name=囚犯
actors.mobs.gold.prisoner.desc=地下監獄的主要服務對象，在秩序失控後這些大塊頭得以暫時從牢房中解脫，不過還是難逃與獄警們互相對抗的宿命，儘管他們都不像原來一樣那麼理智了。\n\n囚犯還記得監獄裡的警察們，如果他們碰巧一同在場，則他的目標暫時不會指向你。
actors.mobs.gold.prisoner.kill=你被囚犯痛毆…

actors.mobs.gold.drake.name=地底亞龍
actors.mobs.gold.drake.desc=龍與類蜥蜴型生物結合而生出的亞龍種，喜歡埋在地底睡覺，但起床氣不小。\n\n你的任何攻擊手段都沒辦法伸到土裡。
actors.mobs.gold.drake.kill=地底亞龍殺害了你…
actors.mobs.gold.drake.rock_punk_kill=地底亞龍鑽地拱出的土石殺害了你…
actors.mobs.gold.drake.reveal=你觸怒了這條亞龍，趕快逃開！
actors.mobs.gold.drake.get_close=當靠近此地時，你發覺腳下的地板有些鬆動，還是不要接近那個裂縫比較好
actors.mobs.gold.drake.shock= %s 被地底亞龍的鑽地擊退了！
actors.mobs.gold.drake.revealing=你能感覺到什麼東西要來了......

actors.mobs.gold.artillerist.name=矮人炮手
actors.mobs.gold.artillerist.desc=矮人軍隊中的另類，他們更擅長鼓搗火藥而非去空手禦敵和釋放法術，幸運的是威力不俗，準頭也尚可。\n\n小心他們的重炮！\n\n會操縱便攜迫擊炮來對以你為中心的位置施行炮擊。
actors.mobs.gold.artillerist.kill=你被矮人炮手殺害…
actors.mobs.gold.artillerist.bomb_party_kill=你被炮火轟飛…

actors.mobs.gold.gnolltwilight.name=暮光豺狼
actors.mobs.gold.gnolltwilight.desc=無論你怎麼看，這個怪物都不像豺狼。它的眼睛閃爍著令人毛骨悚然的藍色，皮膚蒼白，在地牢的陰影中微微閃爍。它的挎包裡有一大堆飛鏢，上面裝有不同的毒藥。這些毒藥不會對人體造成傷害，但一定會讓你生不如死...

actors.mobs.gold.boomskull.name=亡魂殘軀
actors.mobs.gold.boomskull.desc=亡魂殘軀是從那些悲慘的冒險者及地牢原住民屍骨的聚合物產生的，來自下層地牢的邪惡力量將它們從死亡中喚起。它們十分脆弱，因此通常使用自爆襲擊入侵者。\n\n它們由於是惡靈轉變而成，因此任何生物都不可能在它面前蟄伏。


actors.mobs.gold.royalguard.name=國王衛兵
actors.mobs.gold.royalguard.desc=矮人國王的最精銳衛隊，他們配備著國庫中各式各樣的武器，只對矮人王國唯一的國王誓死效力。
actors.mobs.gold.royalguard.equipment=你能看到他們手中拿著 _%s_  ，還是小心為上。
actors.mobs.gold.royalguard.kill=你被持有 %s 的衛兵屠戮…

actors.mobs.gold.gnollblind.name=老年豺狼
actors.mobs.gold.gnollblind.desc=豺狼是鬣狗狀的類人生物。它們在叢林和地牢遊蕩，不時向上行動試圖向地表發起進攻。有些豺狼因為叢林的感染或過於年老而視力下降，這意味著要偷襲或伏擊它們非常容易。

actors.mobs.gold.goblinshaman.name=哥布林祭司
actors.mobs.gold.goblinshaman$shamanshield.desc=祭司通常被認為是哥布林中最強大的個體......但哥布林卻不是。由於魔法在地牢中很常見，很多哥布林都開始利用魔法。這個哥布林的魔法可以增加附近盟友的防禦力。
actors.mobs.gold.goblinshaman$shamanstrength.desc=祭司通常被認為是哥布林中最強大的個體......但哥布林卻不是。由於魔法在地牢中很常見，很多哥布林都開始利用魔法。這個哥布林的魔法可以增強附近盟友的力量，使他們的攻擊更加致命。
actors.mobs.gold.goblinshaman$shamanregen.desc=祭司通常被認為是哥布林中最強大的個體......但哥布林卻不是。由於魔法在地牢中很常見，很多哥布林都開始利用魔法。這個哥布林的魔法能治癒附近的盟友。
actors.mobs.gold.goblinshaman$shamanfake.desc=祭司通常被認為是哥布林中最強大的個體......但哥布林卻不是。由於魔法在地牢中很常見，很多哥布林都開始利用魔法。這隻哥布林的魔法並非真正的魔法，他似乎是在模仿 "魔音"，以顯示自己的聰明。也就是它在濫竽充數，除此之外毫無用處。

actors.mobs.gold.hermitcrab.name=寄居蟹
actors.mobs.gold.hermitcrab.desc=螃蟹找到了一個巨大的殼來生存。這些螃蟹比普通的螃蟹要堅硬得多，它們的外殼可以保護它們免受打擊，甚至可以讓螃蟹免疫最微弱的攻擊。但一旦外殼被打破，螃蟹的防禦力就會降到 0，讓你可以輕鬆地殺死它。
actors.mobs.gold.hermitcrabnoshell.name=寄居蟹
actors.mobs.gold.hermitcrabnoshell.desc=一隻完全沒有防衛能力的寄居蟹，它的殼被打破了。任何寄居蟹都會在殼破裂發生後的短時間內體驗到最原始的恐懼。

actors.mobs.gold.demonlord.name=惡魔領主
actors.mobs.gold.demonlord.desc=古神的高級奴僕，它們統領著古神之下的一切惡魔。面對惡魔領主的時候不純粹即是危險，但是沒有任何冒險者能就這樣面對古神，說明這是個兩難的難題。
actors.mobs.gold.demonlord.kill=惡魔領主輕易的殺死了你…
actors.mobs.gold.demonlord.damage_boost=當前惡魔領主傷害增幅 _%d_ %%。

actors.mobs.gold.gnollthrower.name=豺狼前哨兵
actors.mobs.gold.gnollthrower.desc=豺狼是鬣狗狀的類人生物。它們在叢林和地牢遊蕩，不時向上行動試圖向地表發起進攻。豺狼前哨兵是更加敏捷的豺狼，他們可以使用石頭從遠處攻擊，通常在豺狼族群中扮演守衛的角色。

actors.mobs.gold.tribemanold.name=豺狼悍匪
actors.mobs.gold.tribemanold.desc=寒冷的地帶正是它們鍛鍊的好地方，據說它們手中的武器就是關刀的設計原形，切記小心！

actors.mobs.npcs.extra.pinkfox.name=夏漁霧溟
actors.mobs.npcs.extra.pinkfox.desc=一位幻化為人型的九尾狐狸，據說掌握金蝶的魔法，可以提供金蝶法陣為你提供嬗變法則。

actors.mobs.npcs.extra.pinkfox.message1=你好，我是夏漁霧溟。看起來你手裡有一個金蝶秘卷，這是她的東西，但不知道為什麼現在在你這裡……\n\n另外，此次冒險危機四伏，我將立刻給予你三個0級飾品。
actors.mobs.npcs.extra.pinkfox.message2=並且，你似乎被她選中了，她正在看著你是否能趟過這次試煉之路……
actors.mobs.npcs.extra.pinkfox.message3=我會根據你的路程評估你的_金蝶嬗變次數_，初始送你兩次，你每擊敗一個強大的敵人獲得一次金蝶嬗變機會……，你可以根據你的狀態欄查閱你的嬗變次數以及任務板狀態！
actors.mobs.npcs.extra.pinkfox.message4=你在之後還會多次見到我，但是我後面不會在入口迎接你，無論如何，祝你一路順利！

actors.mobs.npcs.extra.pinkfox.message5=很抱歉你現在沒有任何嬗變次數，我也是和她履行了契約了的，私自違約她可能會很不高興！\n\n請你完成任務板上的任務後獲得更多嬗變次數再來找我！

actors.buffs.status.questgold.name=金蝶委託任務板
actors.buffs.status.questgold.desc=各種委託都在這裡，完成委託，可以獲得更多嬗變次數！

actors.buffs.status.questgold.ghost=\n基礎任務：_完成後追加1次嬗變_\n\n悲傷幽靈委託：獵殺行動-_未完成_
actors.buffs.status.questgold.ghost_yes=\n基礎任務：_完成後追加1次嬗變_\n\n悲傷幽靈委託：獵殺行動-_已完成_

actors.buffs.status.questgold.wand=老魔杖匠委託：搜尋行動

actors.buffs.status.questgold.dragon=紅龍之王委託：殲滅行動-_未完成_
actors.buffs.status.questgold.dragon_yes=紅龍之王委託：殲滅行動-_已完成_

actors.buffs.status.questgold.dk=擬態之王委託：完整珍寶-_未完成_\n
actors.buffs.status.questgold.dk_yes=擬態之王委託：完整珍寶-_已完成_\n

actors.buffs.status.questgold.bm=巨魔鐵匠委託：礦洞歷險-_未完成_
actors.buffs.status.questgold.bm_yes=巨魔鐵匠委託：礦洞歷險-_已完成_

actors.buffs.status.questgold.im=小惡魔的委託：狩獵徽記

actors.buffs.status.questgold.boss=常態事務：_獵殺每層Boss_ *每次追加1次嬗變，且重設所有嬗變升級權限。*

actors.buffs.status.questgold.random_1=\n隨機任務1：_石像毀滅者_\n\n【摧毀一個常規石像獲得1次嬗變】\n
actors.buffs.status.questgold.random_2=\n隨機任務2：_金蝶見證者_\n\n【累計摧毀15個金蝶特殊怪物獲得1次嬗變，每大層可觸發此效果至多1次】\n
actors.buffs.status.questgold.random_3=\n隨機任務3：_和平主義者_【在擊敗Boss後,總擊殺數_包含Boss_20/35/50/70怪物即可獲得1次嬗變】\n

actors.buffs.status.questgold.gold=當前可在九尾狐處嬗變總次數為：_%s次_

actors.buffs.status.questgold.ws=你當前總升級次數為_%s次_，武器/神器/法杖/戒指 升級後不可再次升級，必須完成常態事務！

actors.buffs.status.questgold.yes=可升級
actors.buffs.status.questgold.no=_已使用_

actors.mobs.npcs.zero.xiayuan.name=孟冬下元
actors.mobs.npcs.zero.xiayuan.desc=一位斗篷下的神秘人，似乎在說地牢決鬥的事情……
actors.mobs.npcs.zero.xiayuan.a_message1=新面孔呢，來把地牢牌嗎？哦，你沒有卡組啊。
actors.mobs.npcs.zero.xiayuan.a_message2=沒關係，送你一個卡包
actors.mobs.npcs.zero.xiayuan.a_message3=希望你旅途一切順利。

actors.mobs.npcs.zero.xiayuan.b_message1=祝你地牢之旅一路順風，有機會再見的話，一定要來一把地牢牌哦。

actors.mobs.npcs.zero.xiayuan.b_message2=篝火真是溫暖啊，好久沒回無風林了。

actors.mobs.npcs.zero.xiayuan.c_message1=恭喜呀，能從地牢回來的也一定是佼佼者，有空來無風林坐坐啊


actors.mobs.npcs.zero.dreamlezi.name=曉夢
actors.mobs.npcs.zero.dreamlezi.desc=一位來自未知世界的訪客……
# 對話
actors.mobs.npcs.zero.dreamlezi.messages1=你好啊，我是曉夢。
actors.mobs.npcs.zero.dreamlezi.messages2=我正在進行“創作”……有興趣看看我的作品嗎？
actors.mobs.npcs.zero.dreamlezi.messages3=傳說書籍？你想要那個？那裡面的故事老沒意思了。
actors.mobs.npcs.zero.dreamlezi.messages4=你需要物資上的幫助？也不是不行。
#首次提醒 再次點擊將直接扣除720金幣
actors.mobs.npcs.zero.dreamlezi.no_gold=我可以為你提供一些強大的助力，但不是免費的。要做筆交易嗎？
## 後續對話
actors.mobs.npcs.zero.dreamlezi.roll1=拿上這個吧。注意這個只能在0層使用哦。
actors.mobs.npcs.zero.dreamlezi.roll2=你怎麼還不前往地牢？快踏上征途！



# Gorgon
actors.mobs.gold.gorgon.name=蛇髮女妖
actors.mobs.gold.gorgon.desc=曾被放逐到地獄的高危生物，原本銳利到實質的石化視線其威力被地獄侵蝕到十不存一，但許多惡魔和冒險者也不敢貿然侵擾她。
actors.mobs.gold.gorgon.kill=你被銳利的凝視殺死…
actors.mobs.gold.gorgon$petrification.ondeath=你已經被完全石化…
actors.mobs.gold.gorgon$petrification.name=石化
actors.mobs.gold.gorgon$petrification.desc=你能感覺到身體在變重......\n\n 當前石化累計程度：_%d_ %%



