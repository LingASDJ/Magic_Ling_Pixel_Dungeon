actors.mobs.bosses.crossdiedtower.desc=發射神秘的雷射，對敵人造成傷害……

actors.mobs.bosses.firemagicdied.name=濁焰魔女-蓮娜
actors.mobs.bosses.firemagicdied.desc=雪凜峽谷的守護神，商人們的老大。因為你的搶劫商店一事，一場惡戰不可避免，無論你有什麼理由，先打一架再說吧。
actors.mobs.bosses.firemagicdied.go=%s,吾乃濁焰的化身,你必將受到正義的審判……

actors.mobs.bosses.firemagicdied.cold=周圍的空氣正在變冷……
actors.mobs.bosses.firemagicdied.wakeup=冰雪魔女已甦醒！
actors.mobs.bosses.firemagicdied.sister=妹妹？算了，現在還不是閒談的時候。讓我們一起審判%s吧。
actors.mobs.bosses.firemagicdied.sad=妹妹！為什麼就這樣消失了，你原來也是幻象嗎？那你，%s，也和她一起陪葬吧！

actors.mobs.bosses.firemagicdied.notice=你的行為,必將受到懲罰!
actors.mobs.bosses.firemagicdied.died=%s,你究竟是誰……
actors.mobs.bosses.firemagicdied.!!!=審判,降臨!
actors.mobs.bosses.firemagicdied.active=你自認為能拯救一切嗎?
actors.mobs.bosses.firemagicdied.died_kill=%s,你想逃去哪裡呢?
actors.mobs.bosses.firemagicdied.buff_all=……
