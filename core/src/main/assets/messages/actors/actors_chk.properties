actors.mobs.bloodbat$bloodbatrecharge.name=血影充能
actors.mobs.bloodbat$bloodbatrecharge.desc=小血影正在充能，等待下一次和主人並肩作戰的時候！\n\n剩餘充能時長:%s回合.

actors.mobs.bloodbat.name=血影蝙蝠
actors.mobs.bloodbat.desc=極影鈴虹的隨身伙伴，為了主人的安全將會讓一切試圖傷害主人的傢伙萬劫不復。\n\n它的能力和主人緊密相連，主人的成長也會讓小血影成長！



actors.buffs.halomethaneburning.name=磷火纏身
actors.buffs.halomethaneburning.heromsg=磷火像惡魔一樣纏在了你的身上！
actors.buffs.halomethaneburning.burnsup=%s被燒的渣都不剩了！
actors.buffs.halomethaneburning.ondeath=你被磷火纏身燃燒的折磨至死…
actors.buffs.halomethaneburning.rankings_desc=無法逃脫磷火纏身的痛苦
actors.buffs.halomethaneburning.desc=沒什麼比被磷火纏身更痛苦了。 \n\n磷火會每回合都會造成傷害直到它被液體撲滅或者自行消散。磷火會在你進入水中時熄滅，打碎藥瓶產生的磷火也具有同樣的效果。 \n\n此外，磷火還會點燃所有接觸到的可燃地形（以及可燃地形上的可燃物）。 \n\n剩餘的燃燒效果時長：%s回合\n\n]相比於一般的火焰，磷火更加危險且更加致命]

# HellBurning 地獄火Buff
actors.buffs.hellburning.name=地獄火
actors.buffs.hellburning.heromsg=源自地獄的高熱吞噬了你！
actors.buffs.hellburning.burnsup=你的%s化為了灰燼……
actors.buffs.hellburning.ondeath=地獄火將你徹底焚滅…
actors.buffs.hellburning.desc=你被地獄火纏身，每回合都會受到火焰傷害,水中可以熄滅地獄火。\n\n剩餘的燃燒效果時長：%s回合
actors.buffs.hellburning.effect_desc=怪物被施加_磷火_時替換為<#E94134>地獄火<RGB>。攜帶地獄火的怪物每回合受到<#E94134>%s%%最大生命值<RGB>的魔法傷害，無精英/突變詞條則為真實傷害。\n\nBoss攜帶時每回合受到<#E94134>%s點魔法傷害<RGB>並清空護盾，地獄火可像磷火一樣傳播。
actors.blobs.hellfire.desc=地獄之景於此具現

actors.buffs.sunfire.name = 烈陽標記
actors.buffs.sunfire.desc = 這個敵人正受到烈陽的烘烤，其受到來自其他迷你太陽的傷害將獲得加成


actors.buffs.frostburning.name=霜火極寒
actors.buffs.frostburning.heromsg=霜火覆蓋了你的全身，你冷的不行了！
actors.buffs.frostburning.burnsup=%s被霜火凍成了冰塊！
actors.buffs.frostburning.ondeath=你被霜火極寒凍死了…
actors.buffs.frostburning.rankings_desc=霜火極寒將你凍死了……
actors.buffs.frostburning.desc=沒有什麼比被霜火更痛苦了。 \n\n霜火會每回合都會造成傷害直到它被液體撲滅或者自行消散，且會減緩燃燒者的移速。霜火無法用水熄滅，打碎藥瓶產生的霜火也具有同樣的效果。 \n\n剩餘的燃燒效果時長：%s回合\n\n_相比於一般的火焰，霜火更加致命也更加危險_

actors.buffs.halofireimblue.name=磷火審判
actors.buffs.halofireimblue.desc=你被灌注了磷火的力量！\n\n所有物理攻擊都可以使敵人磷火纏身。與此同時你對磷火,火焰完全免疫。\n\n剩餘磷火審判效果時長：%s回合

actors.mobs.slimeprincess.name=史萊姆公主
actors.mobs.slimeprincess.notice=站住!入侵者!
actors.mobs.slimeprincess.defeated=你的行為會被世人銘記!
actors.mobs.slimeprincess.!!!=!!!
actors.mobs.slimeprincess.pumpup=史萊姆公主正在準備發射雷射
actors.mobs.slimeprincess.enraged=你為何要繼續前進？
actors.mobs.slimeprincess.gluuurp=讓我看看你的能耐吧，凡人！

actors.mobs.slimeprincess.rankings_desc=成為史萊姆公主的傀儡
actors.mobs.slimeprincess.desc=史萊姆公主，一個比Yog更強大的存在。她的力量誕生於300年前翼綾的手中,是翼綾曾經的寵物精靈。因為那場大火，翼綾從此了無音信。而她也來到了這個無人問津的古堡，在這裡沉睡著，直到你的到來……吵醒了這個上古原始精靈……

