actors.mobs.bosses.dwarfmaster.no_rose=矮人武將:她的力量不能在這裡幫助你!
actors.mobs.bosses.dwarfmaster.no_fire=矮人武將:免疫火焰？這裡不允許你這樣!
actors.mobs.bosses.dwarfmaster.no_inst=矮人武將:面對我,不要躲在暗處!

actors.mobs.dimandmimic.name=鑽石寶箱怪
actors.mobs.dimandmimic.desc=寶藏迷宮的時空非常混亂，這很有可能是擬態之王幼年的時候……\n\n但無論怎麼樣，我們都應該拿了寶藏離開這個是非之地……

actors.mobs.bosses.dmzero$diedblobs.desc=黑色的毒霧盤旋在這裡
