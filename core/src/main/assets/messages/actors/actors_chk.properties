actors.mobs.greendiamndmimic.name=翡翠寶箱怪
actors.mobs.greendiamndmimic.reveal=哦！這不是真正的綠寶石寶箱，你被耍了！！！
actors.mobs.greendiamndmimic.hidden_name=綠寶石寶箱
actors.mobs.greendiamndmimic.hidden_desc=打開前你是看不見裡面有什麼的！
actors.mobs.greendiamndmimic.desc=寶箱怪是一種能隨意改變外形的魔法生物。在地牢裡它們幾乎一直以寶箱形態出現，因為這樣總能吸引疏於防備的冒險家。\n\n翡翠寶箱怪與黑檀類似，但更加危險。一旦有人去嘗試開啟它，將會造成一次巨大傷害並附帶中毒/殘廢/失明/三種效果其中一種，並發出警報，在死亡前會自爆。\n\n擊敗綠寶石寶箱怪必定獲得1-2次額外補給。
actors.mobs.greendiamndmimic.explo_kill=你被翡翠寶箱怪的爆炸殺掉了……

custom.seedfinder.seedfinder.lengds=傳說武器

