### RLPT
actors.mobs.rlpt.gunhuntsman.name=血月獸型獵人
actors.mobs.rlpt.gunhuntsman.desc=半人半獸的殘暴生物。手中持有一把獵槍，可以發射出極具威力的燃燒彈，如果命中敵人將會造成燃燒效果。\n\n他曾是一名正常的賞金獵人。地牢中的恐怖之物將他侵蝕，在意識潰散殆盡後，這裡只剩僅存癲狂的人形野獸。
actors.mobs.rlpt.gunhuntsman.reload_desc=獵人正在重新裝彈,在裝彈時他會避開你。\n_-_本次裝彈剩餘：%s回合.
actors.mobs.rlpt.gunhuntsman.reload=重新裝彈中……
actors.mobs.rlpt.gunhuntsman.fuck=你TM的見鬼去吧……

actors.mobs.rlpt.drterror.name=恐怖博士
actors.mobs.rlpt.drterror.desc=這位可憐人曾經是一位赫赫有名的博士，因為一次禁忌實驗，他被地表三巨頭流放到了這裡。而很不幸的是，他被流放後被困在了一個扭曲的時間線，只有極少數人才能看見這位博士……\n\n拯救他或是殺死他，對他而言都是一種解脫吧……
actors.mobs.rlpt.drterror.thanks=謝謝你……我終於得到解脫了……

actors.mobs.rlpt.drterror$bombtech.name=自爆意象體
actors.mobs.rlpt.drterror$bombtech.desc=恐怖博士來到這裡後遭到了恐怖的詛咒，如果你嘗試去攻擊他，詛咒就會被啟動，產生一個詛咒意象體。\n\n要想徹底拯救或者擊敗恐怖博士，或許你需要更強的淨化詛咒的力量才能幫助這位可憐人亦或者是物 理 超 度 。

### NIGHT

actors.buffs.status.nightorday.name3=早晨
actors.buffs.status.nightorday.desc3=太陽升起，屬於怪物的黑夜已經過去。同時夜晚部分怪物的能力將消失。\n\n英雄移速提升10%，物理傷害提升10%，傷害減免8%

actors.buffs.status.nightorday.name2=正午
actors.buffs.status.nightorday.desc2=太陽高掛，你感覺非常暖和。\n\n英雄移速提升10%，物理傷害提升10%，傷害減免8%

actors.buffs.status.nightorday.name=黃昏
actors.buffs.status.nightorday.desc=太陽漸漸西沉，月亮正在漸漸升起。\n\n英雄移速提升10%，物理傷害提升5%，傷害減免4%

actors.buffs.status.nightorday.name4=夜晚
actors.buffs.status.nightorday.desc4=夜幕已然降臨，部分怪物將會變得更加強大。\n\n夜晚怪物增益說明:\n\n_-_ 亡靈生物可以額外造成本次傷害1/3的流血或中毒\n_-_ 頭目和小頭目攻速提高25%\n_-_ 惡魔生物在攻擊時如自身沒有護盾，則有機率獲得額外護盾\n\n夜晚英雄增益說明：\n\n_-_ 移速提升10%\n\n以上所有情況在天亮後均會變化或消失。


### OOzeStateDead
actors.buffs.status.oozestatuedead.name=汙泥浸染
actors.buffs.status.oozestatuedead.desc=汙泥正在侵蝕你的身體，你應當盡快脫離<#006400>汙泥地塊<RGB>，否則後果不堪設想！\n\n以現在汙泥內部富營養的影響，你在_%1$s_點指標後將會遭到腐蝕，獲得_%2$s_點<#006400>腐蝕淤泥<RGB>負面效果。
actors.buffs.status.oozestatuedead.desc_level=當前<#6495ED>侵蝕指標<RGB>：%s。
actors.buffs.status.oozestatuedead.desc_interval=當前<#006400>淤泥效果<RGB>強度：%s。


###PETS

actors.mobs.pets.minisaka.name=薩卡班甲魚寶寶
actors.mobs.pets.minisaka.desc=在那次遠古遺跡決戰中，它已經耗盡了所有力量。現在它重獲了新生，但它已經忘記了一切。\n它第一眼見到的是你，它一定把你認成它的主人了。\n也好，這樣，沒有人再知道遠古遺跡，也沒有人知道曾經的海洋王者。\n\n它嚮往海洋，你一定能帶它出去。\n\n_這個寵物是一個觀賞性寵物，敵人不會攻擊它，它也不會攻擊敵人，但可以妨礙敵人視線，並且它將一直追蹤你的路線。_

actors.mobs.pets.smalllight.name=微光嚮導
actors.mobs.pets.smalllight.desc=與玩家共享視野，生成後會自動尋找並前往離出口最近的路徑，遇到怪物擋路會將怪物牽拉至身後並使它陷入沉睡，到達出口後死亡並點亮出口房間的視野。
actors.mobs.pets.smalllight.checkboss=在樓層鎖定期間，不能召喚微光嚮導。

###HOLLOW
actors.mobs.bosses.morphs.unknown=???
actors.mobs.bosses.morphs.name=墨菲厄斯
actors.mobs.bosses.morphs.desc=游離於世界之外的未知實體,不屬於這裡的存在。在它面前任何攻擊都會被無效化，它究竟是誰？\n\n演出即將開始，你能完成這場盛大的演出嗎？

actors.mobs.npcs.hollow.deathrong.name=卡戎
actors.mobs.npcs.hollow.deathrong.desc=若要踏入地獄之大門，冥河便是你最後的阻礙。\n\n她在這裡守護著一切，你只需要付出一些身外之物，她就能保你安全渡過冥河。

actors.mobs.npcs.hollow.deathrongshop.name=卡戎
actors.mobs.npcs.hollow.deathrongshop.desc=她發現冥河的生意越來越難做，所以現在在萬聖大廳開起了商店，不久她就賺的盆滿缽滿。
actors.mobs.npcs.hollow.deathrongshop.talk=交談
actors.mobs.npcs.hollow.deathrongshop.buyback=卡戎小姐很爽快的退還了相應的商品。
actors.mobs.npcs.hollow.deathrongshop.talk_prison_intro=你好啊，歡迎來到我的商店。
actors.mobs.npcs.hollow.deathrongshop.talk_prison_warrior=你知道嗎，這裡的萬聖大殿其實不太真實……嘛，你當我說笑也行哦。
actors.mobs.npcs.hollow.deathrongshop.talk_prison_mage=你也是法師嗎？希望你最後不要墮落為魔女，大殿裡面那些魔女就是最好的例子……
actors.mobs.npcs.hollow.deathrongshop.talk_prison_rogue=我曾經見過你，小姐，只不過，你當時沒見過我。沒想到你已經長這麼大了，希望你還能知道你此行的目的。
actors.mobs.npcs.hollow.deathrongshop.talk_prison_huntress=小姐你好，你的身上有一種精靈的血脈……你莫非是祂的後代？或者是我多慮了……
actors.mobs.npcs.hollow.deathrongshop.talk_prison_duelist=小姐，你好！你似乎不屬於這個世界，你是訪問者之一嗎？

levels.rooms.standard.bigeyeroom.name=三思而後行
levels.rooms.standard.bigeyeroom.start_prompt=注意，這是一個特殊房間，並且你著實要進入此房間請確保有至少一把鐵鑰匙。否則請不要進入！
levels.rooms.standard.bigeyeroom.enter_yes=是的，我確定了
levels.rooms.standard.bigeyeroom.enter_no=不，我改變主意了

actors.mobs.npcs.hollow.typhon.name=提豐
actors.mobs.npcs.hollow.typhon.desc=萬妖之母，就連卡戎也懼怕三分。她來到這裡一定是有事情告訴你……
actors.mobs.npcs.hollow.typhon.rankings_desc=古堡征服者
actors.mobs.npcs.hollow.typhon.now_letgo=提豐一言不發……

custom.utils.plot.typhonplot.message1=你好，%s。
custom.utils.plot.typhonplot.message2=謝謝你幫我處理麻煩，這孩子不知道為什麼突然煩躁了起來，剛剛遇到了點急事，只能讓你獨自解決了。
custom.utils.plot.typhonplot.message3=說起來好久沒在這見到生者了，不過很可惜，今天冥土不開放拜訪，請回吧。
custom.utils.plot.typhonplot.message4=那麼，我剛剛的事情還沒處理完，有緣再會吧。
custom.utils.plot.typhonplot.message5=等等，那這座古堡......
custom.utils.plot.typhonplot.message6=這座古堡?哼，我現在就在調查這個，如果不出意外的話，這鬼地方就是墨菲厄斯—
custom.utils.plot.typhonplot.message7=嗨呀，堂堂萬妖之母，竟有心思管這等閒事......
custom.utils.plot.typhonplot.message8=墨菲厄斯，你還膽敢過來？
custom.utils.plot.typhonplot.message9=有何不敢?提豐大人啊，我可不是來找麻煩的。
custom.utils.plot.typhonplot.message10=你已經把北邊的省份攪的一團糟了，眾神難道還沒讓你吸取教訓？
custom.utils.plot.typhonplot.message11=不不不，我回來只是想邀請我的一些老朋友——包括您，來欣賞我們安排的幾場戲劇。
custom.utils.plot.typhonplot.message12=你在胡說八道什麼？
custom.utils.plot.typhonplot.message13=我可沒胡說八道，來，這是您的邀請函。時間和地點，您看邀請函上就知道了。還有您，重創了刻耳柏洛斯的勇士，這是您的一份。
custom.utils.plot.typhonplot.message14=我還要安排戲劇，就先走一步啦，哈哈哈哈哈!
custom.utils.plot.typhonplot.message15=真是個奇怪的人。
custom.utils.plot.typhonplot.message16=那麼，冒險者，後會有期了。

custom.utils.plot.hollow.hollowcityplot.name=奇怪的聲音
custom.utils.plot.hollow.hollowcityplot.message1=在血月的照耀下，曾經放在聖殿的水晶之心發生了奇特的變化。
custom.utils.plot.hollow.hollowcityplot.message2=聖殿變成了詭異古怪的古代城堡入口，而水晶之心也不翼而飛，一股不祥和邪惡的氣息從古堡入口中散發出來。
custom.utils.plot.hollow.hollowcityplot.message3=看來你被選中了，繼續前進吧，我們在古堡的盡頭等待你！
custom.utils.plot.hollow.hollowcityplot.message4=水晶之心似乎不在這裡，只有繼續選擇前進了！但這裡並沒有那麼太平，切記萬分小心！！！

actors.mobs.npcs.hollow.deathrong.message1=哈啊~又得上班了......
actors.mobs.npcs.hollow.deathrong.message2=咦?竟然是活人?
actors.mobs.npcs.hollow.deathrong.message3=沒想到來這值班還能碰見生者......
actors.mobs.npcs.hollow.deathrong.message4=你是來探親的，還是來尋仇的?\n\n【此為分支選項，必須做出抉擇！】

actors.mobs.npcs.hollow.deathrong.choice1=我是冒險家

actors.mobs.npcs.hollow.deathrong.message5=調查?
actors.mobs.npcs.hollow.deathrong.message6=有點意思，不過我可不知道用這個理由門衛會不會讓你過去。
actors.mobs.npcs.hollow.deathrong.message7=上船吧，今天心情好，渡一次河就收 666萬金幣吧，哼哼。

actors.mobs.npcs.hollow.deathrong.message8=是否支付 6660000 金幣?

actors.mobs.npcs.hollow.deathrong.button2a=是
actors.mobs.npcs.hollow.deathrong.button2b=否

actors.mobs.npcs.hollow.deathrong.message9a_1=好啦......
actors.mobs.npcs.hollow.deathrong.message9a_2=等等，你真的帶了666萬金幣?
actors.mobs.npcs.hollow.deathrong.message9a_3=你......
actors.mobs.npcs.hollow.deathrong.message9a_4=不不不，沒什麼，我這就帶你過去。
actors.mobs.npcs.hollow.deathrong.message9a_5=示意之後，你帶著巨量金幣走上了卡戎的船。
actors.mobs.npcs.hollow.deathrong.message9a_6=卡戎的船本來只是為了運送死者而設計的，而現在，它承受了相當於設計載重的數倍的重量。
actors.mobs.npcs.hollow.deathrong.message9a_7=行進到河中央時，卡戎越來越感覺力不從心，終於，整個船突然翻了過來。
actors.mobs.npcs.hollow.deathrong.message9a_8=卡戎抓住了船，而你，正和袋子與散落的金幣一起下沉。
actors.mobs.npcs.hollow.deathrong.message9a_9=在這河水的下面，是地獄，還是只是個普通的河床?
actors.mobs.npcs.hollow.deathrong.message9a_10=你最後也沒有知道。不過能夠確定的是，這裡的水仍然冰冷刺骨。
actors.mobs.npcs.hollow.deathrong.message9a_11=_遊戲結束 - 沉入阿刻戎河_

actors.mobs.npcs.hollow.deathrong.message9b_1=好啦好啦，我就開個玩笑，真的已經好久沒見到活人了。
actors.mobs.npcs.hollow.deathrong.message9b_2=上來吧，這次就不收你錢了。
actors.mobs.npcs.hollow.deathrong.message9b_3=反正平時接死人也不給錢，切。

custom.utils.plot.boatplot_end.message1=唉，我聽門那邊好像挺熱鬧的，和那個臭骷髏法師打起來啦？
custom.utils.plot.boatplot_end.message2=向卡戎講述剛剛發生的事。
custom.utils.plot.boatplot_end.message3=你是說，你打敗了刻耳柏洛斯，還見到了提豐和墨菲厄斯？
custom.utils.plot.boatplot_end.message4=戲劇......什麼戲劇？我從來沒聽說過......
custom.utils.plot.boatplot_end.message5=關於冥土外的古堡，你知道些什麼嗎？
custom.utils.plot.boatplot_end.message6=我不知道唉，我們擺渡人在冥土裡面有休息站，一般不會走到外面。
custom.utils.plot.boatplot_end.message7=但是你說外面連到了一座古堡？不應該啊......
custom.utils.plot.boatplot_end.message8=好吧，我也不想攪和這些事，他給你的邀請函你先拿回去吧……
custom.utils.plot.boatplot_end.message9=我還有事，先走了。祝你好運，%s。期待和你的下次見面！

actors.buffs.trueinvisibiity.name=讓我們出發吧！！！
actors.mobs.npcs.hollow.zeroboat.name=冥河擺渡船
actors.mobs.npcs.hollow.zeroboat.desc=乘上靈魂擺渡船，跨過冥河與人間的交界處，忘卻一切吧……

actors.mobs.bosses.morphs.message1=%s,你好。歡迎來到我的宅邸，我就是這裡的主人。
actors.mobs.bosses.morphs.message2=你與祂的戰鬥非常精彩，我表示非常的敬佩。然而，要想在這暗濤洶湧的世界中生存下來，光靠這樣是遠遠不夠的。
actors.mobs.bosses.morphs.message3=你擊敗的古神不過是祂萬萬分之一的碎片，在無法用時間衡量的虛空之中，這個碎片背叛了祂，來到這裡製造災禍。
actors.mobs.bosses.morphs.message4=閣下想知道我是誰？不用擔心，我為閣下準備了一場別開生面的旅行。這座古堡就是我對你的考驗。
actors.mobs.bosses.morphs.message5=……………………
actors.mobs.bosses.morphs.message6=我很期待你的表現，不要讓我們失望，希望你能完成這場盛大的演出……現在，就將時間交給你了……
actors.mobs.bosses.morphs.message7=%s，這不是……死亡是……真實的…… 請你一定要……
actors.mobs.bosses.morphs.message8=不要掉入他的圈套……

levels.hollow.cerdogbosslevel$yellowstar.name=黃昏結晶
levels.hollow.cerdogbosslevel$yellowstar.desc=這枚結晶散發著安寧卻詭譎的光芒，它現在正在等待入侵者的到來……\n\n如果你未啟用檢查點，點擊手動啟用Boss檢查點。

actors.mobs.bosses.cerberus.name=刻耳柏洛斯
actors.mobs.bosses.cerberus.desc=刻耳柏洛斯，隸屬於冥界的守門惡犬。它凝視周圍，目光充滿惡意和威脅。\n它身邊的環境異常寂靜，毫無生機。刻耳柏洛斯是死亡和絕望的代表，具有無比的威力，堪稱死亡的化身。
actors.mobs.bosses.cerberus.notice=死亡終將來到每一個人身邊，而你，是下一個！
actors.mobs.bosses.cerberus.dreamdied=噩夢終究會尋找到你的身上……
actors.mobs.bosses.cerberus.charging=將你的靈魂精華獻祭給我！
actors.mobs.bosses.cerberus.firewall=感受一下惡靈火牆的熱情！
actors.mobs.bosses.cerberus$rage.name=地獄歸來
actors.mobs.bosses.cerberus$rage.desc=刻耳柏洛斯的死亡已經不可避免，但它想拉你作為陪葬品！\n\n時間的推移或是外界的傷害都會消磨護盾。在護盾消散殆盡之際，刻耳柏洛斯會徹底消亡。\n\n剩餘的護盾：%d。
actors.mobs.bosses.cerberus.firewall_last5=惡靈火牆還有5回合將再次重燃。
actors.mobs.bosses.cerberus$notbrokenwall.desc=惡靈火牆存在期間，任何東西都無法逃離它的魔爪。在被惡靈火牆抓到後，將會被送往中心區域。
actors.mobs.bosses.cerberus$souldiedblobs.desc=靈魂汲取領域將對目標造成心魔損傷……，並且有機率給施法者添加奧術護盾。\n\n如果目標是偷渡過來的，則額外追加施法者相等體量的秘法護盾。
actors.mobs.bosses.cerberus$webblob.desc=噩夢纏繞將會在短暫延遲後纏繞所有範圍內的目標並造成真實傷害……
actors.mobs.bosses.cerberus.your_must_died=死亡……再生……毀滅……
actors.mobs.bosses.cerberus.defeated=%s,我記住你了……
actors.mobs.bosses.cerberus$dogguard.scorpion=哼？想逃？
actors.mobs.bosses.cerberus$dogguard.name=死魂守衛
actors.mobs.bosses.cerberus$dogguard.desc=刻耳柏洛斯的狀態已經非常不健康，這促使它召喚一個死魂守衛來助戰。\n\n守衛存在期間，每15回合自動抓取目標。

actors.mobs.bosses.hollow.deaddogcerberus.name=刻耳柏洛斯
actors.mobs.bosses.hollow.deaddogcerberus.desc=刻耳柏洛斯，隸屬於冥界的守門惡犬。它凝視周圍，目光充滿惡意和威脅。\n它身邊的環境異常寂靜，毫無生機。刻耳柏洛斯是死亡和絕望的代表，具有無比的威力，堪稱死亡的化身。
actors.mobs.bosses.hollow.deaddogcerberus.notice=死亡終將來到每一個人身邊，而你，是下一個！
actors.mobs.bosses.hollow.deaddogcerberus.dog_skills_one=刻耳柏洛斯正在打磨它的爪子！
actors.mobs.bosses.hollow.deaddogcerberus.combo_attack_hit=嚐嚐連環嘶咬的威力……

actors.mobs.bosses.hollow.deaddogcerberus$noarmordamage_bleedingnomalattack.name=磨牙吮血
actors.mobs.bosses.hollow.deaddogcerberus$noarmordamage_bleedingnomalattack.desc=刻耳柏洛斯在此狀態下，無視目標_50%%防禦_，且每次攻擊都會造成<#f00>自身傷害的25%%的流血效果<RGB>。\n\n剩餘效果時長：%s。
actors.mobs.bosses.hollow.deaddogcerberus.dog_see_you=看來你已經準備好接受死亡了……，%s！
actors.mobs.bosses.hollow.deaddogcerberus$deadhalofire.desc=在獄火中，目標將持續受到<#f00>真實傷害<RGB>。如果是目標是刻耳柏洛斯，則會受到_強力加成_。

actors.mobs.bosses.hollow.deaddogcerberus$souldead.name=靈魂震懾
actors.mobs.bosses.hollow.deaddogcerberus$souldead.desc=你的靈魂已經被吸入地獄，接下來，它的每次攻擊將會對目標造成<#f00>額外5點心魔損傷<RGB>……\n\n被靈魂震懾的你，感到<#f00>腳步非常沉重<RGB>……

actors.mobs.bosses.hollow.deaddogcerberus$superattack.name=殊死一搏
actors.mobs.bosses.hollow.deaddogcerberus$superattack.desc=看起來刻耳柏洛斯想對你發起全面攻擊，它將獲得_200%%攻擊力加成_和_100%%攻速加成_\n\n剩餘效果時長：%s。

actors.mobs.bosses.hollow.deaddogcerberus$cerberusbless.name=狩獵準備
actors.mobs.bosses.hollow.deaddogcerberus$cerberusbless.desc=刻耳柏洛斯已經磨好了它的爪子，現在在此效果結束前，它將無視目標<#FF0>50%%防禦<RGB>和額外獲得<#FF0>50%%額外精準<RGB>。\n\n剩餘效果時長：%s。

actors.mobs.bosses.hollow.firesuperdr.name=磷火再生
actors.mobs.bosses.hollow.firesuperdr.desc=刻耳柏洛斯來自地獄，因此在自己的<#0ff>特殊磷火<RGB>中不會受到傷害，並且<#F00>防禦大幅提升<RGB>以及每回合緩慢<#0F0>恢復生命<RGB>。\n\n重要提醒：再生的生命值也不會讓<#F00>刻耳柏洛斯的階段回退<RGB>，因此如果在後續階段刻耳柏洛斯恢復了更多生命值，則它將<#F00>更加具有威脅！<RGB>\n\n剩餘效果時長：%s。

actors.mobs.bosses.hollow.deaddogcerberus.leap=刻耳柏洛斯正在準備撲向你……

actors.mobs.bosses.hollow.bleedcrystal.name=凝血晶體
actors.mobs.bosses.hollow.bleedcrystal.desc=刻耳柏洛斯攻擊目標時將目標血液提取出來成為血晶，如果不盡快摧毀，將會帶來嚴重的後果……

actors.mobs.bosses.hollow.deaddogcerberus$bleedingsummoncoolown.name=凝血晶體召喚阻斷
actors.mobs.bosses.hollow.deaddogcerberus$bleedingsummoncoolown.desc=刻耳柏洛斯已經召喚了一個<#F00>凝血晶體<RGB>，如果在效果結束後<#F00>凝血晶體<RGB>仍然存在，則刻耳柏洛斯會將其吸收並變得更強，將會對目標造成<#F00>更高的傷害<RGB>。\n\n剩餘效果時長：%s。


custom.utils.plot.hollow.hollowendstoryplot.message1=呃啊，冒險家，你果然身手不凡。
custom.utils.plot.hollow.hollowendstoryplot.message2=但是，與我作對並不會給你帶來任何好處，我勸你還是......
custom.utils.plot.hollow.hollowendstoryplot.message3=墨菲厄斯，別做夢了。
custom.utils.plot.hollow.hollowendstoryplot.message4=幽寂......哼，我就知道冒險家身上的祝福是你給予的。
custom.utils.plot.hollow.hollowendstoryplot.message5=收手吧，你明知這一切不過是一場不切實際的夢，為何如此執著?
custom.utils.plot.hollow.hollowendstoryplot.message6=住嘴，你這個不折不扣的失敗品，你有什麼資格議論我的事業?!
custom.utils.plot.hollow.hollowendstoryplot.message7=屏障終破，提豐大人快要來了。
custom.utils.plot.hollow.hollowendstoryplot.message8=好，好啊。
custom.utils.plot.hollow.hollowendstoryplot.message9=那麼，你們，就都給我一起沉睡下去吧，哈哈哈哈——
custom.utils.plot.hollow.hollowendstoryplot.message10=%s，這裡就是最後了。
custom.utils.plot.hollow.hollowendstoryplot.message11=我......很高興能和你同行，但，你終歸不屬於這裡。
custom.utils.plot.hollow.hollowendstoryplot.message12=快醒來吧......你的故事，還在等待著你書寫......

#No Zuo No Die

actors.mobs.hollow.apprenticewitch.name=見習魔女
actors.mobs.hollow.apprenticewitch.desc=她曾是某魔法學院的學生，因為太過頑皮，沒能通過魔法考試，所以無法成為一名合格的法師。\n\n有些人會吸取教訓，繼續努力學習成為出色的法師，但她卻漸漸失去了對魔力的控制，境況逐漸墮落。如今，她只能作為一名見習魔女遊蕩在荒野之外，以捕食 過路人 的靈魂為樂。
actors.mobs.hollow.apprenticewitch.bye=拜拜~
actors.mobs.hollow.apprenticewitch.die=去死吧！
actors.mobs.hollow.apprenticewitch.oh_no=啊偶……
actors.mobs.hollow.apprenticewitch.love=這個見習魔女_至多再吃%s顆糖果_即可成為我方盟友。

actors.mobs.hollow.frankenstein.name=殘夢魔偶
actors.mobs.hollow.frankenstein.desc=遊蕩在萬聖大殿的未完成人偶，據說製作它們的主人因為它們失敗的外型和緩慢的速度最終拋棄了它們。它們已經陷入了癲狂之中，會尋找一切活著的生命，並撕碎他們的靈魂。\n\n_-_ 會額外造成 _元素損傷_，有機率進行_多次復活，至多兩次_ \n_-_ 類型:心魔損傷
actors.mobs.hollow.frankenstein.die_yes=#$%^&*%$#%&

actors.mobs.hollow.ghost_halloween.name=鬼魂
actors.mobs.hollow.ghost_halloween.desc=遊蕩在萬聖大殿的鬼魂，雖然無法對敵人造成傷害，但可以造成精神摧殘。\n\n鬼魂可能是曾經的冒險家，也有可能是未知的東西。\n\n隱身狀態下攻擊會攜帶9點心魔損傷\n_-_ 類型:心魔損傷
actors.mobs.hollow.ghost_halloween.hello=嘿，你好！

actors.mobs.hollow.pumking_ghost.name=南瓜頭鬼魂
actors.mobs.hollow.pumking_ghost.desc=遊蕩在萬聖大殿的南瓜頭鬼魂，雖然無法對敵人造成傷害，但可以造成精神摧殘。\n\n南瓜頭鬼魂是由邪惡能量轉變而成的產物，它比鬼魂更具威脅。\n\n隱身狀態下攻擊會攜帶12點心魔損傷和5回合失明\n_-_ 類型:心魔損傷
actors.mobs.hollow.pumking_ghost.hello=嘿，你好！

actors.mobs.hollow.pumkingbomber.name=南瓜薑餅人
actors.mobs.hollow.pumkingbomber.leap=南瓜薑餅人正準備瞄準目標
actors.mobs.hollow.pumkingbomber.desc=據說這薑餅人曾經是一位博士。他曾經嘗試將TNT和薑餅人進行結合，但顯然，實驗失敗了，這位博士的靈魂依附在這異形體上。\n\n南瓜薑餅人將會鎖定目標後進行跳躍，到達目標點立刻自爆，造成巨大範圍爆炸傷害。

actors.mobs.hollow.vampire.name=吸血蝙蝠
actors.mobs.hollow.vampire.desc=這些敏捷且堅韌的洞穴穹頂生物比看起來可怕地多。它們會透過每次成功的攻擊來恢復生命，從而擊敗比它們大得多的對手。

actors.mobs.hollow.vampire.true_name=吸血鬼
actors.mobs.hollow.vampire.true_desc=在古堡的幽暗深處，潛伏著一種極為危險的存在，它常常偽裝成吸血蝙蝠，悄無聲息地在陰影中飛行。只有在感知到人類氣息的瞬間，它才會揭開真實面目。其形態恐怖而扭曲，似人似獸，滿口尖牙，眼中閃爍著攝人的血色光芒。\n\n攻擊必定造成心魔損傷，且可能含有其他負面效果。\n_-_ 類型:心魔損傷

actors.mobs.hollow.hollowmimic.minames=南瓜燈
actors.mobs.hollow.hollowmimic.midescs=古堡中隨處可見的南瓜燈，你能看見它正在對你微笑，這讓你不免毛骨悚然。

actors.mobs.hollow.hollowmimic.cspx_name=虛無之牆
actors.mobs.hollow.hollowmimic.cspx_desc=外表看起來像地面，實則是古堡的神秘力量扭曲了牆壁。荒謬與無法理解就是古堡的魅力所在！\n\n旁白：等等這話似乎似曾相識，我好像唔……唔……（神秘的聲音：好啦好啦，別讓探索者知道的太多了哦）

actors.mobs.hollow.hollowmimic.name=南瓜牆怪
actors.mobs.hollow.hollowmimic.desc=南瓜牆怪也是擬態怪家族的一員，只不過，它們與它的寶箱怪近親不同的地方在於它們並不喜歡用寶箱勾引冒險者上鉤。\n\n它們更加喜歡讓冒險家放鬆警惕時倚靠牆壁時從背後來驚嚇冒險者，結合古堡的力量，冒險家的心魔損傷將迅速增長！！！

levels.cerdogbosslevel$diedcrused.name=亡魂祝福
levels.cerdogbosslevel$diedcrused.desc=因為你私自偷渡到對面，這讓卡戎很不高興。她使用了她的十分之一力量對刻耳柏洛斯進行了強化。\n\n亡魂祝福存在期間，Boss每隔50回合獲得50點護盾+秘法護盾，該效果會隨著時間而衰減。且刻耳柏洛斯的所有攻擊均附帶2-4點額外心魔損傷,傷害提升20%。

actors.mobs.hollow.butcher.name=電鋸狂人
actors.mobs.hollow.butcher.desc=電鋸狂人曾經也是一個冒險者，可現在由於各種原因，他已失去了神智。它徘徊這古堡周圍，尋找一切可以被撕碎的東西。\n\n_-_ 會額外造成 _元素損傷_ \n_-_ 類型:心魔損傷

actors.mobs.hollow.crumb.name=薑餅人
actors.mobs.hollow.crumb.desc=這是一個快樂的薑餅人，它徘徊在古堡中，倘若尋找到敵人，它就會”分享“它的快樂。\n\n它的攻擊將有機率加劇英雄的_飢餓_，且有機率偷取英雄的食物後逃到無人可看見的地方吃掉。\n\n擊敗薑餅人可以有效紓解飢餓，但也有可能加劇飢餓。
actors.mobs.hollow.crumb.stole_food=你的 %s 被調皮的薑餅人偷走了！
actors.mobs.hollow.crumb.carries=\n\n這個薑餅人攜帶著一個_%s_。明顯是從你身上摸來的……
actors.mobs.hollow.crumb.escapes=薑餅人在暗處吃掉了你的 %s ,並逃走了！

actors.mobs.npcs.hollow.morphsnpc.name=？？？
actors.mobs.npcs.hollow.morphsnpc.sname=
actors.mobs.npcs.hollow.morphsnpc.namex=墨菲厄斯
actors.mobs.npcs.hollow.morphsnpc.lingbag=來訪者，先把我給你的特殊口袋拾取起來再與我對話！
actors.mobs.npcs.hollow.morphsnpc.desc=看起來不像是這個世界的東西，它似乎正在等待著什麼……
actors.mobs.npcs.hollow.morphsnpc.message1=好了，女士們，先生們，十分感謝你們能賞臉參加我籌劃的戲劇。
actors.mobs.npcs.hollow.morphsnpc.message2=既然觀眾已經到齊——那麼。
actors.mobs.npcs.hollow.morphsnpc.message3=演出正式開始！
actors.mobs.npcs.hollow.morphsnpc.message4=墨菲厄斯就在那裡！
actors.mobs.npcs.hollow.morphsnpc.message5=冒險家，冒險家？
actors.mobs.npcs.hollow.morphsnpc.message6=<#f00>轉瞬之間，你感覺自己的意識脫離了身體......你突然置身於舞台之上！<RGB>

actors.buffs.status.scorebuff.name=小遊戲計分版-吃豆人
actors.buffs.status.scorebuff.desc=當前積分：%s分\n\n普通豆子還剩：%s個\n\n大豆子還剩：%s個\n\n拾取全部豆子，完成該小遊戲。

actors.buffs.status.scorebuff.name2=小遊戲計分版-推箱子
actors.buffs.status.scorebuff.desc2=當前積分：%s分\n\n當前消耗回合：%s\n\n此地圖，在_%s回合_前不扣分\n\n你還剩%s回合後開始扣分，_每回合-1分_，_每50回合的倍數-100分_。\n\n箱子全部移到目的位置，或者得分降為0。則完成該小遊戲。

actors.buffs.status.scorebuff.name3=小遊戲計分版-全面搜查
actors.buffs.status.scorebuff.desc3=當前積分：%s分\n\n搜查已經開始！\n\n你需要在這危機四伏的區域搜尋高價值物資，強大的敵人正蟄伏在陰影中巡邏。\n\n切勿戀戰！在限定回合內找到基地台、發送撤離信號 —— 唯有如此，才能順利離開這片險地！\n\n注意：在本圖，除鑰匙，所有物品拾取後將會轉化為價值，各類物品價值為自身價格的1/2；金幣價值為拾取量的1/4。\n\n在本地區死亡將立刻計算物品總價值，但獲取量只有先前的一半，行動超時也是如此。

custom.utils.plot.hollow.minigame.morphsallendplot.message1a=…………
custom.utils.plot.hollow.minigame.morphsallendplot.message2a=真是出人意料的……差勁。
custom.utils.plot.hollow.minigame.morphsallendplot.message3a=有聽到那來自觀眾席的嗤笑嗎？
custom.utils.plot.hollow.minigame.morphsallendplot.message4a=……你並沒有在認真的對待演出。
custom.utils.plot.hollow.minigame.morphsallendplot.message5a=我邀請了這麼多觀眾，不是為了讓他們看這些。
custom.utils.plot.hollow.minigame.morphsallendplot.message6a=是時候做出補救了……為演出再添一幕。

custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmannormalplot.message1b=…………
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmannormalplot.message2b=你是否意識到，你先前的表現並沒什麼觀賞性？
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmannormalplot.message3b=我很難判斷你是否花了心思。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmannormalplot.message4b=儘管如此，感謝你的參與。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmannormalplot.message5b=這何嘗不算一場滑稽戲呢？總歸還是有點樂趣。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmannormalplot.message6b=雖然我不準備讓你空手而歸，但你也不能為演出畫上句號。

custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanendplot.message1c=…………
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanendplot.message2c=演出色幕了。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanendplot.message3c=或許你認為，你證明了你擁有一位演員應有的素養。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanendplot.message4c=觀眾們為您獻上了掌聲，我代表觀眾們為您贈禮。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanendplot.message5c=但是，幕布落下，不代表演出結束。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanendplot.message6c=我認為你的演出乏善可陳，所以，我會親自指導你。

custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmangoodplot.message1d=…………
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmangoodplot.message2d=啊哈，你的演出看來廣受好評。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmangoodplot.message3d=觀眾們的熱情回應證明了你確實在演出上有著過人之處。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmangoodplot.message4d=你怎麼看，大明星？
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmangoodplot.message5d=或許你贏得了一部分觀眾的心，但遠未達到我的要求。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmangoodplot.message6d=所以，休息時間取消！

custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanverygoodlplot.message1e=…………
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanverygoodlplot.message2e=我想，對於你和觀眾來說，這都是一個令人印象深刻的夜晚。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanverygoodlplot.message3e=而我不止看到了一場盛大的演出。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanverygoodlplot.message4e=我看到了一顆冉冉升起的新星。你是值得投資的對象。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanverygoodlplot.message5e=所以，容我多言。

custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanpeactplot.message1f=…………
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanpeactplot.message2f=看來，演出結束了，但觀眾們還沒從中走出來。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanpeactplot.message3f=今夜令所有人都難以忘懷，包括我。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanpeactplot.message4f=你的演出已成藝術，此方天地之間恐無人能與您相較。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanpeactplot.message5f=……儘管如此，你從未從“舞台”中走出。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanpeactplot.message6f=擁有如此實力，卻受限於他人搭建的“舞台”，實在可惜。
custom.utils.plot.hollow.minigame.morphsallendplot$morphspacmanpeactplot.message7f=所以，我有一些更好的建議。

custom.utils.plot.hollow.morphsendtheaterplot.message1=先前勉強的演出，令我失望。
custom.utils.plot.hollow.morphsendtheaterplot.message2=不過還能強撐到表演結束，算你有些本事。
custom.utils.plot.hollow.morphsendtheaterplot.message3=所以來吧，%s，讓我們完成最後一幕！

custom.utils.plot.hollow.galaxyheartdeadendplot.message1=無論是什麼樣的冒險者，凡人，不應觸碰你無法理解之物！
custom.utils.plot.hollow.galaxyheartdeadendplot.message2=結束的時間到了。
custom.utils.plot.hollow.galaxyheartdeadendplot$redend.rankings_desc=古堡結局：猩紅謝幕

custom.utils.plot.hollow.morphsgodendtheaterplot.message1=冒險者，不，現在我應該用敬稱來稱呼您。居然能如此完美的完成演出，不愧是被選中之人。
custom.utils.plot.hollow.morphsgodendtheaterplot.message2=……
custom.utils.plot.hollow.morphsgodendtheaterplot.message3=我想邀請您成為我的“一部分”，您意下如何？
custom.utils.plot.hollow.morphsgodendtheaterplot.choice1=是
custom.utils.plot.hollow.morphsgodendtheaterplot.choice2=否
custom.utils.plot.hollow.morphsgodendtheaterplot.message4=哈哈哈，好，我也期待與您完成更多的表演。那麼現在，閉幕！
custom.utils.plot.hollow.morphsgodendtheaterplot.message5=……您當真以為，您有拒絕我的資本？看來，需要讓您親身體會什麼是虛無了！

custom.utils.plot.hollow.morphsgodendtheaterplot$shadow.rankings_desc=古堡結局：暗影邀約

levels.rooms.special.boilerroom.name=淵落古堡外傳
levels.rooms.special.boilerroom.quest_start_prompt=首先祝賀你，%s，找到了此外傳章節的真結局。不過，重複遊玩，做出不同的選擇，也許會發現此外傳的更多故事。你想遊玩哪一分支？\n\n遊玩冥河驚魂劇情線，你將討伐刻耳柏洛斯，體驗和它相關的劇情。\n\n遊玩猩紅劇院劇情線，你將討伐墨菲厄斯，體驗和祂相關的劇情。
levels.rooms.special.boilerroom.enter_1=冥河驚魂劇情線
levels.rooms.special.boilerroom.enter_2=猩紅劇院劇情線
levels.rooms.special.boilerroom.enter_no=稍後抉擇

actors.mobs.hollow.allsearch.helpteleportpoint.name=傳送法陣基點
actors.mobs.hollow.allsearch.helpteleportpoint.desc=啟用全部傳送法陣基點，_A/B傳送法陣基點_均處於開啟狀態後啟用撤離的傳送法陣。\n\n此基點_最多啟用兩次_，所有基點啟用後需要在_200回合內_到達撤離點。否則將需要_重新啟用_。

ui.virtualcontrols.reload=局內重設
ui.virtualcontrols.down_score=你使用了局內重設，分數將扣減100分。
ui.virtualcontrols.skip=跳過

actors.buffs.elementalbuff.basebuff.scarybuff.name=心魔損傷
actors.buffs.elementalbuff.basebuff.scarybuff.desc=萬聖大殿盤踞著一股邪惡的未知力量，這種力量會漸漸消耗目標的心智，使目標持續受到心魔損傷\n\n損傷帶來的傷痕會隨著時間的印記漸漸恢復。\n當前心魔損傷總占比：_%1$s%%_ (失控指標:100%%)\n\n
actors.buffs.elementalbuff.basebuff.scarybuff.no_effect=雖然有著心魔損傷的侵染，但你現在還算比較理智
actors.buffs.elementalbuff.basebuff.scarybuff.effect_1=心魔損傷正在讓你感到不自信，你的_精準下降至70%_
actors.buffs.elementalbuff.basebuff.scarybuff.effect_2=心魔損傷正在讓你感到恐懼，你的_物理傷害下降至65%_
actors.buffs.elementalbuff.basebuff.scarybuff.effect_3=心魔損傷正在讓你步履蹣跚，你的_全局移速下降20%_
actors.buffs.elementalbuff.basebuff.scarybuff.effect_4=心魔損傷正在讓你感到絕望，你的_力量下降2點_

actors.buffs.elementalbuff.basebuff.scarybuff.enemyname=心魔腐蝕

actors.buffs.elementalbuff.basebuff.scarybuff.enemydesc=心魔的詛咒腐蝕著你的敵人，任何被腐蝕的敵人_物理傷害_都會降低至80%%。當心魔損傷徹底爆發時，敵人將會受到_凋零_效果。\n\n注意：對敵方造成的元素損傷效果會降低，這個元素損傷每7回合降低1點。\n\n當前心魔損傷總占比：%1$s%% \n\n(失控指標:60%%)

actors.buffs.elementalbuff.damagebuff.scarydamagebuff.name=驚惶蝕心
actors.buffs.elementalbuff.damagebuff.scarydamagebuff.desc=長時間的心魔損傷讓你的心智幾近崩潰，將武器刺向自己的念頭無時無刻不在你腦海中盤旋。\n\n你感到十分焦慮與不安，似乎暗影正朝你的位置湧動。\n\n在此狀態下，力量-4，持續受到凋零狀態！飲用淨化或者治療藥劑可解除損傷！\n\n剩餘心魔損傷異常時長：%s回合。

actors.buffs.elementalbuff.damagebuff.scarydamagebuff.on_kill=你的心智達到了臨界點，心魔最終還是吞噬了你……

actors.buffs.elementalbuff.immunities.scaryimmunitiesbuff.name=禪心靜定
actors.buffs.elementalbuff.immunities.scaryimmunitiesbuff.desc=理性終究戰勝了自殘的念頭。\n\n你握緊了武器，再一次。\n\n剩餘免疫時間：%s回合。

###HOLLOWEND

actors.mobs.npcs.dragongirlblue.name=半龍女僕-小藍
actors.mobs.npcs.dragongirlblue.desc=身穿藍色禮服，站在捕夢幻境法陣之下。她正在這裡進行著祈禱……
actors.mobs.npcs.dragongirlblue.message1=感謝您來與我交談，%s。
actors.mobs.npcs.dragongirlblue.message2=祂是一位兇狠的神，祂曾在比這危險的多的環境生存了下去，晾祂的力量必能祝你度過此關。
actors.mobs.npcs.dragongirlblue.message3=林地生長於漫宿牆外，但每一個研學史學的人皆知，漫宿無牆。
actors.mobs.npcs.dragongirlblue.message4=漫宿無牆，愛亦無疆。
actors.mobs.npcs.dragongirlblue.quest_start_prompt=通往遠古遺跡的入口已經打開,如果你準備好了,就告訴我。\n\n記住，我會守護你。你可以隨時離開危險的遠古遺跡，千萬不要勉強自己，量力而行。
actors.mobs.npcs.dragongirlblue.enter_yes=我準備好了,小藍！
actors.mobs.npcs.dragongirlblue.enter_no=還沒有，讓我再緩緩。
actors.mobs.npcs.dragongirlblue.not_locked=你這裡還沒有鑰匙劍，我無法幫你開啟遠古遺跡的入口。
actors.mobs.npcs.dragongirlblue.exit_warn_none=冒險者，是不是這裡太危險了？你是準備離開遠古遺跡了嗎？
actors.mobs.npcs.dragongirlblue.exit_yes=是的，我確實準備離開。
actors.mobs.npcs.dragongirlblue.exit_no=不，我只是想上樓-_(子層初級無效)_
actors.mobs.npcs.dragongirlblue.exit_yes_2=我已確認想離開這裡。
actors.mobs.npcs.dragongirlblue.exit_no_2=我只是點錯了。

actors.mobs.npcs.dragongirlblue.cashout=_兌現（消耗全部調查點）：_，10調查點 = 一枚金幣。
actors.mobs.npcs.dragongirlblue.cashout_verify=好的，這是你的 %d 金幣。我已經沒有什麼東西給你了，祝你旅途順利。
actors.mobs.npcs.dragongirlblue.cashout_yes=給我金幣吧
actors.mobs.npcs.dragongirlblue.cashout_no=我再想想看

actors.mobs.npcs.dragongirlblue.no_anymore=冒險者，這就是我的全部了，祝你旅途順利。

actors.mobs.npcs.dragongirlblue.exit_boss_none=冒險者，您已獵殺了祂。現在你可以選擇繼續逗留或者離開這裡。\n\n記得來找我，我會給你應有的報酬。
actors.mobs.npcs.dragongirlblue.exit_yes_3=是的，我想離開這裡了。
actors.mobs.npcs.dragongirlblue.exit_no_3=我還想在這裡逗留一會。

actors.mobs.npcs.dragongirlblue.b_message1=是的 您要見證那遠古時代？好的……我尊重任何人的意願。
actors.mobs.npcs.dragongirlblue.b_message2=我們拜請守夜人，指引前路之神。但在那之前，我需要一個長得像鑰匙劍的道具幫忙。

actors.mobs.npcs.dragongirlblue.c_message1=冒險者，歡迎來到祂的居住之地。
actors.mobs.npcs.dragongirlblue.c_message2=許多年前，一場巨大的海嘯向這裡襲來，祂和它們被沖到了這裡，退潮之後，它們再也無法回到大海。
actors.mobs.npcs.dragongirlblue.c_message3=祂已經沉睡千年，你喚醒祂後一場惡戰不可避免，如果你能巧妙的躲開它的一些可避開的攻擊，我會給你最高評價。
actors.mobs.npcs.dragongirlblue.c_message4=在這裡有兩個井，它們含有傳送的魔力，合理利用可以規避大多數傷害。場地中的柱子也可以幫你巧妙躲過那些惡毒的魔法。我會寬限你一次，但你千萬不能被祂撞個正著。
actors.mobs.npcs.dragongirlblue.c_message5=祝你狩獵愉快!!!另外，如果你狩獵成功，祂的遺體希望你能幫祂帶回地表。


actors.mobs.ancity.anomalocaris.name=奇蝦
actors.mobs.ancity.anomalocaris.desc=古代存活至今的奇怪生物，記載為蝦，實際上根本不是……\n\n它們對於獵殺有著十分專注的力量，但由於其笨重的體格無法跨過狹窄的地方。
actors.mobs.ancity.anomalocaris.true=首次攻擊傷害提升300%,此怪物還尚未使用此效果。

actors.mobs.ancity.threeleafbug.name=三葉蟲
actors.mobs.ancity.threeleafbug.desc=古代存活至今的弱小生物 ，他們是怎麼活到現在的？\n\n它們對於獵殺非常專注，在持之以恆之後，它們的利爪將撕裂一切。
actors.mobs.ancity.threeleafbug.true=每次攻擊傷害和移速提升，7次攻擊後提升到最高並且移速額外大幅度提升。脫戰後開始漸漸衰減。\n\n當前疊加攻擊數:%1$s\n\n當前平均傷害:%2$s

actors.mobs.ancity.turtle.name=叢林土鱉
actors.mobs.ancity.turtle.desc=古代存活至今的奇怪生物，據說藥劑師們非常喜歡它們……\n\n沒有任何特殊能力，但據說它有機率掉落種子。



actors.mobs.flowerslime.name=叢林繁花史萊姆
actors.mobs.flowerslime.desc= 在叢林中隨處可見的生物，原本應該是比較溫順的一種生物，可能是受到地牢詛咒影響，它們也開始主動襲擊過往的人類。\n\n史萊姆的身體富有粘性，很顯然，這個史萊姆身上沾滿了這片地區的植物，也許上面還有些種子。

actors.mobs.olddm300.name=DM275-原型機
actors.mobs.olddm300.desc=這台機器是DM300量產前，矮人王國研發的原型試驗機，由於其較為笨重的原因，原型機已被廢棄，你現在看見的這台應該是最後一台！\n\n在燃料耗盡前可以進行極大範圍的遠程攻擊，在水面移動時可以進行自我修復並填裝一定的燃料但會蒸發水麵。血量低於一定比例後立刻吸收本層所有DM201的能量給自己生成護盾，同時被吸收能量的DM201也會立刻被關閉。
actors.mobs.olddm300.notice=偵察到入侵者……
actors.mobs.olddm300.defeated=系統能量不足，自動關……
actors.mobs.olddm300.repair=自我修復

#Spical

actors.mobs.spical.skydead.name=天罰
actors.mobs.spical.skydead.desc=它是一種更加實體化的幽靈，它們的肉身在死後被腐蝕殆盡，只留下了骸骨一具，不屈的意志似乎指引著它們重生，但被地牢的邪惡魔力的影響，現在的它們更像是死神。
actors.mobs.spical.skydead.reason=冒險者，我們又見面了。\n\n這個井的深處，有著一個這層極其危險的存在。我十分不建議你前往，而且一旦下去，沒有擊敗它，你將會死無葬身之地。\n\n如果你準備好了，就請深潛吧！
actors.mobs.spical.skydead.cant_enter_a=通往秘境的道路已經被水完全覆蓋，連同它的屍體一起被淹沒在這地牢深處的水底……
actors.mobs.spical.skydead.cant_enter_1=這裡水流相當的急，你暫時無法離開這裡……
actors.mobs.spical.skydead.desc_fire=天罰尚未成功進行第一次遠程攻擊，因此將會擁有_100%全局傷害抗性_。
actors.mobs.spical.skydead.enter_yes=深潛秘境
actors.mobs.spical.skydead.tp=逃避，不能解決任何問題！
actors.mobs.spical.skydead.no_tele=天罰：你妄想傳送我？！
actors.mobs.spical.skydead.enter_no=稍後再說
actors.mobs.spical.skydead.exit_warn_none=你居然還活著？水快要漫上來了，我可以帶你離開這裡！
actors.mobs.spical.skydead.exit_yes=離開秘境
actors.mobs.spical.skydead.exit_no=稍後再說
actors.mobs.spical.skydead.notice=痛苦會轉變你的欲望，亡魂是訴說的對象。
actors.mobs.spical.skydead.defeated=……，我解脫了……
actors.mobs.spical.skydead.dodge_warning=Tips：如果多次攻擊都為0，你應該用放大鏡看看天罰的文本介紹。

actors.mobs.spical.greenslting.name=綠野精靈
actors.mobs.spical.greenslting.desc=叢林中的植物精靈，對入侵者沒有任何好感……也包括你!!!

actors.mobs.spical.gnollhero.name=豺狼勇士
actors.mobs.spical.gnollhero.desc=臉上塗著部族的印記，這是一名來著豺狼家族的無畏勇士，是豺狼族中最強大的一群。他們的力量來自於信仰，他們相信自己是豺狼族的神的化身，因此力量也是無窮的。\n\n他相當的危險，所以你最好不要讓他靠近你。

actors.mobs.spical.dm275.name=DM275-RPG實驗機甲型
actors.mobs.spical.dm275.desc=DM275-RPG實驗機甲型是矮人研發DM300前的過渡城防器械，最初用來保護礦洞中的矮人礦工與下方的城市。比起第二代它們相當龐大笨重，並利用強力的液壓錘碾壓和恐怖的RPG對讓每一個入侵者都有去無回。\n\n這台早已被廢棄的戰爭機器就算到了今日竟然依舊在運作，它嗡嗡作響的液壓鑽和火箭炮表明了它並不好惹。

actors.mobs.blackmimic.name=暗金擬態魔箱
actors.mobs.blackmimic.desc=寶箱怪是一種能隨意改變外形的魔法生物。在地牢裡它們幾乎總會以寶箱形態出現，因為這樣更能吸引不防備的冒險者。\n\n暗金擬態魔箱相比於它們的近親更為狡猾且更為好鬥，會嘗試奪取一個物品並為他所用。

actors.mobs.spical.succubusqueen.name=魅魔女王
actors.mobs.spical.succubusqueen.desc=魅魔一族是一種善於操縱敵人精神的變形惡魔。這些惡魔的力量來源於人們的欲望，她們可以透過自己的美貌來吸引敵人，然後操縱他們的精神。\n\n魅魔女王是魅魔中的領袖，在攻擊時，她能夠使用_絕對魅惑_來控制敵人，使敵人在一定時間內完全無法攻擊且會被魅魔女王持續吸收生命精華，並且在_絕對魅惑_狀態下，被魅惑方受到的傷害提升25%。



actors.mobs.npcs.typhon.quest_start_prompt=冒險家，看來他已經走了，你是想我送你回去，還是踏上返程呢？
actors.mobs.npcs.typhon.enter_yes=帶我回去
actors.mobs.npcs.typhon.enter_no=我要返程
actors.mobs.npcs.typhon.goodluck=祝你一路順風，%s！


#Spical End

actors.mobs.npcs.pinkghost.name=粉色幽靈
actors.mobs.npcs.pinkghost.desc=這個幽靈正在發出靚麗的光芒，在地牢中就像一盞希望的明燈。她臉上露出了燦爛的笑容……

actors.mobs.npcs.ghostnpc.name=悲傷幽靈
actors.mobs.npcs.ghostnpc.desc=這個幽靈幾乎不能被看見。它看起來像是由一片無形的昏暗光斑和一張悲痛的面孔所組成的。

actors.mobs.npcs.pinkghostnpc.name=粉色幽靈
actors.mobs.npcs.pinkghostnpc.desc=這個幽靈正在發出非常正麗的光芒，在地牢中就像一盞希望的明燈。這個幽靈的臉上露出了燦爛的笑容……

actors.mobs.npcs.pinkghost.hello=你好呀，冒險家，啊，請不要害怕我，我曾經也是你們的一員。
actors.mobs.npcs.pinkghost.hello_1=你能幫我一個忙嗎？在這層地牢裡有個隱藏的花園，在哪裡我記不太清了，總之，裡面有一朵白色的玫瑰，那是前一段時間我種下的，現在應該已經開花了。說起來，在地牢裡收集玫瑰種子真不容易。另外，在那個花園有一些遊走的幽靈，它們與我不一樣，它們是可怕的怨靈。
actors.mobs.npcs.pinkghost.hello_2=你可以幫我找回那朵花嗎？如果可以的話，我這裡有些可能有用的東西，到時候就和你交換好了。
actors.mobs.npcs.pinkghost.hello_3=如果你後面準備好了，就再次和我對話，我會使用我的力量讓你前往那裡的。
actors.mobs.npcs.pinkghost.good_desc=啊呀，謝謝你，我還以為我再也見不到這朵玫瑰了呢。\n\n把玫瑰給我吧，給你的東西我已經帶過來了，希望對你接下來的旅途能有所幫助。
actors.mobs.npcs.pinkghost.why_red=你已經回來了，但你這裡並沒有白玫瑰，你丟掉它了嗎？
actors.mobs.npcs.pinkghost.giverose=給予白玫瑰
actors.mobs.npcs.pinkghost.givemoon=給予小月餅
actors.mobs.npcs.pinkghost.whatmoon=啊拉，謝謝你，幽靈是不用吃月餅的，你的心意我就收下了。
actors.mobs.npcs.pinkghost.moonname=等等，這個月餅......上面為什麼會有我的名字?\n\n什麼，是一個幽靈給你的？難道他......他真的......
actors.mobs.npcs.pinkghost.moonlost=粉色的幽靈帶著月餅消失了......
actors.mobs.npcs.pinkghost.goodluck=祝你一路順風，冒險家！
actors.mobs.npcs.pinkghost.not_sorry=抱歉，冒險家，讓你看見了我傷心的樣子......
actors.mobs.npcs.pinkghost.not_sorry_1=我之前說過，我也是冒險家，不過在我進地牢前就已經放棄了冒險家的身份了。我之所以在地牢裡變成這副樣子，是為了我的愛人。
actors.mobs.npcs.pinkghost.not_sorry_2=我的愛人準備與我結婚前最後完成一件任務，我記得是在地牢淺層收集材料。可是過了好幾天也不見他回來，我很著急，但是沒有冒險家協會的許可或冒險家的擔保的話是無法進入地牢的，所以我找到了_羅倫斯_，他是一名矮人工匠，並不是冒險家協會的成員。但是他幫我找到了一條能夠避開守衛的路，最終，我們成功進入了地牢。
actors.mobs.npcs.pinkghost.not_sorry_3=進入地牢後，羅倫斯便不知所蹤，我只得一個人探索。\n\n但是，我沒能在前幾層找到他，我猜想可能是他去到了更深的地方，便繼續探索，直到我最終不幸倒在了毒氣裡......但是萬幸，有位穿棕色斗篷的人救了我，只是我的肉體受傷太嚴重，他只得先冰封我的肉體，讓我以靈魂姿態繼續遊蕩在這黑暗的地牢......可是，我還是沒能尋到他的線索。我便猜想，我可能太著急了，他應該早就回去了，只是先去旁邊的鎮子休整兩天而已。可是，我已經沒辦法再回頭了。
actors.mobs.npcs.pinkghost.not_sorry_4=既然你從一位幽靈那裡拿到了這塊月餅，那說明他也遭遇了不測......但我還會繼續尋找他的。哪怕我們再也無法回到地面，再也無法像以前一樣相擁而眠，再也無法笨拙地給對方烤製不知道什麼餡的月餅，我也會尋找他的。
actors.mobs.npcs.pinkghost.talk_desc=我相信他還在那裡等我。\n\n總之，謝謝你。\n\n對了，這些東西忘記給你了，真誠的希望能幫上你的忙。\n\n白玫瑰就留給你做紀念了……
actors.mobs.npcs.pinkghost.givego=收下物品
actors.mobs.npcs.pinkghost.take=他就在這裡！
actors.mobs.npcs.pinkghost.whathere=啊，他不在這裡的。謝謝你安慰我……
actors.mobs.npcs.pinkghost.rose=等等，這是......我送他的玫瑰！這麼久了，竟然還沒枯死嗎......\n\n難道，他，他就在這附近?

actors.mobs.npcs.pinkghost.love&love=他們以不存在的形體再次擁抱在一起。白玫瑰和紅玫瑰輕輕地從他們手中落下。一種說不上來的情感布滿了你的心頭。

actors.mobs.npcs.ghostnpc.love=親愛的，是我.....
actors.mobs.npcs.pinkghost.oh_no=天啊！你......你怎麼也變成這副模樣了？
actors.mobs.npcs.ghostnpc.sorry=對不起，我......疏忽了。
actors.mobs.npcs.pinkghost.linklove=不，該說抱歉的是我，我應該和你一起去的......

actors.mobs.npcs.pinkghost.thanks=冒險家，我非常感謝您的幫助。
actors.mobs.npcs.pinkghost.thanks_1=沒有你，我無法和我的愛人重逢。
actors.mobs.npcs.pinkghost.thanks_2=我的救命恩人在召喚我了，我的愛人也會和我一起去見祂。
actors.mobs.npcs.pinkghost.thanks_3=或許在今後的輪迴旅途中，我和你以及我的愛人見面次數會更少。但請告訴輪迴中的他，我一直都在他旁邊。
actors.mobs.npcs.pinkghost.thanks_4=再見,%s。
actors.mobs.npcs.pinkghost.thanks_5=它們消失在了空氣中，只有一束白玫瑰和紅玫瑰並發著紅色光芒見證它們的摯愛之情……

actors.mobs.bluewraith.name=藍色怨靈
actors.mobs.bluewraith.desc=這個怨靈曾經與你一樣都是探索地牢的佼佼者，由於一些原因被困在了這裡，並最終迎接了死亡……

actors.mobs.bosses.sakafishboss.name=薩卡班甲魚
actors.mobs.bosses.sakafishboss.desc=曾經遠古時代的海洋王者,因為不可避免的末日來臨時，潛入了地底的陰暗水潭進入了沉睡。想著有朝一日回到大海，然而隨著地牢的魔力改造和大海本身的變化，它再也不可能回到那片理想的海洋。
actors.mobs.bosses.sakafishboss.notice=sakasaka……saka？膩……系……甚磨？！
actors.mobs.bosses.sakafishboss.attack=吧嗒吧嗒—嗚嗚……好懷念上面的風景和底棲生物
actors.mobs.bosses.sakafishboss.leap=薩卡班甲魚正在蓄力泥頭車衝撞！哦——創似——李——!!!
actors.mobs.bosses.sakafishboss.laserwarning=薩卡班甲魚正在召集周圍的黑暗能量以釋放死亡凝視……
actors.mobs.bosses.sakafishboss.king=泰山壓頂！biu——
actors.mobs.bosses.sakafishboss.interesting=讓你瞧瞧遠古頂級掠食者的姿態！
actors.mobs.bosses.sakafishboss.angry=可惡的人類！你們為什麼要毀掉我們的家園？！可惡可惡可惡可惡，陪我的同胞一起下地獄吧！
actors.mobs.bosses.sakafishboss.defeated=嗚嗚嗚……我……我……我……,仍然無法回到大海……
actors.mobs.bosses.sakafishboss.dictcar_kill=%s被薩卡班創飛,離開了人間……
actors.mobs.bosses.sakafishboss.deathgaze_kill=%s被薩卡班的死亡凝視嚇死了……
actors.mobs.bosses.sakafishboss.rankings_desc=成為了薩卡班甲魚的食物……

actors.mobs.bosses.sakafishboss$hunting$1.rankings_desc=成為了薩卡班甲魚的食物……

actors.mobs.bosses.dictfish.name=板足鱟
actors.mobs.bosses.dictfish.desc=底棲頂級捕食者，他的巨鰲和巨顎可以碾碎你的鎧甲。\n\n與_房角石_是共生互助，因此死後房角石會狂暴，獲得的特殊攻擊帶有衝擊，可以擊退敵人造成大量傷害。且免疫火焰。
actors.mobs.bosses.dictfish.notice=板足鱟:大哥！
actors.mobs.bosses.dictfish.death=大哥，接下來就交給你了！
actors.mobs.bosses.dictfish.angry=板足鱟:大哥！該死的人類！我要你們付出代價！
actors.mobs.bosses.dictfish.rankings_desc=成為了薩卡班甲魚的食物……

actors.mobs.bosses.roomstone.name=房角石
actors.mobs.bosses.roomstone.desc=遠古頂級掠食者，他的喙和甲殼可以輕易刺穿你的身材。\n\n與_板足鱟_是共生互助，因此死後板足鱟會狂暴，獲得35回合激素湧動和暫時無敵10回合，並且每次攻擊必定造成易傷，離開水面後速度大幅度提升。
actors.mobs.bosses.roomstone.notice=房角石:二弟!
actors.mobs.bosses.roomstone.allget=我們兄弟齊心！力斷其金！為了我們的家園！
actors.mobs.bosses.roomstone.angry=房角石:二弟！該死的人類！我要把你們碾成肉醬！
actors.mobs.bosses.roomstone.leap=房角石:人類，用你的血來祭奠我們的家園吧！
actors.mobs.bosses.roomstone.rankings_desc=成為了薩卡班甲魚的食物……

actors.mobs.npcs.nxhy.talk=交談
actors.mobs.npcs.nxhy.buyback=回憶很爽快的退還了相應的商品。

actors.mobs.npcs.nxhy.talk_prison_intro=冒險者，歡迎來到這個危機四伏的地牢。
actors.mobs.npcs.nxhy.talk_prison_warrior=蕾零安潔，你也是前往這裡尋找水晶之心的嗎？哦，嗯，我知道，地表三巨頭的行動我可是瞭如指掌的，但本人已經不想參與這些事情，現在，我還是當個商人最好吧。
actors.mobs.npcs.nxhy.talk_prison_mage=茉莉姐，我知道你來到這裡的目的不是尋找那個東西，而是聽到了來自深淵的求救。但我能告訴你的事，別去參和他們的事情，這裡畢竟不是你的家，你的力量無法完全展露的。
actors.mobs.npcs.nxhy.talk_prison_rogue=哦，這不是人人歌頌的皇家盜賊嗎？你打算在我這裡偷點東西嗎？哈哈哈，騙你的，事實上，我很敬佩你，為了窮人，你不惜捨去皇室血脈也要和窮人一起同甘共苦。你的父王可能早就知道了，不信的話，你的斗篷已經被他秘密改造了，什麼，你還不知道？哈哈哈，我為什麼知道，這是秘密哦！
actors.mobs.npcs.nxhy.talk_prison_huntress=我曾經和小姐一樣也是一位俠客，只不過瞬時變遷，我現在已經不再追求這些。小姐，你知道自從你走後你的部族就發生……，哎呀，別拿弓指著我，我不說就是了。還是希望小姐能在地牢中試煉中找到自己的目標吧。

actors.mobs.npcs.nxhy.talk_prison_duelist=小姐的樣子不像是這個世界的人，你應該來自於其他的地方吧。當然，我這裡的商品任你挑選，只要金錢到位就行。

actors.mobs.npcs.nxhy.talk_caves=這裡的礦洞常年都是這麼的冷，但曾經並不是這樣。曾經有一位藍髮少女在我這裡留了一本書，此後礦洞就變得如此寒冷，但那位少女再也找不到人影……
actors.mobs.npcs.nxhy.talk_city=矮人都市是我最後給你的物資中轉站，再往下，已經不是我可以涉及的區域，曾經這裡也是一片繁華，但是那場事變後，一切都變了……

actors.mobs.npcs.nxhy.guards=看來你需要更加艱難的試煉了。
actors.mobs.npcs.nxhy.thief=看來你需要更加艱難的試煉了。
actors.mobs.npcs.nxhy.why=搶劫商店？你可真有趣!

actors.mobs.npcs.nxhy.sell=選擇一件要出售的物品
actors.mobs.npcs.nxhy.name=那些回憶
actors.mobs.npcs.nxhy.desc=這是一個擁有很多東西的商人，他的名字叫那些回憶。據說他知道300年前這地牢究竟發生了什麼事情的，他在這裡等著每一位冒險者的前來。他會給予冒險者相應的補給，但是他從來不告訴冒險者這個地牢的危險程度是多麼的高。傳言說，他曾經是一個俠客，只不過現在他已經成為了一個商人了。
actors.mobs.npcs.nxhy.greetings=你好，%s。歡迎來到我的大商店。

actors.hero.hero.heartdied=死亡不是終點，而是新的開始。
actors.hero.hero.lanterfire_warning=十字架崩碎，燈火黯淡，心智被黑暗吞噬！你的暗影化身已然降臨，擊潰它！低燈火狀態下，黑魂將會誕生。
actors.hero.hero.nitch=非本體層不允許執行跳樓行動。
actors.hero.hero.no_item=溫馨提示：\n\n雪景小鎮每局最多在NPC處獲取4次物品，你已消耗完次數，後續將變為1金幣。
actors.hero.hero.heart_god=活下去，為了自己！

actors.hero.hero.quest_start_prompt=靶心瞄準的閃現已就緒，你的選擇是？\n\n注意：如果閃現的目標位置為深淵，且你沒有浮空等免疫效果，你會直接摔下去。
actors.hero.hero.enter_yes=閃現到目標位置
actors.hero.hero.enter_no=放棄本次閃現

actors.buffs.stormclouddied.name=閃電鏈式反應
actors.buffs.stormclouddied.desc=你暫時掌控了雷電的力量，在接下來的時間裡，任何出現在你眼前的事物都會被雷霆審判。\n\n以你現在的掌控能力，每條閃電鏈可以造成%1$s傷害\n\n你當前還剩餘：%2$s個閃電鏈。\n\n剩餘閃電鏈可造成的總傷：%3$s傷害\n\n傷害類型:真實(雷暴)


actors.mobs.brutebot.name=重甲豺狼
actors.mobs.brutebot.desc=豺狼人從擊敗的冒險者身上獲得了盔甲，看來豺狼人們終於意識到拿個盾真的沒有什麼用了……\n\n雖然重甲豺狼對冒險家的威脅極大，但沉重的裝甲使他們行動緩慢……\n\n通常來說矮人們會僱傭一些這種豺狼來幫他們幹活。重甲豺狼非常喜歡用武器砸人，但是他們的武器並不是很結實，所以他們會經常把武器砸壞，然後再去找矮人們要新的武器。
actors.mobs.brutebot$brutebotrage.name=臨死一搏
actors.mobs.brutebot$brutebotrage.desc=這個重甲豺狼的死亡已經不可避免，但它想拉你作為陪葬品！\n\n時間的推移或是外界的傷害都會消磨護盾。在護盾消散殆盡之際，重甲豺狼會徹底消亡。然而，一定要小心，在這一階段重甲豺狼遠程和近戰會造成巨額傷害,且攻擊間隔大幅度縮減 ！\n\n剩餘的護盾：%d。
actors.mobs.brutebot.enraged=激怒
actors.mobs.brutebot.died=你激怒了重甲豺狼，它將會在死亡前盡全力攻擊你！並且它呼喚了本層的所有敵人。
actors.mobs.brutebot$focus.name=紅眼凝視
actors.mobs.brutebot$focus.desc=這個重甲豺狼已經完全凝視於目標的一舉一動，似乎能預料到目標的下一步動作。\n\n紅眼凝視中的重甲豺狼一定會格擋下一次物理攻擊。格擋會分散重甲豺狼的注意力，使得他們需要一段時間重新集中精力來成功格擋攻擊。在移動時重甲豺狼恢復地相對更快。
actors.mobs.brutebot.def_verb=格擋
actors.mobs.brutebot.parried=盾反
actors.mobs.brutebot.ondeath=你被重甲豺狼殺死了……,下次請小心……

actors.mobs.bosses.diamondknight.name=擬態之王
actors.mobs.bosses.diamondknight.notice=%s，我已等候多時了。為保證公平決鬥，你的十字架類型物品已暫時放在了我的子嗣處。
actors.mobs.bosses.diamondknight.desc=擬態的最終結果就是無限接近人類。\n原本作用擬形的鑽石寶箱外殼化作盔甲，包裹住如王般的內在。\n衪是所有擬形怪的王——至少衪是這麼認為的。\n王會戰鬥到最後一刻，直到粉身碎骨。
actors.mobs.bosses.diamondknight.rankings_desc=擬態之王將你製作成了寶藏……
actors.mobs.bosses.diamondknight.ondeath=資 質 平 平 。
actors.mobs.bosses.diamondknight.tpdoor=擬態王邀請你前往寶藏迷宮，這可能是場鴻門宴，但你別無選擇……
actors.mobs.bosses.diamondknight.now_go=真是有趣的傢伙，本王帶你看看我的寶藏迷宮吧。互動傳送門以進入第二階段……

actors.mobs.bosses.tpdoor$1.name=前往寶藏迷宮？
actors.mobs.bosses.tpdoor$1.quest_start_prompt=寶藏迷宮有著各種寶箱怪進行巡邏，但裡面有擬態之王存下來的寶藏，立刻前往看看吧！\n\n任務目標：_除鑽石寶箱怪外，擊敗五個寶箱怪，然後尋找“神秘傳送門”離開這裡。_\n\n當傳送門顯現時，你將與它共鳴！
actors.mobs.bosses.tpdoor$1.quest_start_ender=寶藏迷宮正在崩塌，所幸你發現了傳送門……，趕緊進入傳送門離開這裡吧！
actors.mobs.bosses.tpdoor$1.enter_yes=進入傳送門
actors.mobs.bosses.tpdoor$1.enter_no=暫時不要
actors.mobs.bosses.tpdoor.display=你已經破壞了這裡的平衡，傳送門已再次顯露出來……，尋找並與它互動離開這裡……
actors.mobs.bosses.tpdoor$1.leave=逃離寶藏迷宮？

actors.mobs.bosses.firedragon.name=熔岩火龍
actors.mobs.bosses.firedragon.desc=叢林腐化的中心，叢林幕後的主謀。\n\n熔岩洞穴的溫度越來越高，火龍的攻勢來勢洶洶。\n\n在火焰的熊熊燃燒中，烈焰映紅了天空，我們必須擊退它，讓叢林獲得暫時的安定。\n\n_火龍在戰鬥開始時會劃定一個範圍製作魔法火牆，但它在捕食後會解除這一威脅,你也可以站在低溫岩漿上不被影響。_
actors.mobs.bosses.firedragon.notice=火龍注意到了你。一道烈焰散發在這周圍，熊熊烈火包圍了這裡，現在已經無路可退！
actors.mobs.bosses.firedragon.scorpion=捕食，給養。我的奴僕們，是時候了！
actors.mobs.bosses.firedragon.elemental=奴僕們，甦醒吧……
actors.mobs.bosses.firedragon.toy=熔岩火龍：是時候給點真本事給你瞧瞧了！火龍一瞬間就傳送不見了……
actors.mobs.bosses.firedragon.healing=我的奴僕們，快治癒我吧！
actors.mobs.bosses.firedragon.defeated=隨著火龍痛苦的嘶吼後，它倒在了這裡……
actors.mobs.bosses.firedragon.clear=你感到有什麼東西熄滅了,一股壓抑的力量正在從這裡散去。
actors.mobs.bosses.firedragon.lingjing=稜鏡在火龍痛苦的嘶鳴聲中碎裂開了……
actors.mobs.bosses.firedragon.car=註：龍車即將到來，請留意！

actors.mobs.bosses.firedragon.dragon_majesty=龍族不會屈服於任何一個人，我們才是這裡的主人！
actors.mobs.bosses.firedragon.dragon_rituals=尚未發現敵對目標，開始進行神秘儀式備戰……
actors.mobs.bosses.firedragon.scorpion_enemy=蠶食，詛咒，一切都是龍族的時代！

actors.mobs.bosses.firedragon$vertigoeffect.name=定向進化·不屈
actors.mobs.bosses.firedragon$vertigoeffect.desc=尋路漫漫，而迷路者終將被吞沒\n\n火龍物理防禦提升至120%%\n\n距離效果衰減還有：%s回合。

actors.mobs.bosses.firedragon$hasteeffect.name=定向進化·暴風
actors.mobs.bosses.firedragon$hasteeffect.desc=天下武功唯快不破！功夫再高，也怕菜刀\n\n火龍基準移速提升至200%%\n\n距離效果衰減還有：%s回合。

actors.mobs.bosses.firedragon$toxicgaseffect.name=定向進化·劇毒
actors.mobs.bosses.firedragon$toxicgaseffect.desc=浸染一切，這片叢林不值得祂的救贖\n\n火龍自身附近產生大量毒氣\n\n距離效果衰減還有：%s回合。

actors.mobs.bosses.firedragon$damageupeffect.name=定向進化·獵殺
actors.mobs.bosses.firedragon$damageupeffect.desc=獵殺一切，殺死叢林\n\n火龍全局傷害提升至140%%，攻速提升50%%\n\n距離效果衰減還有：%s回合。

actors.mobs.bosses.firedragon$bleedingeffect.name=定向進化·嗜血
actors.mobs.bosses.firedragon$bleedingeffect.desc=獵殺一切，殺死叢林\n\n火龍的普通攻擊造成流血效果\n\n距離效果衰減還有：%s回合。

actors.mobs.bosses.notsync.diedclearelemet.friend=火龍事件之後，這些神秘元素終於重獲自由。如今，它們在叢林的盡頭，齊心協力為曾經的恩人開闢出一條光明之路，指引著前行的希望與未來。

actors.mobs.bosses.notsync.diedclearelemet$clearelemetalblood.name=血晶元素
actors.mobs.bosses.notsync.diedclearelemet$clearelemetalblood.desc=火龍的力量汙染了這些曾經的守衛者，雖然它們本身是無辜的，但你必須做出抉擇。\n\n血晶元素攻擊目標時將有機率造成{流血{效果，_如果被火龍捕食，火龍的普通攻擊造成流血效果，持續30回合_

actors.mobs.bosses.notsync.diedclearelemet$clearelemetalgreen.name=毒晶元素
actors.mobs.bosses.notsync.diedclearelemet$clearelemetalgreen.desc=火龍的力量汙染了這些曾經的守衛者，雖然它們本身是無辜的，但你必須做出抉擇。\n\n毒晶元素攻擊目標時將有機率產生大量}毒氣}氣體，_如果被火龍捕食，火龍自身附近產生大量毒氣，持續70回合_

actors.mobs.bosses.notsync.diedclearelemet$clearelemetaldark.name=暗晶元素
actors.mobs.bosses.notsync.diedclearelemet$clearelemetaldark.desc=火龍的力量汙染了這些曾經的守衛者，雖然它們本身是無辜的，但你必須做出抉擇。\n\n暗晶元素攻擊目標時將有機率造成|殘廢|效果，_如果被火龍捕食，火龍全局傷害提升至140%，攻速提升50%，持續50回合_

actors.mobs.bosses.notsync.diedclearelemet$clearelemetalpure.name=魅晶元素
actors.mobs.bosses.notsync.diedclearelemet$clearelemetalpure.desc=火龍的力量汙染了這些曾經的守衛者，雖然它們本身是無辜的，但你必須做出抉擇。\n\n魅晶元素攻擊目標時將有機率造成]幻惑]效果，_如果被火龍捕食，火龍防禦提升至120%，持續80回合_

actors.mobs.bosses.notsync.diedclearelemet$clearelemetalgold.name=磷晶元素
actors.mobs.bosses.notsync.diedclearelemet$clearelemetalgold.desc=火龍的力量汙染了這些曾經的守衛者，雖然它們本身是無辜的，但你必須做出抉擇。\n\n磷晶元素攻擊目標時將有機率產生60點[磷火[氣體，_如果被火龍捕食，火龍基準移速提升至200%，持續20回合_

actors.mobs.bosses.dwarfgeneral.name=矮人將軍
actors.mobs.bosses.dwarfgeneral.desc=曾經矮人王國最強的將軍，而如今變成了亡魂的模樣。\n\n或許在漫漫長夜中，他有過迷茫，有過失落，有過悔恨……\n\n究竟怎樣的顛沛流離，才能讓這一切變得更加值得呢？他不言，爾不語。
actors.mobs.bosses.dwarfgeneral.charging=看來你還有兩下子嘛，那麼，嚐嚐這個吧。崩山斬！！！
actors.mobs.bosses.dwarfgeneral.message1=......哦？
actors.mobs.bosses.dwarfgeneral.message2=呵，看來又能找點樂子了。
actors.mobs.bosses.dwarfgeneral.message3=那就讓我看看，你有幾斤幾兩吧！
actors.mobs.bosses.dwarfgeneral.story=首次與矮人將軍戰鬥後，必須進行後續對話才能離開這裡！
actors.mobs.bosses.dwarfsolider.name=矮人角鬥士
actors.mobs.bosses.dwarfsolider.desc=矮人角鬥士是曾經將軍身邊的貼身侍衛，即便在被腐化後，仍然效忠於他們的主人矮人將軍。\n\n攻擊有機率擊飛玩家的武器

actors.mobs.bosses.dwarfgeneral.mej=恭喜你完成委託，法師新皮：晚宴邀請，現已解鎖！

actors.mobs.bosses.dwarfsolider.attack_msg_1 = 誓死捍衛矮人的威嚴
actors.mobs.bosses.dwarfsolider.attack_msg_2 = 離開這裡！你不屬於這裡！
actors.mobs.bosses.dwarfsolider.attack_msg_3 = 我們即為王朝的最後一道屏障！
actors.mobs.bosses.dwarfsolider.attack_msg_4 = 將軍仍在，矮人仍在，而王朝一去不復返……
actors.mobs.bosses.dwarfsolider.attack_msg_5 = 羅倫斯殿下，你在哪裡？
actors.mobs.bosses.dwarfsolider.attack_msg_6 = 我們最後的希望，也破滅了……
actors.mobs.bosses.dwarfsolider.attack_msg_7 = 將軍，我們還能看見矮人帝國的未來嗎？
actors.mobs.bosses.dwarfsolider.kicked = 你的武器被矮人角鬥士擊飛了……

actors.mobs.bosses.dwarffuze.name=矮人飛斧哥
actors.mobs.bosses.dwarffuze.desc=矮人帝國曾經最強大的勢力“飛斧”的殘黨，因為後續招安和矮人將軍一起協同行動\n\n攻擊有機率造成自身傷害的一半的流血，不會近戰攻擊。

actors.mobs.bosses.dwarfsolider$focus.name=預見未來
actors.mobs.bosses.dwarfsolider$focus.desc=這個角鬥士已經完全集中於目標的一舉一動，似乎能預料到目標的下一步動作。\n\n預見未來的角鬥士一定會格擋下一次物理攻擊。如果預見成功，他們將獲得20點奧術護盾，矮人角鬥士攻擊目標後預見自動消失。在移動時預見未來恢復地相對更快。\n\n脫戰後效果消失或攻擊目標後效果消失。
actors.mobs.bosses.dwarfsolider.parried=+20點奧術護盾
actors.mobs.bosses.dwarfsolider.future=預見未來成功！

actors.buffs.brokenarmor.name=無用之盾
actors.buffs.brokenarmor.desc=你的防禦受“矮人將軍”魔法的影響，最大和最小護甲值反而是你_武器傷害_的_四分之一_。\n\n如果沒有武器，則_最低防禦為0_，最高防禦為英雄_赤手空拳傷害的是三分之一_。僅英雄受到該效果影響。\n\n剩餘效果時長：%s回合

actors.blobs.brokenarmorfire.desc=無用且詭異的火焰正在這裡閃閃發光，未被庇護的生物將被無用之盾效果詛咒。

actors.mobs.bosses.dwarfgeneral$armoreffect.name=虛無姿態
actors.mobs.bosses.dwarfgeneral$armoreffect.desc=被擊中的僅僅是我的幽魂，將軍處於虛無姿態時，受到的任何攻擊限制為1，且閃避大幅度降低。\n\n將軍累計受到5次傷害時，則會立刻召喚兩個_矮人角鬥士_並清理先前的角鬥士,同時退出虛無姿態，並且此效果的冷卻時間大幅度延長。\n\n離開此效果後累計傷害次數不會清零,下次效果觸發後繼續計算。\n\n剩餘效果時長：%s回合

actors.mobs.bosses.dwarfgeneral$nohealdied.name=嗜血形態
actors.mobs.bosses.dwarfgeneral$nohealdied.desc=矮人將軍在進入嗜血形態，每次攻擊都有機率回血。\n\n但閾值不會超過800血量（第二階段的起始點）\n\n剩餘效果時長：%s回合。

actors.mobs.bosses.dwarfgeneral$magicattack.name=魔化形態
actors.mobs.bosses.dwarfgeneral$magicattack.desc=矮人將軍在進入魔化形態後，每次攻擊都有機率讓敵人凋零。但必定造成降級效果。\n\n剩餘效果時長：%s回合。

actors.mobs.bosses.dwarfgeneral$wither.name=凋零
actors.mobs.bosses.dwarfgeneral$wither.desc=你的生命正在被邪惡的魔法凋零……你必須做一下應急措施！\n\n在凋零狀態下，你使用治療藥劑不會獲得治療效果。而是驅除凋零，在挑戰中也同樣生效。\n\n剩餘效果時長：%s回合。
actors.mobs.bosses.dwarfgeneral$wither.on_kill=你的生命消逝殆盡了……

actors.mobs.bosses.dwarfgeneral.leap=我看見目標了！那裡最好不要有人！

actors.mobs.bosses.dwarfgeneral.fuze=常言道,人人為我,我為人人。出來吧,我的戰友們,讓這場演出變得更盛大一點吧。
actors.mobs.bosses.dwarfgeneral.normal=看來你打算和我耗上了,挑戰者,我遵從你的意見。那麼,你來幫我清理一下"門戶"吧。

actors.mobs.bosses.dwarfgeneral.spear_warn=哦，看來我正中靶心了！
actors.mobs.bosses.dwarfgeneral.notice=世界，以及矮人的未來，能否交予你呢？讓我來“質檢”一下吧。

actors.mobs.bosses.dwarfgeneral.wtf=你居然傷害我的戰友，我不能饒恕你！
actors.mobs.bosses.dwarfgeneral.gotime=虛無的力量，是你無法觸及的……
actors.mobs.bosses.dwarfgeneral.support=矮人角鬥士：我們的主人有威脅了，快去支援！
actors.mobs.bosses.dwarfgeneral.wow=你們還在這裡？好吧，挑戰者，看來事情變得有趣起來了……

actors.mobs.bosses.dwarfgeneral.army_one=排兵布陣，全軍列陣！！！
actors.mobs.bosses.dwarfgeneral.army_two=全體都有，立刻集合！！！
actors.mobs.bosses.dwarfgeneral.army_three=你不可能離開這裡！！！
actors.mobs.bosses.dwarfgeneral.defeated=矮人將軍已被擊敗......不，他的傷痕突然就癒合了。。他似乎有話要和你說。

actors.mobs.bosses.dwarfgeneral.died=......%s，你會一直朝著自己的信仰而戰嗎？

actors.mobs.bosses.armyflag.name=王庭軍旗
actors.mobs.bosses.armyflag.desc=矮人帝國的軍旗，象徵著帝國昔日的輝煌。\n\n昔日的矮人帝國，而今昔只有一片廢墟和亡魂訴說著她曾經的輝煌。\n\n_軍旗存在期間，矮人將軍獲得無敵_\n\n且周圍的敵人和友方週期獲得_激素湧動增益_和_遲緩_效果。

actors.mobs.bosses.dwarfgeneralnpc.name=矮人將軍
actors.mobs.bosses.dwarfgeneralnpc.desc=???

actors.mobs.bosses.dwarfgeneralntnpc.name=索林
actors.mobs.bosses.dwarfgeneralntnpc.desc=曾經的將軍，如今的亡魂。但在漫長的路途中，他從未後悔……將軍之道，就在其中……

actors.mobs.bosses.dwarfgeneralntnpc.goodbye=再見了，%s。
actors.mobs.bosses.dwarfgeneralntnpc.xms=他未曾離去。他是過去，亦是未來……

actors.mobs.bosses.dwarfgeneral.message6=幹得不錯啊，%s。
actors.mobs.bosses.dwarfgeneral.message7=你：你的傷痕怎麼消失了？
actors.mobs.bosses.dwarfgeneral.message8=......哈哈哈哈，看來小惡魔沒有告訴你啊。
actors.mobs.bosses.dwarfgeneral.message9=一個很簡單的常識:你不能殺死一個已經死去的人。
actors.mobs.bosses.dwarfgeneral.message10=你：死去的人？！
actors.mobs.bosses.dwarfgeneral.message11=沒錯，這是我給小惡魔的委託。
actors.mobs.bosses.dwarfgeneral.message12=小惡魔會尋找強大的冒險者，把他或她帶到‘我’的面前，只要能贏過我，就能獲得一些裝備。
actors.mobs.bosses.dwarfgeneral.message13=我呢，也能收穫一些樂趣，或許這樣還能找到新戰友。
actors.mobs.bosses.dwarfgeneral.message14=你：關於你自己？
actors.mobs.bosses.dwarfgeneral.message15=我姓甚名誰，並不重要。
actors.mobs.bosses.dwarfgeneral.message16=我是一名矮人將軍，以前是，現在也是。
actors.mobs.bosses.dwarfgeneral.message17=你：關於你的死......
actors.mobs.bosses.dwarfgeneral.message18=我不太清楚目前地面上有沒有對這幾十年的矮人帝國進行過研究。
actors.mobs.bosses.dwarfgeneral.message19=現任的國王，和真正的皇室沒有任何關係。
actors.mobs.bosses.dwarfgeneral.message20=幾十年前，一名能力高超的死靈法師刺殺了基本所有皇室成員，並控制了大臣，自己稱帝。
actors.mobs.bosses.dwarfgeneral.message21=在他的統治下，原本還算是繁榮的矮人帝國就開始變的一蹶不振。
actors.mobs.bosses.dwarfgeneral.message22=他的統治方式全看他的心情，所有的事情都由他獨裁，他想殺誰就殺誰，所有對他有意見的大臣都最終死於非命。
actors.mobs.bosses.dwarfgeneral.message23=直到我和另外一群志同道合的人，一同組建了反抗軍。那天，我們不惜代價，終於殺入了王宮。
actors.mobs.bosses.dwarfgeneral.message24=可惜的是，死靈軍最終還是包圍了我們。彼時的我們也已經知道了自己的結局。
actors.mobs.bosses.dwarfgeneral.message25=但是，我們仍然沒有放棄，我們奮力拚殺，直到最後，死靈軍突然停止了攻擊，他們的士官還在嘗試勸降我們。
actors.mobs.bosses.dwarfgeneral.message26=你們肯定沒有答應。
actors.mobs.bosses.dwarfgeneral.message27=嗯，所以我只向他們索取了一項權利。
actors.mobs.bosses.dwarfgeneral.message28=你：什麼權力？
actors.mobs.bosses.dwarfgeneral.message29=自刎的權利。
actors.mobs.bosses.dwarfgeneral.message30=.............
actors.mobs.bosses.dwarfgeneral.message31=我們現在所站的地方，就是我們最後一次殺敵的地方。
actors.mobs.bosses.dwarfgeneral.message32=你：也許，我可以試試挑戰他。
actors.mobs.bosses.dwarfgeneral.message33=.....不行。
actors.mobs.bosses.dwarfgeneral.message34=無論如何，你終歸是殺了無數矮人的罪人。在這點上，你與那位暴君無異。
actors.mobs.bosses.dwarfgeneral.message35=我不能讓你玷汙矮人帝國，哪怕她現在已千蒼百孔。
actors.mobs.bosses.dwarfgeneral.message36=關於矮人帝國的未來......
actors.mobs.bosses.dwarfgeneral.message37=......我出生於矮人帝國的鼎盛時期，見識過她最美麗的樣子。
actors.mobs.bosses.dwarfgeneral.message38=自然，我也明白，現在的矮人帝國已是有多麼不堪。
actors.mobs.bosses.dwarfgeneral.message39=我們，那些正生活在恐慌與貧窮的矮人們，那些一同逝去的戰友們。
actors.mobs.bosses.dwarfgeneral.message40=我們都在尋找與期盼著她的變革。
actors.mobs.bosses.dwarfgeneral.message41=矮人帝國的歷史仍未結束，而我們將為她翻開新的篇章。
actors.mobs.bosses.dwarfgeneral.message42=......身死亦無悔。
actors.mobs.bosses.dwarfgeneral.message43=好了，時間也差不多了。
actors.mobs.bosses.dwarfgeneral.message44=對了，我還是把名字告訴你吧:我叫索林（Thorin），如果你能出去的話......就幫我寫篇傳說故事什麼的？
actors.mobs.bosses.dwarfgeneral.message45=總之，我們有緣再會吧，如果還有機會的話.........
#=======================================


actors.mobs.bosses.diamondknight.notice_2=我已多次提醒你不要殺我的子嗣，然而你如此不聽勸告。今日，便要給你長長記性了！為保證公平決鬥，你的十字架類型物品已暫時放在了我的子嗣處。
actors.mobs.bosses.diamondknight.now_go_2=那麼，你真的以為可以與神抗衡嗎？讓我們來試試看吧！

actors.mobs.bosses.diamondknight.war_go=很久沒有這麼熱血沸騰了！挑戰者，或許你真的是這裡唯一的光芒
actors.mobs.bosses.diamondknight.iswar_go=最大的敵人往往就是你自己，準備好和自己決一死戰了嗎？
actors.mobs.bosses.diamondknight.ok_go=好吧，讓我們以最純樸的戰鬥結束這次的較量吧。


actors.mobs.bosses.diamondknight.defeated_2=看來你還是有兩下子的，不過你殺我子嗣的帳，總有一天會全部清算！另外，我在來的路上殺死了一名刺客，他的面具就交給你了……
actors.mobs.bosses.diamondknight.defeated=真是一場有趣的戰鬥，挑戰者，這次就算你贏了！另外，我在來的路上殺死了一名刺客，他的面具就交給你了……

actors.mobs.bosses.dcrystal.name=深藍水晶
actors.mobs.bosses.dcrystal.desc=這是擬態之王的本體的一部分，它會在與本體在5距離半徑且本體當前血量低於半血內進行治療。

actors.mobs.bosses.tpdoor.name=神秘傳送門
actors.mobs.bosses.tpdoor.desc=神秘傳送門的力量與擬態王有著千絲萬縷的聯繫，裡面映射出了一個神秘的空間……
actors.mobs.bosses.tpdoor.lowdamage=你對傳送門造成的傷害太低了，或許需要更強的力量才能擊破它。（單次傷害至少20以上)
actors.mobs.bosses.tpdoor.quest_bad_game=盜版遊戲！！！\n\n你正在遊玩的可能是音量+2525的盜版魔綾像素地牢，為了確保你的遊戲體驗，請你使用正版魔綾像素地牢。點擊下方連結以了解更多。
actors.mobs.bosses.tpdoor.enter_yes_game=訪問官網並關閉遊戲
actors.mobs.bosses.tpdoor.quest_tengu_prompt=嗯，看來君尚未做好充足的準備，莫得關係，吾只是考驗你，倘吾無破我門，吾可重時。\n\n不知君意下如何？
actors.mobs.bosses.tpdoor.enter_yes=重設時間
actors.mobs.bosses.tpdoor.enter_no=我再想想
actors.mobs.bosses.diamondknight.ten=吾就再給你試試看吧。
actors.mobs.bosses.tpdoor.quest_tengu_really=吾確信前往？

actors.mobs.katydid.name=噴毒花
actors.mobs.katydid.desc=叢林中的活化植物，因為叢林的異變變得異常暴躁。常常對入侵者進行毒液噴射，它們的毒液有著極強的腐蝕性，所以非常危險。且自身較為靈活，必須趁其不備將其殺掉。

actors.mobs.salamander.name=深藍蠑螈
actors.mobs.salamander.desc=來自森林的小生物，由於下方的邪惡力量侵蝕，它們已經由溫順變得兇猛。\n它們鋒利的尾巴能穿透敵人，它們十分的聰明，且極其靈活，必須趁其不備將之殺掉。

actors.mobs.clearelemental.name=純晶元素
actors.mobs.clearelemental.desc=來自森林自身的精華產物，但由於下方邪惡力量的不斷侵犯，它們自身的力量已經消耗許多。雖然它們已經沒有攻擊能力，但為了保證森林最終不被完全侵蝕，它們會用剩餘的力量驅趕每一個入侵森林的不速之客。

actors.mobs.bosses.notsync.crivusstarfruits.name=克璃諾斯-森林意志
actors.mobs.bosses.notsync.crivusstarfruits.desc=這顆碩大的果實是叢林中最美麗的陷阱，它會釋放一種物質，迷惑周圍的一切生物，使他們失去自我。\n\n身旁的觸手還會將不慎走進的小動物們絞殺，腐化成纏繞在四周的瘴氣。\n\n根據地表植物學家相關研究，它屬於“克里弗斯之果“的變種，由於她有著非常美麗的外貌，地表的植物學家們也將它稱為”克璃諾斯之果“，並戲稱它是克里弗斯之果的姐姐。\n\n極少有冒險者能對這株植物作出描述，在得到的隻言片語中，你唯一能確定的就是“它是森林至暗的中心”。\n\n另外，根據最新調查，它也算森林的意志……
actors.mobs.bosses.notsync.crivusstarfruits.notice=它正在不斷的跳動，猶如一顆鮮活的心臟……
actors.mobs.bosses.notsync.crivusstarfruits.died=就在你以為它要爆炸前，所有的藤蔓都開始向它注入能量……，看起來他們非常團結。摧毀這些藤蔓，否則後果不堪設想……
actors.mobs.bosses.notsync.crivusstarfruits.ondeath=你錯過了最佳良機，它終於徹底發怒，你被藤蔓纏住，再也不能動彈……

actors.mobs.bosses.notsync.crivusstarfruitslasher.name=晶化藤
actors.mobs.bosses.notsync.crivusstarfruitslasher.desc=藤蔓沒有智慧，它們的存在價值就是保護果實。不論是不小心靠近果實的“小動物”，還是企圖清理枯藤更進一步的冒險者，都被這些藤蔓絞死成孕育果實的肥料了。\n\n它們將週期性釋放毒氣到目標處，並週期用藤曼抓住目標進行獵食。與它的近親不同，魔化藤由於可以揮發出更加強大的酸蝕氣體曾被地表曦月協會評定為一級威脅！！！
actors.mobs.bosses.notsync.crivusstarfruitslasher.scorpion=捕 食 ，給 養 ……
actors.mobs.bosses.notsync.crivusstarfruits.anargy=就在觸手全部死亡的一刻，你發現中心的果子變得異常狂暴……

actors.mobs.bosses.notsync.crivusstarfruitslasher.xling=_在克璃諾斯之果變得狂暴後，一團新的藤蔓從地下冒出，並變得更具威脅。然而和上次不同的是，這次的由於本體在不斷傳遞觸手能量，所以新的一批晶化藤完全無法被摧毀。唯一的方法是摧毀它的本體……_
actors.mobs.bosses.notsync.crivusstarfruitslasher.xlin=_由於本體現在變得虛弱，所以族群需要給予它新的力量，由於力量正在向本體注入，這讓堅不可摧的它們變得脆弱不堪。你現在可以攻擊它們了。_\n\n不過由於它們曾經獵殺了很多生物，所以對魔法擁有抗性，你無法通過魔法傷害它。

//森林質問
actors.mobs.bosses.notsync.crivusstarfruits.goodbye_1=你真的認為你能拯救森林嗎？
actors.mobs.bosses.notsync.crivusstarfruits.goodbye_2=其實我們都有罪，我們誰也逃不脫即將到來的真正末日……
actors.mobs.bosses.notsync.crivusstarfruits.goodbye_3=腐化，毀滅……你們的罪孽終將被揭露……
actors.mobs.bosses.notsync.crivusstarfruits.goodbye_4=森林的命運，不再你我能決定……
actors.mobs.bosses.notsync.crivusstarfruits.goodbye_5=現在的森林，正處於一種平衡狀態，為何你還要將它打破？
actors.mobs.bosses.notsync.crivusstarfruits.goodbye_6=純晶封印了腐化的根源，而你們卻在試圖將它解開……
actors.mobs.bosses.notsync.crivusstarfruits.goodbye_7=我即為森林的意志，你們不可再繼續前進……

actors.mobs.bosses.notsync.crivusstarfruits.dead_1=協助破壞森林平衡的你們，早就已經失去了理智。
actors.mobs.bosses.notsync.crivusstarfruits.dead_2=你們的罪惡，將永遠伴隨著你們的靈魂。
actors.mobs.bosses.notsync.crivusstarfruits.dead_3=你們應該在地獄，而不是在森林。

actors.mobs.bosses.notsync.crivusstarfruits.dead=森林的命運，會前往何處呢？

actors.mobs.bosses.notsync.crivusstarfruits.explo_kill=你被克璃諾斯的爆炸殺掉了……
actors.mobs.bosses.notsync.crivusstarfruits$rage.name=族群意識
actors.mobs.bosses.notsync.crivusstarfruits$rage.desc=它的子嗣正在將自己的能量給予本體，你感覺附近的能量非常不妙，應該盡快摧毀它的子嗣！或它本身！！！\n\n在最終階段，如果族群讓它回到93血及以上，一旦英雄被發現，每16回合遭遇_森林質問_技能，技能會造成}法術傷害} \n\n非英雄的盟友單位，每8回合遭遇_森林審判_技能，技能會造成{真實傷害{

actors.mobs.bosses.notsync.clearelemtguard.name=純晶護衛長
actors.mobs.bosses.notsync.clearelemtguard.desc=這是一位全副武裝的人類，裝備著精良的護甲，看起來相當堅硬很難對付。\n\n他手裡的大劍似乎在警告你遠離他。但當你細細觀察他的面貌時，不由得想起了叢林的純晶元素。\n\n看起來他現在的狀態不是很好，或許強大的卷軸可以幫助他……
actors.mobs.bosses.notsync.clearelemtguard.clear_1=你嘗試淨化他，但仍然看見黑氣從中冒出，也許需要更多的祛邪卷軸
actors.mobs.bosses.notsync.clearelemtguard.clear_2=你終於淨化了他，但他似乎仍然處於理智混亂狀態，看來需要打一架了……
actors.mobs.bosses.notsync.clearelemtguard.attack=你是......！可惡，哪怕粉身碎骨，我也要在這裡阻止你！！！
actors.mobs.bosses.notsync.clearelemtguard.kill=終於還是......沒能挽回......

actors.mobs.bosses.notsync.clearelemtguardnpc.name=法伊娜
actors.mobs.bosses.notsync.clearelemtguardnpc.desc=這是一位全副武裝的人類，裝備著精良的護甲，看起來相當堅硬很難對付。\n\n他手裡的大劍似乎在警告你遠離他。但當你細細觀察他的面貌時，不由得想起了叢林的純晶元素。

actors.mobs.bosses.notsync.fayina.name=法伊娜
actors.mobs.bosses.notsync.fayina.desc=這是剛才那位全副武裝的他嗎？沒想到盔甲下的面貌竟是如此美麗。
actors.mobs.bosses.notsync.fayina.message1=這套鎧甲可真笨重，我先脫下來……嗯？
actors.mobs.bosses.notsync.fayina.message2=你竟然僥倖回來了？感覺怎麼樣？什麼，你擊敗了火龍？別開玩笑了，你能活著回來已經是奇蹟了。

actors.mobs.bosses.notsync.fayina.info=如果你的真的擊敗了火龍的話，你應該有一個火龍之心……
actors.mobs.bosses.notsync.fayina.take_firedragon_heart=給予火龍之心
actors.mobs.bosses.notsync.fayina.message3=這，這是火龍的心臟嗎？！%s，你真的擊敗了火龍嗎？

actors.mobs.bosses.notsync.fayina.info_2=在路上，你有沒有看見......過去那些守衛們的遺體？
actors.mobs.bosses.notsync.fayina.take_cry=沒有
actors.mobs.bosses.notsync.fayina.look=請看這個

actors.mobs.bosses.notsync.fayina.message4a=......啊，也是，都很久了吧，他們的遺體可能已經沉下去了。總之，%s，我代表綠林聖境感謝你，你的英勇與功績將會被我們永遠銘記。我會告訴其他純晶護衛的，以後他們也會幫你的忙。現在，請讓我一個人安靜下......
actors.mobs.bosses.notsync.fayina.message4b=這是......純晶元素......你找到他們了？
actors.mobs.bosses.notsync.fayina.message5=....好的，謝謝你。我會找個合適地方埋葬的。總之，%s，我代表綠林聖境感謝你，你的英勇與功績將會被我們永遠銘記。我會告訴其他純晶護衛的，以後他們也會幫你的忙。現在，請讓我一個人安靜下......
actors.mobs.bosses.notsync.fayina.info_3=那麼，現在能說實話了嗎？
actors.mobs.bosses.notsync.fayina.i=繼續對話

actors.mobs.bosses.notsync.fayina.message6=什麼？我說的都是真話！我的確沒有理由騙你！
actors.mobs.bosses.notsync.fayina.message7=唉，算了，先讓我靜靜吧。
actors.mobs.bosses.notsync.fayina.message8=她看起來不像在撒謊，可是，肯定是有哪裡不對......

actors.mobs.npcs.zero.zerotomb.name=蒼白劍塚
actors.mobs.npcs.zero.zerotomb.desc=上面刻著一系列名字\n\n叢林已經得到淨化。我們終將重逢，戰友們。

actors.mobs.bosses.notsync.fayina.roll1=火龍事件已經平息，感謝你的幫忙，%s。
actors.mobs.bosses.notsync.fayina.roll2=每每望向這些劍塚，我總還能想起他們的模樣……
actors.mobs.bosses.notsync.fayina.roll3=願他們的靈魂得到安息，願叢林永遠蒼綠。
actors.mobs.bosses.notsync.fayina.roll4=冒險者，你是我見過最勇敢的。
actors.mobs.bosses.notsync.fayina.roll5=霜月協會的會長似乎下落不明，也許她也被困在地牢裡面了。
actors.mobs.bosses.notsync.fayina.roll6=我已經很久沒有看見地表了，冒險者，謝謝你……
actors.mobs.bosses.notsync.fayina.roll7=看見這座劍塚了嗎，這裡曾經都是我的戰友……
actors.mobs.bosses.notsync.fayina.roll8=如果你還想去討伐火龍，我的稜鏡也許能幫上忙。

actors.mobs.bosses.notsync.clearelemtguard.cant_enter_a=你需要尋找純晶護衛長，只有他知曉解除封印的方法……
actors.mobs.bosses.notsync.clearelemtguard.cant_kill_fire=在沒有處理掉威脅前無法離開這裡……
actors.mobs.bosses.notsync.clearelemtguard.cant_enter_b=本局遊戲探索深度已超過11層，無法再前往熔岩火林……
actors.mobs.bosses.notsync.clearelemtguard.cant_enter_c=洞穴已經坍塌，請不要打完全部的戰鬥再來討伐火龍
actors.mobs.bosses.notsync.clearelemtguard.message1=.....你贏了，殺了我吧......

actors.mobs.bosses.notsync.clearelemtguard.message2=你......等等，你是冒險家？
actors.mobs.bosses.notsync.clearelemtguard.message3=抱歉......謝謝你救了我，我的記憶仍然停留在那個時間，把你當成敵人了。
actors.mobs.bosses.notsync.clearelemtguard.message4=我是聖境密林的護衛長，你可以叫我法伊娜。
actors.mobs.bosses.notsync.clearelemtguard.message5=不知多久以前，我們發現“奧克拉赫”之花似乎出現了被腐蝕的跡象，追根溯源，我們發現腐蝕的力量來自聖境密林的最底層，也就是熔岩地塊區域。
actors.mobs.bosses.notsync.clearelemtguard.message6=我帶著數名純晶元素下到那裡，發現不知何時，原本已據傳沉睡了萬年的火龍甦醒了，並把那裡占為自己的巢穴。
actors.mobs.bosses.notsync.clearelemtguard.message7=原先生活在那裡的生物也收到了腐蝕的影響，變成了隻聽從火龍命令的行屍走肉。
actors.mobs.bosses.notsync.clearelemtguard.message8=我們下到那裡後便遭到了包圍，儘管我挑選了我們之中最精英的守衛，我們還是因寡不敵眾全部倒在了那裡。最終，只剩下了我一個。
actors.mobs.bosses.notsync.clearelemtguard.message9=我記不太清最後發生了什麼事了，最後的記憶就是我被什麼東西封印了，再然後就在這裡看見了你......
actors.mobs.bosses.notsync.clearelemtguard.message10=對了，剛剛的襲擊，真的很抱歉......

actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt=你要殺死“純晶護衛長”嗎？
actors.mobs.bosses.notsync.clearelemtguard.enter_yes=殺死他
actors.mobs.bosses.notsync.clearelemtguard.enter_no=扶起他

actors.mobs.bosses.notsync.clearelemtguard.reason_ling=%s，在你真的準備前往熔岩火林我要告訴你的是，火龍非常危險，而且裡面已經一片死寂。\n\n你一定要萬般小心，另外，那裡曾經也是我和戰友戰鬥的地方，如果可以的話，我希望你能找到_“劍塚"_，將他們帶回來……
actors.mobs.bosses.notsync.clearelemtguard.enter_letsgo=立刻前往
actors.mobs.bosses.notsync.clearelemtguard.enter_nonx=暫不前往

actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt2=面對他的說辭……
actors.mobs.bosses.notsync.clearelemtguard.enter_yes2=真不幸！
actors.mobs.bosses.notsync.clearelemtguard.enter_no2=你在撒謊！

actors.mobs.bosses.notsync.clearelemtguard.sad_a=你將武器插進了他的胸口，他至始至終沒有倒下。
actors.mobs.bosses.notsync.clearelemtguard.pro_a=你輕輕的扶起了他……


actors.mobs.bosses.notsync.clearelemtguard.sad_b=是啊，唉，我活下來又有什麼用呢......嗯，總之謝謝你了。這個就給你了，算是我的一點歉意。
actors.mobs.bosses.notsync.clearelemtguard.pro_b=什麼？我沒必要對你撒謊，我講的都是真話。

actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt3=可是，你說的話聽起來很奇怪。
actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt4=我去吧。
actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt5=告訴我下去的方法。
actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt6=否則，聖境密林將化為腐化森林。
actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt7=綠林聖域也將受到汙染。
actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt8=這難道也是你想看到的嗎？

actors.mobs.bosses.notsync.clearelemtguard.enter=繼續對話

actors.mobs.bosses.notsync.clearelemtguard.pro_c=如果你不願相信就算了吧，反正這事已經發生了，聖境密林已經難逃厄運......
actors.mobs.bosses.notsync.clearelemtguard.pro_d=別開玩笑了，你這副裝備下去不過是送死而已。
actors.mobs.bosses.notsync.clearelemtguard.pro_e=不行，我怎麼能眼睜睜地看著別人向死亡走去？
actors.mobs.bosses.notsync.clearelemtguard.pro_f=………………
actors.mobs.bosses.notsync.clearelemtguard.pro_g=……………………
actors.mobs.bosses.notsync.clearelemtguard.pro_h=………………………………

actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt9=曾經，我遇到過一個冒險家，他告訴我要找到傳說中的水晶之心，可最後，他卻被偷襲，倒在了“奧克拉赫”之花之前。\n\n我還遇到過另一個冒險家，她告訴我她要鎮壓地牢的詛咒，可最後，她卻被詛咒反噬，還讓霜寒席捲了地牢。\n\n冒險家，我讚善你們人類的勇氣，但是，我不希望這樣的悲劇再次發生了......你真的去意已決？
actors.mobs.bosses.notsync.clearelemtguard.yesgo=是的

actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt10=好，對了，冒險家，你叫什麼名字？
actors.mobs.bosses.notsync.clearelemtguard.myname=%s
actors.mobs.bosses.notsync.clearelemtguard.thanks=%s，我替聖境密林所有純晶守衛者謝謝你的幫助！
actors.mobs.bosses.notsync.clearelemtguard.thanks2=%s，通往熔岩火林的封印已經解除，請你在本層尋找入口，一定要小心，希望你能活著回來……

actors.mobs.bosses.notsync.clearelemtguard.no_road=%s，我擋著你的路了嗎？抱歉哦……

actors.mobs.bosses.notsync.clearelemtguard.quest_start_prompt11=在這一層下樓的樓梯裡有個密道，我已經解除了那裡的封印，另外，由於曾經我們和它交過手，路上應該有一些物資，也許可以幫到你。\n\n對了，這個給你，算是我代表密林守衛提供給的一點微小的幫助吧。
actors.mobs.bosses.notsync.clearelemtguard.let=出發吧

actors.mobs.bosses.notsync.clearelemtguard.namex=給予幫助？
actors.mobs.bosses.notsync.clearelemtguard.cashout_verify=看起來他現在的狀態不是很好，或許祛邪卷軸可以幫助他……
actors.mobs.bosses.notsync.clearelemtguard.cashout_yes=是的，給予！
actors.mobs.bosses.notsync.clearelemtguard.cashout_no=不，我暫時不想。
actors.mobs.bosses.notsync.clearelemtguard.cashout_none=你的背包中沒有更多的祛邪卷軸了……

