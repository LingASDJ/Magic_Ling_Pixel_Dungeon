actors.mobs.npcs.zero.question.title_1=想問些什麼？
actors.mobs.npcs.zero.question.ling=“綾”
actors.mobs.npcs.zero.question.birth=生平
actors.mobs.npcs.zero.question.dungeon=地牢
actors.mobs.npcs.zero.question.title_5=……你是認真的？
actors.mobs.npcs.zero.question.true=認真的
actors.mobs.npcs.zero.question.false=開玩笑的
actors.mobs.npcs.zero.question.title_4=提醒一下，我這裡的遊戲可都是要錢的。
actors.mobs.npcs.zero.question.fgame=比大小
actors.mobs.npcs.zero.question.sgame=俄羅斯轉盤
actors.mobs.npcs.zero.question.tgame=擲骰子
actors.mobs.npcs.zero.question.title_4_1=對方的大小為_%s_
actors.mobs.npcs.zero.question.title_4_2=請選擇射擊的目標
actors.mobs.npcs.zero.question.he=問號君
actors.mobs.npcs.zero.question.you=自己
actors.mobs.npcs.zero.question.give_up=放棄遊戲
actors.mobs.npcs.zero.question.title_4_3=子彈已經上膛了
actors.mobs.npcs.zero.question.wait=等待
actors.mobs.npcs.zero.question.title_4_4=那麼，你要下注多少呢
actors.mobs.npcs.zero.question.title_4_5=你擲出了_%1$s %2$s %3$s_
actors.mobs.npcs.zero.question.throw=重擲
actors.mobs.npcs.zero.question.stop=決定數字
actors.mobs.npcs.zero.question.no_money=你的身上已經沒有更多的金錢了！
actors.mobs.npcs.zero.question.warning_1=你應該知道的……賭博是犯法的！
actors.mobs.npcs.zero.question.warning_2=你還想著用你那空空如也的錢包換來一生財富???你只會為你提前預備好死亡的墳墓！！！
actors.mobs.npcs.zero.question.warning_3=瘋子……我會拿走你那貪婪的靈魂的！
actors.mobs.npcs.zero.question.warning_4=好了……我會壓上一樣的籌碼，這樣輸起來也不會太難堪。
actors.mobs.npcs.zero.question.message1_1=真不知道你們怎麼想的，來到這座小鎮目的就是為了下地牢尋死。
actors.mobs.npcs.zero.question.message1_2=只是取得水晶之心嗎？我本以為屬於我的戰鬥應該就到了……
actors.mobs.npcs.zero.question.message1_3=又死了一遍嗎……
actors.mobs.npcs.zero.question.message2_1=……
actors.mobs.npcs.zero.question.message2_2=你是認真的？
actors.mobs.npcs.zero.question.message2_3=好吧，但想要東西的話，就必須得用金錢支付，當然也可以跟我玩幾個遊戲。
actors.mobs.npcs.zero.question.message4_1=我對於開掛的人沒有任何興致，請回吧！
actors.mobs.npcs.zero.question.message4_2=這樣嗎……
actors.mobs.npcs.zero.question.message4_3=……？你在開玩笑？？
actors.mobs.npcs.zero.question.message4_4=算是我同意了你的請求！
actors.mobs.npcs.zero.question.message4_5=那麼，開始吧！
actors.mobs.npcs.zero.question.message5_1=我的事情可不興問……
actors.mobs.npcs.zero.question.message5_2=……不認識，又是一位神明嗎？
actors.mobs.npcs.zero.question.message5_3=只是一位意外漂流到這的旅客罷了！
actors.mobs.npcs.zero.question.message5_4=說實話，這個地牢很多人都下去過，但真的有用嗎？
actors.mobs.npcs.zero.question.no_more_1=抱歉！
actors.mobs.npcs.zero.question.no_more_2=今天這個小遊戲就玩到這吧！
actors.mobs.npcs.zero.question.win=……你，居然贏了？
actors.mobs.npcs.zero.question.lose=意料之中……我勸你還是遠離賭博吧！
actors.mobs.npcs.zero.question.draw=出乎意料的……平局……
actors.mobs.npcs.zero.question.chance=是真槍實彈呢……剛剛我打偏了，輪到你了！

actors.mobs.npcs.zero.bluecj.name=小藍
actors.mobs.npcs.zero.bluecj.desc=一位藍髮的一位小龍女，新年還換上了一套紅衣服，一定是未來的龍皇吧（）
actors.mobs.npcs.zero.bluecj.a_message1=蛤？你問我為什麼來這？我也是需要放假的好吧！
actors.mobs.npcs.zero.bluecj.a_message2=心，脈動與活躍之準則。
actors.mobs.npcs.zero.bluecj.a_message3=bro，給小孩發個紅包不用謝
actors.mobs.npcs.zero.bluecj.b_message1=冬，靜默之準則
actors.mobs.npcs.zero.bluecj.b_message2=你的新衣服真帥！
actors.mobs.npcs.zero.bluecj.b_message3=好冷啊！

actors.mobs.npcs.zero.bzmdr.name=Bzmdr
actors.mobs.npcs.zero.bzmdr.desc=一位神秘的少年，穿一身黑，看起來不太好相處，他常常出現在旅館，或許你可以和他聊一聊。
actors.mobs.npcs.zero.bzmdr.a_message1=你好，你要前往地牢嗎，那祝你順利。
actors.mobs.npcs.zero.bzmdr.b_message1=這是我找到的一些東西，這個給你。
actors.mobs.npcs.zero.bzmdr.c_message1=看來你的旅程會很順利。
actors.mobs.npcs.zero.bzmdr.c_message2=注意保持你提燈的亮度。
actors.mobs.npcs.zero.bzmdr.c_message3=或許你可以試試某種東西。
actors.mobs.npcs.zero.bzmdr.d_message1=地牢會很凶險，加油。
actors.mobs.npcs.zero.bzmdr.d_message2=地牢已經被眾多冒險家探索過了，不過他們都沒回來，為什麼你還要前往呢。
actors.mobs.npcs.zero.bzmdr.d_message3=看起來你非常的有信心，祝你好運。
actors.mobs.npcs.zero.bzmdr.e_message1=看來你成功了。
actors.mobs.npcs.zero.bzmdr.e_message2=有一些人會找上你，小心行事。
actors.mobs.npcs.zero.bzmdr.e_message3=你應該不會拿它幹什麼不好的事情吧，不過這和我沒什麼關係就是了。
actors.mobs.npcs.zero.bzmdr.def_verb_1=你想幹什麼……
actors.mobs.npcs.zero.bzmdr.def_verb_2=找不到事情做就快點踏上征途。
actors.mobs.npcs.zero.bzmdr.rankings_desc=被_Bzmdr_的即死攻擊薄紗

actors.mobs.npcs.zero.bzmdrland.name=Bzmdr
actors.mobs.npcs.zero.bzmdrland.desc=鬼知道為什麼他不去旅館反而待在這裡，或許可能是在等人？
actors.mobs.npcs.zero.bzmdrland.message1=你好……，你為什麼不去旅館呢。
actors.mobs.npcs.zero.bzmdrland.message2=你也要烤火嗎……，……這個給你。

actors.mobs.npcs.zero.bzmdrland.message3=看起來你已經去過古堡了，幹得不錯，但這還遠遠不夠。
actors.mobs.npcs.zero.bzmdrland.message4=警惕一點，深淵正注視著你，如果你有注意到因黑暗而誕生的另一面的“你”……
actors.mobs.npcs.zero.bzmdrland.message5=我有一份“禮物”給你，合理利用它，你應該能提前適應更危險的環境。
actors.mobs.npcs.zero.bzmdrland.message6=選擇權在於你，祝你好運。

actors.mobs.npcs.zero.bzmdrland.a_message1=你問我怎麼來的這裡？好奇心別這麼重。
actors.mobs.npcs.zero.bzmdrland.a_message2=因為我想，所以我在這了。
actors.mobs.npcs.zero.bzmdrland.a_message3=這裡有一些順手撿的石頭之類的，你想要就拿著吧。

actors.mobs.npcs.zero.bzmdrland.c_message1=看起來你回來的“交通工具”挺獨特的。
actors.mobs.npcs.zero.bzmdrland.c_message2=地牢正在分崩離析，快離開吧。

actors.mobs.npcs.zero.bzmdrdungeon.name=Bzmdr
actors.mobs.npcs.zero.bzmdrdungeon.desc=???

actors.mobs.npcs.zero.bzmdrland.x_message1=很好，你的旅途只差最後一步了 去打敗祂吧。
actors.mobs.npcs.zero.bzmdrland.x_message2=你問我會不會幫你？拜託，你不會想不勞而獲吧。
actors.mobs.npcs.zero.bzmdrland.x_message3=好吧，拿著這個，我只會幫你這點了。



actors.mobs.npcs.zero.jit.name=寄境
actors.mobs.npcs.zero.jit.desc=這個戴著面具的怪人坐在篝火旁邊彷彿在等待著什麼，但是當你從他手中接過食物的時候，不由自主的聯想到了食堂大媽。
actors.mobs.npcs.zero.jit.message1=又一個玩命的冒險者，拿著吧，這是我能給你的全部幫助了。
actors.mobs.npcs.zero.jit.message2=嗯？冒險者，你在尋找什麼？水晶之心？那東西可沒你想的那麼好。考慮過要付出什麼樣的代價了嗎？
actors.mobs.npcs.zero.jit.message3=面具？探尋別人的隱私對你可沒什麼好處。
actors.mobs.npcs.zero.jit.no1=看來你是皮癢了。
actors.mobs.npcs.zero.jit.no2=又一個被水晶弄瘋的。
actors.mobs.npcs.zero.jit.message4=拿著那東西離我遠點，我可不想再來一次……
actors.mobs.npcs.zero.jit.message5=我看起來可沒那麼平易近人，沒看我拿著武器嗎，離我遠一點吧。

actors.mobs.npcs.zero.deepsea.name=深海
actors.mobs.npcs.zero.deepsea.desc=原本該出現在海邊的傢伙，此刻正在角落那張歪腿的木桌旁，用手無聊地戳著桌面，面前的果汁杯壁上有兩道淺淺的咬痕——顯然對“不能喝酒”這事還在賭氣。
actors.mobs.npcs.zero.deepsea.messages1=你要下地牢自己組隊去，我在這坐到打烊，雜魚別拉我，再拉把你眼珠子泡果汁裡，你拿著餅快走開！
actors.mobs.npcs.zero.deepsea.dx_message1=這麼做有什麼樂趣嗎？
actors.mobs.npcs.zero.deepsea.dx_message2=幫幫我！薩卡班甲魚先生！
actors.mobs.npcs.zero.deepsea.dx_message3=今天小甲魚不在，就勉為其難的放你一馬吧。
actors.mobs.npcs.zero.deepsea.dx_message4=這點力量也想傷害我？哪來的雜魚~

actors.mobs.npcs.zero.moonlow.name=淺月深白
actors.mobs.npcs.zero.moonlow.desc=這個生物看起來只是個普通的人類小孩，但它似乎有著什麼你難以理解的力量...大概吧。
actors.mobs.npcs.zero.moonlow.messages1=......你又來了。
actors.mobs.npcs.zero.moonlow.messages2=你能感覺到的吧，有什麼東西就要來了。
actors.mobs.npcs.zero.moonlow.messages3=你準備好了嗎？
actors.mobs.npcs.zero.moonlow.messages4=這個給你。
actors.mobs.npcs.zero.moonlow.messages5=哦呀哦呀，你好呀~
actors.mobs.npcs.zero.moonlow.messages6=你要下去對吧，祝你好運~
actors.mobs.npcs.zero.moonlow.messages7=哦哦差點忘了，拿著這個！
actors.mobs.npcs.zero.moonlow.world1=你能讓這停滯的世界再轉動嗎？
actors.mobs.npcs.zero.moonlow.world2=我很期待你的表現。
actors.mobs.npcs.zero.moonlow.drink=啊...好想再一次喝個爛醉...
actors.mobs.npcs.zero.moonlow.dx_message1=你真的對這種事很熱衷呢小可愛~
actors.mobs.npcs.zero.moonlow.dx_message3=真是雜魚~（小聲

