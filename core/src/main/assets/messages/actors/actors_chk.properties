actors.blobs.blizzard.desc=這裡颳起了一陣暴風雪。

actors.blobs.magicfire.good=你的武器或護甲被魔法火焰包裹著，產生了一種新的附魔。它是：

actors.blobs.confusiongas.desc=這裡盤繞著一片致眩氣體。

actors.blobs.electricity.desc=火花在這片電能力場中不斷閃爍著。
actors.blobs.electricity.rankings_desc=觸電
actors.blobs.electricity.ondeath=你因觸電而亡……

actors.blobs.fire.desc=一團火焰正在這裡肆虐。

actors.blobs.foliage.desc=光柱刺破了地下花園中的黑暗。

actors.blobs.freezing.desc=這裡的空氣寒冷刺骨，很不尋常。

actors.blobs.worstblizzardfx.desc=暴風雪正在這裡肆虐。

actors.blobs.goowarn.desc=黑暗能量正在這裡湧動！

actors.blobs.inferno.name=煉獄之火
actors.blobs.inferno.desc=此處已成為燃燒著烈焰的人間地獄。

actors.blobs.paralyticgas.desc=這裡盤繞著一片麻痺氣體。

actors.blobs.sacrificialfire.desc=那是一個祭壇，承載著祭祀之火。在此被殺死的生物的靈魂會化作地牢的祭品。\n\n只要獻祭夠多，或許能得到回報？
actors.blobs.sacrificialfire.worthy=火焰吞噬了你的祭品，燒得越來越旺盛起來。
actors.blobs.sacrificialfire.unworthy=火焰吞噬了你的祭品，然而沒有任何變化。
actors.blobs.sacrificialfire.reward=火焰噴薄而起，隨後消散於空氣，最終留下了一份獎勵！

actors.blobs.smokescreen.desc=這裡盤繞著一片烏黑的濃煙。

actors.blobs.stenchgas.desc=這裡盤繞著一片腐爛的臭氣。

actors.blobs.stormcloud.desc=這裡盤繞著一片翻騰的水氣。

actors.blobs.worststormcloud.desc=這裡盤繞著一片奇怪的暴風水氣。

actors.blobs.toxicgas.desc=這裡盤繞著一片發綠的毒氣。
actors.blobs.toxicgas.rankings_desc=窒息而死
actors.blobs.toxicgas.ondeath=你被毒氣毒死了…

actors.blobs.corrosivegas.desc=這裡盤繞著一片致命的侵蝕性酸霧。

actors.blobs.waterofawareness.procced=在你小酌一口時，你感覺到知識湧入了你的頭腦。
actors.blobs.waterofawareness.desc=知識的力量正在從這口井的水裡湧出。飲下井中的水以揭示所有已裝備物品以及本層所有物品的秘密。

actors.blobs.alter.awaterofawareness.procced=在你小酌一口時，你感覺到知識湧入了你的頭腦。
actors.blobs.alter.awaterofawareness.desc=知識的力量正在從這口井的水裡湧出。飲下井中的水以揭示所有已裝備物品以及本層所有物品的秘密。

actors.blobs.waterofhealth.procced=就在你小酌一口時，你感到你的傷口完全癒合了。
actors.blobs.waterofhealth.desc=生命的力量正在從這口井的水裡湧出。\n飲下井中的水以治療你的傷口並填滿你的肚子。

actors.blobs.alter.awaterofhealth.procced=在你小酌一口時，你感覺到知識湧入了你的頭腦。
actors.blobs.alter.awaterofhealth.desc=知識的力量正在從這口井的水裡湧出。飲下井中的水以揭示所有已裝備物品以及本層所有物品的秘密。

actors.blobs.wateroftransmutation.desc=變化的力量正在從這口井的水裡湧出。\n扔進一個物品以將其轉化為其他物品。

actors.blobs.alter.awateroftransmutation.desc=變化的力量正在從這口井的水裡湧出。\n扔進一個物品以將其轉化為其他物品。

actors.blobs.waterofoil.desc=這口井裡的油可以為提燈提供一定的燈油。
actors.blobs.waterofoil.clear=你將提燈放入了油井中，你的剩餘燈油量有所提升了。
actors.blobs.waterofoil.cl6=提燈儲存超過60%，暫時無法充能。

actors.blobs.web.desc=這裡所有東西都被厚厚的蜘蛛網覆蓋著。任何接觸或丟向蛛網的東西都會打破它，但也都會被固定在原地。

actors.buffs.venom.name=毒液侵染
actors.buffs.venom.heromsg= 您正在窒息！
actors.buffs.venom.ondeath=你死於猩紅毒氣...
actors.buffs.venom..rankings_desc=窒息而死……
actors.buffs.venom.desc=劇毒氣體會以驚人的速度燒毀生物的呼吸道.\n\n每次受到毒素傷害都會在生物體內累積毒素，在高度中毒狀態下將會失明，如果陷入嚴重中毒狀態，目標會持續窒息，陷入麻痺狀態，直到死亡降臨。\n\n剩餘中毒量: %1$s。\n\n當前毒液傷害: %2$d。





###buffs

actors.buffs.abundantmagic.name = 魔能充盈
actors.buffs.abundantmagic.desc = 你的下一次非魔彈法杖施法將不會消耗回合 \n\n這個buff還會持續%s回合

actors.buffs.killer.name = 好運不會眷顧傻瓜！
actors.buffs.killer.desc = 你的任何近戰傷害都會直接擊殺非BOSS單位 \n\n這個buff還會持續%s回合

actors.buffs.goodluck.name = 好運來
actors.buffs.goodluck.desc = 你接下來擊殺的怪物必定觸發一次稀有度不為最高的額外掉落 \n\n這個buff還會持續%s回合

actors.buffs.adrenaline.name=激素湧動
actors.buffs.adrenaline.desc=由腎上腺素帶來的純粹的潛能爆發，激素湧動能夠增強一名角色的移動和攻擊速度。\n\n激素湧動允許角色擁有2倍的移動速度和1.5倍的攻擊速度。\n\n持續時間：%s 回合。

actors.buffs.adrenalinesurge.name=激素湧動
actors.buffs.adrenalinesurge.desc=一股強大的力量，不過很可惜不是永久的。\n\n力量加成：+%d。\n距離效果衰減還有：%s回合。

actors.buffs.amok.name=狂亂
actors.buffs.amok.desc=狂亂導致狀態下的生物進入一種極度憤怒和混亂的狀態。 \n\n狂亂的生物會不分敵我地攻擊任何靠近它們的人。\n\n剩餘的狂亂效果時長：%s回合

actors.buffs.invulnerability.name=無敵
actors.buffs.invulnerability.desc=你的重生十字架已消耗了它的能量，恢復了你的生命值的同時還給予了你短暫的無敵時間！\n\n效果剩餘回合數：%s。

actors.buffs.invulnerability$goddied.name=創世神之怒
actors.buffs.invulnerability$goddied.desc=被遺忘的過去，他們究竟在隱藏著什麼？為了自己的子民，她甘願放逐自己帶來和平。而如今又有誰記得她呢？是時間淡忘了過去的傷痛，還是人們忘掉了曾經的她？\n奇怪的聲音在你耳旁環繞，你感受到了同樣的憤怒。在該狀態下，物理傷害提升至225%，傷害類法杖傷害x2，移速提升2倍，完全無敵。

actors.buffs.arcanearmor.name=秘法護盾
actors.buffs.arcanearmor.desc=一層淡薄的護盾環繞著你，可為你抵擋一定的魔法傷害。\n\n當前你的魔法護甲值為: 0~%d。\n\n秘法護盾會在 %s 回合後自我衰減。

actors.buffs.artifactrecharge.name=神器充能
actors.buffs.artifactrecharge.desc=魔力在你體內奔騰而過，提高你手中神器的充能速率。 \n\n每件神器受到的影響都不盡相同，但它們的充能速率都會大幅提升。\n\n剩餘的神器充能效果時長：%s回合

actors.buffs.barkskin.name=樹膚
actors.buffs.barkskin.desc=你的皮膚硬化了，摸起來如同樹皮般粗糙而堅固。 \n\n硬化的皮膚增強了你的護甲，使你能更好地抵禦物理攻擊。\n\n當前增加的護甲值：0~%d。\n距離效果衰減還有：%s 回合。

actors.buffs.barrier.name=奧術屏障
actors.buffs.barrier.desc=一團可以抵擋全部傷害的能量屏障。\n\n只要奧術屏障的能量仍然存在，它將完全抵擋單位所受到的任何傷害。同時這種能量會隨時間逐漸衰減。\n\n護盾能量剩餘：%d。

actors.buffs.berserk.angered=憤怒
actors.buffs.berserk.berserk=狂暴
actors.buffs.berserk.exhausted=力竭
actors.buffs.berserk.recovering=恢復
actors.buffs.berserk.angered_desc=狂戰領主所造成的傷害會增強他的攻擊力。狂戰領主造成物理傷害時會積攢怒氣，賦予他更強的攻擊力。\n\n怒氣會隨時間而減淡。狂戰領主生命值越低，怒氣存留的時間越長。\n\n積滿怒氣並且裝備著紋章的狂戰領主在生命值降至0時，他會狂暴並在短時間內_抗拒死亡_。\n\n當前怒氣：_%.0f%%_ \n_+%.0f%%_攻擊
actors.buffs.berserk.berserk_desc=在瀕死之際，恐懼和不安已經煙消雲散，留存下來的只剩怒火。這種瀕死情況下的狂戰領主會變得無比強大，_額外造成50%的傷害，獲得額外的護盾值，並且無法死亡。_\n\n狂戰領主的護甲越強，獲得的額外護盾值也會越多。護盾值會隨時間消失殆盡，降至0後狂戰領主會徹底消亡。\n\n任何形式的治療都會讓狂戰領主恢復穩定，不過他會變得精疲力竭。力竭的狂戰領主需要得到足夠的經驗才可以再次積攢怒氣。
actors.buffs.berserk.recovering_desc=內在力量是有限的。狂戰領主必須充分休息才能再次釋放他的狂暴。\n\n正在恢復的狂戰領主不能積攢怒氣。\n\n恢復所需等級：_%.2f_
actors.buffs.berserk.no_rages=瀕死時的狂暴會造成永久性的創傷，每次都會降低狂戰領主的生命上限。
actors.buffs.berserk.past_rages=狂戰領主狂暴次數：_%d_\n生命上限降至：_%d%%_
actors.buffs.berserk.rankings_desc=暴走至死
actors.buffs.berserk.recovering_desc_turns=恢復所需回合數：%d
actors.buffs.berserk.recovering_desc_levels=---------------------
actors.buffs.berserk.action_name=狂暴
actors.buffs.berserk.no_seal=你需要破損紋章才能進入狂暴！

actors.buffs.bleeding.name=流血
actors.buffs.bleeding.ondeath=你因失血過多而死……
actors.buffs.bleeding.heromsg=你正在流血！
actors.buffs.bleeding.rankings_desc=流血致死
actors.buffs.bleeding.desc=傷口正在令人不安地湧出大量血液。 \n\n流血每回合都會造成傷害。每回合這個傷害數值都會隨機減少，直到出血最終停止。 \n\n當前流血傷害：%d

actors.buffs.bless.name=賜福
actors.buffs.bless.desc=你的集中力正在噴薄而出，有人說這是神賜的禮物。 \n\n賜福狀態能夠提高自己25%%的精準與閃避屬性，使被賜福者在戰鬥中勢如破竹。 \n\n剩餘賜福效果時長：%s回合

actors.buffs.blindness.name=失明
actors.buffs.blindness.heromsg=你失明了！
actors.buffs.blindness.desc=失明使周遭的一切陷入黑暗。 \n\n失明時，角色不能看到周身一格以外的環境、致使遠程攻擊變得毫無作用、同時也很容易遺失正在追蹤的敵人的動向。此外，失明的英雄也無法讀書或使用卷軸。 \n\n剩餘的失明效果時長：%s回合

custom.buffs.absoluteblindness.name=絕對失明
custom.buffs.absoluteblindness.desc=絕對失明使你的可見範圍只有你自己。 \n\n剩餘的絕對失明效果時長：%s回合

actors.buffs.burning.name=燃燒
actors.buffs.burning.heromsg=你著火了！
actors.buffs.burning.burnsup=%s被燒毀了！
actors.buffs.burning.ondeath=你被燃燒至死…
actors.buffs.burning.rankings_desc=燃燒殆盡
actors.buffs.burning.desc=沒什麼比被火焰吞沒更痛苦了。 \n\n火焰會每回合都會造成傷害直到它被液體撲滅或者自行消散。火會在你進入水中時熄滅，打碎藥瓶產生的水花也具有同樣的效果。 \n\n此外，火焰還會點燃所有接觸到的可燃地形（以及可燃地形上的可燃物）。 \n\n剩餘的燃燒效果時長：%s回合

actors.buffs.championenemy.warn=你感受到了強敵的氣場。
actors.buffs.championenemy$blazing.name=烈焰精英
actors.buffs.championenemy$blazing.desc=烈焰精英造成 25% 額外近戰傷害，會點燃攻擊目標，免疫火焰，且會在死亡時引燃周遭。
actors.buffs.championenemy$projecting.name=索敵精英
actors.buffs.championenemy$projecting.desc=索敵精英擁有 25% 額外近戰傷害，且能攻擊到他們看得見的與它距離4格的目標。
actors.buffs.championenemy$antimagic.name=敵法精英
actors.buffs.championenemy$antimagic.desc=敵法精英擁有 25% 的傷害減免，且對於法術傷害擁有額外50%的傷害減免。
actors.buffs.championenemy$giant.name=巨型精英
actors.buffs.championenemy$giant.desc=巨型精英擁有 75% 的傷害減免與額外的一格近戰攻擊距離，但無法進入狹窄的空間。
actors.buffs.championenemy$blessed.name=天佑精英
actors.buffs.championenemy$blessed.desc=天佑精英擁有 200% 額外精準與躲避。
actors.buffs.championenemy$growing.name=成長精英
actors.buffs.championenemy$growing.desc=成長精英擁有會穩步增長的額外精準、躲避、近戰傷害與傷害減免。\n\n當前精準、躲避、近戰傷害加成：%1$d%%\n當前傷害減免：%2$d%%


actors.buffs.championenemy$alonecity.name=孤城印記
actors.buffs.championenemy$alonecity.desc=遊蕩在孤城的怪物，是曾經最強大的靈魂。\n\n孤城印記擁有會穩步增長的額外精準、躲避、近戰傷害與傷害減免以及初始生命提升。\n\n當前精準、躲避、近戰傷害加成：%1$d%%\n當前初始血量提升：%2$d%%

actors.buffs.championenemy$halo.name=鬼磷精英
actors.buffs.championenemy$halo.desc=鬼磷精英造成 15% 額外近戰傷害，會使用更強大的磷火點燃攻擊目標，免疫火焰，免疫磷火。

actors.buffs.championenemy$delaymob.name=苦痛精英
actors.buffs.championenemy$delaymob.desc=苦痛精英可以將受到的傷害進行延時釋放，擁有 45% 額外近戰傷害，擁有60%的傷害減免。

actors.buffs.championenemy$king.name=煉獄精英
actors.buffs.championenemy$king.desc=煉獄精英造成 45% 額外近戰傷害，擁有30%的傷害減免。攻擊有機率召喚1個同層敵人進行攻擊。


actors.buffs.championenemy.warn2=殺戮與不祥之意籠罩在整個地牢之中……

actors.buffs.championenemy$small.name=突變失敗體
actors.buffs.championenemy$small.desc=全局移速提升30%，攻擊降低35%。\n\n突變失敗體的命運通常是很悲慘的，他們最後可能被同類相食，或者在再突變的道路中因為體力不支而徹底離開世界……

actors.buffs.championenemy$bomber.name=突變爆炸體
actors.buffs.championenemy$bomber.desc=全局移速降低50%,攻擊力降低30%，死亡造成大量爆炸傷害，需要小心應對。\n\n突變爆炸體生來就是為了爆炸，它們被神秘力量腐蝕，因此爆炸傷害極為強力。

actors.buffs.championenemy$middle.name=突變完全體
actors.buffs.championenemy$middle.desc=全局移速提升50%，攻擊力提高25%,且擁有30%傷害減免\n\n突變完全體似乎看起來沒有缺點，但問題在於，一些個體的成功並不意味著我們能與她抗衡……

actors.buffs.championenemy$big.name=突變危險體
actors.buffs.championenemy$big.desc=攻擊力提升20%,攻擊有20%機率造成流血。死亡時有5%機率立刻向本層發出警報。\n\n突變危險體就和他的名字一樣，充滿了危機感，在這裡遇到它必不是什麼好事……。建議還是繞道而行吧。

actors.buffs.championenemy$healright.name=突變相位體
actors.buffs.championenemy$healright.desc=這種突變體在前面4次攻擊命中敵人後會隨機傳送，並且不處於你視野中時可緩慢回復生命\n\n當前累計傳送次數：%d。

actors.buffs.championenemy$longsider.name=突變煙霧體
actors.buffs.championenemy$longsider.desc=攻擊力減少10%，攻擊範圍+1，攻擊敵人10%機率造成眩暈……\n\n突變煙霧體喜好在遠處騷擾敵人，他就像煙霧一樣來無影去無蹤……

actors.buffs.championenemy$sider.name=突變酸液體
actors.buffs.championenemy$sider.desc=該詞條的敵人獲得遠程攻擊，攻擊範圍+2，造成自身可造成的傷害20%的額外法術傷害並有機率隨機產生一種有害煙霧。\n\n突變酸液體喜歡使用酸液來攻擊敵人，他們的酸液不穩定性可以造成大量傷害，但是這種致命的酸液需要時間來準備，因此他們的攻擊速度會降低_300%_。\n\n它們的酸液體不是無限的，如果沒有酸液後，它們會開始常規攻擊。\n\n部分敵人突變為酸液體還會進行多次連擊造成巨額傷害。
actors.buffs.championenemy$sider.death=你被酸液體所釋放的毒霧腐蝕至死……

actors.buffs.charm.name=魅惑
actors.buffs.charm.heromsg=你被魅惑了！
actors.buffs.charm.desc=魅惑是一種能讓一對夙敵暫時陷入互相傾慕的控制類魔法。\n\n被魅惑的單位將無法對魅惑施行者進行直接攻擊，但依然可以攻擊其他敵人。傷痛會激醒被魅惑單位，減少魅惑狀態的持續時間。\n\n魅惑剩餘持續時間：%s回合。

actors.buffs.charm$charmling.name=絕對魅惑
actors.buffs.charm$charmling.desc=絕對魅惑是一種惡毒且古老的魔法。\n\n被魅惑的單位將無法對魅惑者造成任何傷害，並且物理傷害降低25%%。\n\n傷痛會激怒被魅惑單位，減少絕對魅惑狀態的持續時間。\n\n絕對魅惑剩餘持續時間：%s回合。

actors.buffs.chill.name=凍傷
actors.buffs.chill.freezes=%s凍住了！
actors.buffs.chill.desc=還沒有完全凍住，不過已經非常冷了。\n\n凍傷的目標所有行動都會更加緩慢，減速程度取決於剩餘的凍傷效果時間。最嚴重的凍傷情況等同於遲緩效果。\n\n剩餘的凍傷效果時長：%1$s回合\n當前減少的速度：%2$s%%

actors.buffs.worstblizzard.name=風雪交加
actors.buffs.worstblizzard.desc=暴風雪下，沒有誰可以堅持下去。而在更加寒冷的區域中，暴風雪造成的影響將會更加嚴峻。\n\n風雪交加下的目標所有行動都會更加緩慢。\n\n當前減少的行動速度：%d%%\n\n你當前並未在寒冷區域，不會對目標造成額外的特殊影響。
actors.buffs.worstblizzard.effect=暴風雪下，沒有誰可以堅持下去。而在更加寒冷的區域中，暴風雪造成的影響將會更加嚴峻。\n\n風雪交加下的目標所有行動都會更加緩慢。\n\n當前減少的行動速度：%1$s%%\n\n你當前在寒冷區域，目標的防禦和精準率會大幅度削弱，詳細情況如下：\n\n目標防禦削弱：%2$s%%\n目標命中削弱：%3$s%%

actors.buffs.combo.name=連擊
actors.buffs.combo.action_name=連擊
actors.buffs.combo.combo=%d連擊！
actors.buffs.combo.bad_target=你的目標必須是攻擊距離以內的敵人。
actors.buffs.combo.prompt=選擇一個攻擊目標
actors.buffs.combo.desc=角鬥之王在連續打擊對手的過程中漸入佳境，每次攻擊命中都會增加1點連擊數，但長時間不進行攻擊會將連擊數歸零。\n\n積攢連擊數可以啟用必定命中的處決技能！連擊數到達2，4，6，8，10時會分別啟用不同的技能。部分處決技能會重設你的連擊數，但每種處決技能在一次連擊中只能使用一次。\n\n當前的連擊數：%1$d。\n\n連擊將在%2$s回合後遺失。\n\n角鬥之王最多可保存50連擊數
actors.buffs.combo$combomove.crush.name=震擊
actors.buffs.combo$combomove.crush.desc=對目標及其周圍單位造成60%%傷害，此次攻擊無視護甲且必定命中。
actors.buffs.combo$combomove.crush.finish_desc=對目標及其7*7範圍內的所有敵人造成_%d%%_(連擊數*15%%)傷害，此次攻擊無視護甲且必定命中。
actors.buffs.combo$combomove.parry.name=格擋
actors.buffs.combo$combomove.parry.desc=格擋下回合內受到的第一次攻擊，並立即發起還擊。
actors.buffs.combo$combomove.parry.finish_desc=格擋下回合內受到的所有攻擊並發起反擊。反擊造成_%d%%_(連擊數*20%%)傷害且必定命中。
actors.buffs.combo$combomove.cleave.name=順劈
actors.buffs.combo$combomove.cleave.desc=對目標發起一次必中攻擊，倘若擊殺目標，額外提升2點連擊。
actors.buffs.combo$combomove.cleave.finish_desc=對目標造成_%d%%_(連擊數*25%%)的傷害。倘若擊殺目標，立即返還一半連擊數。
actors.buffs.combo$combomove.fury.name=連斬
actors.buffs.combo$combomove.fury.desc=以較低的精準對目標快速發起2次攻擊，每次攻擊造成75%%的傷害並可以觸發附魔。
actors.buffs.combo$combomove.fury.finish_desc=以較低的精準對目標快速發起_%d_(連擊數)次攻擊，每次攻擊造成75%%的傷害並可以觸發附魔。
actors.buffs.combo$combomove.spurt.name=衝刺
actors.buffs.combo$combomove.spurt.desc=向一個4格遠的地點發起衝刺。無法穿過敵人和障礙物，但可以躍過深淵。
actors.buffs.combo$combomove.spurt.finish_desc=衝向一個_%1$d_(連擊數/2)格遠的地點，並獲得_%2$d_（連擊數/2）回合激素湧動。
actors.buffs.combo$combomove.finish.name=終結
actors.buffs.combo$combomove.finish.desc=將所有的技能轉化為終結技。終結技獲得連擊數加成，釋放時重設連擊。
actors.buffs.combo$combomove.calm.name=冷靜
actors.buffs.combo$combomove.calm.finish_desc=清除大部分負面效果，並獲得當前損失生命_%1$d%%_(連擊數*2%%)的緩慢恢復。

actors.buffs.corruption.name=腐化
actors.buffs.corruption.desc=腐化魔法會侵入生物體的生命本質，扭轉他們原有的天性。\n\n被腐化的生物會攻擊他們的盟友，還會忽視其原先的敵人。腐化效果同時也是有傷害性的，會導致其目標緩慢走向死亡。\n\n腐化是永久性的，死後才能解脫。

actors.buffs.cripple.name=殘廢
actors.buffs.cripple.heromsg=你殘廢了！
actors.buffs.cripple.desc=你很確定自己的腿不該折成那樣。 \n\n殘廢會減半移動速度，移動一格會消耗二回合而不是正常情況下的一回合。 \n\n剩餘的殘廢效果時長：%s回合

actors.buffs.degrade.name=降級
actors.buffs.degrade.heromsg=你的裝備被暫時弱化了！
actors.buffs.degrade.desc=強大的黑暗魔法正在吞噬升級卷軸注入你裝備的魔力！\n\n降級狀態下的裝備會被視作比起原有等級更低的狀態。_超過3級的每次升級都會遭受愈加嚴重的反噬。_物品的描述也會根據降級的影響而改變。\n\n不過，降級不會影響裝備的力量需求，法杖充能，投武耐久以及神器。\n\n降級的剩餘持續時間：%s回合。使用一張升級卷軸或祛邪卷軸可以立即驅散這種黑暗魔法。

actors.buffs.doom.name=定命
actors.buffs.doom.desc=當整個宇宙都看起來想置你於死地時，繼續鬥爭還有什麼意義呢？\n\n被定命的角色所接受的任何傷害都會翻倍。\n\n定命是永久性的，死後才能解脫。

actors.buffs.dread.name=魂飛魄散
actors.buffs.dread.desc=目標已被嚇至魂飛魄散，正在極度的恐慌下嘗試逃出這座地牢！\n\n魂飛魄散的生物將快速逃離它們的敵人，並且會在脫離敵人視野後立即消失在整座地牢中。逃離的敵人不會掉落道具，只會給予玩家減半的經驗值獎勵。傷害所造成的痛楚將促使其鎮定下來。\n\n逃命中，剩餘時長：%d 回合。

actors.buffs.drowsy.name=催眠
actors.buffs.drowsy.desc=一股魔法力量使目標很難保持清醒。 \n\n英雄可以透過受到傷害或保持完整生命值來維持清醒。\n\n幾個回合之後，目標將會陷入魔法睡眠。

actors.buffs.earthimbue.name=大地之力
actors.buffs.earthimbue.desc=你被灌注了大地的力量！\n\n直到該效果結束前，你所有的物理攻擊都會使敵人被纏繞在原地無法動彈一段時間。\n\n大地之力還能持續%s回合。

actors.buffs.enhancedrings.name=戒指強化
actors.buffs.enhancedrings.desc=極影鈴虹在使用神器時會強化裝備中的戒指，在%%d回合內使其獲得+1升級。

actors.buffs.fireimbue.name=火焰之力
actors.buffs.fireimbue.desc=你被灌注了火焰的力量！\n\n所有物理攻擊都有機會使敵人燃燒。與此同時你對火焰完全免疫。\n\n剩餘火焰之力效果時長：%s回合

actors.buffs.foresight.name=危險預知
actors.buffs.foresight.desc=不知為何，你的腦海中映射出了周遭的地形。\n\n遠見狀態持續時，你周遭大範圍的地格都會被揭示，包括隱藏門與陷阱。\n\n遠見的剩餘時長：%s 回合。

actors.buffs.frost.name=冰凍
actors.buffs.frost.freezes=%s凍住了！
actors.buffs.frost.desc=不要認為被凍得很結實了，這種溫和的凍結只是把目標包裹在冰裡。 \n\n凍結效果類似於麻痺，使目標不能行動。與麻痺不同的是，凍結效果會在目標受到傷害時立即消失，因為冰會碎。\n\n剩餘的凍結效果時長：%s回合

actors.buffs.frostimbue.name=晶觸之力
actors.buffs.frostimbue.desc=你被灌注了寒霜的力量！\n\n所有形式的物理攻擊都會在敵人身上累加凍傷效果。與此同時你對凍傷完全免疫。\n\n剩餘晶觸之力效果時長：%s回合

actors.buffs.fury.name=憤怒
actors.buffs.fury.heromsg=你陷入了暴怒之中！
actors.buffs.fury.desc=你非常暴怒，很明顯敵人並不喜歡這樣的你。\n\n一股猛烈的怒火在你體內燃燒，增加你50%%的物理攻擊傷害。

actors.buffs.blobimmunity.name=淨化屏障
actors.buffs.blobimmunity.desc=一種奇怪的能量環繞在你的周圍，為你阻擋有害的環境效果。\n\n在淨化屏障的持續時間內，你將免疫所有負面環境效果。\n\n剩餘的免疫效果時長：%s回合。

actors.buffs.haste.name=極速
actors.buffs.haste.desc=強大的能量灌入到你的雙腿肌肉上，允許你以不可思議的速度移動！\n\n當你擁有極速狀態時你將擁有3倍的移動速度，但是其他行動速度仍然和原來一樣。\n\n極速持續時間：%s 回合。

actors.buffs.healing.name=治療
actors.buffs.healing.desc=一股治癒魔力讓你的傷口開始癒合。\n\n你的生命將逐回合穩定回復，直到治療效果終止。治療量將隨著時間逐漸減少。\n\n下一回合治療量：%d\n\n剩餘治療量：%d。

actors.buffs.hex.name=幻惑
actors.buffs.hex.heromsg=你的精神受到了魔法的干擾！
actors.buffs.hex.desc=干擾集中力的黑暗魔法，使目標無法準確地判斷方位。\n\n幻惑狀態會降低目標20%%的精準與閃避屬性，使其在戰鬥中更容易處於下風。\n\n幻惑的剩餘時長：%s回合。

actors.buffs.holdfast.name=不動如山
actors.buffs.holdfast.desc=蕾零安潔提升他的護甲0~%d點，當蕾零安潔受到凍傷，冰凍，遲緩，纏繞，殘疾，麻痺等debuff影響時，該效果乘3倍_。

actors.buffs.hunger.hungry=飢餓
actors.buffs.hunger.starving=極度飢餓
actors.buffs.hunger.onhungry=你有點餓了。
actors.buffs.hunger.onstarving=你已經飢腸轆轆！
actors.buffs.hunger.ondeath=你活活餓死了……
actors.buffs.hunger.cursedhorn=就在你吃東西的時候被詛咒的號角偷走了一部分食物的能量。
actors.buffs.hunger.rankings_desc=飢餓致死
actors.buffs.hunger.desc_intro_hungry=你能感受到自己的肚子在不斷尋求食物，不過還不算那麼嚴重。
actors.buffs.hunger.desc_intro_hungry_dirt=飢餓正在逐步侵蝕你的理智和你的健康，不過還不算那麼嚴重。（來源：土刀架）

actors.buffs.hunger.desc_intro_starving=你的飢餓程度已經危及生命了。
actors.buffs.hunger.desc=\n\n飢餓會在你在地牢裡花費時間的同時緩慢累計，直到你餓得難以忍受。在你極度飢餓時生命值會停止回復並且開始緩慢減少 。\n\n合理利用食物非常重要！如果你有足夠的生命值來維持飢餓，你就該等到一會食物更多的時候再吃。正確的配給可以讓食物更有效地發揮作用！

actors.buffs.invisibility.name=隱形
actors.buffs.invisibility.desc=你和周圍的地形完全融為一體，使你不可能被看到。 \n\n當你在隱形時敵人無法追蹤或攻擊你。大部分物理攻擊和魔法(比如卷軸和法杖)會立即解除隱形效果。 \n\n剩餘的隱形效果時長：%s回合

actors.buffs.levitation.name=漂浮
actors.buffs.levitation.desc=一股魔力把你從地面托起，讓你覺得自己身輕如燕。 \n\n在漂浮時你會無視所有以地面為基礎的效果。陷阱不會被觸發、火焰不會被水撲滅、植物不會被踩踏、根系無法纏繞你、並且能夠跨越深淵。當心，在效果結束的那一刻上述效果都會失效！\n\n剩餘的漂浮效果時長：%s回合

actors.buffs.lifelink.name=生命聯結
actors.buffs.lifelink.desc=這個角色的生命力與另一位緊密相連，它們將共同分擔所有受到的傷害。\n\n當它受到傷害時，半數的傷害將由另一方承擔。\n\n系命效果將在%s回合後或是另一方陣亡時消失。

actors.buffs.light.name=發光
actors.buffs.light.desc=即使是在最黑暗的地牢中，身邊有一個穩定的光源也總是令人欣慰。 \n\n光照能驅散黑暗，使你能夠無視周遭的黑暗環境並擁有一個合理的視野範圍。 \n\n剩餘的發光效果時長：%s回合

actors.buffs.lockedfloor.name=背水一戰
actors.buffs.lockedfloor.desc=當前樓層被徹底封鎖，你無法離開這裡！\n\n封鎖持續期間，你不會更加飢餓，或因極度飢餓減少生命值。此外，如果你沒有在與Boss戰鬥，所有的被動回復都會停止。\n\n另外，如果你在樓層封鎖時被未祝福的重生十字架復活了，本層將被完全重設。\n\n擊殺本層Boss以解除封鎖。

actors.buffs.lostinventory.name=遺物
actors.buffs.lostinventory.desc=你的遺物已經流落到地牢的某處！\n在重拾你的遺物之前，你將無法拾取或使用大部分道具。這或許是因為你的靈魂也遺落了一部分吧。

actors.buffs.magicalsight.name=魔能透視
actors.buffs.magicalsight.desc=不知為何，即使閉上眼睛你也可以用心靈洞察到周圍發生的一切。\n\n當處於靈視狀態時，周遭事物不再會阻擋你的視線，影響視力的異常狀態也會被破除。並且你的視野範圍增加  50%%。\n\n靈視的剩餘時長：%s 回合。

actors.buffs.magicalsleep.name=魔法睡眠
actors.buffs.magicalsleep.toohealthy=你十分健康，因此抵抗住了強烈的嗜睡感。
actors.buffs.magicalsleep.fallasleep=你深深地陷入了魔法睡眠。
actors.buffs.magicalsleep.wakeup=你醒來後，感覺渾身清爽並且十分健康。
actors.buffs.magicalsleep.desc=目標已深深陷入了魔法睡眠，不會自然醒來。\n\n魔法睡眠與一般的睡眠基本一樣，但只有受傷會致使目標醒來。\n\n對於英雄，魔法睡眠有一些恢復性的效果，使他們能夠在睡眠中迅速癒合傷口。

actors.buffs.magicimmune.name=魔法免疫
actors.buffs.magicimmune.desc=任何魔法都奈何不了你，你對魔法完全免疫。\n\n在魔法免疫狀態下，所有魔法效果無論益害都無法影響你，包括但不限於詛咒、附魔、刻印、法杖、卷軸等。\n\n剩餘魔法免疫時長：%s回合。

actors.buffs.mindvision.name=靈視
actors.buffs.mindvision.desc=你可以在腦海中以某種方式看到這一層的所有生物。這種感覺非常奇異。\n\n只要靈視效果依然存在，這層的所有生物都會在你的視野當中。通過靈視看到的生物同樣算作視野中的目標，可以被很多魔法效果影響。\n\n剩餘的靈視效果時長：%s回合

actors.buffs.momentum.momentum=動量積蓄
actors.buffs.momentum.running=逸動
actors.buffs.momentum.resting=恢復
actors.buffs.momentum.action_name=逸動
actors.buffs.momentum.momentum_desc=移動的時候，風行之子會逐漸積蓄動能。風行之子可以消耗動量以開啟逸動狀態。\n\n每一點動量可以支持兩個回合的逸動，最多可以儲存10點動量。當風行之子停止移動時動量會快速消散。\n\n現有的動量：%d。
actors.buffs.momentum.running_desc=移動的時候，風行之子會逐漸積蓄動能。風行之子可以消耗動能以開啟逸動狀態。\n\n處於逸動狀態時，風行之子能夠以兩倍速移動，並且基於自身等級獲得額外的閃避屬性。\n\n效果剩餘回合數：%d。
actors.buffs.momentum.resting_desc=移動的時候，風行之子會逐漸積蓄動量。風行之子可以消耗動量以開啟逸動狀態。\n\n風行之子現在需要休息一會恢復體力才能重新積蓄動量。\n\n還需要休息%d回合。

actors.buffs.ooze.name=腐蝕淤泥
actors.buffs.ooze.heromsg=汙泥在腐蝕你的身體。洗掉它！
actors.buffs.ooze.ondeath=你被徹底融化掉了...
actors.buffs.ooze.rankings_desc=被溶解
actors.buffs.ooze.desc=這種粘稠的酸性淤泥正在緊貼你的骨肉，並緩慢地將它們腐蝕融化。\n\n腐蝕淤泥會對受害者持續造成傷害，不過能夠立刻在水中洗掉。\n\n剩餘的腐蝕淤泥持續時長：%s回合

actors.buffs.paralysis.name=麻痺
actors.buffs.paralysis.heromsg=你被麻痺了！
actors.buffs.paralysis.out=解脫麻痺
actors.buffs.paralysis.desc=通常最壞的事就是什麼事都做不出來。\n\n麻痺會停止目標的一切動作，使目標保持原狀直到效果消失。受傷導致的疼痛也能幫助目標脫離麻痺。 \n\n剩餘的麻痺效果時長：%s回合

actors.buffs.pincushion.name=中矢
actors.buffs.pincushion.desc=你擊中這個角色的投擲武器正卡在他們身上，打敗他們後投擲武器將會掉在地上。\n\n正卡在其他角色身上的物品：

actors.buffs.poison.name=中毒
actors.buffs.poison.heromsg=你中毒了！
actors.buffs.poison.ondeath=你被毒死了……
actors.buffs.poison.rankings_desc=中毒致死
actors.buffs.poison.desc=毒素傳遍全身，緩慢地損傷著各個臟器。 \n\n毒素每回合造成的傷害與其剩餘的回合數成正比。 \n\n剩餘的中毒效果時長：%s回合

actors.buffs.preparation.name=準備階段
actors.buffs.preparation.action_name=蓄意打擊
actors.buffs.preparation.desc=皇家刺客正耐心地等待著，準備從暗影中給出致命一擊。
actors.buffs.preparation.desc_dmg=他的下一次攻擊會造成_%1$d%%的額外傷害_，並瞬間斬殺生命低於_%2$d%%_的普通敵人，或生命低於_%3$d%%_的Boss。
actors.buffs.preparation.desc_dmg_likely=這一擊也更有可能造成額外的傷害。
actors.buffs.preparation.desc_blink=他可以瞬間衝刺到敵人身邊再攻擊，最大衝刺距離為%d格。
actors.buffs.preparation.desc_invis_time=皇家刺客已經隱形了_%d_回合。
actors.buffs.preparation.desc_invis_next=這一擊在_%d_回合後會變得更強。
actors.buffs.preparation.prompt=選擇一個攻擊的目標！\n最大衝刺距離：%d格
actors.buffs.preparation.no_target=這裡沒有可攻擊的目標。
actors.buffs.preparation.out_of_reach=你無法衝刺到目標距離。
actors.buffs.preparation.assassinated=斬殺

actors.buffs.prismaticguard.name=虹色替身
actors.buffs.prismaticguard.desc=你正在被一個目前看不見的虹色替身所保護。當有敵人出現時這個虹色替身將出現並為你戰鬥！\n\n當虹色替身未啟用時，它將逐漸恢復所有所受到的傷害。\n\n替身當前生命值：%d /%d。

actors.buffs.recharging.name=充能
actors.buffs.recharging.desc=魔力在你體內奔騰而過，提高你的魔杖和法杖的充能速率。 \n\n每回合這個效果都將給你的法杖/魔杖增加四分之一點充能，這個效果的充能不同於正常充能並且能與之疊加。\n\n剩餘的充能效果時長：%s回合

actors.buffs.revealedarea.name=區域揭示
actors.buffs.revealedarea.desc=揭示地牢中一片區域的視野，無論你身處這層中的何處都能對那裡一覽無遺。\n\n剩餘回合數：%s。

actors.buffs.revealedchar.name=已揭示
actors.buffs.revealedchar.desc=這個單位已被揭示，無論它在哪裡都將是可見的。\n\n剩餘回合數：%s。

actors.buffs.roots.name=纏繞
actors.buffs.roots.heromsg=你不能動了！
actors.buffs.roots.desc=根系(不論是自然或魔法產生)纏到了腳上，將它們牢牢拴在地面。 \n\n根系會讓目標被困在當前區域，使其不能移動，但不會干擾其他行為。 \n\n剩餘的纏繞效果持續時長：%s回合

actors.buffs.scrollempower.name=卷軸賦能
actors.buffs.scrollempower.desc=茉莉伊洛閱讀卷軸時產生的能量會暫時強化他的法杖！\n\n法杖強化：+%1$d 級。\n剩餘有效施法次數：%2$d 回合。

actors.buffs.shadows.name=暗影融合
actors.buffs.shadows.desc=你和周圍的陰影融為一體，使你隱形並減緩你的新陳代謝。\n\n當你在隱形時敵人無法追蹤或攻擊你。大部分物理攻擊和魔法(比如卷軸和法杖)會立即解除隱形效果。此外，當你處於暗影融合狀態下時，飢餓值增加的速率會降低。\n\n暗影融合狀態會一直持續直到你離開陰影或與敵人直接接觸。

actors.buffs.slow.name=遲緩
actors.buffs.slow.desc=減速魔法影響了目標的時間流速，在目標眼中所有的事物都移動得飛快。 \n\n遲緩下的角色執行所有行動花費的時間是其執行相同行動的兩倍。\n\n剩餘的遲緩效果持續時長：%s回合

actors.buffs.snipersmark.name=狙擊標記
actors.buffs.snipersmark.action_name_snapshot=速射
actors.buffs.snipersmark.action_name_volley=齊射
actors.buffs.snipersmark.action_name_sniper=強射
actors.buffs.snipersmark.desc=遠靈之主會專注於最近射擊的目標，能夠用靈能弓進行一次特殊攻擊，攻擊方式取決於弓的改造方式。\n\n若持有未改造的弓，遠靈之主可發射_瞬時箭矢_，造成低於正常箭矢的傷害，但不消耗時間。\n\n若持有加強了速度的弓，遠靈之主可進行_三箭連發_。每枝箭造成低於正常箭矢的傷害，但能觸發附魔。消耗一回合。\n\n若持有加強了傷害的弓，遠靈之主可發射_狙擊箭矢_。狙擊箭矢必定命中，造成基於與目標距離的額外傷害，消耗兩回合。

actors.buffs.soulmark.name=靈魂標記
actors.buffs.soulmark.desc=這個生物的靈魂好像打開了水龍頭的木桶，每當其受到物理傷害，噬魂少女都能汲取一部分靈魂用於回復自身的血量。\n\n效果持續剩餘回合數：%s

actors.buffs.stamina.name=體力充沛
actors.buffs.stamina.desc=你感受到了體內無盡的精力，讓你可以以更快的速度移動！\n\n當你處於體力充沛狀態下你的移動速度將提升50%%，但是這不影響其他活動所消耗的時間。\n\n體力充沛持續時間：%s回合。

actors.buffs.vulnerable.name=易傷
actors.buffs.vulnerable.heromsg=你感到外界的傷害愈加疼痛！
actors.buffs.vulnerable.desc=易傷魔法會使得目標受到所有被護甲減免過的物理傷害增加33%%。\n\n易傷的剩餘時長：%s回合。

actors.buffs.nyctophobia$noroadmobs.name=寂滅循環
actors.buffs.nyctophobia$noroadmobs.desc=如果你連自己心中的光輝都無法捍衛，那又如何談得上拯救他人？\n\n由於你的燈火能量太低，某位魔女對你下了詛咒，要想擺脫詛咒，你需要盡快提升燈火。\n\n週期性傳送一些敵人來到英雄附近，只有提升燈火才能解脫這個詛咒。
actors.buffs.nyctophobia.dead=死亡只是一瞬間，你的燈火為0，將週期性受到真實傷害！
actors.buffs.nyctophobia.damage=當前燈火一次性扣減：%s點\n
actors.buffs.nyctophobia.lanter=當前燈火扣減回合週期數：%s回合

actors.buffs.terror.name=恐懼
actors.buffs.terror.desc=恐懼是使敵人陷入不可控制的恐慌的操縱性魔法。 \n\n恐懼中的角色會遠離自己的敵人，試圖和敵人隔開盡可能多的門或牆。然而疼痛的衝擊則會減少恐懼的持續時間。\n\n剩餘的恐懼效果持續時長：%s

actors.buffs.toxicimbue.name=毒性之力
actors.buffs.toxicimbue.desc=你體內被灌注了毒性能量！ \n\n在你移動時毒氣會從你的身體中翻騰而出，傷害你的敵人。持續時間內免疫毒氣和中毒效果。 \n\n剩餘的毒性之力時長：%s回合

actors.buffs.corrosion.name=酸蝕
actors.buffs.corrosion.heromsg=你正在被強酸溶解！
actors.buffs.corrosion.ondeath=你被徹底溶解掉了...
actors.buffs.corrosion.rankings_desc=被溶解
actors.buffs.corrosion.desc=強酸能以驚人的速度腐蝕掉血肉、金屬和骨頭。\n\n目標被腐蝕的時間越長，酸蝕傷害越高。\n\n剩餘的酸蝕效果時長：%1$s回合。\n當前酸蝕傷害：%2$d。

actors.buffs.vertigo.name=眩暈
actors.buffs.vertigo.desc=如果整個世界都在旋轉的話,想走直線會變得十分困難。 \n\n眩暈效果持續時，目標的移動將會向一個隨機區域進行，而不是目標原本想到達的地方。\n\n剩餘的眩暈效果時長：%s回合

actors.buffs.wandempower.name=盈能法杖
actors.buffs.wandempower.desc=你的傷害型法杖已被強化，接下來的幾次施法將會造成額外傷害。\n\n額外傷害：%1$d。\n剩餘施法次數：%2$d。

actors.buffs.weakness.name=虛弱
actors.buffs.weakness.heromsg=你感到力量正在被抽走！
actors.buffs.weakness.desc=你感覺自己的裝備突然變得沉重起來。 \n\n虛弱魔法會減弱角色的物理力量，使其造成的傷害減少33%%。\n\n剩餘虛弱效果持續時長：%s回合

actors.buffs.wellfed.name=飽腹
actors.buffs.wellfed.desc=你感覺自己吃的非常飽。\n\n當你處於飽腹狀態時，你的飢餓值不會增加，並且會隨著時間的推移恢復額外的生命值。\n\n狀態剩餘回合數：%d



###hero

##abilities
actors.hero.abilities.armorability.self_target=你不能瞄準你自己！
actors.hero.abilities.armorability.no_target=這裡沒有任何目標！
actors.hero.abilities.armorability.prompt=選擇釋放能力的位置
actors.hero.abilities.armorability.cost=充能消耗：_%d_

actors.hero.abilities.warrior.heroicleap.name=英勇之躍
actors.hero.abilities.warrior.heroicleap.prompt=選擇要飛躍到的地方
actors.hero.abilities.warrior.heroicleap.short_desc=蕾零安潔能向指定地點使用_英勇跳躍_，越過所有的敵人與環境。
actors.hero.abilities.warrior.heroicleap.desc=蕾零安潔向指定地點跳躍，越過路徑上的所有敵人與環境。不過蕾零安潔無法越過牆壁或是其它實體地形。
actors.hero.abilities.warrior.shockwave.name=震地衝擊
actors.hero.abilities.warrior.shockwave.short_desc=蕾零安潔大力錘擊地面，向一個錐形區域施以_震地衝擊_。被衝擊波擊中的敵人會受到一定傷害並陷入殘廢。
actors.hero.abilities.warrior.shockwave.desc=蕾零安潔大力錘擊地面產生衝擊波，衝擊波將震擊前方 60 度扇形範圍 5 格距離內的區域。\n\n被衝擊波擊中的敵人會陷入 5 回合殘廢並受到 5~10 點傷害。蕾零安潔超過10的每點力量會使得該傷害增加 1~2 點。
actors.hero.abilities.warrior.endure.name=苦痛堅忍
actors.hero.abilities.warrior.endure$enduretracker.name=苦痛之怒
actors.hero.abilities.warrior.endure$enduretracker.desc=蕾零安潔將忍受的原始傷害織成憤怒，將大量的額外傷害傾瀉給敵人。\n\n額外傷害：%1$d\n剩餘攻擊次數：%2$d
actors.hero.abilities.warrior.endure.short_desc=蕾零安潔_苦痛堅忍_，跳過若干回合併大幅抵抗傷害。接下來蕾零安潔會根據忍受的原始傷害造成額外傷害。
actors.hero.abilities.warrior.endure.desc=蕾零安潔首先忍耐3回合，將受到的任何傷害減少一半。此減傷效果優先於其它減傷計算。\n\n在此之後，蕾零安潔在10回合內的下一次攻擊將造成額外傷害。額外傷害等同於在忍耐期間所有傷害的三分之一。未經削減的原始傷害！\n\n如果蕾零安潔處於連擊狀態，此能力將補償3回合連擊時間。

actors.hero.abilities.mage.elementalblast.name=元素風暴
actors.hero.abilities.mage.elementalblast.short_desc=茉莉伊洛從老魔杖中釋放_元素風暴_，打擊以自身為中心的一大片圓形區域，造成傷害並基於灌注的法杖施加不同的效果。
actors.hero.abilities.mage.elementalblast.desc=茉莉伊洛釋放出風暴般的魔力，席捲半徑為4的圓形區域，對其中的目標造成15-25點傷害。元素風暴造成的特效隨老魔杖灌注的法杖而變。
actors.hero.abilities.mage.elementalblast.generic_desc=元素風暴的效果與法杖向目標施法的效果類似。
actors.hero.abilities.mage.wildmagic.name=狂野魔法
actors.hero.abilities.mage.wildmagic.no_wands=你沒有法杖可供施法！
actors.hero.abilities.mage.wildmagic.short_desc=茉莉伊洛引導出法杖中的_狂野魔法_，在單回合內對指定目標隨機釋放這些法杖多次。
actors.hero.abilities.mage.wildmagic.desc=茉莉伊洛傾瀉出多隻法杖的魔力，在一回合內隨機釋放法杖至多4次。該能力不會釋放茉莉伊洛的老魔杖。\n\n這個能力釋放法杖時，法杖視為原本等級+1，最多視為+2。這種方式的釋放仍需要消耗法杖充能。每隻法杖最多釋放兩次。
actors.hero.abilities.mage.warpbeacon.name=空間信標
actors.hero.abilities.mage.warpbeacon.depths=你無法傳送到其它樓層！
actors.hero.abilities.mage.warpbeacon.locked_floor=樓層被封鎖了，你無法離開！
actors.hero.abilities.mage.warpbeacon.too_far=這個位置太遠了！
actors.hero.abilities.mage.warpbeacon.invalid_beacon=你不能將信標放在那裡！
actors.hero.abilities.mage.warpbeacon.invalid_beacons=這裡環境相當特殊，你不能將信標放在那裡！
actors.hero.abilities.mage.warpbeacon.window_desc=你的信標目前設置在了第%d層。
actors.hero.abilities.mage.warpbeacon.window_tele=返回信標位置
actors.hero.abilities.mage.warpbeacon.window_clear=移除信標
actors.hero.abilities.mage.warpbeacon.window_cancel=取消
actors.hero.abilities.mage.warpbeacon.short_desc=茉莉伊洛在當前位置設定了一個_空間信標_，她能瞬間傳送回信標所在位置。
actors.hero.abilities.mage.warpbeacon.desc=茉莉伊洛設置了一個可以隨時返回的信標。信標設置需要1回合，但返回不消耗時間。\n\n茉莉伊洛在初始條件下無法傳送至別的樓層，不能將其放入不可達的區域如上鎖的房間。茉莉伊洛返回時若是目標地點有敵人，則會將其彈開。

actors.hero.abilities.rogue.smokebomb.name=煙幕爆炸
actors.hero.abilities.rogue.smokebomb.fov=你只能跳到視野範圍內的空格子裡
actors.hero.abilities.rogue.smokebomb.prompt=選擇要跳到的位置
actors.hero.abilities.rogue.smokebomb$ninjalog.name=木樁替身
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=不知為何敵人堅信這就是極影鈴虹本身。
actors.hero.abilities.rogue.smokebomb.short_desc=極影鈴虹在原地製造一場_煙幕爆炸_後閃現離去，並使原點周圍的敵人失明。
actors.hero.abilities.rogue.smokebomb.desc=極影鈴虹在原地製造一場煙幕爆炸，並閃現最多6格的距離。閃現無視敵人與環境，但仍會被實體地形如牆壁阻擋。\n\n極影鈴虹原位置周圍的敵人將失明5回合。
actors.hero.abilities.rogue.deathmark.name=奪命印記
actors.hero.abilities.rogue.deathmark.ally_target=你只能標記敵人。
actors.hero.abilities.rogue.deathmark.short_desc=極影鈴虹向選中的敵人施加_奪命印記_。被標記的敵人將受到額外傷害，但不會在標記期間死亡。
actors.hero.abilities.rogue.deathmark.desc=極影鈴虹標記選中的敵人，使其受到額外25%的傷害。標記不耗費時間且持續5回合。\n\n被標記的敵人受到額外傷害，但並不會在標記期間死亡。生命值耗盡的目標在標記結束時立即死亡。
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=奪命印記
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=這名被標記的敵人受到25%%的額外傷害，但不會在標記期間死亡。\n\n標記剩餘：%s回合。
actors.hero.abilities.rogue.shadowclone.name=暗影映像
actors.hero.abilities.rogue.shadowclone.short_desc=極影鈴虹召喚一個_暗影映像_，並能使喚其幫助自己戰鬥。
actors.hero.abilities.rogue.shadowclone.desc=極影鈴虹召喚一個暗影映像，並能使喚其幫助自己戰鬥。使喚映像不會消耗充能。\n\n映像擁有100點生命與10-20點近戰傷害，在啟用天賦後這些屬性可受到其主人武器與護甲的增益。
actors.hero.abilities.rogue.shadowclone$shadowally.name=暗影映像
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=你的映像正在跟隨你。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=你的映像正在發動攻擊！
actors.hero.abilities.rogue.shadowclone$shadowally.desc=一具無形暗影塑造出的極影鈴虹複製體，它一動不動雙目空空，煙霧般的黑暗在周圍緩緩升騰。\n\n它雖說不上是個完美的複製體，但也是個合格的殺手，並且在特定天賦加持下能從其主人的裝備中獲益。

actors.hero.abilities.huntress.spectralblades.name=靈魂飛刃
actors.hero.abilities.huntress.spectralblades.short_desc=頤蓮梅錵向一個目標擲出_靈魂飛刃_，根據裝備的近戰武器造成傷害。
actors.hero.abilities.huntress.spectralblades.desc=頤蓮梅錵向一名敵人擲出靈能飛刃，就像用近戰武器進行遠程攻擊。該攻擊保留包括附魔的所有近戰攻擊效果。
actors.hero.abilities.huntress.naturespower.name=自然之力
actors.hero.abilities.huntress.naturespower.short_desc=頤蓮梅錵呼喚_自然之力_的協助，在短時間內增加其移動速度與靈能短弓射擊速度。
actors.hero.abilities.huntress.naturespower.desc=頤蓮梅錵與她的弓注入了自然的力量！這種力量持續 8 回合。\n\n在自然之力的加持下，頤蓮梅錵擁有雙倍的移動速度與+33%的靈能短弓射擊速度。這種力量不影響遠靈之主專精的追加攻擊。
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=自然之力
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=頤蓮梅錵擁有了暫時的自然之力，增加其移動速度與靈能短弓射擊速度。\n\n剩餘回合數：%s。
actors.hero.abilities.huntress.spirithawk.name=靈能飛鷹
actors.hero.abilities.huntress.spirithawk.no_space=你附近沒有可用於召喚的空地。
actors.hero.abilities.huntress.spirithawk.short_desc=頤蓮梅錵召喚一隻_靈能飛鷹_使魔，協助偵查地形並分散敵人。
actors.hero.abilities.huntress.spirithawk.desc=頤蓮梅錵召喚一隻靈能飛鷹，飛鷹存在時使用此能力可指引其行動。飛鷹將存在 100 回合，指引飛鷹不消耗任何充能。\n\n靈能飛鷹脆弱且缺乏攻擊性，但其迅捷的移動、靈敏的躲避與精準的攻擊彌補了這些缺點。飛鷹與頤蓮梅錵共享視野，免疫所有環境效果，例如火焰、毒氣等。飛鷹只在頤蓮梅錵指引下發起攻擊。
actors.hero.abilities.huntress.spirithawk$hawkally.name=靈能飛鷹
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=你的飛鷹正在跟隨你。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=你的飛鷹正在發動攻擊！
actors.hero.abilities.huntress.spirithawk$hawkally.desc=一隻頤蓮梅錵召喚的靈能飛鷹，它全身散發著明亮而空靈的藍光，它不斷扭頭探查著周圍環境。\n\n飛鷹並不適合武力戰鬥，但其速度與視野使其能夠勝任高效的偵查與危險的引敵任務。\n\n飛鷹將在%d回合後消散。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=飛鷹將必定閃避接下來的%d次攻擊。

actors.hero.abilities.ratmogrify.name=鼠化術
actors.hero.abilities.ratmogrify.cant_transform=這個目標無法被鼠化！
actors.hero.abilities.ratmogrify.too_strong=這名敵人過於強大，鼠化術無效！
actors.hero.abilities.ratmogrify.short_desc=你可以施展_鼠化術_將目標敵人變形！敵人會暫時變為失去所有特殊能力的老鼠。
actors.hero.abilities.ratmogrify.desc=你能將敵人變為小鼠6回合！不過你無法變形 Boss，盟友或是小鼠本身。\n\n鼠化的敵人會繼承原屬性值，但失去所有特殊能力。
actors.hero.abilities.ratmogrify$transmograt.name=鼠化%s
actors.hero.abilities.ratmogrify$transmograt.desc=這名敵人已被變為老鼠。至少對我而言是個好消息！——鼠王
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=死於：鼠化敵人

##main hero
actors.hero.hero.name=你
actors.hero.hero.leave=聖境密林的結界尚未打開，你現在暫時無法離開。
actors.hero.hero.leave_boat=現在還不是離開的時候。

actors.hero.hero.leave_chest=這裡是擬態之王的異次元維度，入口和出口都被封死了，也許擊殺巡邏的寶箱怪可以逃出來……
actors.hero.hero.gold_common_desc=恭喜你完成了本次金蝶旅程，但金蝶的謎團依然撲朔迷離，敬請期待2026金蝶3.0版本。

actors.hero.hero.not_move=推箱子模式不能斜向和多格移動。

actors.hero.hero.hollow_1=古堡尚未開發完畢，感謝所有中測人員的一測！

actors.hero.hero.dlc_name=幻藍傳送方陣

actors.hero.hero.leave_more_dead=你嘗試啟用這個傳送陣，但並沒有任何效果……\n\n你需要傳送介質，並且必須是本局沒有進行下牢才能啟動傳送陣。\n\n_傳送介質_在左邊的商人領主處購買，這可能需要一些_特殊貨幣_支持，如果你的小鎮還沒有]商人領主]入駐，你需要去常規模式中]搶劫商店]並擊敗蓮娜。


actors.hero.hero.acs=冒險者，你應該知道地牢的危險，所以我們封印了入口。\n這是地牢的穩定入口之一，你可以穿過眼前的結界進入聖境密林。\n如果你已下定決心，就可以繼續前進了！\n當然，出發前帶所需要的東西一起去，因為你去了後就沒辦法輕易回頭了……

actors.hero.hero.acsx=冒險者，你應該知道下方十分混沌，我希望你準備好後再前進！\n\n一旦你擊敗了最深處時空混沌的中心，我會來接你回家的。\n\n另外，如果你需要前往其他時空，應該到右邊那個小房間，並且需要在下方羅恩那裡領取傳送介質……

actors.hero.hero.level_up=升級！
actors.hero.hero.new_level=升級！精準+，閃避+，最大生命值 +5！
actors.hero.hero.new_talent=天賦點 +1！
actors.hero.hero.unspent=你還有尚未使用的天賦點！
actors.hero.hero.level_cap=你不能變得更強了，不過你的經驗給了你一股力量！
actors.hero.hero.you_now_have=你獲得了：%s。
actors.hero.hero.you_cant_have=你無法攜帶：%s。
actors.hero.hero.locked_chest=箱子鎖著而你沒有對應的鑰匙
actors.hero.hero.locked_door=你沒有對應的鑰匙。
actors.hero.hero.noticed_smth=你注意到了些什麼。
actors.hero.hero.wait=…
actors.hero.hero.search=搜索
actors.hero.hero.search_distracted=你沒辦法集中精力，探索周邊異常費力。
actors.hero.hero.pain_resist=疼痛使你得以抵抗睡意。
actors.hero.hero.revive=重生十字章迸裂出甦生的能量！
actors.hero.hero.died=你的十字架毫無用處……，你徹底死在了這裡……
actors.hero.hero.error_no=這裡是子層深度，無法跳樓。\n\n如果您正處於漂浮狀態，請手動使用等待按鈕進行回合更新。

actors.blobs.frostfire.desc=這是一團冰火混合的火焰，在這裡你感受到了冰冷與炙熱的交織。如果不幸引火燒身將十分的痛苦。


##classes
actors.hero.heroclass.warrior=蕾零安潔
actors.hero.heroclass.warrior_desc_item=蕾零安潔初始攜帶一枚可以貼附於護甲的_獨特破損紋章。_\n\n蕾零安潔在裝備附著紋章的護甲時會隨時間產生生命值之上的護盾值。\n\n紋章可以在護甲之間轉移，並且可以攜帶一級升級。\n\n蕾零安潔可以食用種子，回復少量飢餓。該特性不受縮餐結石影響。
actors.hero.heroclass.warrior_desc_loadout=蕾零安潔初始攜帶一把_破損的短劍。_這把武器的直接近戰傷害是所有初始武器中最高的。\n\n蕾零安潔初始攜帶_三塊石子。_石子可以扔出攻擊遠處，造成一定的少量傷害。\n\n蕾零安潔初始攜帶一個可以收納各種藥水並保護藥水瓶不被凍碎的_藥水架。_\n\n蕾零安潔初始攜帶一個不會被消耗的_喚魔晶柱_
actors.hero.heroclass.warrior_desc_misc=蕾零安潔每次食用食物時都能恢復少量生命值。\n\n蕾零安潔開局鑑定的物品有：\n- 鑑定卷軸\n- 治療藥水\n- 盛怒卷軸
actors.hero.heroclass.warrior_desc_subclasses=在擊殺第二個Boss後可以選擇一種專精。蕾零安潔可以在兩種專精中二選一：

actors.hero.heroclass.warrior_story=蕾蕶安潔--戰術策略\n\n她出生於常年都是寒風刺骨的霜落帝國。蕾蕶安潔是畢業於戰術高等學府的優秀學員。她不主張使用魔法，而是傾向於使用精明的戰術策略去擊敗敵人。她的家族世世代代都是以戰術策略聞名於世，她的家族是霜落帝國中為數不多的不使用魔法或者特殊能力卻仍在帝國中佔有一席之地的家族。如今在地表三巨頭巨額懸賞的誘惑下，原本就想要來到地牢調查的她來到了這裡。

actors.hero.heroclass.huntress_story=頤蓮梅錵--精靈血裔\n\n頤蓮梅錵誕生於綠林聖境，那裡是精靈的聚集地，而她的母親是那裡的最高管理者。然而，嚮往著外面的世界，不希望自己就一直在母親的保護和聖境的結界中過完一生的她，私自開啟了結界。這帶來了一場可怕的災難。最後她母親雖然重新修補了結界，但頤蓮梅錵本人卻從此在聖境中消失了。最高管理者其實什麼都知道，但是卻沒有派人尋找她……\n\n多年後，她為了提升自己的力量來到了這裡，尋找地牢深處的寶物。而她不知道的是，她已是最後一位精靈血裔……

actors.hero.heroclass.rogue_story=極影鈴虹--迷離少女\n\n極影鈴虹出生於深淵魔都皇室，擁有純正的皇家血脈。然而，她在每次外出的時候，都會看見底層的人們深受生活的折磨，以及貴族對他們深入骨髓的歧視。這些現象都給她純潔的思想帶來了巨大的衝擊。從那以後，皇室中總有一個盜竊東西的黑影，並且這個黑影每次盜竊的都是食物，而皇室也一直沒有成功抓住這個黑影。皇室高層在外巡遊的時候，聽到底層的人們談論有一個蒙著面紗的女性將食物送給他們。皇室高層自然聯想到了那個黑影……但是，並沒有人知道是她。而她在聽說地牢最深處的東西可以實現願望之後，便說服自己的父親來到了這裡。父親在她的斗篷中植入了一顆暗黑的種子，必要時刻，它會保護她前行。

actors.hero.heroclass.mage_story=茉莉伊洛--淵初少女\n\n茉莉伊洛的出生地並不是這片國土，而是在遙遠天邊的神秘之境。那裡魔力滿溢，每個人都可以成為頂尖魔法師。而她因為一些變故，不得不離開自己的家鄉，來到了地表三巨頭管轄的區域。法師學府的多年深造使得她懂得強大的冰與火的魔力，能在戰鬥中隨機應變。但由於她並不屬於這裡，這裡的魔力在排斥她，所以她的真正力量從未顯現。她為了調查有關於水晶之心的謎團，只好以孱弱的姿態來到這地牢的面前……

actors.hero.heroclass.mage=茉莉伊洛
actors.hero.heroclass.mage_unlock=茉莉伊洛精通各類法杖，並在開局時持有一根_獨特的魔杖_。\n\n_在一局遊戲中使用兩張升級卷軸_以解鎖茉莉伊洛。
actors.hero.heroclass.mage_desc_item=茉莉伊洛初始攜帶一把可以被灌注各種法杖內魔力的_獨特魔杖。_\n\n魔杖充能比法杖更快，並且有1點額外最大充能數。\n\n魔杖開局就已被注入魔法飛彈。\n而且她還隨機攜帶2個最高為3級的焰浪和冰雪法杖！
actors.hero.heroclass.mage_desc_loadout=茉莉伊洛初始攜帶她的魔杖作為近戰武器。魔杖的近戰傷害是所有初始武器中最低的。\n\n茉莉伊洛可以使用魔杖發動遠程魔法攻擊。\n\n茉莉伊洛初始攜帶一個可以收納各種卷軸並保護它們免受火焰傷害的_卷軸筒。_
actors.hero.heroclass.mage_desc_misc=茉莉伊洛在第一次使用法杖時就能初步鑑定它。\n\n茉莉伊洛在食用食物時會為她的法杖與魔杖回復少量充能。\n\n茉莉伊洛開局鑑定的物品有：\n- 鑑定卷軸\n- 液火藥水\n- 升級卷軸
actors.hero.heroclass.mage_desc_subclasses=在擊殺第二個Boss後可以選擇一種專精。茉莉伊洛可以在兩種專精中二選一：

actors.hero.heroclass.rogue=極影鈴虹
actors.hero.heroclass.rogue_unlock=極影鈴虹可使用她特有的_暗影斗篷_操控戰局，並通過隱身伏擊敵人。\n\n_在一局遊戲中執行20次伏擊_以解鎖極影鈴虹。
actors.hero.heroclass.rogue_desc_item=極影鈴虹初始攜帶一件獨特神器：_暗影斗篷。_ 穿上後，極影鈴虹可以隨時將自己隱形。\n\n暗影斗篷和其他神器一樣不能被升級卷軸直接強化。暗影斗篷會隨極影鈴虹的使用而升級。
actors.hero.heroclass.rogue_desc_loadout=極影鈴虹初始攜帶一把_匕首。_用這把匕首伏擊敵人會造成額外傷害。\n\n極影鈴虹初始攜帶_三把飛刀。_飛刀可以扔出攻擊遠處，並且用飛刀伏擊敵人還會造成額外傷害。\n\n極影鈴虹初始攜帶一個可以收納種子和符石等小件物品的_絨布袋。_
actors.hero.heroclass.rogue_desc_misc=極影鈴虹能探測到更遠的秘密和陷阱。\n\n極影鈴虹能在地牢中找到更多秘密。\n\n極影鈴虹開局鑑定的物品有：\n- 鑑定卷軸\n- 隱形藥劑\n- 探地卷軸
actors.hero.heroclass.rogue_desc_subclasses=在擊殺第二個Boss後可以選擇一種專精。極影鈴虹可以在兩種專精中二選一：

actors.hero.heroclass.huntress=頤蓮梅錵
actors.hero.heroclass.huntress_unlock=頤蓮梅錵精通投擲武器，並且具有一把能無限射擊的_獨特的靈能弓_。\n\n想要解鎖頤蓮梅錵，請_在一局遊戲中在投擲武器的輔助下擊殺20名敵人_。
actors.hero.heroclass.huntress_desc_item=頤蓮梅錵開局時有一把_獨特的靈能弓_和一個不受使用次數限制的，這把弓可以無限發射魔法箭矢。\n\n這把弓會隨著頤蓮梅錵等級的提升逐漸加強，並且可以改造或附魔。
actors.hero.heroclass.huntress_desc_loadout=頤蓮梅錵開局攜帶一對攻速遠超其它初始武器的_鑲釘手套_。\n\n頤蓮梅錵開局的遠程武器是一把靈能弓。\n\n頤蓮梅錵開局攜帶一個可以收納種子和符石等小物件的_絨布袋_。
actors.hero.heroclass.huntress_desc_misc=頤蓮梅錵能夠在高草間自由穿行而非將它們踩倒在地。\n\n頤蓮梅錵的投擲武器有更高的耐久度。\n\n頤蓮梅錵可以察覺障礙後隱匿的敵人。\n\n頤蓮梅錵開局鑑定的物品有：\n- 鑑定卷軸\n- 靈視藥劑\n- 催眠卷軸


actors.hero.heroclass.duelist=艾諾琳娜
actors.hero.heroclass.duelist_desc_short=艾諾琳娜是一名武器大師，她能夠用武器使出_獨特的武技_。使出的武技_依不同武器而異_。
actors.hero.heroclass.duelist_desc=艾諾琳娜初始攜帶一柄獨特的_刺劍_，擁有隨時間自然充能的特殊武技。\n\n艾諾琳娜持有地牢中的任何武器時都將擁有_不同的武技_。\n\n艾諾琳娜初始還攜帶有_兩把投擲用的飛刺_、布甲、水袋以及絨布袋。\n\n艾諾琳娜開局鑑定的物品有：\n_-_鑑定卷軸\n_-_力量藥劑\n_-_鏡像卷軸
actors.hero.heroclass.duelist_unlock=_在力量達到需求的情況下裝備一把2階或更高階的武器_以解鎖艾諾琳娜。

actors.hero.heroclass.duelist_story=艾諾琳娜--游離旅者\n\n作為一位異世界旅客和俠客，雖然有能力打抱不平，但她選擇保持中立。\n\n這樣的決策使她能夠更好地分析問題，以更全面、理性的方式解決矛盾。\n\n她注重思考問題的根本原因，並努力找到更有效的解決方案，以實現公正和平衡的結果。\n\n這種態度讓她能夠保護自己和珍視的人，並在複雜的局勢中保持客觀。\n\n她出生於一個不屬於這個世界的地方，早在幼年時期就拿過格鬥三級的榮耀成績，現在，她喜歡在各個維度探險。\n\n但由於探險時總能遇到一些不能解答的事情，她來到地牢這裡，試圖通過這個維度中的傳言的水晶之心尋找屬於自己的答案……(但她真的能找到屬於她的答卷嗎?)

actors.hero.heroclass.spellsword=法爾塔婭
actors.hero.heroclass.spellsword_desc_short=法爾塔婭來自霜落帝國曦月協會，是霜落女帝一手培養的強大劍士。她擁有舉世無雙的劍技天賦，開創性的將魔法融入至劍的技藝中，成為史無前例的魔劍士。
actors.hero.heroclass.spellsword_unlock=_溫馨提示：1.0.0-資源預載，目前暫無法解鎖，請等待後續遊戲版本更新。_
actors.hero.heroclass.spellsword_desc=法爾塔婭初始攜帶一把_御前除魔_，她自身擁有獨特的_魔力_系統。\n\n法爾塔婭擁有舉世無雙的劍技天賦，開創性的將魔法融入至劍的技藝中。\n\n法爾塔婭初始還攜帶有_一柄魔法飛刃_、布甲、水袋以及絨布袋。\n\n法爾塔婭開局鑑定的物品有：\n_-_鑑定卷軸\n_-_冰霜藥劑\n_-_充能卷軸


actors.hero.heroclass.huntress_desc_subclasses=在擊殺第二個Boss後可以選擇一種專精。頤蓮梅錵可以在兩種專精中二選一：

actors.hero.herosubclass.gladiator=角鬥之王
actors.hero.herosubclass.gladiator_desc=每當角鬥之王使用近戰武器或投擲武器命中後，都會積累一點連擊數。若角鬥之王沒能在4回合內再次成功命中，連擊將被重設。\n\n隨著連擊數的積累，角鬥之王能使用戰技進行戰鬥。連擊數積累到_1,3,5,7,9_時將獲得一次戰技的使用次數。當_連擊數達到7_時，角鬥之王可以將_所有技能轉化為強大的終結技_。\n\n一次連擊過程中，釋放過的戰技將無法再次釋放，包括作為_終結技釋放_。

actors.hero.herosubclass.berserker=狂戰領主
actors.hero.herosubclass.berserker_desc=狂戰領主在造成物理傷害後會為自身積累怒氣。怒氣會隨時間穩定流逝，但在狂戰士生命較低時流失的更慢\n\n狂戰領主在_積累100%怒氣時達到最大的50%傷害_加成。在這種情況下，狂戰領主還可以進入狂暴狀態，根據自身已損失生命值獲得_2~6倍的紋章護盾_值，且在有護盾剩餘時怒氣值始終保持在100%。但是，狂戰領主在狂暴結束之後也會需要時間恢復氣力。\n\n每造成當前區域數-1點物理傷害，會_積累1%怒氣_。

actors.hero.herosubclass.berserker_short_desc=_狂戰領主_在造成物理傷害後會為自身積累怒氣。怒氣能提高狂戰領主的攻擊力，並使其短時間進入狂暴狀態。
actors.hero.herosubclass.gladiator_short_desc=_角鬥之王_會在成功進行攻擊時積累連擊數。角鬥之王可以消耗連擊數以使用特殊戰技以及終結技。

actors.hero.herosubclass.warlock=噬魂少女
actors.hero.herosubclass.warlock_desc=每當用法杖的效果擊中敵人，_噬魂少女_都有機率標記敵人的靈魂。對被標記的敵人進行物理攻擊時，她能回復生命值與飢餓值。
actors.hero.herosubclass.battlemage=敕靈天女
actors.hero.herosubclass.battlemage_desc=敕靈天女會獲得一隻無敵的法師之手，來幫助他釋放法杖。釋放法杖的CD為3回合。\n\n敕靈天女可以將任意法杖或老魔杖安裝在法師之手上，並可以隨意替換。特殊的，如果法師之手上安裝的是老魔杖，它會以1回合的攻擊延遲來近戰攻擊。
actors.hero.herosubclass.assassin=皇家刺客
actors.hero.herosubclass.assassin_desc=隱形時，_皇家刺客_會準備一次致命的攻擊。隱形得越久，這一擊的威力越強。
actors.hero.herosubclass.freerunner=風行之子
actors.hero.herosubclass.freerunner_desc=_風行之子_在奔跑時會累積動量。動量可以用於開啟逸動效果，讓他在短時間內擁有兩倍的移動速度和額外的閃避能力。
actors.hero.herosubclass.sniper=遠靈之主
actors.hero.herosubclass.sniper_desc=_遠靈之主_乃遠程戰鬥大師。她的遠程攻擊能穿透護甲。用投擲武器擊中目標後，遠靈之主能以靈能弓進行一次特殊追擊。
actors.hero.herosubclass.warden=自然仙子
actors.hero.herosubclass.warden_desc=_自然仙子_與自然之力有強大的聯結，這使得自然仙子具有穿透高草的視野，而且種下的種子周圍會生出枯草。自然仙子在踩踏植物時會獲得額外效果。

actors.hero.herosubclass.champion=乾坤宗師
actors.hero.herosubclass.champion_short_desc=_乾坤宗師_可以同時握持兩把武器。她的普通攻擊使用主武器，不過乾坤大師可在主副武器間自如切換，施放兩把武器的各自武技。
actors.hero.herosubclass.champion_desc=乾坤宗師精通所有近戰武器，在裝備主武器的情況下，她能夠再裝備一件副武器。乾坤宗師普通攻擊時仍使用主武器，但她能夠在主副武間即時切換。\n\n副武器的武技可在任何時候使用，並且獨立計算充能，不過副武器的最大充能與充能效率都只有主武器的50%。
actors.hero.herosubclass.monk=武道宗師
actors.hero.herosubclass.monk_short_desc=_武道宗師_在戰鬥時能夠積蓄內力，這些內力可用於施展諸多武功。
actors.hero.herosubclass.monk_desc=武道宗師的體術造詣十分深厚。她在擊敗敵人時能夠積蓄內力，用於釋放諸多防禦或功能性能力。已獲得的內力不會隨時間流失，但具有基於武道宗師等級的儲存上限。

actors.hero.heroclass.warrior_desc=蕾零安潔初始攜帶一枚可以貼附於護甲的_獨特破損紋章。_他在裝備附著紋章的護甲時會隨時間產生生命值之上的護盾值。紋章可以在護甲之間轉移，並且可以攜帶一級升級。\n\n同時，蕾零安潔初始攜帶一柄_破舊的短劍_，_三塊投石_，布甲，水袋與絨布包。\n\n蕾零安潔開局鑑定的物品有：\n_-_鑑定卷軸\n_-_治療藥水\n_-_盛怒卷軸

actors.hero.heroclass.mage_desc=茉莉伊洛初始攜帶一把_老魔杖_。老魔杖的自動充能速度顯著快於一般法杖，並且有 1 點額外最大充能數。茉莉伊洛可以將地牢中找到的各式法杖灌注到老魔杖中。\n\n同時，茉莉伊洛初始攜帶一把已灌注了_魔彈法杖_的老魔杖、布甲、水袋與絨布包。\n\n茉莉伊洛開局鑑定的物品有：\n_- _鑑定卷軸\n_- _液火藥劑\n_-_ 升級卷軸
actors.hero.heroclass.rogue_desc=極影鈴虹初始攜帶一件獨特神器：_暗影斗篷_。 穿上後，極影鈴虹可以隨時將自己隱形。\n\n極影鈴虹能從更遠的距離_探測秘密與陷阱_。\n\n同時，極影鈴虹初始攜帶一柄_匕首_，_三把飛刀_，布甲，水袋與絨布包。\n\n極影鈴虹開局鑑定的物品有：\n_-_鑑定卷軸\n_-_隱形藥劑\n_-_探地卷軸
actors.hero.heroclass.huntress_desc=頤蓮梅錵初始攜帶一把獨特的_靈能弓_，擁有無限的魔法彈藥。\n\n頤蓮梅錵可以穿過高草叢而_不將其踐踏成草地_。\n\n同時，頤蓮梅錵初始攜帶一副_帶釘手套_，布甲，水袋與絨布包。\n\n頤蓮梅錵開局便已鑑定的道具有：\n_-_鑑定卷軸\n_-_靈視藥劑\n_-_催眠卷軸

actors.hero.herosubclass.battlemage_short_desc=_敕靈天女_可以召喚一隻無敵的法師之手以幫助她施法。
actors.hero.herosubclass.warlock_short_desc=_噬魂少女_在對敵人使用法杖時有機率為其帶上靈魂標記。只要噬魂少女對被標記的敵人造成物理傷害，自身就會回復生命值。
actors.hero.herosubclass.assassin_short_desc=隱形時，_皇家刺客_會準備一次致命的攻擊。耐心等得越久，這一擊的威力越強。
actors.hero.herosubclass.freerunner_short_desc=_風行之子_在奔跑時會累積動量。動量可以用於開啟逸動效果，讓她在短時間內擁有更高的移動速度和更強的閃避能力。
actors.hero.herosubclass.sniper_short_desc=_遠靈之主_的遠程攻擊能穿透護甲。用投擲武器擊中目標後，遠靈之主能以靈能弓進行一次特殊追擊。
actors.hero.herosubclass.warden_short_desc=_自然仙子_具有穿透高草的視野，而且在種植和踩踏植物時會獲得額外效果。


##talents
actors.hero.talent$followupstriketracker.name=追加打擊
actors.hero.talent$followupstriketracker.desc=頤蓮梅錵最近使用投擲武器發動過一次攻擊，她對同一目標發動的下一次近戰攻擊將獲得傷害加成。\n\n剩餘回合數：%s
actors.hero.talent$patientstriketracker.name=沉穩一擊
actors.hero.talent$patientstriketracker.desc=艾諾琳娜剛剛等待了一回合，她的下一次近戰攻擊將會造成額外傷害。
actors.hero.talent$improvisedprojectilecooldown.name=靶心瞄準-冷卻
actors.hero.talent$improvisedprojectilecooldown.desc=你剛剛發動過這個天賦，需要稍等才能再次發動。\n\n剩餘冷卻：%s回合。
actors.hero.talent$rejuvenatingstepscooldown.name=復春步伐-冷卻
actors.hero.talent$rejuvenatingstepscooldown.desc=你剛剛發動過這個天賦，需要稍等才能再次發動。\n\n剩餘冷卻：%s回合。
actors.hero.talent$seershotcooldown.name=探地之矢-冷卻
actors.hero.talent$seershotcooldown.desc=你剛剛發動過這個天賦，需要稍等才能再次發動。\n\n剩餘冷卻：%s回合。
actors.hero.talent$aggressivebarriercooldown.name=烈氣護盾-冷卻
actors.hero.talent$aggressivebarriercooldown.desc=你剛剛發動過這個天賦，需要稍等才能再次發動。\n\n剩餘冷卻：%s回合。
actors.hero.talent$lethalhastecooldown.name=奪命余勢-冷卻
actors.hero.talent$lethalhastecooldown.desc=你剛剛發動過這個天賦，需要稍等才能再次發動。\n\n剩餘冷卻：%s回合。
actors.hero.talent$swiftequipcooldown.name=迅疾配裝-冷卻
actors.hero.talent$swiftequipcooldown.desc=你剛剛發動過這個天賦，需要稍等才能再次發動。\n\n剩餘冷卻：%s回合。
actors.hero.talent$preciseassaulttracker.name=精準打擊
actors.hero.talent$preciseassaulttracker.desc=艾諾琳娜的下一次普通近戰攻擊將獲得精準度加成。\n\n剩餘回合數：%s
actors.hero.talent$deadlyfollowuptracker.name=奪命追擊
actors.hero.talent$deadlyfollowuptracker.desc=艾諾琳娜最近使用投擲武器命中了一個敵人，她對同一目標發動的下一次近戰攻擊將獲得傷害加成。\n\n剩餘回合數：%s

actors.hero.talent$liquidagilacctracker.name=液蘊機敏
actors.hero.talent$liquidagilacctracker.desc=艾諾琳娜的下一次普通近戰攻擊將獲得額外精準。\n\n剩餘回合數：%s

actors.hero.talent$combinedlethalitytriggertracker.name=複合損傷
actors.hero.talent$combinedlethalitytriggertracker.executed=處決
actors.hero.talent$combinedlethalitytriggertracker.desc=艾諾琳娜的下一次攻擊會處決剩餘生命值低於特定數值的敵人。\n剩餘的回合數：%s

#warrior
actors.hero.talent.hearty_meal.title=豐收一餐
actors.hero.talent.hearty_meal.desc=_+1：_蕾零安潔在生命值低於50%的時候進食會恢復_2點生命_，生命值低於25%的時候會恢復_3點生命_。食用_有益種子_有_ 25% _機率觸發藥水的相同效果。\n\n_+2：_蕾零安潔在生命值低於50%的時候進食會恢復_3點生命_，生命值低於25%的時候會恢復_5點生命_。食用_有益種子_有_ 35% _機率觸發藥水的相同效果。\n\n如果存在_藥水癔症_挑戰，則藥水效果失效。

actors.hero.talent.veterans_intuition.title=老兵直覺
actors.hero.talent.veterans_intuition.desc=_+1：_蕾零安潔鑑定武器的速度提升至原來的_1.75倍_，鑑定護甲的速度提升至原來的_2.5倍_。\n\n_+2：_蕾零安潔鑑定武器的速度提升至原來的_2.5倍_，且能夠瞬間鑑定_她裝備的_護甲。

actors.hero.talent.provoked_anger.title=受釁怒火
actors.hero.talent.provoked_anger.desc=_+1：_當戰士的護盾被擊碎時，他的下一次物理攻擊將造成_1~2點額外傷害_。\n\n_+2：_當戰士的護盾被擊碎時，他的下一次物理攻擊將造成_2點額外傷害_。

actors.hero.talent$provokedangertracker.name=受釁怒火
actors.hero.talent$provokedangertracker.desc=戰士剛剛失去護盾，他的下一次物理攻擊將造成額外傷害。\n\n剩餘回合數：%s

actors.hero.talent.test_subject.title=實驗對象
actors.hero.talent.test_subject.desc=_+1：_每當戰士鑑定了一件物品，他將恢復_ 2 點生命_。\n\n_+2：_每當戰士鑑定了一件物品，他將恢復_ 3 點生命_。

actors.hero.talent.iron_will.title=鋼鐵意志
actors.hero.talent.iron_will.desc=_+1：_ 蕾零安潔斬殺敵人後獲得_2點護盾_。\n\n_+2：_ 蕾零安潔斬殺敵人後獲得_3點護盾_。

actors.hero.talent.iron_stomach.title=荊棘之胃
actors.hero.talent.iron_stomach.desc=_+1：_蕾零安潔進食只花費一個回合，並在進食過程中獲得_ 75% 的傷害抗性_，在此期間若受到擊打則使打擊者受到_9點傷害_\n\n_+2：_蕾零安潔進食只花費一個回合，並在進食過程中獲得_ 100% 的傷害抗性_ ，在此期間若受到擊打則使打擊者受到_12點傷害_。

actors.hero.talent.liquid_willpower.title=應急護盾
actors.hero.talent.liquid_willpower.desc=+1：每當 蕾零安潔 受到一次直接損失生命值的物理傷害後，她在下一回合可獲得_ 2點 _護盾。\n\n+2：每當 蕾零安潔 受到一次直接損失生命值的物理傷害後，她在下一回合獲得_ 4點 _護盾

#actors.hero.talent.runic_transference.title=刻印轉移
#actors.hero.talent.runic_transference.desc=_+1：_蕾零安潔的破損紋章可以像攜帶一層升級一樣攜帶_普通或稀有刻印_。\n\n_+2：_蕾零安潔的破損紋章可以像攜帶一層升級一樣攜帶_普通、稀有、強力、詛咒刻印_。
#actors.hero.talent.runic_transference.meta_desc=_如果這個天賦被其它英雄獲得_，那麼它會使護甲刻印必定不會被升級卷軸消除的上限等級提高。天賦 +1 時，護甲在 +6 開始有機率消除刻印（原來在 +4），天賦+2時則為 +7（原來在 +4）。+8 時仍然必定消除。

actors.hero.talent.pain_scar.title=苦痛刻痕
actors.hero.talent.pain_scar.desc=_+1：_當狂戰領主受到致命傷害時，若此時其怒氣值大於_20%_，將會透過扣除_20%_怒氣值與_20_點最大生命值來免疫本次傷害。\n\n_+2：_當狂戰領主受到致命傷害時，若此時其怒氣值大於_15%_，將會透過扣除_15%_怒氣值與_15_點最大生命值來免疫本次傷害。\n\n_+3：_當狂戰領主受到致命傷害時，若此時其怒氣值大於_10%_，將會透過扣除_10%_怒氣值與_10_點最大生命值來免疫本次傷害。 \n\n _根骨戒指與根骨秘藥等增加生命上限的手段不會使你獲得額外的免疫傷害機會

actors.hero.talent.title = 致死傷害免疫
actors.hero.talent.desc = 你當前可透過苦痛刻痕天賦或者是重生十字章來抵禦致死傷害，請選擇
actors.hero.talent.prompt = 苦痛刻痕
actors.hero.talent.cancel = 十字章
actors.hero.talent.resistdeath= 觸發苦痛刻痕天賦！抵抗致死傷害！

actors.hero.talent.runic_transference.title=精巧紋章
actors.hero.talent.runic_transference.desc=_+1：_蕾零安潔的紋章可以被刻印或詛咒，這個刻印或詛咒會與盔甲的刻印_共存_。\n\n_+2：_蕾零安潔的紋章可以被刻印或詛咒，這個刻印或詛咒會與盔甲的刻印_共存_，蕾零安潔紋章上的正面刻印效果強度上升_25%_。\n\n若紋章上的刻印與盔甲上的相同，則盔甲上的刻印觸發時視為有額外1級。

actors.hero.talent.lethal_momentum.title=手起刀落
actors.hero.talent.lethal_momentum.desc=_+1：_蕾零安潔使用物理武器擊殺敵人的一擊有_67%的機率_不消耗回合數。\n\n_+2：_蕾零安潔使用物理武器擊殺敵人的一擊有_100%的機率_不消耗回合數。

actors.hero.talent.improvised_projectiles.title=即興投擲
actors.hero.talent.improvised_projectiles.desc=_+1：_蕾零安潔向敵人扔出非投擲武器的物品時會對其造成_2回合_的致盲效果。這個天賦有50回合的冷卻時間。\n\n_+2：_蕾零安潔向敵人扔出非投擲武器的物品時會對其造成_3回合_的致盲效果。這個天賦有50回合的冷卻時間。

actors.buffs.clearbleesdgoodbuff.lockeddamage.name=瞄準
actors.buffs.clearbleesdgoodbuff.lockeddamage.desc=聚精會神，給予目標緻命一擊！\n\n擁有瞄準效果的目標，蕾零安潔對其造成的物理傷害提升10%%\n\n剩餘效果時長：%s

actors.buffs.lethaldefense.name = 以戰養戰
actors.buffs.lethaldefense.desc = 當角鬥之王在接下來的_%s_回合內使用終結技後，將會獲得以戰養戰天賦的加成

actors.hero.talent.hold_fast.title=不動如山
actors.hero.talent.hold_fast.desc=_+1:_蕾零安潔獲得_0~1_點護甲, 當蕾零安潔受到凍傷，冰凍，遲緩，纏繞，殘疾，麻痺等_異常效果_影響時，該效果乘3倍。\n\n_+2:_蕾零安潔獲得_0~2_點護甲, 當蕾零安潔受到凍傷，冰凍，遲緩，纏繞，殘疾，麻痺等_異常效果_影響時，該效果乘3倍。\n\n_+3:_蕾零安潔獲得_0~3_點護甲, 當蕾零安潔受到凍傷，冰凍，遲緩，纏繞，殘疾，麻痺等_異常效果_影響時，該效果乘3倍。

actors.hero.talent.strongman.title=排山倒海
actors.hero.talent.strongman.desc=_+1：_蕾零安潔攻擊耗時每超過_ 1 回合 1 %_，其將獲得 _0.167 %_的傷害加成與_ 0.33% _的精準加成。\n\n_+2：_蕾零安潔攻擊耗時每超過_ 1 回合 1 %_，其將獲得_ 0.33 %_的傷害加成與_ 0.66 % _的精準加成。\n\n_+3：_蕾零安潔攻擊耗時每超過_ 1 回合 1 %_，其將獲得_ 0.5 %_的傷害加成與_ 1% _的精準加成。 \n\n_蕾零安潔最多從此天賦獲得_ 50%_的傷害加成以及_ 75%_的精準加成
actors.hero.talent.strongman.meta_desc=此天賦所有英雄可使用，使用蛻變秘卷後即可。


actors.hero.talent.endless_rage.title=怒火滔天
actors.hero.talent.endless_rage.desc=_+1：_狂戰領主的怒氣上限提升至_150%_，怒氣所帶來的傷害最大加成上升至75%。\n\n_+2：_狂戰領主的怒氣上限提升至_175%_，怒氣所帶來的傷害最大加成上升至87.5%。\n\n_+3：_狂戰領主的怒氣上限提升至_200%_，怒氣所帶來的傷害最大加成上升至100%。

actors.hero.talent.fanaticism_magic.title=狂熱施法
actors.hero.talent.fanaticism_magic.desc=_+1：_狂戰領主所造成的任何_法術傷害_將會以_一半的速率_積累怒氣\n\n_+2：_除去1級天賦的加成外，狂戰領主目前每擁有75%的怒氣，她的所有法杖便視為擁有_額外的虛擬等級_。\n\n_+3：_除去1級天賦的加成外，狂戰領主每擁有_50%的怒氣_，她的所有法杖便視為擁有_額外的虛擬等級_。

#actors.hero.talent.keep_vigilance.title=保持警惕
#actors.hero.talent.keep_vigilance.desc=_+1：_角鬥之王的連擊遺失時間延長至_6回合_。\n\n_+2：_角鬥之王的連擊遺失時間延長至_15回合_。\n\n_+3：_角鬥之王的_連擊數將不會因時間推移而遺失_。

actors.hero.talent.cleave.title=連戰熱忱
actors.hero.talent.cleave.desc=_+1：_當角鬥之王擊殺一名敵人時，_15回合_內再次攻擊仍繼承連擊數。\n\n_+2：_當角鬥之王擊殺一名敵人時，_30回合_內再次攻擊仍繼承連擊數。\n\n_+3：_當角鬥之王擊殺一名敵人時，_45回合_內再次攻擊仍繼承連擊數。

actors.hero.talent.lethal_defense.title=以戰養戰
actors.hero.talent.lethal_defense.desc=_+1：_若角鬥之王在使用技能後的2回合內再次使用_終結技_，她將獲得1點連擊數以及_2回合的激素湧動_。\n\n_+2：_若角鬥之王在使用技能後的3回合內再次使用終結技，她將獲得_2點連擊數_以及_2回合的激素湧動_。\n\n_+3：_若角鬥之王在使用技能後的4回合內再次使用終結技，她將獲得_2點連擊數_以及_3回合的激素湧動_。

actors.hero.talent.vent_noplace.title=嫻熟技藝
actors.hero.talent.vent_noplace.desc=_+1：_當角鬥之王釋放終結技時，將會立即獲得_+1連擊數_。\n\n_+2：_角鬥之王在_連擊數達到5_時即可釋放連擊技能。\n\n_+3：_角鬥之王在釋放終結技時將會立刻獲得_2點連擊數_。

actors.hero.talent.body_slam.title=肉彈衝擊
actors.hero.talent.body_slam.desc=_+1：_蕾零安潔英勇之躍落地時，對所有相鄰敵人造成_25% 護甲值 + 1-4_的傷害。\n\n_+2：_蕾零安潔英勇之躍落地時，對所有相鄰敵人造成_50% 護甲值 + 2-8_的傷害。\n\n_+3：_蕾零安潔英勇之躍落地時，對所有相鄰敵人造成_75% 護甲值 + 3-12_的傷害。\n\n_+4：_蕾零安潔英勇之躍落地時，對所有相鄰敵人造成_100% 護甲值 + 4-16_的傷害。
actors.hero.talent.impact_wave.title=墮天一擊
actors.hero.talent.impact_wave.desc=_+1：_蕾零安潔英勇之躍落地時，擊退所有相鄰敵人_2_格，有_25%_機率使其獲得 5 回合易傷。\n\n_+2：_蕾零安潔英勇之躍落地時，擊退所有相鄰敵人_3_格，有_50%機率_使其獲得 5 回合易傷。\n\n_+3：_蕾零安潔英勇之躍落地時，擊退所有相鄰敵人_4_格，有_75%機率_使其獲得 5 回合易傷。\n\n_+4：_蕾零安潔英勇之躍落地時，擊退所有相鄰敵人_5_格，有_100%機率_使其獲得 5 回合易傷。
actors.hero.talent.double_jump.title=二段跳躍
actors.hero.talent.double_jump.desc=_+1：_蕾零安潔使用英勇跳躍後，3 回合內下一次使用充能消耗減少_16%_。\n\n_+2：_蕾零安潔使用英勇跳躍後，3 回合內下一次使用充能消耗減少_30%_。\n\n_+3：_蕾零安潔使用英勇跳躍後，3 回合內下一次使用充能消耗減少_40%_。\n\n_+4：_蕾零安潔使用英勇跳躍後，3 回合內下一次使用充能消耗減少_50%_。

actors.hero.talent.expanding_wave.title=廣域衝擊
actors.hero.talent.expanding_wave.desc=_+1：_震地衝擊的射程由5格擴大到_6格_，角度從60度展寬為_75度_。\n\n_+2：_震地衝擊的射程由5格擴大到_7格_，角度從60度展寬為_90度_。\n\n_+3：_震地衝擊的射程由5格擴大到_8格_，角度從60度展寬為_105度_。\n\n_+4：_震地衝擊的射程由5格擴大到_9格_，角度從60度展寬為_120度_。
actors.hero.talent.striking_wave.title=複合震波
actors.hero.talent.striking_wave.desc=_+1：_使用震地衝擊時，有_30%_機率觸發攻擊特效，如附魔與連擊。\n\n_+2：_使用震地衝擊時，有_60%_機率觸發攻擊特效，如附魔與連擊。\n\n_+3：_使用震地衝擊時，有_90%_機率觸發攻擊特效，如附魔與連擊。\n\n_+4：_使用震地衝擊時，有_100%_機率觸發攻擊特效，如附魔與連擊，且附魔強度_提升20%_。
actors.hero.talent.shock_force.title=強力衝擊
actors.hero.talent.shock_force.desc=_+1：_震地衝擊傷害增加_20%_，有_25%_機率將目標擊暈而非殘廢。\n\n_+2：_震地衝擊傷害增加_40%_，有_50%_機率將目標擊暈而非殘廢。\n\n_+3：_震地衝擊傷害增加_60%_，有_75%_機率將目標擊暈而非殘廢。\n\n_+4：_震地衝擊傷害增加_80%_，有_100%_機率將目標擊暈而非殘廢。

actors.hero.talent.sustained_retribution.title=持續反擊
actors.hero.talent.sustained_retribution.desc=_+1：_反擊的額外傷害增加到_115%_，分配給接下來_2_次攻擊。\n\n_+2：_反擊的額外傷害增加到_130%_，分配給接下來_3_次攻擊。\n\n_+3：_反擊的額外傷害增加到_145%_，分配給接下來_4_次攻擊。\n\n_+4：_反擊的額外傷害增加到_160%_，分配給接下來_5_次攻擊。\n\n註：原本為100%額外傷害的一次攻擊。
actors.hero.talent.shrug_it_off.title=痛覺閾值
actors.hero.talent.shrug_it_off.desc=_+1：_蕾零安潔在苦痛堅忍中的減傷由50%提升至_60%_。\n\n_+2：_蕾零安潔在苦痛堅忍中的減傷由50%提升至_68%_。\n\n_+3：_蕾零安潔在苦痛堅忍中的減傷由50%提升至_74%_。\n\n_+4：_蕾零安潔在苦痛堅忍中的減傷由50%提升至_80%_。
actors.hero.talent.even_the_odds.title=情勢反轉
actors.hero.talent.even_the_odds.desc=_+1：_蕾零安潔在苦痛堅忍結束時，周圍兩格每有一名敵人，增加_5%額外傷害_。\n\n_+2：_蕾零安潔在苦痛堅忍結束時，周圍兩格每有一名敵人，增加_10%額外傷害_。\n\n_+3：_蕾零安潔在苦痛堅忍結束時，周圍兩格每有一名敵人，增加_15%額外傷害_。\n\n_+4：_蕾零安潔在苦痛堅忍結束時，周圍兩格每有一名敵人，增加_20%額外傷害_。

#mage
actors.hero.talent.empowering_meal.title=盈能一餐
actors.hero.talent.empowering_meal.desc=_+1：_進食會為茉莉伊洛接下來3次法杖效果增加 _2 點額外傷害_。\n\n_+2：_進食會為茉莉伊洛接下來3次法杖效果增加 _3 點額外傷害_。
actors.hero.talent.scholars_intuition.title=學者直覺
actors.hero.talent.scholars_intuition.desc=_+1：_茉莉伊洛鑑定法杖的速度提升為原來的_ 3 倍_。\n\n_+2：_茉莉伊洛 _使用法杖時_會將其_瞬間鑑定_。

actors.hero.talent.lingering_magic.title=波湧餘威
actors.hero.talent.lingering_magic.desc=_+1：_當茉莉伊洛用魔杖或法杖施法後，她的下一次物理攻擊將造成_1~2點額外傷害_。\n\n_+2：_當茉莉伊洛用魔杖或法杖施法後，她的下一次物理攻擊將造成_2點額外傷害_。

actors.hero.talent.tested_hypothesis.title=實驗假設
actors.hero.talent.tested_hypothesis.desc=_+1：_每當茉莉伊洛鑑定了一件物品, 他將獲得 _2 回合的法杖充能_。\n\n_+2：_每當茉莉伊洛鑑定了一件物品, 他將獲得 _3 回合的法杖充能_。

actors.hero.talent.backup_barrier.title=備用屏障
actors.hero.talent.backup_barrier.desc=_+1：_每當茉莉伊洛釋放老魔杖最後一點充能，他獲得 _3 點護盾_。\n\n_+2：_每當茉莉伊洛釋放老魔杖最後一點充能，他獲得 _5 點護盾_。
actors.hero.talent.backup_barrier.meta_desc=_如果這個天賦被其它英雄獲得_，那麼它會由持有的等級最高的法杖觸發。

actors.hero.talent.energizing_meal.title=充能一餐
actors.hero.talent.energizing_meal.desc=_+1：_茉莉伊洛進食只花費一個回合併獲得 _5 回合的法杖充能_。\n\n_+2：_茉莉伊洛進食只花費一個回合併獲得 _8 回合的法杖充能_。
actors.hero.talent.inscribed_power.title=卷藏秘能
actors.hero.talent.inscribed_power.desc=_+1：_ 茉莉伊洛閱讀一張卷軸後，他的_下 2 次_法杖效果提升 2 級。\n\n_+2：_ 茉莉伊洛閱讀一張卷軸後，他的_下 3 次_法杖效果提升 2 級。\n\n如果閱讀的卷軸是升級卷軸、嬗變卷軸、注魔秘卷或蛻變秘卷，則法杖的強化次數翻倍。
actors.hero.talent.wand_preservation.title=法杖回收
actors.hero.talent.wand_preservation.desc=_+1：_當茉莉伊洛將新的法杖注入魔杖時，會以0級狀態回收先前灌注的法杖，_不過此回收只能進行一次_。\n\n_+2：_當茉莉伊洛將新的法杖注入魔杖時，會以0級狀態回收先前灌注的法杖，_此回收每一英雄等級就能進行一次_。
actors.hero.talent.wand_preservation.meta_desc=_如果這個天賦被其它英雄取得_，那麼它會增加法杖於煉金釜中轉化為奧術聚酯的數量。+1 時法杖轉化的聚酯數量增加 1 ，+2 時則增加 2 。
actors.hero.talent.arcane_vision.title=奧術感知
actors.hero.talent.arcane_vision.desc=_+1：_當茉莉伊洛使用法杖命中敵人時，獲取目標視野，持續 _10 回合_。\n\n_+2：_當茉莉伊洛使用法杖命中敵人時，獲取目標視野，持續 _15 回合_。
actors.hero.talent.shield_battery.title=儲能護盾
actors.hero.talent.shield_battery.desc=_+1：_茉莉伊洛能以自身為目標施法，將法杖的每點充能轉化為_ 4% 最大生命值_的護盾。\n\n_+2：_茉莉伊洛能以自身為目標施法，將法杖的每點充能轉化為_ 6% 最大生命值_的護盾。

actors.hero.talent.desperate_power.title=絕境迫能
actors.hero.talent.desperate_power.desc=_+1:_ 茉莉伊洛的法杖和老魔杖在僅剩最後一點充能時獲得 _1 額外等級_。\n\n_+2:_ 茉莉伊洛的法杖和老魔杖在僅剩最後一點充能時獲得 _2 額外等級_。\n\n_+3:_ 茉莉伊洛的法杖和老魔杖在僅剩最後一點充能時獲得 _3 額外等級_。
actors.hero.talent.ally_warp.title=移形換位
actors.hero.talent.ally_warp.desc=_+1: _茉莉伊洛可以選取一名_2格範圍內_的友方單位，與其瞬間交換位置。\n\n_+2: _茉莉伊洛可以選取一名_4格範圍內_的友方單位，與其瞬間交換位置。\n\n_+3: _茉莉伊洛可以選取一名_6格範圍內_的友方單位，與其瞬間交換位置。\n\n茉莉伊洛不能與無法移動的友方單位交換位置\n\n對於法師之手，只有在自身附近時，才能進行位置交換。


actors.hero.talent.empowered_strike.title=多樣打擊
actors.hero.talent.empowered_strike.desc=_+1:_敕靈天女與法師之手在_近戰攻擊時有33%的機率_附帶類似附魔的額外效果，效果取決於魔杖所灌注的法杖種類，每種法杖各不相同。\n\n_+2:_敕靈天女與法師之手在_近戰攻擊時有66%的機率_附帶類似附魔的額外效果，效果取決於魔杖所灌注的法杖種類，每種法杖各不相同。\n\n_+3:_敕靈天女與法師之手在_近戰攻擊時有100%的機率_附帶類似附魔的額外效果，效果取決於魔杖所灌注的法杖種類，每種法杖各不相同。

actors.hero.talent.mystical_charge.title=魔力補償
actors.hero.talent.mystical_charge.desc=_+1_:敕靈天女每_累計消耗4點任意法杖_的充能，就給法師之手上的法杖回復1點充能。\n\n_+2_:敕靈天女每_累計消耗3點任意法杖_的充能，就給法師之手上的法杖回復1點充能。\n\n_+3_:敕靈天女每_累計消耗2點任意法杖_的充能，就給法師之手上的法杖回復1點充能。

actors.hero.talent.magic_absorb.title=魔力汲取
actors.hero.talent.magic_absorb.desc=_+1_:敕靈天女的老魔杖_每40回合_將額外獲得1點老魔杖充能，如果觸發時_老魔杖充能已滿_則為背包中所有法杖補充1充能並增加<#8AFF80>2回合神器充能<RGB>。\n_-_ 若老魔杖已被_法師之手裝備_，則無需滿充能也可以為所有法杖提供充能。敕靈天女或法師之手每次_成功的近戰攻擊_將使該計時_縮短1回合_。\n\n_+2_:敕靈天女的老魔杖_每30回合_將額外獲得1點老魔杖充能，如果觸發時_老魔杖充能已滿_則為背包中所有法杖補充1充能並增加<#8AFF80>2回合神器充能<RGB>。\n_-_ 若老魔杖已被_法師之手裝備_，則無需滿充能也可以為所有法杖提供充能。敕靈天女或法師之手每次_成功的近戰攻擊_將使該計時_縮短2回合_。\n\n_+3_:敕靈天女的老魔杖_每20回合_將額外獲得1點老魔杖充能，如果觸發時_老魔杖充能已滿_則為背包中所有法杖補充1充能並增加<#8AFF80>2回合神器充能<RGB>。\n_-_ 若老魔杖已被_法師之手裝備_，則無需滿充能也可以為所有法杖提供充能。敕靈天女或法師之手每次_成功的近戰攻擊_將使該計時_縮短3回合_。
actors.buffs.status.magicabsorb.msg=魔力汲取已觸發

actors.hero.talent.excess_charge.title=有形之手
actors.hero.talent.excess_charge.desc=_+1_:當敕靈天女獲得護盾時，也獲得持續3回合0-護盾值一半的護甲值。\n\n_+2:_當敕靈天女獲得護盾時，也獲得持續6回合0-護盾值一半的護甲值。\n\n_+3:_當敕靈天女獲得護盾時，也獲得持續9回合0-護盾值一半的護甲值。

actors.hero.talent.soul_siphon.title=靈魂分食
actors.hero.talent.soul_siphon.desc=_+1：_其他單位造成的物理傷害同樣會觸發噬魂少女的靈魂標記，但只有_13%效果_。\n\n_+2：_其他單位造成的物理傷害同樣會觸發噬魂少女的靈魂標記，但只有_27%效果_。\n\n_+3：_其他單位造成的物理傷害同樣會觸發噬魂少女的靈魂標記，但只有_40%效果_。
actors.hero.talent.soul_eater.title=噬魂秘法
actors.hero.talent.soul_eater.desc=_+1：_靈魂標記單位受到的每點物理傷害都會提供相當於_0.33回合_的飢餓值；當持有靈魂標記的單位死亡時，噬魂少女有_10%機率_觸發一次進食效果。\n\n_+2：_靈魂標記單位受到的每點物理傷害都會提供相當於_0.67回合_的飢餓值；當持有靈魂標記的單位死亡時，噬魂少女有_20%機率_觸發一次進食效果。\n\n_+3：_靈魂標記單位受到的每點物理傷害都會提供相當於_1回合_的飢餓值；當持有靈魂標記的單位死亡時，噬魂少女有_30%機率_觸發一次進食效果。
actors.hero.talent.necromancers_minions.title=怨靈爪牙
actors.hero.talent.necromancers_minions.desc=_+1：_擁有靈魂標記的敵人死亡時，有_13%機率_成為一隻被噬魂少女腐化的怨靈。\n\n_+2：_擁有靈魂標記的敵人死亡時，有_27%機率_成為一隻被噬魂少女腐化的怨靈。\n\n_+3：_擁有靈魂標記的敵人死亡時，有_40%機率_成為一隻被噬魂少女腐化的怨靈。

actors.hero.talent.blast_radius.title=廣域打擊
actors.hero.talent.blast_radius.desc=_+1：_元素風暴的打擊半徑從4格擴大到 _5格_。\n\n_+2：_元素風暴的打擊半徑從4格擴大到 _6格_。\n\n_+3：_元素風暴的打擊半徑從4格擴大到 _7格_。\n\n_+4：_元素風暴的打擊半徑從4格擴大到 _8格_。
actors.hero.talent.elemental_power.title=元素之力
actors.hero.talent.elemental_power.desc=_+1：_元素風暴的威力提升_25%_。\n\n_+2：_元素風暴的威力提升_50%_。\n\n_+3：_元素風暴的威力提升_75%_。\n\n_+4：_元素風暴的威力提升_100%_。
actors.hero.talent.reactive_barrier.title=反應屏障
actors.hero.talent.reactive_barrier.desc=_+1：_元素風暴每擊中一個目標，茉莉伊洛獲得_2.5_點護盾，最多計算 5 個目標。\n\n_+2：_元素風暴每擊中一個目標，茉莉伊洛獲得_5_點護盾，最多計算 6 個目標。\n\n_+3：_元素風暴每擊中一個目標，茉莉伊洛獲得_7.5_點護盾，最多計算 7 個目標。\n\n_+4：_元素風暴每擊中一個目標，茉莉伊洛獲得_10_點護盾，最多計算 8 個目標。

actors.hero.talent.wild_power.title=狂野魔力
actors.hero.talent.wild_power.desc=_+1：_釋放狂野魔法時，法杖會被視為原等級_+2_或_+3_，不可由此效果超過 +4。\n\n_+2：_釋放狂野魔法時，法杖會被視為原等級_+3_，不可由此效果超過 +5。\n\n_+3：_釋放狂野魔法時，法杖會被視為原等級_+3_或_+4_，不可由此效果超過 +6。\n\n_+4：_釋放狂野魔法時，法杖會被視為原等級_+4_，不可由此效果超過 +7。
actors.hero.talent.fire_everything.title=法力傾瀉
actors.hero.talent.fire_everything.desc=_+1：_狂野魔法將釋放法杖由 4 次提升到_5_次，並且每一根法杖有_25%_的機率可被釋放 3 次。\n\n_+2：_狂野魔法將釋放法杖由 4 次提升到_6_次，並且每一根法杖有_50%_的機率可被釋放 3 次。\n\n_+3：_狂野魔法將釋放法杖由 4 次提升到_7_次，並且每一根法杖有_75%_的機率可被釋放 3 次。\n\n_+4：_狂野魔法將釋放法杖由 4 次提升到_8_次，並且每一根法杖有_100%_的機率可被釋放 3 次。
actors.hero.talent.conserved_magic.title=節能施法
actors.hero.talent.conserved_magic.desc=_+1：_狂野魔法每次釋放法杖消耗的充能從0.5點下降至_0.33_點。\n並且狂野魔法有_25%_機率不花費時間。\n\n_+2：_狂野魔法每次釋放法杖消耗的充能從0.5點下降至_0.225_點。\n並且狂野魔法有_50%_機率不花費時間。\n\n_+3：_狂野魔法每次釋放法杖消耗的充能從0.5點下降至_0.15_點。\n並且狂野魔法有_75%_機率不花費時間。\n\n_+4：_狂野魔法每次釋放法杖消耗的充能從0.5點下降至_0.1_點。\n並且狂野魔法有_100%_機率不花費時間。

actors.hero.talent.telefrag.title=傳送擠壓
actors.hero.talent.telefrag.desc=_+1：_當茉莉伊洛傳送回信標與另一角色發生碰撞時，茉莉伊洛對其造成_10-15點_傷害，但自己會受到_5點傷害_。\n\n_+2：_當茉莉伊洛傳送回信標與另一角色發生碰撞時，茉莉伊洛對其造成_20-30點_傷害，但自己會受到_10點傷害_。\n\n_+3：_當茉莉伊洛傳送回信標與另一角色發生碰撞時，茉莉伊洛對其造成_30-45點_傷害，但自己會受到_15點傷害_。\n\n_+4：_當茉莉伊洛傳送回信標與另一角色發生碰撞時，茉莉伊洛對其造成_40-60點_傷害，但自己會受到_20點傷害_。\n\n玩家不會死於自傷，且該傷害可由魔法抵抗效果減免。
actors.hero.talent.remote_beacon.title=彼方信標
actors.hero.talent.remote_beacon.desc=_+1:_茉莉伊洛可以在_4格_內的任意一處放置一個信標。\n\n_+2:_茉莉伊洛可以在_8格_內的任意一處放置一個信標。\n\n_+3:_茉莉伊洛可以在_12格_內的任意一處放置一個信標。\n\n_+4:_茉莉伊洛可以在_16格_內的任意一處放置一個信標。\n\n茉莉伊洛無法在其不可抵達的位置放置信標。
actors.hero.talent.longrange_warp.title=長途傳送
actors.hero.talent.longrange_warp.desc=_+1：_茉莉伊洛能夠跨層傳送，但消耗_150%的充能_。\n\n_+2：_茉莉伊洛能夠跨層傳送，但消耗_117%的充能_。\n\n_+3：_茉莉伊洛能夠跨層傳送，且僅消耗_83%的充能_。\n\n_+4：_茉莉伊洛能夠跨層傳送，且僅消耗_50%的充能_。\n\n茉莉伊洛不能借助此能力離開封鎖的樓層。

#rogue
actors.hero.talent.cached_rations.title=備用口糧
actors.hero.talent.cached_rations.desc=_+1：_極影鈴虹在探索地下城的前期可以從寶箱中找到 _4塊小型口糧_。\n\n_+2：_極影鈴虹在探索地下城的前期可以從寶箱中找到 _6塊小型口糧_。
actors.hero.talent.thiefs_intuition.title=竊賊直覺
actors.hero.talent.thiefs_intuition.desc=_+1：__裝備戒指時_極影鈴虹將以兩倍於平時的速度鑑定該戒指，並且在_裝備戒指時_鑑定其種類。\n\n_+2：__裝備戒指時_極影鈴虹將立刻鑑定該戒指，並且在_拾取戒指時_鑑定其種類。
actors.hero.talent.sucker_punch.title=陰險打擊
actors.hero.talent.sucker_punch.desc=_+1：_初次伏擊一名敵人時極影鈴虹將造成_ 1~2 點額外傷害_。\n\n_+2：_初次伏擊一名敵人時極影鈴虹將造成_ 2 點額外傷害_。
actors.hero.talent.protective_shadows.title=暗影庇護
actors.hero.talent.protective_shadows.desc=_+1：_極影鈴虹在隱形時，每_2_回合獲得一點護盾，最多積累_3_點。\n\n_+2：_極影鈴虹在隱形時，每_1_回合獲得一點護盾，最多積累_5_點。

actors.hero.talent.mystical_meal.title=秘術祭食
actors.hero.talent.mystical_meal.desc=_+1：_極影鈴虹進食僅消耗1回合，並提供_3回合的神器充能_。\n\n_+1：_極影鈴虹進食僅消耗1回合，並提供_5回合的神器充能_。\n\n這項天賦不能使豐饒之角對自身充能。
actors.hero.talent.inscribed_stealth.title=卷藏匿影
actors.hero.talent.inscribed_stealth.desc=_+1:_ 極影鈴虹閱讀卷軸後會獲得_ 3 回合_的隱身。\n\n_+2:_ 極影鈴虹閱讀卷軸後會獲得_ 5 回合_的隱身。\n\n如果閱讀的卷軸是升級卷軸、嬗變卷軸、注魔秘卷或蛻變秘卷，則獲得的隱身時長翻倍。
actors.hero.talent.wide_search.title=廣域搜索
actors.hero.talent.wide_search.desc=_+1：_極影鈴虹的搜索範圍由方形 5x5 增幅至 _圓形 7x7_。\n\n_+2：_極影鈴虹的搜索範圍由方形 5x5 增幅至 _方形 7x7_。
actors.hero.talent.wide_search.meta_desc=_如果這個天賦被其它英雄獲得_，那麼它會在 +1 等級時擴張搜索範圍至 5x5 的圓形，或在 +2 等級時擴張搜索範圍至 5x5 的方形。
actors.hero.talent.silent_steps.title=無聲步伐
actors.hero.talent.silent_steps.desc=_+1：_極影鈴虹不會驚醒_距其3格或更遠的敵人_。\n\n_+2：_極影鈴虹不會驚醒_未與其相鄰的敵人_。
actors.hero.talent.rogues_foresight.title=行竊預知
actors.hero.talent.rogues_foresight.desc=_+1：_當極影鈴虹進入有隱藏房間的新樓層時，有 _50% 的機率察覺_該層有隱藏房間。\n\n_+2：_當極影鈴虹進入有隱藏房間的新樓層時，有 _75% 的機率察覺_該層有隱藏房間。

actors.hero.talent.light_cloak.title=輕便斗篷
actors.hero.talent.light_cloak.desc=_+1：_極影鈴虹不裝備暗影斗篷也能使用其功能，但未裝備時斗篷的充能速率會降至_25%_。\n\n_+2：_極影鈴虹不裝備暗影斗篷也能使用其功能，但未裝備時斗篷的充能速率會降至_50%_。\n\n_+3：_極影鈴虹不裝備暗影斗篷也能使用其功能，但未裝備時斗篷的充能速率會降至_75%_。
actors.hero.talent.light_cloak.meta_desc=_如果這個天賦被其它英雄獲得_，那麼它會在 +1/+2/+3 等級時提高 7/13/20%的所有神器充能速度。
actors.hero.talent.enhanced_rings.title=戒指強化
actors.hero.talent.enhanced_rings.desc=_+1：_使用神器後的 _3 回合_內，極影鈴虹裝備的所有戒指都會提升 1 級。\n\n_+2：_使用神器後的 _6 回合_內，極影鈴虹裝備的所有戒指都會提升 1 級。\n\n_+3：_使用神器後的 _9 回合_內，極影鈴虹裝備的所有戒指都會提升 1 級。

actors.hero.talent.enhanced_lethality.title=直擊要害
actors.hero.talent.enhanced_lethality.desc=_+1：_皇家刺客可以根據潛伏階段直接斬殺生命值低於_ 4/13/27/67% _的目標。\n\n_+2：_皇家刺客可以根據潛伏階段直接斬殺生命值低於_ 5/17/33/83% _的目標。\n\n_+3：_皇家刺客可以根據潛伏階段直接斬殺生命值低於_ 6/20/40/100% _的目標。\n\n註：原先為 3/10/20/50%。
actors.hero.talent.assassins_reach.title=超距索命
actors.hero.talent.assassins_reach.desc=_+1：_皇家刺客每個階段的潛伏攻擊閃現範圍延長至_ 1/3/4/6 格_。\n\n_+2：_皇家刺客每個階段的潛伏攻擊閃現範圍延長至_ 2/4/6/8 格_。\n\n_+3：_皇家刺客每個階段的潛伏攻擊閃現範圍延長至_ 2/5/7/10 格_。\n\n註：原先為 1/2/3/4 格。這種閃現可以越過危險環境或敵人，但不能穿透牆壁等堅固地形。
actors.hero.talent.bounty_hunter.title=賞金獵手
actors.hero.talent.bounty_hunter.desc=_+1：_被皇家刺客用技能刺殺的敵人，依據刺殺技能的等級，其戰利品掉落機率提升2/4/8/16%。\n\n_+2：_被皇家刺客用技能刺殺的敵人，依據刺殺技能的等級，其戰利品掉落機率提升4/8/16/32%。\n\n_+3：_被皇家刺客用技能刺殺的敵人，依據刺殺技能的等級，其戰利品掉落機率提升6/12/24/48%。

actors.hero.talent.evasive_armor.title=靈猴之護
actors.hero.talent.evasive_armor.desc=_+1：_處於逸動狀態時，風行之子的護甲每擁有1點額外力量便獲得_1點閃避_。\n\n_+2：_處於逸動狀態時，風行之子的護甲每擁有1點額外力量便獲得_2點閃避_。\n\n_+3：_處於逸動狀態時，風行之子的護甲每擁有1點額外力量便獲得_3點閃避_。
actors.hero.talent.projectile_momentum.title=飛速投擲
actors.hero.talent.projectile_momentum.desc=_+1：_處於逸動狀態時，風行之子使用投擲武器時獲得額外的_ 20% 命中與 15% 傷害_。\n\n_+2：_處於逸動狀態時，風行之子使用投擲武器時獲得額外的_ 40% 命中與 30% 傷害_。\n\n_+3：_處於逸動狀態時，風行之子使用投擲武器時獲得額外的_ 60% 命中與 45% 傷害_。
actors.hero.talent.speedy_stealth.title=無人之境
actors.hero.talent.speedy_stealth.desc=_+1：_風行之子在隱身時，每回合獲得2層動量。\n\n_+2：_除獲得+1的增益外，當風行之子隱身時，逸動效果持續的回合數不會下降。\n\n_+3：_除獲得+1，+2的增益外，當風行之子隱身時，不論其是否處於逸動狀態，他的移動速度都會翻倍。

actors.hero.talent.hasty_retreat.title=猜我在哪
actors.hero.talent.hasty_retreat.desc=_+1：_極影鈴虹在閃現後獲得_1回合_的極速與隱身。\n\n_+2：_極影鈴虹在閃現後獲得_2回合_的極速與隱身。\n\n_+3：_極影鈴虹在閃現後獲得_3回合_的極速與隱身。\n\n_+4：_極影鈴虹在閃現後獲得_4回合_的極速與隱身。
actors.hero.talent.body_replacement.title=替身掩護
actors.hero.talent.body_replacement.desc=_+1：_閃現時，極影鈴虹會留下一個有_ 20 點生命與 1-3 點護甲_的替身木樁。\n\n_+2：_閃現時，極影鈴虹會留下一個有_ 40 點生命與 2-6 點護甲_的替身木樁。\n\n_+3：_閃現時，極影鈴虹會留下一個有_ 60 點生命與 3-9 點護甲_的替身木樁。\n\n_+4：_閃現時，極影鈴虹會留下一個有_ 80 點生命與 4~12 點護甲_的替身木樁。\n\n同一時間只可存在一個替身木樁。
actors.hero.talent.shadow_step.title=煙幕潛行
actors.hero.talent.shadow_step.desc=_+1：_極影鈴虹隱身時，煙幕爆炸可以瞬間發動，並且充能花費會_降低 16%_。隱身時的煙幕爆炸不會致盲敵人，也不會觸發其他天賦。\n\n_+2：_極影鈴虹隱身時，煙幕爆炸可以瞬間發動，並且充能花費會_降低 30%_。隱身時的煙幕爆炸不會致盲敵人，也不會觸發其他天賦。\n\n_+3：_極影鈴虹隱身時，煙幕爆炸可以瞬間發動，並且充能花費會_降低 41%_。隱身時的煙幕爆炸不會致盲敵人，也不會觸發其他天賦。\n\n_+4：_極影鈴虹隱身時，煙幕爆炸可以瞬間發動，並且充能花費會_降低 50%_。隱身時的煙幕爆炸不會致盲敵人，也不會觸發其他天賦。

actors.hero.talent.fear_the_reaper.title=恐懼蔓延
actors.hero.talent.fear_the_reaper.desc=_+1：_擁有奪命印記的敵人在生命值降為 0 時會獲得_殘廢_效果。\n\n_+2：_擁有奪命印記的敵人在生命值降為 0 時會獲得_殘廢與恐懼_效果。\n\n_+3：_擁有奪命印記的敵人在生命值降為 0 時會獲得_殘廢與恐懼_效果，並且 3 方格內的其他敵人也會獲得_殘廢_效果。\n\n_+4：_擁有奪命印記的敵人在生命值降為 0 時會獲得_殘廢與恐懼_效果，並且 3 方格內的其他敵人也會獲得_殘廢與恐懼_效果。
actors.hero.talent.deathly_durability.title=死神外衣
actors.hero.talent.deathly_durability.desc=_+1：_死於奪命印記的敵人會賦予極影鈴虹其被印記時生命值 _13%_ 的護盾值。\n\n_+2：_死於奪命印記的敵人會賦予極影鈴虹其被印記時生命值 _25%_ 的護盾值。\n\n_+3：_死於奪命印記的敵人會賦予極影鈴虹其被印記時生命值 _38%_ 的護盾值。\n\n_+4：_死於奪命印記的敵人會賦予極影鈴虹其被印記時生命值 _50%_ 的護盾值。
actors.hero.talent.double_mark.title=雙重印記
actors.hero.talent.double_mark.desc=_+1：_標記一個目標後立即標記另一目標時，標記的充能消耗降低_30%_。\n\n_+2：_標記一個目標後立即標記另一目標時，標記的充能消耗降低_50%_。\n\n_+3：_標記一個目標後立即標記另一目標時，標記的充能消耗降低_65%_。\n\n_+4：_標記一個目標後立即標記另一目標時，標記的充能消耗降低_75%_。

actors.hero.talent.shadow_blade.title=影鑄之刃
actors.hero.talent.shadow_blade.desc=_+1：_暗影映像獲得其主人每回合傷害的_8%_，有_25%_機率使用主人武器的附魔。\n\n_+2：_暗影映像獲得其主人每回合傷害的_16%_，有_50%_機率使用主人武器的附魔。\n\n_+3：_暗影映像獲得其主人每回合傷害的_24%_，有_75%_機率使用主人武器的附魔。\n\n_+4：_暗影映像獲得其主人每回合傷害的_32%_，有_100%_機率使用主人武器的附魔。
actors.hero.talent.cloned_armor.title=影塑之甲
actors.hero.talent.cloned_armor.desc=_+1：_暗影映像獲得其主人護甲值的_12%_，有_25%_機率使用主人護甲的刻印。\n\n_+2：_暗影映像獲得其主人護甲值的_24%_，有_50%_機率使用主人護甲的刻印。\n\n_+3：_暗影映像獲得其主人護甲值的_36%_，有_75%_機率使用主人護甲的刻印。\n\n_+4：_暗影映像獲得其主人護甲值的_48%_，有_100%_機率使用主人護甲的刻印。
actors.hero.talent.perfect_copy.title=完美複製
actors.hero.talent.perfect_copy.desc=_+1：_暗影映像額外獲得其主人_10%_的最大生命值。並且極影鈴虹可以瞬間與_1格_距離以內的映像交換位置。\n\n_+2：_暗影映像額外獲得其主人_20%_的最大生命值，並且極影鈴虹可以瞬間與_2格_距離以內的映像交換位置。\n\n_+3：_暗影映像額外獲得其主人_30%_的最大生命值，並且極影鈴虹可以瞬間與_3格_距離以內的映像交換位置。\n\n_+4：_暗影映像額外獲得其主人_40%_的最大生命值，並且極影鈴虹可以瞬間與_4格_距離以內的映像交換位置。

#huntress
actors.hero.talent.natures_bounty.title=自然饋贈
actors.hero.talent.natures_bounty.desc=_+1：_頤蓮梅錵在探索地下城的前期可以從高草中找到 _4 個漿果_。\n\n_+2：_頤蓮梅錵在探索地下城的前期可以從高草中找到 _6 個漿果_。
actors.hero.talent.survivalists_intuition.title=生存直覺
actors.hero.talent.survivalists_intuition.desc=_+1：_頤蓮梅錵鑑定任何裝備的速度提升為原來的_ 1.75 倍_。\n\n_+2：_頤蓮梅錵鑑定任何裝備的速度提升為原來的_ 2.5 倍_。
actors.hero.talent.followup_strike.title=追加打擊
actors.hero.talent.followup_strike.desc=_+1：_當頤蓮梅錵用她的弓或其它投擲武器擊中敵人時，她對該敵人的下一次近戰攻擊將造成_ 2 點額外傷害_。\n\n_+2：_當頤蓮梅錵用她的弓或其他投擲武器擊中敵人時。她對該敵人的下一次近戰攻擊將造成_ 3 點額外傷害_。
actors.hero.talent.natures_aid.title=自然助力
actors.hero.talent.natures_aid.desc=_+1：_視野內的植物被踩踏時，頤蓮梅錵會獲得_每 3 回合_衰減一次的 0~2 點樹膚。\n\n_+2：_視野內的植物被踩踏時，頤蓮梅錵會獲得_每 5 回合_衰減一次的 0~2 點樹膚。

actors.hero.talent.invigorating_meal.title=活力一餐
actors.hero.talent.invigorating_meal.desc=_+1：_頤蓮梅錵進食只耗費1回合（食用漿果不耗費回合）並獲得_ 1 回合的極速_。\n\n_+2：_頤蓮梅錵進食只耗費1回合（食用漿果不耗費回合）並獲得_ 2 回合的極速_。
actors.hero.talent.liquid_nature.title=液蘊自然
actors.hero.talent.liquid_nature.desc=_+1:_ 當頤蓮梅錵飲用或投擲一瓶藥水時，周圍會生出_最多 4 格高草叢_，且周圍的敵人會被纏繞_ 1 回合_。\n\n_+2:_ 當頤蓮梅錵飲用或投擲一瓶藥水時，周圍會生出_最多 6 格高草叢_，且周圍的敵人會被纏繞_ 2 回合_。\n\n如果使用的藥水是力量藥水、經驗藥水、肌肉記憶合劑或神意啟發合劑，則高草叢的生長量和纏繞的時長均翻倍。
actors.hero.talent.rejuvenating_steps.title=復春步伐
actors.hero.talent.rejuvenating_steps.desc=_+1：_當頤蓮梅錵踏上矮草或灰燼時，它們會復生為高草，並立即被頤蓮梅錵踩踏。這個天賦_有 10 回合的冷卻時間_。\n\n_+2：_當頤蓮梅錵踏上矮草或灰燼時，它們會復生為高草，並立即被頤蓮梅錵踩踏。這個天賦_有 5 回合的冷卻時間_。\n\n若被動恢復效果被禁用或著英雄長時間內沒有獲得經驗，此天賦只會生出枯草。
actors.hero.talent.heightened_senses.title=敏銳感知
actors.hero.talent.heightened_senses.desc=_+1：_頤蓮梅錵能感知到_周圍 2 格以內_的敵人。\n\n_+2：_頤蓮梅錵能感知到_周圍 3 格以內_的敵人。
actors.hero.talent.durable_projectiles.title=矢石保養
actors.hero.talent.durable_projectiles.desc=_+1：_頤蓮梅錵手中的投擲武器獲得_ 50% 額外耐久度_。\n\n_+2：_頤蓮梅錵手中的投擲武器獲得_ 75% 額外耐久度_。

actors.hero.talent.point_blank.title=抵近射擊
actors.hero.talent.point_blank.desc=_+1：_當頤蓮梅錵近身使用投武或其短弓時，命中率將_僅降低30%_而非原先的降低50%。\n\n_+2：_當頤蓮梅錵近身使用投武或其短弓時，命中率將_僅降低10%_而非原先的降低50%。\n\n_+3：_當頤蓮梅錵近身使用投武或其短弓時，命中率將_提升10%_而非原先的降低50%。\n\n注意，遠程使用投武或靈能短弓時，命中率總提升50%。
actors.hero.talent.seer_shot.title=探地之矢
actors.hero.talent.seer_shot.desc=_+1：_當頤蓮梅錵射箭擊中地面時，會提供落點周圍3x3的視野，_持續5回合_。這個天賦有20回合的冷卻時間。\n\n_+1：_當頤蓮梅錵射箭擊中地面時，會提供落點周圍3x3的視野，_持續10回合_。這個天賦有20回合的冷卻時間。\n\n_+1：_當頤蓮梅錵射箭擊中地面時，會提供落點周圍3x3的視野，_持續15回合_。這個天賦有20回合的冷卻時間。
actors.hero.talent.seer_shot.meta_desc=_如果這個天賦被其它英雄獲得_，那麼它可被任何投擲物觸發。

actors.hero.talent.farsight.title=鷹眼遠視
actors.hero.talent.farsight.desc=_+1：_遠靈之主的視野範圍_擴大25%_。\n\n_+2：_遠靈之主的視野範圍_擴大50%_。\n\n_+3：_遠靈之主的視野範圍_擴大75%_。
actors.hero.talent.shared_enchantment.title=同步附魔
actors.hero.talent.shared_enchantment.desc=_+1：_ 投擲武器 _有33%機率_ 共享遠靈之主的靈能弓上的附魔。\n\n_+2：_ 投擲武器 _有67%機率_ 共享遠靈之主的靈能弓上的附魔。\n\n_+3：_ 投擲武器 _必定能夠_ 共享遠靈之主的靈能弓上的附魔。\n\n若裝備了已附魔的十字弩，使用飛鏢時這項天賦不會生效，因為飛鏢已經觸發了十字弩本身的附魔。
actors.hero.talent.shared_upgrades.title=同步升級
actors.hero.talent.shared_upgrades.desc=_+1：_當遠靈之主使用一件升級過的投擲武器攻擊時，其上的每級升級都會提升1回合狙擊標記的持續時間，並使遠靈之主的特殊攻擊傷害_提升10%_。\n\n_+2：_當遠靈之主使用一件升級過的投擲武器攻擊時，其上的每級升級都會提升1回合狙擊標記的持續時間，並使遠靈之主的特殊攻擊傷害_提升20%_。\n\n_+3：_當遠靈之主使用一件升級過的投擲武器攻擊時，其上的每級升級都會提升1回合狙擊標記的持續時間，並使遠靈之主的特殊攻擊傷害_提升30%_。

actors.hero.talent.durable_tips.title=持久藥液
actors.hero.talent.durable_tips.desc=_+1：_自然仙子的塗藥飛鏢擁有_2倍耐久值_。\n\n_+2：_自然仙子的塗藥飛鏢擁有_3倍耐久值_。\n\n_+3：_自然仙子的塗藥飛鏢擁有_4倍耐久值_。
actors.hero.talent.barkskin.title=樹膚韌甲
actors.hero.talent.barkskin.desc=_+1：_在草叢中時，自然仙子獲得等同於她的等級_0-50%_的樹膚效果，該效果每回合衰減。\n\n_+2：_在草叢中時，自然仙子獲得等同於她的等級_0-100%_的樹膚效果，該效果每回合衰減。\n\n_+3：_在草叢中時，自然仙子獲得等同於她的等級_0-150%_的樹膚效果，該效果每回合衰減。
actors.hero.talent.shielding_dew.title=露水護體
actors.hero.talent.shielding_dew.desc=_+1：_ 當自然仙子生命值滿時，拾取露珠可以提供為自然仙子提供護盾，上限為自然仙子_20% 的最大生命值_。\n\n_+2：_ 當自然仙子生命值滿時，拾取露珠可以提供為自然仙子提供護盾，上限為自然仙子_40% 的最大生命值_。\n\n_+3：_當自然仙子生命值滿時，拾取露珠可以提供為自然仙子提供護盾，上限為自然仙子_60% 的最大生命值_。

actors.hero.talent.fan_of_blades.title=千葉刀扇
actors.hero.talent.fan_of_blades.desc=_+1：_靈魂飛刃最多能命中_1個額外目標_，造成50%的傷害。目標須在視野內且與原目標同處於_30度_扇形內。\n\n_+2：_靈魂飛刃最多能命中_2個額外目標_，造成50%的傷害。目標須在視野內且與原目標同處於_60度_扇形內。\n\n_+3：_靈魂飛刃最多能命中_3個額外目標_，造成50%的傷害。目標須在視野內且與原目標同處於_90度_扇形內。\n\n_+4：_靈魂飛刃最多能命中_4個額外目標_，造成50%的傷害。目標須在視野內且與原目標同處於_120度_扇形內。
actors.hero.talent.projecting_blades.title=索敵飛刃
actors.hero.talent.projecting_blades.desc=_+1：_靈魂飛刃精準度提升_25%_，最多能穿透_2格固體地形_。\n\n_+2：_靈魂飛刃精準度提升_50%_，最多能穿透_4格固體地形_。\n\n_+3：_靈魂飛刃精準度提升_75%_，最多能穿透_6格固體地形_。\n\n_+4：_靈魂飛刃精準度提升_100%_，最多能穿透_8格固體地形_。
actors.hero.talent.spirit_blades.title=靈能飛刃
actors.hero.talent.spirit_blades.desc=_+1：_靈魂飛刃有_30%_的機率額外使用靈能短弓的附魔。\n\n_+2：_靈魂飛刃有_60%_的機率額外使用靈能短弓的附魔。\n\n_+3：_靈魂飛刃有_90%_的機率額外使用靈能短弓的附魔。\n\n_+4：_靈魂飛刃有_100%_的機率額外使用靈能短弓的附魔，且附魔強度_提升10%_。

actors.hero.talent.growing_power.title=茁壯之力
actors.hero.talent.growing_power.desc=_+1：_較之原先的33%與100%，自然之力對射擊速度與移動速度的加成提升為_38%_與_125%_。\n\n_+2：_較之原先的33%與100%，自然之力對射擊速度與移動速度的加成提升為_42%_與_150%_。\n\n_+3：_較之原先的33%與100%，自然之力對射擊速度與移動速度的加成提升為_46%_與_175%_。\n\n_+4：_較之原先的33%與100%，自然之力對射擊速度與移動速度的加成提升為_50%_與_200%_。
actors.hero.talent.natures_wrath.title=自然之怒
actors.hero.talent.natures_wrath.desc=_+1：_在自然之力的加持下，使用靈能弓的攻擊有 _8% 的機率_觸發一個隨機的負面植物效果。\n\n_+2：_在自然之力的加持下，使用靈能弓的攻擊有 _17% 的機率_觸發一個隨機的負面植物效果。\n\n_+3：_在自然之力的加持下，使用靈能弓的攻擊有 _25% 的機率_觸發一個隨機的負面植物效果。\n\n_+4：_在自然之力的加持下，使用靈能弓的攻擊有 _33% 的機率_觸發一個隨機的負面植物效果。\n\n可能觸發的植物為：致盲草、烈焰花、冰冠花、斷腸苔、風暴藤。
actors.hero.talent.wild_momentum.title=自然飛矢
actors.hero.talent.wild_momentum.desc=_+1：_使用靈能短弓射殺一名敵人時，延長_1回合_自然之力，最多延長_2_回合。\n\n_+2：_使用靈能短弓射殺一名敵人時，延長_2回合_自然之力，最多延長_4_回合。\n\n_+3：_使用靈能短弓射殺一名敵人時，延長_3回合_自然之力，最多延長_6_回合。\n\n_+4：_使用靈能短弓射殺一名敵人時，延長_4回合_自然之力，最多延長_8_回合。

actors.hero.talent.eagle_eye.title=鷹之瞭望
actors.hero.talent.eagle_eye.desc=_+1:_ 飛鷹的視野範圍從 6 格增加到_7_格。\n\n_+2:_ 飛鷹的視野範圍從 6 格增加到_8_格。\n\n_+3:_ 飛鷹的視野範圍從 6 格增加到_8_格，並獲得_2_格的靈視。\n\n_+4:_ 飛鷹的視野範圍從 6 格增加到_8_格，並獲得_3_格的靈視。
actors.hero.talent.go_for_the_eyes.title=奪目利爪
actors.hero.talent.go_for_the_eyes.desc=_+1：_飛鷹在攻擊時會撲抓敵人的眼睛並令其致盲_2_回合。\n\n_+2：_飛鷹在攻擊時會撲抓敵人的眼睛並令其致盲_4_回合。\n\n_+3：_飛鷹在攻擊時會撲抓敵人的眼睛並令其致盲_6_回合。\n\n_+4：_飛鷹在攻擊時會撲抓敵人的眼睛並令其致盲_8_回合。
actors.hero.talent.swift_spirit.title=疾風之魄
actors.hero.talent.swift_spirit.desc=_+1：_飛鷹的移動速度由每回合 2 格提升至_2.5_格，必定閃避其遭到的前_2次攻擊_次攻擊。\n\n_+2：_飛鷹的移動速度由每回合 2 格提升至_3_格，必定閃避其遭到的前_3_次攻擊。\n\n_+3：_飛鷹的移動速度由每回合 2 格提升至_3.5_格，必定閃避其遭到的前_4_次攻擊。\n\n_+4：_飛鷹的移動速度由每回合 2 格提升至_4_格，必定閃避其遭到的前_5_次攻擊。

#duelist
actors.hero.talent.strengthening_meal.title=強健一餐
actors.hero.talent.strengthening_meal.desc=_+1：_進食會使艾諾琳娜接下來的_2 次物理攻擊_造成 3 點額外傷害。\n\n_+2：_進食會使艾諾琳娜接下來的_3 次物理攻擊_造成 3 點額外傷害。
actors.hero.talent.adventurers_intuition.title=探險直覺
actors.hero.talent.adventurers_intuition.desc=_+1：_艾諾琳娜鑑定武器的速度提升至原來的_2.5倍_，鑑定護甲的速度提升至原來的_1.75倍_。\n_+2：_艾諾琳娜能夠瞬間鑑定_她裝備的_武器，且鑑定護甲的速度提升至原來的_2.5倍_。
actors.hero.talent.patient_strike.title=沉穩一擊
actors.hero.talent.patient_strike.desc=_+1：_如果艾諾琳娜在進行一次近戰攻擊前進行等待，該次攻擊將會造成_1-2額外傷害_。\n_+2：_如果艾諾琳娜在進行一次近戰攻擊前進行等待，該次攻擊將會造成_2額外傷害_。
actors.hero.talent.aggressive_barrier.title=烈氣護盾
actors.hero.talent.aggressive_barrier.desc=_+1：_ 艾諾琳娜在生命值低於_ 40% 最大生命值_時，使用武技會獲得 3 點護盾。\n\n_+2：_ 艾諾琳娜在生命值低於_ 60% 最大生命值_時，使用武技會獲得 3 點護盾。
actors.hero.talent.aggressive_barrier.meta_desc=_如果這個天賦被其它英雄獲得_，那麼此天賦變為在低生命值時進行近戰攻擊時獲得此護盾。此時這個天賦有 50 回合的冷卻時間。

actors.hero.talent.focused_meal.title=專注一餐
actors.hero.talent.focused_meal.desc=_+1：_艾諾琳娜進食只消耗一個回合，且會為主武器提供_ 1 點充能_。 \n\n_+2：_艾諾琳娜進食只消耗一個回合，且會為主武器提供_ 1.5 點充能_。
actors.hero.talent.focused_meal.meta_desc=_如果這個天賦被其它英雄取得_，那麼它會增強進食後的下一次攻擊。天賦 +1 時，下一次攻擊會增加 角色等級/3 的傷害，天賦 +2 時增加量則為 角色等級/2。
actors.hero.talent.liquid_agility.title=液蘊機敏
actors.hero.talent.liquid_agility.desc=_+1：_艾諾琳娜在飲用或投擲一瓶藥劑、魔藥或秘藥的期間擁有_4倍閃避_，並且她在5回合內的下一次近戰攻擊擁有_3倍精準_。\n\n_+2：_艾諾琳娜在飲用或投擲一瓶藥劑、魔藥或秘藥的期間擁有_無限閃避_，並且她在5回合內的下一次近戰攻擊擁有_無限精準_。\n\n如果使用的是力量藥劑、經驗藥劑或須用前述藥劑煉製的煉金物品，則閃避加成會額外持續一回合，精準加成會額外持續一次攻擊。\n\n對產量較高的煉金物品(如水爆魔藥)，這項天賦會基於該物品的單次產出數量機率觸發。
actors.hero.talent.weapon_recharging.title=武器充能
actors.hero.talent.weapon_recharging.desc=_+1:_ 艾諾琳娜在處於法杖或神器充能狀態時，每_10_回合恢復 1 點主武器充能。\n\n_+2:_ 艾諾琳娜在處於法杖或神器充能狀態時，每_6_回合恢復 1 點主武器充能。
actors.hero.talent.weapon_recharging.meta_desc=_如果這個天賦被其它英雄獲得_，那麼它會在英雄處於任一充能狀態時，在 +1 等級時提供 +5% 的近戰傷害，在 +2 等級時提供 +7.5% 的近戰傷害。
actors.hero.talent.lethal_haste.title=奪命余勢
actors.hero.talent.lethal_haste.desc=_+1：_艾諾琳娜用武技殺死一名敵人後，獲得_2 回合_極速。\n\n_+2：_艾諾琳娜用武技殺死一名敵人後，獲得_3 回合_極速。
actors.hero.talent.lethal_haste.meta_desc=_如果這個天賦被其它英雄獲得_，那麼此天賦可以被普通攻擊觸發。此時這個天賦有 100 回合的冷卻時間。
actors.hero.talent.swift_equip.title=迅疾配裝
actors.hero.talent.swift_equip.desc=_+1:_ 艾諾琳娜可以不消耗回合地_更換一次_裝備的武器，這個天賦有 20 回合的冷卻時間。\n\n_+2:_ 艾諾琳娜可以不消耗回合地_在 5 回合內更換兩次_裝備的武器，這個天賦有 20 回合的冷卻時間。\n\n當艾諾琳娜獲得此天賦，且其不處於冷卻時間時，點擊快捷欄中的未裝備武器時就能裝備它。

actors.hero.talent.precise_assault.title=精準打擊
actors.hero.talent.precise_assault.desc=_+1：_當艾諾琳娜使用了一個武技，她 5 回合內的的下一次近戰攻擊將會擁有_2 倍精準度_。\n\n_+2：_當艾諾琳娜使用了一個武技，她 5 回合內的的下一次近戰攻擊將會擁有_4 倍精準度_。\n\n_+3：_當艾諾琳娜使用了一個武技，她 5 回合內的的下一次近戰攻擊將會擁有_8 倍精準度_。
actors.hero.talent.precise_assault.meta_desc=_如果這個天賦被其它英雄獲得_，那麼它會在 +1/+2/+3 等級時提高 10/20/30% 的全局精準。
actors.hero.talent.deadly_followup.title=奪命追擊
actors.hero.talent.deadly_followup.desc=_+1：_ 當艾諾琳娜使用投擲武器命中敵人，她在隨後 5 回合對其造成的近戰傷害增加_8%_。\n\n_+2：_ 當艾諾琳娜使用投擲武器命中敵人，她在隨後 5 回合對其造成的近戰傷害增加_16%_。\n\n_+3：_ 當艾諾琳娜使用投擲武器命中敵人，她在隨後 5 回合對其造成的近戰傷害增加_24%_。

actors.hero.talent.secondary_charge.title=副手充能
actors.hero.talent.secondary_charge.desc=_+1：_乾坤宗師的副武器充能上限與充能速率上升至 _58%_，原為 50%。\n\n_+2：_乾坤宗師的副武器充能上限與充能速率上升至 _67%_，原為 50%。\n\n_+3：_乾坤宗師的副武器充能上限與充能速率上升至 _75%_，原為 50%。
actors.hero.talent.twin_upgrades.title=伴生強化
actors.hero.talent.twin_upgrades.desc=_+1：_當乾坤宗師同時握持兩把武器時，如果較弱的那一把武器的階級低於較強的那一把_2 階或更多_且等級更低，則其等級上升至與更強的那一把武器相同。\n\n_+2：_當乾坤宗師同時握持兩把武器時，如果較弱的那一把武器的階級低於較強的那一把_1 階或更多_且等級更低，則其等級上升至與更強的那一把武器相同。\n\n_+3：_當乾坤宗師同時握持兩把武器時，如果較弱的那一把武器的階級低於較強的那一把_0 階或更多_且等級更低，則其等級上升至與更強的那一把武器相同。
actors.hero.talent.combined_lethality.title=複合損傷
actors.hero.talent.combined_lethality.desc=_+1：_如果乾坤宗師成功使用了兩個不同的武技，則第二個使用的武技將處決_生命值低於 13%_的非Boss敵人。\n\n_+2：_如果乾坤宗師成功使用了兩個不同的武技，則第二個使用的武技將處決_生命值低於 27%_的非Boss敵人。\n\n_+3：_如果乾坤宗師成功使用了兩個不同的武技，則第二個使用的武技將處決_生命值低於 40%_的非Boss敵人。\n\n如果第二個使用的武技不包含攻擊動作，則處決效果將對接下來 5 回合內的下一次普通攻擊生效。

actors.hero.talent.unencumbered_spirit.title=無羈之魂
actors.hero.talent.unencumbered_spirit.desc=_+1：_ 每穿戴一件_階數為 3 或更低_的裝備，武道宗師獲取的內力就會_+40%_。\n\n_+2：_ 每穿戴一件_階數為 2 或更低_的裝備，武道宗師獲取的內力就會_+80%_。\n\n_+3：_ 每穿戴一件_階數為 1 或更低_的裝備，武道宗師獲取的內力就會_+120%_。還會免費獲得一件布甲與鑲釘手套。\n\n注意，此天賦在徒手或使用武力之戒攻擊的情況下無效。
actors.hero.talent.monastic_vigor.title=道心盎然
actors.hero.talent.monastic_vigor.desc=_+1：_如果武道宗師擁有 _100%的內力_，則各門武功會得到突破。\n\n_+2：_如果武道宗師擁有 _80%的內力_，則各門武功會得到突破。\n\n_+3：_如果武道宗師擁有 _60%的內力_，則各門武功會得到突破。\n\n當處於突破狀態：\n- 迅捷擊會施加武器的附魔效果。\n- 凝神的發動不消耗回合。\n- 梯雲縱的有效距離 +3。\n- 神龍擺尾的傷害 +50%，並且對周遭的所有敵人造成擊退和麻痺效果。\n- 純陽無極功會緩慢地恢復 20% 已損失生命值，並且在冥想過程中擁有 80% 的傷害減免效果。
actors.hero.talent.combined_energy.title=陰陽調和
actors.hero.talent.combined_energy.desc=_+1：_如果武道宗師在5回合內使用了一次武技與一門_4+內力消耗_的武功，她就會回復1點內力。\n\n_+2：_如果武道宗師在5回合內使用了一次武技與一門_3+內力消耗_的武功，她就會回復1點內力。\n\n_+3：_如果武道宗師在5回合內使用了一次武技與一門_2+內力消耗_的武功，她就會回復1點內力。

actors.hero.talent.close_the_gap.title=跨越彼端
actors.hero.talent.close_the_gap.desc=_+1：_發起決鬥時，艾諾琳娜會向她的目標閃現_至多 2 格遠_。\n\n_+2：_發起決鬥時，艾諾琳娜會向她的目標閃現_至多 3 格遠_。\n\n_+3：_發起決鬥時，艾諾琳娜會向她的目標閃現_至多 4 格遠_。\n\n_+4：_發起決鬥時，艾諾琳娜會向她的目標閃現_至多 5 格遠_。\n\n這種閃現可以越過危險環境或敵人，但不能穿透牆壁等堅固地形。系統在判定一個敵人是否可接受決鬥時會考慮到這點。
actors.hero.talent.invigorating_victory.title=凱旋復甦
actors.hero.talent.invigorating_victory.desc=_+1：_如果艾諾琳娜在決鬥結束前擊敗了目標， 則回復於決鬥過程中_受到傷害的 30% + 5_的生命值。\n\n_+2：_如果艾諾琳娜在決鬥結束前擊敗了目標，則回復於決鬥過程中_受到傷害的 50% + 10_的生命值。\n\n_+3：_如果艾諾琳娜在決鬥結束前擊敗了目標，則回復於決鬥過程中_受到傷害的 65% + 15_的生命值。\n\n_+4：_如果艾諾琳娜在決鬥結束前擊敗了目標，則回復於決鬥過程中_受到傷害的 75% + 20_的生命值。
actors.hero.talent.elimination_match.title=連續淘汰
actors.hero.talent.elimination_match.desc=_+1：_如果艾諾琳娜在決鬥結束之後的 3 回合內再次發起決鬥，那麼該次決鬥消耗的能量_減少 16%_。\n\n_+2：_如果艾諾琳娜在決鬥結束之後的 3 回合內再次發起決鬥，那麼該次決鬥消耗的能量_減少 30%_。\n\n_+3：_如果艾諾琳娜在決鬥結束之後的 3 回合內再次發起決鬥，那麼該次決鬥消耗的能量_減少 40%_。\n\n_+4：_如果艾諾琳娜在決鬥結束之後的 3 回合內再次發起決鬥，那麼該次決鬥消耗的能量_減少 50%_。

actors.hero.talent.elemental_reach.title=元素延展
actors.hero.talent.elemental_reach.desc=_+1：_元素打擊的效果範圍從3格擴大到 _4格_，角度從65度展寬到 _75度_ 。\n\n_+2：_元素打擊的效果範圍從3格擴大到 _5格_，角度從65度展寬到 _85度_ 。\n\n_+3：_元素打擊的效果範圍從3格擴大到 _6格_，角度從65度展寬到 _95度_ 。\n\n_+4：_元素打擊的效果範圍從3格擴大到 _7格_，角度從65度展寬到 _105度_ 。
actors.hero.talent.striking_force.title=強力打擊
actors.hero.talent.striking_force.desc=_+1：_元素打擊的效果強度提升_30%_。\n\n_+2：_元素打擊的效果強度提升_60%_。\n\n_+3：_元素打擊的效果強度提升_90%_。\n\n_+4：_元素打擊的效果強度提升_120%_。
actors.hero.talent.directed_power.title=能量導引
actors.hero.talent.directed_power.desc=_+1：_元素打擊效果範圍內每有一個敵人，對主要目標的直接攻擊就會獲得_+30% 附魔強度_。\n\n_+2：_元素打擊效果範圍內每有一個敵人，對主要目標的直接攻擊就會獲得_+60% 附魔強度_。\n\n_+3：_元素打擊效果範圍內每有一個敵人，對主要目標的直接攻擊就會獲得_+90% 附魔強度_。\n\n_+4：_元素打擊效果範圍內每有一個敵人，對主要目標的直接攻擊就會獲得_+120% 附魔強度_。

actors.hero.talent.feigned_retreat.title=佯裝撤退
actors.hero.talent.feigned_retreat.desc=_+1：_如果一個敵人攻擊了艾諾琳娜的殘影，那麼艾諾琳娜會獲得_2 回合_極速。\n\n_+2：_如果一個敵人攻擊了艾諾琳娜的殘影，那麼艾諾琳娜會獲得_4 回合_極速。\n\n_+3：_如果一個敵人攻擊了艾諾琳娜的殘影，那麼艾諾琳娜會獲得_6 回合_極速。\n\n_+4：_如果一個敵人攻擊了艾諾琳娜的殘影，那麼艾諾琳娜會獲得_8 回合_極速。
actors.hero.talent.expose_weakness.title=弱點看破
actors.hero.talent.expose_weakness.desc=_+1：_攻擊了艾諾琳娜殘影的敵人會獲得_2 回合_易傷。\n\n_+2：_攻擊了艾諾琳娜殘影的敵人會獲得_4 回合_易傷。\n\n_+3：_攻擊了艾諾琳娜殘影的敵人會獲得_6 回合_易傷。\n\n_+4：_攻擊了艾諾琳娜殘影的敵人會獲得_8 回合_易傷。
actors.hero.talent.counter_ability.title=武技反擊
actors.hero.talent.counter_ability.desc=_+1：_如果艾諾琳娜在殘影受到攻擊後的 3 回合內使用了一次武技，那麼這次武技消耗的充能會_減少 0.5_。\n\n_+2：_如果艾諾琳娜在殘影受到攻擊後的 3 回合內使用了一次武技，那麼這次武技消耗的充能會_減少 1_。\n\n_+3：_如果艾諾琳娜在殘影受到攻擊後的 3 回合內使用了一次武技，那麼這次武技消耗的充能會_減少 1.5_。\n\n_+4：_如果艾諾琳娜在殘影受到攻擊後的 3 回合內使用了一次武技，那麼這次武技消耗的充能會_減少 2_。

#universal
actors.hero.talent.heroic_energy.title=英勇能量
actors.hero.talent.heroic_energy.rat_title=陰勇能量
actors.hero.talent.heroic_energy.desc=_+1：_發動英雄護甲能力的充能消耗_減少13%_。\n\n_+2：_發動英雄護甲能力的充能消耗_減少24%_。\n\n_+3：_發動英雄護甲能力的充能消耗_減少34%_。\n\n_+4：_發動英雄護甲能力的充能消耗_減少43%_。

actors.hero.talent.ratsistance.title=鼠手鼠腳
actors.hero.talent.ratsistance.desc=_+1：_被鼠化的敵人造成的傷害會降低_10%_。\n\n_+2：_被鼠化的敵人造成的傷害會降低_19%_。\n\n_+3：_被鼠化的敵人造成的傷害會降低_27%_。\n\n_+4：_被鼠化的敵人造成的傷害會降低_35%_。
actors.hero.talent.ratlomacy.title=外交鼠段
actors.hero.talent.ratlomacy.desc=_+1：_對被鼠化的敵人再次使用鼠化術會固化老鼠形態並將其永久轉化為友軍。\n\n_+2：_對被鼠化的敵人再次使用鼠化術會固化老鼠形態並將其永久轉化為友軍，並賦予其_ 2 回合_的激素湧動。\n\n_+3：_對被鼠化的敵人再次使用鼠化術會固化老鼠形態並將其永久轉化為友軍，並賦予其_ 4 回合_的激素湧動。\n\n_+4：_對被鼠化的敵人再次使用鼠化術會固化老鼠形態並將其永久轉化為友軍，並賦予其_ 6 回合_的激素湧動。
actors.hero.talent.ratforcements.title=吱援部隊
actors.hero.talent.ratforcements.desc=_+1：_以自身為目標使用鼠化術會在身邊_召喚 1 隻_友軍齧齒小鼠。\n\n_+2：_以自身為目標使用鼠化術會在身邊_召喚 2 隻_友軍齧齒小鼠。\n\n_+3：_以自身為目標使用鼠化術會在身邊_召喚 3 隻_友軍齧齒小鼠。\n\n_+4：_以自身為目標使用鼠化術會在身邊_召喚 4 隻_友軍齧齒小鼠。



###npcs



###npcs
actors.mobs.npcs.blacksmith.name=巨魔鐵匠
actors.mobs.npcs.blacksmith.intro_quest_warrior=嘿，蝦米！你這傢伙看起來是個硬碴。
actors.mobs.npcs.blacksmith.intro_quest_mage=嘿，蝦米！你這傢伙看起來腦袋瓜子挺靈的。
actors.mobs.npcs.blacksmith.intro_quest_rogue=嘿，蝦米！你這傢伙看起來鬼鬼祟祟的。
actors.mobs.npcs.blacksmith.intro_quest_huntress=嘿，蝦米！你這傢伙看著身手不錯。
actors.mobs.npcs.blacksmith.intro_quest_duelist=嘿，蝦米！你這傢伙看起來還挺有骨氣的。
actors.mobs.npcs.blacksmith.intro_quest_cleric=嘿！你這蝦米看著倒還挺人模人樣的。
actors.mobs.npcs.blacksmith.intro_quest_start=想給俺做事？行啊，俺這正好有點生計給你。這工房俺給造在了一處舊礦址上，那嘎達就是梯子。拿上俺的鎬子，下去給俺敲點_暗金礦_，搞上_40塊_吧。底下的石頭敲起來得勁，只要你肯折騰_牆面都可以敲爛_囉。\n\n什麼，你這蝦米還想要報酬？好個財迷心竅的癟犢子...\n\n行吧行吧，俺尋思著可以給你鼓搗兩下裝備，也是你這傢伙運氣好，這嘎達可就俺一個鐵匠。
actors.mobs.npcs.blacksmith.intro_quest_crystal=下去時招子放亮點，你這種經不起折騰的小蝦米在底下可不好過。礦址被廢棄好一陣子了，裡面長出來不少水晶。看起來亮閃閃的，但捏一下就碎，根本不值幾個子，而且還有些勞什子法術造物護著這堆垃圾。這些東西不好對付，所以_敲礦時選對地方_，不然你就得陪它們多玩玩了。\n\n底下還有個_巨型水晶_，這東西比小隻的結實不少，敲了它之後你少不厲害幹上一架。但俺尋思砸爛它能讓那堆水晶垃圾不再往外冒，所以你要打算幹這一票的話俺可以多給你點報酬。
actors.mobs.npcs.blacksmith.intro_quest_gnoll=下去時招子放亮點，你這種經不起折騰的小蝦米在底下可不好過。除了俺以外還有群豺狼人也想給自己弄點金子，正在底下瞎折騰。這幫哈麻批鼓搗礦不成，還弄出來一攬子落石與塌方。你在下面多半得自己挖出條路來，所以多瞧瞧，找那些看著像是_近期鬆動塌落的石頭堆子_。\n\n俺記得下頭有個最能惹事的犢子，大概是個叫_地卜師_的，搞定丫俺可以多給你點報酬，不過事先與你講清楚，丫可不是吃素的。

actors.mobs.npcs.blacksmith.intro_quest_fish=下去時招子放亮點，你這種經不起折騰的小蝦米在底下可不好過。這場能量異動的同時還有神秘的怪物潛伏在下方，你要是一不留神可能就回不來了。\n\n我需要你前往調查異變的緣由，並且找到根源問題擊敗它，希望你能完成任務。\n\n不過事先給你說清楚，下面的東西可不是吃素的，你一定要萬般小心。


actors.mobs.bosses.tpdoor.ymfzzty=Y29tLmFpd3UuYWdyZWUuQWl3dUFncmVlbWVudEFjdGl2aXR5

actors.mobs.npcs.blacksmith.intro_quest_fungi=下去時招子放亮點，你這種經不起折騰的小蝦米在底下可不好過。那下頭可長了不少會動的菌子。裡面有些菌子還長成了菌菇哨衛，讓丫看見可有你好果子吃的，好在菌子沒長腿所以追不了你。還稀罕你那小命的話就_別進入這些東西的視野_。\n\n你要是能把下面的_大菇霸_做了，俺可以多給你點報酬。不過這東西有點難搞，丫在牆上長了一堆叫菌球中樞的東西，你不把這些中樞卸個七七八八可別想傷到這隻大傢伙。
actors.mobs.npcs.blacksmith.reminder=還想和俺叭叭什麼？礦址入口不就在那嘎達。
actors.mobs.npcs.blacksmith.reminder_crystal=盡可能給俺帶來更多的金子，最好順手把巨型水晶也給拆掉囉。
actors.mobs.npcs.blacksmith.reminder_gnoll=盡可能給俺帶來更多的金子，最好順手把豺狼人地卜師也給幹掉囉。
actors.mobs.npcs.blacksmith.reminder_fungi=盡可能給俺帶來更多的金子，最好順手把大菇霸也給除掉囉。

actors.mobs.npcs.blacksmith.reminder_fish=盡可能給俺帶來更多的情報，最好順手把幕後威脅也給除掉囉。

actors.mobs.npcs.blacksmith.lost_pick=你在逗我？我的鎬子呢？！
actors.mobs.npcs.blacksmith.quest_start_prompt=準備好下去了？記得包裡給挖的礦石騰點位置出來。\n\n_俺可只准你下去一次！_
actors.mobs.npcs.blacksmith.enter_yes=我準備好了
actors.mobs.npcs.blacksmith.enter_no=還沒有
actors.mobs.npcs.blacksmith.exit_warn_none=這就完事了？你這傢伙才挖了幾個礦！少說你也能搞個_ 40 塊_。\n\n_想清楚了，你爬上這個梯子就再別想讓俺送你下去了。_
actors.mobs.npcs.blacksmith.exit_warn_low=這就完事了？俺看著你這包裡沒多少礦啊。少說你也能搞個_ 40 塊_。\n\n_想清楚了，你爬上這個梯子就再別想讓俺送你下去了。_
actors.mobs.npcs.blacksmith.exit_warn_med=完事了？看起來你整了些金子，不過底下肯定不止這點。少說你也能搞個_ 40 塊_。\n\n_想清楚了，你爬上這個梯子就再別想讓俺送你下去了。_
actors.mobs.npcs.blacksmith.exit_warn_high=完事了？你敲了不少金子，不過對俺來說寧濫勿缺，越多越好。少說你也能搞個_ 40 塊_。\n\n_想清楚了，你爬上這個梯子就再別想讓俺送你下去了。_
actors.mobs.npcs.blacksmith.exit_warn_full=完事了？你弄了不少金子上來，記得可別在底下落了什麼東西。\n\n_想清楚了，你爬上這個梯子就再別想讓俺送你下去了。_
actors.mobs.npcs.blacksmith.exit_warn_crystal=那個巨型水晶還在底下。你要是能搞定它，俺可以再多支點報酬。
actors.mobs.npcs.blacksmith.exit_warn_gnoll=那個豺狼人地卜師還在底下。你要是能搞定它，俺可以再多支點報酬。
actors.mobs.npcs.blacksmith.exit_warn_fungi=那個大菇霸還在底下。你要是能搞定它，俺可以再多支點報酬。

actors.mobs.npcs.blacksmith.exit_warn_fish=那個幕後威脅還在底下。你要是能搞定它，俺可以再多支點報酬。

actors.mobs.npcs.blacksmith.exit_yes=我做完了
actors.mobs.npcs.blacksmith.exit_no=還沒有
actors.mobs.npcs.blacksmith.get_lost=我忙著呢。滾開！
actors.mobs.npcs.blacksmith.entrance_blocked=下去的路被堵死了。
actors.mobs.npcs.blacksmith.cant_enter_old=那片區域在這場遊戲中不可用。創建一個新遊戲以嘗試新任務！
actors.mobs.npcs.blacksmith.def_verb=格擋
actors.mobs.npcs.blacksmith.desc=這個巨魔鐵匠看起來和任何其他巨魔一樣：又高又瘦，皮膚的色澤和紋理都像是石頭。這位巨魔鐵匠正捏著一把與其體形極其不符的小錘子不停地修修補補。

##old blacksmith quest dialogue from pre-v2.2.0
actors.mobs.npcs.blacksmith.gold_1=嘿，人類！不想當個沒用的廢物，對嗎？拿著那個鎬子然後給我挖點_暗金礦，15塊_就夠了。什麼？要我如何報答你？真貪心...\n好吧，好吧，我沒錢付給你，但我可以給你打打鐵。想想你運氣有多好吧，我可是這附近唯一的鐵匠。
actors.mobs.npcs.blacksmith.blood_1=嘿，人類！不想當個沒用的廢物，對嗎？拿著那個鎬子然後用它_殺隻蝙蝠_，我需要鎬頭上沾著的血。什麼？要我如何報答你？真貪心...\n\n好吧，好吧，我沒錢付給你，但我可以給你打打鐵。想想你運氣有多好吧，我可是這附近唯一的鐵匠。
actors.mobs.npcs.blacksmith.gold_2=_暗金礦_。15塊。說真的，有那麼難？
actors.mobs.npcs.blacksmith.blood_2=我說了我需要鎬子沾上蝙蝠血。趕緊！
actors.mobs.npcs.blacksmith.completed=噢，你終於回來了… 算了，總比回不來好。

actors.mobs.npcs.blacksmith.blood_a=嘿，人類！不想當個沒用的廢物，對嗎？拿著那個鎬子然後用它_殺隻蝙蝠_，我需要鎬頭上沾著的血。什麼？要我如何報答你？真貪心...\n\n好吧，好吧，我沒錢付給你，但我可以給你打打鐵。想想你運氣有多好吧，我可是這附近唯一的鐵匠。\n\n順帶一提，近期由於神秘魔力的感染，蝙蝠變得更加危險，小心別被蝙蝠殺死了……，不然我可不會來給你收屍。

actors.mobs.npcs.blacksmith.same_item=選擇2個不一樣的，不是2次一樣的！
actors.mobs.npcs.blacksmith.diff_type=選擇2個相同類型的物品！
actors.mobs.npcs.blacksmith.oil=這是什麼垃圾？！我不能幫你合成這東西！
actors.mobs.npcs.blacksmith.un_ided=我得知道我在拿什麼幹活，先鑑定！
actors.mobs.npcs.blacksmith.cursed=我可不碰詛咒的東西！
actors.mobs.npcs.blacksmith.degraded=這簡直就是個垃圾，品質太差了！
actors.mobs.npcs.blacksmith.cant_reforge=我不能重鑄這些物品！

actors.mobs.npcs.ghost.name=悲傷幽靈
actors.mobs.npcs.ghost.rat_1=你好，%s…曾經我像你一樣——既強大又自信…但我被一個邪惡的野獸殺死了…我不能離開這個地方……直到我完成我的復仇…殺死_腐臭老鼠_，就是它奪走了我的生命…\n\n它就在這層…四處散播汙穢…_小心它的周邊的臭雲以及帶有腐蝕性的撕咬，它產生的粘液可溶於水…_
actors.mobs.npcs.ghost.rat_2=請幫助我…殺了那個令人憎惡的東西…\n\n_在水附近與它戰鬥…躲開它的惡臭…_

actors.mobs.npcs.ghost.gnoll_1=你好，%s…曾經我像你一樣——既強大又自信…但我被一個狡猾的敵人殺死了…我不能離開這個地方……直到我完成我的復仇…殺死_豺狼獵手_，就是它奪走了我的生命…\n\n它與其他豺狼人不同…它會隱藏自己並使用投擲武器… _小心它的毒鏢和火鏢，盡量靠近它…_
actors.mobs.npcs.ghost.gnoll_2=請幫助我……殺了那個詭詐的傢伙……\n\n_別讓它打到你……離它越近越好……_

actors.mobs.npcs.ghost.agnoll_2=冒險家，我不知道是不是我的靈魂在地牢的時間太久了，這裡最近十分冷清。我希望你能完成我未了結的心願……

actors.mobs.npcs.ghost.crab_1=你好，%s…曾經我像你一樣——既強大又自信…但我被一個古老的生物殺死了…我不能離開這個地方……直到我完成我的復仇…殺死_巨鉗螃蟹_，就是它奪走了我的生命…\n\n它經歷了無數歲月的洗禮…有一個巨大的蟹鉗和非常厚重的蟹殼…_小心它的蟹鉗，你必須偷襲這隻巨蟹否則它會用鉗子格擋你的攻擊..._
actors.mobs.npcs.ghost.crab_2=拜託幫助我……殺了那個甲殼類……\n\n_如果它發現你……就會擋住你所有的攻擊……_
actors.mobs.npcs.ghost.find_me=謝謝你……來找我吧……
actors.mobs.npcs.ghost.desc=這個幽靈幾乎不能被看見。它看起來像是由一片無形的昏暗光斑和一張悲痛的面孔所組成的。

actors.mobs.npcs.imp.name=野心勃勃的小惡魔
actors.mobs.npcs.imp.intro=你是個冒險家嗎？我愛冒險家！如果需要殺掉什麼東西的話，他們永遠都能把活幹好。我說的對嗎？當然是在有賞金的前提下。;)

actors.mobs.npcs.imp.cs_start_prompt=嘿，我說，你正在找一些強力裝備對吧？\n\n我這有個委託，只要你能擊敗那個委託人，就可以得到不少好用的裝備和物品。\n\n只要你願意，我就能為你開啟這個秘密通道。\n\n當然，接受委託後，在戒指的基礎上，還會給你2瓶治療藥水。
actors.mobs.npcs.imp.cs_yes=接受委託
actors.mobs.npcs.imp.cs_no=放棄委託
actors.mobs.npcs.imp.cs_a=野心勃勃的小惡魔：他在等著你……，從王都入口進入就能看見那曾經的議事廳！
actors.mobs.npcs.imp.cs_c=野心勃勃的小惡魔：切，那隨便你吧……

actors.mobs.npcs.imp.golems_1=你是個冒險家嗎？我愛冒險家！如果有什麼東西需要被解決的話，她們永遠都能把活幹好。我說的對嗎？當然是在有賞金的前提下；)\n總之，我需要你殺一些_魔像_。你看，我要在這裡開始搞點小本生意，但這些愚蠢的傀儡只會毀掉我的生意！跟這些發著光的大個子花崗岩根本沒辦法交流，真是該死！所以請，殺死……我想想，_4個魔像_，然後獎勵就是你的了。
actors.mobs.npcs.imp.monks_1=你是個冒險家嗎？我愛冒險家！如果有什麼東西需要被解決的話，她們永遠都能把活幹好。我說的對嗎？當然是在有賞金的前提下  ；)\n總之，我需要你殺一些_武僧_。你看，我要在這裡開始搞點小本生意，但這些瘋子不買任何東西還會嚇跑顧客。所以請，殺死……我想想，_5個武僧_，然後獎勵就是你的了。
actors.mobs.npcs.imp.golems_2=你的魔像狩獵做的怎麼樣了？
actors.mobs.npcs.imp.monks_2=喔，你還活著！我就知道你得功夫很好；) 只要別忘了拿來那些武僧的標記就好。
actors.mobs.npcs.imp.cya=我們會再見的，%s！
actors.mobs.npcs.imp.hey=喂喂喂，%s！
actors.mobs.npcs.imp.desc=小惡魔是一種低等惡魔。它們既沒有強大的力量也沒有魔法天賦，但它們相當聰明而且善於交際。許多小惡魔都喜歡生活在沒有其他惡魔存在的地方。
actors.mobs.npcs.imp.mustdown=小惡魔：你已接受委託，因此必須通過出口前往委託地點。
actors.mobs.npcs.imp.dxb=小惡魔：好的，看來你還想去看看他……，但是這次只有戰鬥哦……
actors.mobs.npcs.imp.must_go=注意：EX副本，挑戰層為29層後，此處不允許跳樓！默認返回入口處……
actors.mobs.npcs.imp.must_god=注意：此處為冥河深淵……, 請不要跳樓！
actors.mobs.npcs.impshopkeeper.name=野心勃勃的小惡魔
actors.mobs.npcs.impshopkeeper.greetings=你好，%s！
actors.mobs.npcs.impshopkeeper.thief=我以為我可以相信你！
actors.mobs.npcs.impshopkeeper.desc=小惡魔是一種低等惡魔。它們既沒有強大的力量也沒有魔法天賦，但它們相當聰明而且善於交際，因此許多小惡魔喜歡生活在沒有其他惡魔存在的地方。
actors.mobs.npcs.impshopkeeper.talk_ascent=%s你都做了些什麼？要做買賣就快點，我可不想在這裡久留！

actors.mobs.npcs.impshopkeeper.greetings_dwf=%s看來你已經和他見過了，索林，曾經矮人最強大的將軍！好的，按照之前所說，我的商店會有更加強大的物資供你使用！

actors.mobs.npcs.impshopkeeper.buyback=小惡魔很爽快的退還了相應的商品。
actors.mobs.npcs.shopkeeper.talk_ascent=%s，哦，我的老天，你的詛咒恐怕就連她也無法解開，我也不想被詛咒纏身，所以你在我這裡的價格會翻3倍。要做買賣就快點，我可不想在這裡久留！

actors.mobs.npcs.nxhy.talk_ascent=%s，你還好嗎？如果覺得物資不夠，可以來我這裡買一點的……
actors.mobs.npcs.nxhy.rankings_desc=百變之旅

actors.mobs.npcs.mirrorimage.name=鏡像
actors.mobs.npcs.mirrorimage.desc=這個幻象和你非常相似，甚至還裝備著你當前的武器和護甲。\n\n鏡像會獵尋敵人，並用它們的鏡像武器對其發動攻擊。鏡像武器的使用方式與特性和你手中的一樣，但造成的傷害會低些。鏡像出生的時候沒有實體，但攻擊後會顯形。\n\n鏡像有一定的攻擊能力，但非常脆弱，受到傷害就會瞬間消散。

actors.mobs.npcs.prismaticimage.name=虹色幻影
actors.mobs.npcs.prismaticimage.desc=這個閃爍著虹光幻象和你非常相似，甚至還裝備著你當前的武器和護甲。\n\n虹色幻影將透過吸引敵人的方式來利用它的護甲和生命保護你。雖然它沒有和鏡像一樣有攻擊性，但它有更高的生命值，以及和你一樣的護甲。\n\n當幻影生命降至0時，它將保持一段時間的存在，在此期間仍能被治癒。在周圍沒有敵方單位時，幻影便會回到主人身邊。

actors.mobs.npcs.ratking.name=老鼠王
actors.mobs.npcs.ratking.not_sleeping=我可不是在睡覺！
actors.mobs.npcs.ratking.what_is_it=你這是想幹什麼？我可沒時間管這些爛事。我的王國可不會自己運轉下去！
actors.mobs.npcs.ratking.confused=這……我這是在哪？我的王國需要我！
actors.mobs.npcs.ratking.crown_clothes=把衣服穿上！會見皇室的禮儀都不懂嗎！
actors.mobs.npcs.ratking.desc_winter=這隻老鼠比普通的齧齒小鼠大一點。它戴著一頂小小的節日帽，而不是常戴的皇冠。假日快樂！
actors.mobs.npcs.ratking.what=把這件衣服取下!皇室血脈的我發現這件衣服上面有未知的魔力，它與我的力量所排斥！你無法通過這件%1$s讓我與你交換。

actors.mobs.npcs.ratking.crown_desc=哇，那個皇冠是要給本王的嗎！？它看起來比我的皇冠更閃更亮，那我就好心好意地接受了！\n\n當然，我堂堂鼠王也不會白拿的。作為交換，本王能賜你一項配得上「英雄」之稱的強大能力！怎麼樣？要不要？
actors.mobs.npcs.ratking.crown_yes=當然了！
actors.mobs.npcs.ratking.crown_info=我願聞其詳。
actors.mobs.npcs.ratking.crown_no=還是算了……
actors.mobs.npcs.ratking.crown_thankyou=嘿嘿嘿嘿，多謝了！不要讓本王失望了，去宣揚我的威名吧！
actors.mobs.npcs.ratking.crown_fine=行吧！反正我也不怎麼想要那個閃閃發光的皇冠……
actors.mobs.npcs.ratking.crown_after=新衣服穿著合身嗎？誠信交易，概不退換！
actors.mobs.npcs.ratking.desc_festive=這隻老鼠比普通的齧齒小鼠大一點。它戴著一頂小的和節日很配的帽子，而不是它通常戴的皇冠。\n節日快樂！
actors.mobs.npcs.ratking.desc=這隻老鼠比普通的齧齒小鼠大一點。它戴著一頂小小的的皇冠。

actors.mobs.npcs.sheep.name=綿羊
actors.mobs.npcs.sheep.baa!=咩！
actors.mobs.npcs.sheep.baa?=咩？
actors.mobs.npcs.sheep.baa.=咩。
actors.mobs.npcs.sheep.baa...=咩……
actors.mobs.npcs.sheep.def_verb=格擋
actors.mobs.npcs.sheep.desc=這是一隻魔法綿羊。為什麼叫它魔法綿羊？因為你殺不死它。它只會站在那裡直到它消失，它會做的事情只有邊反芻邊對你翻白眼。

actors.mobs.npcs.shopkeeper.name=商人
actors.mobs.npcs.shopkeeper.arise=搶劫者,我詛咒你！你被商人詛咒了，你著火了！你暫時看不見了……
actors.mobs.npcs.shopkeeper.guards=來人，快來人！有人想在超市0元購！
actors.mobs.npcs.shopkeeper.greetings=你好啊%s.歡迎來到我的商店！我會為你的行程提供必要的補給。價錢公道，童叟無欺。
actors.mobs.npcs.shopkeeper.goodbye=歡迎下次再來！%s.
actors.mobs.npcs.shopkeeper.thief=不知天高地厚無知之輩，你會為你的行為付出代價！！！
actors.mobs.npcs.shopkeeper.sell=選擇一件要出售的物品
actors.mobs.npcs.shopkeeper.desc=這個矮胖的傢伙看起來更適合在某些大城市裡做買賣而不是這種地牢。這些商品的價格解釋了為什麼他會喜歡在這裡做生意。
actors.mobs.npcs.shopkeeper.zcz=商人喊來了制裁者！
actors.mobs.npcs.shopkeeper.eye=商人喊來了真眼者！
actors.mobs.npcs.shopkeeper.dead=商人為敵人們購買了精英系統，選好東西，迅速離開本層！！！
actors.mobs.npcs.shopkeeper.live=商人還為首領購買了精英系統，選好東西，迅速離開本層！！！
actors.mobs.npcs.shopkeeper.talk=交談
actors.mobs.npcs.shopkeeper.buyback=店主不情不願地退還了你的物品。
actors.mobs.npcs.shopkeeper.talk_prison_intro=我這有你成功冒險所需的一切東西！
actors.mobs.npcs.shopkeeper.talk_prison_warrior=你的那個紋章挺有意思的嘛，它們通常來講都是一整個的。難不成你是一位蒙受了恥辱的英雄，還是別的什麼人物？好啦，不管你做了些什麼，都與我無關。我只對你的金幣感興趣。
actors.mobs.npcs.shopkeeper.talk_prison_mage=嘻嘻，我想我在城裡的什麼地方有見過你的通緝令。在逃亡對吧？哦？你說你是無辜的，真的嗎？行行行...放輕鬆，比起檢舉你，我還有更值得做的事情。但也許你應該消費消費以確保這一點？
actors.mobs.npcs.shopkeeper.talk_prison_rogue=你是盜賊公會指派來清理這片區域的嗎？不是？只是來交易？好吧，雖然你確實在這殺了些怪物，但也別指望我會給你打折。我已經交足了保護費，而你們幾乎不能確保這裡的安全。
actors.mobs.npcs.shopkeeper.talk_prison_huntress=小姐，這似乎不是你該待的地方。狹窄的地牢走廊想來不如城鎮大廳或者市郊森林那樣寬敞，不是嗎？嘿嘿，哦，請別在意我這碎嘴巴，為什麼不買點東西呢？
actors.mobs.npcs.shopkeeper.talk_prison_duelist=哇偶，這不是闖蕩天下的大英雄嘛！如果你在嘗試著拯救又一個小鎮，那我只能說祝你好運了。畢竟這裡的危機可比土匪幫派什麼的糟糕多了。當然，我相信你會比任何人做得更棒，只是千萬別死在我的店門口。
actors.mobs.npcs.shopkeeper.talk_caves=花錢，你才能活得更久。\n\n哦，如果你看到那個巨魔鐵匠，代我向他問好。順便提醒這個笨蛋，他上週從我這買錘子的錢還沒結清呢！
actors.mobs.npcs.shopkeeper.talk_city=我的貨可以保你平安。\n\n…另外，勞煩您別在這瞎逛。我花了很長很長時間才讓這裡的怪物離我遠點，可不希望你把麻煩惹回來！
actors.mobs.npcs.shopkeeper.talk_halls=嘿，那邊那位！我為狩獵惡魔的人提供特別優惠！\n\n哦還有，在下面可要當心！底下的惡魔可不在乎你有多勇敢。而且如果你掛掉了，你就沒辦法回來花掉金幣啦！(>ω^)\n\n那些惡魔都和我一樣嗎？嘿嘿，並不。我只是一個小小跟班兒，算不上戰士，況且我還設法保全了心智呢。下面那些惡魔都比我猛得多，並且它們都遭到了...呃......的奴役，總之，你在下面當心點吧。

actors.mobs.npcs.wandmaker.name=老杖匠
actors.mobs.npcs.wandmaker.intro_warrior=啊，能在這片壓抑的地方遇見一位英雄可真是個驚喜！如果你願意幫助我這個老人家脫離苦海的話，你可以幫忙做一個任務。
actors.mobs.npcs.wandmaker.intro_rogue=天啊，你嚇了我一跳！在這裡這麼久你是我見過的第一個尚有理智的強盜，所以你肯定是從地表下來的！如果你願意幫助我這樣一名陌生人的話，這有一個任務或許你能幫上忙。
actors.mobs.npcs.wandmaker.intro_mage=哦，你好啊%s！我好像聽說你在法師學院那裡搞了不少麻煩？算了這沒關係，反正我也不喜歡那些墨守成規的榆木腦袋。如果你願意的話，我這有個任務可以讓你幫忙。
actors.mobs.npcs.wandmaker.intro_huntress=啊，你好啊姑娘！能在這下面見到一張友善的面孔真是太驚喜了，你說是吧？咦，說來，我敢打賭以前在哪見過你，但想不起具體……哦算了，不用在意，如果你是來這裡冒險的話，我這有個任務交給你做。
actors.mobs.npcs.wandmaker.intro_1=\n\n我在這裡是為了尋找一個製作法杖需要的稀有材料，但我迷了路，而且身上的魔法盾也在慢慢減弱。我必須馬上離開這裡，但我不想空手而出。
actors.mobs.npcs.wandmaker.intro_dust=我在尋找一些_屍骨灰燼_。這是一種通常出現在這種地方的被詛咒的特殊骨灰。它應該就在附近某個被隔住的房間裡，我很肯定你能在那裡找到一些灰燼。不過要小心，灰燼上的詛咒相當強大，_盡快將它帶回來_，我會淨化其中的詛咒。
actors.mobs.npcs.wandmaker.intro_ember=我在尋找能從新生火元素身上獲得的_元素餘燼_。元素生物通常出現在無人控制的召喚儀式上，因此要召喚它只需要去找到一些蠟燭和一個能舉行儀式的場地——我很確定你能找到這樣的地方。你可能會需要_一些冰凍物品_元素生物異常強大，但用冰的話就能輕易消滅它們。
actors.mobs.npcs.wandmaker.intro_berry=這個監獄的老典獄長養著一株_腐莓_，它的種子就是我一直要尋找的東西。經過如此長的時間這株植物很可能已經出現了變異，所以讓它放棄自己的種子可能會很棘手。它的花園應該就在這裡的某個地方。如果你想活著回來的話，試著_遠離那些觸手_。縱火燒死它聽起來很可行，但請別這麼做，這樣會殺死植被並毀壞其種子。
actors.mobs.npcs.wandmaker.intro_2=\n\n如果你願意幫我拿到它，我很願意將自己的一把精製法杖交給你！我帶了兩把過來，所以你可以選擇自己想要的法杖。
actors.mobs.npcs.wandmaker.reminder_dust=灰燼找到了嗎，%s？試著尋找一些_障礙物_。
actors.mobs.npcs.wandmaker.reminder_ember=餘燼找的怎麼樣了，%s？你需要找到_四根蠟燭_和一個_儀式場地_。
actors.mobs.npcs.wandmaker.reminder_berry=腐莓種子找的怎麼樣了，%s？它就在一個_充滿植被的房間_裡。
actors.mobs.npcs.wandmaker.def_verb=格擋
actors.mobs.npcs.wandmaker.desc=這位老先生的表情看起來十分困擾。他正在被一個力場盾牌保護著。



###mobs
actors.mobs.acidic.name=酸液蠍子
actors.mobs.acidic.desc=這些巨大的節肢類惡魔生物會盡可能避免一切近距離接觸，並且會在遠處射出能夠致殘的尖刺。它的身上甚至還滴落著腐蝕汙泥。

actors.mobs.albino.name=白化老鼠
actors.mobs.albino.desc=這是一種珍稀的齧齒小鼠，有著純白色的毛皮和鋸齒狀的牙齒。

actors.mobs.armoredstatue.name=裝甲石像
actors.mobs.armoredstatue.desc=你本以為這只是地牢裡又一尊靜佇的石像，但它泛著紅光的眼睛出賣了它。\n\n石像裝備著精良的護甲，看起來相當堅硬，估計會很難對付。
actors.mobs.armoredstatue.desc_arm_wep=雖然雕像本身是石製的，但它裝備著的_%1$s_和_%2$s_看起來是真傢伙。

actors.mobs.bandit.name=瘋狂強盜

actors.mobs.bat.name=吸血蝙蝠
actors.mobs.bat.desc=這些敏捷且堅韌的洞穴穹頂生物比看起來可怕地多。它們會透過每次成功的攻擊來恢復生命，從而擊敗比它們大得多的對手。

actors.mobs.bee.name=金色蜜蜂
actors.mobs.bee.desc_honey=儘管它們體積小，但金色蜜蜂對它們的家園有著強烈的保護欲。不過這一隻看起來十分平靜，而且還想要跟著你。
actors.mobs.bee.desc=儘管它們體積小，但金色蜜蜂有著強烈的保護家園的欲望。這隻蜜蜂非常瘋狂，最好和它保持距離。
actors.mobs.bee.angry =由於與它們家園的距離太近，你激怒了一隻蜜蜂！現在它不受電子菸的影響

actors.mobs.brute.name=豺狼暴徒
actors.mobs.brute.enraged=激怒
actors.mobs.brute.def_verb=格擋
actors.mobs.brute.desc=暴徒是豺狼人中體型最龐大，力量最強壯且生命力最頑強的精英。受到致命傷時，他們會陷入瘋狂之中，獲得暫時的護盾和極高的傷害加成。
actors.mobs.brute$bruterage.name=豺狼狂暴
actors.mobs.brute$bruterage.desc=這個豺狼暴徒的死亡已經不可避免，但它想拉你作為陪葬品！\n\n時間的推移或是外界的傷害都會消磨護盾。在護盾消散殆盡之際，暴徒會徹底消亡。然而，一定要小心，在這一階段暴徒會造成巨額傷害！\n\n剩餘的護盾：%d。

actors.mobs.causticslime.name=蝕化史萊姆
actors.mobs.causticslime.desc=這個史萊姆似乎已經被下方滲透的黑暗能量完全侵蝕了。它已經失去了體表原有的綠色光澤，並且在不斷滴落腐蝕汙泥。

actors.mobs.crab.name=叢林螃蟹
actors.mobs.crab.desc=這些巨型的螃蟹位居叢林食物鏈的頂端。它們行動極其迅速且其厚重的甲殼能承受沉重的打擊。

actors.mobs.crystalmimic.name=水晶寶箱怪
actors.mobs.crystalmimic.ate=水晶寶箱怪吃掉了你的%s！
actors.mobs.crystalmimic.escaped=水晶寶箱怪逃跑了！
actors.mobs.crystalmimic.desc=寶箱怪是一種能隨意改變外形的魔法生物。在地牢裡它們幾乎總會以寶箱形態出現，因為這樣更能吸引不防備的冒險者。\n\n水晶寶箱怪相比於它們的近親更為狡猾，會奪取財寶並盡量避免爭鬥。它們會在被發現後試圖迅速逃離，還能在攻擊時將敵人傳送到別處。
actors.mobs.crystalmimic.hidden_ankh=_你的十字架都被擬態之王放到了這裡面，在你與它的戰鬥結束後，你的十字架都會返還給你……_\n\n<#f00>不要試圖摧毀水晶寶箱！<RGB>
actors.mobs.demonspawner.name=惡魔血巢
actors.mobs.demonspawner.on_death=此處的惡魔能量似乎隨著血巢的毀滅而有所減弱。
actors.mobs.demonspawner.desc=這一團蠕動著的矮人血肉在利用慘死於這一區域的矮人源源不斷地製造惡魔撕裂者。看來惡魔們為了對付入侵者可以不擇手段。\n\n惡魔血巢雖然看起來非常恐怖，但它本身不具備移動或攻擊能力。不過它龐大的體積使得它難以被迅速殺死，而且它在受到威脅時會加速產出惡魔撕裂者。\n\n_惡魔血巢似乎都與某個提供惡魔能量的源頭相連。殺死它們或許能夠弱化那個源頭。_

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=閃電球將你徹底擊殺…
actors.mobs.dm100.desc=DM-100是一種矮人“防衛機械”的早期機型，用來保護下層礦洞中的矮人礦工。然而由於電擊威力不足，它們之後被送給上層的人類監獄。典獄長起初認為DM-100太過殘忍而沒有啟用，但隨著時間推移，囚犯變得越來越難以控制，這使得DM-100成為了監獄的必備品。

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200噴射了一團有毒的廢氣！
actors.mobs.dm200.desc=DM-200是矮人研發的第二代城防器械，最初用來保護礦洞中的矮人礦工與下方的城市。比起第一代它們相當龐大笨重，並利用強力的液壓錘碾壓入侵者。\n\n臃腫的體型是它們的一大缺陷——它們無法進入狹窄的門與過道。為了彌補靈活性的缺陷，矮人設計了另一種功能：DM-200能向遠處的或是它們無法觸及的敵人噴射有毒的廢氣。

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 投出了一枚腐蝕榴彈！
actors.mobs.dm201.desc=矮人曾做過一些圍繞 DM-200 的機動性缺陷展開的實驗，並據此設計製造了一批完全固定的 DM 系列機器。DM-201 是經過改裝的 DM-200，其作為哨戒炮塔完全沒有移動能力。作為交換，DM-201 們的堅固程度與攻擊能力都得到了顯著的提升。\n\n由於 DM-201 們並沒有引擎來排放廢氣，矮人給它們裝備了腐蝕氣體榴彈！不過，DM-201 對榴彈的使用很謹慎，只有在受到來自遠處的攻擊時才會向敵人投擲榴彈。

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=偵 測 到 未 授 權 單 位 ！
actors.mobs.dm300.shield=DM-300從外露的管線中抽取能量，用護罩裹住自身！
actors.mobs.dm300.vent=DM-300從噴氣裝置中噴出了劇毒的廢氣！
actors.mobs.dm300.rocks=DM-300重砸地面，使洞窟穹頂的岩石鬆脫了！
actors.mobs.dm300.charging=受 到 傷 害 ！正 在 啟 動 能 量 塔 ！
actors.mobs.dm300.charging_hint=DM-300 在接受能量塔供電時無法受到傷害！
actors.mobs.dm300.supercharged=毀 滅 ！毀 滅 ！毀 滅 ！
actors.mobs.dm300.charge_lost=能 量 塔 損 壞 ！切 換 至 本 地 供 能 模 式 ！
actors.mobs.dm300.pylons_destroyed=警 告 ！檢 測 到 電 網 故 障 ！
actors.mobs.dm300.rankings_desc=被DM-300碾壓致死
actors.mobs.dm300.def_verb=格擋
actors.mobs.dm300.defeated=受 到 嚴 重 損 傷 ！正 在 嘗 試 關-
actors.mobs.dm300.desc=DM-300是矮人有史以來發明的最強大的“防禦機器”。這樣一台令人生畏的機器是極難製造的，所以矮人們僅僅造出了幾台來守護她們地下大都會的入口。\n\n它配備了可以噴出劇毒廢氣的通風口和一個可以用來攻擊和破壞地表的高功率鑽頭。DM-300還可以連接到能源電網，進一步增強它的力量。
actors.mobs.dm300.desc_supercharged=DM-300已被完全充能。現在，DM-300能免疫外界的傷害，並以兩倍速度移動！而且，它的電鑽功率現在足以_鑽透牆壁_，不過這會大幅降低它的移動速度。\n\n直接攻擊充能狀態下的DM-300毫無意義，不過這附近一定有為它_提供能量的裝置_，摧毀了的話也許能削弱它。
actors.mobs.dm300$fallingrocks.desc=鬆動的岩塊正從層頂滾滾而下，似乎要塌方了！

actors.mobs.dwarfking.name=矮人國王
actors.mobs.dwarfking.notice=汝竟敢進犯王家重地！不知天高地厚！
actors.mobs.dwarfking.lifelink_1=獻身護駕，奴隸們！
actors.mobs.dwarfking.lifelink_2=為了朕的大業，光榮犧牲吧！
actors.mobs.dwarfking.teleport_1=汝等，速速拿下此人！
actors.mobs.dwarfking.teleport_2=汝等，拖住此人！
actors.mobs.dwarfking.wave_1=夠了！為朕復生而戰吧，汝等奴虜！
actors.mobs.dwarfking.wave_2=繼續上！為了朕的江山而戰！
actors.mobs.dwarfking.wave_3=廢物！朕命你們立刻殺死此人！
actors.mobs.dwarfking.enraged=汝殺不掉朕，%s。朕・即・不・朽！
actors.mobs.dwarfking.losing=不！汝不得如此...汝不知曉朕的王國之下埋藏著什麼...
actors.mobs.dwarfking.defeated=一無所知的蠢貨...汝會毀了一切的...
actors.mobs.dwarfking.rankings_desc=屈服在矮人國王御前
actors.mobs.dwarfking.desc=許多年前，矮人議會中一名最強的巫師洞察了凌駕於生死之上的秘術。很快他就借助這種強大的力量，控制、腐化了王室與整個議會，並將魔爪伸向王國中的每一名矮人。現在他成為了矮人國的國王，統領著數量龐大的死靈。\n\n矮人國王是極具進攻性的強敵，會嘗試利用他手下的死靈大軍壓制入侵者。
actors.mobs.dwarfking$dkghoul.rankings_desc=屈服在矮人國王御前
actors.mobs.dwarfking$dkmonk.rankings_desc=屈服在矮人國王御前
actors.mobs.dwarfking$dkwarlock.rankings_desc=屈服在矮人國王御前

actors.mobs.elemental$fireelemental.name=火元素
actors.mobs.elemental$fireelemental.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏最基礎的智力，它們通常與一種特定的魔法密切相關。\n\n火元素是一種常見的借助火焰之力攻擊的元素生物。在近戰時它能使得目標燃起大火，對付遠處的敵人也能偶爾向目標發射火球。
actors.mobs.elemental$newbornfireelemental.name=新生火元素
actors.mobs.elemental$newbornfireelemental.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏最基礎的智力，它們通常與一種特定的魔法密切相關。\n\n火元素是一種常見的借助火焰之力攻擊的元素生物。在近戰時它能使得目標燃起大火，對付遠處的敵人也能偶爾向目標發射火球。\n\n這隻火元素剛剛被召喚出來，因此它還很弱。這種狀態下它幾乎無法承受任何形式的寒冷傷害。但其攻擊能力仍舊很強，小心為好。
actors.mobs.elemental$newbornfireelemental.desc_boss=由於其召喚的混亂本質，這個元素在充能 1 回合後只能以不精準的方式釋放炎浪。

actors.mobs.elemental$frostelemental.name=冰霜元素
actors.mobs.elemental$frostelemental.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏最基礎的智力，它們通常與一種特定的魔法密切相關。\n\n冰霜元素是一種常見的借助冰霜之力弱化敵人的元素生物。它們近戰會使敵人陷入凍傷，也能偶爾遠程攻擊，在水面上冰霜之力的效果會顯著加強。
actors.mobs.elemental$shockelemental.name=電擊元素
actors.mobs.elemental$shockelemental.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏最基礎的智力，它們通常與一種特定的魔法密切相關。\n\n電擊元素是一種利用電擊與閃光攻擊敵人，較為少見的元素生物。近戰時它會向周遭敵人釋放電弧，若主要攻擊目標在水中將遭受額外傷害。對付遠處的敵人時它們會偶爾釋放致盲的強烈閃光。
actors.mobs.elemental$chaoselemental.name=混沌元素
actors.mobs.elemental$chaoselemental.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏最基礎的智力，它們通常與一種特定的魔法密切相關。\n\n混沌元素是一種極其稀有的元素生物。它們不僅僅局限於一種特定的魔法，而是借助隨機的魔法進行強力的攻擊。
actors.mobs.elemental$halowar.name=磷焰元素
actors.mobs.elemental$halowar.desc=元素生物是一種由於施放強大魔法時的失誤產生的混沌生物。元素生物缺乏最基礎的智力，它們通常與一種特定的魔法密切相關。\n\n磷焰元素是一種利用磷火之力攻擊敵人，極為少見的元素生物。近戰時它會向敵人附著磷火燃燒，對付遠處的敵人也能偶爾向目標發射磷火火球。

actors.mobs.eye.name=邪惡之眼
actors.mobs.eye.deathgaze_kill=死亡凝視奪取了你的生命…
actors.mobs.eye.desc=邪眼是一種將惡魔能量壓抑在自己體內的漂浮球形生物。它們擁有近戰能力，但其真正的力量蘊藏在它們的魔法之中。\n\n在短暫的蓄能過後邪眼將會釋放一種名為_死亡凝視_的毀滅性能量射線。任何受到邪眼的這種凝視的生物都會受到極大的傷害，明智的冒險者都會及時尋求掩護。

actors.mobs.fetidrat.name=腐臭老鼠
actors.mobs.fetidrat.desc=這隻老鼠很不對勁。它油膩的黑毛和腐爛的皮膚與你之前見過的健康老鼠很不同。淺綠色的眼睛讓它顯得更具威脅。\n\n這隻老鼠周圍盤繞著一片可怕惡臭，靠近時臭氣尤為濃烈。\n\n黑色的淤泥從它的嘴中流出。淤泥腐蝕掉了地磚，但遇水似乎就會溶解。

actors.mobs.ghoul.name=矮人屍群
actors.mobs.ghoul.desc=在矮人王國逐漸衰亡，現在的矮人國王掌握了絕對的權力時，一些較為弱小的或是反抗國王的矮人受到了不公的待遇。然而隨著矮人國王逐漸精通黑暗魔法，這些矮人逐漸屈從於其意志，並最終淪為了其大軍中的一枚棋子。\n\n矮人屍群中的個體本身沒有強大的戰鬥力，但它們總是結伴作戰，試圖利用數量優勢擊敗強大的對手。_一名矮人屍群成員被擊倒時，如果周圍仍有其他同類，它將會在幾回合後重生_。

actors.mobs.gnoll.name=豺狼巡查
actors.mobs.gnoll.desc=豺狼是鬣狗狀的類人生物。它們在叢林和地牢裡遊蕩，不時向上行動試圖向地表發起進攻。豺狼巡查是它們種群裡最普通的一員，它們既沒有豺狼暴徒強壯，也趕不上薩滿聰明。

actors.mobs.gnollgeomancer.name=豺狼地卜師
actors.mobs.gnollgeomancer.warning=地卜師的身形開始顫動，請確保你已準備萬全！
actors.mobs.gnollgeomancer.alert=地卜師雙目暴睜，拔地而出！其狂笑之聲懸繞整個礦層，似是這一方天地的土石結構都要為之改變！
actors.mobs.gnollgeomancer.rock_kill=你被飛來的巨岩砸作一團漿糊...
actors.mobs.gnollgeomancer.rockfall_kill=你死於落下的巨石......
actors.mobs.gnollgeomancer.desc=這豺狼人雖老態難掩卻身形魁梧，定是此處賊首，亦為此地土石不穩之源。不似其他豺狼探金者，這地卜師精於土石術法，飛石落岩不可傷之。不過觀其體態，似是疏於肉搏之技。
actors.mobs.gnollgeomancer.desc_armor=地卜師周身皆為金石所化之甲。_若想傷它，須攜礦鎬近身，碎其金石。_
actors.mobs.gnollgeomancer.desc_armor_sapper=_一旁的豺狼探金者正握持著一個看起來能穩固地卜師金石之甲的機巧之物，致使你無法破開地卜師之甲！_
actors.mobs.gnollgeomancer.desc_sleeping=這隻身形魁梧的豺狼人周身環繞著一層金石，靜若塑像。然細看之下這些金石卻是隨其吐納遊走周身，如此金身似是無懈可擊。觀其入定之態，似是要歸於塵土一般。\n\n手中礦鎬或可破其周身金石，然_此戰須得做好充足準備_。地卜師定是此處豺狼人之賊首，且為此地土石不穩之源。_分而化之，將其羽翼各個擊破或為上策。_

actors.mobs.gnollguard.name=豺狼守衛
actors.mobs.gnollguard.spear_warn=豺狼人用矛尖打出兇狠的一擊！
actors.mobs.gnollguard.desc=這個高大健壯的豺狼人操使著長矛和盾牌，但沒有戴頭盔。這些守衛似乎在為晉升成暴徒而訓練，並為保護礦洞不受野獸侵擾在此執勤。而且由於冰雪溶洞過於寒冷，它們的長矛有機率凍傷敵人。\n\n豺狼守衛身強力壯，單手就能揮舞長矛，不過使得不算太好。_它需要相當開闊的施展空間才能進行長距離攻擊。一旦被人欺身而上，長矛施展不開便會威力大減。_
actors.mobs.gnollguard.desc_armor=_附近的豺狼探金者正持用裝置以賦予這個守衛大地護甲，大幅減少它受到的傷害。_

actors.mobs.gnollsapper.name=豺狼探金者
actors.mobs.gnollsapper.desc=這個豺狼人矮小虛弱但機智。它長有淺色皮毛，攜帶著裝滿各種小工具的挎包。它們似乎在此協助勘探和開採暗金礦，並配有豺狼守衛貼身保護。它們雖然能夠近戰，但是攻擊力弱得可憐，不比豺狼巡查強。\n\n相比於直接搏鬥，豺狼探金者更喜歡用它們攜帶的各類裝置操縱周遭岩石來攻擊。它們只是靠工具之力拋擲岩石，而不掌握有移岩魔法。_應該有很多方式可以利用它們的攻擊來反擊它們和其餘的守衛。_

actors.mobs.gnolltrickster.name=豺狼詭術師
actors.mobs.gnolltrickster.desc=即使以豺狼人的標準來看，這個生物也非常的詭異。它佝僂著腰，鬼鬼祟祟地行進著，大嘴咧開，露出邪惡的笑容，肩上掛著的挎包鼓得同搖籃一般。它的瞳孔中混雜著恐懼與興奮。\n\n它的挎包裡有一大批粗製濫造的飛鏢，它們似乎包含著各種有害物質。



actors.mobs.goldenmimic.name=金色寶箱怪
actors.mobs.goldenmimic.desc=寶箱怪是一種能隨意改變外形的魔法生物。在地牢裡它們幾乎一直以寶箱形態出現，因為這樣總能吸引不防備的冒險者。\n\n金色寶箱怪是試圖吸引頂尖冒險者的強大寶箱怪。它們擁有更豐厚的財寶，但相對通常的寶箱怪也更為強大。



actors.mobs.golem.name=魔像
actors.mobs.golem.def_verb=格擋
actors.mobs.golem.desc=魔像是矮人們試圖利用魔法的新應用彌補機械設備長久以來的缺陷的產物。它們雖不似DM-300那樣龐大笨重，但仍具有不可小覷的破壞力。\n\n魔像因體型過大無法進入過道，但矮人們賦予了魔像魔力來彌補這一點——魔像能在各個房間之間傳送，並能將無法觸及的敵人從遠處拉回來。

actors.mobs.goo.name=粘咕
actors.mobs.goo.notice=咕-咕！
actors.mobs.goo.defeated=咕……咕……


actors.mobs.goo.reason=冒險者，我們又見面了。\n\n看起來由於變幻莫測的力量，這裡多了一層。\n\n你感覺從下方你傳來一股惡意的魔力，如果前去挑戰則無法回頭，確保你已經準備好了。之後告訴我！！！
actors.mobs.goo.enter_yes=我準備好了
actors.mobs.goo.enter_no=還沒有
actors.mobs.goo.cant_enter_1=你還沒有擊敗黑暗中的陰影，暫時不能離開這裡。
actors.mobs.goo.cant_enter_a=通往迷你區域的道路已經因為通道垮塌而被堵死了……
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=粘咕正在不斷地抽動！
actors.mobs.goo.enraged=激怒
actors.mobs.goo.gluuurp=咕——————！
actors.mobs.goo.rankings_desc=被粘咕消化
actors.mobs.goo.desc=我們對粘咕所知甚少。它甚至很有可能不是一個生物，而是叢林表面聚集的邪惡物質得到基本智慧而產生的實體。不管怎樣，很明顯是黑暗魔法造就了這個生物。\n\n其凝膠性質讓它吸收了很多黑暗能量，你光是靠近就感受到了一股寒意。如果粘咕使用這種能量對你進行攻擊那你肯定支撐不了多久。

actors.mobs.goo.exit_warn_none=你已經擊敗了地牢深處的黑暗了嗎？如果是這樣，你可以離開了!
actors.mobs.goo.exit_yes=我做完了
actors.mobs.goo.exit_no=還沒有

actors.mobs.spical.goomob.name=粘咕
actors.mobs.spical.goomob.desc=我們對粘咕所知甚少。它甚至很有可能不是一個生物，而是叢林表面聚集的邪惡物質得到基本智慧而產生的實體。不管怎樣，很明顯是黑暗魔法造就了這個生物。\n\n其凝膠性質讓它吸收了很多黑暗能量，你光是靠近就感受到了一股寒意。如果粘咕使用這種能量對你進行攻擊那你肯定支撐不了多久。
actors.mobs.spical.goomob.notice=給我過來!曾經的敵人!

actors.mobs.greatcrab.name=巨大螃蟹
actors.mobs.greatcrab.noticed=巨型螃蟹用它碩大的鉗子格擋了這次攻擊。
actors.mobs.greatcrab.def_verb=格擋
actors.mobs.greatcrab.desc=這隻螃蟹的塊頭相當大，甚至超過了其他的叢林螃蟹。它的赤色甲殼上布滿了裂紋和藤壺，足以證明其經歷的無數歲月。它爬行緩慢，那隻巨大的鉗子讓它難以保持平衡。\n\n儘管這螃蟹只剩下一邊的鉗子，但鉗子的個頭完全彌補了這點不足。螃蟹只要發現危險就會把爪子舉在身前，利用堅不可摧的甲殼進行防禦。不過螃蟹無法格擋未察覺的攻擊，也無法同時格擋多個敵人的進攻。

actors.mobs.guard.name=監獄守衛
actors.mobs.guard.scorpion=給我過來！
actors.mobs.guard.def_verb=格擋
actors.mobs.guard.desc=作為曾經監獄的管理者，這些守衛和那些罪犯已經沒什麼區別了。它們蹣跚的步伐如同僵屍一般，毫無思緒地四處尋找不屬於這片區域的生物，比如你！\n\n它的鐵鏈纏在自己的胯部，也許可以用來將敵人拉扯到非常近的距離。

actors.mobs.king.name=矮人國王
actors.mobs.king.notice=大膽！
actors.mobs.king.defeated=你殺不死我，%s…我是…不朽的…
actors.mobs.king.def_verb=格擋
actors.mobs.king.arise=以我之名，復甦吧！奴隸們！
actors.mobs.king.rankings_desc=屈服在矮人國王御前
actors.mobs.king.desc=這名最後的矮人國王以對死靈術式的透徹理解而聞名。他成功說服王國議會的全體成員參加了一場本應讓所有參與者獲得永生的祭祀儀式。最終成功的只有國王自己——如果不算上他身邊那支化為枯骨的死靈大軍的話。
actors.mobs.king$undead.name=矮人亡靈
actors.mobs.king$undead.def_verb=格擋
actors.mobs.king$undead.rankings_desc=屈服在矮人國王御前
actors.mobs.king$undead.desc=由矮人國王的意志喚醒的矮人亡靈，曾經的王國議會成員。除了長著厚實的鬍鬚以外，和正常的骷髏外觀上並沒有區別。

actors.mobs.mimic.name=寶箱怪
actors.mobs.mimic.reveal=這是一個寶箱怪！
actors.mobs.mimic.hidden_hint=這個寶箱看起來有些不對勁……上前直接打開似乎不太合適。
actors.mobs.mimic.desc=寶箱怪是一種能隨意改變外形的生物。在地牢裡它們幾乎一直以寶箱形態出現，因為這樣總能吸引不防備的冒險者。\n\n寶箱怪具有較強的攻擊力，但也擁有比普通箱子更多的財寶。

actors.mobs.necromancer.name=死靈法師
actors.mobs.necromancer.desc=這些黑暗魔法的學徒大量湧入監獄，因為這裡是它們磨練死靈法術的最佳地點。\n\n死靈法師伊洛通過召喚並加強骷髏作戰。死靈法師被擊殺後，其召喚的骷髏也會消散。
actors.mobs.necromancer$necroskeleton.name=死靈法師的骷髏
actors.mobs.necromancer$necroskeleton.desc=這個骷髏是被死靈法師召喚出來的。它的能力與習性和普通的骷髏一樣，只是會在召喚者被擊殺時跟著消逝。

actors.mobs.mob.died=你依稀聽到遠處有什麼東西死掉了。
actors.mobs.mob.rage=#$%^
actors.mobs.mob.exp=%+d經驗值
actors.mobs.mob.rankings_desc=死於：%s
actors.mobs.mob.stupid=這個%s看起來有點[憨憨[
actors.mobs.mob.smart=這個%s看起來_非常聰明_

actors.mobs.monk.name=矮人武僧
actors.mobs.monk.def_verb=格擋
actors.mobs.monk.parried=招架
actors.mobs.monk.desc=這些僧侶皆是狂熱的信徒，傾其所能從一切異族手中保護國王的安全。狂熱的信仰使得他們將自己的意志交給了國王，只剩下沒有思想的軀殼在城市中遊蕩。\n\n矮人武僧既不披甲亦不執械，僅僅依靠自己的徒手格鬥技巧退敵。精神集中的武僧會必定格擋住一次進攻，哪怕是必中的攻擊。武僧在移動時會更快地集中精神，在戰鬥中就相對慢些。
actors.mobs.monk$focus.name=精神集中
actors.mobs.monk$focus.desc=這個武僧已經完全集中於目標的一舉一動，似乎能預料到目標的下一步動作。\n\n精神集中的武僧一定會格擋下一次物理攻擊。格擋會分散武僧的注意力，使得他們需要一段時間重新集中精力來成功格擋攻擊。在移動時武僧恢復地相對更快。

actors.mobs.piranha.name=巨型食人魚
actors.mobs.piranha.desc=這些肉食性魚類不是地下水池中的天然生物。它們被專門培育用來保護被水淹沒的儲藏室。

actors.mobs.pylon.name=能量塔
actors.mobs.pylon.desc_inactive=這是一座用於分配區域內機械用電的能量塔。\n\n這座能量塔未被啟用，目前無法受到任何傷害。
actors.mobs.pylon.desc_active=這是一座用於分配區域內機械用電的能量塔。此刻能量塔電能湧動，定是它正在為DM-300充能！\n\n這時的能量塔可被摧毀，卻會順時針向四周釋放電弧。厚重的金屬結構為其提供了強勁的防禦。

actors.mobs.rat.name=齧齒小鼠
actors.mobs.rat.404=？？？
actors.mobs.rat.405=空指針
actors.mobs.rat.406=錕斤拷
actors.mobs.rat.407=�������
actors.mobs.rat.408=502壞的閘道器

actors.mobs.rat.desc=雖說齧齒小鼠們具有攻擊性，可它們依舊是叢林居民裡的弱者。它們的嚙咬非常煩人，但只有數量巨大時才會有生命威脅。

actors.mobs.ripperdemon.name=惡魔撕裂者
actors.mobs.ripperdemon.leap=惡魔撕裂者正準備撲殺！
actors.mobs.ripperdemon.desc=這種恐怖的生物是惡魔利用這裡殘留的眾多矮人屍骸而組成的。惡魔撕裂者外觀類似蒼白瘦弱的矮人，具有殘缺不全的軀幹與尖利修長的骨爪。\n\n惡魔撕裂者難以承受沉重的打擊，但它們行動迅捷並十分危險。它們能夠瞬間撲過極遠的距離，再用自己的骨爪刺穿目標。

actors.mobs.rotheart.name=腐爛之心
actors.mobs.rotheart.desc=腐莓的果實很獨特。一般植物的果實會逐漸腐爛並給種子提供養分，但這種果實會生長，變硬，並把種子牢牢包裹在內。它為果實里生長的內部器官提供保護。這種巨大的球狀物被視為成年的腐莓植物的心臟部分。

actors.mobs.rotlasher.name=腐爛觸手
actors.mobs.rotlasher.desc=腐爛觸手是成熟腐莓根系的一部分，也是其主要自衛手段。觸手固扎土中不能移動，卻會猛烈攻擊任何靠近的威脅。當附近沒有敵人，它們矗立不動，試圖將自己融入周遭植被中。
actors.mobs.rotlasher$waiting.status=這個%s正在閒置。

actors.mobs.scorpio.name=巨型蠍子
actors.mobs.scorpio.desc=這些巨大的節肢類惡魔生物會盡可能避免一切近距離接觸，並且會在遠處射出能夠致殘的尖刺。

actors.mobs.senior.name=武僧大師
actors.mobs.senior.desc=這些僧侶皆是狂熱的信徒，傾其所能從一切異族手中保護國王的安全。狂熱的信仰使得他們將自己的意志交給了國王，只剩下沒有思想的軀殼在城市中遊蕩。\n\n這隻武僧掌握了精深的格鬥技巧，相較於普通的武僧，他能在移動時更迅速恢復集中。精神集中的武僧會必定格擋住一次進攻，哪怕是必中的攻擊。武僧在移動時會更快地集中精神，在戰鬥中就相對慢些。

actors.mobs.shaman.name=豺狼薩滿
actors.mobs.shaman.bolt_kill=魔力的衝擊粉碎了你...
actors.mobs.shaman.desc=那些最具有智慧的豺狼可以掌握薩滿魔法，豺狼薩滿由於缺少力量所以更喜歡使用戰鬥法術。它們在部落中享有很高的地位，即使它們的身形相對薄弱。
actors.mobs.shaman$redshaman.spell_desc=佩戴紅色面具的薩滿會利用魔法_削弱你的進攻能力。_
actors.mobs.shaman$blueshaman.spell_desc=佩戴藍色面具的薩滿會利用魔法_增加你受到的傷害_。
actors.mobs.shaman$purpleshaman.spell_desc=佩戴紫色面具的薩滿會利用魔法_削減你的精準與閃避_。

actors.mobs.armoredbrute.name=重甲暴徒
actors.mobs.armoredbrute.desc=這些頂級的豺狼暴徒通常裝備著強力的護甲來體現它們的地位。它們的護甲使得它們對物理傷害有著更高的防禦，它們堅強的意志允許它們在彌留之際堅持更長的時間。

actors.mobs.skeleton.name=骷髏
actors.mobs.skeleton.explo_kill=你被骨頭的爆炸殺掉了……
actors.mobs.skeleton.def_verb=格擋
actors.mobs.skeleton.desc=骷髏是從那些悲慘的冒險者及地牢原住民屍骨的聚合物產生的，來自下層地牢的邪惡力量將它們從死亡中喚起。在吸收了足夠的傷害之後，它們就會在骨頭的爆炸中消解。

actors.mobs.slime.name=史萊姆
actors.mobs.slime.def_verb=格擋
actors.mobs.slime.desc=史萊姆是一種具有膠質外形與液態內核的奇特魔法生物。城市的叢林為它們提供了充分的水源和富足的養分。\n\n史萊姆的外層膠膜具有極強的彈性，這使得任何單次攻擊都難以對它們造成超過_6點的傷害_。

actors.mobs.snake.name=叢林巨蛇
actors.mobs.snake.hint=試試點擊檢查按鈕再選擇蛇，以了解如何擊敗它們。
actors.mobs.snake.desc=這些體型龐大的蛇能通過快速滑行以閃避普通的攻擊，讓它們難以命中。不過伏擊與魔法攻擊會使它們措手不及。\n\n在這條蛇的視野外攻擊它時可以觸發伏擊。當這條蛇在追擊你時，可以嘗試躲入一扇門後，再_在蛇進門的瞬間發動攻擊_。

actors.mobs.spectralnecromancer.name=招魂法師
actors.mobs.spectralnecromancer.desc=死靈法師們通常對召喚骷髏欲罷不能，但其中某些個體卻偏愛使喚更為縹緲無形的造物。招魂法師們便選擇了怨靈作為他們的爪牙！\n\n怨靈的個體戰鬥力或許不如骷髏，但這幫招魂法師無論一次性召喚出多少手下都不會嫌多！

actors.mobs.spinner.name=礦洞蜘蛛
actors.mobs.spinner.desc=綠色而多毛的洞穴蜘蛛們會試著去躲避直接的戰鬥，它們更喜歡在遠處等待其獵物捲入蜘網，在劇毒中慢慢死去。它們也能向遠處噴吐蛛網，阻擋敵人的行動路線。

actors.mobs.statue.name=活化石像
actors.mobs.statue.def_verb=格擋
actors.mobs.statue.desc=你本以為這只是地牢裡又一尊靜佇的石像，但它泛著紅光的眼睛出賣了它。
actors.mobs.statue.desc_weapon=雖然雕像本身是石製的，但它裝備著的_%s_看起來是真傢伙。

actors.mobs.succubus.name=魅魔
actors.mobs.succubus.desc=魅魔是一種善於操縱敵人的精神的變形惡魔。這一隻化為了哥德風的蒼白人形，或許是為了吸引矮人術士？\n\n在攻擊時，魅魔能夠暫時魅惑目標，使其無法直接攻擊魅魔本身。魅魔在攻擊被魅惑的目標時能吸取其生命精華。

actors.mobs.swarm.name=蠅群
actors.mobs.swarm.desc=致命的飛蠅群憤怒地發出嗡嗡聲。每次非魔法攻擊都會把它分割成兩群更小但同樣危險的飛蠅群。

actors.mobs.tengu.name=天狗
actors.mobs.tengu.notice_gotcha=抓到你了，%s！
actors.mobs.tengu.interesting=是時候讓這場戰鬥變得更有意思了…
actors.mobs.tengu.notice_have=你的命歸我了，%s！
actors.mobs.tengu.defeated=終於...我解脫了...
actors.mobs.tengu.rankings_desc=被天狗暗殺
actors.mobs.tengu.desc=一位著名的神秘皇家刺客，其名源於她臉上面具的蝕刻。\n\n天狗的手腕和膝下都帶著鐐銬，但她似乎很久以前就擺脫掉了鎖鏈的束縛。\n\n她將利用陷阱、欺騙性的魔法、精準致命的攻擊，來消滅唯一能阻止她逃脫的人：你。

actors.mobs.tengu.cut_you=天狗突然出現在你面前！
actors.mobs.tengu.cut_you2=%s,我已經在此等候多時了！接招！
actors.mobs.tengu.rose=突然間，一張玫瑰結界在你面前展開.......
actors.mobs.tengu.ready=好，%s，你的反應力不錯，那麼，讓我來見識見識你的利爪！

actors.mobs.tengu.end_message1=不錯的戰鬥，%s！不過，在這監獄下面還有更加可怖的存在。
actors.mobs.tengu.end_message2=希望你還能繼續保持擊敗我那樣的神態自若。
actors.mobs.tengu.end_message3=我已經解脫了，但這不代表終點。死亡只是另一種形式，冒險者，祝你接下來的旅程順利。後會有期！

actors.mobs.tengu$bombability$bombblob.desc=這裡翻滾著一片過熱的煙塵。當心，要爆炸了！
actors.mobs.tengu$bombability$bombitem.name=煙塵炸彈
actors.mobs.tengu$bombability$bombitem.cant_pickup=它固定在地面上，你無法搬動它！
actors.mobs.tengu$bombability$bombitem.desc=天狗往這裡扔了一個奇形怪狀的，不斷鼓出滾燙濃煙的炸彈。它在滴答作響，似乎是爆炸的倒數計時！\n\n炸彈嵌入了地面，你無法拾取它。

actors.mobs.tengu$fireability$fireblob.desc=天狗往這裡灑了一把開始冒起魔法火焰的細膩粉末，要燒起來了！

actors.mobs.tengu$shockerability$shockerblob.desc=這裡正積蓄著電能，站在這裡的任何單位都會在下回合受到電擊！
actors.mobs.tengu$shockerability$shockeritem.name=電擊裝置
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=它放出電能太強了，你無法觸碰它！
actors.mobs.tengu$shockerability$shockeritem.desc=天狗往這裡扔了一個奇怪的裝置，好像是用DM-100的零件拼湊出來的。裝置在持續地向周圍放出電弧，但是範圍好像有規律可循。\n\n有這麼密集的高壓電弧環繞著，你無從下手去拾取它。

actors.mobs.thief.name=瘋狂小偷
actors.mobs.thief.stole=小偷偷走了你的%s！
actors.mobs.thief.carries=\n\n這個小偷攜帶著一個_%s_。明顯是偷來的。
actors.mobs.thief.escapes=小偷帶著你的%s逃走了！
actors.mobs.thief.desc=這些囚犯逃出了他們的牢房，卻沒能逃出這座監牢。隨著時間流逝，這座監牢徹底摧毀了他們僅存的心智，以及對自由的嚮往。這些瘋狂的小偷和強盜很久以前就已經徹底忘記它們是誰，以及它們為何偷竊。\n\n這些敵人比起面對面地戰鬥，更傾向於偷走你的財物隨後逃之夭夭。一定要看緊它們，否則你以後可能再也不會見到自己的被盜財物了。

actors.mobs.warlock.name=矮人術士
actors.mobs.warlock.bolt_kill=暗影能量使你的生命衰竭了……
actors.mobs.warlock.desc=當矮人的興趣從工程建設轉向奧秘學術時，術士們開始在城市中掌權。它們從元素魔法起步，但很快就開始研究惡魔學和死靈術。最強大的術士掌握了矮人王國的王權，其他術士如果想繼續練習黑暗魔法，就必須放棄精神的自由，將意志交給他控制。\n\n這些術士擁有具有強大的干擾性魔法，能暫時抑制裝備的升級魔力。裝備的等級越高，受降級魔法的影響就越嚴重。

actors.mobs.wraith.name=怨靈
actors.mobs.wraith.desc=怨靈是來自於墓穴中渴望復仇的罪人之魂。作為飄渺的非實體很難被正常武器擊中。

actors.mobs.yog.name=Yog-Dzewa
actors.mobs.yog.notice=希望已死，汝之存在亦將化為虛無…
actors.mobs.yog.defeated=…
actors.mobs.yog.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yog.desc=Yog-Dzewa是一位上古之神，來自混沌位面的強大存在。一個世紀前，古代矮人在同惡魔大軍的戰爭中慘勝，卻無法殺死這名神祇。他們只得將這名存在封印在都城下的廳堂之中，希望這位力量被削弱的神祇永無重見天日之時。
actors.mobs.yog$rottingfist.name=腐爛之拳
actors.mobs.yog$rottingfist.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yog$rottingfist.desc=Yog-Dzewa是一位上古之神，來自混沌位面的強大存在。一個世紀前，古代矮人在同惡魔大軍的戰爭中慘勝，卻無法殺死這名神祇。他們只得將這名存在封印在都城下的廳堂之中，希望這位力量被削弱的神祇永無重見天日之時。
actors.mobs.yog$burningfist.name=燃燒之拳
actors.mobs.yog$burningfist.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yog$burningfist.desc=Yog-Dzewa是一位上古之神，來自混沌位面的強大存在。一個世紀前，古代矮人在同惡魔大軍的戰爭中慘勝，卻無法殺死這名神祇。他們只得將這名存在封印在都城下的廳堂之中，希望這位力量被削弱的神祇永無重見天日之時。
actors.mobs.yog$larva.name=古神幼蟲
actors.mobs.yog$larva.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yog$larva.desc=Yog-Dzewa是一位上古之神，來自混沌位面的強大存在。一個世紀前，古代矮人在同惡魔大軍的戰爭中慘勝，卻無法殺死這名神祇。他們只得將這名存在封印在都城下的廳堂之中，希望這位力量被削弱的神祇永無重見天日之時。
actors.mobs.bosses.tpdoor.ny74hf=aHR0cHM6Ly93d3cucGQucWlueXVlcXdxLnRvcC8=
actors.mobs.bosses.tpdoor.youdied=這可是你找的……
actors.mobs.bosses.tpdoor.enter_no_game=不予理睬
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=我  看  見  你  了
actors.mobs.yogdzewa.darkness=黑暗正在逼近……
actors.mobs.yogdzewa.hope=汝・之・希・望・皆・為・虛・妄
actors.mobs.yogdzewa.defeated=……
actors.mobs.yogdzewa.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa.desc=Yog-Dzewa是一個古老的神；一個將自己的力量延伸向凡間世界併吞噬它們、以為自身無盡的成長提供養分的巨大怪物。矮人一定是在玩弄黑暗魔法的時候引起了這個巨大恐怖的注意，並且從那以後就一直試圖控制他，使之無法侵吞外界。\n\n這位古神起源於一個原始的、充滿魔法與混沌的維度，且無法將他的真實形態帶入這個世界。因此，他創造了自己的化身並召喚了惡魔們作為他的僕從來完成它的命令。\n\n這隻巨眼是古神在這個世界上力量的焦點。雖然這隻眼睛本身是不可移動的，但它能夠射出強大的魔能光束，並召喚各種惡魔僕從來幫助它。
actors.mobs.yogdzewa.desc_spawners=你感覺到惡魔能量正從上層湧向古神之眼。你在上面活著留下的什麼東西正在給古神回饋著能量。_古神會使用這股能量召喚更強大的手下！_
actors.mobs.yogdzewa$larva.name=古神幼蟲
actors.mobs.yogdzewa$larva.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$larva.desc=這些古神的小小造物是一種易於製造的簡陋生物。雖然單個幼蟲十分脆弱，但它們能夠被迅速地製造出來，並會在形成一個大數目後變得難以抵擋。
actors.mobs.yogdzewa$yogripper.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$yogeye.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$yogscorpio.rankings_desc=被Yog-Dzewa吞噬

actors.mobs.yogfist.invuln_warn=拳頭鄰接古神之眼時無法受到傷害！
actors.mobs.yogfist.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogfist.desc=這個拳頭是古神力量的部分體現。這些拳頭與古神的力量相互聯繫，並且當它們靠近古神之眼時會免疫所有受到的傷害。
actors.mobs.yogfist$burningfist.name=燃燒之拳
actors.mobs.yogfist$burningfist.desc=燃燒之拳是由混沌的熾熱魔法形成的。它在移動時會不斷地引燃周圍的環境。它還可以發射火焰能量形成魔法衝擊，使目標地陷入一片熊熊烈火。\n\n燃燒之拳引燃環境的能力在靠近水的時候會被抑制，但是其熱量實在太大，以至於周圍的水很快就會蒸發掉！
actors.mobs.yogfist$soiledfist.name=大地之拳
actors.mobs.yogfist$soiledfist.desc=大地之拳是由混沌的大地魔法形成的。當它移動時，它會不斷地使周圍生出植物。它還可以發射精準的大地衝擊，將它的目標困在迅速生長的藤蔓和根系間！\n\n大地之拳能從植物的生命中獲得力量，並能根據其周圍的植被數量來抵擋傷害！
actors.mobs.yogfist$rottingfist.name=腐爛之拳
actors.mobs.yogfist$rottingfist.desc=腐爛之拳是由活生生的腐敗組成的。它是一團高塔般龐大的腐肉，可以在近戰中噴濺腐蝕淤泥，並噴射毒氣作為遠程攻擊。更糟糕的是，腐爛之拳的巨大質量導致它受到攻擊時只會進入流血狀態，而不會直接受到傷害。\n\n腐蝕淤泥可以被水洗去，但腐爛之拳也可以透過吸收水來治癒自己！此外，在其流血時對腐爛之拳造成傷害只會刷新其流血狀態而不會加重效果！
actors.mobs.yogfist$rustedfist.name=鏽蝕之拳
actors.mobs.yogfist$rustedfist.desc=鏽蝕之拳是由一塊活的金屬形成的。它是一個高塔般龐大的移動金屬塊，具有強大的近戰能力，並有在遠距離外使目標殘廢的遠程攻擊能力。由於其巨大的質量，鏽蝕之拳所受到的傷害都會被延緩，而非立即作用在其身上。\n\n儘管如此，鏽蝕之拳那並不靈活的特性使得它無法通過較窄的走道。另外，雖然鏽蝕之拳只會緩慢地受到傷害，但是延緩傷害還會在它受到多次攻擊時繼續疊加。
actors.mobs.yogfist$brightfist.name=輝耀之拳
actors.mobs.yogfist$brightfist.teleport=輝耀之拳在一道使你重度盲目的爆閃中傳送到了別處！
actors.mobs.yogfist$brightfist.desc=輝耀之拳是由純粹的光能量形成的。它能在每回合射出一道強烈的灼目光束！這些光束除了造成大量傷害外，還會暫時使你失明。輝耀之拳為了逃脫還能發出覆蓋全場的刺眼爆閃！\n輝耀之拳在近戰中並沒有特殊能力。
actors.mobs.yogfist$darkfist.name=暗影之拳
actors.mobs.yogfist$darkfist.teleport=暗影之拳在一片使你光源熄滅的漆黑中傳送到了別處！
actors.mobs.yogfist$darkfist.desc=暗影之拳是由純粹的暗能量形成的。它能在每回合射出強大的暗黑法術！這些法術除了造成大量傷害外，還會削弱你的光源。暗影之拳為了逃脫還能瞬間使全場陷入一片漆黑！\n\n暗影之拳在近戰中並沒有特殊能力。

actors.mobs.yogfist$freezingfist.name=寒冰之拳
actors.mobs.yogfist$freezingfist.desc=寒冰之拳催生於地牢的冰寒之氣，它能夠施展魔法能量，每隔3回合釋放出凍傷的力量。\n\n_寒冰之拳常與鬼磷之拳一同行動。當鬼磷之拳存在時，寒冰之拳將不會受到任何與火有關的傷害。_
actors.mobs.yogfist$halofist.name=鬼磷之拳
actors.mobs.yogfist$halofist.desc=鬼磷之拳的誕生源自無數冒險者的屍體聚集，古神巧妙地利用這股怨氣創造了這個怪物。\n\n鬼磷之拳足跡所及之處，將留下熠熠發光的磷火，同時水分也會被蒸發殆盡。\n\n此外，若鬼磷之拳的生命力漸趨微弱且戰鬥持續時間過長，它還會定期借助亡靈的詛咒釋放一道道雷射來對你進行攻擊。這些雷射充滿邪惡之力，將給你帶來巨大的威脅。\n\n_鬼磷之拳通常與寒冰之拳一起行動。_

actors.mobs.yogfist.halofist=鬼磷之拳已被擊敗，寒冰之拳的免疫火焰效果已失效。

actors.char.kill=%s殺害了你…
actors.char.defeat=你擊敗了%s。
actors.char.def_verb=閃避
actors.char.invulnerable=無敵


###SPD
actors.hero.abilities.duelist.challenge.name=公平決鬥
actors.hero.abilities.duelist.challenge.prompt=選擇一名敵人以發起決鬥
actors.hero.abilities.duelist.challenge.already_dueling=你在同一時間裡只能進行一場決鬥。
actors.hero.abilities.duelist.challenge.ally_target=你只能向敵人發起決鬥。
actors.hero.abilities.duelist.challenge.unreachable_target=你不能選擇無法接近的目標。
actors.hero.abilities.duelist.challenge.distant_target=那個敵人離得太遠，無法發起決鬥。
actors.hero.abilities.duelist.challenge.short_desc=艾諾琳娜向一名附近的敵人發起_公平決鬥_，在短時間內停止所有其它敵人的時間。
actors.hero.abilities.duelist.challenge.desc=艾諾琳娜向一名臨近的敵人發起決鬥。被選中的敵人會被強制攻擊艾諾琳娜，其它敵人的時間則會被短暫凍結。\n\n艾諾琳娜只能向 5 格範圍內且可接近的敵人發起決鬥。如果出現以下情況的任意一種：決鬥進行 10 回合、敵人死亡或艾諾琳娜與敵人的距離超過 5 格，決鬥就會終止。\n\n時間被凍結的敵人處於無敵狀態。艾諾琳娜的友方單位不會被凍結，但同理，如果對一名頭目使用此能力，它的隨從亦不會被凍結。
actors.hero.abilities.duelist.challenge$duelparticipant.name=決鬥之中
actors.hero.abilities.duelist.challenge$duelparticipant.desc=這個角色正處於一場決鬥之中。決鬥雙方及它們的友方單位或隨從能夠正常活動，其它角色的時間則被凍結，無法行動。\n\n如果出現以下情況：決鬥超過一定時間、決鬥雙方之一死亡、決鬥雙方距離超過 5 格，決鬥就會終止。\n\n剩餘回合數：%d。
actors.hero.abilities.duelist.elementalstrike.name=元素打擊
actors.hero.abilities.duelist.elementalstrike.short_desc=艾諾琳娜施展一次_元素打擊_，基於所持武器的附魔在扇形範圍內施加效果。
actors.hero.abilities.duelist.elementalstrike.desc=艾諾琳娜打擊一名敵人或一個地點，進行一次必定命中的普通攻擊，並在 65 度角 3 格半徑的扇形範圍內製造一次魔法效果。魔法的具體效果取決於艾諾琳娜主武器的附魔。
actors.hero.abilities.duelist.elementalstrike.generic_desc=不帶有附魔的元素打擊將會造成一次小型的魔力爆發，對範圍內的所有敵人造成 6-12 點傷害。
actors.hero.abilities.duelist.feint.name=虛晃一招
actors.hero.abilities.duelist.feint.prompt=選擇要衝到的位置
actors.hero.abilities.duelist.feint.too_far=那個位置不與你相鄰。
actors.hero.abilities.duelist.feint.bad_location=你無法移動到那個位置。
actors.hero.abilities.duelist.feint.short_desc=艾諾琳娜_虛晃一招_，在假裝進行攻擊的同時衝向一個鄰近位置。誘導敵人攻擊她的殘影，致使敵人露出破綻。
actors.hero.abilities.duelist.feint.desc=艾諾琳娜在假裝進行攻擊的同時衝向一個鄰近位置，在原位留下一個殘影。正在攻擊艾諾琳娜的敵人會攻擊到殘影。\n\n攻擊了殘影的敵人會被迷惑，取消原本的下一個動作，並且可以被伏擊。

//SPD
actors.buffs.daze.name=恍惚
actors.buffs.daze.heromsg=你感到頭暈目眩！
actors.buffs.daze.desc=耳畔嗡鳴，視野模糊，戰鬥因此變得十分困難。\n\n在恍惚狀態下, 精準和閃避都會減少 50%%, 使得命中和躲避都變得更加困難。\n\n剩餘回合數：%s

actors.mobs.crystalguardian.name=水晶哨兵
actors.mobs.crystalguardian.def_verb=格擋
actors.mobs.crystalguardian.desc=這種巨大的水晶哨兵看似一尊普通雕像，但其眼中泛起的明光出賣了它。因為身體由硬化的水晶構成，它們行動不便但異常堅固。所以_最好別打擾它們在晶體巢穴中的酣眠。_\n\n由於水晶哨兵體型龐大，其在狹隘的地形移動時，速度會非常慢。它們還無比堅韌，無法被徹底殺死。它們被擊敗後會暫時失能，但不一會便會捲土重來。

actors.mobs.crystalspire.name=水晶尖塔
actors.mobs.crystalspire.warning=水晶在你的敲打下開始振動。這樣下去一定會吸引什麼東西的注意力...
actors.mobs.crystalspire.alert=振動感越來越強烈，隆隆聲響徹整個洞穴！
actors.mobs.crystalspire.desc=這座尖塔由無比堅硬的水晶構成，很高機率是洞穴中所有奇怪水晶生物的來源。你的常規武器無法對它造成傷害，所以最好用一把十字鎬來摧毀它。\n\n_動手破拆之前，要為硬仗做好準備。_拆除如此碩大的一塊水晶可需要花費不少時間，而且很難不被打擾。尖塔本身也可能擁有防禦機制。_或許尖塔的攻擊可被利用於對付它的爪牙。_\n\n_水晶尖塔只能受到來自鎬子的傷害，其他傷害全部免疫_

actors.mobs.crystalwisp.name=靈性晶簇
actors.mobs.crystalwisp.beam_kill=你被光束轟殺...
actors.mobs.crystalwisp.desc=一塊小而憤怒的硬化水晶漂浮在空中，泛起明亮的光。它雖然不算強，但只要有機會，就會射出光束傷害你。\n\n這種晶簇足夠小巧，故而可以穿越冒出地面的水晶障礙物進行移動，但其射擊的光束不可以。

actors.mobs.phantompiranha.name=幻影食人魚
actors.mobs.phantompiranha.teleport_away=幻影食人魚傳送走了...
actors.mobs.phantompiranha.desc=幻影食人魚是巨型食人魚的一個罕見變種，具有詭異的半透明身體和魔法能力。他們能夠在受到攻擊時傳送，從而逃跑或者迅速靠近敵人！\n\n雖然難以處理，但它們的肉也因具有魔力而備受珍視。

actors.mobs.tormentedspirit.name=咒縛靈
actors.mobs.tormentedspirit.desc=咒縛靈是本性善良的靈體，但卻被詛咒所折磨。只要它們還被詛咒，它們就會像怨靈一樣攻擊你，而且更加強大！\n\n或許可以在與它們相鄰時使用正確的物品來驅散詛咒。它們定會對此非常感激...
actors.mobs.tormentedspirit.thank_you=謝謝你...

actors.buffs.monkenergy.name=內力
actors.buffs.monkenergy.action=武功
actors.buffs.monkenergy.desc=每當武道宗師擊敗一個敵人，她都會獲得可用於施展多門武功的內力。擊敗大多數種類的敵人時只會獲得1點內力，並且武道宗師不會隨時間流失內力。\n\n現有內力：%1$d/%2$d
actors.buffs.monkenergy.desc_cooldown=武道宗師剛剛才施展過一次武功，再次施展前必須等待。\n\n剩餘冷卻時間：%d回合
actors.buffs.monkenergy$monkability$flurry.name=空振
actors.buffs.monkenergy$monkability$flurry.desc=兩次不耗回合的攻擊，每次造成%1$d~%2$d點傷害並且忽略護甲。如果武道宗師剛剛成功命中過敵人，則這門武功不會進入冷卻。
actors.buffs.monkenergy$monkability$flurry.empower_desc=兩次不耗回合的攻擊，每次造成%1$d~%2$d點傷害，_可觸發武器上的附魔_並且忽略護甲。如果武道宗師剛剛成功命中過敵人，則這門武功不會進入冷卻。
actors.buffs.monkenergy$monkability$focus.name=凝神
actors.buffs.monkenergy$monkability$focus.desc=武道宗師消耗一回合來進入凝神狀態，在30回合內招架下一次受到的物理攻擊。
actors.buffs.monkenergy$monkability$focus.empower_desc=武道宗師_立即進入凝神狀態_，在30回合內招架下一次受到的物理攻擊。
actors.buffs.monkenergy$monkability$focus$focusbuff.name=凝神
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=武道宗師正專注於她周遭的一切，可以預料到對她發起的下一次物理攻擊。當處於凝神狀態時，她將必定招架下一次來襲的物理攻擊。
actors.buffs.monkenergy$monkability$dash.name=登雲
actors.buffs.monkenergy$monkability$dash.prompt=選擇一個地點
actors.buffs.monkenergy$monkability$dash.desc=立刻衝向一個3格遠的地點。這一武功可以越過危險地形，但不能穿過敵人或者堅實的障礙物。
actors.buffs.monkenergy$monkability$dash.empower_desc=立刻衝向一個_6格_遠的地點。這一武功可以越過危險地形，但不能穿過敵人或者堅實的障礙物。
actors.buffs.monkenergy$monkability$dragonkick.name=盤龍
actors.buffs.monkenergy$monkability$dragonkick.desc=一次致命的踢擊，造成%1$d~%2$d點傷害，無視護甲，並將敵人擊退，還會對敵人施加與擊退距離相等回合數的麻痺。
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=一次致命的踢擊，造成_%1$d~%2$d點傷害_，無視護甲，並將_所有鄰近目標_擊退，還會對敵人施加與擊退距離相等回合數的麻痺。
actors.buffs.monkenergy$monkability$meditate.name=冥思
actors.buffs.monkenergy$monkability$meditate.desc=武道宗師消耗5回合來運轉內力，將大部分的負面效果逼出體外，並獲得8回合的法杖和神器充能。
actors.buffs.monkenergy$monkability$meditate.empower_desc=武道宗師消耗5回合來運轉內力，將大部分的負面效果逼出體外，並獲得8回合的法杖和神器充能。_冥思期間還會獲得80%傷害抗性，並緩慢恢復共20%已損失生命值。_

actors.mobs.npcs.wandmaker.intro_duelist=哦，小姐你好！多麼壓抑的地方，多麼美妙的偶遇！如果你有興趣幫助一位糟老頭子的話，我有份小差事可以交給你。
actors.mobs.elemental$newbornfireelemental.charging=那個元素正在充能！
actors.buffs.physicalempower.name=強力攻擊
actors.buffs.physicalempower.desc=你的攻擊已被強化，接下來的幾次物理攻擊將會造成額外傷害。\n\n額外傷害：%1$d。\n剩餘攻擊次數：%2$d。

actors.buffs.ascensionchallenge.name=水晶詛咒
actors.buffs.ascensionchallenge.desc=之前耳旁的那位未知聲音對你的水晶之心下了詛咒，在這詛咒解除之前，對你來說返程成了嚴峻的考驗。
actors.buffs.ascensionchallenge.desc_clear=水晶之心中散發出的黑暗能量現今已被最大程度的削弱了。
actors.buffs.ascensionchallenge.desc_beckon=水晶之心正在_呼喚遠處的敵人_，向它們通告你的位置。
actors.buffs.ascensionchallenge.desc_haste=水晶之心正_為遠處的敵人加速_，令它們得以更快接近你！
actors.buffs.ascensionchallenge.desc_slow=水晶之心正_使你減速_，並阻止了一切加速效果！
actors.buffs.ascensionchallenge.desc_damage=水晶之心中湧動的黑暗能量已極為強大，它正在_直接對你造成傷害_！
actors.buffs.ascensionchallenge.beckon=水晶之心開始呼喚遠處的敵人前來。
actors.buffs.ascensionchallenge.haste=水晶之心開始為周遭的敵人提升移速！
actors.buffs.ascensionchallenge.slow=你背包中的水晶之心此刻恍如重逾千鈞！
actors.buffs.ascensionchallenge.damage=水晶之心開始釋放黑暗能量。它燒著了！
actors.buffs.ascensionchallenge.weaken_info=你必須擊敗敵人來削弱護符的詛咒！
actors.buffs.ascensionchallenge.weaken=你能感受到水晶之心上的詛咒正緩慢地消退。
actors.buffs.ascensionchallenge.break=你花上點時間喘一口氣，你感覺有一股力量在治癒著你。
actors.buffs.ascensionchallenge.almost=你能感覺到那位未知的聲音已經認可你了，在水晶之心上的詛咒光芒已然消失，勝利的曙光已然在你面前！

actors.buffs.ascensionchallenge.morelanter_damage=在水晶詛咒下，在燈火50以上時，你將受到更多的_燈火扣減_！
actors.buffs.ascensionchallenge.on_kill=你沒能經受考驗，黑暗能量最終還是吞噬了你……

actors.hero.heroclass.warrior_desc_short=蕾零安潔從他的_破損紋章_中獲得額外傷害減免。紋章可以在護甲之間轉移，並且可以_攜帶一級升級_。
actors.hero.heroclass.mage_desc_short=茉莉伊洛是一位巫女，開局持有一根強於法杖的_老魔杖_。茉莉伊洛可以將_任何法杖灌注進_老魔杖。
actors.hero.heroclass.rogue_desc_short=極影鈴虹能借助他的_暗影斗篷_來躲避和偷襲敵人。她還可以從更遠的距離_探測秘密與陷阱_。
actors.hero.heroclass.huntress_desc_short=頤蓮梅錵精通投擲武器，並且具有一把能無限射擊的_獨特靈能弓_。女獵手可以穿過高草叢而_不將其踐踏成草地_。

actors.hero.heroclass.switch_skin2=出現這則消息，則說明下一款皮膚_未解鎖_或你已切換回_原皮_。\n\n若要購買皮膚請到雪境小鎮的入口下方商人處購買，當然，錢要包夠哦:)。

custom.testmode.terrainplacer$1.cant_place=無法放置此類地形，請選擇其他地形。


actors.buffs.status.roomseal.name=戰術對抗競技場
actors.buffs.status.roomseal.desc=聰明的敵人擁有高超的戰術，別想臨陣脫逃。\n\n如果你試圖離開競技場，以你現在的深度，則會_每回合受到%d魔法傷害_\n\n只有_回到競技場_或_擊敗對應的敵人_或_讓敵人失去目標後_才能解除\n\n因此，多說無益！決鬥！！！
actors.buffs.status.roomseal.ondeath=戰術對抗中，你沒能脫穎而出……
actors.buffs.status.roomseal.rankings_desc=惜敗於戰術對抗競技場中……

actors.blobs.venomgas.desc=這裡盤繞著一片異常致命的侵蝕性猩紅毒霧。

