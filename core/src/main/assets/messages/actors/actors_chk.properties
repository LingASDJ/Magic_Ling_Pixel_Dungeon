actors.mobs.xtg100.name=Tengu-100
actors.mobs.xtg100.desc=和大天狗長得差不多的幻影，但血量只有大天狗的四分之一。你已經徹底激怒他們，他們仍然能使用噴火器，但彈藥不是無限的。\n\\uFFE5��前彈藥總共還有_%s發_.

actors.mobs.xtg200.name=Tengu-100
actors.mobs.xtg200.desc=和大天狗長得差不多的幻影，但血量只有大天狗的四分之一。

actors.mobs.sb.name=矮人國亡
actors.mobs.sb.notice=雕蟲小技竟敢班門弄斧
