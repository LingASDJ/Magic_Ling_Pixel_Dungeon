actors.mobs.bosses.dwarfmaster.name=矮人武將
actors.mobs.bosses.dwarfmaster.desc=前矮人王國正規軍，如今已經被邪惡魔法腐蝕同化。\n\n他仍然記得矮人王國曾經的輝煌，也記得矮人王國最後的滅亡。他明顯認為到來的你是入侵者，小心行事，他作為前矮人王國的正規軍首領，作風往往比現階段的矮人國王更加殘暴。\n\n失敗不代表一切，死亡不代表結束。
actors.mobs.bosses.dwarfmaster.death_rattle=矮人王國……最終還是失敗了嗎……
actors.mobs.bosses.dwarfmaster.notice=你 是 誰 ?! 為 什 麼 踏 入 了 這 裡 ?
actors.mobs.bosses.dwarfmaster.sacrifice=我辜負了矮人王國……
actors.mobs.bosses.dwarfmaster.pumpup=我屬於矮人王國的亡靈，而你必須死！
actors.mobs.bosses.dwarfmaster.more_summon=我居然也是亡靈了嗎？
actors.mobs.bosses.dwarfmaster.!!!=入侵者，告訴我，你的目的是什麼！！！
actors.mobs.bosses.dwarfmaster.buff_all=矮人軍隊，速速捉拿此人！
actors.mobs.bosses.dwarfmaster.wave_1=現任矮人國王？那就是一個冒牌貨！！！
actors.mobs.bosses.dwarfmaster.wave_2=你感覺你自己現在是救世主嗎？
actors.mobs.bosses.dwarfmaster.wave_3=你究竟是誰？
actors.mobs.bosses.dwarfmaster.enraged=或許，你是那個勇者。接受我最後的洗禮吧！
actors.mobs.bosses.dwarfmaster.losing=你究竟是誰，你很強，但要面對她，還遠遠不夠!
actors.mobs.bosses.dwarfmaster.defeated=看來，並不是所有人都瘋了!勇者,這是你的獎勵!我不會就此沉睡,我要繼續調查王國滅亡的真相……
actors.mobs.bosses.dwarfmaster.life=生命源頭
actors.mobs.bosses.dwarfmaster.dead=死亡終焉
actors.mobs.bosses.dwarfmaster.teleport_2=你，去那邊支援！
actors.mobs.bosses.dwarfmaster.teleport_1=我可是曾經的矮人武將，你算什麼東西！
levels.dwarfmasterbosslevel.dead_go=就在你移動的一瞬間，大廳發出了詭異的笑聲，裂縫變成了地板。這和石碑上面的記載完全一致，你可能有大麻煩了!
actors.mobs.bosses.dwarfmaster.lifelink_2=矮人軍隊，把你們的生命連結給我吧
actors.mobs.bosses.dwarfmaster.lifelink_1=生命連結，為矮人王國清掃障礙
actors.mobs.bosses.dwarfmaster$dkghoul.rankings_desc=被武將說服加入了矮人亡靈軍隊
actors.mobs.bosses.dwarfmaster$dkmonk.rankings_desc=被武將說服加入了矮人亡靈軍隊
actors.mobs.bosses.dwarfmaster$dkwarlock.rankings_desc=被武將說服加入了矮人亡靈軍隊
