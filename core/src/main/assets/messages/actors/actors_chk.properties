actors.mobs.npcs.shopking_two.desc=雪凜峽谷的商人領主，正是他建立了商人這個勢力。

actors.buffs.watersoulx.name=水靈祝福
actors.buffs.watersoulx.desc=水靈的祝福已經在你身上，現在你可以免疫水上的所有詛咒,並且得到你應當得到的祝福。\n\n剩餘回合:%s。

