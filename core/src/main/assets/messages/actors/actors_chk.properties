actors.mobs.bosses.dmzero.name=DMZERO-_未完成_
actors.mobs.bosses.dmzero.desc=DMZERO是死靈巫師為奪取前矮人國王的政權而用黑暗魔法仿造矮人科技所製造的試作型魔法機械。\n\n由於水晶之心的影響，DMZERO被禁錮在另一個異次元空間內，無法影響地牢所在的時間線。\n\n戰鬥回合過長將會釋放_湮滅審判_，對玩家造成致死傷害。半血後傷害大幅度提升。\n\n根據商人給出的情報，它的高智慧輻射電波影響了這個地牢。封印，摧毀，抑或是遣返。讓這裡恢復原狀吧。
actors.mobs.bosses.dmzero.notice=偵查到未授權單位……！！
actors.mobs.bosses.dmzero.defeated=能量負載6%……

actors.mobs.bosses.dmzero$dm300attackmode.name=DMZERO-黯色
actors.mobs.bosses.dmzero$dm300attackmode.desc= DMZERO內部的黑暗能量逐漸充盈，將機體染成暗黑色。\n\n黯色只是對顏色的描述。\n\n黯色狀態下的DMZERO會使用_腐蝕毒霧_攻擊，並且能發射震波擊飛敵人。\n\n黯色形態下DMZERO會投擲暗黑能量炸彈,並主動遠離任何生物。靠得太近可能會被溢出的黑暗能量麻痺。\n\n{戰鬥回合過長將會釋放_湮滅審判_，對玩家造成致死傷害。
actors.mobs.bosses.dmzero$dm300attackmode.notice=偵查到未授權單位……
actors.mobs.bosses.dmzero$dm300attackmode.defeated=燃料填充66%……

actors.mobs.bosses.dmzero$dm300spidermode.name=DMZERO-赤色
actors.mobs.bosses.dmzero$dm300spidermode.desc=DMZERO將所有燃料轉化為猩紅能量覆蓋體表，實體化的猩紅能量有著極強的魔法吸收性與驅動性。\n\n赤色如血。\n\n赤色狀態下dmzero會使用_酸蝕毒霧_攻擊，並且能發射蜘蛛絲困住敵人。\n\n赤色狀態下，dmzero將完全免疫魔法傷害，且普通攻擊的傷害提升。\n\n{戰鬥回合過長將會釋放_湮滅審判_，對玩家造成致死傷害。
actors.mobs.bosses.dmzero$dm300spidermode.notice=偵查到未授權單位……
actors.mobs.bosses.dmzero$dm300spidermode.defeated=猩紅縛繭已完成……

actors.mobs.bosses.dmzero$dm300deathball.name=DMZERO-鋼色
actors.mobs.bosses.dmzero$dm300deathball.desc=DMZERO破除血繭，將猩紅碎片與儲存的暗金熔鑄成新的甲殼。\n\n鋼色中帶著一抹黯淡，一抹赤紅。\n\n鋼色狀態下DMZERO會使用_酸蝕毒霧與中毒毒霧_攻擊，並且本體完全免疫酸蝕和毒\n\n鋼色狀態下，DMZERO會緩慢修復損傷,並且在經過水時額外回復。此時DMZERO完全免疫魔法傷害且擁有更高的精準度。\n\n此時DMZERO會不斷自我強化，戰鬥回合過長將徹底失控。
actors.mobs.bosses.dmzero$dm300deathball.notice=偵查到未授權單位……
actors.mobs.bosses.dmzero$dm300deathball.defeated=蛻變失敗……系統關閉


