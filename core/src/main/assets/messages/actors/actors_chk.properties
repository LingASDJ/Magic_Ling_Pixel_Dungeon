actors.mobs.shieldhuntsman.tlk=你被獵人的盾牌重重地撞了一下，你全身僵直難以呼吸，同時感覺到一團烈焰正在從你身體內熊熊燃燒！
actors.mobs.shieldhuntsman$focus.name=精神集中
actors.mobs.shieldhuntsman$focus.desc=這個獵人已經完全集中於目標的一舉一動，似乎能預料到目標的下一步動作。\n\n精神集中的獵人一定會格擋下一次物理攻擊。格擋會分散獵人的注意力，使得他們需要一段時間重新集中精力來成功格擋攻擊。在移動時獵人恢復地相對更快。
actors.mobs.shieldhuntsman.parried=格擋

actors.mobs.murderer.name=邪魔小偷
actors.mobs.murderer.desc=穿著橘色盜賊禮服的危險怪物，他們已經喪失了偷東西的本領，作為替代的黑魔法會讓每一個冒險者有去無回。
actors.mobs.murderer.bolt_kill=暗影能量使你的生命衰竭了……

