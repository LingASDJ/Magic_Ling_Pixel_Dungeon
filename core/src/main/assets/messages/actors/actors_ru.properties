actors.mobs.shieldhuntsman.disarm = Следопыт выбил ваш %s!
actors.mobs.shieldhuntsman.desc = Это те следопыты, которые побывали в _хрустальном городе_, где и превратились в безумцев, потеряв свой рассудок. Теперь, единственное, что привлекает их внимание - мимо проходящие путешественники.
actors.mobs.shieldhuntsman.tlk=Вы получили такой сильный удар от щита, что аж все ваше тело парализовало, а внутри вас разгорелось пламя!
actors.mobs.shieldhuntsman$focus.name=сфокусирован
actors.mobs.shieldhuntsman$focus.desc=Этот следопыт отлично изучил свою цель и, кажется, предугадывает движения врага прежде, чем он их совершит.\n\nПока он сфокусирован, следующая физическая атака, против этого персонажа гарантированно промахнется, независимо от обстоятельств. Парирование этой атаки потратит фокус следопыта, и ему нужно будет снова набрать его, чтобы парировать еще одну атаку. Следопыты быстрее фокусируются во время движения.
actors.mobs.shieldhuntsman.parried=парирование

actors.mobs.murderer.name=злобный вор
actors.mobs.murderer.desc=Эти опасные существа в оранжевых воровских мантиях. утратили способность к воровству, и теперь своей черной магией извращают рассудок у встречаемых путешественников.
actors.mobs.murderer.bolt_kill=Вас убила стрела тьмы...

actors.blobs.halomethanefire.desc=Здесь бушует фосфорное пламя.
actors.blobs.superfire.desc=Здесь бушует фосфорное пламя.
actors.buffs.superfire.name=подожжен фосфорным огнем
actors.buffs.superfire.heromsg=Вы загорелись!
actors.buffs.superfire.ondeath=Вы сгорели заживо...
actors.buffs.superfire.rankings_desc=Сгорел
actors.buffs.superfire.desc=Мало что может быть более неприятным, чем быть охваченным фосфорным пламенем.\n\nНе говоря уже о том, что фосфорный огонь еще более неприятные, чем обычный огонь.\n\nХодов осталось: %s.

actors.mobs.molotovhuntsman.name = следопыт-огнеметатель
actors.mobs.molotovhuntsman.attack_msg_1 = Сжечь, зверское чудовище!
actors.mobs.molotovhuntsman.attack_msg_2 = Пусть огонь очистит тебя!
actors.mobs.molotovhuntsman.attack_msg_3 = Убирайся!
