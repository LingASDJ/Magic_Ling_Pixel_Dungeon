actors.blobs.alter.altwellwater.wellreading=Три колодца
actors.blobs.alter.altwellwater.drink=Вы уверены, что хотите пить или использовать три колодца? После этого действия все остальные колодцы в этой комнате потеряют свои свойства.
actors.blobs.alter.altwellwater.yes=Да, я знаю, что я делаю
actors.blobs.alter.altwellwater.no=Нет, я передумал.


###BIRDAY
actors.mobs.greendiamndmimic.name=изумрудный мимик
actors.mobs.greendiamndmimic.reveal=Ой! Это не изумрудный сундук, это мимик!
actors.mobs.greendiamndmimic.hidden_name=изумрудный сундук
actors.mobs.greendiamndmimic.hidden_desc=Вы не узнаете, что там, пока не откроете!
actors.mobs.greendiamndmimic.desc=Мимики - волшебные существа, способные принимать любой облик. В подземельях они почти всегда принимают облик сундука, чтобы заманить ничего не подозревающих путешественников.\n\nИзумрудные мимики - похожи на эбонитовые, но опаснее. При попытке их открыть они наносят огромный урон путешественникам, отравляя, калеча или ослепляя, а перед смертью поднимают тревогу и самоподрываются.\n\nУбийство изумрудного мимика гарантирует выпадение 1-2 бонусных предмета.
actors.mobs.greendiamndmimic.explo_kill=Вас убил взрыв изумрудного мимика...

custom.seedfinder.seedfinder.lengds=легендарное оружие

#### NEW BATTLEMAGE
actors.mobs.npcs.magehand.name=Волшебная рука
actors.mobs.npcs.magehand.desc=Приспешник мага, оказывающий различную поддержку с помощью разнообразных палочек.\n\nОбладает абсолютной неуязвимостью к вражеским атакам.
actors.mobs.npcs.magehand.wand_equipped=В волшебную руку помещен: %s. Отныне она будет защищать вас.
actors.mobs.npcs.magehand.wand_used=Волшебная рука высвободила %s энергии!
actors.mobs.npcs.magehand.wand_unequipped=Из волшебной руки изъята: %s.
actors.mobs.npcs.magehand.desc_equipped_wand=Помещенная палочка: %s.
actors.mobs.npcs.magehand.desc_charges=Зарядов палочки: %s/%s.
actors.mobs.npcs.magehand.desc_colddown=Ходов для перезарядки атаки: %s.
actors.mobs.npcs.magehand.out_of_range=Место телепортации вне поля зрения героя!
actors.mobs.npcs.magehand.desc_staff=Помещенный посох: %s.
actors.mobs.npcs.magehand$handshield.name=осязаемая рука
actors.mobs.npcs.magehand$handshield.desc=Волшебная рука черпает силу из щитов барьера, временно усиливая вашу защиту, которая позволяет вам лучше противостоять физическим атакам противника.\n\nТекущий бонус к броне: 0-%d.\nХодов до ослабления эффекта: %s.
actors.mobs.npcs.magehand$wndmagehand.cant_unidentified=Вы не можете помещать неопознанные палочки в волшебную руку.
actors.mobs.npcs.magehand$wndmagehand.cant_equip=Вы не можете поместить посох мага в волшебную руку, пока он экипирован магом.

actors.mobs.npcs.magehand$magehandcontrol.hand=Волшебная рука

actors.mobs.npcs.magehand$wndmagehand.title=управление Волшебной рукой
actors.mobs.npcs.magehand$wndmagehand.desc=Поместите посох или палочку в Волшебной руку, чтобы она применяла их заклинания каждые 3 хода.\n\nБлижний бой у Волшебной руки возможен только, если в её помещен посох мага. Заклинания посоха, всегда применяются в первую очередь, за исключением случаев, когда рука находится на перезарядке или посох еще не заряжен, в таком случае используется атака посохом в ближнем бою.
actors.mobs.npcs.magehand$wndmagehand.wand_prompt=Выберите палочку
actors.mobs.npcs.magehand$magehandcontrol.name=управление Волшебной рукой
actors.mobs.npcs.magehand$magehandcontrol.desc=Оборудование, управляющее Волшебной рукой, может быть оснащено различными палочками, и обладает рядом функций, таких как телепортация, атака и патрулирование.\n\nВы можете оснастить палочкой или посохом Волшебную руку, нажав на кнопку «Поместить палочку», или использовать кнопку быстрого доступа в правом нижнем углу игрового экрана.
actors.mobs.npcs.magehand$magehandcontrol.ac_hand=ПОМЕСТИТЬ ПАЛОЧКУ
actors.mobs.npcs.magehand$magehandcontrol.ac_direct=ТЕЛЕПОРТИРОВАТЬ
