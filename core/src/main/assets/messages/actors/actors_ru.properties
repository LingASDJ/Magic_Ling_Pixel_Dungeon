actors.mobs.bosses.dmzero.name=DMZERO-_НЗП_
actors.mobs.bosses.dmzero.desc=DMZERO - это прототип магической машины, созданная некромантами с использованием темной магии для имитации технологий дворфов с целью захвата власти бывшего короля дворфов. Из-за воздействия Кристального сердца DMZERO заточен в другом измерении и где не может влиять на временную шкалу, в которой находится подземелье.\n\nЕсли { битва { проходит слишком долго, он активирует _протокол уничтожения_, наносящий герою смертельный урон. Его урон значительно возрастает, когда здоровье опускается ниже половины.
actors.mobs.bosses.dmzero.notice=ОБНАРУЖЕН НЕАВТОРИЗОВАННЫЙ ПЕРСОНАЛ!
actors.mobs.bosses.dmzero.defeated=ЗАРЯДА ЭНЕРГИИ 6%…

actors.mobs.bosses.dmzero$dm300attackmode.name=DMZERO-ТЕМНЫЙ
actors.mobs.bosses.dmzero$dm300attackmode.desc= DMZERO - функционирующий на накопленной темной энергией внутри, которая полностью окрасила его корпус в темно-черный цвет.\n\nПока DMZERO в таком состоянии, он использует в атаках _разъедающий газ_ и стреляет ударными волнами, чтобы отбрасывать врагов. Вдали DMZERO бросает бомбы с темной энергией и активно держится подальше от любых существ, поэтому если приблизится к нему слишком близко, он способен парализовать своего врага темной энергией.\n\nЕсли { битва { проходит слишком долго, он активирует _протокол уничтожения_, наносящий герою смертельный урон.
actors.mobs.bosses.dmzero$dm300attackmode.notice=ОБНАРУЖЕН НЕАВТОРИЗОВАННЫЙ ПЕРСОНАЛ...
actors.mobs.bosses.dmzero$dm300attackmode.defeated=УРОВЕНЬ ТОПЛИВА 66%...

actors.mobs.bosses.dmzero$dm300spidermode.name=DMZERO-БАГРЯНЫЙ
actors.mobs.bosses.dmzero$dm300spidermode.desc=DMZERO - преобразовал все топливо в багряную энергию, которая окутала его поверхность корпуса для поглощения магического воздействия и подвижности.\n\nПока DMZERO в таком состоянии, он использует в атаках _токсичный дым_ и стреляет паучьей паутиной, чтобы ловить врагов в ловушку. Такой DMZERO полностью невосприимчив к магическому урону, и имеет усиленный урон в обычной атаке.\n\nЕсли { битва { проходит слишком долго, он активирует _протокол уничтожения_, наносящий герою смертельный урон.
actors.mobs.bosses.dmzero$dm300spidermode.notice=ОБНАРУЖЕН НЕАВТОРИЗОВАННЫЙ ПЕРСОНАЛ...
actors.mobs.bosses.dmzero$dm300spidermode.defeated=БАГРЯНЫЙ КОРПУС РАЗРУШЕН...

actors.mobs.bosses.dmzero$dm300deathball.name=DMZERO-СТАЛЬНОЙ
actors.mobs.bosses.dmzero$dm300deathball.desc=DMZERO - разрушил багряный корпус, чтобы сплавить багрянее осколки с темным золотом для создания нового корпуса.\n\nПока DMZERO в таком состоянии, он использует в атаках _токсичный дым_ и _разъедающий газ,_ а сам корпус полностью невосприимчив к коррозии и яду. DMZERO способен медленно исправлять повреждения и дополнительно восстанавливаться при прохождении через воду. Такой DMZERO полностью невосприимчив к магическому урону, и обладает более высокой точностью.\n\nЕсли { битва { проходит слишком долго, он продолжит усиливаться полностью потеряв контроль.
actors.mobs.bosses.dmzero$dm300deathball.notice=ОБНАРУЖЕН НЕАВТОРИЗОВАННЫЙ ПЕРСОНАЛ...
actors.mobs.bosses.dmzero$dm300deathball.defeated=ТРАНСФОРМАЦИЯ НЕ УДАЛАСЬ... СИСТЕМА ОТКЛЮЧЕ-


#觉醒天赋
actors.hero.talent.died_god.title=ярость бога войны
actors.hero.talent.died_god.desc=_+1:_ Урон героя увеличивается на 5 единиц урона.\n\n_+2:_ Когда герой носить броню, он получает щит и дубовую кожу.\n\n_+3:_ Герой с полным здоровьем увеличивает скорость передвижения.\n\n_+4:_Когда у героя здоровье ниже 50, он получает 10 ходов шипов и слабый эффект лечения.\n\n_+5_После короткого отказа умереть герой получает 25 единиц щита, но уменьшает вдвое скорость восстановления.

actors.buffs.randombuff$diedbuff.name=протокол уничтожения
actors.buffs.randombuff$diedbuff.desc=DMZERO постепенно потеряет терпение, если битва будет слишком долгой, DMZERO перейдет в свою пятую форму, которую практически невозможно победить…\n\nОсталось ходов терпения: %s.



actors.buffs.championhero.warn=Вы ощущаете неисчерпаемую силу.
actors.buffs.championhero$light.name=благословение грома
actors.buffs.championhero$light.desc=Благословенные громом полностью неуязвимы к стихийному урону от молнии.\n\nХодов осталось:
actors.buffs.championhero$halo.name=благословение фосфора
actors.buffs.championhero$halo.desc=Благословенные фосфором наносят на 35% больше урона в ближнем бою, поджигают фосфором при атаке, неуязвимы к обычному и фосфорному огню.\n\nХодов осталось:
actors.buffs.championhero$blazing.name=благословение огня
actors.buffs.championhero$blazing.desc=Благословенные огнем наносят на 25% больше урона в ближнем бою, поджигают при атаке, неуязвимы к огню и поджигают местность вокруг себя после смерти.\n\nХодов осталось:
actors.buffs.championhero$projecting.name=благословение враждебности
actors.buffs.championhero$projecting.desc=Благословенные враждебностью наносят на 25% больше урона в ближнем бою.\n\nХодов осталось:
actors.buffs.championhero$antimagic.name=благословение антимагии
actors.buffs.championhero$antimagic.desc=Благословенные антимагией получают на 25% меньше урона и совершенно неуязвимы к магии.\n\nХодов осталось:
actors.buffs.championhero$giant.name=благословение бесстрашия
actors.buffs.championhero$giant.desc=Благословенные бесстрашием получают на 75% меньше урона.\n\nХодов осталось:
actors.buffs.championhero$blessed.name=благословение вдохновения
actors.buffs.championhero$blessed.desc=Благословенные вдохновением имеют на 200% большую меткость и уклонение.\n\nХодов осталось:
actors.buffs.championhero$growing.name=благословение героя
actors.buffs.championhero$growing.desc=Благословенные герои получают постоянно растущий бонус к меткости, уклонению, атаке и к сопротивлению урону.\n\nТекущий бонус к метк/укл/атк: %1$d%%\nТекущее сопротивление урону: %2$d%%\n\nХодов осталось:

actors.buffs.championhero$element.name=благословение стихии
actors.buffs.championhero$element.desc=Благословенные стихией получают иммунитет ко всему стихийному и магическому урону, но удваивает такие атаки по ближайшим врагам.\n\nХодов осталось:

actors.mobs.dimandking.name=совершенный лесной дух
