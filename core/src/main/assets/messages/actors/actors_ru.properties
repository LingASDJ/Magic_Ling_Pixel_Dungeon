actors.mobs.dimandking.wave_3=Не дайте этому человеку завладеть моими вещами.
actors.mobs.dimandking.enraged=Думаешь, ты смешной? Я не оставлю тебя в живых!
actors.mobs.dimandking.losing=Нет, ты не можешь этого сделать. Ты не представляешь, что ждет тебя впереди!
actors.mobs.dimandking.defeated=Чертов глупец, ты погубишь наш мир!
actors.mobs.dimandking.rankings_desc=Погублен Лесным духом
actors.mobs.dimandking.desc=Этот лесной дух когда-то он был королем джунглей, но после того катастрофического случая, произошедшего в этой временной линии, он был вынужден спустится под тюрьму, чтобы выжить и стать все более могущественным.
