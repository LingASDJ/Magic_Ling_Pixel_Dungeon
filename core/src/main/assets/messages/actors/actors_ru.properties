actors.mobs.molohr.attack_msg_7 = Что!
actors.mobs.molohr.attack_msg_8 = Гори и умри
actors.mobs.molohr.death_msg_1 = Наконец-то освобожден...
actors.mobs.molohr.desc = Водитель DM-720, избавьтесь от него как можно скорей.\n\nЭто крайне извращенные следопыты заразились злом, когда потеряли рассудок от темной магии, таящейся в глубинах подземелья. Все что их влечет, это желание убивать случайно пришедших незваных путешественников.\n\nВ отличие от следопытов-огнеметателей, они лучше уклоняются от атак.
actors.mobs.molohr.notice = Кто ты такой!?
actors.mobs.molohr.attack_lost = Древний следопыт: я наконец-то пробудился, пришло время охоты!

actors.mobs.ogpdzsls.name=коричневая крыса
actors.mobs.ogpdzsls.desc=Они почти также кусаются как обычные крысы, но опасны они только в больших количествах.

