actors.buffs.sanity.normal_desc=_Если снова и снова спускаться в подземелье, можно еще сильнее самого себя._\n\nВы не знаете, когда снова спуститесь в это подземелье, но вас охватывает его странная и зловещая атмосфера. Войдя в подземелье, вы чувствуете свой рассудок. Но вам не известно, как бистро теряется рассудок внутри самого подземелья, по крайней мере, сейчас вы в своем уме. }\n\nТекущий рассудок: %s.\n\nСейчас ваш рассудок в полном порядке, так что не беспокойтесь о нем. }

actors.buffs.sanity.crazy_desc=_Из-за отсутствия света или психического воздействия монстров, сейчас ваш разум немного не в себе._ }\n\nТекущий рассудок: %s.\n\nСейчас вы постепенно теряете рассудок, постарайтесь найти то, что поможет поднять ваше настроение. }

actors.buffs.sanity.died_desc=Разум покинул вас, воображаемые монстры, разрушенные убеждения, развращенная душа, ваши страхи стали реальными. ]\n\nТекущий рассудок: %s.\n\nСейчас вы находитесь на грани полной потери рассудка, вы чувствуете, как у вас теряется душа, и если вы не найдете способ вернуть себе рассудок, то станете таким же монстром как другие! ]

