actors.mobs.bosses.firemagicdied.wave_1=Победи меня %s, избавь этот каньон от зла.
actors.mobs.bosses.firemagicdied.wave_2=А на что ты %s еще способен?
actors.mobs.bosses.firemagicdied.wave_3=Теперь я буду внимательней с тобой, %s!
actors.mobs.bosses.firemagicdied.defeated=Ты %s действительно избранный, теперь я приму тебя!
