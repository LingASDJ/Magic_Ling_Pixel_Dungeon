actors.mobs.shieldhuntsman.death_msg_5 = Будь ты проклят!
actors.mobs.shieldhuntsman.death_msg_6 = Защитить хрустальный город...
actors.mobs.shieldhuntsman.death_msg_7 = Будь ты проклят, чудовище!
actors.mobs.shieldhuntsman.death_msg_8 = Аххх...
