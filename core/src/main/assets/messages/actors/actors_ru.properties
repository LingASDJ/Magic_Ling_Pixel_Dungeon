actors.mobs.bosses.firemagicdied.redlotus_count=红莲业火 将在%d 回合后降临！
actors.mobs.bosses.firemagicdied.redlotus_save=浊焰核心被摧毁，翻腾的怒焰声势渐弱……
actors.mobs.bosses.firemagicdied.redlotus_hit=红莲业火灼伤了你的灵魂！
actors.mobs.bosses.firemagicdied.redlotus_kill=红莲真火，将他烧尽！
actors.mobs.bosses.firemagicdied.core_name=сердцевина темного пламени
