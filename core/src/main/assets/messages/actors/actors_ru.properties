levels.rooms.special.boilerroom$candleactivepoint.desc=Кажется, этот подсвечник, что-то делает... Попробуйте его коснуться...

levels.rooms.special.boilerroom$boilertilemap.name=камин
levels.rooms.special.boilerroom$boilertilemap.desc=Здесь размещен таинственный камин, где посередине стоит подсвечник... Кажется, он стоит здесь для какой-то цели...\n 

levels.rooms.special.boilerroom.yell=Соглашение для принятия испытания исполнено, теперь Он ждет вашего прибытия...
levels.rooms.special.boilerroom.yell2=У вас нахватает осколков душ, чтобы разжечь камин...

actors.mobs.bosses.hollow.morphs.name=Морфей
actors.mobs.bosses.hollow.morphs.desc=Истинный хозяин старинного замка, а также один из безымянных Внешних Богов. \n\nОн возжелал сделать вас Богом, но вы воспротивились ему!\n\nПоскольку вы увидели лик Бога, он не может позволить вам остаться в живых! Теперь вам предстоит встретиться с ним лицом к лицу.\n\n<#772F9C>Он полностью неуязвим, но его тело может быть ослаблено, при уничтожении близлежащих колонн. <RGB>
actors.mobs.bosses.hollow.morphs.notice=Присоединяйся ко мне %s для последнего выступления среди бескрайного моря звезд!
actors.mobs.bosses.hollow.morphs.four_tone_active=Древние боги приближаются, все живые существа обезумели...
actors.mobs.bosses.hollow.morphs.phase_tone_active=Погружение во тьму, пересекая звезды...
actors.mobs.bosses.hollow.morphs.endtalk=Ты действительно потрясающий человек. Поговори со мной, чтобы завершить это удивительное путешествие!

actors.mobs.bosses.hollow.mycoreheart.name=Сердце Вселенной
actors.mobs.bosses.hollow.mycoreheart.desc=Огромная сердцевина, содержащая тайны и энергию вселенной.\n\nМорфей желает осквернить ядро ​​и использовать его в своих целях. Мы не должны остановить его!\n\nСоюзники ​​(кроме героя) атакующие сердцевину, мгновенно наносят большой урон с кровотечением. Урон, наносимый Сердцу Вселенной, всегда фиксирован и равен 1 единице урона при любом ударе.\n\nПочинка всех космических колонн полностью перезагружает Сердце Вселенной, а каждая 5-я отбитая волна, даёт возможность отремонтировать одну колонну!
actors.mobs.bosses.hollow.mycoreheart.gethp=Я был свидетелем вашей доблестной защиты; Сердце Вселенной, кажется, резонирует вам...
actors.mobs.bosses.hollow.mycoreheart.not_count=Вы не можете отремонтировать колонну. Отразите больше волн врагов, чтобы получить возможность!!! - Отремонтировано колонн: %s.

actors.mobs.bosses.hollow.mycoreheart.repaier=Хотите отремонтировать эту космическую колонну? Процесс ремонта займет 25 ходов. После успешного завершения вы получите соответствующий бонус данной колонны.
actors.mobs.bosses.hollow.mycoreheart.enter_yes=Починить сейчас
actors.mobs.bosses.hollow.mycoreheart.enter_no=Починить попозже

actors.mobs.bosses.hollow.mycoreheart$repaierdown.name=перезагрузка
actors.mobs.bosses.hollow.mycoreheart$repaierdown.desc=Эта колонна отремонтирована, но ей всё ещё требуется внутренняя перезагрузка. После завершения ремонта вы и Сердце Вселенной получите полезный усиливающий эффект!\n\nХодов осталось до перезагрузки: %s.

actors.mobs.bosses.hollow.mycoreheart$summoncolddown.name=призрачное вторжение
actors.mobs.bosses.hollow.mycoreheart$summoncolddown.desc=Призраки прошлого пытаются уничтожить Сердце Вселенной!\n\nХодов до следующей волны: %s.\n\nВ следующей волне появятся враги из %s-го этажа. 
actors.mobs.bosses.hollow.mycoreheart$summoncolddown.active_skills=Следующая волна

actors.mobs.bosses.hollow.bad.towergodsbad.name=поврежденная колонна божества
actors.mobs.bosses.hollow.bad.towergodsbad.name_x=восстановленная колонна божества
actors.mobs.bosses.hollow.bad.towergodsbad.desc=Высокая каменная колонна, изображающая лик Святого Креста.\n\n_Эта колонна повреждена, но после восстановления она будет давать герою постоянный эффект перезарядки артефактов._
actors.mobs.bosses.hollow.bad.towergodsbad.desc_x=Высокая каменная колонна, изображающая лик Святого Креста.\n\n_Эта колонна была полностью восстановлена, и теперь она дает герою постоянный эффект перезарядки артефактов._

actors.mobs.bosses.hollow.bad.towertimebad.name=поврежденная колона времени
actors.mobs.bosses.hollow.bad.towertimebad.name_x=восстановленная колонна времени
actors.mobs.bosses.hollow.bad.towertimebad.desc=Высокая каменная колонна, изображающая подобие искаженного времени.\n\n_Эта колонна повреждена, но после восстановления она будет давать герою периодически ускорение, и иногда будет калечит врагов._
actors.mobs.bosses.hollow.bad.towertimebad.desc_x=Высокая каменная колонна, изображающая подобие искаженного времени.\n\n_Эта колонна была полностью восстановлена, и теперь она дает герою периодически ускорение, и иногда калечит врагов._

actors.mobs.bosses.hollow.bad.towermachinebad.name=поврежденная колонна механизмов
actors.mobs.bosses.hollow.bad.towermachinebad.desc=Высокая каменная колонна, изображающая подобие зубчатого механизма.\n\n_Эта колонна повреждена, но после восстановления она будет давать герою периодически адреналин, и иногда будет накладывать на врагов уязвимость._
actors.mobs.bosses.hollow.bad.towermachinebad.name_x=восстановленная колонна механизмов
actors.mobs.bosses.hollow.bad.towermachinebad.desc_x=Высокая каменная колонна, изображающая подобие зубчатого механизма.\n\n_Эта колонна была полностью восстановлена, и теперь она дает герою периодически адреналин, и иногда накладывает на врагов уязвимость._

actors.mobs.bosses.hollow.bad.towermindbad.name=поврежденная колонна разума
actors.mobs.bosses.hollow.bad.towermindbad.desc=Высокая каменная колонна, изображающая непостоянство мыслей.\n\n_Эта колонна повреждена, но после восстановления она будет давать герою периодически очищающий барьер, и иногда будет оглушать врагов._
actors.mobs.bosses.hollow.bad.towermindbad.name_x=восстановленная колонна разума
actors.mobs.bosses.hollow.bad.towermindbad.desc_x=Высокая каменная колонна, изображающая непостоянство мыслей.\n\n_Эта колонна была полностью восстановлена, и теперь она дает герою периодически очищающий барьер, и иногда оглушает врагов._

actors.mobs.bosses.hollow.towergods.name=колонна божества
actors.mobs.bosses.hollow.towergods.desc=Высокая каменная колонна, изображающая лик Святого Креста.\nЗдесь зародились боги и сюда ведут пути всех паломников.\n«Боги - воплощение воли и властители над Вселенной».\nВселенная безмолвна, и только боги способны раскрыт вам правду. Не сомневайтесь из-за своей ничтожности, а решительно ступайте по их следам.\n\nТе, кто пришел сюда издалека, не верьте в эту высокомерную ложь.\nЭто Божество высокого мнения о себе, но не осознает, что он также ничтожен во Вселенной.\nУничтожите это высокомерное Божество, чтобы вернуть веру в настоящего Бога.

actors.mobs.bosses.hollow.towertime.name=колонна времени
actors.mobs.bosses.hollow.towertime.desc=Высокая каменная колонна, изображающая подобие искаженного времени.\nЗдесь стекаются потоки прошлого, передающие память о Вселенной.\n«Время - единственное неизменное во Вселенной».\nВремя следует вместе со Вселенной с тех пор, как у нее появилась память. От той стороны времени до этой оно по-прежнему движется вперед безмолвно.\n\nТе, кто пришел сюда издалека, не позволяйте себя обмануть его внешностью.\nВремя никогда не говорит само за себя, парадокс - это ложь Богов.\nУничтожите эту иллюзию, чтобы вернуть первичный ход времени.

actors.mobs.bosses.hollow.towermachine.name=колонна механизмов
actors.mobs.bosses.hollow.towermachine.desc=Высокая каменная колонна, изображающая подобие зубчатого механизма.\nКолонна выражает порядок переплетения шестеренок, демонстрируя колоссальную энергию первобытного ритма.\n«Механизмы - символ технологии и порядка».\nВселенная, в которой нет увеличения энтропии, пуста и хаотична, и только порядок способен указать правильный путь для всего во Вселенной.\n\nТе, кто пришел сюда издалека, не восхищайтесь этому бесполезному творению.\nМеханизмы возникли благодаря человеческой изобретательности, а не благодаря богам, и порядок поддерживается самим собой.\nУничтожите это украденное творение, чтобы снова вернуть порядок во Вселенной.

actors.mobs.bosses.hollow.towermind.name=колонна разума
actors.mobs.bosses.hollow.towermind.desc=Высокая каменная колонна, изображающая непостоянство мыслей.\nЗдесь собирается духовный свет со всей Вселенной, передающий мысли и идеи всех существ.\n«Разум - величайшая сила во Вселенной».\nКогда-то давно материя господствовала над Вселенной. Все началось с идеи, затем Вселенная обрела собственный разум и волю, и по-настоящему ожила.\n\nТе, кто пришел сюда издалека, противитесь его мыслям.\nБоги навязывают свои мысли во Вселенной, и все, что они говорят, на самом деле обман.\nУничтожите этот обман, чтобы вернуть голос Вселенной.

actors.mobs.bosses.hollow.yogsoul$attackdamagemagic.name=злоба глубокого космоса
actors.mobs.bosses.hollow.yogsoul$attackdamagemagic.desc=Злоба Йог-Сотота овладела Шуб-Ниггурата, Ньярлатотепа и Его самого.\n\nВраги в радиусе 7x7 вокруг них будут получать _4 ед. вреда внутреннего демона_ каждый ход.\n\nХодов осталось: %s.

actors.mobs.bosses.hollow.shubniggurath$diedgalaxy$bombitem.name=Камень Порядка
actors.mobs.bosses.hollow.shubniggurath$diedgalaxy$bombitem.desc=Все мудрецы знают, что каждый символ имеет смысл, и этот присущий здесь из них... Эта сила неописуема, невыразима и находится за пределами людского понимания; она существует только под покровом, скрывающим её суть, в неких сказаниях и преданьях.
actors.mobs.bosses.hollow.shubniggurath$diedgalaxy$bombitem.cant_pickup=Вы не можете подобрать этот камень порядка.

actors.mobs.bosses.hollow.nyarlathotep.name=Ньярлатотеп
actors.mobs.bosses.hollow.nyarlathotep.desc=За пределами миров — смутные тени чудовищных фигур; едва различимые колонны неосвященных храмов, покоящиеся на безымянных скалах у основания космоса и достигающие головокружительной пустоты над сферами света и тьмы. И посреди этого вертящегося кладбища Вселенной — приглушенный, сводящий с ума барабанный бой и пронзительное, монотонное завывание кощунственных флейт из непостижимых, лишенных света пространств за пределами Времени; омерзительное биение и свист, под аккомпанемент которых медленно, неуклюже и нелепо танцуют гигантские, сумрачные первоначальные боги — слепые, безгласные, безумные гаргульи, чья душа — Ньярлатотеп.\n\nЭто лишь одно из его воплощений в этой вселенной, а его истинная душа давно покинула этот мир. Он использует его, чтобы сеять хаос и распространять безумие...\n\n_При атаке Ньярлатотеп имеет 50% шанс создать случайную, нескрытую ловушку на арене (за исключением ловушек, перемещающих между этажами).\nГерой при наступлении на ловушку, получает 10 ед. вреда внутреннего демона. (удваивается до 20 единиц).\nБлижние атаки Ньярлатотепа наносят 7-14 ед. вреда внутреннего демона.\nКогда Ньярлатотеп теряет цель, он телепортируется в случайное место на арене каждые 3 хода.\n\nИстинный внутренний демон (пассивная способность): пока Ньярлатотеп находится на арене, герой получает двойной урон от вреда внутреннего демона, и каждый раз, когда герой получает урон от него, он также получает магический урон, равный 50-100% урона от вреда внутреннего демона. Магический урон, наносимый способностью «Истинный внутренний демон», восстанавливает эквивалентное количество здоровья всем врагам на арене._

actors.mobs.bosses.hollow.yogsoul.name=Йог-Сотот
actors.mobs.bosses.hollow.yogsoul.desc=Йог-Сотот знает Врата. Йог-Сотот и есть Врата. Йог-Сотот это и Страж врат и Ключ к ним. Прошлое, настоящее и будущее слились воедино в нём. Он знает, где Древние совершили прорыв в прошлом, и где Они явятся вновь. Он знает, где Они ступали по Земле, и где Они всё ещё ступают, и почему никто не может увидеть Их там. Обиталище Их как раз там, где порог, что ты охраняешь. Йог-Сотот - вот ключ к тем воротам, где встречаются сферы.\n\nЭто лишь одно из его воплощений в этой вселенной, а его истинная душа давно покинула этот мир. Он использует его, чтобы навязывать порядок и увековечивать законы...\n\n_Когда у Йог-Сотота в ближнем бою отсутствует цель, он постоянно применяет заклинания, активируя следующие эффекты через фиксированное количество ходов:\nКаждые 5 ходов увеличивает начальное максимальное здоровье всех союзников на 5% и мгновенно восстанавливает 5% от их максимального здоровья.\nКаждые 10 ходов накладывает на всех союзников на арене ауру «Разрушение разума», которая в радиусе 7x7 вокруг носителя, наносит 4 ед. вреда внутреннего демона каждый ход в течении 5 ходов.\nКаждые 15 ходов восстанавливает 10-20% от своего максимального здоровья в зависимости от потерянного здоровья._

actors.mobs.bosses.hollow.shubniggurath.name=Шуб-Ниггурат
actors.mobs.bosses.hollow.shubniggurath.desc=Она - мать всего сущего, супруга Невыразимого. Говорят, что она породила почти всех Древних богов, включая Ктулху, да и всю жизнь в целом. Более того, с ней могут быть связаны все заклинания исцеления, восстановления или поддерживающие жизнь.\n \nЭто лишь одно из его воплощений в этой вселенной, а его истинная душа давно покинула этот мир. Он использует его, чтобы сеять чуму и распространять отчаяние...\n\n_При физической атаке Шуб-Ниггурат разделяется на две сущности, каждая из которых наследует все механики и половину здоровья от исходного.\nЕсли Шуб-Ниггурат не получает урон в течение 8 ходов, он разделяется один раз, при этом оба клона наследуют полное здоровье оригинала.\nШуб-Ниггурат не наносит основной урон, но если разделение происходит в поле зрения героя, герой получает 8 ед. вреда внутреннего демона.\nПока существуют клоны Шуб-Ниггурата, первичная сущность не неуязвима, и когда его здоровье опускается до 0 ОЗ, оно мгновенно восстанавливается до 1000 ОЗ. После 5 раз восстановлений здоровья первичная сущность перестает разделятся, а его гибель, уничтожает всех клонов на поле боя.\nОдновременно может существовать максимум 18 сущностей Шуб-Ниггурата. При превышении этого предела, он больше не может разделятся на новых клонов._

actors.mobs.mob.name_old=Призраки прошлого
actors.mobs.mob.desc_old=Монстры, призванные Морфеем, очень похожи на тех, что обитают в подземелье. Однако их основная цель — Сердце Вселенной. Вы должны защитить Сердце Вселенной любой ценой!

actors.mobs.bosses.hollow.towermachine$starcanon.name=звёздный метеор
actors.mobs.bosses.hollow.towermachine$starcanon.desc=Метеориты, выстреливаемые колонной механизмов, похожи на взрыв звезды. Однако из-за возраста колонны мощность взрыва метеорита снизилась. Хотя метеорит уже не похож на взрыв звезды, убить несколько обычных существ все еще способен.\n\nВы все еще читаете это описание? Беги отсюда, глупец! Иначе дождешься здесь своей смерти!
actors.mobs.bosses.hollow.towermachine.starcanon_kill=Вас разнесло на куски мощным метеоритом, рассеяв вас в космосе...

actors.mobs.bosses.hollow.towertime$dreamfireghost.name=призраки звездного неба
actors.mobs.bosses.hollow.towertime$dreamfireghost.desc=Колона времени створяет мстительных призраков, которые могут наносить урон с фосфорным огнем.

actors.mobs.bosses.hollow.towermachine$deadalive.name=воскрешенный мертвец
actors.mobs.bosses.hollow.towermachine$deadalive.desc=Это существо было воскрешено с помощью колонны механизмов, но из-за недостаточной силы внутри колонны, оно вскоре вернется в небытие.\n\nЭто существо умрет, через %s ходов.

actors.mobs.bosses.hollow.towermachine$machineattackcooleddown.name=перезарядка механизма
actors.mobs.bosses.hollow.towermachine$machineattackcooleddown.desc=Колонны механизмов перезаряжает свой механизм и в этом момент не способна атаковать.\n\nКолонны будет полностью готова, через %s ходов.

actors.mobs.bosses.hollow.towergods$attackup_palf.name=божественный приговор
actors.mobs.bosses.hollow.towergods$attackup_palf.desc=Колонна божества дарует вам силу, которая увеличивает ваш урон на 50%%.\n\nХодов осталось: %s.

actors.mobs.bosses.hollow.double_towergods$attackup_palf.name=божественное правосудие
actors.mobs.bosses.hollow.double_towergods$attackup_palf.desc=Колонна божества дарует вам силу, которая увеличивает ваш урон на 100%%.\n\nХодов осталось: %s.

actors.mobs.bosses.hollow.towermind$mindcore.name=мысль первобытного хаоса
actors.mobs.bosses.hollow.towermind$mindcore.desc=Идея хаоса побуждающая мысли первозданного хаоса, возникшего при зарождении Вселенной.\n\nЭта сущность не может погибнуть, пока не уничтожена Колонна Разума. Однако, если её здоровье опуститься до нуля, она выбросит все разоруженные предметы.
actors.mobs.bosses.hollow.towermind$mindcore.desc_items=На этой колонне находится предмет напоминающий ваше оружие: _%s_.

actors.mobs.bosses.hollow.towermind.yell_steal_item=Мысли разъедают вас %s, и вы чувствуете себя безоружным!

actors.mobs.bosses.hollow.towerparalysis.name=бездействующая коллона
actors.mobs.bosses.hollow.towerparalysis.desc=Поскольку другие колонны были разрушены, эти колонны будут в бездействии некоторое время. В этом момент столбы не смогут использовать никакие способности, а получаемый по им урон увеличится на 25 %%.\n\nХодов осталось: %s.

actors.mobs.npcs.zero.whitelingland.name=Лин
actors.mobs.npcs.zero.whitelingland.desc=Она на протяжении всех приключений неуклонно наблюдает за вами. Она тихо стоит посреди бушующей метели, где её не касается холодный ветер - вокруг нее всегда царит полное спокойствие.\n\nРаз уж вам довелось встретить её, почему бы не постараться поговорить с ней?
actors.mobs.npcs.zero.whitelingland.message1=Здравствуй, %s. Добро пожаловать снова в Снежный город.
actors.mobs.npcs.zero.whitelingland.message2=Я наблюдала, как ты сталкивался с трудностями в подземелье, противостоял Древним богам и противостоял вторжениям извне…\n\nТы проявлял настоящую храбрость на протяжении всего этого пути.
actors.mobs.npcs.zero.whitelingland.message3=Хм, похоже, я проговорилась, но ты, наверняка, уже сам догадался, кто я, не так ли?
actors.mobs.npcs.zero.whitelingland.message4=Когда-то я была частью божества; изначально Донлин была источником ледяной силы в этом мире, и именно я своим руками создала её такой, какой она является сейчас.
actors.mobs.npcs.zero.whitelingland.message5=Пусть здесь и бушует снежная буря, она вовсе не опасна ни тебе %s, ни мне… Мы обязаны продолжить расследование. Эта палочка дар тебе, а что касается остального снаряжения - считай, что это скромной платой за твои услуги.

actors.mobs.npcs.zero.whitelingland.a_message5=Да, кстати, нам суждено было встретиться. У меня есть некое ожерелье, которое я хочу подарить тебе. Прошу, носи его, надеюсь, даже малая сила в нем поможет тебе.
actors.mobs.npcs.zero.whitelingland.b_message5=Думаю эта вещь поможет тебе, и надеюсь она сможет принести, хоть какую-нибудь пользу.
actors.mobs.npcs.zero.whitelingland.message6=Тебе уже пора, увидимся в следующий раз %s, и желаю удачи...
actors.mobs.npcs.zero.whitelingland.c_message1=Она перестала обращать на вас внимание и выглядит так, будто в полудреме...
actors.mobs.npcs.zero.whitelingland.c_message2=Кристаллические частицы витают вокруг нее, словно защищая её.
actors.mobs.npcs.zero.whitelingland.c_message3=Лучше оставить её в покое...
actors.mobs.npcs.zero.whitelingland.def_verb_1=Пусть этот мир поможет тебе...
actors.mobs.npcs.zero.whitelingland.def_verb_2=Сможешь ли ты спастись?

actors.buffs.status.ankhcount.name=Утрата возрождения
actors.buffs.status.ankhcount.desc=Вас прокляла ведьма, и все анхи возрождения, которые вы держали в руке, были забраны ею. Вы можете вернуть их только после смерти или одолев ведьму. Более того, все анхи потеряют свой благословленный эффект после возврата.\n\nТекущее анхи: %s.

actors.buffs.status.whiteblastswordstatus.name=Белогривая волна
actors.buffs.status.whiteblastswordstatus.desc=Наносит физический урон вокруг героя, равный атаке 120%% ед. силы, оглушая всех врагов в пределах на 8 ходов, затем отравляя на %s ед. всех оглушенных врагов.
actors.buffs.status.whiteblastswordstatus.active_skills=Применить способность

actors.mobs.npcs.hollow.slicegirl.name=Юцзи
actors.mobs.npcs.hollow.slicegirl.desc=Молодая женщина, одетая в роскошную одежду, кажется, пространно смотрит на вас, но почему-то вы не можете разглядеть её глаза.
actors.mobs.npcs.hollow.slicegirl.message1=Прошу, подожди одну секунду...
actors.mobs.npcs.hollow.slicegirl.message2=Ты путешественник?
actors.mobs.npcs.hollow.slicegirl.choice1=(Кивок)
actors.mobs.npcs.hollow.slicegirl.message3=Путешественник, ты должен остановить Морфея...
actors.mobs.npcs.hollow.slicegirl.message4=Этот старинный замок может быть лишь началом его замысла; никто не знает, какие ужасные вещи он может еще совершить!
actors.mobs.npcs.hollow.slicegirl.choice2=(Спрашиваешь, как её зовут)
actors.mobs.npcs.hollow.slicegirl.message5=Можешь звать меня как сам пожелаешь, но лучше Юцзи.
actors.mobs.npcs.hollow.slicegirl.message6=Путешественник, мы должны поторопиться. Мое благословение поможет тебе; я буду ждать тебя в глубинах подземелья...

actors.buffs.status.slicedeadbless.name=благословение Юцзи
actors.buffs.status.slicedeadbless.desc=После разговора с девушкой по имени Юцзи, вы получили от неё благословение, но пока не чувствуете, что оно несет какую-либо пользу...
actors.buffs.status.slicedeadbless.desc_plus1=Вы чувствуете мощную энергию вокруг себя, которая со временем создает удар молнии по ближайшему врагу, наносящий _%s ед. урона_.
actors.buffs.status.slicedeadbless.desc_plus2=Вы чувствуете, как будто летите как ветер, обретая бонус к скорости передвижения в 1,25 раза.
actors.buffs.status.slicedeadbless.desc_plus3=Вы чувствуете, что обладаете огромной силой, обретая временный бонус к силе +3.
actors.buffs.status.slicedeadbless.desc_plus4=Когда вы окажетесь отчаянной ситуации, вы обретете спасение...\n\n[???]
actors.buffs.status.slicedeadbless.desc_cooldown=Ходов до перезарядки удара молнии: %s.
actors.buffs.status.slicedeadbless.bless=Текущая сила благословения: %s.

actors.mobs.npcs.hollow.slicealter.name=???
actors.mobs.npcs.hollow.slicealter.desc=На каменном пьедестале стоит предмет, напоминающий человеческую фигуру.\n\nДля чего она используется?
actors.mobs.npcs.hollow.slicealter.message1=Ах, путешественник, что с тобой?
actors.mobs.npcs.hollow.slicealter.message2=Я чувствую легкое головокружение...
actors.mobs.npcs.hollow.slicealter.message3=Давай немного отдохнем здесь. Похоже, его магия стала сильнее.
actors.mobs.npcs.hollow.slicealter.message4=А, ты ничего не чувствуешь?
actors.mobs.npcs.hollow.slicealter.message5=...

custom.utils.plot.hollow.slicedogplot.message1=Черт возьми! Что здесь делает Цербер?
custom.utils.plot.hollow.slicedogplot.message2=Кажется, он здесь отдыхает.
custom.utils.plot.hollow.slicedogplot.message3=Цербер тихо лежит на земле, словно спит.

### Holiday Event
custom.utils.gregorian.dwj=Праздник драконьих лодок
custom.utils.gregorian.dwj_desc=Во время события "Праздник драконьих лодок" в подземелье генерируются различные виды - _Цзунцзы _.\n\nИгроки, которые еще не победили Мурлока, могут попасть к нему через тролль-кузнеца, а игроки, которые уже победили Мурлока, больше не смогут попасть к нему.\n\n<#299947>Желаю вам счастливого Праздника драконьих лодок! Развлекайтесь! <RGB>

custom.utils.gregorian.hween=Тайна старинного замка
custom.utils.gregorian.hween_desc=За пределами подземелья тихо взошла <#F00>зловещая кровавая луна. <RGB>Гильдия путешественников обнаружила необычную активность в глубинах подземелья. Гильдия просит всех срочно отправится на разведку!\n\n<#6E2E95>Первая глава события «Старинный замок» уже открыта! Развлекайтесь! <RGB>\n\n<#FF8400>Во время Кровавой луны активируется событие «Старинный замок», в котором все пироги заменяются на тыквенные пироги. <RGB>\n\nПутеводитель по входу в замок:\n1. Охотьтесь на души чемпионов на каждом определенном этаже. Души чемпионов появляются на _4, 9, 14, 19 и 23_ этажах. Примечание: если вы пропустите предыдущие души чемпионов, последующие всё равно будут появляться, однако из-за пропуска предыдущих, у вас не будут собраны необходимые виды осколков душ, чтобы открыть доступ к Старинному замку.\n2. Соберите пять осколков душ в свой рюкзак, и отправляйтесь в таинственную комнату на 24-м этаже, чтобы войти в синергию с осколками душ для прохода барьера в Старинный замок.\n\nПутеводитель по прохождению замка:\n_-_ Пройдите концовку «Ужас Стикса» хотя бы один раз, чтобы открыть скрытый проход на 27-м этаже. После разблокировки, продолжите путешествие через скрытый проход, чтобы начать вторую историю о старинном замка для получения альтернативной концовки.

custom.utils.gregorian.none=Активное событие
custom.utils.gregorian.none_desc=В настоящее время нет ни одного активного события, либо при запуске игры возникла проблема с сетью.\n\nЕсли это повторяется, пожалуйста, убедитесь, что у вас стабильное подключение к Интернету, прежде чем запускать игру, чтобы получить последние данные о событии.
custom.utils.gregorian.remaining_days=Осталось дней: %s.
custom.utils.gregorian.remaining_full=%s час. %s мин. %s сек.

custom.utils.gregorian.dev_birthday=День рождения Лин
custom.utils.gregorian.dev_birthday_desc=Спасибо за поддержку Magic Ling Pixel Dungeon!\n\nВо время события, посвященного дню рождения Лин, в начале игры, вы получите 1 случайную полезную безделушку, 2 бутылки Ядер-Колы и 1 освященный анх.\n\nВ гостинице иногда можно встретить NPC торговца Лин, а количество выпадающих кобальтовых монет из боссов удваивается.

custom.utils.gregorian.cyj=Праздник двойной девятки
custom.utils.gregorian.cyj_desc=Событие еще в разработке...

custom.utils.gregorian.mej=Приглашение на ужин
custom.utils.gregorian.mej_desc=Играйте во время этого события за _чародея_ и победите Генерала Дворфов, чтобы получить эксклюзивный скин «Вечерний банкет».\n\nПосле окончания события этот скин можно будет приобрести за 1500 кобальтовых монет в следующем обновлении.


custom.utils.gregorian.gqj=День образования КНР
custom.utils.gregorian.gqj_desc=<#ffff00>Наша прекрасная Родина украшена великолепием, и огни тысячи домов озаряют её ночью; Вместе мы желаем Китаю вечного благополучия, чтобы страна процветала, а её народ жил в мире долгие годы! <RGB>\n\nВо время празднования Дня независимости на 0-м этаже, будут появляться 2 ящика с сюрпризом и 1 эликсир могущества.\n\nКроме того, еда восполняет +30 очков сытости, но не во время активного испытания _На диете_.\n\n<#f00>Своим преданным вкладом мы отдаем дань уважения Партии, а своей борьбой мы отдаем дань уважения Эпохе. Славься наша великая Родина! С Днём рождения! <RGB>

custom.utils.gregorian.zqj=Праздник середины осени
custom.utils.gregorian.zqj_desc=<#ffff00>В эту прекрасную ночь, когда яркая луна висит высоко, излучая свой прекрасные лучи, Праздник середины осени встречает вас. Пусть этот праздник принесет вам удачу, пусть луна будет полной, пусть все люди воссоединятся, и пусть всё будет прекрасно! <RGB>\n\nВо время Праздника середины осени становится доступно особое задание у Печального призрака. За его выполнение вы получите специальную медаль ограниченного выпуска.

custom.utils.gregorian.cj=Пять лет вместе
custom.utils.gregorian.cj_desc=Мы на протяжении пяти лет шли рука об руку, преодолевая испытания и невзгоды, и вместе добивались успехов. Новый путешествие уже началось. Давайте и впредь будем действовать сообща, стремясь к еще более светлому будущему.\n\nИзменения внесение событием:\n_-_ Новогодний специальный сюжет у Фаины.\n_-_ Победа над боссом удваивает шанс выпадения кобальтовых монет.\n_-_ Генерация пирога заменена на рыбу на пару с лотосом.\n_-_ Возвращение события «Персиковый источник», при спуске ниже 13-го этажа, в подземелье существует 55% шанс появления комнаты с Персиковым источником.

custom.utils.gregorian.pqj=Персиковый источник
custom.utils.gregorian.pqj_desc=В глубинах подземелья с 55% шансом появляется «Комната Персикового источника».\n\nПолучайте вознаграждение, потратив кобальтовые монеты, чтобы сделать свое приключение еще ярче!

custom.utils.gregorian.yx=Праздник фонарей
custom.utils.gregorian.yx_desc=Это событие будет добавлено в следующих обновлениях.

custom.utils.gregorian.qmj=Весенние грезы
custom.utils.gregorian.qmj_desc=节日的氛围散去了，一切回归日常。对地牢的调查仍未结束，更多谜团尚未解开……\n\n_-_ 神秘怪物回归，每层有概率生成，击败后获得特殊补给\n_-_ 献祭房的装备保底+1\n_-_ 肉馅饼将被替换为清明特殊食物青丸\n_-_ 商人将售卖 复活节蛋，开封后获得随机补给/随机怪物/随机精英Buff\n\n梦醒时分，她尚未远去……

custom.utils.gregorian.msj=Благодарность за преданность
custom.utils.gregorian.msj_desc=Уже прошло пять с половиной лет с момента нашей первой встречи, и Magic Ling существует благодаря вам. Этим праздником мы хотим поблагодарить каждого путешественника за то, что вы с нами.\n\n_-_ В глубинах подземелья вновь появляется изумрудный мимик.\n_-_ Снаряжение с жертвенного алтаря теперь всегда имеет уровень\n_-_ В тайном Персиковом источнике вновь открыты врата для молитвы.

custom.utils.gregorian.no_activity=Нет событий
custom.utils.gregorian.end_activity=Событие завершено

actors.buffs.championenemy$deadsoulcrack.name=Душа чемпиона
actors.buffs.championenemy$deadsoulcrack.desc=Души чемпионов неуязвимы ко всем газам и оставляют после своей смерти осколки душ.

actors.mobs.npcs.hollow.cerbussleep.name=Спящий Цербер
actors.mobs.npcs.hollow.cerbussleep.desc=Здесь спит большая собака. Лучше не нарушать её сон...
actors.mobs.npcs.hollow.cerbussleep.sleep=Цербер тихо лежит на земле, словно спит.
actors.mobs.npcs.hollow.cerbussleep.touch_good=Вы нежно погладили Цербера и его шерсть такая теплая, но он, похоже, не особо реагирует.
actors.mobs.npcs.hollow.cerbussleep.touch_dog=Цербер выглядит довольно раздраженным...

actors.mobs.hollow.minigame.ghost_anger.name=красный призрак
actors.mobs.hollow.minigame.ghost_anger.desc=Патрулируя лабиринт, он будут пристально преследовать вас, так как вы представляете угрозу для этого места!

actors.mobs.hollow.minigame.ghost_pink.name=розовый призрак
actors.mobs.hollow.minigame.ghost_pink.desc=Патрулируя лабиринт, он предпочитает держатся в компании других призраков.

actors.mobs.hollow.minigame.ghost_smart.name=оранжевый призрак
actors.mobs.hollow.minigame.ghost_smart.desc=Патрулируя лабиринт, трудно предсказать, как он будет двигаться дальше. К счастью, иногда он путешествует с другими призраками.

actors.mobs.hollow.minigame.ghost_junko.name=голубой призрак
actors.mobs.hollow.minigame.ghost_junko.desc=Патрулируя лабиринт, он благодаря своей сообразительности, иногда объединяется с красным призраком, чтобы окружить противника с нескольких сторон.

levels.hollow.moveboxhollowactorlevel$box.name=ящик
levels.hollow.moveboxhollowactorlevel$box.desc=Ящик, который можно толкать в любое положение по прямой линии, как в классической игре Sokoban.

levels.rooms.hollow.locked.goldmobsroom$guard.name=патрулирующий гнолл
levels.rooms.hollow.locked.goldmobsroom$guard.desc=Этот гнолл патрулирует свою собственную территорию с сокровищами. Если он вас обнаружит, вас ждёт ожесточенная схватка.

actors.mobs.hollow.allsearch.shadowhunstman.name=теневой следопыт
actors.mobs.hollow.allsearch.shadowhunstman.desc=Это полностью обезумевший следопыт, может непрерывно восстанавливать свое здоровье, а получая немагический урон, он отражает 20% урона обратно врагу. Трудно представить, что такое существо может существовать здесь.

levels.rooms.hollow.utils.mobsutilsroom$redgolem.name=красный голем
levels.rooms.hollow.utils.mobsutilsroom$redgolem.desc=Големы - попытка исправить изъяны дворфского оборудования путем новооткрытого использования магии. Они намного более компактны и эффективны по сравнению с DM-300, и, в то же время, все еще весьма смертельны.\n\nОгненные големы отличаются от обычных тем, что могут проходить сквозь двери, поскольку они более гибкие и низкие, а магия, вложенная в их дворфами, дает им возможность владеть как огнем, так и ядом.\n\nОднако его тело довольно хрупкое, что, вероятно, является основной причиной того, что он так и не был запущен в массовое производство.

levels.rooms.hollow.utils.mobsutilsroom$redsnake.name=красная змея
levels.rooms.hollow.utils.mobsutilsroom$redsnake.desc=Когда-то это существо из канализации было отправлено сюда для поддержания порядка, поскольку обладали чрезвычайно мощной парализующей магией.\n\nПожертвовав уклонением ради повышенного здоровья, и возможностью стрелять магические стрелы, которые выпускают парализующий газ.

levels.rooms.hollow.utils.mobsutilsroom$redtorchhuntsman.name=красный следопыт
levels.rooms.hollow.utils.mobsutilsroom$redtorchhuntsman.desc=Эти следопыты когда-то питались дойти до конца подземелья, чтобы положить конец кромешной тьме, но не подозревали, что их развратит темная магия, таящейся во мраке глубинах подземелья. Теперь, потеряв свой рассудок, они бродят по тюрьме, поджидая следующую несчастного путешественника, который спустится в это место.\n\nКрасные следопыты - более закаленные в боях следопыты, что делает их еще более опасными в подземелье. Будьте крайне осторожны с ними!

levels.rooms.hollow.utils.mobsutilsroom$redmagicshieldman.name=красный следопыт-щитоносец
levels.rooms.hollow.utils.mobsutilsroom$redmagicshieldman.desc=Это те следопыты, которые побывали в _хрустальном городе_, где в итоге превратились в безумцев, потеряв свой рассудок. Теперь, единственное, что привлекает их внимание - мимо проходящие путешественники.\n\nКрасные следопыты-щитоносцы - более свирепые и крепкие следопыты, которые под влиянием окружающей среды здешнего места, окончательно потеряли рассудок <#f00>различать <RGB>своих! 
levels.rooms.hollow.utils.mobsutilsroom$redmagicshieldman$deadsora.name=в неистовстве
levels.rooms.hollow.utils.mobsutilsroom$redmagicshieldman$deadsora.desc=Этот красный следопыт-щитоносец умирает, но хочет забрать вас с собой!\n\nЭтот следопыт умрет, когда закончится действие его щита, либо по истечении времени, либо от нанесенного урона. До этого он переходит на _комбо из четырёх ударов_, и продлевает свое _неистовство_, когда почти умирает, так что будьте бдительны!\n\nХодов со щитом осталось: %d.

levels.hollow.allsearchhollowactorlevel$recordtimedead.name=тайная вылазка
levels.hollow.allsearchhollowactorlevel$recordtimedead.desc=Вы начинайте вылазку, запомните главные цели миссии.\n\nВыслеживание врагов, собор награды и добычи по пути, а затем быстрая эвакуация!\n\nЗапомните следующее: вступление в бой, тщательный осмотр местности и отступление, как только все цели выполнены!\n\nХодов до обнаружения противником: %s.

levels.rooms.hollow.utils.mobsutilsroom$redspider.name=красный гигантский прядильщик
levels.rooms.hollow.utils.mobsutilsroom$redspider.desc=Эти гигантские красные и мохнатые пещерные пауки избегают прямой схватки, оставаясь на расстоянии, пока запутавшаяся в их паутине жертва медленно умирает от ядовитого укуса. Они способны выстреливать электрическую паутину на большое расстояние, поражая током всех врагов, оказавшихся в них.

levels.rooms.hollow.utils.mobsutilsroom$redshaman.name=красный древний гнолл
levels.rooms.hollow.utils.mobsutilsroom$redshaman.desc==Древнейший гнолл из стаи - достаточно взглянуть на его кровавый череп, чтобы понять, что с этим существом не стоит шутить. Он довольно опасен, так что постарайтесь не провоцировать его!

actors.buffs.status.scoreminigame.name=таблица театрального выступления
actors.buffs.status.scoreminigame.desc=Представление официально началось. Сможете ли вы завершить это грандиозное шоу до конца?
actors.buffs.status.scoreminigame.socre=Акт I - Pac-Man - Оценка выступления: %s-_%s_.\n\nАкт II - Sokoban - Оценка выступления: %s-_%s_.\n\nАкт III - AllSearch - Оценка выступления: %s-_%s_.\n\nОбщая оценка выступления: _%s_.\n\nПримечание: итоговая оценка для каждого акта подсчитывается автоматически после завершения.

windows.winallsearchstatus.fail=AllSearch - Эвакуация не удалась
windows.winallsearchstatus.success=AllSearch - Эвакуация прошла успешно
windows.winallsearchstatus.timeout=AllSearch - Время вышло
windows.winallsearchstatus.score=Общий рейтинг поиска: %s.\n\nВсего ценных предметов: %s.\n\nСобрано предметов низкой ценности: %s.\n\nСобрано предметов средней ценности: %s.\n\nСобрано предметов высокой ценности: %s.
windows.winallsearchstatus.quest=Отправить результат на оценку

levels.hollow.allsearchhollowactorlevel$pinkprism$1.name=Активировать ядро ​​телепортации?
levels.hollow.allsearchhollowactorlevel$pinkprism$1.quest_start_prompt=Как только вы активируете ядро ​​телепортации, враги нападут на вас.\n\nВы должны защищать место эвакуации. Если вы отойдете более чем на 5 клеток от ядра круга телепортации, оно автоматически отключится. _В этом случае вам придется заново активировать все точки с массивом телепортации!_
levels.hollow.allsearchhollowactorlevel$pinkprism$1.enter_yes=Активировать
levels.hollow.allsearchhollowactorlevel$pinkprism$1.enter_no=Не активировать

actors.buffs.status.activepoint.name=состояние точек телепортации
actors.buffs.status.activepoint.desc=Вам необходимо активировать две точки массива телепортации, затем добраться до места эвакуации для её обороны, чтобы после успешно эвакуироваться. После активации двух точек телепортации доберитесь до места эвакуации за 200 ходов.\n\nАктивировано точек телепортаций: %s.\n\nХодов до деактивации точек телепортаций: %s.

actors.mobs.hollow.allsearch.helpteleportpoint$1.name=Активировать этот массив телепортации?
actors.mobs.hollow.allsearch.helpteleportpoint$1.quest_start_prompt=Вы можете активировать каждую точку массива телепортации максимум _два_ раза, и вам необходимо активировать обе <#FFA500>A/B точки с массивом телепортации. <RGB>Только после этого вы сможете активировать ядро телепортации, чтобы перейти к месту эвакуации для обороны.\n\nОднако имейте в виду, что активация массива телепортации задействует сигнал тревоги, который привлечёт врагов. Вы действительно хотите активировать этот массив телепортации?\n\n_Количество активаций этой точки: %s_. После двух активаций повторная активация станет невозможной.
actors.mobs.hollow.allsearch.helpteleportpoint$1.enter_yes=Подтвердить
actors.mobs.hollow.allsearch.helpteleportpoint$1.enter_no=Отменить
actors.mobs.hollow.allsearch.helpteleportpoint.alert_warning=Сигнал тревоги об активации массива телепортации разнесся по всему подземелью, теперь к вам надвигаются еще больше врагов!

levels.hollow.allsearchhollowactorlevel$pinkprism.name=ядро круга телепортации
levels.hollow.allsearchhollowactorlevel$pinkprism.desc=Сперва вам нужно активировать два массива телепортации, тогда вы сможете активировать это ядро, но вам придется защищать его, прежде чем вы сможете эвакуироваться!
levels.hollow.allsearchhollowactorlevel$pinkprism.warning=Магический круг телепортации активирован, но его магические волны воздействуют на всю область. Защищайте точку эвакуации в течение 45 ходов, чтобы эвакуироваться!
levels.hollow.allsearchhollowactorlevel$pinkprism.end=Осталось 10 ходов до полной активации магического круга телепортации. Приготовьтесь к эвакуации!
levels.hollow.allsearchhollowactorlevel$pinkprism.go=Телепорт активирован. Нажмите на ядро телепортации, чтобы покинуть это место!
levels.hollow.allsearchhollowactorlevel$pinkprism.failed=Вы оказались слишком далеко от магического круга телепортации, поэтому процесс активации был прерван!

levels.hollow.allsearchhollowactorlevel$backtimegohome.name=активация ядра круга телепортации
levels.hollow.allsearchhollowactorlevel$backtimegohome.desc=Это ядро находится в процессе активации телепорта. В это время враги пытаются напасть и помешать совершить эвакуацию. Защищайте точку эвакуации!\n\nОсталось ходов: %s.

sprites.helpteleportpointsprites.active=Точка телепортации успешно активирована!
actors.mobs.hollow.allsearch.helpteleportpoint.used_active=Вы уже активировали эту точку телепортации и не можете активировать её снова!
actors.mobs.hollow.allsearch.helpteleportpoint.used_max_limit=Эта точка телепортации была активирована дважды и теперь не может быть активирована повторно!
actors.mobs.hollow.allsearch.helpteleportpoint.esc=Приготовьтесь к эвакуации. Зайдите в центр круга телепортации, чтобы активировать ядро телепортации и подготовиться к обороне!

custom.utils.plot.hollow.minigame.morphspacmanendplot.message1=Первый акт представления завершился.
custom.utils.plot.hollow.minigame.morphspacmanendplot.message2=Почему я не зритель, а исполнитель?
custom.utils.plot.hollow.minigame.morphspacmanendplot.message3=Приглашения ведь никогда не предназначены исключительно для зрителей, не так ли?
custom.utils.plot.hollow.minigame.morphspacmanendplot.message4a=Признай, у меня острый глаз. Ведь ты прирождённый и выдающийся актёр. Только сейчас ты сам это понял, не так ли?
custom.utils.plot.hollow.minigame.morphspacmanendplot.message4b=Но я не хотел бы, чтобы ты намеренно испортил мой замысел только по этой причине. Такое поведение вряд ли подобает настоящему путешественнику!
custom.utils.plot.hollow.minigame.morphspacmanendplot.message4c=И у тебя неплохо получается, не так ли? По крайней мере, зрители с нетерпением ждут следующего акта.
custom.utils.plot.hollow.minigame.morphspacmanendplot.message5=В любом случае, у тебе еще есть немного времени, чтобы подготовиться. Второй акт вот-вот начнется, так что постарайся изо всех сил!

custom.utils.plot.hollow.minigame.morphsmoveboxendplot.message1=Осталось всего последнее выступление. Заверши его, а затем выйди со мной на сцену!
custom.utils.plot.hollow.minigame.morphsmoveboxendplot.message2=Сумасшедший...
custom.utils.plot.hollow.minigame.morphsmoveboxendplot.message3=О, видя, как ты усердно стараешься на сцене, я пока что пропущу мимо ушей твою выходку.
custom.utils.plot.hollow.minigame.morphsmoveboxendplot.message4=Дамы и господа, вы готовы?

windows.wndpacmanreadygo.title=Акт I - Pac-Man
windows.wndpacmanreadygo.message=Пакман (Pac-Man) - был разработан японским геймдизайнером Тору Ивамани. Первоначально имел название «Puck-Man» произошёл от японской звукоподражательной формы, а его внешний вид был вдохновлён фигурой пиццы с откушенным углом и иероглифом, обозначающим «рот» (яп. 口 кути).\n\nЭто в честь 45-летия Пак-Мэна? Нет, путешественник, я искренне приглашаю вас выступить в этом театре. Однако, ради развлечения, вы можете взять с собой только четыре предмета, которые могут быть оружием/броней/кольцами/артефактами, а ваша скорость передвижения и дальность атаки станет равной 1. Я также предоставлю вам уникальную палочку Магической стрелы +10.\n\nЭто представление можно начать в любое время, когда вы будете готовы.
windows.wndpacmanreadygo.confirm=Начать первый акт

custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.name=Приглашение на второй акт
custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.desc=Молодец, путешественник. Отдохни, а потом прочти это приглашение, чтобы попасть во второй акт представления!
custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.ac_read=ПРОЧИТАТЬ

levels.hollow.moveboxhollowactorlevel$threelet_go.name=Приглашение на третий акт
levels.hollow.moveboxhollowactorlevel$threelet_go.desc=Молодец, путешественник. Отдохни, а потом прочти это приглашение, чтобы попасть в третий акт представления!
levels.hollow.moveboxhollowactorlevel$threelet_go.ac_read=ПРОЧИТАТЬ

custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.game=Акт II - Sokoban
custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.quest_start_prompt=Сокобан (Sokoban) - был разработан японским геймдизайнером Хироюки Имабаяси. Игровой процесс: игрок управляет кладовщиком, чтобы толкать ящики по лабиринту и расставлять их по специальным целевым зонам, толкать можно только по одному ящику за раз и нельзя тянуть ящики. Цель игры - разместить все ящики по обозначенным местам.\n\nВ честь 44-й годовщины Сокобана, наш второй акт будет посвящен этой замечательной игры. Цель ясна: завершить перемещение ящиков до истечения времени, а все затраченное дополнительное время будет вычитаться из очков. Вы также можете перезапустить игру, однако это сделает выступление менее совершенным и, следовательно, повлечет к вычету очков. Как только вы завершите перемещение всех ящиков или ваш счет очков опустится до нуля, представление закончится.
custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.enter_yes=Начать второй акт
custom.utils.plot.hollow.minigame.morphspacmanendplot$twolet_go.enter_no=Вернутся попозже

levels.hollow.moveboxhollowactorlevel$threelet_go.game=Акт III - AllSearch
levels.hollow.moveboxhollowactorlevel$threelet_go.quest_start_prompt=Экстракшен - это слово напоминает вам какие-нибудь игры? В финальном акте театрального представления вы отправитесь в вылазку на огромную карту, смоделированную специально для вас. Это место, где на каждом углу скрываются ужасающие монстры из разных регионов, которые стерегут многочисленные сокровища в тайниках. Только после завершения этого заключительного представления вы сможете познакомиться со мной!
levels.hollow.moveboxhollowactorlevel$threelet_go.enter_yes=Начать третий акт
levels.hollow.moveboxhollowactorlevel$threelet_go.enter_no=Вернутся попозже
