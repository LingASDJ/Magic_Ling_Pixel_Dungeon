actors.buffs.status.magicabsorb.name=калькулятор магического поглощения
actors.buffs.status.magicabsorb.desc=Подсчет промежуточного эффекта поглощения магии тестируется в режиме разработки. Этот эффект не будет отображаться в официальной версии игры.\n\nХодов до активации эффекта: %s.

### OLD BATTLEMAGE
actors.hero.herosubclass.oldbattlemage=боевой маг
actors.hero.herosubclass.oldbattlemage_desc=Боевой маг получает бонусный эффект всякий раз, когда он наносит удар в ближнем бою своим посохом, будто дополнительное зачарование. Эти эффекты зависят от палочки, которой наделён его посох, каждая палочка имеет свой собственный эффект. В дополнение к эффектам палочки, посох Боевого мага также получит 0,5 заряда каждый раз, когда маг бьет им вблизи.
actors.hero.herosubclass.oldbattlemage_short_desc=_Боевой маг_ получает бонусные эффекты, когда сражается в ближнем бою со своим посохом. Эти эффекты зависят от палочки, которой наделён его посох.

actors.hero.talent.repower_attack.title=Усиленный удар
actors.hero.talent.repower_attack.desc=_+1:_ Ближняя атака посохом Боевого мага после выстрела им нанесёт _+16% урона_ и накладывает бонусный эффект на _+50% силу_ посоха.\n\n_+2:_ Ближняя атака посохом Боевого мага после выстрела им нанесёт _+33% урона_ и накладывает бонусный эффект на _+100% силу_ посоха.\n\n_+3:_ Ближняя атака посохом Боевого мага после выстрела им нанесёт _+50% урона_ и накладывает бонусный эффект на _+150% силу_ посоха.

actors.hero.talent.charge_magic.title=Мистический заряд
actors.hero.talent.charge_magic.desc=_+1:_ Удар посохом дает Боевому магу _0.5 ходов_ перезарядки артефакта.\n\n_+2:_ Удар посохом дает Боевому магу _1 ход_ перезарядки артефакта.\n\n_+3:_ Удар посохом дает Боевому магу _1.5 хода_ перезарядки артефакта.

actors.hero.talent.shielding_block.title=Избыточный заряд
actors.hero.talent.shielding_block.desc=_+1:_ Когда посох Боевого мага полностью заряжен, его следующее использование дает владельцу _0.67 щита_ за уровень посоха.\n\n_+2:_ Когда посох Боевого мага полностью заряжен, его следующее использование дает владельцу _1.33 щита_ за уровень посоха.\n\n_+3:_ Когда посох Боевого мага полностью заряжен, его следующее использование дает владельцу _2 щита_ за уровень посоха.

### RARE MOBS
actors.mobs.rare.giantflowerslime.name=гигантский цветковый слизень
actors.mobs.rare.giantflowerslime.desc=Относительно редкий цветковый слизень, который благодаря своему внушительному размеру, накапливает своей массой тела больше растений и семян, что приводит к тому, что его атаки могут накладывать эффекты, схожие с эффектами растений.

actors.mobs.rare.newborncrab.name=новорожденный краб
actors.mobs.rare.newborncrab.desc=Молодые джунглевые крабы имеют недоразвитый панцирь, что делает их защиту более уязвимой, но при этом они быстрее и проворнее созревших крабов.

actors.mobs.rare.dm111.name=DM-111
actors.mobs.rare.dm111.desc=DM-111 - усовершенствованная модель DM-100 на самом деле является улучшенной моделью первого поколения, в то время как второе поколение именуется как DM-200. Оно обладает большей огневой мощью, более толстой броней и может накапливать электрический разряд для усмирения заключенных, однако его двигатель не был модернизирован к новому весу, что привело к снижению мобильности.
actors.mobs.rare.dm111.zap_kill=Вы были убиты молнией...

actors.mobs.rare.guardcapital.name=начальник тюремной стражи
actors.mobs.rare.guardcapital.desc=Как начальник охраны, он сильнее простой тюремной стражи, однако вместо того, чтобы использовать цепи для притягивания заключенных, он предпочитает отбрасывать их назад или отдавать приказы ближайшей тюремной страже для нанесения ударов на расстоянии.

actors.mobs.rare.verycoldrat.name=ледяная крыса
actors.mobs.rare.verycoldrat.desc=Длительное воздействие холодной среды и ледяной магии привели к тому, что магическая сила в внутри их стала бурной и крайне нестабильной, превратив их в крайне опасных существ.
actors.mobs.rare.verycoldrat$deadbombtime.name=ледяная буря
actors.mobs.rare.verycoldrat$deadbombtime.desc=Местность вокруг вас начала быстро замерзать, что-то вот-вот должно произойти.\n\nЛедяная крыса собирает вокруг себя ледяную энергию, скорее покиньте это место!

actors.mobs.rare.bloodsswarm.name=кровавый рой мух
actors.mobs.rare.bloodsswarm.desc=Из-за сильного холода кровавые мухи сбиваются в рой, чтобы согреться, поэтому передвигаются вместе. Нападение на них может разделить их, создав серьезную опасность вокруг вас.

actors.mobs.rare.ghoulplus.name=гора дворфских трупов
actors.mobs.rare.ghoulplus.desc=Масса дворфских трупов обладает неиссякаемой боевой силой, но бессильна в магии, поэтому они держатся вместе, восстанавливая силы и постоянно поглощая других дворфов.

actors.mobs.rare.warlockhead.name=верховный дворф-чернокнижник
actors.mobs.rare.warlockhead.desc=Дворф-чернокнижники -  властители дварфов, и этот их верховный лидер. Его мастерство в тёмной магии намного превосходит мастерство других чернокнижников, что позволяет ему оказывать более сильное воздействие на свою цель.

actors.mobs.rare.demonfodder.name=демон-пиршества
actors.mobs.rare.demonfodder.desc=Низшие существа в демоническом мире по своей природе слабее обычных демонов. Будучи поглощенными другими демонами, они становятся частью архидемона.
actors.mobs.rare.demonfodder.leap=Демон-пиршества готовится к прыжку!

actors.mobs.rare.spawnevil.name=рассадник зла
actors.mobs.rare.spawnevil.desc=Этот вихрь сплавов из плоти дворфов оказался более оживлённым, чем другие рассадники, а его густая кровь и смрад мертвечины, дает наилучшую пищу для демонов.
actors.mobs.rare.spawnevil.on_death=Со смертью рассадника ослабевает демоническая энергия этого места.

actors.mobs.rare.deadeye.name=глаз разрушения
actors.mobs.rare.deadeye.desc=Глаз разрушения - это разновидность злобоглаза, обладающий теми же способностями, и лучше обнаруживает врагов. \n\nЕго смертоносный взгляд гораздо разрушительнее, чем у злобоглаза, поэтому, не стоит приближаться к нему на открытой местности.
actors.mobs.rare.deadeye.disintegrate=смертоносный взгляд глаза разрушения уничтожил тебя:
actors.mobs.rare.deadeye.and=и
actors.mobs.rare.deadeye.deathgaze_kill=Вы умерли от смертоносного взгляда...

actors.buffs.hunger$hungerstats.name=голоден
actors.buffs.hunger$hungerstats.desc=Вы слышите, как от голода урчит живот, но пока не сильно.\n\nГолод постепенно усиливается, пока вы находитесь в подземелье, со временем вы начнёте сильно голодать. В этом состоянии вы начнёте терять здоровье, а не восстанавливать его.\n\nПравильное питание - это важно! Если есть лишнее здоровье, то можно немного поголодать, чтобы сохранить еду. Правильное питание позволит сохранить еду на больший срок.

actors.buffs.hunger$starvingstats.name=истощен
actors.buffs.hunger$starvingstats.desc=Вы голодны настолько, что это причиняет вам боль.\n\nГолод постепенно усиливается, пока вы находитесь в подземелье, со временем вы начнёте сильно голодать. В этом состоянии вы начнёте терять здоровье, а не восстанавливать его.\n\nПравильное питание - это важно! Если есть лишнее здоровье, то можно немного поголодать, чтобы сохранить еду. Правильное питание позволит сохранить еду на больший срок.

actors.buffs.allybuff.name=не способен быть союзником

actors.buffs.sleep.name=глубокий сон
actors.blobs.corrosivegas.name=коррозийный газ
actors.blobs.confusiongas.name=дезориентирующий газ
actors.blobs.toxicgas.name=токсичный газ
actors.blobs.brokenarmorfire.name=ничтожный газ




### 五周年
actors.mobs.npcs.zero.fiveyears.mintcat.name=Минт
actors.mobs.npcs.zero.fiveyears.mintcat.desc=Минт - любит прятаться в своём секретном убежище и тихо читать, а также весело проводить время с друзьями. Она обожает лазать по деревьям, искать приключения и всё новое и интересное. Порой она может тихонько следовать за тем, кому доверяет, но резко отвлечься на что-то другое и, подпрыгивая, убежать.\n \nЕсли вы получите от девочки небольшой подарок, пусть даже это будет неприглядный, покрытый грязью самородок, пожалуйста, примите его. Это наверняка то, что ей очень нравится и чем она хочет поделиться с другими.\n\nВо время Праздника весны она всегда надевает традиционное китайское платье, и берет плакат с надписью «Большая удача», чтобы вприпрыжку подойти каждому, и пожелать удачи на весь год.
actors.mobs.npcs.zero.mint.message1_ny=С Новым годом, %s!
actors.mobs.npcs.zero.mint.message2_ny=В подземелье полно опасностей, постарайся не наступить на ловушки и не падать в ямы~
actors.mobs.npcs.zero.mint.message3_ny=Это небольшой подарок от меня, удачной дороги! Ой, откуда я знаю твое имя? Это секрет!

actors.mobs.npcs.zero.fiveyears.sdragonblue.name=Сяолань
actors.mobs.npcs.zero.fiveyears.sdragonblue.desc=Маленькая девушка-полудракон с голубыми волосами, которая на Новый год даже переоделась в красное платье. Наверняка, она станет когда-то Императрицей Драконов, не так ли?
actors.mobs.npcs.zero.fiveyears.sdragonblue.messages1=Не забивай хорошо питаться в новом году...
actors.mobs.npcs.zero.fiveyears.sdragonblue.messages2=Не с кем поболтать… Было бы здорово, если бы кто-нибудь поговорил со мной.
actors.mobs.npcs.zero.fiveyears.sdragonblue.messages3=Не забудь вернуться живым...

actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.name=Сяомэн
actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.desc=Гость из неведомого мира...
actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.messages1=Если подумать... Может, этот зверь Ниань - тоже своего рода божество?
actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.messages2=Вот бы найти удобный момент, чтобы лопнуть этот огромный глаз, но пока Паопао здесь, я немного боюсь…
actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.messages3=Ладно-ладно, шучу! С Новым годом!
actors.mobs.npcs.zero.fiveyears.dreamlezinewyears.messages4=Почему остальные еще не пришли? Если они не придут, я всё съем! (｡ò ∀ ó｡)

actors.mobs.npcs.zero.fiveyears.mengdongxynewyears.name=Мэндун Сяюань
actors.mobs.npcs.zero.fiveyears.mengdongxynewyears.desc=Таинственный человек в плаще, который кажется, говорит о своих приключениях в подземелье...
actors.mobs.npcs.zero.fiveyears.mengdongxynewyears.messages1=С Новым годом, дружище! Вот, это тебе - новогодний набор карточек.
actors.mobs.npcs.zero.fiveyears.mengdongxynewyears.messages2=Выпали какие-нибудь редкие карты? Будет время, заходи как-нибудь сыграем в карты.
actors.mobs.npcs.zero.fiveyears.mengdongxynewyears.messages3=Эта магическая запечённая овечка очень вкусная, а если посыпать её еще и пыльцой Огнецвета, то станет еще лучше.

actors.mobs.npcs.zero.fiveyears.slylnewyears.name=Лэн
actors.mobs.npcs.zero.fiveyears.slylnewyears.desc=Никто действительно не знает, кто она такая; она всегда просто молча наблюдает за путешественниками, которые направляются в Священные джунгли...
actors.mobs.npcs.zero.fiveyears.slylnewyears.messages1=Пой песни и пей вино - испей со мной этот нектар богов, пока восточный ветер наполняет комнату теплом.
actors.mobs.npcs.zero.fiveyears.slylnewyears.messages2=В бескрайнем небе кружится нефритовая пыль (снег), тысячи деревьев украшены золотыми нитями, и на тысячи ли зажигаются фонари удачи.
actors.mobs.npcs.zero.fiveyears.slylnewyears.messages3=Золотой дракон парит среди благодатных облаков, где туман скрывает млечный путь, и ярко сияют огни.
actors.mobs.npcs.zero.fiveyears.slylnewyears.messages4=Благодатный снег сияет на вратах дворца, и торжественная музыка ждет своего часа, где молитвы о богатом урожае проносятся весенним ватером.

actors.mobs.npcs.zero.fiveyears.deepseanewyears.name=Шэньхай
actors.mobs.npcs.zero.fiveyears.deepseanewyears.desc=Тот самый паренек, который обычно околачивается у побережья, сейчас вовсю развлекается на банкете. Но если подойти поближе, можно услышать его ворчание: он сильно не доволен тем, что на праздничном столе почему-то нет его любимых пирогов.
actors.mobs.npcs.zero.fiveyears.deepseanewyears.messages1=С Новым годом!\n\nЭй неудачник, как дела у тебя в новом году? Вот держи «пирог выживальщика». Однажды я выживал три дня, когда заблудился в море. Ну теперь, надеюсь, хоть ты не заблудишься!
actors.mobs.npcs.zero.fiveyears.deepseanewyears.messages2=Если съешь мой пирог, ты окажется под моей защитой.
actors.mobs.npcs.zero.fiveyears.deepseanewyears.messages3=В новом году, не ленись, не будь таким бездельником, как я!
actors.mobs.npcs.zero.fiveyears.deepseanewyears.messages4=Пусть твое путешествие в новом году... будет настолько интересным, чтобы и мне захотелось отправиться с тобой.

actors.mobs.npcs.zero.fiveyears.luowhitenewyears.name=Лобай
actors.mobs.npcs.zero.fiveyears.luowhitenewyears.desc=Сквозь оранжевый щит, парящий в воздухе, виднеется тот самый коллекционер с рогом на голове. И как его занесло в гостиницу торговать оружием?
actors.mobs.npcs.zero.fiveyears.luowhitenewyears.messages1=В новом году снова падает снег, говорят, это добрый знак к хорошему урожаю. И блюда в этом году удались на славу.
actors.mobs.npcs.zero.fiveyears.luowhitenewyears.messages2=Тысячи огней всех домов приглашают нас с тобой вместе насладиться великолепным светом праздничных фонарей.
actors.mobs.npcs.zero.fiveyears.luowhitenewyears.messages3=Держи его при себе! Поговаривают, что он помогает избавиться от беды и несчастия, а также отгоняет злых духов и всякую нечисть.
actors.mobs.npcs.zero.fiveyears.luowhitenewyears$lfroad.name=яркий фонарь
actors.mobs.npcs.zero.fiveyears.luowhitenewyears$lfroad.desc=Искусно изготовленный квадратный фонарь.\n\nЗажгите его, чтобы осветить себе путь впереди!

actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.name=Лена
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.desc=Само собой, она выглядит в точности как та «Лена» из подземелья, и на удивление, она знает о вашем ограблении, заставляя вас чувствовать неловко в её присутствии. К счастью, это настоящая Лена, которая приняла вашу помощь и, кажется, не собирается вам мстить.\n\nС наступлением Нового года она решила отложить повседневные дела и лично приехала в Снежный городок, чтобы ненадолго воссоединиться со своей сестрой.
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages1=Эй, разве это не тот самый %s, который некоторое время почти все скупал в моем магазине?
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages2=Сегодня праздник, так что давай пока, не будет говорить о прошлом.
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages3=Знаешь, именно благодаря твоему появлению мы с сестрой смогли избежать безнадежное предназначение. И именно поэтому я сейчас здесь и наконец-то воссоединилась со своей сестрой. 
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages4=На самом деле у нас есть еще одна старшая сестра, но она находится далеко в глубинах моря. Может, однажды ты сможешь с ней познакомиться… 
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages5=Хотя сейчас мы уже не враги, но мое воплощение в подземелье может оказаться не слишком дружелюбным к тебе, так что будь осторожен.
actors.mobs.npcs.zero.fiveyears.firemagicgirlnewyears.messages6=С Новым годом, %s!  Мне еще надо поговорить с сестрой, так что не хочу тебя больше беспокоить.

actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.name=Дунлин
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.desc=Благодаря вашей помощи «Ледяная ведьма» сбросила оковы черной магии, и её истинный облик стал вашим добрым союзником. \n\nС наступлением Нового года она и её сестра смогли отложить в сторону свои заботы и ненадолго воссоединиться.
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages1=Одержимая мыслями, я спустилась в глубь подземелья, где они окончательно побудили отказаться от своей человечности и шагнуть в объятия хаоса...
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages2=Вот так я попала в ловушку Древнего Божества, лишившись своей воли, став его жалкой марионеткой.
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages3=Благодарю тебя за то, что пробудил меня от этого кошмара и за то, что помог моей сестре вновь обрести себя в её бесконечном цикле перерождений.
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages4=Прежде чем как окончательно потерять рассудок, я успела записать свои переживания в дневник. Говорят, его выпустили как книгу, получив широкую известность.
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages5=Возможно, ты уже читал её, но все же возьми еще экземпляр. Эта книга может поможет тебе разгадать тайны подземелья.
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages6=Постой, могу я попросить ещё об одном одолжении? Наша старшая сестра, отправилась в глубокое море, где от неё давно нет вестей. Если ты встретишь её, узнай, в порядке ли она. И, прошу, передай ей, что с нами всё хорошо...
actors.mobs.npcs.zero.fiveyears.icemagicgirlnewyears.messages7=Ой, что-то я заговорилась... Не хочу отнимать у тебя время! Вот возьми эти вещи, они тебе пригодятся. С Новым годом, %s!

actors.mobs.npcs.zero.fiveyears.yuyenewyears.name=Юйе
actors.mobs.npcs.zero.fiveyears.yuyenewyears.desc=Странник в синем плаще. Интересно, кто же скрывается под ним?
actors.mobs.npcs.zero.fiveyears.yuyenewyears.messages1=Все мы - реки этого города.\nМы одиноки, и сближаемся - как течение к морю.
actors.mobs.npcs.zero.fiveyears.yuyenewyears.messages2=Пройдет много лет, и мы снова вернемся сюда. Только тогда я уже не буду собой, а ты - не будешь собой.\nЦени моменты, как будущие так и прошлые, бережно храня эти незабываемые воспоминания.
actors.mobs.npcs.zero.fiveyears.yuyenewyears.messages3=Пусть время, как нежные руки, оберегает тебя, заблудший путник.

actors.mobs.npcs.zero.fiveyears.nyznewyears.name=Няруко
actors.mobs.npcs.zero.fiveyears.nyznewyears.desc=Торговец, который ведет расследование в подземелье после случая с пожаром. Сейчас здесь она в основном продает взрывчатые предметы и некоторые таинственные книги.
actors.mobs.npcs.zero.fiveyears.nyznewyears.messages1=С Новым годом!
actors.mobs.npcs.zero.fiveyears.nyznewyears.messages2=«Эй! Пустота Хаоса передает новогодний подарок!»
actors.mobs.npcs.zero.fiveyears.nyznewyears.messages3=С Новым годом! Как думаешь? ling действительно бездельник? Иначе как объяснить, почему старинный замок до сих пор не завершен...

actors.mobs.npcs.zero.fiveyears.mooncatnewyears.name=Юэхуа
actors.mobs.npcs.zero.fiveyears.mooncatnewyears.desc=Это человекоподобное существо с внешностью кошки, имеет гладкую и белоснежную шерсть. По слухам, раньше он был вроде стражем щитоносцем или торговцем старья. Но, похоже, он ничего не принес с собой сюда.
actors.mobs.npcs.zero.fiveyears.mooncatnewyears.messages1=Прошёл ещё один год, а я всё ещё коточеловек.
actors.mobs.npcs.zero.fiveyears.mooncatnewyears.messages2=Возьми это, считай моим скромным подарком, но учти эта вещица может оказаться своенравной.
actors.mobs.npcs.zero.fiveyears.mooncatnewyears.messages3=Я всё ещё ищу способ вернуть себе прежний облик...
actors.mobs.npcs.zero.fiveyears.mooncatnewyears.messages4=С Новым годом! И пусть тебя, не покусает как меня какой-нибудь оборотень.

actors.mobs.npcs.zero.fiveyears.gudazinewyears.name=Гудацзы
actors.mobs.npcs.zero.fiveyears.gudazinewyears.desc=Герой из дальних земель, добрался сюда из Халдея, расположенного неподалеку от Роделя. Интересно, не ищет ли он здесь что-то.
actors.mobs.npcs.zero.fiveyears.gudazinewyears.messages1=С Новым годом, путешественник! Благодаря вам в этом году я получил больше золотых монет, чем в прошлом.
actors.mobs.npcs.zero.fiveyears.gudazinewyears.messages2=Правда, банков в этих краях нет, так что приходится просто сваливать монеты в кучу... Хорошо, что в нашем городке нет воров...
actors.mobs.npcs.zero.fiveyears.gudazinewyears.messages3=Ах да, путешественник! В благодарность за твою заботу, возьми немного золота из этой кучи, пусть это будет новогодним подарком тебе.
actors.mobs.npcs.zero.fiveyears.gudazinewyears.messages4=Ну что ж, до встречи! Надеюсь, в новом году ты и дальше будешь меня спонсировать... Тогда я смогу накупить себе побольше обновок... (шепотом)

actors.mobs.npcs.zero.fiveyears.sheepnewyears.name=Волшебная овца
actors.mobs.npcs.zero.fiveyears.sheepnewyears.desc=Это волшебная овца. Что в ней волшебного? Её нельзя убить. Всё, что она умеет - это стоять жуя жвачку с пустым взглядом.
actors.mobs.npcs.zero.fiveyears.sheepnewyears.messages1=Счастливого Нового года, бэ-э! А желаю, чтобы в новом году ты не застревал в овцах, бэ-э! Ой, в моей шерстке что-то застряло, можешь это забрать, бэ-э!»
actors.mobs.npcs.zero.fiveyears.sheepnewyears.messages2=Мээ?
actors.mobs.npcs.zero.fiveyears.sheepnewyears.messages3=Бэ-э! Ещё раз поздравляю тебя с Новым годом, бэ-э!

actors.mobs.npcs.zero.fiveyears.zakoflowernewyears.name=Мяоинь Хуа
actors.mobs.npcs.zero.fiveyears.zakoflowernewyears.desc=Милая девушка-тенгу, одна из питомцев в Radish Pixel Dungeon. Ее цель в этом подземелье - снабжать всех едой (хотя и не бесплатно). Попробуйте, если будете проходить мимо.\n\nКстати, не называйте её простушкой, иначе она рассердится.
actors.mobs.npcs.zero.fiveyears.zakoflowernewyears.messages1=Я зажгла свечу, и взяла перо, чтобы вознести молитву о вечном благе во всем мире.
actors.mobs.npcs.zero.fiveyears.zakoflowernewyears.messages2=Вот, попробуй этот пирог, и желаю тебе успехов!
actors.mobs.npcs.zero.fiveyears.zakoflowernewyears.messages3=Что? Я не толстая, я просто много ем.


actors.mobs.npcs.zero.fiveyears.smallleafnewyears.name=Сяое
actors.mobs.npcs.zero.fiveyears.smallleafnewyears.desc=Одна из самых известных путешественниц в мире, по слухам, она исследовала и благополучно выжила в многих ужасающих подземельях. Ходят слухи, что она на самом деле божественный творец маленького мира... Однако по этой молодой девушки, не скажешь что у неё бесчеловечный характер.
actors.mobs.npcs.zero.fiveyears.smallleafnewyears.message1=Снова наступила весна, значит, пора подарить тебе что-нибудь стоящее.
actors.mobs.npcs.zero.fiveyears.smallleafnewyears.message2=В этом мире тебя ждет еще много неисследованных подземелий.

actors.mobs.npcs.zero.fiveyears.qinlinewyears.name=Циньли
actors.mobs.npcs.zero.fiveyears.qinlinewyears.desc=Вокруг этой девушки все время ритмично перемещаются воздушные потоки. Этот легкий ветерок всегда создает ощущение уюта и тепла, именно такие чувства он дарит окружающим.
actors.mobs.npcs.zero.fiveyears.qinlinewyears.messages1=Пусть Новый год принесет тебе удачу и исполнит все твои мечты; пусть твое путешествие всегда будет благополучным, а злые духи и чудовища трепетали при виде тебя.
actors.mobs.npcs.zero.fiveyears.qinlinewyears.messages2=Вот держи случайное оружие в подарок. Попытай удачу и свою силу.

actors.mobs.npcs.zero.fiveyears.moruosnewyears.name=Моносы
actors.mobs.npcs.zero.fiveyears.moruosnewyears.desc=Поговаривают, что она владелица Снежной гостиницы и повидала бесчисленное множество спускающихся в подземелье путешественников, и большинство из них, так и никогда не вернулось, но лишь немногие из них вернулись прославленными...
actors.mobs.npcs.zero.fiveyears.moruosnewyears.messages1=Добро пожаловать в Снежную гостиницу %s, я его владелица.
actors.mobs.npcs.zero.fiveyears.moruosnewyears.messages2=Скоро здесь начнется банкет, а пока можешь пообщаться с другими.
actors.mobs.npcs.zero.fiveyears.moruosnewyears.messages3=Конечно, у меня есть и для тебя подарок в честь нового года.
actors.mobs.npcs.zero.fiveyears.moruosnewyears.messages4=Если чувствуешь усталость, можешь подняться на 2-й этаж и немного отдохнуть.
actors.mobs.npcs.zero.fiveyears.moruosnewyears.messages5=Пусть в новом году ты откроешь для себя еще больше секретов, и желаю, чтобы это место всегда оставалось твоим «убежищем».

actors.mobs.npcs.zero.fiveyears.obsirnewyears.name=ZIOM-Observe-sir
actors.mobs.npcs.zero.fiveyears.obsirnewyears.desc=Загадочный человек в черном костюме и разноцветной шляпе на голове, а его кожа, совсем не похожа на человеческую. Поговаривают, что он в сговоре с начесными «торговцами». На самом деле этого человека не существует в этом мире, и как он находится здесь, до сих пор остается загадкой.\n\nСмерть - это еще не конец.
actors.mobs.npcs.zero.fiveyears.obsirnewyears.messages1=С Новым годом, дружище! Ты уже пробовал взрывать монстров бомбами? Если нет, то у меня как раз есть «хлопушка».
actors.mobs.npcs.zero.fiveyears.obsirnewyears.messages2=Ну, надо же, даже в Новый год мне приходится работать, у-у-ух...
actors.mobs.npcs.zero.fiveyears.obsirnewyears.messages3=Я всегда присматриваю за тобой...

actors.mobs.npcs.zero.fiveyears.pinklingnewyears.name = Цзылин
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.desc = Молодая девушка, чьё лицо всегда озарено улыбкой. Её невинное, жизнерадостное и даже немного детская внешность прекрасно скрывает в ней опытного путешественника. Она уже давно стоит здесь, приветствуя любого приходящего сюда путешественников.
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.messages1 = Здравствуй, я рада что ты пришел!
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.messages2 = Ты говоришь, что не встречал меня ранее? Ох... Я - Цзылин, путешественница. Просто я долгое время, занималась расследованием в глубоким море, поэтому меня долго не было дома. Но сейчас я вернулась в Снежный город, чтобы отпраздновать Новый год.
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.messages3 = Слышала, ты помог Дунлин и Лене? Похоже, ты не простак, ведь этим сестрам нелегко помочь. (шепотом) Обычно они очень строгие и с ними нелегко договориться.
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.messages4 = Здесь редко бывает так оживлённо. Если ты не слишком торопишься, почему бы тебе не остаться подольше?
actors.mobs.npcs.zero.fiveyears.pinklingnewyears.messages5= Хм... Похоже, ты очень спешишь. Ну ладно, с Новым годом! Желаю тебе удачного приключения в подземелье!

actors.mobs.npcs.zero.fiveyears.yogstsnewyears.name=Паопао
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.desc=Почему-то смутно чувствуется, что девушка перед вами каким-то образом связана с тем существом из самой глубокой части подземелья? Но, по крайней мере, сейчас она выглядит просто загадочной девушкой.
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.messages1=Ох… Как там говорят людские поздравления? Пусть Новый год преподнесет мне что-нибудь «интересное»?
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.messages2=За твои успехи в уходящем году, тебе в награду по людским обычаям, я даю тебе самому выбрать новогодний подарок. Чего желаешь: знания, благословения или богатства?
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.knows=Знание
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.money=Благословение
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.wealth=Богатство
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.all=Все вместе!
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.messages3=Что ж, удачи тебе, дитя. воспользуйся этим редким даром с умом.
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.messages4=Знаешь, жадничать нехорошо, послушные дети так себя не ведут. Может, когда-нибудь я позволю тебе быть чуть-чуть жаднее! Но точно не сейчас.
actors.mobs.npcs.zero.fiveyears.yogstsnewyears.messages5=Счастливого пути, дитя!

actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.name=Продвинутый торговый автомат
actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.desc=Этот пищевой автомат подвергся глубокой модификации. Теперь он не просто выполняет свои обычные функции, но и может готовить еду напрямую. Благодаря этому, он стал полноправным членом обеденного стола, помогая готовить сегодняшние блюда.
actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.messages1=Ваш заказ обработан. Запущено приготовление...
actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.messages2=Приготовление еды завершено. Пожалуйста, заберите свой заказ.
actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.messages3=Ваш заказ не удалось обработать. Запущена самодиагностика...
actors.mobs.npcs.zero.fiveyears.autoshopbotnewyears.messages4=Приготовление еды в данный момент невозможно. Требуется техобслуживание.

actors.mobs.npcs.zero.fiveyears.choconewyears.name=Чоко
actors.mobs.npcs.zero.fiveyears.choconewyears.desc=Эта молодая девушка выглядит немного растрепанной, возможно, она так спешила на праздничный банкет, что не успела прихорошиться. Судя по всему, здешняя атмосфера ей не совсем по душе…
actors.mobs.npcs.zero.fiveyears.choconewyears.messages1=Меня зовут Чоко. Не стесняйся обращаться ко мне за помощью, если она тебе нужна~ (подмигивает)

actors.mobs.npcs.zero.fiveyears.pinkfoxnewyears.name=Сяюйумин
actors.mobs.npcs.zero.fiveyears.pinkfoxnewyears.desc=Девятихвостая лисица, принявшая человеческий облик. По слухам, она повелевает магией Золотой бабочки, которая позволяет сотворят магический круг, открывающий магию преобразования Золотой бабочки.
actors.mobs.npcs.zero.fiveyears.pinkfoxnewyears.messages1=Мне пора возвращаться к духовным практикам. Я очень хочу, как можно скорее обрести девятый хвост. Но я ужасно проголодалась, когда уже подадут еду... (урчит в животе)
actors.mobs.npcs.zero.fiveyears.pinkfoxnewyears.messages2=Я же попросила не беспокоить меня! Вот, видишь ту овцу? Иди и донимай её.
actors.mobs.npcs.zero.fiveyears.pinkfoxnewyears.messages3=Опять ты? Ну ладно, с Новым годом тебя!

actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.name=Цяньюэ Шэньбай
actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.desc=Вечно истомленный гость из другого мира. Кажется, он наконец-то избавился от давней навязчивой идеи.
actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.messages1=А вот и ты! Главный герой, который как всегда, появляется в самый последний момент?
actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.messages2=Хе-хе, с Новым годом! Прошел еще один год, как же быстро летит время.
actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.messages3=А что я? Я не планирую возвращаться назад. Мне и здесь очень хорошо.
actors.mobs.npcs.zero.fiveyears.qianyuedeepnewyears.messages4=Ой, ладно, давай сегодня не будем забивать голову всякой ерундой, а просто насладимся праздником!

actors.mobs.npcs.zero.fiveyears.hknewyears.name=Маленький рыцарь
actors.mobs.npcs.zero.fiveyears.hknewyears.desc=Гость из другого измерения, в котором распространяется чума, решил немного отдохнуть здесь, в гостинице...
actors.mobs.npcs.zero.fiveyears.hknewyears.messages1=Ох! Чего нужно? Вокруг столько людей, почему ты решил поговорить именно со мной?
actors.mobs.npcs.zero.fiveyears.hknewyears.messages2=Уже Новый год? Ого, как быстро время летит. И глазом моргнуть не успел, как эта планета совершила еще один оборот.
actors.mobs.npcs.zero.fiveyears.hknewyears.messages3=Вот, держи мой подарок. В новом году я как и прежде буду спускаться в подземелье и таскать у тебя вещи из-под носа! ╮(‵▽′)╭
actors.mobs.npcs.zero.fiveyears.hknewyears.messages4=Да ладно тебе, не сердись! Все равно ты не такой шустрый, как я, и не сможешь меня обогнать.

actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.name=Насехуэй
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.desc=Это тот самый загадочный торговец из подземелья. Он единственный кто знает всю правду о том, что произошло в глубинах подземелья много лет назад, и упорно хранит тайну.\n \nКогда-то он был странствующим рыцарем, а теперь скрывается в темноте, снабжая проходящих мимо путешественников провизией и припасами, но никогда не предупреждает их о смертельной опасности, таящейся в этих глубинах.
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.messages1=Вот так и незаметно наступил Новый год, прощаясь с прошлым приветливой весны. Чем же может удивить старинный замок, которому уже тысяча лет?
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.messages2=Подземелье - мрачное и изнуряющее место. Но сейчас Новый год, поэтому я хочу подарить тебе кое-что, что поможет тебе пройти его.
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.messages3=Ты еще помнишь те волшебные палочки, которые я продавал? С того времени прошло уже много лет, а в подземелье появилось еще больше тайн.
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears.messages4=«Время неумолимо раскалывается, ведя к бесчисленным будущим», а чем же ты занят в реальном мире?
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears$molotovblazebrew.name=коктейль Молотова
actors.mobs.npcs.zero.fiveyears.nxhyfiveyears$molotovblazebrew.desc=Бутылка янтарного крепкого алкоголя, из которой вырываются искры, с пробкой обмотанной трутом пропитанным маслом.\n\nПри употреблении даёт лечение, адреналин, ускорение и пропитывает огнем, однако напиток невероятно крепок, поэтому после употребления он всегда вызывает кратковременное головокружение.

actors.mobs.npcs.zero.fiveyears.archettonewyears.name=Сянь
actors.mobs.npcs.zero.fiveyears.archettonewyears.desc=Она представилась как путешественница, которую случайно сюда занесло. Но у вас почему-то создается ощущение, будто вы её уже где-то видели.
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages1=Приветствую, %s! Эй, а ми разве не знакомы? Ничего страшного, просто я уже давно за тобой наблюдаю.
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages2=Позволь представиться: меня зовут Сянь, я путешественница, странствующая по миру, и недавно встретила этот городок. Приятно познакомиться!
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages3=Приветствую, %s! Надеюсь, ты тоже отлично проведешь время в этом подземелье.
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages4=Ну… Не смотри на меня так, ладно, ладно, вот тебе подарок
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages5=Выглядит знакомо? Хи-хи.
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages6=Ня~ Попутного ветра!

actors.mobs.npcs.zero.fiveyears.archettonewyears.messages7=Кому суждено пробудится от великого сна? А, вот и ты, путешественник!
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages8=Сон стал реальностью, и ты удивлен? Но это же твоя заслуга. Кстати, это тебе.
actors.mobs.npcs.zero.fiveyears.archettonewyears.messages9=Ступай и поговори с ней.

actors.mobs.npcs.zero.fiveyears.archettonewyears.messages10=Ня~ Сладких снов!

actors.mobs.npcs.zero.fiveyears.whiteyannewyears.name=Байянь
actors.mobs.npcs.zero.fiveyears.whiteyannewyears.desc=Беловолосая девушка с красивыми волосами, которые настолько длинные, что мешают ей спокойно передвигаться. Она выглядит невинной и наивной, должно бить поэтому она такая дружелюбна.
actors.mobs.npcs.zero.fiveyears.whiteyannewyears.messages1=Прошёл ещё один год, но такое чувство, будто прошло уже два, хотя сюда я приехала совсем недавно.
actors.mobs.npcs.zero.fiveyears.whiteyannewyears.messages2=Времена года летят так быстро, будто бы каждый год похож на предыдущий, словно спускаешься в подземелье и выходишь обратно, монотонно проживая жизнь денем за днем.
actors.mobs.npcs.zero.fiveyears.whiteyannewyears.messages3=Однако, как и мимолетность лет, они приносит перемены, делая мир гораздо интереснее, как и подземелье.
actors.mobs.npcs.zero.fiveyears.whiteyannewyears.messages4=А ещё - хороший аппетит приносит счастье, так что всегда питайся хорошо! Вот, возьми попробуй, это приготовила моя семья.

actors.mobs.npcs.zero.fiveyears.whiteyannewyears$flowercake.name=персиковое печенье
actors.mobs.npcs.zero.fiveyears.whiteyannewyears$flowercake.desc=Печенье в форме персикового цветка с родины Байянь - её любимое лакомство.\n\nДаже если вы ещё не бывали на острове Таоюань, где круглый год цветут персики, оно всё равно подарит вам этот неповторимый вкус во время Праздника весны. Пусть оно принесет вам праздничное настроение в подземелье!
actors.mobs.npcs.zero.fiveyears.whiteyannewyears$flowercake.eat_msg=<#FF4270>Сладкий и нежный вкус, с ароматом персиковых цветов. <RGB>

actors.mobs.npcs.zero.fiveyears.atrinewyears.name=Робоко
actors.mobs.npcs.zero.fiveyears.atrinewyears.desc=Выглядит как обычная девушка, и на новогодний праздник она тоже присоединилась к обеденному столу, чтобы принять участие в праздничном застолье.
actors.mobs.npcs.zero.fiveyears.atrinewyears.messages1=С Новым годом, %s!
actors.mobs.npcs.zero.fiveyears.atrinewyears.messages2=Пусть я и не знаю, что для тебя означает Новый год, но из гостиницы доносится такой приятный аромат... Неужели, сегодня праздничный день, я права?

actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.name=Bzmdr
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.desc=Загадочный молодой человек, одетый во все черное, что выглядит так, будто с ним нелегко поладить. Он часто появляется в гостинице. Может быть, ты сможешь найти с ним общий язык.
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.messages1=С Новым годом! Вот и ещё один год позади.
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.messages2=Как насчёт «маленького» испытания в новом году?
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.messages3=Тогда возьми вот это.
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.messages4=Ладно, если передумаешь и решишь рискнуть, ты знаешь, где меня найти.
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.yes=Да
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.no=Нет

actors.mobs.npcs.zero.fiveyears.bzmdrnewyears$bzmdrgift.name=подарок Bzmdr
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears$bzmdrgift.name_end=прощальный подарок
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears$bzmdrgift.desc=Черная коробка, в которой внутри при открытии, всегда находится точно такая же черная коробка, словно они никогда не заканчиваются.\n\nЛучше её не выбрасывать.\n\nПри каждом первом спуске на следующий этаж случайным образом активируется один из следующих эффектов (могут суммироваться):\n_-_ Временно увеличивает скорость передвижения врагов на 20%%.\n_-_ Временно увеличивает силу атаки врагов на 25%%.\n_-_ Временно увеличивает обзор врагов на +2.\n_-_ Временно увеличивает силу героя на +2.\n_-_ Временно увеличивает обзор героя на +2.\n\nПосле каждой победы над боссом все накопленные эффекты сбрасываются.\n\nТекущие бонусы героя:\n- Бонус к силе: + %s.\n- Бонус к обзору: +%s.
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears$bzmdrgift.magic=Зловещая магия, заключенная в этом предмете, намертво приклеилась к вашему рюкзаку, не позволяя вам избавиться от него.
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.def_verb_1=Что ты хочешь сделать...
actors.mobs.npcs.zero.fiveyears.bzmdrnewyears.def_verb_2=Если тебе нечем заняться, отправляйся в путешествие.
actors.buffs.championenemy$unnamebless.name=таинственная сила
actors.buffs.championenemy$unnamebless.desc=Таинственная сила воздействует на всех существ в подземелье; будьте осторожны!\n\nОбладатели этого эффекта получают следующие бонусы:\n_-_ Текущий бонус к скорости передвижения: +%s%%.\n_-_ Текущий бонус к физическому урону: +%s%%.\n_-_ Текущий бонус к обзору: +%s.

actors.mobs.npcs.zero.fiveyears.kongfunewyears.name=Гэцзы
actors.mobs.npcs.zero.fiveyears.kongfunewyears.desc=Вам неведомо, откуда взялся этот бледнолицый человек и какая у него фамилия, известно только то, что люди кличут его «Голубь» (Гэцзы).
actors.mobs.npcs.zero.fiveyears.kongfunewyears.messages1=Мне постоянно хочется попробовать голубей. В последнее время мене надоели пироги, и меня рвет от всего, что я ем, но мне так хочется поесть голубей... Жаль, что здесь только одни пироги... Кстати, ты любишь мясные пироги? Если да, то я с тобой поделюсь...
actors.mobs.npcs.zero.fiveyears.kongfunewyears.messages2=Что случилось, путешественник? Хочешь попробовать еще мясной пирог? Не ешь слишком много, одного достаточно! Ладно, я продолжу и дальше готовить эти чертовы пироги. Удачи, путешественник.

### 常规0层-新增
actors.mobs.npcs.zero.normal.choco.name=Чоко
actors.mobs.npcs.zero.normal.choco.desc=Эта молодая девушка выглядит немного растрепанной, возможно, она так спешила на праздничный банкет, что не успела прихорошиться. Судя по всему, здешняя атмосфера ей не совсем по душе…
actors.mobs.npcs.zero.normal.choco.messages1=Эта штука перенесет меня в какое-нибудь случайное место неподалёку. Мне она не нужна, а выбрасывать жалко - так что отдам её тебе.
actors.mobs.npcs.zero.normal.choco.card1=Почему у меня больше карт, чем у вас? Это дает преимущество?
actors.mobs.npcs.zero.normal.choco.card2=Останови её, не смей мне противоречить…
actors.mobs.npcs.zero.normal.choco.card3=Я всё потеряла; похоже, я больше не смогу продолжить игру.

actors.mobs.npcs.zero.normal.slicedream.name=Юцзи
actors.mobs.npcs.zero.normal.slicedream.desc=Молодая женщина, одетая в роскошную одежду, кажется, пространно смотрит на вас, но почему-то вы не можете разглядеть её глаза.
actors.mobs.npcs.zero.normal.slicedream.messages1=Давно не виделись, %s.
actors.mobs.npcs.zero.normal.slicedream.messages2=Вы смотрите на неё с недоумением.
actors.mobs.npcs.zero.normal.slicedream.messages3=Удивлен, увидеть меня здесь, не так ли?
actors.mobs.npcs.zero.normal.slicedream.messages4=Спасибо, что не забыл обо мне, именно это дает нам, повод встретится вновь.
actors.mobs.npcs.zero.normal.slicedream.messages5=Эй, постой, не делай этого…
actors.mobs.npcs.zero.normal.slicedream.messages6=...Хм, так скоро снова отправляешься в путь? Тогда возьми это с собой, надеюсь, пригодится.

actors.mobs.npcs.zero.normal.slicedream.messages7=Ступай, а я останусь здесь ждать твоего возвращения.
actors.mobs.npcs.zero.normal.slicedream.messages8=Как хорошо, что твоё путешествие прошло без приключений.\n\nНадеюсь, так будет и впредь...
actors.mobs.npcs.zero.normal.slicedream.messages9=………………

actors.mobs.npcs.zero.normal.slicedream.a=Обнять Юцзи
actors.mobs.npcs.zero.normal.slicedream.b=Продолжить путешествие

actors.mobs.npcs.zero.normal.ag.name=Ашэнь
actors.mobs.npcs.zero.normal.ag.desc=Загадочная девушка неизвестного происхождения часто задерживается у магического круга телепортации.
actors.mobs.npcs.zero.normal.ag.messages1=Мой бело-радужный конь обладает магической силой, которая позволяет менять цвет одежды и волос!
actors.mobs.npcs.zero.normal.ag.messages2=Жаль, что мой бело-радужный конь пропал. Не мог бы ты помочь мне его отыскать?
actors.mobs.npcs.zero.normal.ag.messages3=Вот, возьми это. Надеюсь, это поможет тебе в нужный момент.

actors.mobs.npcs.zero.normal.icemagicgirl.name=Дунлин
actors.mobs.npcs.zero.normal.icemagicgirl.desc=После той великой битвы, она всегда приходит на второй этаж гостиницы, чтобы отдохнуть.
actors.mobs.npcs.zero.normal.icemagicgirl.messages1=Давно не виделись, %s.
actors.mobs.npcs.zero.normal.icemagicgirl.messages2=Спасибо, что помог мне ранее, надеюсь, это не доставило тебе много хлопот.
actors.mobs.npcs.zero.normal.icemagicgirl.messages3=……Я не очень умею поддерживать разговор, давайте поговорим в другой раз.
actors.mobs.npcs.zero.normal.icemagicgirl.messages4=Вот прими зелье, которое я приготовила. Счастливого пути!

actors.mobs.npcs.zero.normal.firemagicgirl.name=Лена
actors.mobs.npcs.zero.normal.firemagicgirl.desc=Само собой, она выглядит в точности как та «Лена» из подземелья, и на удивление, она знает о вашем ограблении, заставляя вас чувствовать неловко в её присутствии. К счастью, это настоящая Лена, которая приняла вашу помощь и, кажется, не собирается вам мстить.\n\nИногда она откладывает в сторону свои повседневные дела и приходит в гостиницу, чтобы отдохнуть.
actors.mobs.npcs.zero.normal.firemagicgirl.messages1=Эй, разве это не тот самый %s, который некоторое время почти все скупал в моем магазине?
actors.mobs.npcs.zero.normal.firemagicgirl.messages2=Сегодня у меня хорошее настроение, так что пока не буду придираться к тебе за то, что ты сделал раньше.
actors.mobs.npcs.zero.normal.firemagicgirl.messages3=Я тебе об этом не рассказывала? У нас есть еще одна старшая сестра, правда она находится далеко в глубинах моря. Возможно, однажды ты с ней встретишься...
actors.mobs.npcs.zero.normal.firemagicgirl.messages4=Хотя сейчас мы уже не враги, но мое воплощение в подземелье может оказаться не слишком дружелюбным к тебе, так что будь осторожен.

actors.mobs.npcs.zero.normal.dogdogmusic.name=Ротвейлер
actors.mobs.npcs.zero.normal.dogdogmusic.desc=Большая белая собака, которую так и хочется погладить!

actors.mobs.npcs.zero.normal.dogdogmusic.star_bgm=Звездная битва
actors.mobs.npcs.zero.normal.dogdogmusic.sand_bgm=Золотая пустыня
actors.mobs.npcs.zero.normal.dogdogmusic.peach_bgm=Персиковый остров
actors.mobs.npcs.zero.normal.dogdogmusic.defitit=Сбросить по умолчанию

actors.mobs.npcs.zero.normal.dogdogmusic.messages1=Гав-гав! Приветствую, %s!
actors.mobs.npcs.zero.normal.dogdogmusic.messages2=У камина так тепло и уютно, гав! Хочешь тоже присоединиться, гав?
actors.mobs.npcs.zero.normal.dogdogmusic.messages3=Ты можешь переключить фоновую музыку у меня, гав!
actors.mobs.npcs.zero.normal.dogdogmusic.messages4=Хочешь этот колокольчик? Забирай, гав!

actors.mobs.npcs.zero.normal.dogdogmusic.ik=А, ты знал что...

actors.mobs.npcs.zero.normal.dogdogmusic.dialog_1=Стоимость на останки сакабамбасписа возрастает в 20 раз после того, как сакабамбаспис повержен.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_2=Ключи для основных этажей и их подэтажей имеют общее применение.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_3=Лавовый дракон огромен, а это значит, что он не может находится в местах, где пространство шириной в одну клетку.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_4=В бестиарии есть монстры, которые не появляются в обычной игре. Угадайте, какие именно.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_5=Есть один способ быстро удалить все мини-солнца с игрового поля: выйти из игры и снова войти в неё
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_6=В гостинице живёт собака, похожая на кошку, и кошка, похожая на собаку, и гости часто их путают.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_7=Шипы +10 уровня можно преобразовать в свиток улучшения; кроме того, это единственное оружие, характеристики которого ухудшаются при повышении уровня выше 10-го.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_8=На самом деле подкласс Боевой маг не был удален; существует скрытый предмет, позволяющий переобучиться на этот класс.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_9=Вас раздражает, что дворф-гладиатор выбивает оружие с рук? Или беспокоит, что колонна разума лишает вас оружия? Попробуйте заклинание проклятия!
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_10=Хотя фосфорный и ледяной огонь являются разновидностью огня, они не способны уничтожить семена сердца гнилоягоды; в то же время они не реагируют на иммунитет от зачарования жара и пропитанности огнем.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_11=На самом деле, вызов элементаля можно пропитать зельем Фосфорного огня.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_12=В третьем акте мини-игры «AllSearch » в старинном замке, ядро круга телепортации можно активировать несколько раз до окончания обратного отсчета. Если активировать его несколько раз, на вас хлынет огромная волна монстров.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_13=Если вы попались на уловку и создали кристальное сердце из рецепта, вы можете поместить это сердце в котёл, и оно откроет скрытый рецепт!
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_14=Фосфорная душа -  самый редкий встречающийся монстр. Вы когда-нибудь его видели?
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_15=На первых и вторых этажах древних руин обязательно появляются два колодца, их стоит поискать.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_16=Бомбы с бомбокинжала можно бросать сквозь стены, что очень полезно для обхода огромной радиуса поражения осколочной бомбы.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_17=Вас будет ждать приятный сюрприз, если использовать атаки дальнего боя против Bzmdr и Маленького рыцаря!
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_18=Хотя и говорится, что хрустальное ожерелье помогает ранам заживать быстрее, на самом деле оно не дает никакого эффекта.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_19=Полевой рюкзак - единственный рюкзак, который могут украсть воры; однако скорость передвижения вора, укравшего этот рюкзак, снижается до 0,5.
actors.mobs.npcs.zero.normal.dogdogmusic.dialog_20=Если вы получите концовку «Кораблекрушение», не находясь в режиме разработчика, разработчик оставит для вас особое сообщение.

actors.mobs.npcs.zero.normal.dogdogmusic.sw_bgm=Сменить фоновую музыку
actors.mobs.npcs.zero.normal.dogdogmusic.sw_music=Переключение музыки
actors.mobs.npcs.zero.normal.dogdogmusic.sw_music_desc=Гав! Я главный музыкальный продюсер проекта Magic Ling. Я уже подготовил несколько композиций, обязательно послушай их, гав!

actors.mobs.npcs.zero.normal.dogdogmusic$cicremusic.name=звонкий колокольчик
actors.mobs.npcs.zero.normal.dogdogmusic$cicremusic.desc=Этот колокольчик поразительно похож на тот, что висел на одной большой собаке, которую вы однажды повстречали... более того, это наверняка именно он! Каждый раз, когда колокольчик звонит, он раздает чистый и звонкий звук, отгоняющий любые невзгоды.\n\nПри атаке выпускает Звон по всем видимым целям в радиусе действия, а серия атак дополнительно вызывает Эхо.\n\nЗвон: создает резонирующий источник, который наносит _%s-%s физический урон_ всем целям в пределах досягаемости. (Может активироваться до 4 раз до перемещения и сбрасывается после.)\n\nЭхо: повторно вызывает еще 1 звучание Звона.

actors.mobs.npcs.zero.normal.dogdogmusic$cicremusic.ability_name=Бескрайнее эхо
actors.mobs.npcs.zero.normal.dogdogmusic$cicremusic.typical_ability_desc=艾诺琳娜可以用轻音铃铛使出_广袤回音_，以选中目标为锚释放声波，对所有与你之间无门阻隔的敌人造成铃铛攻击伤害。\n普通楼层基础_有效范围%s格_，BOSS楼层_削弱至%s格_；超出基础范围每向外一格，伤害降低15%%（最低10%%）。\n该武技无法穿门的限制仅作用于本次声波扩张范围，不会改变轻音铃铛普通攻击的判定，需要消耗2武技充能。
actors.mobs.npcs.zero.normal.dogdogmusic$cicremusic.ability_desc=艾诺琳娜可以用轻音铃铛使出_轻音铃铛_，以选中目标为锚释放声波，对所有与你之间无门阻隔的敌人造成铃铛攻击伤害。\n一般普通楼层基础_有效范围%s_格，BOSS楼层一般_削弱至%s格_；超出基础范围每向外一格，伤害降低15%%（最低10%%）。\n该武技无法穿门的限制仅作用于本次声波扩张范围，不会改变轻音铃铛普通攻击的判定，需要消耗2武技充能。


actors.mobs.npcs.zero.normal.dogdogmusic$cicrestats.name=звонкий ритм
actors.mobs.npcs.zero.normal.dogdogmusic$cicrestats.desc=Любое движение прерывает серию резонирующих ударов.\nАтаки вызывают Звон, а серия ударов активирует Эхо.\n\nЧастое использование временно останавливает применение способности.\n\nХодов до прерывания серии ударов: %s.

actors.mobs.npcs.zero.normal.rainnight.name=Юйе
actors.mobs.npcs.zero.normal.rainnight.desc=Странник в синем плаще. Интересно, кто же скрывается под ним?
actors.mobs.npcs.zero.normal.rainnight.messages1=Все мы - реки этого города.\nМы одиноки, и сближаемся - как течение к морю.
actors.mobs.npcs.zero.normal.rainnight.messages2=Пройдет много лет, и мы снова вернемся сюда. Только тогда я уже не буду собой, а ты - не будешь собой.\nЦени моменты, как будущие так и прошлые, бережно храня эти незабываемые воспоминания.

actors.mobs.npcs.zero.normal.magicsheep.name=Волшебная овца
actors.mobs.npcs.zero.normal.magicsheep.desc=Это волшебная овца. Что в ней волшебного? Её нельзя убить. Всё, что она умеет - это стоять жуя жвачку с пустым взглядом.
actors.mobs.npcs.zero.normal.magicsheep.messages1=Привет, бэ-э! Ты направляешься в подземелье, мэ-э? У меня в шерсти кое-что есть, можешь это забрать, бэ-э.
actors.mobs.npcs.zero.normal.magicsheep.messages2=Мээ?
actors.mobs.npcs.zero.normal.magicsheep.messages3=Бэ-э~ Счастливого пути! Мэ-э~

actors.mobs.npcs.zero.normal.pinkfox.name=Сяюйумин
actors.mobs.npcs.zero.normal.pinkfox.desc=Обычная лисица, стремящаяся стать девятихвостой лисицей, сейчас она не в настроении разговаривать с кем-либо.
actors.mobs.npcs.zero.normal.pinkfox.messages1=У меня нет времени, чтобы поговорить с тобой.
actors.mobs.npcs.zero.normal.pinkfox.messages2=Думаешь, я могу тебе помочь? Возможно.
actors.mobs.npcs.zero.normal.pinkfox.messages3=Я вижу, чего желает твоё сердце: %s.


actors.mobs.npcs.extra.kuzuminewyears.name=Кусуми
actors.mobs.npcs.extra.kuzuminewyears.desc=Заключенная, которую содержат в одиночной камере как особо опасную преступницу, ранее она была «Ведьмой времени» но из-за проступка оказалась здесь. Оковы, наложенные на неё Ин Линг, не позволяют ей в полной мере использовать магию, делая побег её из этого места несбыточной мечтой.
actors.mobs.npcs.extra.kuzuminewyears.messages1=Приветствую, %s!
actors.mobs.npcs.extra.kuzuminewyears.messages2=Мне нечего тебе предложить, так как я заперта здесь... Почему бы тебе не взять это? Пусть это будет моим новогодним подарком.
actors.mobs.npcs.extra.kuzuminewyears.messages3=Ух, как хочется есть... Можешь дать мне что-нибудь поесть?
actors.mobs.npcs.extra.kuzuminewyears.messages5=Ты хочешь остаться здесь со мной? Нет, тебе здесь не место, скорее уходи отсюда…
actors.mobs.npcs.extra.kuzuminewyears.yes=Да
actors.mobs.npcs.extra.kuzuminewyears.no=Нет
actors.mobs.npcs.extra.kuzuminewyears.inv_title=Покормить чем-нибудь Кусуми
actors.mobs.npcs.extra.kuzuminewyears.empty_1=Вы пообещали угостить Кусуми чем-нибудь вкусненьким и засунули руку в рюкзак, чтобы что-нибудь найти…
actors.mobs.npcs.extra.kuzuminewyears.empty_2=Кусуми с нетерпением наблюдает за вами. Но вы ничего не достали, просто разжали пустые ладони, и посмотрели на неё...
actors.mobs.npcs.extra.kuzuminewyears.empty_3=«Ай!» Она набросилась и укусила вас! «Тогда я тебя съем!»
actors.mobs.npcs.extra.kuzuminewyears.thanks=Ух ты, это съедобно? Спасибо, мяу~ В знак моей благодарности, прими мое благословение.
actors.mobs.npcs.extra.kuzuminewyears$2.rankings_desc=<#ff0000>Съеден голодающим... <RGB>
actors.mobs.npcs.extra.kuzuminewyears.kill=<#ff0000>Вас съела голодная Кусуми... <RGB>
actors.mobs.npcs.extra.kuzuminewyears.anary=«Ай!» Она снова укусила вас!
actors.mobs.npcs.extra.kuzuminewyears.messages4=Я заметила, как ты возишься с этим цветком. Думаешь использовать его как украшение? Если хочешь, чтобы он принес какую-то пользу, можешь отдать его мне. Но предупреждаю, будет немного больно!

actors.mobs.npcs.extra.kusumi.name=???
actors.mobs.npcs.extra.kusumi.desc=Молодая девушка, выглядит так, будто только что пережила ожесточенный бой: волосы растрепаны, одежда в лохмотьях, а на глазах блестят слезы.\n\nКак только вы взглянули на неё, она недовольно отвернула голову в сторону, стараясь избежать зрительного контакта с вами.
actors.mobs.npcs.extra.kusumi.no_talk=Не подходи!
actors.mobs.npcs.extra.kusumi.roll1=В следующий раз я точно не проиграю…
actors.mobs.npcs.extra.kusumi.roll2=Думаешь, у тебя получится...
actors.mobs.npcs.extra.kusumi.roll3=Мы… ещё не закончили…
actors.mobs.npcs.extra.kusumi.cute=>_<


actors.mobs.bosses.notsync.fayinasaybye.name=Фаина
actors.mobs.bosses.notsync.fayinasaybye.desc=Она тихо стоит перед могилой мечей, погруженная в воспоминания о прошлом. Событие с лавовым драконом, уже осталось в прошлом, и в джунглях вновь воцарился мир, а её всех верных друзей, с которыми она когда-то пила и путешествовала бок о бок, уже давно нет в живых. Теперь оставшись в одиночестве, она охраняет старые могилы павших, сохранная в сердце память об ушедших.
actors.mobs.bosses.notsync.fayinasaybye.messages1=......а.
actors.mobs.bosses.notsync.fayinasaybye.messages2=Да, мне не холодно, всё в порядке. Спасибо не стоит обо мне беспокоиться, я скоро вернусь.
actors.mobs.bosses.notsync.fayinasaybye.messages3=Файна замолчала, и вы наблюдаете, как она одним глотком допивает остатки вина в бутылке.
actors.mobs.bosses.notsync.fayinasaybye.messages4=.....
actors.mobs.bosses.notsync.fayinasaybye.messages5=Ведь ты же также знаешь... что это за место?
actors.mobs.bosses.notsync.fayinasaybye.messages6=Не представляю, как долго я пробыла в ловушке, но последнее что припоминаю, будто мы вместе выпивали всего несколько недель назад.
actors.mobs.bosses.notsync.fayinasaybye.messages7=Лео был выше всех нас... Добрейшей души человек. Он частенько помогал нам чинить сломанные мечи.
actors.mobs.bosses.notsync.fayinasaybye.messages8=А еще он был тот еще любитель выпить. В прошлый раз, помню, он осушил бутылки две-три, и был в состоянии болтать с Сарой.
actors.mobs.bosses.notsync.fayinasaybye.messages9=Сара тоже была очень душевной. Она писала для нас свитки и частенько предлагала выпить. Хотя сама-то пить совсем не умела...
actors.mobs.bosses.notsync.fayinasaybye.messages10=Фаина попыталась сделать ещё глоток вина, но бутылка оказалась пустой.
actors.mobs.bosses.notsync.fayinasaybye.messages11=.....
actors.mobs.bosses.notsync.fayinasaybye.messages12=Теперь осталась только я.
actors.mobs.bosses.notsync.fayinasaybye.messages13=Лео, Сара, Боб...
actors.mobs.bosses.notsync.fayinasaybye.messages14=Если бы я только могла...
actors.mobs.bosses.notsync.fayinasaybye.messages15=...увидеться с вами хотя бы еще разок.

actors.mobs.npcs.extra.kusumimagicgirl.name=???
actors.mobs.npcs.extra.kusumimagicgirl.desc=Она смотрит на вас.
actors.mobs.npcs.extra.kusumimagicgirl.ha=Когда вы попытались подойти к этой странной девушке и заговорить с ней, она внезапно укусила вас!
actors.mobs.npcs.extra.kusumimagicgirl.ha2=Она снова укусила вас!

actors.mobs.npcs.extra.yuanxi.name=???
actors.mobs.npcs.extra.yuanxi.desc=Вокруг этой девушки витает некий барьер, словно она избегает любого контакта с вами.

actors.mobs.npcs.extra.archettoweightless.name=Сянь
actors.mobs.npcs.extra.archettoweightless.desc=Эта загадочная девушка… Но как она здесь оказалась?
actors.mobs.npcs.extra.archettoweightless.messages1=О, ты снова здесь. Её здесь уже нет.
actors.mobs.npcs.extra.archettoweightless.messages2=Но ты опоздал: все, что она оставила после себя, уже исчезло.
actors.mobs.npcs.extra.archettoweightless.messages3=Ладно, это была просто шутка.
actors.mobs.npcs.extra.archettoweightless.messages4=Почему я здесь? Куда она ушла?
actors.mobs.npcs.extra.archettoweightless.messages5=Это секрет!

actors.mobs.npcs.extra.archettoweightless.messages6=Ха-я!
actors.mobs.npcs.extra.archettoweightless.messages7=Ну как? Я тебя Напугала? Хи-хи.
actors.mobs.npcs.extra.archettoweightless.messages8=Впрочем, в подземелье в последнее время то и дело мелькают беглые силуэты, но все их усилия напрасны~
actors.mobs.npcs.extra.archettoweightless.messages10=Ты ведь только что видел тот белый силуэт, правда? Но я пока не могу сказать, кто это. Со временем ты сам узнаешь.

actors.mobs.npcs.extra.archettoweightless.messages9=У тебя в руках какая-то интересная вещица, хочешь обменяться со мной?
actors.mobs.npcs.extra.archettoweightless.a=Да, есть такое желание
actors.mobs.npcs.extra.archettoweightless.b=Нет, я не хочу

actors.mobs.npcs.extra.archettoweightless.gift=Хочешь мне что-то подарить? Хм, ну, я не могу просто так это принять. Давай договоримся: в обмен на предложенную тобой вещь я дам тебе что-то равноценное.
actors.mobs.npcs.extra.archettoweightless.yes=Вот, возьми!
actors.mobs.npcs.extra.archettoweightless.no=Ничего не давать

actors.mobs.npcs.extra.archettoweightless.gift_sc=Может эта вещь для тебя, ценная? Ты уверен?
actors.mobs.npcs.extra.archettoweightless.yesa=По рукам!
actors.mobs.npcs.extra.archettoweightless.not=Я просто дразню тебя
actors.mobs.npcs.extra.archettoweightless.nob=Я передумал

actors.mobs.npcs.extra.archettoweightless.messages10a=Хорошо, сделка завершена!
actors.mobs.npcs.extra.archettoweightless.messages10b=Надо ещё немного подумать…

actors.mobs.npcs.extra.archettoweightless.card1=Все ещё не уходишь? Тебе ведь ещё предстоит вернуть своё прошлое.
actors.mobs.npcs.extra.archettoweightless.card2=Все ещё не уходишь? Тебе ведь ещё предстоит найти своё собственное будущее.
actors.mobs.npcs.extra.archettoweightless.go=Все ещё не уходишь? Это место долго не продержится.

actors.mobs.npcs.extra.archettoweightless.inv_title=Какой предмет дать?

actors.mobs.npcs.extra.archettoweightless.props=Хм, тогда я дам тебе свиток.\nЭтот свиток имеет особые свойства: если он покинет мои руки, то долго не сохранится, так что не забудь использовать его как можно скорее.
actors.mobs.npcs.extra.archettoweightless.heal=А то, что касается редких вещей, то пусть они даруют тебе жизненную энергию.
actors.mobs.npcs.extra.archettoweightless.scroll=А то, что касается обычных вещей, то пусть они даруют тебе силу знаний.

#### 魔剑士-新英雄
actors.hero.spellsoword.magicpower.name=магическая сила
actors.hero.spellsoword.magicpower.desc=Мечник искусен в магии и всегда наносить первый удар в бою, получая преимущество с самого начала!\n\nМагическая сила: %s/%s.\n\nХодов до восстановления магии: %s.
actors.hero.spellsoword.magicpower.icemagic=Ледяное зачарование

actors.hero.talent.magic_compression.title=Магическое сжатие
actors.hero.talent.magic_compression.desc=_+1:_ Максимальный предел магической силы Мечника, увеличивается на _5 очков_.\n\n_+2:_ Время восстановления магической силы Мечника, уменьшается на _1 ход_.

actors.hero.talent.guardian_blade.title=Сопровождающий клинок
actors.hero.talent.guardian_blade.desc=_+1:_ Когда Мечник атакует магическим метательным клинком, есть _35% шанс_ мгновенно возвратить клинок не расходуя магию.\n\n_+2:_ Когда Мечник атакует магическим метательным клинком, есть _70% шанс_ мгновенно возвратить клинок не расходуя магию.

actors.hero.talent.ice_liberation.title=Ледяное пробуждение
actors.hero.talent.ice_liberation.desc=_+1:_ Продолжительность действия у Мечника ледяного зачарования и вихря клинка бездны увеличиваются на _3 хода_.\n\n_+2:_ Продолжительность действия у Мечника ледяного зачарования и вихря клинка бездны увеличиваются на _6 ходов_.

actors.hero.talent.cold_hardy_constitution.title=Морозоустойчивость тела
actors.hero.talent.cold_hardy_constitution.desc=_+1:_ Мечник может снять эффект _окоченения_, с перезарядкой в _33 хода_.\n\n_+2:_ Эффект _окоченения_ не накладывается на Мечника.

actors.hero.talent.malicious_speculation.title=предчувствие зла
actors.hero.talent.malicious_speculation.desc=_+1:_ Когда Мечник надевает неопознанное оружие или броню, и на них _наложено проклятие_, он снимает их и _раскрывает проклятие_. Этот эффект может сработать только 3 раза. Скорость опознания оружия и брони Мечником увеличивается на 125%.\n\n_+2:_ В дополнение к преимуществам +1, увеличивает еще на _3 раза_ количество срабатывания эффекта, который также распространяется на _кольца и артефакты_. Скорость опознания оружия и брони Мечником увеличивается на 150%.\n\n(Во время тестирования ограничения срабатывания эффекта отсутствуют)
actors.hero.talent.er_id=предчувствие зла
actors.hero.talent.er_ik=Этот предмет _%s_ содержит чары _%s_, и был автоматически снят.

actors.hero.talent.magicpower_food.title=Магический обед
actors.hero.talent.magicpower_food.desc=_+1:_ Перекус занимает у Мечника 1 ход и восстанавливает _4 очка_ магической силы.\n\n_+2:_ Перекус занимает у Мечника 1 ход и восстанавливает _6 очков_ магической силы.\n\nЭтот талант может восстанавливать магию, даже при превышении максимального лимита _магической силы_.

actors.hero.talent.magicdamage_melee.title=Сияющее лезвие
actors.hero.talent.magicdamage_melee.desc=_+1:_ Все атаки Мечника в ближнем бою наносят дополнительно _6% магического урона_.\n\n_+2:_ Все атаки Мечника в ближнем бою наносят дополнительно _12% магического урона_.

actors.hero.talent.highmagic_ankh.title=Магический оберег
actors.hero.talent.highmagic_ankh.desc=При получении смертельного урона, если у Мечника осталась магическая сила, происходить взимание 200%/160% магических сил вместо здоровья.

actors.hero.talent.blood_river.title=Пролитие крови
actors.hero.talent.blood_river.desc=_+1:_ Когда получаемый разовый урон превышает или равен _15% от максимального запаса здоровья_, Мечник получает _2 очка_ магической силы через 3 хода.\n\n_+2:_ Когда получаемый разовый урон превышает или равен _10% от максимального запаса здоровья_, Мечник получает _3 очка_ магической силы через 3 хода.

actors.hero.talent.shield_power.title=Защитная магия
actors.hero.talent.shield_power.desc=_+1:_ При расходовании магической силы Мечник получает щит, равный _1 кратности_ от потраченной магии. Этот эффект имеет перезарядку в 10 ходов.\n\n_+2:_ При расходовании магической силы Мечник получает щит, равный _1.5 кратности_ от потраченной магии. Этот эффект имеет перезарядку в 10 ходов.\n\nЕсли расходуется магия бездны каждое потраченное 1 очко магии бездны засчитается как 5 очков магической силы.

#### 螃蟹王
actors.mobs.bosses.notsync.crabking.name = король крабов
actors.mobs.bosses.notsync.crabking.desc = Даже после взрыва плода Клиффорда, его обломки продолжают отравлять джунгли. Все мелкие животные, съевшие обломки, погибли в мучениях, за исключением этого краба.\n\nСила плода вызвала у него мутацию, которая поспособствовала его росту до невероятных размеров. Теперь он крайне агрессивен, и, что самое главное, он считает вас своим врагом! 

actors.mobs.bosses.notsync.crabking$relooplife.name=послесмертное воскрешение
actors.mobs.bosses.notsync.crabking$relooplife.desc=После получения смертельного удара раскрывается скрытая сила, которая в следующем ходу воскрешает с полным запасом здоровья, равным 120% от максимального здоровья.\n\nЭтот эффект может быть активирован не более 2 раз.



###古墓区
actors.mobs.npcs.tomb.gore.name=Демон-ремесленник - Гейл
actors.mobs.npcs.tomb.gore.desc=Когда-то он был могущественным демоном, сражавшимся с Древними богами, но после поражения отказался от власти и уединился в древней гробнице. Он отличается прямолинейным и честным характером, обладает непоколебимой гордостью и испытывает крайнюю ненависть к Древним богам и силам нежити. Сейчас он называет себя торговцем из древней гробницы и зарабатывает на жизнь, обмениваясь товарами с тролль-кузнецом.

actors.mobs.tumulus.graverat.name=могильная крыса
actors.mobs.tumulus.graverat.desc=Огромная крыса, лишившаяся рассудка от того, что долгое время питалась трупами на кладбище.

actors.blobs.rotgas.name=трупный запах
actors.blobs.rotgas.desc=Этот местность окутана зловещим запахом гниющих трупов.

actors.mobs.tumulus.worm.name=могильный червь
actors.mobs.tumulus.worm.desc=Огромный древний червь, обитающий в гробнице.\n\nОбладает высоким базовым показателем защиты, который дополнительно возрастает при получении физического урона. В данный момент защита увеличена на _%s ед._

actors.mobs.tumulus.wisp.name=блуждающий огонек
actors.mobs.tumulus.wisp.desc=Сущность, напоминающая блуждающий огонек и возникшая в результате не природных явлений.

actors.mobs.tumulus.necroscout.name=разведчик-нежить
actors.mobs.tumulus.necroscout.desc=Разведчик из числа нежити, патрулирующий окрестности подземелья. Разведчик-нежить вступает в позиционный бой с героем, атакуя и убегая от него, чтобы затем вернуться и снова атаковать его через несколько ходов.

actors.mobs.tumulus.thiefsoul.name=душекрад
actors.mobs.tumulus.thiefsoul.desc=Даже после смерти оно стремится что-нибудь украсть - душу за триста монет; но там, где нет торга, нет и вреда.
actors.mobs.tumulus.thiefsoul.carries_soul=_Душекрад несёт в себе частичку вашей души._
actors.mobs.tumulus.thiefsoul.soul_stolen=Душекрад украл частичку вашей души! Ваш максимальный запас здоровья уменьшился!
actors.mobs.tumulus.thiefsoul.soul_recovered=Вы сразили душекрада и вернули потерянную душу в свое тело, восстановив максимальный запас здоровья!
actors.mobs.tumulus.thiefsoul.escapes_with_soul=Душекрад скрылся, когда вы отвлеклись, унося вашу душу навсегда...
actors.buffs.lostsoul.name=потеря души
actors.buffs.lostsoul$lostcount.name=потеря души
actors.buffs.lostsoul$lostcount.desc=Часть вашей души была вырвана. Каждый уровень утраты души навсегда снижает ваш максимальный запас здоровья на 10 очков.\n\nЧисло потерянных душ: %s.\nУтеряно максимального здоровья: %s.

actors.mobs.tumulus.skeletondemon.name=костяной демон
actors.mobs.tumulus.skeletondemon.desc=Чудовище, состоящее из различных человеческих и животных останков - результат эксперимента некоего некроманта, который был отвергнут из-за нестабильного повелевания. Он способен разделяться на части при получении удара.

actors.mobs.tumulus.smallskeletondemon.name=маленький скелет
actors.mobs.tumulus.smallskeletondemon.desc=Часть костей, отделившихся от костяного демона; запутанный разум, запертый в раздробленных останках, который достаточно оставить в покое, и он сам развалится на куски…

actors.mobs.bosses.tumulus.roger.name=роджер
actors.mobs.bosses.tumulus.roger.desc=«Жил как великий герой, а погиб героем среди призраков.»\n\nРоджер некогда был могучим воином, но по несчастному случаю оказался запечатанным в древней гробнице. Когда время вновь пошло своим чередом, а нежить обнажила свои клыки, этот могучий воин ​​в конце концов пал в луже собственной крови. Он был потрясен и сбит с толку, и по сей день помнит ту смерть в небесах, древнюю, как сама вселенная. Охваченный ужасом и яростью, перед лицом безнадежной участи, он ухватил крупицу истинной сути того совершенно непостижимого бытия. Со временем он непременно заставит весь мир трепетать перед ним.\n\nИ всё же, когда время вновь пошло своим чередом, у него уже не осталось времени - лишь разъярённые иссохшие кости, вновь поднимающиеся из праха, осквернённые некромантической энергией.

actors.mobs.bosses.tumulus.roger.notice=Нежелание... Ненависть... Пробудился... Тлеющий огонь моей обиды...
actors.mobs.bosses.tumulus.roger$damageref.name=боевой клич
actors.mobs.bosses.tumulus.roger$damageref.desc=Мощный боевой дух закалил тело Роджера, сделав его защиту еще более неприступной.\n\nТекущее сопротивление урону: %s.\nХодов осталось: %s.
actors.mobs.bosses.tumulus.roger$breakdamage.name=рваная рана
actors.mobs.bosses.tumulus.roger$breakdamage.desc=У вас появилась рваная рана, из-за чего вы непрерывно теряете жизненную энергию, а любое движение ускоряет этот процесс!\n\nЗа каждую пройденную 1 клетку вы теряете _1 ОЗ_, а оставшееся время действия раны _сокращается дополнительно на 1 ход_. Телепортация не воздействует на рваную рану.\n\nХодов осталось: %s.
actors.mobs.bosses.tumulus.roger$breakdamage.death=Из вашей рваной раны вытекла вся жизненная энергия…

actors.mobs.bosses.tumulus.roger$allenemypy.name=отступление войска
actors.mobs.bosses.tumulus.roger$allenemypy.desc=Скорость передвижения и атаки снижается на %s%%, у всех приспешников Роджера.\n\nЭтот эффект не действует героя.

# Roger 罗刹斩
actors.mobs.bosses.tumulus.roger.slash_warn=Казнь Роджера
actors.mobs.bosses.tumulus.roger.instant_kill=%s мгновенно казнен Роджером!
actors.mobs.bosses.tumulus.roger.hero_slain=Вас казнил Роджер...
actors.mobs.bosses.tumulus.roger.rasetsu_end=Казнь Роджера завершена…
actors.mobs.bosses.tumulus.roger$angerpock.name=ярость
actors.mobs.bosses.tumulus.roger$angerpock.desc=Роджер пылает яростью, и она лишь нарастает! За каждые 2 единицы ярости урон, наносимый Роджером, увеличивается на 1%%.\n\nТекущая ярость: %s%%.\nТекущий бонус к урону: +%s%%.

actors.mobs.bosses.tumulus.roger.double_move=Вперед!

### 教堂区
actors.mobs.tumulus.necroarcher.name=арбалетчик-нежить
actors.mobs.tumulus.necroarcher.desc=Несмотря на то что они стали нежитью, эти солдаты, которые при жизни были отличными бойцами, по-прежнему придерживаются к слаженной тактике сражения.\n\nАрбалетчики-нежить за частую появляются в сопровождении стражей-нежитью или других арбалетчиков. Находясь в окружении союзников, они ведут огонь на подавление, обрушивая на противников дополнительные залпы стрел.

actors.mobs.tumulus.necroguard.name=страж-нежить
actors.mobs.tumulus.necroguard.desc=Несмотря на то что они стали нежитью, эти солдаты, которые при жизни были отличными бойцами, по-прежнему придерживаются к слаженной тактике сражения.\n\nСтража-нежить за частую появляются в сопровождении с арбалетчиками-нежитью или другими стражниками. Находясь в окружении союзников, они отражают атаки, усиливая свою оборону.

actors.mobs.tumulus.necroacolyte.name=некроаколит
actors.mobs.tumulus.necroacolyte.desc=Эти бездомные дети, попав в церковь, не обрели лучшей судьбы и в конечном счете все стали жертвами экспериментов. Теперь они охраняют церковь как свой дом, изгоняя чужаков следуя указаниям своего наставника.\n\nНекроаколиты сражаются, призывая и управляя блуждающими огоньками. Командуя своими прислужниками, они также находят силы и для применения заклинаний, ослабляющих врагов.

actors.mobs.tumulus.necroacolyte$wispdead.name=блуждающий огонек некроаколита
actors.mobs.tumulus.necroacolyte$wispdead.desc=Этот комок блуждающего огонька был призван некроаколитом. В отличие от обычных блуждающих огоньков, эти невосприимчивы к фосфорному огню, однако они исчезают, если убить их призывателя.

actors.mobs.tumulus.necrocavalry.name=кавалерия-нежить
actors.mobs.tumulus.necrocavalry.desc=虽然已经成为亡灵，但这些生前十分优秀的士兵仍然保持着联合行动的战术习惯。\n\n死灵骑兵往往与死灵弩手，死灵卫兵一同出现。它胯下的战马所向无敌，几乎没有什么能让它慢下脚步，也罕有冲击能撼动它的铁蹄。\n\n发现敌人时，死灵骑兵将蓄势向一个方向发起高速的冲锋，直到遇见阻碍。冲锋时它将对路径附近的所有敌人进行突袭造成巨大伤害，并击穿他们的护甲。
custom.buffs.zerodefense.name=раскол доспеха
custom.buffs.zerodefense.desc=Ваша броня временно утратила защитные свойства, но, к счастью, это состояние не длиться вечно. Пока броня расколота, ваш защита снижается до 0.\n\nХодов осталось: %s.

actors.mobs.tumulus.highnecromancer.name=верховный некромант
actors.mobs.tumulus.highnecromancer.desc=Наставник некромантов, искусно владеющий тайным искусством призыва духов, и страж древней гробницы. Заметив чужаков, он мгновенно поднимает своих прислуживающих скелетов, чтобы силой мертвых сокрушить всех живых.

actors.mobs.tumulus.necropioneer.name=следопыт-нежить
actors.mobs.tumulus.necropioneer.desc=Следопыт-нежить - это предводитель разведчиков нежити. Будучи предводителем, он накопил богатый боевой опыт и  закалил своё тело в ходе бесчисленных сражений при жизни. Его появление, как правило, предзнаменует неприятности!\n\nОн передвигается с молниеносной скоростью. Атаковав врага, он тут же стремительно отступает от цели и продолжает бой, метая снаряды. Его атаки с легкостью накладывают сильное кровотечение.


actors.mobs.tumulus.wormwhyhuman.name=могильная мумия
actors.mobs.tumulus.wormwhyhuman.desc=Безымянный труп в глубинах гробницы, под воздействием скверны и некромантии подвергся чудовищной трансформации, иссохнув и затвердев. Он не похож на живое существо, однако оно бродит по окрестностям и нападает на тех, кого сочтет «чужаком»…\n\nОбычные заклинания и физические удары вряд ли нанесут этой мумии существенный урон. К счастью, при контакте с водой его тело деформируется и разлагается, что значительно облегчает задачу по его уничтожению.\n\n_-_ Дополнительная защита: 0-%s.\n_-_ Ослабление защиты: %s.

actors.mobs.tumulus.aggregatus.name=совокупность злобы
actors.mobs.tumulus.aggregatus.desc=Искаженная совокупность, возникшая среди груд костей из предсмертной злобы бесчисленных путешественников, поглощённых подземельями. Она не имеет определённой формы - это лишь беспрестанно извивающийся, наполненный ненавистью дух, в котором смутно проступают бесчисленные искаженные страдающие лица. Поговаривают, что его вопли могут унести душу человека в пучины ада...

actors.mobs.tumulus.aggregatus.shriek_hit=Ваша душа подверглась сильному воздействию!
actors.mobs.tumulus.aggregatus.shriek_dodge=Ваши действия стали неповоротливыми...
actors.mobs.tumulus.aggregatus.rankings_desc=Среди бесчисленных лиц появилось ещё одно - ваше.

actors.mobs.tumulus.necrowarlock.name=некромант-чернокнижник
actors.mobs.tumulus.necrowarlock.desc=В Некрохраме члены культа делятся на различные иерархии соответственно силе владения магией некромантии, причем некроманты занимают в ней относительно высокое положение.\n\nНекроманты-чернокнижники владеют особой зловещей магией некромантии. Они наполняют останки мертвецов магией, заставляя их взрываться в момент смерти. Кроме того, такие некроманты способны применять темные заклинания, чтобы ослаблять противника или причинять ему более невыносимые страдания.

actors.mobs.tumulus.necrowarlock$wickedbone.name=зловещая кость
actors.mobs.tumulus.necrowarlock$wickedbone.desc=Эта нежить (%s) обременена проклятием темной магии некроманта. Существа, наделенные этой магией, взрываются после смерти, нанося урон находящимся поблизости врагам.

levels.rooms.tomb.deadtowerroom$deadtower.name=пилон смерти
levels.rooms.tomb.deadtowerroom$deadtower.desc=Зловещий предмет в древней гробнице, источающий ауру смерти.\n\nПока эффект активен, тяжесть смертельных травм составляет не менее 30%.\n\nКаждый ход накладывает на нежить в радиусе 9 клеток щит прочностью 15/20 (в зависимости от местности) максимум до четырехкратного значения; если нежить в радиусе действия действия гибнет, защита пилона навсегда снижается на 0-5 единиц. При обнаружении врага немедленно, а затем каждые 10 ходов призывает 1 нежить из текущего этажа за пределами области 7х7 в случайное место в пределах области 7х7.
levels.rooms.tomb.deadtowerroom$deadtower.on_death=Некромантическая энергия немного ослабла, после взрыва пилона...

actors.buffs.elementalbuff.basebuff.deathbuff.name=смертельные травмы
actors.buffs.elementalbuff.basebuff.deathbuff.desc=Тлетворная, дыхание смерти, исходящее от нежити в древней гробнице, непрерывно разъедает ваше тело. Чем сильнее это воздействие, тем больше урона вы получаете; однако этот пагубный эффект постепенно ослабевает, если длительно избегать нападение нежити.
actors.buffs.elementalbuff.basebuff.deathbuff.level=Тяжесть смертельных травм: %s%%
actors.buffs.elementalbuff.basebuff.deathbuff.bonus=Сила получаемого урона: %s%%
actors.buffs.elementalbuff.basebuff.deathbuff.locked=Дыхание смерти твёрдо засело в теле, получаемый урон временно удается ослабить. (Ходов осталось: %s)
actors.buffs.elementalbuff.basebuff.deathbuff.decay_in=Урон от смертельных травм будет ослаблен через %s ходов.

actors.hero.herosubclass.none=Пусто

