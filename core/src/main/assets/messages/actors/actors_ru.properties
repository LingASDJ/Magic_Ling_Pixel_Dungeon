actors.mobs.npcs.smallleafharddungeon.pair_changed = Сяое: Фух... Это изрядно вымотало меня... Ну что, путешественник удачного пути, надеюсь мы еще встретиться снова.

actors.mobs.npcs.smallleafharddungeon$wndchangeprop.message = Итак, выбери что-то одно из следующего.
actors.mobs.npcs.smallleafharddungeon$wndchangeprop.change = Я уже выбрал
actors.mobs.npcs.smallleafharddungeon$wndchangeprop$3.select = Выберите безделушку

actors.mobs.npcs.smallleafharddungeon.must_reload=Тот, кто не рискует своей собственной жизнью, не может перейти на следующий этаж, пока не сделает свой выбор!

actors.mobs.npcs.smallleafharddungeon$wndchangeprop.pair_message=Выберите 1 положительную и 1 негативную безделушку того же уровня для объединения и превращения. Кнопка превращения станет активной, только после заполнения обеих слотов.
actors.mobs.npcs.smallleafharddungeon.change=Превратить безделушки
