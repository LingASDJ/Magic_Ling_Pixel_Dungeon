actors.mobs.bloodbat$bloodbatrecharge.name=перезарядка кровавой тени
actors.mobs.bloodbat$bloodbatrecharge.desc=Маленькая кровавая тень набирается сил, ожидая следующего раза, чтобы сразиться плечом к плечу со своим хозяином!\n\nОсталось ходов: %s.

actors.mobs.bloodbat.name=кровавая тень летучей мыши
actors.mobs.bloodbat.desc=Подручный соратник Разбойника, ради безопасности своего хозяина обречет на гибель всякого, кто попытается навредить ему.\n\nЕё способности тесно связаны с его хозяином, поэтому рост хозяина помогает маленькой кровавой тени расти!


actors.buffs.halomethaneburning.name=фосфорный огонь
actors.buffs.halomethaneburning.heromsg=Фосфорный огонь обволакивает вас, словно демон!
actors.buffs.halomethaneburning.burnsup=%s сгорает, не оставив даже пепла!
actors.buffs.halomethaneburning.ondeath=Вы умерли в муках от фосфорного огня...
actors.buffs.halomethaneburning.rankings_desc=От фосфорного огня не убежать
actors.buffs.halomethaneburning.desc=Мало что может быть более неприятным, чем быть охваченным фосфорным пламенем.\n\nФосфорный огонь будет наносить урон каждый ход, но его можно потушить, если встать в воду или разбить зелье под собой.\n\nКроме того, от фосфорного огня может загореться трава под вами или предметы в инвентаре. ]\n\nПо сравнению с обычным огнем, фосфорный более опасен и смертоносен. ]\n\nХодов осталось: %s.

# HellBurning 地狱火Buff
actors.buffs.hellburning.name=адское пламя
actors.buffs.hellburning.heromsg=Адский жар из преисподни, поглощает вас!
actors.buffs.hellburning.burnsup=%s превратился в пыль...
actors.buffs.hellburning.ondeath=Адское пламя испепелило вас дотла...
actors.buffs.hellburning.desc=Вы охвачены адским пламенем и каждый ход получаете урон от огня, который можно потушить водой.\n\nХодов осталось: %s.
actors.buffs.hellburning.effect_desc=Когда у монстра наложен эффект _Фосфорный огонь_, он заменяется на <#E94134>Адское пламя. <RGB> Монстры, находящиеся под действием Адского пламени, каждый ход получают магический урон в размере %s%% от своего <#E94134> максимального запаса здоровья, <RGB> и этот урон становится чистым, если у монстра отсутствуют свойства Чемпиона или Мутанта.\n\nЕсли этот эффект наложен на босса, он наносит <#E94134> %s ед. магического урона <RGB> каждый ход и сбрасывает щит, а адский огонь может распространяться подобно фосфорному огню.
actors.blobs.hellfire.desc=Здесь бушует адское пламя.

actors.buffs.sunfire.name = отмеченный солнцем
actors.buffs.sunfire.desc = Этот враг обожжен лучами солнца и получает повышенный урон от других мини-солнц.


actors.buffs.frostburning.name=ледяной огонь
actors.buffs.frostburning.heromsg=Ледяной огонь охватил ваше тело, вы чувствуете холод!
actors.buffs.frostburning.burnsup=%s замерзает от ледяного огня!
actors.buffs.frostburning.ondeath=Вы замерзли насмерть от ледяного огня...
actors.buffs.frostburning.rankings_desc=Заморожен насмерть ледяным огнем
actors.buffs.frostburning.desc=Мало что может быть более неприятным, чем быть охваченным ледяным пламенем.\n\nЛедяной огонь будет наносить урон каждый ход, а также замедлит скорость движения, пока не рассеется сам по себе и его нельзя потушить, если встать в воду или разбить зелье под собой.\n\n_По сравнению с обычным огнем, фосфорный более опасен и смертоносен._\n\nХодов осталось: %s.

actors.buffs.halofireimblue.name=пропитан фосфорным огнем
actors.buffs.halofireimblue.desc=Вы наделены силой Фосфорного огня!\n\nВсе ваши физические атаки имеют шанс поджечь цель фосфорным огнем. К тому же вы абсолютно невосприимчивы к обычному ледяному и фосфорному огню.\n\nХодов осталось: %s.

actors.mobs.slimeprincess.name=Королева слизней
actors.mobs.slimeprincess.notice=Остановитесь! Нарушитель!
actors.mobs.slimeprincess.defeated=Твой поступок узнает весь мир!
actors.mobs.slimeprincess.!!!=!!!
actors.mobs.slimeprincess.pumpup=Королева слизней готовится высвободить луч.
actors.mobs.slimeprincess.enraged=Почему ты такой доставучий?
actors.mobs.slimeprincess.gluuurp=Покажи мне, что ты можешь, смертный!

actors.mobs.slimeprincess.rankings_desc=Стал прислугой Королевы слизней
actors.mobs.slimeprincess.desc=Королева слизней - существо более могущественное, чем Йог-Джева. Ее сила зародилась в форме духа 300 лет назад от руки Бога-Творца, и так она стала его питомцем.\n\nПосле пожара Бог-Творец пропал и никто не знал где он. Тогда она решила прийти в этот древний замок, который давно заброшен, и впала в спячку, пока ваше присутствие... Не потревожило этого древнего первобытного духа...

custom.testmode.levelteleporter.name = Телепортатор
custom.testmode.levelteleporter.desc = Специальный артефакт с межпространственным лифтом для быстрого перемещения между этажами. Учтите, он не может перемещать героя, когда этаж заблокирован.\n\nТелепортация между этажами может вызывать ошибки в генерации сида. Команда разработчиков не несет ответственности по этому вопросу!
