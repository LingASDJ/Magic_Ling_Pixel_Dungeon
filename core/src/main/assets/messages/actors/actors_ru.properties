#####MLPD-P3文本

levels.rooms.special.skeletonfishroom$bluestonedoor.name=лазурный кристалл α
levels.rooms.special.skeletonfishroom$bluestonedoor.desc=Благодаря резонансу лазурных кристаллов вы обнаружили, что существуют таинственные области, которые так и ждут, чтобы их кто-то исследовал...

levels.rooms.special.skeletonfishroom$bluealtstonedoor.name=лазурный кристалл Ω
levels.rooms.special.skeletonfishroom$bluealtstonedoor.desc=Благодаря резонансу лазурных кристаллов вы обнаружили, что существуют таинственные области, которые так и ждут, чтобы их кто-то исследовал...


actors.buffs.status.foundchest.name=охота за сокровищами
actors.buffs.status.foundchest.desc=Вы попали в сокровищницу Короля мимиков. Похоже, здесь вы можете найти _%s/5_ мимиков, прежде чем это место станет нестабильным, заставив других мимиков сбежать!\n\nИногда вы можете узреть молодую форму Короля мимиков, но из-за искривления времени и пространства вы не силах убить его здесь...

actors.buffs.herodisguise.name=маскировка
actors.buffs.herodisguise.desc=Магия иллюзий изменяет вашу внешность! Хотя этот эффект носит исключительно декоративный характер, он все равно кажется странным.\n\nХодов осталось: %s.

actors.buffs.greaterhaste.name=повышенная спешка
actors.buffs.greaterhaste.desc=Невероятный прирост в скорости, на мгновение кажется, что всё остальное стоит на месте.\n\nВ то время как в условиях повышенной спешки перемещение не занимает много времени, другие действия по-прежнему выполняются с нормальной скоростью. Каждый шаг движения потребляет ход повышенной спешки.\n\nХодов осталось: %d.

actors.mobs.bosses.peach.whiteyan.name=Байянь
actors.mobs.bosses.peach.whiteyan.desc=Таинственная девушка с далёкого острова, где растёт множество персиков. Поговаривают, она является покровительницей ныне живущих здесь людей.

actors.mobs.bosses.galaxy.servantavgomon.name=Прислужник Афоргомона
actors.mobs.bosses.galaxy.servantavgomon.desc=Неведомая раса, поклоняющиеся Афоргомону. Вера прислужников в Афоргомона сильна, но поскольку он стал слишком жесток, часть верующих последовала за Тавилем.
actors.mobs.bosses.galaxy.servantavgomon.scorpion=Бегство - плохая затея!

actors.mobs.bosses.galaxy.fourstone$magicfourstone.name=желтая стела
actors.mobs.bosses.galaxy.fourstone$magicfourstone.desc=Содержит в себе магическую силу. Интересно что произойдет, если взаимодействовать с ней?

actors.mobs.bosses.galaxy.fourstone.name=красная стела
actors.mobs.bosses.galaxy.fourstone.desc=Содержит в себе силу драконьей крови. Интересно, что произойдет, если взаимодействовать с ней?

actors.mobs.bosses.galaxy.fourstone$frostfourstone.name=голубая стела
actors.mobs.bosses.galaxy.fourstone$frostfourstone.desc=Содержит в себе силу льдов. Интересно, что произойдет, если взаимодействовать с ней?

actors.mobs.bosses.galaxy.fourstone$poisonfourstone.name=зеленая стела
actors.mobs.bosses.galaxy.fourstone$poisonfourstone.desc=Содержит в себе ядовитую силу. Интересно, что произойдет, если взаимодействовать с ней?


actors.mobs.bosses.galaxy.endyog.name=Йог-Сотот
actors.mobs.bosses.galaxy.endyog.desc=Йог-Сотот знает, где находятся Врата. Ибо Йог-Сотот и есть Врата. Йог-Сотот это и Страж врат и Ключ к ним. Прошлое, настоящее и будущее слились воедино в нём. Ибо все есть Он - Йог-Сотот.
actors.mobs.bosses.galaxy.endyog.message1=Похоже, я был прав. У тебя есть возможность прикоснуться к Вратам. Так уж и быть, я сдержу свое обещание и покажу тебе, как на самом деле выглядит этот ключ.
actors.mobs.bosses.galaxy.endyog.message2=Я продолжу наблюдать за тобой.

actors.mobs.bosses.galaxy.sliverlocksword.name=Серебряный ключ
actors.mobs.bosses.galaxy.sliverlocksword.desc=Наконец-то вы узрели истинный внешний вид ключа. Он покрыт зашифрованным узором арабески, похожим на виноградную лозу, не имеющего четкого значения. Возможно, узор символизирует цель и тайну этой объективной и бесцельной вселенной, но вы этого не способны постичь. Однако вы чувствуете, что в этом ключе заключена мощная сила, способная даже изменить мир.\n\nНа это оружие наложено зачарование хаоса.\n\nЭто оружие имеет максимальный уровень 12.\nПри +3 точность увеличивается с 1 на 2.\nПри +6 дальность атаки увеличивается с 1 на 2.\nПри +9 атаки вызывают замедление.

actors.mobs.npcs.zero.yetyog.scroll=Теперь ты сможешь постичь более глубокие тайны, приняв это! Надеюсь, он поможет тебе.


actors.mobs.bosses.galaxy.sothothlasher.name=Прикосновение Тавиля
actors.mobs.bosses.galaxy.sothothlasher.desc=Неизведанное существо, над которым подвластно сознание Тавиля, и оно похоже на обычное щупальце. Хоть оно и выглядит крайне агрессивно, для Тавеля оно ничем не отличимо от домашнего животного.


actors.mobs.npcs.extra.trueyog.name=Паопао
actors.mobs.npcs.extra.trueyog.desc=Почему-то смутно чувствуется, что девушка перед вами каким-то образом связана с тем существом из самой глубокой части подземелья? Но, по крайней мере, сейчас она выглядит просто загадочной девушкой.
custom.utils.plot.trueyogplot.name=Паопао
custom.utils.plot.trueyogplot.message1=Ой, ты тоже сюда пришел.
custom.utils.plot.trueyogplot.message2=Почему я здесь? Не удивляйся, я могу находиться в любом времени и пространстве.\n\nМои осколки пустили здесь корни и посеяли хаос. Я не ожидала, что тебе удастся победить их всех в одиночку.

actors.mobs.npcs.extra.trueyog.quest_start_prompt=Теперь, когда все закончилось, не хочешь ли ты вернуться со мной?

actors.mobs.npcs.extra.trueyog.quest_boss_prompt=Готовы ли ты пройти испытание?

actors.mobs.npcs.extra.trueyog.enter_yes=Да
actors.mobs.npcs.extra.trueyog.enter_no=Нет

actors.mobs.npcs.extra.peachgodstate.name = Идол Байянь
actors.mobs.npcs.extra.peachgodstate.desc = Статуя, который неожиданно появился здесь.\n\nЭта искусно вырезанная идол, видимо, стоит здесь уже давно, но похоже, что снег и пыль, витающий вокруг нее, по какой-то причине не могут осесть на ней. Почему-то создается ощущение, что вы где-то уже видели её...
actors.mobs.npcs.extra.peachgodstate.title = Молитва
actors.mobs.npcs.extra.peachgodstate.notenough = У вас не так уж и много кобальтовых монет, чтобы сделать подношение...
actors.mobs.npcs.extra.peachgodstate.lucky_desc = Перед статуей разложены некоторые подношения. Похоже, те кто жертвует некую часть кобальтовых монет, могут получить благословение богов. Может и вам стоит попробовать?\n\nСовершено подношений: %s.
actors.mobs.npcs.extra.peachgodstate.you_now_have = Когда вы возложили кобальтовые монеты в тарелку для сбора дани... Вы обнаружили кое-что новое в своем рюкзаке. Вы подобрали: 
actors.mobs.npcs.extra.peachgodstate.single = Лишняя мелочь! (50 к.)
actors.mobs.npcs.extra.peachgodstate.ten_shots = Щедрая душа! (500 к.)
actors.mobs.npcs.extra.peachgodstate.cancel = Пожертвую в следующий раз...
actors.mobs.npcs.extra.peachgodstate.touchtop = Вы заметили, что кобальтовые монеты, которые вы возложили при подношении, никуда не исчезли. Похоже, ваше подношение уже достигло предела.
actors.mobs.npcs.extra.peachgodstate.surplus = Вы заметили, что кобальтовые монеты, которые вы возложили при подношении, исчезли частично. Похоже, ваше подношение уже достигло предела.
actors.mobs.npcs.extra.peachgodstate.gold=Легендарное сокровище!
actors.mobs.npcs.extra.peachgodstate.lends=Мифическое сокровище!
actors.mobs.npcs.extra.peachgodstate.hello=Необычное тепло согревает эту комнату.
actors.mobs.npcs.smallleafharddungeon.cancelselect=Статуя: ...

custom.utils.plot.trueyogplot.message3a=Теперь, когда все закончилось, не хочешь ли ты вернуться со мной?
custom.utils.plot.trueyogplot.message4a=Итак, ты все еще хочешь продолжать исследовать тайны глубин?

actors.mobs.bosses.galaxy.sothothnpc.name=Тавил Ат'Умр Йог-Сотот

actors.mobs.bosses.galaxy.sothotheyedied.name=Тавил Ат'Умр Йог-Сотот
actors.mobs.bosses.galaxy.sothotheyedied.desc=«Йог-Сотот знает Врата. Йог-Сотот и есть Врата. Йог-Сотот это и Страж врат и Ключ к ним. Прошлое, настоящее и будущее слились воедино в нём. Ибо все есть Он - Йог-Сотот».\n\nБожество наблюдает за вами, он видит вас насквозь, но в его глазах нет злобы или коварных помыслов, а лишь проблеск пустоты, до которого не в силах докопаться. В конце концов, как он сказал, что это всего лишь испытание, не несущее вреда вашей жизни, но вы все равно не должны относиться к нему легкомысленно.\n\nХаотическая энергия стекается в ладони божества. Он всезнающ, всемогущ и никогда не ошибается. Он извлекает энергию из разрушающихся мирозданий и высвобождает мощную волну во времени и пространстве, когда его разрушение достигнет предела. Если он заколеблется и не сумеет вовремя спастись, он в мгновение превратится в пыль.

actors.mobs.bosses.galaxy.abyssbook.name=книга Бездны
actors.mobs.bosses.galaxy.abyssbook.desc=Вы давно наслышаны о том, что в Некрономиконе содержится все неведомое, и давно готовы к тому, что на вас нахлынут безграничные знания. Но когда вы открыли её, вы обнаружили, что в середине книги был помещен... …комикс. И тогда вы понимаете, что божество, с которым вы только что яростно сражались, было не более чем простой уловкой.\n\nНо, по крайней мере, те части, которые вы сумели разобрать, позволят вам управлять крошечной частью её силы по своему усмотрению.\n\n«То не мертво, что в вечности таится, со смертью вечности и смерть умрет...».\n\n-Абдул Альхазред
actors.mobs.bosses.galaxy.abyssbook.book_blessed=Выберите нужное вам благословение: ХХХХ

actors.mobs.bosses.galaxy.sothotheyedied.galaxy=Бесчестно убивать моих друзей!
actors.mobs.bosses.galaxy.sothotheyedied.deadsling=Даже если это конец, никогда не падай духом, когда ты в шаге от победы.

actors.mobs.bosses.galaxy.sothothnpc.message1=Кстати, я еще не до конца представилась.
actors.mobs.bosses.galaxy.sothothnpc.message2=Я - Тавил Ат'Умр Йог-Сотот, я тот, кто объединяет все сущее. Покажи мне, %s, всю свою силу, сразившись со мной в этом разломе вне пространства и времени!



custom.utils.plot.trueyogplot.message3b=Интересно... я чувствую, как от тебя исходит знакомая энергия. У тебя еще остались силы, чтобы уделить еще мне немного времени?
custom.utils.plot.trueyogplot.message4b=Хотя ключ и претерпел некоторые изменения, он до сих пор не обрел свой первоначальный вид. Я могу вернуть ему прежний облик, но тогда мне нужно испытать тебя на то, сможешь ли ты управлять им, не утонув в бесконечных знаниях.
custom.utils.plot.trueyogplot.message5b=Не волнуйся, твоей жизни ничего не угрожает, но я думаю, ты сможешь вернуться когда будешь хорошо подготовлен. Как тебе такой вариант? Ты принял уже решение?
custom.utils.plot.trueyogplot.message6b=Может быть, однажды появится случай, когда ты сможешь воспользоваться этим ключом. Но тогда... какое существо ты увидишь?

actors.mobs.bosses.galaxy.sothoth.name=Тавил Ат'Умр
actors.mobs.bosses.galaxy.sothoth.desc=«Йог-Сотот знает Врата. Йог-Сотот и есть Врата. Йог-Сотот это и Страж врат и Ключ к ним. Прошлое, настоящее и будущее слились воедино в нём. Ибо все есть Он - Йог-Сотот».\n\nБожество наблюдает за вами, он видит вас насквозь, но в его глазах нет злобы или коварных помыслов, а лишь проблеск пустоты, до которого не в силах докопаться. В конце концов, как он сказал, что это всего лишь испытание, не несущее вреда вашей жизни, но вы все равно не должны относиться к нему легкомысленно.\n\nХаотическая энергия стекается в ладони божества. Он всезнающ и всемогущ и никогда не ошибается. Он извлекает энергию из разрушающихся мирозданий и высвобождает мощную волну во времени и пространстве, когда его разрушение достигнет предела. Если он заколеблется и не сумеет вовремя спастись, он в мгновение превратится в пыль.
actors.mobs.bosses.galaxy.sothoth.notice=Я - Тавил Ат'Умр Йог-Сотот, я тот, кто объединяет все сущее. Покажи мне %s всю свою силу, сразившись со мной в этом разломе вне пространства и времени.
actors.mobs.bosses.galaxy.sothoth.message=Свет мудрости приближается!
actors.mobs.bosses.galaxy.sothoth.defeated=Невероятно! Ты оказался намного сильнее, чем я думал... Пожалуй, я буду использовать немного больше силы.
actors.mobs.bosses.galaxy.sothoth.dead=Сотот: Как жаль, но в следующий раз будет еще один шанс. Подготовься и попробуй еще раз.

###TRK
actors.mobs.ebonymimic.name=эбонитовый мимик
actors.mobs.ebonymimic.reveal=Здесь прятался мимик!
actors.mobs.ebonymimic.hidden_name=подозрительное очертание
actors.mobs.ebonymimic.hidden_desc=Похоже, здесь что-то кроется, но оно почти полностью прозрачно.
actors.mobs.ebonymimic.desc=Мимики - волшебные существа, способные принимать любой облик. В подземельях они почти всегда принимают облик сундука, чтобы заманить ничего не подозревающих путешественников.\n\nЭбонитовые мимики - необычайно крепкие мимики, которые способны становиться почти невидимыми. Они обычно прячутся в вещах, которые могут подобрать путешественники, но при этом содержат и свои сокровища.


actors.mobs.dragon.piraland.name=мутированная пиранья
actors.mobs.dragon.piraland.desc=Эти изначально спокойные рыбы стали жестокими и опасными из-за аномальных всплесков энергии. Теперь они даже вне воды могут охотиться на все живое вокруг в поисках пищи.\n\n_Особый эффект: скорость передвижения увеличена на 10% при нахождении в воде._

actors.mobs.dragon.ricerat.name=рисовая крыса
actors.mobs.dragon.ricerat.desc=Мутация в подземелье заразила даже крыс, сейчас они вроде бы пахнут клейким рисом, но на самом деле такие же опасны как другие крысы.\n\nЧтобы уничтожить мутацию крыс, необходимо найти и устранить их источник.
actors.mobs.dragon.ricerat.frost_kill=Неведомая сила разорвала вас на куски...

actors.mobs.dragon.pirahaking.name=Мурлок, Предок Пираньи
actors.mobs.dragon.pirahaking.desc=То, что я сделал, уже необратимо. Закрыть глаза и принять тьму...\n\nВздох отчаянья переполнил весь воздух.\n\nСлава и богатство, долг, стремление - все это когда-то закончится здесь.\n\nКажется, в нем смешались самые разные эмоции, возможно, это и есть первопричина мутации. Победите мурлока и отправьте его на покой.
actors.mobs.dragon.pirahaking.spear=Холод следует «за твоим телом».
actors.mobs.dragon.pirahaking.nowater=Мурлок попал на сушу и был телепортирован!
actors.mobs.dragon.pirahaking.notice=Я заставлю твою душу плясать под мою дудку!
actors.mobs.dragon.pirahaking.leap=Просто смирись и ожидай грядущий конец.
actors.mobs.dragon.pirahaking.teleport_away=Любая суша - теперь показывает, что я могу ходить!
actors.mobs.dragon.pirahaking.defeated=…………

levels.rooms.standard.bloodcrystalroom$bloodcrt.name=кровавый кристалл
levels.rooms.standard.bloodcrystalroom$bloodcrt.desc=Этот кровавый кристалл периодическим излучает энергию, наделяя всех врагов случайными усиливающими эффектами из списка ниже.\n\n_-_1. В вашем теле разгорается дикая ярость, увеличивающая наносимый физическими атаками урон на 50%.\n_-_2. Тайный барьер дает 20 ед. щита, который может рассеяться со временем.\n_-_3. Пропитаность фосфорным огнем на 10 ходов, которая может рассеяться со временем.\n_-_4. Иммунитет к магии на 10 ходов, который может рассеяться со временем.\n_-_5. Пропитаность огнем на 15 ходов, которая может рассеяться со временем.\n_-_6. Пропитаность холодом на 15 ходов, которая может рассеяться со временем.
levels.rooms.standard.bloodcrystalroom$bloodcrt.desc_info=Кристалл на текущем этаже усиливает всех врагов каждые _%s ходов_.

actors.mobs.npcs.zero.zerodreamshop.name=Лань Мэнло
actors.mobs.npcs.zero.zerodreamshop.desc=Торговец модной одеждой незнакомого происхождения продает наряды, которые способны преобразить ваш внешний вид.
actors.mobs.npcs.zero.zerodreamshop.message1=Приветствую, добро пожаловать в мой магазин модной одежды.
actors.mobs.npcs.zero.zerodreamshop.message2=Покупай новую одежду, чтобы обновить себе стиль.
actors.mobs.npcs.zero.zerodreamshop.message3=Чтобы приобрести костюм, тебе придется потратить кобальтовые монеты.
actors.mobs.npcs.zero.zerodreamshop.message4=Каждый товар имеет различную стоимость по кобальтовым монетам, приходи и выбирай.

actors.mobs.npcs.zero.zerodreamshop.descx=Пожалуйста, не стесняйтесь выбирать, в будущем будет добавлено больше костюмов.\n\nПосле активации костюма перейдите в интерфейс выбора персонажа, чтобы сменить скин.\n\nКак только скин будет активирован, он начнет действовать глобально, и броня больше не будет влиять на внешний вид скина.
actors.mobs.npcs.zero.zerodreamshop.no=У вас не хватает кобальтовых монет, приходите когда накопите достаточную сумму.
actors.mobs.npcs.zero.zerodreamshop.no_skin=У вас нет ваучера на приобретение одежды!
###
actors.buffs.clearbleesdgoodbuff.blessunlock.name=всевидящее око
actors.buffs.clearbleesdgoodbuff.blessunlock.desc=Ключ-меч активизировал ваш потенциал, и теперь вы можете отпирать железные или хрустальные двери пока не закончатся ходы. Действие эффекта автоматически прекращается при его задействовании.\n\nХодов до полного рассеивания: %s.

### BOSSRUSH

actors.buffs.clearbleesdgoodbuff.blessbossrushlow.name=благо темного пламени
actors.buffs.clearbleesdgoodbuff.blessbossrushlow.desc=Благословение будет защищать и уменьшать весь получаемый урон на 20%, пока действует эффект.

actors.mobs.bosses.bossrush.rival.name=%s?
actors.mobs.bosses.bossrush.rival.namex="Вы"
actors.mobs.bosses.bossrush.rival.arise=Двойники, придите и помогите мне!
actors.mobs.bosses.bossrush.rival.mustone=%s: обнаружена потеря данных, запущено восстановление...
actors.mobs.bosses.bossrush.rival.desc=Это "Вы", пришедшие из другой временной линии, где были подвержены чёрной магией ордена некромантов. Это они приказали вашему двойнику прийти сюда. Вы должны победить этого «двойника», чтобы продолжить путешествие здесь...
actors.mobs.bosses.bossrush.rival.died_kill=Сила вашего двойника полностью поглотила вас!
actors.mobs.bosses.bossrush.rival$darkbolt.rankings_desc=Двойник утянул вас в пропасть...
actors.mobs.bosses.bossrush.rival.rankings_desc=Двойник утянул вас в пропасть...
actors.mobs.bosses.bossrush.rival.revive=Анх наполнился живительной энергией!
actors.mobs.bosses.bossrush.rival.weapon=\n\nДвойник носит оружие: _%s_.
actors.mobs.bosses.bossrush.rival.armor=\n\nДвойник носит броню: _%s_.
actors.mobs.bosses.bossrush.rival.ring=\n\nДвойник носит кольцо: _%s_.
actors.mobs.bosses.bossrush.rival.wand=\n\nДвойник носит палочку: _%s_.
actors.mobs.bosses.bossrush.rival.missile=\n\nДвойник носит метательное оружие: _%s_.
actors.mobs.bosses.bossrush.rival.ankhs=\n\nДвойник носит 4 освященных анха.
actors.mobs.bosses.bossrush.rival.protected=%s: ты скоро пожалеешь о своем выборе!
actors.mobs.bosses.bossrush.rival.question=Уходи отсюда...
actors.mobs.bosses.bossrush.rival.exclamation=Ты понятия не имеешь, что делаешь!
actors.mobs.bosses.bossrush.rival.interrobang=Кто ты? Я что в другой временной линии?!
actors.mobs.bosses.bossrush.rival.ellipsis=Возможно, тебе удастся спасти это место...

actors.mobs.bosses.bossrush.skygoo.blob=Кроваво-туманный газ\nЗдесь исходит необычайно едкий газ, который опасен для всех существ. Лучше держатся от его подальше.
actors.mobs.bosses.bossrush.skygoo.rd=В конце отчаяния загорается свет надежды.
actors.mobs.bosses.bossrush.skygoo.ss=Я заберу твою кровь себе!
actors.mobs.bosses.bossrush.skygoo.zl=Почувствуй огонь и гром!
actors.mobs.bosses.bossrush.skygoo.leap=Подожди, я доберусь до тебя...
actors.mobs.bosses.bossrush.skygoo.name=Небесный слизень
actors.mobs.bosses.bossrush.skygoo.notice=Обнаружен злоумышленник, заблокируйте все выходы! Всем быть начеку, приготовиться к бою.
actors.mobs.bosses.bossrush.skygoo.slime=Выходи, моя армия уже здесь!
actors.mobs.bosses.bossrush.skygoo.defeated=Ты первый кто смог одолеть меня, но ты даже не представляешь, какие ужасы таятся глубоко под землей! Я буду ждать тебя здесь!
actors.mobs.bosses.bossrush.skygoo.run=Слизень заканчивает бой и отпускает тебя.
actors.mobs.bosses.bossrush.skygoo.!!!=Ты!
actors.mobs.bosses.bossrush.skygoo.pumpup=Я не знаю, что ты задумал, но тебя нужно наказать!
actors.mobs.bosses.bossrush.skygoo.enraged=Ты раздражаешь меня!
actors.mobs.bosses.bossrush.skygoo.lj=Это все? Все? Чушь. Иди домой и отдохни!
actors.mobs.bosses.bossrush.skygoo.gluuurp=Почему ты хочешь, чтобы я разорвал договор?
actors.mobs.bosses.bossrush.skygoo.rankings_desc=Поглощён Небесным слизнем
actors.mobs.bosses.bossrush.skygoo.desc=После того катастрофического случая джунгли начали буйно разрастаться, и о них все забыли. Однако, происшествие не заставило его покинуть это место. Поэтому он и может здесь повстречаться ...\nСпециальный босс «Испытания боссами».
actors.mobs.bosses.bossrush.skygoo.zap_kill=Вы были убиты молнией...
actors.mobs.bosses.bossrush.skygoo.$lightningbolt.rankings_desc=Наказан молнией Небесного слизня!

actors.mobs.npcs.hkd.name=Маленький рыцарь
actors.mobs.npcs.hkd.desc=Гость из другого измерения, в котором распространяется чума, решил немного отдохнуть здесь, в гостинице...
actors.mobs.npcs.hkd.id_1=Ого, ты тоже здесь! Что? Почему я тоже тут? Наверное, потому что это подземелье выглядит интересно; поэтому я тоже сюда спустился.
actors.mobs.npcs.hkd.id_2=Если ты решил продолжить путь - дальше в глубинах опасно, а я уже не в лучшей форме. Я решил вернуться, и подумал отдать тебе это. Мне эта штука больше не нужна.
actors.mobs.npcs.hkd.id_3=Путь впереди нелегкий, дорога изменчива. Но если нам суждено, мы еще встретимся в будущем.

### ZERO
actors.mobs.npcs.zero.hollowknight.name=Маленький рыцарь
actors.mobs.npcs.zero.hollowknight.desc=Гость из другого измерения, пораженного чумой, решил немного отдохнуть здесь, в гостинице...
actors.mobs.npcs.zero.hollowknight.message1=Еще один путешественник? Это место очень оживленное... Я здесь совсем недавно, а уже столько путешественников повстречал.
actors.mobs.npcs.zero.hollowknight.message2=Скажи, мы знакомы? А, может, я просто ошибаюсь... возможно, я просто видел кого-то похожего на тебя. Ну ладно, раз ты выглядишь мне знакомым, я отдам тебе это.
actors.mobs.npcs.zero.hollowknight.message2b=Скажи, мы знакомы? А, может, я просто ошибаюсь... возможно, я просто видел кого-то похожего на тебя. Ну ладно, мне кажется ничего не будет, если я отдам тебе _золотую монету_.
actors.mobs.npcs.zero.hollowknight.message3=Ты собираешься в то место, которое именуют подземельем, как и все путники до тебя?
actors.mobs.npcs.zero.hollowknight.message4=Ох, ты все еще здесь, разве ты не хотел спуститься в подземелье? Что? Почему я здесь? Я тоже путешественник! Странствуя, пришел сюда, чтобы отдохнуть. Возможно, позже я тоже скоро продолжу свой путь.
actors.mobs.npcs.zero.hollowknight.message5=Тебе не надоело, слушать мою болтовню? Если тебе стало скучно, почему бы тебе не спуститься в подземелье?
actors.mobs.npcs.zero.hollowknight.message6=Ух ты, да ты настойчивый. Если у тебя так полно свободного времени, не хочешь ли послушать мои истории из путешествий? Шучу. Мне бы, пришлось бы, болтать днями и ночами чтобы закончить рассказ.
actors.mobs.npcs.zero.hollowknight.message7=Я устал болтать... Ты такой терпеливый... Поспеши, отправляйся в путь. Хватит меня доставать, глупыми разговорами.

actors.mobs.npcs.zero.hollowknight.d1=Увернулся!
actors.mobs.npcs.zero.hollowknight.d2=Выдержал
actors.mobs.npcs.zero.hollowknight.d3=Что случилось? У тебя плохое настроение?
actors.mobs.npcs.zero.hollowknight.d4=Если тебе плохо, зачем на мне отыгрываешься?
actors.mobs.npcs.zero.hollowknight.d5=Хоть, я и миролюбив, но у всего есть предел...
actors.mobs.npcs.zero.hollowknight.d6=Умри!
actors.mobs.npcs.zero.hollowknight.kill=Сила небытия поглотила вас...
actors.mobs.npcs.zero.hollowknight.rankings_desc=|Погиб в поглощенной пустоте|

actors.mobs.npcs.zero.waloke.name=Рон

actors.mobs.npcs.zero.waloke.desc=После вашего первого визита в заснеженный каньон, он решил перебраться сюда...\n\nВозможно, с ним можно поговорить.
actors.mobs.npcs.zero.waloke.message1=Здравствуй, %s. Мы опять встретились...
actors.mobs.npcs.zero.waloke.message2=Меня зовут Рон, и я торговый лорд. После того, как ты прошел тогда испытание Лены, она попросила меня приехать в этот город и дождаться тебя.
actors.mobs.npcs.zero.waloke.message3=Когда-то Лена была представителем Пяти Великих Ведьм, но после того случая все изменилось...
actors.mobs.npcs.zero.waloke.message4=Этот городок сейчас опаснее, чем ты думаешь. А временная шкала стала еще более запутанной...
actors.mobs.npcs.zero.waloke.message5=Ты думаешь, что достаточно знаешь мир? Если так, у меня есть несколько мест, которые Лена подготовила для тебя... Туда можно попасть через телепорт-платформу в правом верхнем углу города.
actors.mobs.npcs.zero.waloke.message6=Строго говоря, это отражение мультивселенной. В этом мире есть множество версий тебя, а в параллельных мирах ты можешь испытать нечто больше...
actors.mobs.npcs.zero.waloke.message7=Тебе нужно исследовать эти параллельные вселенные и обнаружить источник энергии, ведь случай с поджогом был не случайностью, Лена всё знает, но сейчас не может сказать...
actors.mobs.npcs.zero.waloke.message8=Кроме того, поскольку я торговый лорд, мне все равно нужно взимать небольшую плату за обслуживание. В качестве оплаты будет приниматься валюта, выпущенная этой женщиной...
actors.mobs.npcs.zero.waloke.message9=Что ж, продолжим разговор, когда найдешь что-то новое в своих исследованиях. А сейчас, я желаю тебе удачи в исследовании разных миров и параллельных вселенных...

actors.mobs.npcs.zero.waloke.descx=Именно здесь исследуются различные временные линии. Поскольку сила Лены все еще ослаблена, то и мест, куда она способна отправить вас, не так уж и много.\n\nКроме того, если вы отправитесь в место, где обитают могущественные монстры или где Лена окажется ведьмой, там нужно быть предельно осторожным.\n\nПосле активации, вам потребуется выбрать отражение, прежде чем вы сможете начать исследование.


actors.mobs.npcs.zero.waloke.quest_start_prompt=Прежде чем начать исследование, тебе предстоит сделать некий выбор...
actors.mobs.npcs.zero.waloke.easy=Отражение первоначала
actors.mobs.npcs.zero.waloke.normal=Отражение испытаний
actors.mobs.npcs.zero.waloke.hard=Отражение чистилища
actors.mobs.npcs.zero.waloke.hell=Отражение кошмаров
actors.mobs.npcs.zero.waloke.br_no_clear=Вы должны пройти игру «Испытания боссами» и получить скрытую медаль _Начало после Конца_, чтобы разблокировать уровень сложности «Кошмаров».

actors.mobs.npcs.zero.waloke.quest_start2_prompt=Вы переходите к новому этапу глубокого исследования, удачи!
actors.mobs.npcs.zero.waloke.randmode=Начать

actors.mobs.npcs.zero.luowhite.name=Лобай
actors.mobs.npcs.zero.luowhite.desc=Этот мужчина с квадратной шляпой и плаще, говорят, известный коллекционер, и он владеет здесь оружейной лавкой, сходите и посмотрите, какие полезные вещи в ней продаются.
actors.mobs.npcs.zero.luowhite.message_ice=Добро пожаловать, путешественник. Похоже, ты здесь впервые. Вот держи 30 кобальтовых монет в качестве приветственного подарка.
actors.mobs.npcs.zero.luowhite.message_ice2=Добро пожаловать, путешественник. Похоже, мир стал несколько другим. Считай, %d эту кобальтовую монету моим подарком.
actors.mobs.npcs.zero.luowhite.message1=Добро пожаловать, путешественник, хочешь что-нибудь купить?
actors.mobs.npcs.zero.luowhite.descx=Добро пожаловать, %s, хочешь что-нибудь купить?\n\nВ лавке продаются только эти товары, однако в качестве бонуса при разблокировке какого-нибудь легендарного оружия, тебе будет выдана ​​его поврежденная в сражениях версия, которая не подлежит возврату.
actors.mobs.npcs.zero.luowhite.message3=Ты опоздал, путешественник, все товары распроданы.

actors.mobs.npcs.zero.whiteyan.name=Байянь
actors.mobs.npcs.zero.whiteyan.desc=Беловолосая девушка с красивыми волосами, которые настолько длинные, что мешают ей спокойно передвигаться. Она выглядит невинной и наивной, должно бить поэтому она такая дружелюбна.
actors.mobs.npcs.zero.whiteyan.message1=Ого, мы с вами раньше нигде не встречались? Чем я могу помочь?
actors.mobs.npcs.zero.whiteyan.message2=Ты хочешь спуститься туда? Зачем? Там опасно, разве тебе не дорога твоя жизнь?
actors.mobs.npcs.zero.whiteyan.message3=Почему у меня такие длинные волосы? Разве они не придают красоту, когда длинные?
actors.mobs.npcs.zero.whiteyan.message4=Я выгляжу не так, как все? Ну, наверное все должны как-то отличатся...
actors.mobs.npcs.zero.whiteyan.message5=Особенно отличаюсь? Разве она не симпатичнее меня?
actors.mobs.npcs.zero.whiteyan.message6=Ты решил не спускается? Или у тебя есть время поболтать со мной?
actors.mobs.npcs.zero.whiteyan.message7=Ой! Тебе что-то нужно от меня, да? Так же, как и всем остальным тут...
actors.mobs.npcs.zero.whiteyan.message8=Что? Зачем я должна знать, что все постоянно что-то дают вам? Мне нет дела до этого.
actors.mobs.npcs.zero.whiteyan.message9=Э-эй, с чего вы взяли, что у меня что-то есть, что я могу дать, когда у меня явно ничего нет?
actors.mobs.npcs.zero.whiteyan.message10=У меня действительно ничего нет. Даже если вы хорошо попросите меня, я не могу вам нечего предложить.
actors.mobs.npcs.zero.whiteyan.message11=У меня правда ничего нет для вас, не беспокойте меня просто так.
actors.mobs.npcs.zero.whiteyan.message12=Я...
actors.mobs.npcs.zero.whiteyan.message13=......


actors.mobs.npcs.zero.yetyog.name=Паопао
actors.mobs.npcs.zero.yetyog.desc=Почему-то смутно чувствуется, что девушка перед вами каким-то образом связана с тем существом самой глубокой части подземелья? Но, по крайней мере, сейчас она выглядит просто загадочной девушкой.
actors.mobs.npcs.zero.yetyog.message1=Я всезнающая, всемогущая и всевидящая. Желаешь тоже прикоснуться к двери времени и пространства?
actors.mobs.npcs.zero.yetyog.message2=Это то, к чему ты стремился: бытие мира, запретные знания, могущественная сила или...
actors.mobs.npcs.zero.yetyog.message3=Возможно, тебе еще рано прикасаться к мудрости другого измерения. В данный момент, пожалуй, для тебя будет более полезным частичное раскрытие реальности.
actors.mobs.npcs.zero.yetyog.message4=Я всегда буду присматривать за тобой, дитя мое.
actors.mobs.npcs.zero.yetyog.def_verb_1=Когда-то все обратятся в прах...
actors.mobs.npcs.zero.yetyog.def_verb_2=Дела у магазина Няруко действительно хороши...
actors.mobs.npcs.zero.yetyog.def_verb_3=Не бойся, дитя, мы присмотрим за тобой...

actors.mobs.npcs.zero.mint.n=Спящая кошка
actors.mobs.npcs.zero.mint.name=Минт
actors.mobs.npcs.zero.mint.x=Надеюсь, эта книга поможет тебе, и желаю удачи в твоем путешествии.
actors.mobs.npcs.zero.mint.d=Она лежит на старой книге в твердом переплете, где на обложке изображено злобное лицо. Никто не знает, кусается ли такая книга, если её коснутся.
actors.mobs.npcs.zero.mint.desc=Звероухая девушка из другого мира, которая выражает свое недоумение по поводу того, что кто-то потревожил её сон.
actors.mobs.npcs.zero.mint.message1=Ты когда-нибудь задавался вопросом, откуда в тебе столько настойчивости?
actors.mobs.npcs.zero.mint.message2=Кажется, у тебя ничего нет. Хочешь, я покажу фокус? Просто... дав тебе книгу.
actors.mobs.npcs.zero.mint.message3=Не моргай и подойди посмотри, как я исполняю фокус.
actors.mobs.npcs.zero.mint.message4=Эта книга, которую я создала, таит в себе отпечаток этого мира, и она должна помочь тебе. Что, почему я тебе помогаю? Мне кажется, что ты немного похож на него. Но, это по секрету между нами. Никому никогда не говори про услышанное.
actors.mobs.npcs.zero.mint.message5=Счастливого путешествия, %s. Эй, откуда я знаю твое имя? Это секрет!

actors.mobs.npcs.zero.whiteling.name=Лин
actors.mobs.npcs.zero.whiteling.desc=Никто не знает, откуда она родом, но иногда она приезжает отдохнуть в Снежную гостиницу.\n\nЕсли вы встретите ее, попробуйте завязать с ней разговор.
actors.mobs.npcs.zero.whiteling.message1=Приветствую, %s мы уже довольно давно знакомы, не так ли?
actors.mobs.npcs.zero.whiteling.message2=Думаю, ты уже догадался, кто я. Однако в силу определенных обстоятельств пока я могу только помолиться за тебя.
actors.mobs.npcs.zero.whiteling.message3=Дунлин и Лена - обе хорошие девочки, спасибо, что желаешь спасти их. Ранее, я заключила одну ведьму в тюрьму из-за личной обиды. По иронии судьбы, мы обе лишились того, что было нам дорого…
actors.mobs.npcs.zero.whiteling.message4=Прошу %s, продолжай расследовать. Однако, если ты встретишь ведьму, не бойся её. У неё доброе сердце, поэтому я предпочла заточить её в тюрьму, а не казнить. Однако мои силы уже на исходе, и у меня нет времени, чтобы сдерживать печать. Надеюсь, тебе удастся отговорить её отказаться от задуманного; ведь у нас нет причин для вражды...
actors.mobs.npcs.zero.whiteling.a_message5=Сегодня я была немного болтливой, наверное, так на меня повлияла новогодняя атмосфера. Прошу отнесись к этому с пониманием. Надень это ожерелье - пусть его сила и невелика, но оно поможет облегчить какие-то раны.
actors.mobs.npcs.zero.whiteling.b_message5=Прошу, прими и эту палочку. Мне она уже теперь не нужна, но тебе может пригодиться в твоем приключении.
actors.mobs.npcs.zero.whiteling.message6=Тебе уже пора, увидимся в следующий раз %s, и желаю удачи...
actors.mobs.npcs.zero.whiteling.c_message1=Она перестала обращать внимание на вас и выглядит так, будто она уснула...
actors.mobs.npcs.zero.whiteling.c_message2=Кристаллические частицы витают вокруг нее, словно оберегают её.
actors.mobs.npcs.zero.whiteling.c_message3=Лучше оставить её в покое...
actors.mobs.npcs.zero.whiteling.def_verb_1=Пусть этот мир поможет тебе...
actors.mobs.npcs.zero.whiteling.def_verb_2=Сможешь ли ты спастись?

actors.mobs.npcs.zero.zako.name=Мяоинь Хуа
actors.mobs.npcs.zero.zako.desc=Милая девушка-тенгу, одна из питомцев в Radish Pixel Dungeon. Ее цель в этом подземелье - снабжать всех едой (хотя и не бесплатно). Попробуйте, если будете проходить мимо.\n\nКстати, не называйте её простушкой, иначе она рассердится.
###First
actors.mobs.npcs.zero.zako.message1=Ты такой назойливый! Ты тоже идешь в подземелье, да? Там опасно, так что будь осторожен.
###Second
actors.mobs.npcs.zero.zako.message2=Ах да, кстати, это для тебя.
actors.mobs.npcs.zero.zako.message3=Ой, а почему тут немного мокро?
actors.mobs.npcs.zero.zako.message4=Хм... Кажется, я пускала слюни во время сна.\n\nОтвратительно! Вот я растяпа!
###SRD
actors.mobs.npcs.zero.zako.message5=Ух, людишки я вам не дуреха!
actors.mobs.npcs.zero.zako.message6=Возмутительно... Если ты еще раз назовешь меня простушкой, то я...
actors.mobs.npcs.zero.zako.message7=Хм? Ты уже уходишь?\n\nТак уж и быть... Если ты вернешься, я позволю тебе называть меня простушкой.
###Amulet
actors.mobs.npcs.zero.zako.message8=Наконец-то! Ты вернулся! Я так счастлива, что даже не сержусь от твоих насмешек.

actors.mobs.npcs.zero.mooncat.name=Юэхуа
actors.mobs.npcs.zero.mooncat.desc=Это человекоподобное существо с внешностью кошки, имеет гладкую и белоснежную шерсть. По слухам, раньше он был вроде стражем щитоносцем или торговцем старья. Но, похоже, он ничего не принес с собой сюда.
actors.mobs.npcs.zero.mooncat.amulet_desc=Это человекоподобное существо с внешностью кошки, держит в руке огромный щит.
actors.mobs.npcs.zero.mooncat.def_verb_1=За что!
actors.mobs.npcs.zero.mooncat.def_verb_2=Ты глупец!
actors.mobs.npcs.zero.mooncat.message1=Раньше я был стражем щитоносцем, пока мой щит не украли.
actors.mobs.npcs.zero.mooncat.message2=На самом деле у меня также был одноручный меч, но его тоже украли.
actors.mobs.npcs.zero.mooncat.message3=Это тебе, надеюсь, оно тебе пригодится.
actors.mobs.npcs.zero.mooncat.message4=Удачи, путешественник.

actors.mobs.npcs.zero.gudazi.name=Гудацзы
actors.mobs.npcs.zero.gudazi.desc=Герой из дальних земель, добрался сюда из Халдея, расположенного неподалеку от Роделя. Интересно, не ищет ли он здесь что-то.
actors.mobs.npcs.zero.gudazi.message1=Здравствуй, рад снова тебя видеть.
actors.mobs.npcs.zero.gudazi.message2=Если ты никуда не торопишься, приходи посидеть с нами у костра, чтобы вновь ощутить это теплое чувство.
actors.mobs.npcs.zero.gudazi.message3=О, кстати, мы сейчас жарим барбекю. Хочешь кусочек?
actors.mobs.npcs.zero.gudazi.message4=Как думаешь, этот городок слишком безлюден? Неважно, надеюсь позже приедет больше людей.
actors.mobs.npcs.zero.gudazi.message5=Да, кстати, на самом деле самое опасное место находится не внутри подземелья, а на поверхности.
actors.mobs.npcs.zero.gudazi.message6=Жаль, что здесь нет таверны, а то бы я бы перекинулся бы в пару картишек...
actors.mobs.npcs.zero.gudazi.message7=Эх... Так хочется вытянуть карту...
actors.mobs.npcs.zero.gudazi.message8=Мне больше нечего тебе подарить, но, может быть, если ты поговоришь с кем-нибудь еще, у него найдется что-нибудь для тебя.

actors.mobs.npcs.zero.gudazi.message9=Подожди, я вижу, у тебя с собой много денег, можешь одолжить мне 300? Я позже, обязательно верну...
actors.mobs.npcs.zero.gudazi.message10=Если ты одолжишь мне немного денег, я обязательно помогу тебе в дальнейшем пути.

actors.mobs.npcs.zero.gudazi.message11=Ты %s действительно силен, раз ты сумел добраться до этого места!
actors.mobs.npcs.zero.gudazi.message12=Плохая новость в том, что что-то там внизу не хочет, чтобы я продолжал путь, поэтому я не могу спустится дальше.
actors.mobs.npcs.zero.gudazi.message13=Но есть и хорошая новость! Благодаря тебе я нашел достаточное количество дров для костра.
actors.mobs.npcs.zero.gudazi.message14=Береги себя, путь впереди будет очень мрачен. Я не смогу сопровождать тебя на оставшемся пути. Поэтому оставлю этот костер тебе. Увидимся позже, %s.
actors.mobs.npcs.zero.gudazi.def_verb_1=Хм?
actors.mobs.npcs.zero.gudazi.def_verb_2=Ух...
actors.mobs.npcs.zero.gudazi.level4=И снова здравствуй, а вот обещанный подарок в знак благодарности. Ладно, у меня остались кое-какие дела, увидимся позже. Пока!
actors.mobs.npcs.zero.gudazi.level9=Ах, ты тоже здесь? Благодаря твоим деньгам, я приобрел много хороших вещей. Вот, я отдаю тебе эти два камня и надеюсь, что они помогут тебе в будущем. Я ухожу, увидимся в следующий раз!
actors.mobs.npcs.zero.gudazi.level14=Ой, какое совпадение, что ты тоже здесь. Я как раз что-то приготовил, и хочу подарить тебе. Ладно, мне пора уходить, увидимся позже.
actors.mobs.npcs.zero.gudazi.dead=Гудацзы отправился обратно...
actors.mobs.npcs.heallanfire.name=очаг жизни
actors.mobs.npcs.heallanfire.desc=Костер, оставленный Гудацзы, способен спасти вашу жизнь в критический момент!
actors.mobs.npcs.heallanfire.ssss=Вы впитываете силу костра и чувствуете, как ваши раны полностью заживают!

actors.mobs.npcs.zero.gudazi.quest_start_prompt=Путешественник, не найдется ли у тебя, лишних 300 золотых?
actors.mobs.npcs.zero.gudazi.enter_yes=Да, держи!
actors.mobs.npcs.zero.gudazi.enter_no=Нет, извини!

actors.mobs.npcs.zero.gudazi.good=Благодарю! Еще увидимся, я буду ждать тебя там внизу.
actors.mobs.npcs.zero.gudazi.not=Ну ладно, приятного путешествия.

actors.mobs.npcs.zero.kongfu.name=Гэцзы
actors.mobs.npcs.zero.kongfu.desc=Вам неведомо, откуда взялся этот бледнолицый человек и какая у него фамилия, известно только то, что люди кличут его «Голубь» (Гэцзы).
actors.mobs.npcs.zero.kongfu.a_message1=Мне постоянно хочется попробовать голубей. В последнее время мене надоели пироги, и меня рвет от всего, что я ем, но мне так хочется поесть голубей... Жаль, что здесь только одни пироги... Кстати, ты любишь мясные пироги? Если да, то я с тобой поделюсь...
actors.mobs.npcs.zero.kongfu.b_message1=:Что? У тебя есть Кристальное сердце? Поздравляю. Кстати, у меня к тебе просьба. Можешь подняться на поверхность и принести мне голубей. Мне постоянно хочется ими полакомиться...
actors.mobs.npcs.zero.kongfu.c_message1=Что случилось, путешественник? Хочешь попробовать еще мясной пирог? Не ешь слишком много, одного достаточно! Ладно, я продолжу и дальше готовить эти чертовы пироги. Удачи, путешественник.
actors.mobs.npcs.zero.kongfu.def_verb_1=Будешь шутить со мной, получишь от меня.

actors.mobs.npcs.zero.moruos.name=Моносы
actors.mobs.npcs.zero.moruos.desc=Поговаривают, что она владелица Снежной гостиницы и повидала бесчисленное множество спускающихся в подземелье путешественников, и большинство из них, так и никогда не вернулось, но лишь немногие из них вернулись прославленными...
actors.mobs.npcs.zero.moruos.message1=Путешественник, добро пожаловать в Снежный город. Я - хозяйка этого заведения.
actors.mobs.npcs.zero.moruos.message2=За последние несколько лет ты, похоже, раскрыли немало секретов, таящихся в глубинах подземелий. Однако недавно поступили тревожные рассказы. По словам других путешественников, в глубинах была обнаружена гробница, вход в которую выглядел пугающим...
actors.mobs.npcs.zero.moruos.message3=Если чувствуешь усталость, можешь подняться на 2-й этаж гостиницы и немного отдохнуть…
###13挑
actors.mobs.npcs.zero.moruos.message4=Похоже, ты уже преодолел немало перерождений, и скорее всего, тебя ждет еще много опасностей. Поэтому, возьми с собой это зелье.
actors.mobs.npcs.zero.moruos.message5=Продолжай расследование %s, только так у нас появится надежда…
actors.mobs.npcs.zero.moruos.roll1=Причина, по которой это место называется Снежным городом, заключается в том, что здесь всегда бушует метель...
actors.mobs.npcs.zero.moruos.roll2=Однажды я встретила синеволосую девушку, которая сказала, что собирается спасти подземелье, но когда она ушла туда, она больше не возвратилась...
actors.mobs.npcs.zero.moruos.roll3=Иногда в гостиницу заглядывает отдохнуть беловолосая горничная, которая обладает таинственной силой. Возможно, тебе удастся с ней познакомиться...
actors.mobs.npcs.zero.moruos.roll4=Снежный город - это центральная территория Империи Падкого Хлада, которой правит триумвират поверхности, и тут расположен вход в подземелье, который находится прямиком за гостиницей...
actors.mobs.npcs.zero.moruos.roll5=Будь осторожен на пути %s... Ты должен вернуться живым~
actors.mobs.npcs.zero.moruos.roll6=Ты когда-нибудь видел чистокристаллических элементалей? Когда-то они были воинами, но сейчас они стали такими...
actors.mobs.npcs.zero.moruos.roll7=Если ты встретишь чистокристаллического командира стражи, обязательно спаси его и не дай ему впасть в отчаяние...

actors.mobs.npcs.zero.qinyuewolf.name=Циньюэ
actors.mobs.npcs.zero.qinyuewolf.desc=Юноша со звериными ушами, судя по цвету его шерсти... Должно быть, он оборотень? Выглядит как хороший обман.
actors.mobs.npcs.zero.qinyuewolf.a_message1=Приветствую, эм... Ты ведь путешественник, верно?
actors.mobs.npcs.zero.qinyuewolf.a_message2=Я Циньюэ, путешественник, совершающий кругосветное путешествие, и писатель.
actors.mobs.npcs.zero.qinyuewolf.a_message3=Надеюсь, и твое путешествие пройдет хорошо.
actors.mobs.npcs.zero.qinyuewolf.b_message1=Ах да, я купил несколько бутылочек зелья, когда пришел сюда. Нам суждено было встретиться, так что держи одну бутылочку.
actors.mobs.npcs.zero.qinyuewolf.b_message2=Поскольку ты принял мою бутылочку с зельем, ты должен вернуться и рассказать мне о своем путешествии по подземелью.
actors.mobs.npcs.zero.qinyuewolf.b_message3=...Обязательно возвратись «человеком».
actors.mobs.npcs.zero.qinyuewolf.c_message1=Будь осторожен на пути, до встречи.
actors.mobs.npcs.zero.qinyuewolf.d_message1=С возвращением! Прошло несколько дней с тех пор, как ты спустился в подземелье.
actors.mobs.npcs.zero.qinyuewolf.d_message2=Теперь, когда у тебя есть Кристальное сердце, может тебе нужно хорошенько отдохнуть.
actors.mobs.npcs.zero.qinyuewolf.e_message1=Это кристальное сердце...? ...Забудь об нем, он ничего не значит.

actors.mobs.npcs.zero.qinyuewolf.bd_message1=Хммм... Ах %s, да.
actors.mobs.npcs.zero.qinyuewolf.bd_message2=Я только что размышлял о кое-чем... Ну, я сочиняю один рассказ, я же писатель
actors.mobs.npcs.zero.qinyuewolf.bd_message3=Но хоть я и говорю об этом и написал несколько коротких статей, собственных работ у меня по-прежнему нет. У меня сейчас несколько работ в процессе.
actors.mobs.npcs.zero.qinyuewolf.bd_message4=Кстати, ты готов к приключениям? Вот, вот, ступай, это для тебя.
actors.mobs.npcs.zero.qinyuewolf.bd_message5=Выше представлены мои незаконченные работы путевые заметки, на которые можно посмотреть и расслабиться, отдыхая от приключений.
actors.mobs.npcs.zero.qinyuewolf.bd_message6=Когда вернешься, не забудь поделиться историями, чтобы дать мне немного вдохновения!
actors.mobs.npcs.zero.qinyuewolf.bd_message7=Надеюсь, здесь нет опечаток. А, неважно, если я потеряю это, у меня все еще есть рукопись, которая была скопирована с помощью магии.
actors.mobs.npcs.zero.qinyuewolf.bd_message8=Теперь, я буду ждать, когда ты вернешься.

actors.buffs.clearbleesdgoodbuff.blessqinyue.name=ночная сова
actors.buffs.clearbleesdgoodbuff.blessqinyue.desc=Путешествуя ночью, вы получаете эффект совы, который увеличивает вашу скорость передвижения на 25%% и шанс уклонения на 10%%. Вы действительно становитесь более энергичным, когда засиживаетесь допоздна...\n\nНо, так или иначе, лучше ложитесь спать пораньше.

actors.mobs.npcs.zero.smallleaf.name=Сяое
actors.mobs.npcs.zero.smallleaf.desc=Одна из самых известных путешественниц в мире, по слухам, она исследовала и благополучно выжила в многих ужасающих подземельях. Ходят слухи, что она на самом деле божественный творец маленького мира... Однако по этой молодой девушки, не скажешь что у неё бесчеловечный характер.\n\nТеперь она уже освоилась здесь и, похоже, увлеклась покером…
actors.mobs.npcs.zero.smallleaf.getcoin=Ого, чистая победа! А, ты неплох! Для меня эти монеты - всего лишь фишки. Я могу поделиться с тобой немного, но если хочешь больше - ступай и заработай их самостоятельно.
actors.mobs.npcs.zero.smallleaf.descofpropchange=Как же приятно снова встретить тебя, путешественник. Кажется, у тебя при себе есть какая-то необычная вещ. Можешь ли ты дать мне её осмотреть?
actors.mobs.npcs.zero.smallleaf.messages1=Посредством моих исследований и наблюдений, между большинством подземелий существует связь…
actors.mobs.npcs.zero.smallleaf.messages2=Остерегайся ловушек - не только тех, что находятся на виду, но и комнат со странной планировкой. Если ты угодишь в первую из них, то, скорее всего, тебе уже ничто не поможет.
actors.mobs.npcs.zero.smallleaf.messages3=Успехов тебе.

actors.mobs.npcs.zero.smallleaf.card1=Удача обходит тебя стороной... Вот бы она была бы противником...
actors.mobs.npcs.zero.smallleaf.card2=Сегодня удача не на твоей стороне...
actors.mobs.npcs.zero.smallleaf.card3=Не твой день!

actors.mobs.npcs.zero.smallleaf.talk=У меня осталось всего лишь несколько бутылочек, если они тебе пригодятся... Но если нужно, тебе и одно будет достаточно?

actors.mobs.npcs.zero.smallleaf.def_verb_1=Сейчас не время...
actors.mobs.npcs.zero.smallleaf.def_verb_2=Что-то не так?

actors.mobs.npcs.smallleafharddungeon.name = Сяое
actors.mobs.npcs.smallleafharddungeon.title = Медитация Сяое
actors.mobs.npcs.smallleafharddungeon.desc = Одна из самых известных путешественниц во всем мире, по слухам, она спускалась в самые проклятие подземелья и выбиралась оттуда невредимой. Некоторые даже поговаривают, что она на самом деле божественный творец из другого мира... Хотя по её внешнему виду, и не скажешь что она не человек.
actors.mobs.npcs.smallleafharddungeon.message = Эти предметы переплетаются двумя совершенно уникальными видами магии.... Хочешь, я попробую обуздать одну из них?
actors.mobs.npcs.smallleafharddungeon.change2 = Получить 2 безделушки 2 ур.
actors.mobs.npcs.smallleafharddungeon.change3 = Получить 2 безделушки 3 ур.
actors.mobs.npcs.smallleafharddungeon.change1 = Получить 2 безделушки 1-2 ур.
