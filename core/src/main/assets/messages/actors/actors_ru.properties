actors.mobs.bosses.dwarfmaster.name=Полководец Дворфов
actors.mobs.bosses.dwarfmaster.desc=Бывшее регулярное войско королевства дворфов, ныне развращено и подчиненно злой магией.\n\nОн все еще помнит былую славу королевства дворфов, и застал само падение королевства. Ваше присутствие он сочтет вторжением, потому следует действовать осторожно. Так как он бывший полководец войска королевства, его стиль боя, более жесток, чем у нынешнего короля дворфов.\n\nПоражение не означает конец, как и смерть не означает конец.
actors.mobs.bosses.dwarfmaster.death_rattle=Король Дворфов... в конце концов падет...
actors.mobs.bosses.dwarfmaster.notice=Кто ты такой?! Зачем ты сюда пришел?
actors.mobs.bosses.dwarfmaster.sacrifice=Я подвел Короля Дворфов...
actors.mobs.bosses.dwarfmaster.pumpup=Я подчиненная нежить Короля Дворфов, ты должен умереть!
actors.mobs.bosses.dwarfmaster.more_summon=Неужели я тоже нежить?
actors.mobs.bosses.dwarfmaster.!!!=Чужак, зачем ты сюда пришел!
actors.mobs.bosses.dwarfmaster.buff_all=А ну-ка войско дворфов, поймайте этого человека!
actors.mobs.bosses.dwarfmaster.wave_1=Что, нынешний Король Дворфов? Просто самозванец!!!
actors.mobs.bosses.dwarfmaster.wave_2=Ты считаешь себя нашим спасителем?
actors.mobs.bosses.dwarfmaster.wave_3=Кто ты, наконец, такой?
actors.mobs.bosses.dwarfmaster.enraged=Похоже, ты храбрец. Прими мое последнее крещение!
actors.mobs.bosses.dwarfmaster.losing=Кто ты, такой? Ты силен, но этого недостаточно, чтобы противостоять ему!
actors.mobs.bosses.dwarfmaster.defeated=Похоже, не все сошли с ума! Храбрец, вот твоя награда! А я продолжу искать правду, чтобы найди того кто повинен в смерти короля...
