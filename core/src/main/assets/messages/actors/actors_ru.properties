actors.mobs.bosses.firemagicdied.!!!=Правосудие все ближе!
actors.mobs.bosses.firemagicdied.active=Ты все еще думаешь, что тебе удастся все исправить?
actors.mobs.bosses.firemagicdied.died_kill=Куда ты %s собирался сбежать?
