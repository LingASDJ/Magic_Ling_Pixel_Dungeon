actors.mobs.dimandmimic.desc=Время и пространство в лабиринте сокровищ так хаотично, что, скорее всего, это тот же Король мимиков когда он был еще отродьем...\n\nНо в любом случае, вам нужно заполучить сокровище и покинуть это опасное место...

