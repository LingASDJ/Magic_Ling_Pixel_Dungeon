actors.mobs.lb.blacksoul.name=тень
actors.mobs.lb.blacksoul.desc=Благодаря анху вы сумели возродились. Но то, что вы имели раньше, было поглощено собственным отголоском души, оставленным в виде тени. Убейте её и верните себе все, что принадлежит вам!
