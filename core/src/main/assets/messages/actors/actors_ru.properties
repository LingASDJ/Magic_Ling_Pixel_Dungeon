###Gold Mobs

actors.mobs.gold.goldmob.infos=_В режиме Золотой бабочки присутствуют особые монстры, будьте осторожны при контакте с ними._

actors.mobs.gold.giantworm.name=гигантский червь
actors.mobs.gold.giantworm.desc=Когда джунгли стали все более загрязненными, эти черви тоже стали огромными, теперь их атаки способны до ран разорвать противника, восстанавливая себе здоровье.

actors.mobs.gold.mayfly.name=подёнка
actors.mobs.gold.mayfly.desc=Эти маленькие существа щедро лечат других, пока те не умрут. \n\nПодёнки оказывают слабый лечебный эффект на дружественных существ поблизости.

actors.mobs.gold.prisoner.name=заключенный
actors.mobs.gold.prisoner.desc=Эти здоровяки, являются основными заключенными в подземной тюрьме, они смогли вобраться из своих камер после того, как порядок вышел из-под контроля. Однако они все равно не способны избежать участи столкнутся с тюремной стражей, хотя эта стража уже не столь рациональна, как прежде.\n\nЗаключенные все еще помнят тюремных стражей, и если они окажутся рядом с ними, их агрессия некоторое время не будет направлена ​​на вас.
actors.mobs.gold.prisoner.kill=Вас забил заключенный…

actors.mobs.gold.drake.name=Пещерный дрейк
actors.mobs.gold.drake.desc=Полудракон, родившийся в результате скрещивания драконов и ящероподобных существ, предпочитает спать, зарывшись в землю, и становятся раздражительными, когда их потревожат.\n\nВаши атаки не могут проникать сквозь землю.
actors.mobs.gold.drake.kill=Пещерный дрейк убил вас...
actors.mobs.gold.drake.rock_punk_kill=Земля с камнями, раскиданная дрейком убила вас...
actors.mobs.gold.drake.reveal=Вы разозлили этого дрейка, бегите!
actors.mobs.gold.drake.get_close=Когда вы приближаетесь к этому месту, то обнаруживаете, что пол под вашими ногами стал немного рыхлым. Лучше не приближаться к этой трещине.
actors.mobs.gold.drake.shock= %s откинулся назад от рытья дрейка!
actors.mobs.gold.drake.revealing=Вы чувствуете, как что-то приближается...

actors.mobs.gold.artillerist.name=дворф-канонир
actors.mobs.gold.artillerist.desc=Канониры - необычнее воины в войске дворфов, они более искусны в применении пороха и чтении заклинаний, чем сражаться с врагами в ближнем бою, к счастью, они обладают приличной силой и хорошей меткостью.
actors.mobs.gold.artillerist.kill=Вас убил дворф-канонир...
actors.mobs.gold.artillerist.bomb_party_kill=Вас разорвало выстрелом...

actors.mobs.gold.gnolltwilight.name=сумеречный гнолл
actors.mobs.gold.gnolltwilight.desc=Как ни взгляни, этот монстр не похож на гнолла. Его глаза сверкают зловещим синим светом, а кожа бледная и слегка мерцает в тени подземелья. В его сумке находится большая коллекция дротиков, содержащих различные яды. Эти яды не причиняют вреда, но они определенно сделают вашу жизнь хуже смерти...

actors.mobs.gold.boomskull.name=останки мертвеца
actors.mobs.gold.boomskull.desc=Останки мертвецов состоят из костей неудачливых путешественников и жителей подземелий, оживленные влиянием темной магии из глубин. Они очень хрупкие, поэтому обычно прибегают к самоподрыву, чтобы атаковать злоумышленников.\n\nНи одно живое существо не способно находиться в покое рядом с ними, из-за того, что в них вселяются злые духи.


actors.mobs.gold.royalguard.name=королевский гвардеец
actors.mobs.gold.royalguard.desc=Это самые элитные стражники Короля Дворфов, которые оснащены различным оружием из сокровищницы, они дали присягу служить истинному королю в королевстве дворфов до самой смерти. 
actors.mobs.gold.royalguard.equipment=Вам видно, что у него в руках _%s_, так что лучше с ним быть осторожнее.
actors.mobs.gold.royalguard.kill=Вас убил гвардеец, державший в руках %s...

actors.mobs.gold.gnollblind.name=старый гнолл
actors.mobs.gold.gnollblind.desc=Гноллы - гиеноподобные гуманоиды. Они обитают в джунглях и подземельях, периодически собираясь для рейдов на поверхность. Некоторые гноллы потеряли зрение из-за заражения джунглей или просто от старости, они потеряли внимательность, и теперь к ним стало легко подкрасться или устроить засаду.

actors.mobs.gold.goblinshaman.name=гоблин-жрец
actors.mobs.gold.goblinshaman$shamanshield.desc=Жрецы обычно считаются самыми могущественными личностями среди гоблинов... Но сами гоблины таковыми не являются. Поскольку магия очень распространена в подземельях, многие гоблины стали использовать её в своих целях. \n\nМагия этого гоблина усиливает защиту ближайших союзников.
actors.mobs.gold.goblinshaman$shamanstrength.desc=Жрецы обычно считаются самыми могущественными личностями среди гоблинов... Но сами гоблины таковыми не являются. Поскольку магия очень распространена в подземельях, многие гоблины стали использовать её в своих целях. \n\nМагия этого гоблина усиливает силу ближайших союзников, делая их атаки более смертоносными.
actors.mobs.gold.goblinshaman$shamanregen.desc=Жрецы обычно считаются самыми могущественными личностями среди гоблинов... Но сами гоблины таковыми не являются. Поскольку магия очень распространена в подземельях, многие гоблины стали использовать её в своих целях. \n\nМагия этого гоблина исцеляет ближайших союзников.
actors.mobs.gold.goblinshaman$shamanfake.desc=Жрецы обычно считаются самыми могущественными личностями среди гоблинов... Но сами гоблины таковыми не являются. Поскольку магия очень распространена в подземельях, многие гоблины стали использовать её в своих целях. \n\nМагия этого гоблина на самом деле не магия, он, похоже, имитирует «магические звуки», чтобы обманут своего противника.

actors.mobs.gold.hermitcrab.name=краб-отшельник
actors.mobs.gold.hermitcrab.desc=Эти крабы находят огромную раковину, чтобы выжить. Краб-отшельник намного крепче обычных, а их раковина способна защитить их тело от ударов, а к самым слабым атакам даже дает невосприимчивость. Но как только раковина будет разрушена, защита краба упадет до 0, что позволит врагу с легкостью убить его.
actors.mobs.gold.hermitcrabnoshell.name=краб-отшельник
actors.mobs.gold.hermitcrabnoshell.desc=Этот краб остался совершенно беззащитным, когда разрушилась его раковина. Все крабы-отшельники испытают первичный страх некоторое время после того, как теряют раковину.

actors.mobs.gold.demonlord.name=повелитель демонов
actors.mobs.gold.demonlord.desc=Повелители демонов - высшие приспешники древних богов, они повелевают всеми демонами, подчиняющимися  древним богам. Встреча с повелителем демонов всегда опасна, что даже ни один путешественник не смог добраться до древних богов из-за них, говорит о том, что это могучий противник.
actors.mobs.gold.demonlord.kill=Повелитель демонов с легкостью убил вас...
actors.mobs.gold.demonlord.damage_boost=Текущее повышение урона _%d_ %%.

actors.mobs.gold.gnollthrower.name=гнолл-дозорный
actors.mobs.gold.gnollthrower.desc=Гноллы - гиеноподобные гуманоиды. Они обитают в джунглях и подземельях, периодически собираясь для рейдов на поверхность. Гноллы-дозорные - более проворные гноллы, которые могут использовать камни для атаки с расстояния и обычно служат дозорными в стае гноллов.

actors.mobs.gold.tribemanold.name=гнолл-разбойник
actors.mobs.gold.tribemanold.desc=Гноллы - гиеноподобные гуманоиды. Они обитают в джунглях и подземельях, периодически собираясь для рейдов на поверхность. Гноллы-разбойники - обитают в холодной местности, так как это отличное место для их тренировок. Поговаривают, что оружие в их руках - это подлинный Гуань дао, так что будьте с ними осторожны!

actors.mobs.npcs.extra.pinkfox.name=Сяюйумин
actors.mobs.npcs.extra.pinkfox.desc=Девятихвостая лисица, принявшая человеческий облик. По слухам, она повелевает магией Золотой бабочки, которая позволяет сотворят магический круг, открывающий магию преобразования Золотой бабочки.

actors.mobs.npcs.extra.pinkfox.message1=Приветствую, меня зовут Сяюйумин. Похоже, у тебя в руках находится свиток Золотой бабочки, который раньше принадлежал мне, и я не понимаю, как он оказался у тебя...\n\nКроме того, раз твое приключение таит опасность, я хочу подарить тебе три безделушки 0-го уровня.
actors.mobs.npcs.extra.pinkfox.message2=Возможно, свиток сам выбрал тебя, чтобы проверить сможешь ли ты пройти это испытание...
actors.mobs.npcs.extra.pinkfox.message3=Я буду подсчитывать твои заработанные преобразования в твоем путешествии и изначально дам два. Другие преобразования ты будешь получать, если одолеешь сильного врага... Количество доступных преобразований и состояние заданий, можно узнать, взглянув эффект дающий поручения!
actors.mobs.npcs.extra.pinkfox.message4=Ты уведешь еще меня много раз в будущем, но я больше не буду встречать тебя у входа. В любом случае, удачного пути!

actors.mobs.npcs.extra.pinkfox.message5=Мне жаль, но у тебя сейчас нет доступных преобразований. Я соблюдаю договор с Золотой бабочкой, и она может рассердиться, если я нарушу его, чтобы помочь тебе!\n\nПрошу, возвращайся ко мне после выполнения заданий, когда получить больше преобразований!

actors.mobs.npcs.extra.pinkfox.message6=Это оружие ищет своего хозяина, а ты… как нельзя лучше ему подходишь. Правда, только мощь темного пламени, обвивающего его, тревожит даже меня. Если решишь взять его в руки, то будь осторожен.

actors.buffs.status.questgold.name=поручения Золотой бабочки
actors.buffs.status.questgold.desc=Здесь даются различные поручения. Выполняйте их, чтобы получить больше преобразованный!

actors.buffs.status.ancientstats.name=исследование древностей
actors.buffs.status.ancientstats.desc=Забытые древние руины, где обитают древние чудовища.\n\nОхотьтесь на врагов в этой местности, чтобы заработать очки древних исследований.\n\nПолучено очков исследований: %s.

actors.buffs.status.questgold.ghost=\nНаграда за задание: _1 преобразование._\n\nПечальный призрак: охота - _задание не выполнено._
actors.buffs.status.questgold.ghost_yes=\nНаграда за задание: _1 преобразование._\n\nПечальный призрак: охота - _задание выполнено._

actors.buffs.status.questgold.wand=Старый чародей: поисковая работа.

actors.buffs.status.questgold.dragon=Король драконов: заказное убийство - _задание не выполнено._
actors.buffs.status.questgold.dragon_yes=Король драконов: заказное убийство - _задание выполнено._

actors.buffs.status.questgold.dk=Король мимиков: сбор сокровищ - _задание не выполнено._\n
actors.buffs.status.questgold.dk_yes=Король мимиков: сбор сокровищ - _задание выполнено._\n

actors.buffs.status.questgold.bm=Тролль-кузнец: спуск в шахту - _задание не выполнено._
actors.buffs.status.questgold.bm_yes=Тролль-кузнец: спуск в шахту - _задание выполнено._

actors.buffs.status.questgold.im=Предприимчивый бес: трофейный жетон

actors.buffs.status.questgold.boss=Обычное задание: _Охота на боссов_ * (Каждый раз добавляет 1 преобразование и сбрасывает все ограничения на улучшение преобразованием.) *

actors.buffs.status.questgold.random_1=\nСлучайное задание 1: _Разрушение статуй_.\n\n(Уничтожьте живую статую, чтобы получить 1 преобразование)\n
actors.buffs.status.questgold.random_2=\nСлучайное задание 2: _Свидетель Золотой бабочки_.\n\n(Уничтожьте 15 особых монстров из Золотой Бабочки, чтобы получить 1 преобразование. Этот эффект может быть активирован максимум один раз в каждом новом регионе.)\n
actors.buffs.status.questgold.random_3=\nСлучайное задание 3: _Пацифист_ \n\n(После победы над боссом убейте 20/35/50/70 монстров, включая босса, чтобы получить 1 преобразование)\n

actors.buffs.status.questgold.gold=Доступно преобразований: _%s_.

actors.buffs.status.questgold.ws=Текущее общее количество улучшений: _%s_. После того, как оружие, артефакт, посох или кольцо улучшено, его нельзя улучшить снова, чтобы снят ограничение необходимо выполнить обычное задание!

actors.buffs.status.questgold.yes=Улучшить
actors.buffs.status.questgold.no=_Использовано_

actors.mobs.npcs.zero.xiayuan.name=Мэндун Сяюань
actors.mobs.npcs.zero.xiayuan.desc=Таинственный человек в плаще, который кажется, говорит о своих приключениях в подземелье...
actors.mobs.npcs.zero.xiayuan.a_message1=О, новое лицо? Хочешь попытать удачу перед спуском в подземелье? Ой, у тебя нет ящика с сюрпризом.
actors.mobs.npcs.zero.xiayuan.a_message2=Все в порядке. я подарю тебе один.
actors.mobs.npcs.zero.xiayuan.a_message3=Надеюсь, и твое путешествие пройдет хорошо.

actors.mobs.npcs.zero.xiayuan.b_message1=Счастливого приключения в подземелье, если мы еще встретимся, не забудь взять ящик с сюрпризом, чтобы попытать удачу.

actors.mobs.npcs.zero.xiayuan.b_message2=У костра так тепло. что это мне напомнило мой дом в Безветренном лесу.

actors.mobs.npcs.zero.xiayuan.c_message1=Поздравляю! Тот, кто сумел вернуться из подземелья, истинный герой. Как будет время приходи в Безветренный лес, ко мне в гости.


actors.mobs.npcs.zero.dreamlezi.name=Сяомэн
actors.mobs.npcs.zero.dreamlezi.desc=Гость из неведомого мира...
# 对话
actors.mobs.npcs.zero.dreamlezi.messages1=Здравствуй, я Сяомэн.
actors.mobs.npcs.zero.dreamlezi.messages2=Сейчас я работаю над одним «творением»… Хочешь взглянуть на мою работу?
actors.mobs.npcs.zero.dreamlezi.messages3=Книга с легендами? Она тебе нужна? Истории в ней невероятно скучные.
actors.mobs.npcs.zero.dreamlezi.messages4=Тебе нужна материальная помощь? Почему бы и нет.
#首次提醒 再次点击将直接扣除720金币
actors.mobs.npcs.zero.dreamlezi.no_gold=Я могу предложить тебе существенную помощь, но она не будет бесплатной. Хочешь договориться?
## 后续对话
actors.mobs.npcs.zero.dreamlezi.roll1=Возьми это. Имей в виду, что этим можно пользоваться только на 0-м этаже.
actors.mobs.npcs.zero.dreamlezi.roll2=Почему ты до сих пор не спустился в подземелье? Скорее отправляйся в путь!



# Gorgon
actors.mobs.gold.gorgon.name=Горгона Медуза
actors.mobs.gold.gorgon.desc=Опасное существо, некогда сосланное в подземное царство, где её изначально острый и устрашающий взгляд был ослаблен в аду до одной десятой своей силы, но даже так многие демоны и путешественники все равно не осмеливаются приближаться к ней.
actors.mobs.gold.gorgon.kill=Вас убили пронзительным взглядом...
actors.mobs.gold.gorgon$petrification.ondeath=Вы стали полностью окаменевшим...
actors.mobs.gold.gorgon$petrification.name=окаменение
actors.mobs.gold.gorgon$petrification.desc=Вы чувствуете, как ваше тело становится твердим...\n\nТекущая степень окаменения:_%d_ %%.



