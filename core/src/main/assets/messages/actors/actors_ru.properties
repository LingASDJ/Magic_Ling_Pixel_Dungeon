actors.mobs.greenstingcv.name=король лесных духов
actors.mobs.greenstingcv.notice=Обнаружен злоумышленник... Помощники, придите мне на помощь!
actors.mobs.greenstingcv.lifelink_1=У этой земли уже достаточно шрамов... Почему ты, чужак из иного мира, хочешь снова ранить эту землю?
actors.mobs.greenstingcv.lifelink_2=Судьба здешнего места... Стала угасать...
actors.mobs.greenstingcv.teleport_1=Немедленно прогоните этого человека!
actors.mobs.greenstingcv.teleport_2=Немедленно схватите этого человека!
actors.mobs.greenstingcv.buff_all=Немедленно разберитесь с этим человеком!
actors.mobs.greenstingcv.sacrifice=Взорвите себя во славу!
actors.mobs.greenstingcv.waring=Король лесных духов вызывает повышение гормонов у своих помощников, они готовы взорваться в любой момент!
actors.mobs.greenstingcv.death_rattle=После той катастрофы прошло много времени...
actors.mobs.greenstingcv.more_summon=Я догадался, ты не из этого мира!
actors.mobs.greenstingcv.wave_1=После той катастрофы это место превратилось в ад...
actors.mobs.greenstingcv.wave_2=Будучи чужаком из иного мира, ты лишился возможности для спасения...
actors.mobs.greenstingcv.wave_3=Тебе не следовало сюда приходить. Орден некромантов и так разрушили этот мир, и ты хочешь продолжить?
actors.mobs.greenstingcv.enraged=Сможешь ли ты, чужак из иного миру, что-то изменить?
actors.mobs.greenstingcv.losing=Похоже, мое время истекло... Прошу, продолжай свой путь...
actors.mobs.greenstingcv.defeated=Ты %s, видимо, последняя надежда для нас... Надеюсь, я не ошибся в тебе...
actors.mobs.greenstingcv.rankings_desc=Погублен Лесным духом
actors.mobs.greenstingcv.desc=Этот лесной дух когда-то он был королем джунглей, но после той катастрофы, произошедшей в этой временной линии, он был вынужден спустится под столицу дворфов, чтобы объединится с элементалями и гноллами для уничтожения дворфов.\n\nПосле некромант, который когда-то выдавал себя за короля дворфов, исчез... Поговаривали, что два генерала дворфа отступили с остатками своих войск на территорию, где когда-то обитали демоны...\n\nВсе элементали и гноллы почитают его как короля... и даже существа в пещерах относятся к нему с уважением.
actors.mobs.greenstingcv$dkghoul.rankings_desc=Погублен Лесным духом
actors.mobs.greenstingcv$dkmonk.rankings_desc=Погублен Лесным духом
actors.mobs.greenstingcv$dkwarlock.rankings_desc=Погублен Лесным духом
