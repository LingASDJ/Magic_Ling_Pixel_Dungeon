actors.hero.heroclass.slime_unlock= Новый человек, образовавшийся из густой слизи, которая вырвалась из Короля слизней, возможно, чтобы подражать могущественному человеку, победившему его. Эта маленькая жизненная субстанция обладает определенным интеллектом.\n\n_Это пока нельзя разблокировать, ожидайте его в будущих обновлениях._

