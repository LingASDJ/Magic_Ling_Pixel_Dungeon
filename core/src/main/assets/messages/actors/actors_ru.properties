actors.mobs.npcs.magehand$magehandcontrol.patrol_stop=Волшебная рука начала следовать за героем, перестав патрулировать местность.

actors.mobs.npcs.magehand.summoned=Вы призвали Волшебную руку!
actors.mobs.npcs.magehand.already_exists=У вас уже есть призванная Волшебная рука.
