actors.mobs.molotovhuntsman.death_msg_7 = Глупый человечишка...
actors.mobs.molotovhuntsman.death_msg_8 = Ради нее...
actors.mobs.molotovhuntsman.desc = Это крайне извращенные следопыты заразились злом, когда потеряли рассудок от темной магии, таящейся в глубинах подземелья. Все что их влечет, это желание убивать случайно пришедших незваных путешественников.

