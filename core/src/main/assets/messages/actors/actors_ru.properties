actors.mobs.npcs.firemagicdiednpc.name=Лена, ведьма Темного пламени
actors.mobs.npcs.firemagicdiednpc.desc=Когда-то она была одним из посланников Бога-творца, но из-за случая с пожаром триумвират поверхности заподозрил её, и ей пришлось бежать в заснеженный каньон... Там её приютил торговый лорд, вот так она и стала покровительницей заснеженного каньона...
actors.mobs.npcs.firemagicdiednpc.talk_1=Твое мастерство в бою %s, меня очень впечатлило.
actors.mobs.npcs.firemagicdiednpc.talk_2=Надеюсь в следующий раз, ты не станешь грабить магазин.
actors.mobs.npcs.firemagicdiednpc.talk_3=Кстати, я припоминаю, что моя сестра тоже находится в подземелье. Если встретишь, обязательно спаси её...
actors.mobs.npcs.firemagicdiednpc.talk_4=Мне нечего больше добавить, вот возьми эти подарки, они облегчат тебе путь...
actors.mobs.npcs.firemagicdiednpc.talk_5=Я немного устала после поединка с тобой, %s... Торговый лорд расскажет тебе, что делать дальше...

actors.mobs.bosses.firemagicdied$coldguradc.name=劫罪者
actors.mobs.bosses.firemagicdied$coldguradc.desc=这些人因劫掠商店被押入峡谷，没能通过祂的试炼，沦为祂的傀儡。岁月之下，诅咒磨灭了他们残存的心智与对自由的渴求。这些曾经的窃贼与强盗早已遗忘自身身份，连同劫掠的缘由一并消散。

actors.mobs.npcs.null.name=???
actors.mobs.npcs.null.desc=???
actors.mobs.npcs.null.why=Вы: Кто вы такой?
actors.mobs.npcs.shopking.talk=Я знаю причину, по которой тебя отправили сюда.
actors.mobs.npcs.null.why_2=Вы: ...
actors.mobs.npcs.shopking.talk_2=Я закрою глаза за ограбление магазина, но ты должен убраться отсюда.
actors.mobs.npcs.null.why_3=Вы: А если я откажусь?
actors.mobs.npcs.shopking.talk_3=...Или окажи нам услугу.
actors.mobs.npcs.shopking.talk_4=Глубоко в каньоне находится резиденция Лены. Если у тебя хватает смелости, брось ей вызов.
actors.mobs.npcs.shopking.talk_5=Если не желаешь рисковать, иди налево, чтобы вернуться назад.
actors.mobs.npcs.shopking.talk_6=Не будь трусом, ты был храбрым, когда убил наших стражей.
actors.mobs.npcs.shopking.talk_7=Ну же, сделай свой выбор!
actors.mobs.npcs.shopking.talk_8=Твой выбор не очень умен %s, но твоя смелость заслуживает похвалы.
actors.mobs.npcs.shopking.talk_9=Если ты готов, то следуй за мной, чтобы встретить её!
actors.mobs.npcs.nulldied.talk_x=...
actors.mobs.npcs.nulldied.talk_r=Торговый лорд: %s дальше все зависит от тебя!
actors.mobs.npcs.nulldied.name=Торговый лорд
actors.mobs.npcs.nulldied.desc=Торговый повелитель заснеженного каньона, именно он основал торговое государство.

actors.mobs.npcs.nulldiedto.talk_x=Да, сейчас самое время выбирать нужные товары для своей необходимости.

actors.mobs.npcs.nulldiedto.name=Торговый лорд
actors.mobs.npcs.nulldiedto.desc=Торговый повелитель заснеженного каньона, именно он основал торговое государство.
actors.mobs.npcs.nulldiedto.leave=Путешественник, выбирайся отсюда через Кристальное сердце...



actors.mobs.npcs.nulldiedto.namex=Воля кристалла
actors.mobs.npcs.nulldiedto.descx=Он уже не торговый лорд, а воля Кристального сердца. Он ждал тебя!

actors.mobs.npcs.nulldiedto.talk_a=Здесь действительно есть живой человек? О, это ты!
actors.mobs.npcs.nulldiedto.talk_b=Путешественник, в мире существует злая, холодная, и могущественная сила, и, похоже, только ты можешь это исправить.
actors.mobs.npcs.nulldiedto.talk_c=Там внизу стало меньше жизни, возможно, на это повлияла та сила. Выжили только те, кто обладал определенной силой.
actors.mobs.npcs.nulldiedto.talk_d=Кристальное сердце сопротивлялось этой силе, поэтому благодаря ему, вход стал таким.
actors.mobs.npcs.nulldiedto.talk_e=Местность внизу может выглядеть по-разному, и все это проявления сопротивления к силе.
actors.mobs.npcs.nulldiedto.talk_f=Удачи, путешественник. Я также предлагаю кое-что, что поможет подавить неизвестные силы - конечно, все это имеет свою цену.

actors.mobs.npcs.nulldiedto.talk_g=Путешественник, мы снова встретились. Я обеспокоен о твоем предстоящим путешествии, поэтому я тут, чтобы снова помочь тебе.
actors.mobs.npcs.nulldiedto.talk_h=Удачи, путешественник. Я также предлагаю кое-что, что поможет подавить неизвестные силы - конечно, все это имеет свою цену.

actors.mobs.npcs.nulldiedto.talk_i=Путешественник, как я уже говорил, существует злая, холодная, и могущественная сила, которая хочет выбраться наружу, а сам её источник находится еще глубже внизу.
actors.mobs.npcs.nulldiedto.talk_j=Но из-за прибытия некоего человека, ты пока не можешь отправиться туда на поиски смерти, так что пока повремени туда идти...

actors.mobs.npcs.nulldiedto.talk_k=DMZERO полностью уничтожен, путешественник, ты хорошо справился.
actors.mobs.npcs.nulldiedto.talk_l=Путешественник, может быть, ты действительно наш спаситель.
actors.mobs.npcs.nulldiedto.talk_m=Благодарю тебя за то, что помог исследовать подземелье, скоро я верну этому месту первоначальный вид.
actors.mobs.npcs.nulldiedto.talk_n=Путешественник, это только начало. Впереди тебя ждет трудный и нелегкий путь!
actors.mobs.npcs.nulldiedto.talk_o=Путешественник, сейчас ты можешь выбраться отсюда через Кристальное сердце. Благодарю за помощь в этот раз, я всем расскажу о ваших великих достижениях, когда вернусь.

