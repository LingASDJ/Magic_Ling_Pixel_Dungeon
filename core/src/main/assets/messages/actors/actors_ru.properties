actors.mobs.bosses.firemagicdied.name=Лена, ведьма Темного пламени
actors.mobs.bosses.firemagicdied.desc=Покровительница заснеженного каньона и предводительница торговцев. Из-за того, что вы ограбили лавку, вам предстоит сразиться с ней в неминуемом поединке. Неважно, какой был ваш мотив, вам все равно сперва нужно будет одолеть её, чтобы покинуть это место.
actors.mobs.bosses.firemagicdied.go=Я воплощение темного пламени, и тебя %s ждет мое правосудие...

actors.mobs.bosses.firemagicdied.fire=周围的空气正在变热……
actors.mobs.bosses.firemagicdied.cold=Окружающий воздух становится холоднее...
actors.mobs.bosses.firemagicdied.wakeup=Ледяная ведьма пробудилась!
actors.mobs.bosses.firemagicdied.sister=Сестра? Вижу, сейчас не время для разговоров. Здесь %s, нам нужно совершить правосудие. 
actors.mobs.bosses.firemagicdied.sad=Сестра! Почему ты исчезла? Это была всего лишь иллюзия? Тогда, и тебе %s придется исчезнуть вместе с ней!

actors.mobs.bosses.firemagicdied.notice=Ты будешь наказан за свой гнусный поступок!
