actors.mobs.xykl.desc =Эти подконтрольные марионетки, когда-то были стражами хрустального города, но благодаря вашему усердию, сейчас они сражаются по вашу сторону. Теперь, когда вы являетесь их новым хозяином, они будут защищать вас до самой смерти!

actors.mobs.shieldhuntsman.name = следопыт-щитоносец
