actors.mobs.npcs.smallleafharddungeon$wndchangeprop$5.select_second_negative_prop=Выберите безделушку %s ур.


actors.mobs.npcs.zero.pianole.name=Циньли
actors.mobs.npcs.zero.pianole.desc=Вокруг этой девушки все время ритмично перемещаются воздушные потоки. Этот легкий ветерок всегда создает ощущение уюта и тепла, именно такие чувства он дарит окружающим.

actors.mobs.npcs.zero.pianole.messages1=Блайнд, утраиваю ставку, открывайте карты!
actors.mobs.npcs.zero.pianole.messages2=Как ты думаешь, съедобны ли растения возле проходных троп?
actors.mobs.npcs.zero.pianole.messages3=Тьфу, тьфу, тьфу -  какая гадость. Вот держи, я нашла их возле заросших троп!

actors.mobs.npcs.zero.pianole.card1=На самом деле растительность на дорогах вкуснее, чем трава.
actors.mobs.npcs.zero.pianole.card2=У меня осталась последняя карта!
actors.mobs.npcs.zero.pianole.card3=Сюрприз! Не ожидал, что у меня запасен лишний козырь в рукаве, да?

actors.mobs.npcs.zero.pianole.def_verb_1=Дурное поведение...
actors.mobs.npcs.zero.pianole.def_verb_2=Тебе что скучно?

actors.mobs.npcs.zero.atri.name=Робоко
actors.mobs.npcs.zero.atri.desc=Выглядит как обычная девушка, которая как будто что-то ищет...
actors.mobs.npcs.zero.atri.message1=А-а-а, нарушитель! Получай негодник!
actors.mobs.npcs.zero.atri.message2=Не могли бы ты дать мне вот это, оно так аппетитно выглядит? Взамен я даю тебе это! Оно очень вкусное! А вкусная еда - дает радость всем!
actors.mobs.npcs.zero.atri.message3=Только когда ты сытый, у тебя появляются силы для работы, поэтому тебе всегда нужно кушать хорошо!
actors.mobs.npcs.zero.atri.rankings_desc=Умер от испуга Робоко...

actors.mobs.npcs.zero.question.name=Бездомный оборванец
actors.mobs.npcs.zero.question.desc=Его тело полностью завернуто плащом, и никто не знает, откуда он и какие у него намерения.
actors.mobs.npcs.zero.question.title=Что-то нужно?
actors.mobs.npcs.zero.question.option_nothing=Ничего
actors.mobs.npcs.zero.question.option_chat=Пообщаться
actors.mobs.npcs.zero.question.option_enquire=Спросить
actors.mobs.npcs.zero.question.option_request=Попросить
actors.mobs.npcs.zero.question.option_duel=Напасть
actors.mobs.npcs.zero.question.option_game=Поиграть
actors.mobs.npcs.zero.question.title_1=Хочешь о чём-то спросить?
actors.mobs.npcs.zero.question.ling=Кто такая Лин?
actors.mobs.npcs.zero.question.birth=Кто ты?
actors.mobs.npcs.zero.question.dungeon=Что в подземелье?
actors.mobs.npcs.zero.question.title_5=Ты серьезно?
actors.mobs.npcs.zero.question.true=Да, уверен
actors.mobs.npcs.zero.question.false=Нет, шучу
actors.mobs.npcs.zero.question.title_4=Напоминаю, что за все игры здесь нужно платить.
actors.mobs.npcs.zero.question.fgame=У кого больше
actors.mobs.npcs.zero.question.sgame=Русская рулетка
actors.mobs.npcs.zero.question.tgame=Игральные кости
actors.mobs.npcs.zero.question.title_4_1=Число соперника: _%s_.
actors.mobs.npcs.zero.question.title_4_2=Выбери цель в кого будешь стрелять!
actors.mobs.npcs.zero.question.he=Бездомный оборванец
actors.mobs.npcs.zero.question.you=В себя
actors.mobs.npcs.zero.question.give_up=Отказаться от игры
actors.mobs.npcs.zero.question.title_4_3=Пуля заряжена.
actors.mobs.npcs.zero.question.wait=Ждать
actors.mobs.npcs.zero.question.title_4_4=Итак, сколько ты хочешь поставить?
actors.mobs.npcs.zero.question.title_4_5=Ты бросил: _%1$s %2$s %3$s_
actors.mobs.npcs.zero.question.throw=Перебросить
actors.mobs.npcs.zero.question.stop=Подходящее число
actors.mobs.npcs.zero.question.no_money=У тебя больше нет денег!
actors.mobs.npcs.zero.question.warning_1=Ты должен понимать... Азартные игры здесь незаконны.
actors.mobs.npcs.zero.question.warning_2=Ты до сих пор думаешь, что сможешь обменять свой пустой кошелек на безмерное богатство? Тогда заранее примерь гроб для себя.
actors.mobs.npcs.zero.question.warning_3=Сумасшедший... Я заберу твою жадную душонку!
actors.mobs.npcs.zero.question.warning_4=Ладно... Поставлю ту же сумму, чтобы не было позорно проиграть.
actors.mobs.npcs.zero.question.message1_1=Я правда не понимаю, что вас так побуждает, держать путь этот город, чтобы потом по глупости умереть в подземелье.
actors.mobs.npcs.zero.question.message1_2=Все ради того, чтобы получить Кристальное сердце? А я вот думаю, что моя борьба будет здесь...
actors.mobs.npcs.zero.question.message1_3=Ты снова умер?
actors.mobs.npcs.zero.question.message2_1=...
actors.mobs.npcs.zero.question.message2_2=Ты серьезно?
actors.mobs.npcs.zero.question.message2_3=Хорошо, но если тебе что-то нужно, тебе придётся заплатить за это деньги, или конечно, можешь сыграть со мной в игру.
actors.mobs.npcs.zero.question.message4_1=Меня совершенно не неинтересно играть с теми, кто жульничает, прошу, уходи!
actors.mobs.npcs.zero.question.message4_2=Понятно...
actors.mobs.npcs.zero.question.message4_3=Ты шутишь?
actors.mobs.npcs.zero.question.message4_4=Я согласен с твоим предложением!
actors.mobs.npcs.zero.question.message4_5=Итак, начнём!
actors.mobs.npcs.zero.question.message5_1=Лучше тебе не знать, чем я тут занимаюсь...
actors.mobs.npcs.zero.question.message5_2=Я её не знаю... Она что, какое-то божество?
actors.mobs.npcs.zero.question.message5_3=Я просто путешественник, который случайно забрел сюда.
actors.mobs.npcs.zero.question.message5_4=Честно говоря, много кто спускался в это подземелье, но действительно ли, там есть что-то стоящее?
actors.mobs.npcs.zero.question.no_more_1=Мне жаль.
actors.mobs.npcs.zero.question.no_more_2=На сегодня это все.
actors.mobs.npcs.zero.question.win=Неужели ты выиграл?
actors.mobs.npcs.zero.question.lose=Как я уже говорил... Советую тебе держаться подальше от азартных игр!
actors.mobs.npcs.zero.question.draw=Неожиданная ничья...
actors.mobs.npcs.zero.question.chance=Это настоящее оружие и пули... Мне повезло, теперь твоя очередь.

actors.mobs.npcs.zero.bluecj.name=Сяолань
actors.mobs.npcs.zero.bluecj.desc=Маленькая девушка-полудракон с голубыми волосами, которая на Новый год даже переоделась в красное платье. Наверняка, она станет когда-то Императрицей Драконов.
actors.mobs.npcs.zero.bluecj.a_message1=Что? Спрашиваешь меня, почему я пришла сюда? Мне тоже иногда нужен отдыхать!
actors.mobs.npcs.zero.bluecj.a_message2=Пульс сердца заставляет нас - двигается в перед своих возможностей. Не так ли?
actors.mobs.npcs.zero.bluecj.a_message3=Путешественник, прошу, прими от меня красный конверт в котором находится немного золота.
actors.mobs.npcs.zero.bluecj.b_message1=Зима, всегда приносит тишину.
actors.mobs.npcs.zero.bluecj.b_message2=Твоя новая одежда такая красивая!
actors.mobs.npcs.zero.bluecj.b_message3=Здесь так холодно!

actors.mobs.npcs.zero.bzmdr.name=Bzmdr
actors.mobs.npcs.zero.bzmdr.desc=Загадочный молодой человек, одетый во все черное, что выглядит так, будто с ним нелегко поладить. Он часто появляется в гостинице. Может быть, ты сможешь найти с ним общий язык.
actors.mobs.npcs.zero.bzmdr.a_message1=Здравствуй, если ты направляешься в подземелье, хочу пожелать удачи.
actors.mobs.npcs.zero.bzmdr.b_message1=Вот держи несколько вещей, которые я нашел.
actors.mobs.npcs.zero.bzmdr.c_message1=Похоже, твое путешествие пройдет хорошо.
actors.mobs.npcs.zero.bzmdr.c_message2=Следи за тем, чтобы твой фонарь был достаточно ярким.
actors.mobs.npcs.zero.bzmdr.c_message3=Может быть, ты сможешь что-нибудь придумать?
actors.mobs.npcs.zero.bzmdr.d_message1=В подземелье стало очень опасно, сейчас.
actors.mobs.npcs.zero.bzmdr.d_message2=Подземелье исследовало много путешественников, но из них так и никто не вернулся, так зачем же тебе туда спускаться?
actors.mobs.npcs.zero.bzmdr.d_message3=Похоже, ты очень уверен в себе, удачи.
actors.mobs.npcs.zero.bzmdr.e_message1=Похоже, тебе удалось.
actors.mobs.npcs.zero.bzmdr.e_message2=Есть люди, которые будут преследовать тебя, поэтому будь осторожней.
actors.mobs.npcs.zero.bzmdr.e_message3=Ты же, не собирается делать что-то плохое из-за этого, ко мне это не имеет никакого отношения.
actors.mobs.npcs.zero.bzmdr.def_verb_1=Что ты хочешь сделать...
actors.mobs.npcs.zero.bzmdr.def_verb_2=Если тебе нечем заняться, отправляйся в путешествие.
actors.mobs.npcs.zero.bzmdr.rankings_desc=Мгновенно казнен _Bzmdr_

actors.mobs.npcs.zero.bzmdrland.name=Bzmdr
actors.mobs.npcs.zero.bzmdrland.desc=Никто не знает, почему он остался здесь, а не ушел в гостиницу. Может быть, он кого-то ждет?
actors.mobs.npcs.zero.bzmdrland.message1=Здравствуй..., почему бы тебе не пойти в гостиницу?
actors.mobs.npcs.zero.bzmdrland.message2=Ты тоже хочешь погреться у костра..., ...он здесь для всех.

actors.mobs.npcs.zero.bzmdrland.message3=Похоже, ты уже побывал в старинном замке - молодец, но это еще далеко не конец.
actors.mobs.npcs.zero.bzmdrland.message4=Будь осторожен: бездна наблюдает за тобой, иначе ты встретишь ту другую часть «себя», рожденную тьмой…
actors.mobs.npcs.zero.bzmdrland.message5=У меня для тебя есть «подарок», используй его с умом, и ты сможешь лучше преодолевать трудности.
actors.mobs.npcs.zero.bzmdrland.message6=Выбор за тобой. Удачи!

actors.mobs.npcs.zero.bzmdrland.a_message1=Ты спрашиваешь, как я сюда попал? Не будь таким любопытным.
actors.mobs.npcs.zero.bzmdrland.a_message2=Я здесь, потому что у меня здесь дела.
actors.mobs.npcs.zero.bzmdrland.a_message3=Вот, если нужно держи несколько камней, которые я подобрал, когда добирался сюда.

actors.mobs.npcs.zero.bzmdrland.c_message1=Похоже, у тебе появился уникальный способ передвижения.
actors.mobs.npcs.zero.bzmdrland.c_message2=Подземелье рушится, скорее уходи отсюда.

actors.mobs.npcs.zero.bzmdrdungeon.name=Bzmdr
actors.mobs.npcs.zero.bzmdrdungeon.desc=???

actors.mobs.npcs.zero.bzmdrland.x_message1=Очень хорошо, остался всего один шаг до конца твоего путешествия. Ступай и одолей его.
actors.mobs.npcs.zero.bzmdrland.x_message2=Ты спрашиваешь, не могу ли я тебе помочь? Подожди, ты же не думаешь, что все в этом мире можно получить даром!
actors.mobs.npcs.zero.bzmdrland.x_message3=Ладно, возьми это, сейчас это все, чем я могу помочь тебе.



actors.mobs.npcs.zero.jit.name=Цзицзин
actors.mobs.npcs.zero.jit.desc=Этот странный человек в маске сидит у костра, словно ожидает чего-то, но когда вы берете у него еду, невольно вспоминаются теплые воспоминания.
actors.mobs.npcs.zero.jit.message1=Еще один путешественник, рискующий жизнью, возьми, это вся помощь, которую я могу тебе оказать.
actors.mobs.npcs.zero.jit.message2=Эй? Путешественник, что ты ищешь? Кристальное сердце? Эта штука не так хороша, как ты думаешь. Ты когда-то задумывался о том, что это тебе будет стоить?
actors.mobs.npcs.zero.jit.message3=Зачем мне маска? Не стоит лезть в чужую личную жизнь.
actors.mobs.npcs.zero.jit.no1=Похоже, у тебя зудит кожа.
actors.mobs.npcs.zero.jit.no2=Еще один, путник потерявший рассудок от кристалла...
actors.mobs.npcs.zero.jit.message4=Держи эту штуку подальше от меня, я не хочу стать таким же...
actors.mobs.npcs.zero.jit.message5=Я что, выгляжу дружелюбным? Разве ты не видишь, что я вооружен? Держись от меня подальше.

actors.mobs.npcs.zero.deepsea.name=Шэньхай
actors.mobs.npcs.zero.deepsea.desc=Тот самый паренек, который обычно околачивается у побережья, вместо этого сидит в углу за шатким деревянным столом и бездумно тыкает пальцем по столешнице; на стоявшем перед ним стакане с соком видны два нечетких следа от зубов - очевидно, что он всё ещё дуется из-за того, что ему еще рано пить алкоголь.
actors.mobs.npcs.zero.deepsea.messages1=Если хочешь спуститься в подземелье, собирай свою  команду; а я продолжу сидеть здесь до самого закрытия. Не приставай ко мне, неудачник, а будешь и дальше докучать, вымочу твои глазные яблоки в фруктовом соке. Забирай свой пирог и проваливай!
actors.mobs.npcs.zero.deepsea.dx_message1=Есть ли в этом какая-та причина?
actors.mobs.npcs.zero.deepsea.dx_message2=Помоги! Владыке Сакабамбаспису!
actors.mobs.npcs.zero.deepsea.dx_message3=Маленького сакабамбасписа сегодня здесь нет, так что неохотно отпускаю тебя.
actors.mobs.npcs.zero.deepsea.dx_message4=Неужели ты думал, что с такой силой сможешь мне навредить? Откуда взялся этот тупица~

actors.mobs.npcs.zero.moonlow.name=Цяньюэ
actors.mobs.npcs.zero.moonlow.desc=Это существо выглядит как обычный человеческий ребенок, но, похоже, оно обладает какой-то силой, которую вы не в силах постичь...
actors.mobs.npcs.zero.moonlow.messages1=......Ну вот, опять ты.
actors.mobs.npcs.zero.moonlow.messages2=Ты это чувствуешь, не так ли? Что-то грядёт...
actors.mobs.npcs.zero.moonlow.messages3=Ты готов?
actors.mobs.npcs.zero.moonlow.messages4=Вот, возьми.
actors.mobs.npcs.zero.moonlow.messages5=Ого-го, приветствую!
actors.mobs.npcs.zero.moonlow.messages6=Ты ведь туда направляешься, верно? Удачи!
actors.mobs.npcs.zero.moonlow.messages7=Ох, чуть не забыл, возьми это!
actors.mobs.npcs.zero.moonlow.world1=Сможешь ли ты снова оживить этот застывший мир?
actors.mobs.npcs.zero.moonlow.world2=С нетерпением жду твоего выступления.
actors.mobs.npcs.zero.moonlow.drink=Эх... Как же хочется ещё раз напиться до беспамятства...
actors.mobs.npcs.zero.moonlow.dx_message1=Ты действительно любишь таким заниматься? Друг~
actors.mobs.npcs.zero.moonlow.dx_message3=Что за тупица~ (шепотом)

