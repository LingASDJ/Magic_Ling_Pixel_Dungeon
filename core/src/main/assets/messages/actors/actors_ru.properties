actors.mobs.dimandking.wrning=Лесной дух заряжает смертоносный луч по отмеченной цели...

actors.mobs.redlunar.name=некромастер
actors.mobs.redlunar.desc=Похоже, все рассказы о защитников, нанятых за большие деньги, привлекли его внимание.
actors.mobs.redlunar.notice=Это ты тот самый, кто нанимал себе защитников?
actors.mobs.redlunar.defeated=Нет... Это невозможно...
actors.mobs.redlunar.arise=Восстаньте, бездари!
actors.mobs.redlunar.rankings_desc=Превзойден Некромастером
actors.mobs.redlunar.scorpion=Возвращайся ко мне!

actors.mobs.ice_scorpio.name=ледяной скорпид
actors.mobs.ice_scorpio.desc=Эти огромные, паукообразные демонические существа избегают ближний бой, предпочитая стрелять издалека калечащими, зазубренными шипами.\n\n_Может обморозить свою цель._

actors.mobs.fire_scorpio.name=огненный скорпид
actors.mobs.fire_scorpio.desc=Эти огромные, паукообразные демонические существа избегают ближний бой, предпочитая стрелять издалека калечащими, зазубренными шипами.\n\n_Может поджечь свою цель._

actors.mobs.icecrystal.name=Ледяной кристалл
actors.mobs.icecrystal.on_death=Вы чувствуете, как магия угасает, а сама её мистическая сила ослабевает.
actors.mobs.icecrystal.desc=Ледяные кристаллы связаны с таинственной жизненной энергией, которая способна сотворят различных ледяных и снежных монстров.\n\nЕсли его не уничтожить, он принесет ужасные последствия.

actors.mobs.srpdiclr.name = ледяной следопыт
actors.mobs.srpdiclr.attack_msg_1 = Он бессмертен
actors.mobs.srpdiclr.attack_msg_2 = Никто не убежит
actors.mobs.srpdiclr.attack_msg_3 = Почувствуй
actors.mobs.srpdiclr.death_msg_1 = Ты пожалеешь об этом!
actors.mobs.srpdiclr.desc = Эти ледяные следопыты были сотворены ледяным кристаллом для его защити, и если вы осмелитесь приблизиться к нему, они обязательно нападут на вас.

actors.mobs.srpdiclrpro.name = ледяной следопыт
actors.mobs.srpdiclrpro.attack_msg_1 = Она бессмертна
actors.mobs.srpdiclrpro.attack_msg_2 = Никто не убежит
actors.mobs.srpdiclrpro.attack_msg_3 = Почувствуй
actors.mobs.srpdiclrpro.death_msg_1 = Ты пожалеешь об этом!
actors.mobs.srpdiclrpro.desc = Эти ледяные следопыты были сотворены ведьмой для её защити, и если вы осмелитесь приблизиться к ней, они обязательно нападут на вас.

actors.mobs.yogreal.name=Йог-Зот
actors.mobs.yogreal.notice=Я. ВИЖУ. ТЕБЯ.
actors.mobs.yogreal.darkness=Темнота сгущается вокруг вас...
actors.mobs.yogreal.hope=ТВОЯ. НАДЕЖДА. ЭТО. ИЛЛЮЗИЯ!
actors.mobs.yogreal.time=Время проклятое Йог-Зотом, стало хаотичным.
actors.mobs.yogreal.defeated=...
actors.mobs.yogreal.rankings_desc=Поглощен богом Йог-Зот



actors.mobs.yogreal.desc=Йог-Зот - древний бог; великое чудовище, досягающее до миров смертных и пожирающее их для поддержания своего бесконечного роста. Дворфы, видимо, привлекли внимание этого космического ужаса, когда игрались с темной магией, и с тех пор старались как-то ограничить его влияние.\n\nЙог-Зот обитает в измерении бесформенного магического хаоса и не способен воплотить свой истинный облик в настоящем миру. Вместо этого, божество создало своих аватаров и демонических слуг, которые подчиняются его приказам.\n\nЭтот огромный глаз является точкой фокуса силы Йог-Зота в нашем мире. Сам глаз неподвижен, но он способен излучать мощнейшие лучи демонической магии и призывать разные виды слуг на помощь.
actors.mobs.yogreal.desc_spawners=Вы чувствуете волны демонической энергии, излучаемые в сторону глаза с этажей выше. Очевидно, что-то, что вы оставили живым там, направляет энергию обратно в Йог-Зота. _Йог использует эту энергию для призыва более мощных приспешников!_
actors.mobs.yogreal.destroy_tile=Похоже, окружающая вас местность подверглась некоторым изменениям!
actors.mobs.yogreal$larva.name=личинка бога
actors.mobs.yogreal$larva.rankings_desc=Поглощен богом Йог-Зот
actors.mobs.yogreal$larva.desc=Эти маленькие отродья Йог-Зота - простые приспешники, которых легко производить. В одиночку они слабые, но они быстро призываются и могут стать непреодолимыми в большом количестве.\n\n_Получаемый урон значительно снижается в близи древнего бога_.
actors.mobs.yogreal$yogrealripper.desc = Эти страшные существа - то, для чего демонические силы употребили множество трупов дворфов в этом регионе. Потрошители - чахнущие существа-вурдалаки, похожие на дворфов, но с изломленными телами и длинными, острыми клешнями, сделанными из кости.\n\nДемоны-потрошители не особо выносливы, но они быстры и опасны. Они способны прыгать на длинное расстояние, чтобы быстро добраться до своей цели перед тем, как растерзать ее своими клешнями.\n\n_Получаемый урон значительно снижается в близи древнего бога_.

actors.mobs.yogreal$yogrealripper.rankings_desc=Поглощен богом Йог-Зот
actors.mobs.yogreal$yogrealscorpio.rankings_desc=Поглощен богом Йог-Зот
actors.mobs.yogreal$yogrealsuccubus.rankings_desc=Поглощен богом Йог-Зот
actors.mobs.yogreal$yogscanround.rankings_desc=Поглощен богом Йог-Зот
actors.mobs.yogreal$yogcontinuousbeam.rankings_desc=Поглощен богом Йог-Зот
actors.mobs.yogreal$yogscanhalf.rankings_desc=Поглощен богом Йог-Зот

actors.mobs.yogrealfirst.invuln_warn=Длань неуязвима, пока находится возле глаза!
actors.mobs.yogrealfirst.rankings_desc=Поглощен богом Йог-Зот
actors.mobs.yogrealfirst.desc=Эта длань является аспектом мощи Йог-Зота. Длани подвязаны к силе Йог-Зота, и будут защищены от любого урона, когда находятся возле глаза.
actors.mobs.yogrealfirst$burningfist.name=пылающая длань
actors.mobs.yogrealfirst$burningfist.desc=Эта длань сформирована из хаотичной огненной магии. Пока она передвигается, она постоянно воспламеняет свое окружение. Она также способна стрелять зарядами огненной мощи, которые распространяют пламя на тех местах, куда они попадают.\n\nСпособность длани воспламенять окружение подавлена вблизи воды, но жар, исходящий от нее, заставит воду испариться за короткое время!
actors.mobs.yogrealfirst$soiledfist.name=земляная длань
actors.mobs.yogrealfirst$soiledfist.desc=Эта длань сформирована из хаотической магии земли. Когда она движется, вокруг нее произрастает вегетация. Она также способна стрелять концентрированными земельными зарядами, которые связывают цель быстрорастущими вьюнками и корнями!\n\nЭта длань получает свою силу из этой флоры и выдержит урон в соответствии с тем, сколько высокой или бороздчатой вегетации находится близко от нее!
actors.mobs.yogrealfirst$rottingfist.name=гнилостная длань
actors.mobs.yogrealfirst$rottingfist.desc=Эта длань сформирована из живой порчи. Это огромная масса разлагающейся плоти, способная разбрасывать едкую слизь в ближнем, и отравляющий газ в дальнем бою. Что еще хуже, вместо того, чтобы получать урон напрямую, она получает лишь эффект кровотечения.\n\nС помощью воды можно смыть слизь, однако длань способна поглощать воду и, таким образом, исцелять себя! Кроме того, когда она получает урон во время кровотечения, старый эффект обновляется, но новый притом не накладывается!
actors.mobs.yogrealfirst$rustedfist.name=ржавая длань
actors.mobs.yogrealfirst$rustedfist.desc=Эта длань сформирована из живого металла. Это взгромоздение движущейся массы металла способно мощно атаковать в ближнем бою и калечит свои цели в дальнем. Из-за огромной массы эта длань способна распределить нанесенный ей урон по времени.\n\nЭта длань, однако, негибкая и не помещается в узкие проходы. Кроме того, что она, конечно, несет урон не сразу, отложенный урон увеличивается, если длань терпит попадание несколько раз.
actors.mobs.yogrealfirst$brightfist.name=яркая длань
actors.mobs.yogrealfirst$brightfist.teleport=Длань телепортируется подальше, создавая световую вспышку, которая сильно ослепляет вас!
actors.mobs.yogrealfirst$brightfist.desc=Эта длань сформирована из чистой световой энергии. Она способна каждый ход излучать мощные лучи слепящего света! Эти лучи временно ослепляют и, кроме того, наносят тяжелый урон. Длань также способна на короткое время заливать арену слепящим светом, чтобы скрыться.\n\nУ этой длани, однако, нет особых способностей, которые она могла бы применить в ближнем бою.
actors.mobs.yogrealfirst$darkfist.name=тёмная длань
actors.mobs.yogrealfirst$darkfist.teleport=Длань телепортируется подальше, создавая тёмную вспышку, которая тушит ваш источник света!
actors.mobs.yogrealfirst$darkfist.desc=Эта длань сформирована из чистой темной энергии. Она способна каждый ход излучать мощные лучи темной магии! Эти лучи ослабляют ваш источник света и причиняют тяжелый урон. Длань также способна на короткое время заливать арену темнотой, чтобы скрыться.\n\nУ этой длани, однако, нет особых способностей, которые она могла бы применить в ближнем бою.

levels.yoggodhardbosslevel.well_name = Межпространственный колодец
levels.yoggodhardbosslevel.well_desc = Изнутри колодца исходит пространственная магия. Возможно, он приведет в какое-то место?


actors.mobs.magicgirldead.name =Дунлин, ведьма Льда и Снега
actors.mobs.magicgirldead.desc =Когда-то она была одним из посланников Бога-творца, но из-за случая с пожаром была осквернена черной магией подземелья и превратилась в ведьму. Сейчас она испытывает ненависть ко всему и к тем кто вторгается в её жилье. Либо вы умрете, либо она будет жить. С ней очень трудно договорится, из-за того что она потеряла рассудок, так что если вы не готовы, лучшее не испытывайте судьбу.\n\n_Ни в коем случае не позволяйте ей находится на воде, иначе она станет очень опасной. \n\nПока существует кристалл, ведьма уменьшает пропорционально получаемый урон. Если атаковать ведьму, когда есть кристалл, то она получит определенный урон после того, как кристалл непосредственно найдет цель и выстрелит в нее._
actors.mobs.magicgirldead.name_alt=Дунлин, ведьма Льда и Снега?
actors.mobs.magicgirldead.desc_alt=Может быть, она появилась здесь от одержимого желания Лены, или от тоски накопившейся за долгие годы охраны Снежного каньона, тем не менее здесь её магия работает.\n\nПриблизившись к Ледяной ведьме, вы тут же догадались, что это всего лишь иллюзия, а не сама Дунлин.\n\nОднако для Лены она все еще дорога сердцу, поэтому, не позволяйте этой иллюзии исчезнуть у неё на глазах; это непременно разозлит её…
actors.mobs.magicgirldead.run = ...Ты пытаешься сбежать, таким гнусным способом?
actors.mobs.magicgirldead.arise=Выходите, мои защитники!
actors.mobs.magicgirldead.damaged =Кристалл защиты, накажи этого глупца!
actors.mobs.magicgirldead.arise2=Выходите, мои защитники!
actors.mobs.magicgirldead.shield2 = Вода - источник жизни, но она также приносит смерть.
actors.mobs.magicgirldead.shield =Вода мой источник жизни, дай мне сил!
actors.mobs.magicgirldead.notice =Путник! Тебе не следовало сюда приходить!
actors.mobs.magicgirldead.die =Наконец-то я смогу увидеть тебя вновь!!!
actors.mobs.magicgirldead.def_verb =Магический барьер
actors.mobs.magicgirldead.ranking_desc =Приговорен Ведьмой Льда
spellcaster$frostcaster.name =Иллюзия надменного кристалла
spellcaster$frostcaster.desc =Зачарованный кристалл защищающий своего заклинателя, был сотворен Снежной ведьмой, чтобы он периодически атаковал своего врага на дальнем расстоянии.\n\nРежим атаки: направляет луч в указанное место, и куда он попадает в следующем ходу, создаются лучи в четырех направлениях, накладывающие _окоченение_.\n\nКристалл неуязвим к дальнему бою и может получать урон только когда активен!
spellcaster$explosioncaster.name =Иллюзия завистливого кристалла
spellcaster$explosioncaster.desc =Зачарованный кристалл защищающий своего заклинателя, был сотворен Снежной ведьмой, чтобы он периодически атаковал своего врага на дальнем расстоянии.\n\nРежим атаки: направляет луч в указанное место, и когда он попадает в цель, проходит сквозь её меняя направление луча в поперечную сторону, а на следующем ходу в том месте куда попал луч, создает лучи в четырех направлениях, первый луч по цели всегда накладывает _метку_.\n\nМетка наложенная на цель, увеличивает на ней получаемый урон от всех кристаллов.
spellcaster$lightcaster.name =Иллюзия яростного кристалла
spellcaster$lightcaster.desc =Зачарованный кристалл защищающий своего заклинателя, был сотворен Снежной ведьмой, чтобы он периодически атаковал своего врага на дальнем расстоянии.\n\nРежим атаки: направляет луч в указанное место, и в следующем ходу запоминает местоположение своей цели, выпускает три рассеивающих луча, накладывающие _ослепление_.\n\nКристалл получает усиление, когда отмечен.
spellcaster$bouncecaster.name =Иллюзия ленивого кристалла
spellcaster$bouncecaster.desc =Зачарованный кристалл защищающий своего заклинателя, был сотворен Снежной ведьмой, чтобы он периодически атаковал своего врага на дальнем расстоянии.\n\nРежим атаки: направляет луч в указанное место, и в следующем ходу запоминает местоположение своей цели, чтобы в том месте куда уже попал луч выпустить еще один луч, накладывающий _метку_.\n\nМетка наложенная на цель, увеличивает на ней получаемый урон от всех кристаллов.
spellcaster$halofirecaster.name =Иллюзия пожирающего кристалла
spellcaster$halofirecaster.desc =Зачарованный кристалл защищающий своего заклинателя, был сотворен Снежной ведьмой, чтобы он периодически атаковал своего врага на дальнем расстоянии.\n\nРежим атаки: направляет луч в указанное место, и в следующем ходу запоминает местоположение своей цели, чтобы в том месте куда уже попал луч выпустить еще один луч, накладывающий _фосфорный огонь_.\n\nМетка наложенная на цель, увеличивает на ней получаемый урон от всех кристаллов.
spellcaster$halofirecaster.status = Пожирающий огонь!


spellcaster$degradecaster.name =Иллюзия алчного кристалла
spellcaster$degradecaster.desc =Зачарованный кристалл защищающий своего заклинателя, был сотворен Снежной ведьмой, чтобы он периодически атаковал своего врага на дальнем расстоянии.\n\nРежим атаки: направляет луч в указанное место, и в следующем ходу запоминает местоположение своей цели, чтобы в том месте куда уже попал луч выпустить еще один луч, накладывающий _потрепанность_.\n\nМетка наложенная на цель, увеличивает на ней получаемый урон от всех кристаллов.
spellcaster$degradecaster.status = Деградация экипировки!

spellcaster$deadlingcaster.name = Иллюзия обрекающего кристалла
spellcaster$deadlingcaster.desc =Зачарованный кристалл защищающий своего заклинателя, был сотворен Снежной ведьмой, чтобы он периодически атаковал своего врага на дальнем расстоянии.\n\nРежим атаки: направляет луч в указанное место, и в следующем ходу запоминает местоположение своей цели, чтобы в том месте куда уже попал луч выпустить еще один луч, накладывающий _обреченность_.\n\nМетка наложенная на цель, увеличивает на ней получаемый урон от всех кристаллов.
spellcaster$deadlingcaster.status = Обречён на гибель!

spellcaster.marked = Отмечен


actors.mobs.npcs.reddragon.name=король драконов
actors.mobs.npcs.reddragon.gnollshiled_1=Эй, путешественник! Да, я тебе обращаюсь! Ты видел этого странного гнолла? Он уже несколько дней, не дает мне покоя своими алхимическими смесями. Я хочу, чтобы ты помог мне убить его.\n\nЕстественно, если все пройдет успешно, я вознагражу тебя что-нибудь хорошим.
actors.mobs.npcs.reddragon.gnollshiled_2=Опасны ли его алхимическая смеси? Безусловно, но не волнуйся, ты справишься! Я сумел привлечь его внимание, скорее убей этого гнолла, чтобы я отблагодарил тебя!
actors.mobs.npcs.reddragon.skullshaman_1=Эй, путешественник! Да, я тебе обращаюсь! Ты замечал, что в этом месте есть какие-то странные вспышки света? Это все дело рук одного гнолла со сломанной маской, он пугает и раздражает меня своими магическими лучами. Я хочу, чтобы ты помог мне убить его.\n\nЕстественно, если все пройдет успешно, я вознагражу тебя что-нибудь хорошим.
actors.mobs.npcs.reddragon.skullshaman_2=Опасна ли его маска? Безусловно, но не волнуйся, ты справишься! Я сумел привлечь его внимание, скорее убей этого гнолла, чтобы я отблагодарил тебя!
actors.mobs.npcs.reddragon.flamec01_1=Эй, путешественник! Да, я тебе обращаюсь! Ты слышал такой металлический скрежет? Этот все тот робот, который каждый день донимает меня своим скрежетом, из-за него я не могу спокойно поспать в тишине. Я хочу, чтобы ты помог мне разобрать его на части!\n\nЕстественно, если все пройдет успешно, я вознагражу тебя что-нибудь хорошим.
actors.mobs.npcs.reddragon.flamec01_2=Опасен ли его огнемет? Безусловно, но не волнуйся, ты справишься! Я сумел привлечь его внимание, скорее убей этого робота, чтобы я отблагодарил тебя!
actors.mobs.npcs.reddragon.find_me=Спасибо что помогаешь, как все сделаешь, я сразу приду к тебе.
actors.mobs.npcs.reddragon.desc=Величественный дракон, окруженный непробиваемым розовым барьером и устрашающим фосфорным огнем, патрулирует окружающую местность. Похоже, он кого-то ищет, возможно, именно вас!

actors.mobs.redmurderer.name=алый грабитель
actors.mobs.redmurderer.stole=Грабитель украл у вас %s! Создал магический круг и телепортировался от вас.
actors.mobs.redmurderer.carries=\n\nГрабитель несёт _%s._ Очевидно, украл где-то.
actors.mobs.redmurderer.escapes=Грабитель забирал у вас %s, чтобы поскорее продать и снова вернутся к вам.
actors.mobs.redmurderer.desc=Алый грабитель - опасные монстры, сбежавшие из тюрьмы и попавшие в город дворфов под влиянием магического подземелья.\n\nКороль дворфов наделил их страшной силой.\n- В любом случае, они определенно опасны, старайтесь не сражаться с ними вблизи! {\n\nЗапомните одно, их жажда к наживе не знает границ. {

actors.mobs.brownbat.name=коричневая летучая мышь
actors.mobs.brownbat.desc=Эти хрупкие летучие мыши, похоже, не любят когда их беспокоят. Из-за их чрезмерной ловкости нужно прибегать к _скрытой атаки_, чтобы суметь попасть по ним, а их атаки _острыми когтями_ могут повредить глаза.\n\nПеред смертью они всегда поднимают тревогу, так что будьте осторожны с ними.
actors.mobs.brownbat.warning=Перед смертью летучая мышь издала мощный звук, чтобы он привлек внимание монстров!

actors.mobs.icegolem.name=ледяной голем
actors.mobs.icegolem.frost_kill=Ледяная сила заключает вас навеки в ловушку.
actors.mobs.icegolem.desc=Големы - попытка исправить изъяны дворфского оборудования путем новооткрытого использования магии. Они намного более компактны и эффективны по сравнению с DM-300, и, в то же время, все еще весьма смертельны.\n\nЛедяные големы отличаются от обычных тем, что могут проходить сквозь двери, поскольку они более гибкие и коротки, и могут сделать любого путешественника беззащитным благодаря силе льдов.

actors.mobs.icegolem$darkbolt.rankings_desc=Заморожен во льду!

actors.mobs.gnollshiled.name=древний гнолл-алхимик
actors.mobs.gnollshiled.desc=Гноллы - гиеноподобные гуманоиды. Они обитают в подземельях, периодически собираясь для рейдов на поверхность. Гноллы-алхимики - элитные гноллы, которые умеют использовать алхимические катализаторы, чтобы накладывать на захватчиков случайные негативные эффекты.

actors.mobs.shopguarddead.name=гравитационный охранник магазина
actors.mobs.shopguarddead.desc=Эта { неожиданная статуя { всегда приходит к вам, когда вы пытаетесь что-то _купить не заплатив_ торговцу в магазине. В глубине души вы прекрасно понимаете, что вас ждут { большие неприятности. {\n\nПохоже, она в прекрасной форме, судя по броне, которую она носит, и, вероятно, будет чрезвычайно трудно её убить.\n\nХотя сама статуя сделана из камня, но _%1$s_ и _%2$s_ в ее руках выглядят настоящими.\n\n_Гравитаторы - обладают силой контроля гравитации, они способны контролировать саму гравитацию. Они обязаны убивать всякого, кто попытается получить товар не заплатив за него в магазине._
actors.mobs.shopguarddead.kil=Я контролирую гравитацию, поэтому даже не питайся парить в воздухе!

actors.mobs.shopguard.name=карающий охранник магазина
actors.mobs.shopguard.desc=Эта { неожиданная статуя { всегда приходит к вам, когда вы пытаетесь что-то _купить не заплатив_ торговцу в магазине. В глубине души вы прекрасно понимаете, что вас ждут { большие неприятности. {\n\nПохоже, она в прекрасной форме, судя по броне, которую она носит, и, вероятно, будет чрезвычайно трудно ее убить.\n\nХотя сама статуя сделана из камня, но _%1$s_ и _%2$s_ в ее руках выглядят настоящими.\n\n_Каратели - самые простые охранники, способны подавлять исцеление своего противника. Они обязаны убивать всякого, кто попытается получить товар не заплатив за него в магазине._
actors.mobs.shopguard.noha=Ты нарушил правила магазина подземелья, поэтому даже не питайся исцелять себя!

actors.mobs.shopguardeye.name=надзирающий охранник магазина
actors.mobs.shopguardeye.desc=Эта { неожиданная статуя { всегда приходит к вам, когда вы пытаетесь что-то _купить не заплатив_ торговцу в магазине. В глубине души вы прекрасно понимаете, что вас ждут { большие неприятности. {\n\nПохоже, она в прекрасной форме, судя по броне, которую она носит, и, вероятно, будет чрезвычайно трудно ее убить.\n\nХотя сама статуя сделана из камня, но _%1$s_ и _%2$s_ в ее руках выглядят настоящими.\n\n_Надзиратели - обладают силой верного глаза, они способны узреть даже невидимого противника. Они обязаны убивать всякого, кто попытается получить товар не заплатив за него в магазине._
actors.mobs.shopguardeye.nois=Я способен узреть невидимое, поэтому даже не питайся скрыться!

actors.buffs.roseshiled.name=барьер роз
actors.buffs.roseshiled.heromsg=Магия роз защищает вас!
actors.buffs.roseshiled.desc=Вы не получаете никакого урона, когда находитесь в барьере роз.\n\nХодов осталось: %s.

actors.mobs.skullshaman.name=древний гнолл-шаман
actors.mobs.skullshaman.desc=Пожилой гнолл, живущий на дне шахт, по одному только виду черепа можно понять, что это существо не стоит тревожить. К счастью, он, похоже, погрузился в глубокий сон, так как слишком стар. Возможно, вам удастся ускользнуть от него незаметно.

actors.buffs.hunger.warning=Вы чувствуете непреодолимый голод, который дает вам дурное предчувствие.
actors.mobs.pyloncs.name=сверхвысоковольтная опора
actors.mobs.pyloncs.desc_inactive=Высоковольтная опора для управления электричеством, снабжающим местное оборудование.\n\nВ данный момент опора неактивна и невосприимчива к урону.
actors.mobs.pyloncs.desc_active=Высоковольтная опора для управления электричеством, снабжающим местное оборудование. Опора потрескивает от напряжения - наверняка именно от нее заряжается DM-720!
actors.mobs.pyloncs.crazy=МОДУЛЬ ПОВРЕЖДЕН, АКТИВИРОВАН АВАРИЙНЫЙ РЕЖИМ!

actors.mobs.newdm720.name=DM-720
actors.mobs.newdm720.notice=ОБНАРУЖЕН НЕАВТОРИЗОВАННЫЙ ПЕРСОНАЛ!
actors.mobs.newdm720.shield=DM-720 подключается к току от открытых проводов и создает себе щит!
actors.mobs.newdm720.vent=DM-720 совершает выброс токсичных выхлопных газов!
actors.mobs.newdm720.rocks=DM-720 наносит удары по полу, с потолка сыпятся камни!
actors.mobs.newdm720.charging=ПОЛУЧАЮ ПОВРЕЖДЕНИЯ! АКТИВИРУЮ ВЫСОКОВОЛЬТНУЮ ОПОРУ!
actors.mobs.newdm720.charging_hint=DM-720 неуязвим, пока он подпитывается от высоковольтной опоры!
actors.mobs.newdm720.supercharged=УНИЧТОЖИТЬ! УНИЧТОЖИТЬ! УНИЧТОЖИТЬ!
actors.mobs.newdm720.charge_lost=ОПОРА УНИЧТОЖЕНА! ПЕРЕХОЖУ НА ЛОКАЛЬНОЕ ПИТАНИЕ!
actors.mobs.newdm720.pylons_destroyed=ТРЕВОГА! ОБНАРУЖЕНА НЕСТАБИЛЬНОСТЬ ЭЛЕКТРОСЕТИ!
actors.mobs.newdm720.rankings_desc=Раздавлен DM-720!
actors.mobs.newdm720.def_verb=Нанощит!
actors.mobs.newdm720.defeated=КРИТИЧЕСКОЕ ПОВРЕЖДЕНИЕ! ЗАПУЩЕН ПРОЦЕСС САМОУНИЧТОЖЕНИЯ! ЧЕРЕЗ 3...
actors.mobs.newdm720.desc=DM-720 - самое крупное и сильное 'оборонное оборудование', когда-либо созданное дворфами в этом веке. Такую великолепную машину чрезвычайно трудно создать, так что дворфы сделали их всего несколько штук для стражи входов в их подземную столицу.\n\nМашина оснащена выхлопной трубой для выброса токсичных газов и сверхмощной дрелью, которой она может и атаковать, и разрывать грунт. DM-720 также способен подключаться к сети питания, что еще более повышает его силу.\n\n_DM-720 - супероружие, созданное дворфскими мастерами, она не только извергает огонь, но и более мощная, чем DM-300. Более того, мастера использовали проводимость воды, и посадили за них следопытов, потерявших рассудок, чтобы управлять ими. Почти каждый путешественник, встречавший их так и не смог возвратиться._
actors.mobs.newdm720.desc_supercharged=В данный момент, DM-720 полностью заряжен электроэнергией. В таком состоянии DM-720 невозможно нанести урон, и он передвигается с двойной скоростью! Кроме того, его дрель теперь вертится достаточно быстро, чтобы _пробить тоннели сквозь скальной массив,_ хотя двигаться при этом будет намного медленнее.\n\nПока DM-720 сверх-заряжен, нет смысла атаковать его напрямую, _но что-то в этом месте, очевидно, снабжает его энергией,_ и если найти это и разрушить, возможно, это его ослабит.
actors.mobs.newdm720$fallingrocks.desc=С потолка падают камни и обломки, похоже, он сейчас обвалится!
actors.mobs.newdm720.repair=АКТИВИРОВАНА РЕЗЕРВНАЯ ЭНЕРГИЯ! ЗАПУЩЕН САМОРЕМОНТ DM-720.
actors.mobs.newdm720.explo_kill=ВНИМАНИЕ ЗАПУЩЕНО САМОУНИЧТОЖЕНИЕ DM-720, ПОКИНЬТЕ ОБЛАСТЬ ВЗРЫВА!

actors.mobs.rednecromancer.name=гнолл-жнец
actors.mobs.rednecromancer.desc=Эти гнолл-жрецы способны в бою призывать самых могущественных гнолл-громил, и поговаривают, его некромантия очень опасна.
actors.mobs.rednecromancer$necroskeleton.name=гнолл-громила жнеца
actors.mobs.rednecromancer$necroskeleton.desc=Этот гнолл-громила был призван гнолл-жнецом. Его способности и привычки полностью отличаются от обычных гноллов, поэтому с ним нужно быть поосторожней.

actors.mobs.coldmagicrat.name=замороженная крыса
actors.mobs.coldmagicrat.frost_kill=Ледяная магия превратила вас в льдину...
actors.mobs.coldmagicrat.desc=Мертвая крыса, ожившая с помощью _неизвестной магии_, она долгое время подвергало тело своим воздействием, пока полностью не наполнило её магической жизнью. Эти существа за время пребывания в ледяных землях, стали крайне враждебны к путешественникам, поэтому используют ледяные магические стрелы, чтобы застать врага врасплох.
actors.mobs.coldmagicrat$darkbolt.rankings_desc=Заморожен во льду!

actors.mobs.fireghostdead.name=пылающий призрак
actors.mobs.fireghostdead.frost_kill=После волны пламени наступило небытие!
actors.mobs.fireghostdead.desc=Этот красный призрак был пробужден с помощью огненного пламени, создаваемого некромантами в глубинах подземелья. Хоть такие призраки и не очень сильны, как огненные элементали, но все так же опасны как они.\n\nЭтот монстр поджигает свою цель и использует дальнобойные атаки.
actors.mobs.fireghostdead$darkbolt.rankings_desc=Испепелен пылающим призраком!

actors.hero.waterondeath=Вы умерли от проклятой воды.
actors.hero.ondeath=Вы умерли...

actors.mobs.redswarm.name=кровавая муха
actors.mobs.redswarm.desc=Гигантские мухи превращение в красных от _холода_, и воздействия _черной_ магии подземелья, став _очень опасными_, будьте _осторожны_ с ними, такие мухи своими _повадками_, доказывают кто здесь главный.
actors.mobs.redswarm.fire_kill=Вы сгорели заживо в таком холодном месте...
actors.mobs.redswarm$darkbolt.rankings_desc=Убит кровавым поджигателем...


custom.utils.script.name_ren=REN-33
custom.utils.script.name_smallb=Сяолань, служанка-полудракон




actors.mobs.npcs.ren.name=REN-33
actors.mobs.npcs.ren.desc=Она самый первый «игрок» в мире подземелий, который успешно использует заклинания путешествий. Возможно, вы уже встречали её в других мирах, где она могла упомянуть про «Торифунэ», но это уже давняя история... Сейчас REN - всего лишь обычный путешественник по мультивселенным, который пытается собрать тысячи редких вещей в подземельях из разных миров.
actors.mobs.npcs.ren.message1=Расслабься. Это подземелье не такое сложное как ты думаешь... Сейчас, важно убедиться, что у тебя есть все нужное с собой для приключения!
actors.mobs.npcs.ren.message2=...Я? Лично для меня использование заклинания времени и пространства позволяет мне брать сокровища из любого мира по своему усмотрению... Ты даже представить не можешь каково это. Хочу, сказать тебе, прежде чем ты начнешь приключение, я уже заполучила последний предмет из этого подземелья!
actors.mobs.npcs.ren.message3=Взгляни на него, это же амулет Йендора! Хм... Ха-ха-ха, похоже, он не из этого мира, я подобрала его где-то по ошибке. Это значит, что я еще не заполучила последнее сокровище из этого подземелья, ну вот...
actors.mobs.npcs.ren.roll1=У меня более 190 амулетов Йендора, и один из самых труднодоступных - это золотая медаль Йендора... Не могу вспомнить, куда я положила этот амулет в своей комнате.
actors.mobs.npcs.ren.roll2=Я так люблю Макдональдс! Хоть и в нем стало все таким дорогим, но… Что? Ты вообще не знаешь, что такое «Макдональдс»! Ха-ха, это нормально.
actors.mobs.npcs.ren.roll3=Больше не упоминай при мне «Chewan»......Я изо всех сил стараюсь притвориться, что не знаю про это нечего... И даже не думай о продолжение истории про «Торифунэ», я не в настроении об этом говорить!
#  新增的roll文本：
actors.mobs.npcs.ren.roll4=Мне всегда кажется, что «торговые автоматы» в этом подземелье умнее тех, что в моем мире. В конце концов, у нас там нет приветствия как тут.
actors.mobs.npcs.ren.roll5=Первой причиной, по которой я стала известна жителям других миров, был «винный дневник», который я оставила в подземелье, заросшего ореховыми лозами, когда была молодой... Теперь я хочу уничтожить все копии. Боже мой, это все моя темная история.
actors.mobs.npcs.ren.roll6=Хочешь попробовать «Chuuo»? Это «новое подземелье», которое я недавно нашла в пустоте мироздания подземелий. Хочешь узнать загадочное кодовое название? Хм, «■■■■■■■■■■■■», ответ на вопрос «из соседнего подземелья».
actors.mobs.npcs.ren.roll7=Чипи чапа, дуби даба.
actors.mobs.npcs.ren.roll8=Приветик.
actors.mobs.npcs.ren.roll9=Извини, у меня только что произошел сбой, и теперь я пытаюсь снова вставить свой провода в пальцы.
actors.mobs.npcs.ren.def_verb=В чем дело?


actors.mobs.npcs.goonpc.name=Слизень

actors.mobs.npcs.slyl.name=Лэн
actors.mobs.npcs.slyl.message1=Приветствую! Путешественник!
actors.mobs.npcs.slyl.message2=Глубочайшая тьма подземелья... Казалась немного подзабытой. Но, недавно некие путешественники обнаружили в подземелье новые особые книги, и все они оказались заражены магией.
actors.mobs.npcs.slyl.message3=Тысячи путешественников спускалось в подземелье за ​​«Кристальным сердцем», но ни один не вернулся... Я не знаю, правильно ли мы поступаем, но приближается буря... У нас нет другого выбора, кроме как продолжать путь...
actors.mobs.npcs.slyl.tips=Напоминание: Опциональные боссы временно отключены, следите за будущими обновлениями.
actors.mobs.npcs.slyl.readbooks=Примечание: Учебник находится на доработке, следите за будущими обновлениями.
actors.mobs.npcs.slyl.other_1=Инициатором является...
actors.mobs.npcs.slyl.other_2=Правильно ли мы поступаем?
actors.mobs.npcs.slyl.other_3=Приближается буря, когда же все это закончится?

actors.mobs.npcs.slyl.def_verb=Приближается гроза
actors.mobs.npcs.slyl.desc=Ведьма, овладевшая силой льда, но 300 лет назад она была служительницей в _Ледяном святилище_. Из-за постоянного появления подземных аномалий она пришла сюда, чтобы выяснить их причину возникновения. Судя по всему, она также ловить рыбу.
actors.mobs.npcs.slyl.howuse=Здравствуй, я Лэн. Добро пожаловать, обладателю _волшебной золотой монеты_, полученную из нашего _Ледяного святилища_., благодаря ей можно нарушить _магический поток_, который позволяет увидеть _определенных боссов_.\n\n-  _Первый бросок:_  Небесный слизень (5 этаж), Тенгу (10 этаж), DM-300 (15 этаж), Король Дворфов (20 этаж), Йог-Джева (25 этаж)_\n- ] Второй бросок: ] _Король слизней (5 этаж), Король мимиков (10 этаж), DM-720 (15 этаж), Генерал Дворфов (20 этаж), Йог-Зот (25 этаж)_\n- [ Третий бросок: [ _Снежная ведьма (15 этаж)_ (Третий бросок отображается только на _определенных этажах_)\n\nКроме того, бросок действует только на этажах перед боссом, а самый последний бросок всегда определяет генерацию босса на следующем этаже.\n\nИтак, теперь ты знаешь, что из себя представляет такая _монета_. Желаю тебе _счастливого приключения в подземелье_.

actors.mobs.npcs.renshop.guards=Похоже, ты не очень хороший человек.
actors.mobs.npcs.renshop.thief=Похоже, ты запятнал свою судьбу...
actors.mobs.npcs.renshop.sell=Продать предмет
actors.mobs.npcs.renshop.name=REN-33
actors.mobs.npcs.renshop.desc=Думаете, она бредит? На самом деле она была очевидцем того случая с Ин Линг. Тот факт, что сейчас она открыла здесь магазин для посетителей, - тому доказательство. Но она не так-то легко подскажет вам разгадку.
actors.mobs.npcs.renshop.greetings=Привет, %s! Мы снова встретились!

actors.mobs.npcs.nyz.guards=Ты напал на меня, я не позволю тебе заполучить мое добро.
actors.mobs.npcs.nyz.thief=Удумал украсть? А я-то думала, ты порядочный путешественник!
actors.mobs.npcs.nyz.sell=Продать предмет
actors.mobs.npcs.nyz.name=Няруко
actors.mobs.npcs.nyz.desc=Торговец, который ведет расследование в подземелье после случая с пожаром. Сейчас здесь она в основном продает взрывчатые предметы и некоторые таинственные книги.
actors.mobs.npcs.nyz.greetings=Няруко: Доброе-утро-день-вечер-ночь, путешественники. Добро пожаловать в это опасное и таинственное подземелье.



actors.mobs.npcs.nyz$2.talk_ascent=О, мой друг, ты %s неважно выглядишь, так уж и быть я сделаю тебе скидку на 30% на все товары в моем терминале.

actors.mobs.npcs.nyz.chat_1=Путешественник, мы снова встретились.
actors.mobs.npcs.nyz.chat_2=Здесь у меня здесь нет терминала, но ты можешь посмотреть мои товары на прилавке.
actors.mobs.npcs.nyz.chat_3=Счастливого пути, путешественник.
actors.mobs.npcs.nyz.chat_4=Снежный город станет нашим последним шансом...

actors.mobs.npcs.nyz.dhat_1=С Новым Годом, %s!
actors.mobs.npcs.nyz.dhat_2=Что, откуда я знаю твое имя? Ха-ха-ха, ты %s еще слишком молод.\n\nНо не волнуйся, я здесь для того, чтобы защитить тебя.
actors.mobs.npcs.nyz.dhat_3=С наступающим Новым годом, рядом с прилавком лежит еда, которую я приготовила для тебя. Желаю счастливого приключения тебе на пути к своей мечте.

actors.mobs.npcs.nyz.xhat_1=Добро пожаловать сюда, %s.
actors.mobs.npcs.nyz.xhat_2=Это далекое будущее, мы находимся в небольшом убежище, которое было создано в виртуальном образе, благодаря объединению моего и Паопао сознания. Чтобы помочь здесь всем набраться сил и немного отдохнут.
actors.mobs.npcs.nyz.xhat_3=У меня остались еще кое-какие припасы, которые возможно, помогут тебе. А сама Паопао находится сверху, там у нее ты можешь получить остальные припасы. Запомни, это очень опасное место, будь осторожен!

actors.mobs.npcs.nyz.xhat_4=...В конце я расскажу о...таящемся хаосе...слушай пустоту...\n\nА, в чем дело? Неужели ты не понимаешь? Ха-ха-ха, не обращай внимания, удачи тебе, %s.

actors.mobs.npcs.nyz.xhat_5=Сидя в темном углу, я наблюдала за всеми как взлетает и падает каждая жизнь, но они не знали, что они были всего лишь моей игрушкой.\n\nЗапомни %s, запутанный мир - это всего лишь твоя темная сторона, настоящая проблема все еще существует в море... Вскоре ты отправишься туда...

actors.mobs.npcs.nxhynpc.name=Насехуэй
actors.mobs.npcs.nxhynpc.message1=Если ты направляйтесь в подземелье, не беспокойтесь о припасах!
actors.mobs.npcs.nxhynpc.message2=Если тебе не хватит припасов в подземелье, приходи ко мне. Мой огромный магазин находится на многих этажах подземелья, и я всегда буду рад встрече.\n\nОднако если ты попытаешься сделать что-то плохое, ты будешь обречен!
actors.mobs.npcs.nxhynpc.def_verb=...
actors.mobs.npcs.nxhynpc.desc=Это торговец, владеющий множеством вещей, и зовут его - Насехуэй. Говорят, что он знает, что произошло в этом подземелье 300 лет назад, а здесь он в ожидании приходящих путешественников. Он дает путешественникам нужные припасы, но никогда не рассказывает им, насколько опасно это подземелье. Ходят слухи, что когда-то он был рыцарем, но после стал торговцем.
actors.mobs.npcs.nxhynpc.other_1=А ты знал? Что, у меня есть младшая сестра, которая потерялась в подземелье, её зовут Шарлотта. Надеюсь, ты найдешь её!\n
actors.mobs.npcs.nxhynpc.other_2=Я припоминаю, что у меня был фамильный рыба-меч, но я потерял его где-то в подземелье.

actors.mobs.npcs.obsir.name=ZIOM_Observe-sir
actors.mobs.npcs.obsir.message1=Хоть, я и не из этого мира, я часто размышляю о смысле жизни и смерти.
actors.mobs.npcs.obsir.message2=Он скорее всего зависит от интересов! Путник, неужели ты не видишь, что приближаются тёмные времена?
actors.mobs.npcs.obsir.def_verb=Ох! Интересно!!!
actors.mobs.npcs.obsir.desc=Загадочный человек в черном костюме и разноцветной шляпе на голове, а его кожа, совсем не похожа на человеческую. Поговаривают, что он в сговоре с начесными «торговцами». На самом деле этого человека не существует в этом мире, и как он находится здесь, до сих пор остается загадкой.\n\nСмерть - это еще не конец.
actors.mobs.npcs.obsir.other_1=О, забавно, я уже начинаю представлять себе твои приключения.
actors.mobs.npcs.obsir.other_2=Будь повнимательнее на своем пути!!!
actors.mobs.npcs.obsir.other_3=Путешествуя по подземелью, не забывай о своих близких!

actors.mobs.jdsdz.name=джунглевый страж
actors.mobs.jdsdz.desc=Поговаривают, что именно стражи джунглей «Кленовых джунглей» создали тех самих DM-200.\n\nИногда они способны накладывать на своих врагов эффект яда!\n\nЧем глубже этаж подземелья, тем сильнее становятся стражи.

actors.mobs.slime_red.name=кровавый слизень
actors.mobs.slime_red.desc=Очень разумное существо, которое сформировано благодаря неизведанной энергии внутри джунглей. Они вобрали в себя сущность крыс-альбиносов, когда формировали свою субстанцию, поэтому они способны вызывать кровотечение у своей цели.

actors.mobs.slime_orange.name=сумеречный слизень
actors.mobs.slime_orange.desc=Очень разумное существо, которое сформировано благодаря неизведанной энергии внутри джунглей. Они вобрали в себя сущность огнецвета, когда формировали свою субстанцию, поэтому они способны поджигать свою цель.

actors.mobs.slime_qs.name=зеленый слизень
actors.mobs.slime_qs.desc=Очень разумное существо, которое сформировано благодаря неизведанной энергии внутри джунглей. Они вобрали в себя сущность землекореня, когда формировали свою субстанцию, поэтому они способны опутывать свою цель.

actors.mobs.slime_sn.name=синий слизень
actors.mobs.slime_sn.desc=Очень разумное существо, которое сформировано благодаря неизведанной энергии внутри джунглей. Они вобрали в себя сущность тёмной магии, когда формировали свою субстанцию, поэтому они способны деградировать экипировку своей цели.


actors.mobs.slime_lt.name=желтый страж-слизень
actors.mobs.slime_lt.desc=_Громовой посланник_ - один из семи страж-слизней. Атаки, которые он совершает, могут накладывать на нарушителя _парализующий_ эффект!



actors.mobs.slime_lg.name=голубой страж-слизень
