ui.updatenotification$wndupdate.desc=Magic Ling Pixel Dungeon é regularmente atualizado com revisões dos conteúdos existentes no jogo, ou conteúdos inteiramente novos!\n\nO balanceamento do jogo também é frequentemente aprimorado em atualizações, para que assim itens/heróis/inimigos específicos não sejam muito fortes ou muito fracos.\n\nAtualizações também incluem correções de bugs e outros vários aprimoramentos de estabilidade.
