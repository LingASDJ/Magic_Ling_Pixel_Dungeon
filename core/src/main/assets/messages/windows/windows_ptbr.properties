windows.wndscorebreakdown.total_props=Mult. de Relíquias
windows.wndscorebreakdown.prop_desc=Ao final do jogo a pontuação total das relíquias positivas e negativas será multiplicada pela Pontuação Total do jogo.
windows.wndscorebreakdown.hard_desc=Com base na dificuldade do jogo.\nFácil: 0.5x, Normal: 1x, Difícil: 2x, Modo Dev: 0x.
windows.wndscorebreakdown.challenge_multiplier=Mult. de Desafio
windows.wndscorebreakdown.challenge_multiplier_desc=Com base no Número de Desafios Ativos.\nMult. Desafio = (1,25 elevado a %d(Número de Desafios Ativos)) x 20, arredondado e depois dividido por 20
windows.wndscorebreakdown.total=Pontuação Total
windows.wndscorebreakdown.total_desc=Pontuação Total do jogo inteiro.\nPontuação Total = (Progressão + Exploração + Chefes + Missões) x Mult. de Vitória (Tem base 1. Se o jogo for ganho, adiciona +1. Se retornar a superfície, adiciona +0,5) x Mult. de Desafio x Mult. de Relíquia x Penalidade da Seed (0,5 se for uma Seed Customizada, 1 se não) x Mult. de Dificuldade
windows.wndscorebreakdown.total_level=Rank
windows.wndscorebreakdown.total_level_desc=Rank geral baseado na Pontuação Total do jogo.\nRegras básicas: A Pontuação Total precisa ser maior ou igual a pontuação base requerida por cada Rank multiplicado pelo Mult. de Desafio (o Mult. de Desafio é dividido pela metade para o Rank SSS)\n    Rank E: 3.000\n    Rank D: 4.000\n    Rank C: 5.000\n    Rank B: 10.000\n    Rank A: 20.000\n    Rank S: 50.000\n    Rank SS: 100.000\n    Rank SSS: 200.000\n    Rank SSS+: 240.000\nA partir do Rank D, falhar no jogo vai aumentar a pontuação necessária para o Rank:\n    D, C, B, A: 2x\n    S, SS: 3x\n    SSS: 4x\n    SSS+: 5x
windows.wndscorebreakdown.old_score_desc=Jogos iniciados antes da v0.5 tem menos categorias de pontuação, porém a pontuação de [Progressão] é aproximadamente 50% maior, e a pontuação máxima de [Tesouro] também é maior.

