windows.wndblacksmith.prompt=Ok, trato é trato, aqui tá o que posso fazer por você.\n\n_Favores disponíveis: %d_
windows.wndblacksmith.pickaxe=_Picareta (%d Favores):_ Acho que posso te dar essa Picareta, eu tenho muitas delas.
windows.wndblacksmith.pickaxe_verify=Cê realmente quer esse treco? As pedras daqui não são como as de lá de baixo, você não vai conseguir cavar um buraco com isso.
windows.wndblacksmith.pickaxe_free=Beleza, cê fez um bom trabalho, pode levar isso de graça.
windows.wndblacksmith.pickaxe_yes=Sim, eu quero.
windows.wndblacksmith.pickaxe_no=Deixa pra lá.
windows.wndblacksmith.reforge=_Reforjar (%d Favores):_ Posso reforjar duas armas idênticas e identificadas numa de melhor qualidade.
windows.wndblacksmith.harden=_Endurecer (%d Favores):_ Posso Endurecer um de seus equipamentos identificados, isso deixa o glifo ou encantamento nele mais durável.
windows.wndblacksmith.upgrade=_Aprimorar (%d Favores):_ Me traz um item identificado com nível menor que +2, que eu melhoro ele.
windows.wndblacksmith.smith=_Forjar (%d Favores):_ Posso forjar uma arma ou armadura novinha pra você, todas que faço são de ótima qualidade e podem até vim aprimoradas. Minha forja pode produzir mais que uma por vez, então escolha a que preferir.
windows.wndblacksmith.smith_verify=Beleza, vou esquentar a forja e depois cê escolhe o que quer.
windows.wndblacksmith.smith_yes=Ok, eu espero.
windows.wndblacksmith.smith_no=Deixa pra lá.
windows.wndblacksmith.cashout=_Ouro (Todos os Favores):_ Passei uns anos minerando ouro nessa caverna, posso te dar uma moeda de ouro por cada favor restante.
windows.wndblacksmith.cashout_verify=Tá, são %d moedas de ouro, pega elas e estamos quites. Nem pense em me implorar por mais!
windows.wndblacksmith.cashout_yes=Me dê o ouro.
windows.wndblacksmith.cashout_no=Deixa pra lá.
