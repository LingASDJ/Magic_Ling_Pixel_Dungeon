windows.wnddragongirlblue.prompt=Tudo bem, agradeço por sua minuciosa pesquisa. Baseado em seus Pontos de Pesquisa, eu posso lhe conceder algumas recompensas.\n\nRecompensas em cinza podem significar que já foram resgatas ou que dependem do resgate de outras recompensas.\n\n_Pontos de Pesquisa disponíveis: %d_
windows.wnddragongirlblue.random_book=_Livro Lendário (%d Pts. de Pesquisa):_ Eu posso lhe dar o livro que comprei da Senhorita Nayako.
windows.wnddragongirlblue.random_book_yes=Fique com esse livro, %s, talvez ele torne suas próximas aventuras mais fáceis.


windows.wnddragongirlblue.random_misp=_Ajuda com Arremessáveis (%d Pts. de Pesquisa):_ Eu posso lhe dar uma arma de arremesso aleatória de pelo menos +1 nível.
windows.wnddragongirlblue.random_misp_yes=Espero que essa arma de arremesso possa ser de grande ajuda em suas próximas aventuras!

windows.wnddragongirlblue.random_meat=_Ajuda com Comida (%d Pts. de Pesquisa):_ Eu posso lhe dar 2 Carnes de Peixe Fantasma.
windows.wnddragongirlblue.random_meat_yes=Espero que elas possam te ajudar em momentos de extrema urgência por comida.

windows.wnddragongirlblue.bleesed=_Benção da Dragão (%d Pts. de Pesquisa):_ Eu posso lhe curar instantaneamente e te deixar em boa forma.
windows.wnddragongirlblue.bleesed_yes=Que meu poder possa te levar longe.

windows.wnddragongirlblue.maxtier=_Transmutação da Vontade Divina (%d Pts. de Pesquisa):_ Eu posso lhe dar um Pergaminho de Transmutação e uma Poção de Inspiração Divina.
windows.wnddragongirlblue.maxtier_yes=Espero que esses suprimentos possam te ajudar.

windows.wnddragongirlblue.maxring=_Anel Encontrado em Tesouros (%d Pts. de Pesquisa):_ Eu posso lhe dar um anel identificado com nível +1, mas ele está amaldiçoado.
windows.wnddragongirlblue.maxring_yes=Lembre-se de purificá-lo antes de usar.

windows.wnddragongirlblue.up=_Benção da Maid (%d Pts. de Pesquisa):_ Meu poder pode aprimorar qualquer uma de suas armas por no minimo 1 nível.
windows.wnddragongirlblue.up_yes=Eu espero que suas armas aprimoradas tornem-se mais fáceis de serem manuseadas. Você resgatou todas as minhas recompensas disponíveis, espero que suas próximas aventuras sejam molezinha.

windows.wnddragongirlblue.gold=_Troca por Ouro (%d Pts. de Pesquisa):_ Eu posso lhe dar alguma ajudinha financeira.
windows.wnddragongirlblue.gold_yes=Espero que essa pequena quantia de Ouro possa te dar mais opções de compras em lojas.

windows.wnddragongirlblue.pro=_Pontos de Missão Adicionais (%d Pts. de Pesquisa):_ O restantes de seus pontos de pesquisa podem ser convertidos em 1000 Pontos de Missão.
windows.wnddragongirlblue.pro_yes=Espero que esses pontos possa te deixar melhor.

