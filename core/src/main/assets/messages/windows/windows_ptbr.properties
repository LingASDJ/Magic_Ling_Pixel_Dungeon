windows.wndsettings$seedfindertab.plus=Tem certeza que deseja ativar o modo de Pesquisa Aprimorada?
windows.wndsettings$seedfindertab.plus_desc=Sorte também faz parte da vida. As vezes os conjuntos de seed gerados podem não conter tudo o que você deseja, por isso a Pesquisa Aprimorada surgiu!\n\nA Pesquisa Aprimorada ativa até _oito sub-threads_ de pesquisa simultânea. Se o seu dispositivo possuir menos que 8 núcleos, o número de sub-threads será automaticamente reduzido.\n\nNo entanto, seu conjunto de regras precisa ser possível, se 100% dele for impossível, a Pesquisa Aprimorada não vai te ajudar.\n\n<#F00>Esse modo tem uma alta demanda da CPU. Se sofrer uma notável lentidão durante a pesquisa, é recomendado que pare e diminua a quantidade de threads.<RGB>

