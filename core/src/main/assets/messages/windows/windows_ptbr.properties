windows.wndscorebreakdown.progress_title=Progressão
windows.wndscorebreakdown.progress_desc=Com base no Andar máximo e no Nível da heroína.\nProgressão = Andar: %d x Nível: %d x 65\nPontuação Máxima de 50.000
windows.wndscorebreakdown.treasure_title=Tesouro
windows.wndscorebreakdown.treasure_desc=Com base no Ouro coletado e no seus Itens.\nTesouro = Ouro: %d + Valor dos Itens: %d\nPontuação Máxima de 20.000
windows.wndscorebreakdown.treasure_desc_old=Com base no ouro coletado.
windows.wndscorebreakdown.explore_title=Exploração
windows.wndscorebreakdown.explore_desc=Com base nos itens coletados, segredos achados e puzzles resolvidos de cada andar.\nExploração = Andares Completos: %d x Andares Visitados: %d x 50
windows.wndscorebreakdown.bosses_title=Chefes
windows.wndscorebreakdown.bosses_desc=Com base em Chefes derrotados. Reduzido ao permanecer em ataques evitáveis durante as lutas.\nChefes = Chefe 1: %d + Chefe 2: %d + Chefe 3: %d + Chefe 4: %d + Chefe 5: %d + Chefe 6: %d
windows.wndscorebreakdown.quests_title=Missões
