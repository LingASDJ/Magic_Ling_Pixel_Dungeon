windows.wndresurrect.title=Воскрешение
windows.wndresurrect.message=Когда вы погибаете, вы чувствуете, как ваш анх направляет ваш дух обратно в этот мир. Это дает вам еще один шанс покорить подземелье!\n\nВы можете взять с собой четыре предмета, но остальные останутся там, где вы погибли. Какие предметы вы выберете?
windows.wndresurrect.low_message=Когда вы погибаете, вы чувствуете, как ваш анх направляет ваш дух обратно в этот мир. Это дает вам еще один шанс покорить подземелье!\n\nВы можете взять с собой четыре предмета, но из-за влияния света фонаря ваши _вещи_ и _золото_, будут забраны вашей _блуждающей душой_.\n\nК счастью, поскольку она связана с вами, вы всегда можете видеть его присутствие. Какие предметы вы выберете?
windows.wndresurrect.an_message=Когда вы погибаете, вы чувствуете, как ваш анх направляет ваш дух обратно в этот мир. Это дает вам еще один шанс покорить подземелье!\n\nВы можете взять с собой четыре предмета, но поскольку вы ранее попали в ловушку у «Бледной могилы», после возрождения ваши вещи появляться у _входа на этаж_. Какие предметы вы выберете?

