windows.wndwaloke.nomoney=Не хватает кобальтовых монет! Чтобы получить больше, побеждайте боссов в обычном режиме.
windows.wndwaloke.onlymode=Примечание: одновременно можно включить только один специальный режим.

windows.wndvictorycongrats.title=Победа!
windows.wndvictorycongrats.start_text=Поздравляем с покорением подземелья! Вы открыли несколько новых функций, которые доступны при выборе героя:
windows.wndvictorycongrats.challenges=Теперь вы можете включить _испытания!_ Это необязательные модификаторы, которые усложняют игру различными способами.
windows.wndvictorycongrats.custom_mode=Теперь вы можете разблокировать новые режимы с помощью _кобальтовых монет_, которые открывают доступ к таким режимам как: Золотая бабочка, Испытания боссами и многие другие, ожидающие вашего изучения.
windows.wndvictorycongrats.dailies=Теперь вы можете участвовать в _ежедневных забегах!_ Каждый день проводится новый ежедневный забег, одинаковый для всех игроков!
windows.wndvictorycongrats.stone=Теперь вы можете просматривать _Каменную стелу_, на которой будут записываться концовки из различных временных линий и их дальнейшее повествование в истории!

windows.wndvictorycongrats.thank_you=Большое вам спасибо за то что играете в Magic Ling Pixel Dungeon, которая основана на Shattered Pixel Dungeon!
windows.wndvictorycongrats.support_prompt=Пожалуйста, подумайте о возможности помочь в развитии MLPD вики. Если у вас нет на этого времени, то просто наслаждайтесь игрой!
windows.wndvictorycongrats.support=MLPD-WIKI
windows.wndvictorycongrats.close=Закрыть
windows.wndluowhite.talk_red=Промокод

windows.wndgoldburrety.message=Выберете и поместите предметы, которые хотите преобразовать, а затем поместите свиток Золотой бабочки в _центральный слот_.\n\nКоличество преобразованный зависит от ваших поступок, при выполнении различных поручений Золотой бабочки. Все доступные задания можно посмотреть в статусном эффекте поручения Золотой бабочки.\n\n(Чтобы получить возможность выбрать свиток Золотой Бабочки в _центральный слот_, сперва необходимо поместить не менее двух предметов в окружающие слоты.)\n\nИз-за воздействия магии, преобразование здесь занимает некоторое время, поэтому вам будет даровано благословение, чтобы здешние враги не нападали на вас в этот момент.
windows.wndgoldburrety.reforge=Преобразовать 

