windows.wndsettings$seedfindertab.plus_desc=诚然，运气也是生活的一部分，有一些时候你Roll的池子可能根本没有你想要的东西，所以，强力搜查由此诞生！\n\n强力搜查模式将至多启用_八个子线程_同时查找，每 5秒 未发现种子自动重新Roll池子。\n\n不过，这一切的前提是你的查种条件符合可能出现，如果是100%无法出现的条件。强力搜查模式也可能帮不了你。\n\n<#F00>另外，此模式可能对CPU算力有所要求，如果您查种感觉设备有明显卡顿，建议退出查种降低线程。<RGB>

