windows.wndranking$statstab.copy_seed_desc=Желаете ли вы использовать сид подземелья из списка рекордов в качестве пользовательского сида для новой игры? \n\nТакже имейте в виду, что если рекорд от старого прохождения, то разные версии Magic Ling Pixel Dungeon могут создавать разные подземелья, даже если сид одинаковый.
