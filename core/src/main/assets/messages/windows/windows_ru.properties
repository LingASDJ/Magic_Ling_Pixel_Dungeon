windows.wndranking$statstab$2.no_card=Убрано из избранного
windows.wndranking$statstab$2.get_card=Добавлено в избранное
windows.wndranking$statstab$2.no_card_desc=Эта запись результата была убрана из избранного. При следующем посещении страницы «Избранное», вы больше не увидите эту запись.
windows.wndranking$statstab$2.get_card_desc=Эта запись результата добавлена в избранное. Нажмите и удерживайте кнопку «Рекорды», чтобы попасть на страницу избранного.

windows.wndscorebreakdown.get_multiplier=Множитель Золотой бабочки
windows.wndscorebreakdown.get_desc=В режиме Золотой бабочки всегда начисляется 0 очков.
windows.wndscorebreakdown.seed_multiplier=Множитель сида
windows.wndscorebreakdown.diff_multiplier=Множитель сложности
windows.wndscorebreakdown.good_prop=Положительные безделушки: 
windows.wndscorebreakdown.chaos_prop=Хаотичные безделушки: 
windows.wndscorebreakdown.bad_prop=Негативные безделушки: 
windows.wndscorebreakdown.total_props=Множитель безделушек
windows.wndscorebreakdown.prop_desc=Общий счет положительного и негативного множителя безделушек умножается на общий счет очков для окончательного расчета очков от бонуса получаемого с собранных безделушек.
windows.wndscorebreakdown.hard_desc=Зависит от режима сложности.\nЛегкий - 0,5x, обычный - 1x, сложный - 2x, режим разработчика - 0x.
windows.wndscorebreakdown.challenge_multiplier=Множитель испытаний
windows.wndscorebreakdown.challenge_multiplier_desc=Даются за количество активированных испытаний.\nРасчет очков = (1,25 в степени %d (количество активированных испытаний)) x 20 и округляется до целого числа, затем делится на 20, чтобы дать окончательный множитель.
windows.wndscorebreakdown.total=Всего очков
windows.wndscorebreakdown.total_desc=Общий счет очков, накопленный на протяжении всей игры.\n\nРасчет очков = (прогресс + исследование + боссы + задания) x множитель игрового прохождения (по умолчанию 1, множитель победы +1, множитель возвращения +0,5) x множитель испытаний x общая коллекция x множитель сида (по умолчанию 1, если используется пользовательский сид 0.5) x множитель сложности
windows.wndscorebreakdown.total_level=Рейтинг
windows.wndscorebreakdown.total_level_desc=Общий рейтинг всей игры.\nОпределение рейтинга: общие очки ≥ уровень рейтинга по очкам х множитель сложности (множитель сложности при уровне SSS, уменьшается вдвое)\nРаспределение рейтинга по очкам:\n    E: 3000\n    D: 4000\n    C: 5000\n    B: 10000\n    A: 20000\n    S: 50000\n    SS: 100000\n    SSS: 200000\n    SSS+: 240000\nНачиная с рейтинга D, проигрыш в игре удваивает требуемые очки:\n    D, C, B, A: 2x\n    S, SS: 3x\n    SSS: 4x\n    SSS+: 5x
windows.wndscorebreakdown.old_score_desc=Прохождения, начатые до версии v0.5, имеют меньше категорий на очки, но прогресс примерно на ~50% больше, а лимит сокровищ выше.

