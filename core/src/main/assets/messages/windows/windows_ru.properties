windows.wndchallenges$8.middle_desc=Если вы столкнулись с багом, когда при выборе испытаний и входа в игру персонажем, у вас оказывается 0 активных испытаний. В таком случае, нажмите кнопку «Откалибровать» слева, чтобы выполнить калибровку!\n\nКогда вы находитесь в игре, здесь отображается количество активированных испытаний и множитель бонусных очков за прохождение текущей игры.
