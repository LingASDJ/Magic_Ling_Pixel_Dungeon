windows.wndnyzshop.nayaziwelcome=Здравствуй, путешественник и добро пожаловать в мой современный магазин, отличие от других, у меня доступен смарт-терминал!\n\nПрошу, выбирай все, что тебе нужно, но смотри у смарт-терминала может возникнуть неисправность! Если терминал сломается, ты не сможешь купить в нем товар.\n\nНачальная цена книг 720 золота (+100 при сбое), бомбы 270 золота (+50 при сбое), так что знай это перед покупкой!\n\nСбой это неисправности аппарата, поэтому фактическая стоимость может оказаться выше ожидаемой.\n\nТекущее число покупок: %d.

