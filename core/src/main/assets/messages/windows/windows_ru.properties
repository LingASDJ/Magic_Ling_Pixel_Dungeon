windows.wndscorebreakdown.title=Распределение очков
windows.wndscorebreakdown.progress_title=Прогресс
windows.wndscorebreakdown.progress_desc=Даются за максимальную глубину и уровень героя.\nРасчет очков = глубина подземелья: %d x уровень героя: %d x 65. Максимум очков: 50000
windows.wndscorebreakdown.treasure_title=Сокровища
windows.wndscorebreakdown.treasure_desc=Даются за собранное золото и общую цену предметов в инвентаре.\nРасчет очков = собранные золотые монеты: %d + стоимость имеющихся предметов: %d. Максимум очков: 20000.
windows.wndscorebreakdown.treasure_desc_old=Даются за собранное золото.
windows.wndscorebreakdown.explore_title=Исследование
windows.wndscorebreakdown.explore_desc=Даются за этажи со всеми найденными предметами, секретами и разгаданными головоломками.\nРасчет очков = Количество исследованных этажей: %d x Количество пройденных этажей: %d x 50.
windows.wndscorebreakdown.bosses_title=Боссы
windows.wndscorebreakdown.bosses_desc=Даются за побежденных боссов, очки уменьшаются за счет того, что вы стоите в атаках, которых можно избежать во время боев с боссами.\nРасчет очков = 1-й босс: %d + 2-й босс: %d + 3-й босс: %d + 4-й босс: %d + 5-й босс: %d + 6-й босс: %d.
windows.wndscorebreakdown.quests_title=Задания
windows.wndscorebreakdown.quests_desc=Даются за выполненные задания у NPC.\nРасчет очков = 1-е задание: %d + 2-е задание: %d + 3-е задание: %d + 4-е задание: %d + 5-е задание: %d.
windows.wndscorebreakdown.win_multiplier=Множитель победы
