windows.wnddragongirlblue.prompt=Отлично, благодарю тебя за тщательное исследование, и теперь по результату полученных очков я могу выдать тебе следующую награду.\n\nВознаграждение, выделенное серым цветом, может означать, что есть предварительная награда, которая еще не была получена или же она уже была получена.\n\n_Текущие очки исследования: %d._
windows.wnddragongirlblue.random_book=_Книги (%d исследований):_ Я могу предложить тебе случайное количество книг, которые я купил у мисс Няруко.
windows.wnddragongirlblue.random_book_yes=Возьми %s эту книгу, возможно, она поможет тебе в предстоящем приключении!


windows.wnddragongirlblue.random_misp=_Метательное (%d исследований):_ Я могу отдать тебе случайное метательное оружие не ниже +1 уровня.
windows.wnddragongirlblue.random_misp_yes=Надеюсь, это метательное оружие поможет тебе в предстоящем путешествии!

windows.wnddragongirlblue.random_meat=_Провиант (%d исследований):_ Из еды, я могу предложить тебе только 2 призрачных мяса.
windows.wnddragongirlblue.random_meat_yes=Надеюсь, хоть такая еда сможет помочь тебе, справится с голодом.

windows.wnddragongirlblue.bleesed=_Благословение (%d исследований):_ Я могу помочь тебе  исцелится и привести в нормальное состояние.
windows.wnddragongirlblue.bleesed_yes=Пусть моя сила поможет тебе в дальнейшем продвижении.

windows.wnddragongirlblue.maxtier=_Воодушевление (%d исследований):_ Я могу подарить тебе один свиток метаморфозы и зелье небесного вдохновения.
windows.wnddragongirlblue.maxtier_yes=Думаю эти предметы смогут тебе помочь.

windows.wnddragongirlblue.maxring=_Перстень (%d исследований):_ _Я могу достать тебе опознанное кольцо +1 уровня, но оно наверняка будет проклятым.
windows.wnddragongirlblue.maxring_yes=Перед тем как надеть кольцо, не забудь снять проклятие.

windows.wnddragongirlblue.up=_Улучшение (%d исследований):_  Моя сила может улучшить тебе любое оружие как минимум на +1 уровень.
windows.wnddragongirlblue.up_yes=Думаю теперь это оружие должно бить сильнее в твоих руках!

windows.wnddragongirlblue.gold=_Злато (%d исследований):_ Ели хочешь, я могу просто отдать тебе немного обычного золота.
windows.wnddragongirlblue.gold_yes=Думаю теперь ты сможешь купить то что хотел в магазине.

windows.wnddragongirlblue.pro=_Рейтинг (%d исследований):_ Оставшиеся очки исследований, могу обменять на 1000 очков заданий в статистику набранных очков.
windows.wnddragongirlblue.pro_yes=Надеюсь, это поможет тебе стать лучше.

