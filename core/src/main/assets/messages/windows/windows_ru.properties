windows.wndchallenges$9.custom_seed_title=Код испытаний
windows.wndchallenges$9.custom_seed_desc=Код испытаний обычно тесно связан с вашими сидами. Если при использовании чужого сида, код испытаний не равен 0, вам следует активировать испытания установив код, чтобы сид совпадал с испытаниями.
