scenes.heroselectscene.custom_banner_desc=Задайте на свой вкус тематический дизайн для баннера игры, который доступен в настоящее момент и перечислен ниже. Заполняйте текстовое поле только указанными в скобках аббревиатурами, чтобы применить выбранную тему.\n\nТемы: Праздник весны (SF), Воскресение (RH), Хэллоуин (HW), День рождения (BR), Праздник Цинмин (QF), Рождество (CS), Весна (SR), Лето (SS), Осень (AT), Зима (WR), Праздник фонарей (LR), День труда (LD), Праздник драконьих лодок (DBF), Праздник Цисицзе (QX), Фестиваль голодных духов (ZY), День образования КНР (GQ), Праздник середины осени (ZQ), Праздник двойной девятки (CY).
