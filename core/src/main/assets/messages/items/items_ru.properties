items.artifacts.unstablespellbook.unknown_scroll=Вы не знаете, что это за свиток.
items.artifacts.unstablespellbook.desc=Книга выглядит неплохо для своего возраста. Она искрит и потрескивает, когда вы листаете страницы, излучая нестабильную энергию. Вы не можете прочитать конкретное заклинание из книги.
items.artifacts.unstablespellbook.desc_cursed=Проклятая книга привязалась к вам, она не позволит использовать большинство свитков.
items.artifacts.unstablespellbook.desc_index=В этой книге не хватает страниц, но из оглавления можно узнать следующие заголовки:
items.artifacts.unstablespellbook.desc_empowered=Свитки, что вы добавили в книгу, начали излучать магический свет. Вы можете использовать особую версию эффекта добавленных свитков, но ценой дополнительного заряда.
items.artifacts.unstablespellbook.read_empowered=Свиток, добавленный вами в книгу излучает энергию. Вы можете направить его энергию в обычный или особый вариант этого же свитка.\n\nВыбор особого свитка потратит две единицы заряда вместо одного.

items.artifacts.magneticcrown.name=магнитная корона
items.artifacts.magneticcrown.desc=Надевая эту корону, вы можете установить связь с силой гравитации космоса, которая поможет притягивать вас и других существ к определенным местам...
items.artifacts.magneticcrown.desc_cursed=Проклятая магнитная корона сопротивляется вашему контролю, не позволяя вам ею управлять!
items.artifacts.magneticcrown.ac_activate=АКТИВИРОВАТЬ
items.artifacts.magneticcrown.prompt=Выберите цель для перетаскивания
items.artifacts.magneticcrown.no_equip=Вам необходимо надеть корону, чтобы её использовать.
items.artifacts.magneticcrown.cursed=Вы не можете использовать проклятую магнитную корону.
items.artifacts.magneticcrown.no_charge=Ваша корона недостаточно заряжена.
items.artifacts.magneticcrown.no_target=Поблизости нет объекта, которого можно было бы перетащить!
items.artifacts.magneticcrown.too_far=Ваша цель находится слишком далеко!
items.artifacts.magneticcrown.levelup=Ваша корона стала сильнее!
items.artifacts.magneticcrown.desc_range=Максимальное расстояние перемещения: %d.
items.artifacts.magneticcrown.no_enemy_in_range=你的周围存在敌人，本次牵引仅可拖拽范围内的敌人，选中位置附近无可用敌人！
items.artifacts.magneticcrown.no_vision=无法选取该位置，你看不见这片区域！

items.artifacts.commrelay.name=радиостанция DM100 (НЗП)
items.artifacts.commrelay.desc=Удивительное работающее устройство радиосвязи с прилагающей к ней инструкцией, а также содержит функцию авторизации.\n\nПохоже, кто-то оставил радиочастоту Гильдии наемников для получения их услуг за золото.
items.artifacts.commrelay.ac_call=АВТОРИЗАЦИЯ
items.artifacts.commrelay.ac_supp=СНАБЖЕНИЕ
items.artifacts.commrelay.ac_merc=НАЕМНИК

items.artifacts.commrelay.call_title=Система резервного снабжения!
items.artifacts.commrelay.call_desc=Добро пожаловать обладателей радиостанции DM100 в систему резервных поставок.\n\nПожалуйста, введите динамический код для авторизации с торговой палатой на поверхности, чтобы получить допуск к дальнейшему использованию системы.
items.artifacts.commrelay.confirm=Авторизация
items.artifacts.commrelay.cancel=Отмена
items.artifacts.commrelay.call_success=Авторизация прошла успешно, добро пожаловать в систему обслуживания радиостанции DM100.
items.artifacts.commrelay.call_fail=Авторизация не выполнена, введенный вами код неверен, пожалуйста, попытайтесь ввести код еще раз.

items.artifacts.commrelay.merc=Ваш наемник уже прибыл сюда.
items.artifacts.commrelay.boss=Вы не можете использовать здесь артефакт.
items.artifacts.commrelay.unequipped=Вам необходимо экипировать артефакт, прежде чем вы сможете его использовать!
items.artifacts.commrelay.unuseable=Вы думаете, что так, он будет работать?
items.artifacts.commrelay.no_money=Вы не можете использовать артефакт, не имея нужного золота!
items.artifacts.commrelay.already_cursed=Мы не будем подчиняться вам!
items.artifacts.commrelay.desc_1=Удивительное и работающее устройство радиосвязи с прилагающей к ней инструкцией.
items.artifacts.commrelay.desc_2=Прочитав которую можно разобраться с его функциями.\n\n
items.artifacts.commrelay.desc_3=Похоже, в нем имеется радиочастота Гильдии наемников, где они предоставляют свои услуги за золото.
items.artifacts.commrelay.desc_cursed=Проклятая радиостанция сама включилась и посылает громкий статическое треск, эхом разносящееся по подземелью.
items.artifacts.commrelay.desc_low_level=Вы связавшись по рации с наемниками, сумели договориться получить поддержку, если потратите золото на активацию их транспортера материи.
items.artifacts.commrelay.desc_high_level=Кто-то удаленно отправляет вам радиосообщения: «Предлагаем снабжение за 5000 золота или наемника за 3500 золота».
items.artifacts.commrelay.desc_work_well=Вы в хороших отношениях с гильдией, и теперь они охотно предлагают свои услуги за меньшую плату.
items.artifacts.commrelay.item_tip=Торговая палата с поверхности предоставила вам резервный запас.
items.artifacts.commrelay.item_pos=Выберите место для доставки

items.artifacts.wraithamulet.name=амулет из темного золота
items.artifacts.wraithamulet.desc=Этот амулет был когда-то оберегом у молодой девушки, исследовавшей здешние места, но с тех пор, как она исчезла в подземелье, он был оставлен здесь...\n\nБудучи предметом иного мира, он способен скрывать владельца, частично перенося его в "мир духов".\n\nКогда у амулета достаточно энергии, он может мгновенно перемещать к врагу и совершать покушение, наносящее { смертельный урон. { Но если это босс, то он получит _25% урона от максимального здоровья_.
items.artifacts.wraithamulet.ghost=Ваше тело становится прозрачным, как будто вы исчезаете.
items.artifacts.wraithamulet.cooddown=Ваш амулет восстанавливает энергию для повторного использования.
items.artifacts.wraithamulet.nochareup=Ваш амулет недостаточно заряжен, чтобы его можно было использовать.
items.artifacts.wraithamulet.cursed=Девичья обида воедино слились с проклятой магией, сковав вашу душу в амулете, не позволяя вам использовать его истинную силу.\n\n_Проклятый амулет лишает возможности употреблять зелья и периодически высасывает жизненную энергию владельца._

items.artifacts.wraithamulet.ac_ghost=ИСЧЕЗНУТЬ
items.artifacts.wraithamulet.ac_darkkill=ПОКУШАТЬСЯ
items.artifacts.wraithamulet.noequip=Вам необходимо надеть амулет, чтобы его использовать.
items.artifacts.wraithamulet.must_nocursed=Вы не можете использовать проклятый амулет.
items.artifacts.wraithamulet.drink_cursed=Проклятый амулет создает невидимый барьер, не позволяющий вам выпивать зелья, посылая вам голоса проклятой девы.

items.artifacts.wraithamulet$wraithrecharge.ondeath=Ваша душа полностью высосана амулетом...
items.artifacts.wraithamulet$wraithrecharge.cursed=Ваша душа останется в нем навсегда...
items.artifacts.wraithamulet$wraithrecharge.rankings_desc=Опустошён амулетом из темного золота...
items.artifacts.wraithamulet$wraithrecharge.ghoststong=Ваш амулет стал еще более могущественнее.

items.artifacts.wraithamulet$1.selectkill=Выберите цель для покушения
items.artifacts.wraithamulet$1.far=Эта цель находится слишком далеко.
items.artifacts.wraithamulet$1.rooted=Вы неспособны совершить покушение, пока ваше тело оплетено.
items.artifacts.wraithamulet$1.notthere=Там нет цели!
items.artifacts.wraithamulet$1.notthere2=Вы неспособны совершить покушение на спящего мимика.
items.artifacts.wraithamulet$1.notnpc=Вы неспособны совершить покушение на NPC!
items.artifacts.wraithamulet$1.killmobs=Это существо было успешно казнено вашим покушением!
items.artifacts.wraithamulet$1.killboss=Этот босс сильно пострадал от вашего покушения!
items.artifacts.wraithamulet$1.gold=Вы неспособны совершить покушение, пока находитесь в лабиринте сокровищ.
items.artifacts.wraithamulet$1.died=Отправляйся в ад!
items.artifacts.wraithamulet$1.koss=И что с того, что он босс?
###bags
items.bags.bag.name=рюкзак

items.bags.potionbandolier.name=пояс для зелий
items.bags.potionbandolier.desc=Этот широкий пояс надевается на грудь, как патронташ. В нём много маленьких кармашков для бутыльков с зельями.\n\nКарманы достаточно плотные для того, чтобы не дать бутылькам потрескаться от холода.

items.bags.scrollholder.name=футляр для свитков
items.bags.scrollholder.desc=这个管状的容器看起来可以装下一整份天文学家的手书，不过你的卷轴和书籍也刚好能放在里面。里面甚至有一些能用来放置法力结晶的小隔间。\n\n这个容器看起来并不是很可燃，所以你的卷轴在里面一定很安全。

items.bags.velvetpouch.name=бархатный мешочек
items.bags.velvetpouch.desc=В этой небольшой сумочке из бархата можно хранить множество мелких предметов, таких как семена и рунные камни.

items.bags.magicalholster.name=волшебный чехол
items.bags.magicalholster.desc=这款细长的皮制筒袋由某种异域动物的毛皮制成。强大的附魔使其拥有能收纳武器护甲道具的能力。\n\n只需伸手一探，想要的道具就会出现在你的手上。\n\n筒袋中涌动的魔力流还能小幅强化其中法杖的充能及投掷武器的耐久度。



###bombs
items.bombs.arcanebomb.name=奥磷炸弹
items.bombs.arcanebomb.desc=这枚炸弹里灌注了磷火药剂，当其爆炸时会释放出类似于蓄力攻击的强力冲击，在2格范围内对所有单位造成_%1$d~%2$d点魔法伤害_。且范围内造成短暂的磷焰效果。
items.bombs.arcanebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.bomb.name=бомба
items.bombs.bomb.ac_lightthrow=ПОДЖЕЧЬ И БРОСИТЬ
items.bombs.bomb.snuff_fuse=Вы спешно задуваете фитиль бомбы.
items.bombs.bomb.ondeath=Вас разорвало взрывной волной...
items.bombs.bomb.rankings_desc=Убит взрывом
items.bombs.bomb.desc=Довольно крупная бомба, под завязку начиненная черным порохом. Взрыв этой бомбы наносит _%1$d-%2$d урона_ всему, что находится рядом с ней, и разрушает некоторую прилегающую местность или предметы.
items.bombs.bomb.desc_fuse=Похоже, что фитиль будет гореть несколько ходов, если его зажечь.
items.bombs.bomb.desc_burning=Фитиль горит, лучше избавиться от бомбы или затушить его!
items.bombs.bomb$doublebomb.name=две бомбы
items.bombs.bomb$doublebomb.desc=Две здоровенные пороховые бомбы по цене одной!

items.bombs.firebomb.name=зажигательная бомба
items.bombs.firebomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве наносить _%1$d-%2$d урона_ на большей области, поджигая всё в радиусе 2 клеток от точки взрыва.
items.bombs.firebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.flashbang.name=световая граната
items.bombs.flashbang.desc=Это бомба была модифицирована таким образом, чтобы при взрыве излучить звуковую вспышку света с электрическим разрядом. Сам взрыв наносит _%1$d-%2$d урона_ всем кто находится в пределах 2 клеток, и дополнительно наносит электричеством 25%% урона, оглушая на 10 ходов.
items.bombs.flashbang.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.frostbomb.name=замораживающая бомба
items.bombs.frostbomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве наносить _%1$d-%2$d урона_ на большой области, создавая облако замораживающего газа в радиусе 2 клеток.
items.bombs.frostbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.shockbomb.name=雷霆炸弹
items.bombs.shockbomb.desc=这枚改造过的炸弹会在3格范围内释放雷电风暴，对范围内的生物造成_%1$d~%2$d点伤害_并使其陷入麻痹，麻痹的持续时间同样会随距离增加而降低。同时在爆炸时还会产生3x3的微型闪电风暴。
items.bombs.shockbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.holybomb.name=освящённая бомба
items.bombs.holybomb.desc=Это бомба была модифицирована таким образом, чтобы при взрыве излучать вспышки святой энергии. Сам взрыв наносит _%1$d-%2$d урона_ всем кто находится в пределах 2 клеток, а если под него попадает нежить или демон, они получают дополнительно 50%% урона от святой энергии.
items.bombs.holybomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.noisemaker.name=шумовая бомба
items.bombs.noisemaker.desc=Эта модифицированная бомба будет безостановочно издавать шум, когда фитиль догорит. Если что-либо коснется бомбы, она тут же взорвется и нанесет _%1$d-%2$d урона_ всем кто в радиусе 2 клеток!
items.bombs.noisemaker.desc_burning=Генератор шума тикает, взрыв произойдет, если что-либо приблизится на достаточное расстояние!
items.bombs.noisemaker.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.smokebomb.name=дымовая бомба
items.bombs.smokebomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве высвобождать облако газа. Она нанесет _%1$d-%2$d урона_ и распространит окутывающий туман в радиусе 2 клеток от точки взрыва.
items.bombs.smokebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.regrowthbomb.name=восстанавливающая бомба
items.bombs.regrowthbomb.desc=Эта модифицированная бомба вместо взрыва разбрызгивает в радиусе 3 клеток особый исцеляющий состав, провоцирующий ускоренный рост трав и растений, а так же лечащий вас и ваших союзников, будто вы выпили зелье исцеления.
items.bombs.regrowthbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.shrapnelbomb.name=осколочная бомба
items.bombs.shrapnelbomb.desc=Эта бомба была наполнена осколками DM-300, которые разлетятся во все стороны при взрыве, нанося _%1$d-%2$d урона_ всем в огромном радиусе вокруг бомбы. Лучше будет спрятаться за что-нибудь перед тем, как она взорвётся...
items.bombs.shrapnelbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.woollybomb.name=шерстяная бомба
items.bombs.woollybomb.desc=Эта бомба создаст широкое поле волшебных овец после взрыва, который наносит _%1$d-%2$d урона_ всему, что находится в пределах 2 клеток. Они не позволят кому-либо пройти, и будут стоять очень долго! Правда, в присутствии сильных врагов овцы буду исчезать быстрее, и их можно отогнать при взаимодействии с ними.
items.bombs.woollybomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

###prop

items.props.prop.rareness=Эта безделушка _%s-го уровня,_ содержит %s воздействие.

items.props.prop.bad=<#DD0101> негативное <RGB>
items.props.prop.good=_положительное_
items.props.prop.chaos=<#EE8E1C> хаотичное <RGB>

###Good Prop
items.props.starsachet.name=саше с звездоцветом
items.props.starsachet.desc=Мешочек с благовониями, изготовленный из драгоценных цветов Звездоцвета, которые до сих пор источают особый аромат. Их аромат позволяет чувствовать себя более осознанным.\n\nДает в каждом новом регионе владельцу, постоянный бонус на <#E5579A> 1/2/3/4/5/6 <RGB> к точности и уклонению.

items.props.rapidearthroot.name=растущий землекорень
items.props.rapidearthroot.desc=Особая разновидность Землекореня, которая лучше растет и более живуча, чем обычный Землекорень, но имеет не такие мощные корни, как у обычного. Тем не менее, в столь среде, как подземелье, где бушует магия, он может оказаться полезным в нужный момент.\n\nКаждые <#E5579A> 100 ходов <RGB> дает его владельцу дубовую кожу, равную текущему этажу, но каждые <#E5579A> 10 ходов <RGB> ослабевает её броню.

items.props.portablewhetstone.name=точильный камень
items.props.portablewhetstone.desc=Этот специальный точильный камень не только мал и удобен в переноске, но и отличается уникальным дизайном, позволяя  своему обладателю довольно «изящно» ремонтировать свое оружие в кратчайшие сроки. Его единственным недостатком является то, что этот камень не очень прочный.\n\nДает в каждом новом регионе владельцу, постоянный бонус на <#E5579A> 2/3/4/5/7/9 <RGB> к наносимому физическому урону.

items.props.newstem.name=ожившая ветвь
items.props.newstem.desc=Мертвая ветка с ростками, мечтает о том дне, когда она снова расцветёт.\n\nВосстанавливает <#E5579A> +1 ОЗ <RGB> каждые 10 ходов, когда у владельца не сильный голод.

items.props.luckyglove.name=счастливые перчатки
items.props.luckyglove.desc=Легендарные перчатки Бога азарта, которые, по слухам, он носил их во всех крупнейших казино, и не знал поражений. Пока не раскрылось то, что эти перчатки имеют многослойную структуру...\n\nДает владельцу <#E5579A> 15% шанс, <RGB> не потратить золотые монеты при покупке предметов.

items.props.emotionalaggregation.name = совокупность решимости
items.props.emotionalaggregation.desc = Немало путешественников побывало в подземелье, и большинство из них трагически сгинули где-то в его глубинах... Их непоколебимая воля перед смертью, через какое-то время слилась воедино, сформировав эту совокупность.\n\nДает владельцу <#E5579A> 10% шанс <RGB> проигнорировать атаку противника, когда он должен получить урон.

items.props.armorscalesofbzmdr.name= чешуя доспеха
items.props.armorscalesofbzmdr.desc = От этой чешуи исходит узнаваемый запах, напоминающий вам знакомого человека (Bzmdr), которого вы иногда видели в таверне. Вот только, помнится, он никогда не носил доспехи с подобной чешуей...\n\nДает в каждом новом регионе владельцу, постоянное снижение на <#E5579A> 1/2/3/4/5 <RGB> к получаемому урону.

items.props.deliciousrecipe.name = полезные рецепты
items.props.deliciousrecipe.desc = Интересно, если следовать этому рецепту: «Положите в кастрюлю немного мяса призрачной пираньи, добавьте немного травы солнечника, несколько стеблей магорозы и варите на медленном огне в течение 30 минут» действительно ли, получится народное блюдо?\n\nКаждый раз, когда его владелец расходует <#E5579A> алхимическую энергию <RGB> в алхимии, он получает <#E5579A> +2 алхимических кристалла. <RGB>
items.props.deliciousrecipe.reduce = Вы следовали рецепту, и в последний момент извлекли источник магической энергии... Но алхимический процесс все равно прошел успешно! Просто всегда присутствует ощущение, что что-то не так...

items.props.emotionalaggregation.block = Когда на вас собирались напасть, вы почувствовали, как теплый поток обхватил ваше тело... И вы на мгновение стали неуязвимы к этой атаке!

items.props.knightstabbingsword.name = рыцарская шпага
items.props.knightstabbingsword.desc = Эта шпага была объектом веры для многих поколений - и, возможно, остаётся им по сей день. А, сможете ли вы поверить в её силу?\n\nДает владельцу после уклонения <#E5579A> 40% шанс <RGB> не потратит ход при следующей атаке.
items.props.knightstabbingsword.attack = Ваша вера в шпагу получила одобрение; следующая атака не расходует ход.

items.props.luckyglove.lucky = Пока вы торговались с продавцом, ваши перчатки сами собой кое-что стащили для вас...


items.props.wenstudyingpaperone.name = рукопись исследования среды
items.props.wenstudyingpaperone.desc = «Местная природа изменилась куда сильнее, чем где-либо еще… Неужели виной тому влияние так называемой  "Магии"? Непонятно, требуется провести более тщательное расследование».\n\nПри потери здоровья владелец получает временной пузырь на <#E5579A> 2 хода, <RGB> а если здоровье опускается ниже <#E5579A> 50%, <RGB> он вместо этого получает временной пузырь на <#E5579A> 5 ходов. <RGB> Этот эффект имеет перезарядку в <#E5579A> 7 ходов <RGB> и не может быть активирован уроном получаемым от голода.

items.props.monocular.name = монокулярный телескоп
items.props.monocular.desc = Очень странный монокуляр, который выглядит так, будто его сделали из бинокля... Неужели ли эта штука действительно работает?\n\nКогда владелец попадает <#E5579A> метательным оружием <RGB> по противнику, оно дополнительно нанесет <#E5579A> 1-3 ед. урона, <RGB> и повысит точность на <#E5579A> 20% <RGB> за каждую <#E5579A> клетку <RGB> расстояния до противника.

items.props.yanstudyingpapertwo.name =рукопись исследования местности
items.props.yanstudyingpapertwo.desc = «После двух вылазок осмотра местности стало очевидно, что пространственная связь между этим местом и Расколотым царством не такая уж и далекая, и можно даже сказать, что "очень близка". Подтверждением служат несколько чужаков, замеченных мной с другой стороны от входа в подземелье, которые не должны здесь существовать. Исходя из своего опыта, думаю нужно расспросить местных жителей, а также задуматься о временном ночлеге в гостинице на время поисков».\n\nКаждые <#E5579A> 30 ходов <RGB> дает владельцу ускорение на <#E5579A> 5 ходов. <RGB>

//TODO
items.props.killeye.name=око охотника
items.props.killeye.desc=Единственный глаз сохранившейся из древних времен какого-то ужасного охотника, даже не потерял свой первичный вид спустя тысячелетия. Этот глаз обречен вечно следить за своей добычей... Вам повезло, что его взор не направлен на вас.\n\nВсе <#E5579A> неожиданные атаки <RGB> владельца игнорируют физическую защиту противника и эффекты снижающие урон, а каждые <#E5579A> 13/12/11/10/9/8 ходов <RGB> его следующая атака становится <#E5579A> неожиданной. <RGB>

items.props.purerouge.name=драгоценная пудра
items.props.purerouge.desc=Достаточно лишь один кокетливый взгляд с улыбкой, чтобы красота шести дворцов померкла перед ней.\n\nКогда владелец получает первый урон от противника или совершает неожиданную атаку по противнику на него накладывается эффект очарования и сглаза на 5 ходов. Также существует <#E5579A> 5%% шанс <RGB> замены этих эффектов на постоянную зачарованность. Этот шанс увеличивается на <#E5579A> 7,5%% <RGB> с каждой неудачной попыткой и снижается на 5%% при успехе.\n\nТекущий шанс зачарованности: %s%%.
items.props.purerouge.pure_charm=Необыкновенный аромат пудры очаровал: %s.

items.props.faintglimmer.name=безупречное сияние
items.props.faintglimmer.desc=你用光，照亮满天飘摇的风霜，让每个生命自由绽放；向前闯，哪管是地狱还是天堂，哪管冰冷或滚烫。\n\n持有时<#E5579A>每经过10回合获得1层微光庇护护<RGB>。每1层微光可以自我消耗，并立即移除1种你身上的负面效果。微光庇护最大累计至3层。\n\n当前已有%s层微光庇护。
items.props.faintglimmer.light=Безупречное сияние излучает чистую энергию, противодействуя %s негативным эффектам. В настоящий момент осталось %s зарядов мерцающей защиты.

items.props.hellbutterfly.name=炼狱赤蝶
items.props.hellbutterfly.desc=你获得<#E5579A>磷火和地狱火<RGB>免疫，在怪物被施加_磷火_时替换为<#E94134>地狱火<RGB>。携带地狱火的怪物每回合受到<#E94134>15%最大生命值<RGB>的魔法伤害，对于没有<#E94134>任何精英或突变词条的怪物，伤害类型变为真实<RGB>。\n\nBoss单位携带地狱火时，效果改为每回合受到<#E94134>20点魔法伤害<RGB>，并清空身上的任何护盾。地狱火可以像磷火一样传播。\n\n传说在忘川河畔有一种飞舞的蝶，这种蝶身上总是缠绕着燃烧不息的火焰，每一缕火苗都来自永远陨灭的思念……


### Bad Prop
items.props.brokenbone.name = сломанная кость
items.props.brokenbone.desc = Неизвестные останки какого-то несчастного путешественника. На нижней, обломанной части кости видны отчетливые следы пятен от воды. Что же ему пришлось пережить...\n\nДает владельцу при сражении с монстрами, снижение удачи на <#52B9D8> 30%. <RGB>

items.props.dirt_knifestand.name=грязные ножны
items.props.dirt_knifestand.desc=Интересно, а что же там внутри, мелькает... Ой нет, не стоило этого делать!\n\nОбременяет владельца постепенной потерей здоровья, когда он находится в состоянии <#52B9D8> легкого голода <RGB> (эффект вдвое ниже, чем при сильном голоде), а при <#52B9D8> сильном голоде <RGB> утраивает, теряемое за раз здоровье.

items.props.rustedgoldcoin.name =потускневшая золотая монета
items.props.rustedgoldcoin.desc =Хотя в подземелье все повсеместно используют золотые  монеты, ни одно государство или королевство на самом деле не использует золото в качестве валюты. Хотя неизвестно, из какого материала была сделана монета, но находясь в подземелье она покрылась ржавчиной.\n\nОбременяет своего владельца к потери золотых монет на <#52B9D8> 15%, <RGB> однако получаемая сумма, не может бить меньше 1 монеты.

items.props.confusedmiemietalisman.name = талисман безумной овцы
items.props.confusedmiemietalisman.desc = Возможно, первоначально создатель талисмана задумывал использовать волшебную овцу для своей защиты. Но, судя по всему, он оказался не очень умен в создании оберегов...\n\nКаждые <#52B9D8> 135 ходов <RGB> вызывает вокруг владельца толпу магических овец в радиусе 5x5 (аналогично овечьей ловушке), и после срабатывания перезаряжается 135 ходов. За <#52B9D8> 10 ходов <RGB> до срабатывания издает предупреждающий звук мекающей овцы.
items.props.confusedmiemietalisman.sheep = Ваш талисман внезапно испустил яркий свет...
items.props.confusedmiemietalisman.warning_start=Ваш талисман излучает красное свечение, и вы чувствуете, что вот-вот что-то произойдёт...
items.props.confusedmiemietalisman.warning=Красное свечение талисмана становится все ярче! Вы чувствуете, что через %d ходов произойдет что-то ужасное!

items.props.bottlewraith.name = призрак в бутылке
items.props.bottlewraith.desc =Магическая бутылка, внутри которой заключен мстительный дух, излучающий ауру, притягивающую множество подобных ему сущностей.\n\nПри каждом спуске владельца на новый этаж, случайным образом призывает <#52B9D8> от 1 до (количество этажей / 2) призраков (но не менее 1) <RGB> в различных местах текущего этажа.

items.props.blockingdrug.name=ингибитор
items.props.blockingdrug.desc=Даже безобидное ношение этого пузырька с таблетками ухудшает кровообращение в теле, затрудняя пассивную регенерацию здоровья.\n\nСнижает владельцу естественное восстановление здоровья на <#52B9D8> 20%. <RGB>

items.props.heartofcrystalfractal.name = кошмар кристального сердца
items.props.heartofcrystalfractal.desc = Небеса и земля погрузились во тьму, все живое охвачено безумием, а в ушах слышится зловещий шепот, всюдусущая злоба, исходящая из безграничной дали, ласкает землю, словно играя с любимой игрушкой… Именно такое видение открывается вашему разуму.\n\n Снижает владельцу уклонение на <#52B9D8> 15%. <RGB>


items.props.thegriefofspeechless.name = дневник немого
items.props.thegriefofspeechless.desc = Пожелтевший дневник, наполненный бедами и печалью человека с врожденной немотой.\n\nОбременяет владельца при чтении свитков (кроме свитка улучшения) <#52B9D8> 15% шансом, <RGB> что свиток не подействует.
items.props.thegriefofspeechless.grief = Ваш свиток внезапно вспыхнул ярким светом, а затем сгорел.

items.props.terrordoll.name = жуткая кукла
items.props.terrordoll.desc =Очень жуткая кукла, от которой постоянно не уходит ощущение, будто она все время наблюдает за вами.\n\nОбременяет владельца, снижая точность на <#52B9D8> 75%, <RGB> и активирует у атакующей палочки <#52B9D8> 10% шанс <RGB> не нанести урон.
items.props.terrordollb.name = страшная кукла
items.props.terrordollb.desc =Очень страшная кукла, от которой постоянно не уходит ощущение, будто она все время следит за вами.\n\nЭта кукла выглядит немного иначе...\n\nОбременяет владельца, снижая точность на <#52B9D8> 75%, <RGB> и активирует у атакующей палочки <#52B9D8> 10% шанс <RGB> не нанести урон.
items.props.terrordoll.terror = В вашем сердце внезапно вспыхивает необъяснимый страх.
items.props.cloakfragmentsofbzmdr.name = обрывок плаща
items.props.cloakfragmentsofbzmdr.desc = Когда вы подняли в подземелье, этот клочок черной ткани, он показался вам на удивление знакомым (Bzmdr). Неся его с собой, вы чувствуете, как кто-то за вами наблюдает, заставляя вас постоянно оглядываться по сторонам...\n\nДает в каждом новом регионе владельцу, постоянное снижение на <#52B9D8> 1/3/6/9/15 <RGB> к наносимому урону.
items.props.emotionalaggregationb.name = совокупность обиды
items.props.emotionalaggregationb.desc = Немало путешественников побывало в подземелье, и большинство из них трагически погибли где-то внутри его стен... Их сильная обида перед смертью, через какое-то время слилась воедино, сформировав эту совокупность. Даже просто храня её в рюкзаке, вас не покидает чувство глубокого отчаяния...\n\nДает в каждом новом регионе владельцу, постоянное повышение на <#52B9D8> 1/3/5/7/9 <RGB> к получаемому физическому урону.


items.props.wenstudyingpapertwo.name = рукопись исследования межпространства
items.props.wenstudyingpapertwo.desc = «Кто бы мог предположить... Что пространственные аномалии  внутри подземелья будут настолько непредсказуемы. А те так называемые подземные джунгли - не что иное, как окутанные магией осколки островков, зависшие в межпространственном хаосе. Реальное расположение тюрьмы и пещер здесь совершенно противоположно друг другу. Зачастую мы не спускаемся вниз, а скорее... поднимаемся наверх. После исследования природы здешней магии, мне стало очевидно, что в здешнем подземелье скрыто нечто большее, чем просто вышедшее из-под контроля Кристальное сердце.»\n\nКаждые <#52B9D8> 30 ходов <RGB> накладывает владельцу cглаз на <#52B9D8> 20 ходов. <RGB>
items.props.yanstudyingpaperone.name = рукопись исследования телепортации
items.props.yanstudyingpaperone.desc = "显而易见，地牢并不适合正常……普通人类，这里的空间变化相当剧烈，即使是同一个传送门也会在不同的时刻将人或者物品传送到不同的位置，但奇怪的是，经过一次传送以后便形成了仅供某人使用的双向传送门，经过空间坐标探查，前后的传送门虽然位置一样，但其已经不再是同一个传送门" \n\n你在改变楼层时<#52B9D8>有25%概率遗失除力量/根骨药剂<RGB>以外的<#52B9D8>任何药水<RGB>，每次有1-4瓶遗失。\n\n据说这则手稿的主人已经遇难，所以你的药水挎包被言的诅咒禁锢，无法丢弃。
items.props.yanstudyingpaperone.lost = Как только вы собрались идти дальше, вы вдруг ощущаете, как ваш рюкзак стал легче...

items.props.noteofbzmdr.name =  заметки путешественника
items.props.noteofbzmdr.desc = Письмена записанные внутри, не принадлежит ни к одной из известных цивилизаций. Что же это за язык?\n\nДальность обзора всех монстров увеличивается на <#52B9D8> 25%, <RGB> и при этом любые их атаки ослабевают источник <#52B9D8> освещения <RGB> владельца. Если нет ни одного источника освещения, монстры наносят на <#52B9D8> 25% <RGB> больше урона владельцу.

items.props.stardust.name = звездная пыль
items.props.stardust.desc = 来自此界之外的事物，只是沐着其中散发出的光芒你便感觉到了无匹的重量。带着它时就连移动也成为了困难的事情……\n\n你的<#52B9D8>移动速度降低25%<RGB>，且最高移速不能<#52B9D8>超过1.5<RGB>，你的浮空时间<#52B9D8>降低50%<RGB>，受到的坠落伤害<#52B9D8>增加25%。<RGB>


items.props.brokenring.name = сломанное кольцо
items.props.brokenring.desc = Легенды гласят, что будучи целостным, оно могло пленить любое существо в мире. Но даже в сломанном состоянии, оно по-прежнему способно обременять вас.\n\nКогда уровень здоровья владельца становится равным или ниже <#52B9D8> 60%/40%/20% <RGB> от максимального, он поочередно блокирует слоты для <#52B9D8> артефактов, колец и брони. <RGB> Если уровень здоровья владельца восстанавливается выше до указанного порога, блокировка <#52B9D8> соответствующего слота <RGB> пропадает.
items.props.brokenring.lock =破碎之环禁锢了你的通用装备栏，装备的东西在这里无效。
items.props.brokenring.bound_desc = 此物品被破碎之环束缚，无法发挥任何功效。
items.props.brokenring.ac_release = 卸下以解除束缚
items.props.brokenring.released = 破碎之环的束缚解除了。
items.thanks.brokenringartifactbind.cursed=你好像无法卸下它？可能是被诅咒了……
items.thanks.brokenringarmorbind.cursed=你好像无法卸下它？可能是被诅咒了……
items.thanks.brokenringmiscbind.cursed=你好像无法卸下它？可能是被诅咒了……
items.thanks.brokenringringbind.cursed=你好像无法卸下它？可能是被诅咒了……

items.props.freecrack.name=空间残片
items.props.freecrack.desc=某处被强行撕裂开的空间崩裂出的碎片，似乎并不能借助它的力量…\n\n每<#52B9D8>50回合进行一次本层的随机传送（不会传送到被钥匙门封锁的房间里）<RGB>， 如果主动跨层传送将会在原传送位偏移3层(不会进入新楼层)。\n\n持有时，每次被残片传送都会<#52B9D8>损失8~15%当前生命值<RGB>（保底伤害为1）并获得<#52B9D8>2回合眩晕<RGB>

#### Chaos
items.props.deadoralive.name=решимость смерти
items.props.deadoralive.desc=Смерть находит даже героев: будь то из-за нелепой ошибки или из-за скупости к лечебным зельям, когда жизнь висит на волоске.\n\nУвеличивает <#C42B1C> наносимый и получаемый <RGB> урон владельца на <#C42B1C> +10%. <RGB>

items.props.dreamseed.name=семя грёз
items.props.dreamseed.desc=Я вознес молитву богам, прося светлое будущее.\n\nИ Боги ответили: «Лишь в грёзах можно обрести то что ищешь».\n\nПри первом спуске владельца на новый этаж, создает рядом с лестницей случайным образом <#F1521E> 1 монстра или предмет. <RGB> (Включает экипировку и расходники; исключает уникальные предметы и безделушки; все шансы равны)

items.props.catgirlcosplay.name=косплей костюм кошко-девочки
items.props.catgirlcosplay.desc=_-_ Ты хочешь поиграть со мной? (мяу) Я же тебе говорила, что у меня это плохо получается. (мяу) Если после игры ты скажешь, что я плохо играю, я тебя зарежу! (мяу)\n_-_ Что такое сахарок? (мяу) Думаешь, я сладкий? (мяу) Спасибо, ты тоже очень сладкая! (мяу)\n_-_ Что, у тебя появились другая кошечка! (мяу) Я тебя зарежу! (мяу) Я тебя зарежу! (мяу)\n\nКаждое действие владельца имеет <#E5579A> 3,25% <RGB> шанс издать мяуканье, которое с <#E5579A> 50% <RGB> шансом ослепляет врагов в радиусе 7x7, а всех спящих врагов с <#E5579A> 50% шансом <RGB> пробуждает в этой области, накладывая им адреналин на 1 ход.



items.props.trash.name= мусор (потерявшая силу безделушка)
items.props.trash.trash = Сяое: Похоже, этот вид магии исчерпал себя...

###food
items.food.berry.name=подземельная ягода
items.food.berry.eat_msg=Эта ягода была вкусной!
items.food.berry.desc=Это небольшая ягода, найденная охотницей среди растительности. Ее можно очень быстро съесть, она восполняет небольшое количество сытости, а также может содержать полезное семя!

items.food.blandfruit.name=пустофрукт
items.food.blandfruit.cooked=сваренный пустофрукт
items.food.blandfruit.sunfruit=солнцефрукт
items.food.blandfruit.rotfruit=гнилофрукт
items.food.blandfruit.earthfruit=землефрукт
items.food.blandfruit.blindfruit=бледнофрукт
items.food.blandfruit.firefruit=огнефрукт
items.food.blandfruit.icefruit=хладофрукт
items.food.blandfruit.fadefruit=мыслефрукт
items.food.blandfruit.sorrowfruit=кислофрукт
items.food.blandfruit.stormfruit=грозофрукт
items.food.blandfruit.dreamfruit=магофрукт
items.food.blandfruit.starfruit=звёздофрукт
items.food.blandfruit.swiftfruit=скорофрукт

items.food.blandfruit.halofruit=фосфофрукт
items.food.blandfruit.lightfruit=грозофрукт

items.food.blandfruit.raw=Вы не в силах заставить себя съесть его сырым.
items.food.blandfruit.desc=Не имеет ни вкуса, ни запаха. Может, если его сварить с чем-то ещё, он станет получше?
items.food.blandfruit.desc_cooked=Во время варки в котле этот фрукт разбух и даже впитал в себя некоторые свойства ингредиентов, с которыми был сварен. Он будет обладать свойствами любого зелья, которому соответствовало семя.
items.food.blandfruit.desc_eat=Похоже, теперь его можно есть!
items.food.blandfruit.desc_throw=Похоже, что он может взорваться, если его бросить.
items.food.blandfruit$chunks.name=остатки пустофрукта
items.food.blandfruit$chunks.desc=Пустофрукт лопнул при ударе, развалившись на несколько небольших кусков.\n\nНесмотря на то, что они немного испачканы, они выглядят вполне съедобными.

items.food.chargrilledmeat.name=прожаренное мясо
items.food.chargrilledmeat.desc=Пахнет как неплохой стейк.

items.food.food.name=рацион пищи
items.food.food.ac_eat=СЪЕСТЬ
items.food.food.eat_msg=Эта еда была просто превосходна!
items.food.food.desc=Ничего особенного - вяленое мясо, немного сухариков и всё такое.

items.food.hollow.sugar.name=желейные конфеты
items.food.hollow.sugar.eat_msg=Конфеты сладкие и вкусные, они определенно нравятся юным ведьмочкам!
items.food.hollow.sugar.desc=Эти конфеты очень сладкие, возможно, их тоже любят ведьмочки!
items.food.hollow.sugar.no_love=Ведьмочка все еще кажется неудовлетворенной, возможно, ей нужно больше сладостей, чтобы удовлетворить её аппетит.
items.food.hollow.sugar.love=Ей так понравились ваши сладости, что теперь она будет следовать с вами, чтобы защищать вас!

items.food.hollow.gelatin.name=желатин
items.food.hollow.gelatin.eat_msg=Конфеты сладкие и вкусные, они определенно нравятся юным ведьмочкам!
items.food.hollow.gelatin.desc=Сырье, используемое для производства желейных конфет, которое позволяет готовому продукту придавать форму. \n\nВ крайней необходимости, если вы очень голодны, его можно съесть для снятия усталости, вызванной голодом.

items.food.hollow.sugar_block.name=сахар
items.food.hollow.sugar_block.desc=Сырье, используемое для производства желейных конфет, которое придает готовому продукту сладость и восхитительный вкус. \n\nВ крайней необходимости, если вы очень голодны, его можно съесть для снятия усталости, вызванного голодом.

items.food.hollow.whitesugar_b.name=мальтит
items.food.hollow.whitesugar_b.desc=Сырье, используемое для производства желейных конфет, которое придает готовому продукту жевательную и гладкую текстуру.\n\nВ крайней необходимости, если вы очень голодны, его можно съесть для снятия усталости, вызванного голодом.

items.quest.unlessflower$unlessflowertime.name=божественное вмешательство благословения Юцзи
items.quest.unlessflower$unlessflowertime.desc=每回合将生命减少1，不可回复生命值，负面效果会迅速被抹消。\n\n她给你的花环为你抵挡了这次致命伤害，但是，由于她并不属于这个世界，因此相当于帮你违背了这个世界的规则。你的生命仍然在世界意识中迅速流逝……或许只能再一次_超越生死，才能真正骗过世界，救赎自己_。\n\n降神期间，<#FF0000>所有生命回复都会停止，使用治疗类物品反而会导致中毒！<RGB>

items.quest.unlessflower.name=венок бессмертия
items.quest.unlessflower.desc=看上去是用不知名的花朵与坚韧的藤条编织而成的花环。戴在头上时，你几乎感受不到它的重量。\n\n触发时状态恢复至满，移除负面效果并获得buff：降神）每回合将生命减少1，不可回复生命值，负面效果会迅速被抹消。视为拥有最高一档的幽寂祝福。生命值再次归0时移除。

#//High
items.quest.hollow.allsearchiquest$hollowcityprops.name=статуэтка старинного замка
items.quest.hollow.allsearchiquest$hollowcityprops.desc=Эта миниатюрная скульптура, создана по образцу настоящего старинного замка, она настолько детализирована и точна, что позволяет лучше ознакомится с окружающей местности вашего местоположения.

items.quest.hollow.allsearchiquest$hollowgoldcards.name=золотая карта
items.quest.hollow.allsearchiquest$hollowgoldcards.desc=Это скрытая карта, которая, по легенде, встречается одна на десять тысяч, что делает её ярким свидетельством чего-то бесценного и недоступного.

items.quest.hollow.allsearchiquest$hollowlantern.name=светильник джека
items.quest.hollow.allsearchiquest$hollowlantern.desc=Тыквенный фонарь сияющий как драгоценный камень. Внешняя оболочка холодная и гладкая на ощупь, а сам фонарь удивительно легкий. Трудно догадаться, из какого материала он действительно создан.

#//Moddle Price Items
items.quest.hollow.allsearchiquest$crystalheartchoco.name=шоколадное сердечко
items.quest.hollow.allsearchiquest$crystalheartchoco.desc=Съедобный шоколад, изготовленный по точной копии Кристального сердца - его форма хоть и передается, но не его суть.

items.quest.hollow.allsearchiquest$createworldheartmodel.name=форма сердца Бога-Творца
items.quest.hollow.allsearchiquest$createworldheartmodel.desc=Форма, изготовленная по форме сердца Бога-Творца. Люди едят угощение в форме сердца, чтобы символизировать получение благодати Бога-Творца.

items.quest.hollow.allsearchiquest$ghostbluemodel.name=форма печати с синей гравировкой
items.quest.hollow.allsearchiquest$ghostbluemodel.desc=Форма, имитирующая печать с синей гравировкой. Однажды шайка людей попыталась изготовить поддельные печати, чтобы обмануть торговцев, но в итоге потерпела неудачу.\n\nЭтот коллекционный предмет имеет высокую ценность.

items.quest.hollow.allsearchiquest$greendammodel.name=форма полумесяца с нефритом
items.quest.hollow.allsearchiquest$greendammodel.desc=Форма, изображающая изумруд в форме полумесяца. По сравнению с другими формами, лунные пряники в форме полумесяца более популярны среди людей.

items.quest.hollow.allsearchiquest$greenstingmodel.name=минифигурка лесного духа
items.quest.hollow.allsearchiquest$greenstingmodel.desc=Эта фигурка была изготовлена по образу рассказа путешественника, чудом сбежавшего из подземелья. По иронии судьбы, в дальнейшем он сошёл с ума. Хотя фигурка оказалась популярной среди детей, этот инцидент придает ей страшный и жуткий вид.

#//Low Price Items 低价值物品
items.quest.hollow.allsearchiquest$theater_cards.name=билет в театр
items.quest.hollow.allsearchiquest$theater_cards.desc=Таинственный предмет, который неожиданно появляется рядом с определенными людьми; говорят, что никто из тех, кто принял приглашение, так и не вернулся живым...\n\nВ связи с этим Империи Падкого Хлада выпустила уведомление, в котором говорилось, что все пригласительные билеты должны изъяты и отданы в отдел расследований империи.

items.quest.hollow.allsearchiquest$hollow_sugars.name=хэллоуинские конфеты
items.quest.hollow.allsearchiquest$hollow_sugars.desc=Путешественники, возвратившиеся после исследования старинного замка, часто раздают детям такие сладости. Изначально конфеты принадлежали начинающим ведьмочкам, и, скорее всего, они же их и изготовляют.

items.quest.hollow.allsearchiquest$green_prism.name=изумрудная призма
items.quest.hollow.allsearchiquest$green_prism.desc=Зеленый драгоценный камень, выгравированный в форме призмы, наверняка имеет большую ценность в мире смертных.

items.quest.hollow.allsearchiquest$gnoll_wood.name=резной деревянный гнолл
items.quest.hollow.allsearchiquest$gnoll_wood.desc=В свободное время стража в канализации занимались простым творчеством, создавая фигурки гноллов, и в последствии эти работы, стали популярными на самой поверхности...

items.quest.hollow.allsearchiquest$four_kids.name=печать четырех заветов
items.quest.hollow.allsearchiquest$four_kids.desc=Основополагающие принципы трёх великих империй: баланс благосостояния населения, идеологии, дипломатии и религии. При вступлении в должность каждый чиновник получает данную печать, символизируя важность соблюдения этих принципов.\n\nОднако ныне в этом неспокойном мире больше нет места так называемой концепции миролюбивого мировоззрения, что является одной из причин, по которой эти печати были утеряны и разбросаны.

items.food.frozencarpaccio.name=замороженное мясо
items.food.frozencarpaccio.invis=Вы видите, как ваши руки становятся невидимыми!
items.food.frozencarpaccio.hard=Вы чувствуете, что ваша кожа затвердела!
items.food.frozencarpaccio.refresh=Освежающе!
items.food.frozencarpaccio.better=Вы чувствуете себя лучше!
items.food.frozencarpaccio.desc=Это кусок насквозь промороженного мяса. Его можно есть, только нарезая тонкими ломтиками, как карпаччо. Впрочем, так оно получается на вкус даже лучше, чем обычно.
items.food.frozencarpaccio.descx=Это кусок насквозь промороженного мяса, обладает магической силой. Его можно есть, только нарезая тонкими ломтиками, как карпаччо. Впрочем, так оно получается на вкус даже лучше, чем обычно.

items.food.phantommeat.name=призрачное мясо
items.food.phantommeat.desc=Большой и блестящий полупрозрачный стейк, вырезанный из призрачной пираньи. Это волшебное мясо не нуждается в приготовлении и обладает рядом защитных свойств в дополнение большой питательности. Одного кусочка хватит, чтобы полностью насытить вас, затянуть раны и излечить от вредных эффектов. Кроме того, мясо сделает вас невидимым и наложит эффект дубовой кожи.

items.food.meatpie.name=мясной пирог
items.food.meatpie.eat_msg=Это было чертовски вкусно!
items.food.meatpie.eat_msg_1=+1 сила
items.food.meatpie.eat_msg_2=По вашему телу распространяется новоприобретённая сила.

items.food.meatpie.eat_msg_4=Примечание: на этажах боссов дается только основной бонус от мясного пирога.

items.food.meatpie.eat_msg_3=Получаемая сила от пирога, достигла предела, текущий максимальный предел получения силы на этом этаже: %d.

items.food.meatpie.desc=Аппетитный пирог, полный вкусного мяса. Такое лакомство способно насытить куда лучше любой другой пищи.
items.food.meatpie.descx=Аппетитный пирог, полный вкусного мяса, которое похоже, содержит в себе огромную силу. Такое лакомство насытить куда лучше любой другой пищи.\n\nПри каждом употреблении существует _%s%%_  шанс навсегда получить _+1 к силе_, но этот шанс будет постепенно снижаться по мере увеличения вашей силы.\n\nВ каждом регионе существует ограничение на количество получаемой силы.\n\nТекущий предел силы: _%s/%s_.

items.food.mysterymeat.name=загадочное мясо
items.food.mysterymeat.eat_msg=Эта еда была какой-то странной на вкус.
items.food.mysterymeat.hot=Ой! Горячо!
items.food.mysterymeat.legs=Вы не чувствуете своих ног!
items.food.mysterymeat.not_well=Вы чувствуете себя не очень хорошо.
items.food.mysterymeat.stuffed=Вы наелись.
items.food.mysterymeat.desc=Ешьте на свой страх и риск!
items.food.mysterymeat$placeholder.name=мясо

items.food.pasty.pasty=пирог
items.food.pasty.pie=тыквенный пирог
items.food.pasty.cane=новогодний леденец
items.food.pasty.pasty_desc=Настоящий корнуэльский пирог с начинкой из говядины и картофеля. Восхитительно!
items.food.pasty.pie_desc=Здоровенный кусок тыквенного пирога! Его сладкий и пряный вкус способен не только полностью утолить голод, но и восстановить немного здоровья.\n\nСчастливого Дня Всех Святых!
items.food.pasty.cane_desc=Огромная сладкая карамельная трость! Она достаточно большая для того, чтобы полностью утолить голод, а избыток сахара может ещё и добавить энергии для ваших волшебных палочек.\n\nС праздником!

items.food.smallration.name=урезанный рацион
items.food.smallration.eat_msg=На вкус так себе.
items.food.smallration.desc=Он выглядит как обычный рацион, но поменьше.
items.food.smallration.descx=Он выглядит иначе, чем обычный рацион, но побольше.

items.food.smallration$blackmoon.name=маленький лунный пирог
items.food.smallration$blackmoon.desc=Этот маленький лунный пирог, похоже, настолько плохо выпекли, что даже одна сторона обуглилась, а на самом тесте криво написаны несколько слов, которые невозможно разобрать. \n\nДаже не понятно, что в нем внутри...\n\nНачинка чем-то напоминает затвердевшее карри и пахнет немного странно, но вполне, должен быть съедобным.
items.food.smallration$blackmoon.eat_msg=Удивительно, начинка по вкусу напоминает печеный картофель и весьма вкусная.

items.food.stewedmeat.name=тушёное мясо
items.food.stewedmeat.eat_msg=На вкус так себе.
items.food.stewedmeat.desc=Тушёное мясо очищено от любой инфекции и паразитов. Его можно спокойно есть.


##journal items
items.journal.documentpage.name=вырванная страница
items.journal.documentpage.desc=Эту страницу, кажется, вырвали из какой-то книги. Чтобы разобрать, что на ней написано, придётся её подобрать.

items.journal.alchemypage.name=вырванная страница учебника алхимии
items.journal.alchemypage.desc=Вырванная страница из учебника алхимии.\n\nБольшая часть текста слишком мелкая, чтобы прочесть её издалека, но можно вполне разглядеть заголовок:\n\n_"%s"_

items.journal.guidebook.name=альманах путешественника
items.journal.guidebook.hint=В вашем путеводителе есть советы для вас!
items.journal.guidebook.desc=Путеводитель путешественника, забытый тут кем-то, кто решил, что приключения - не его удел. Эта конкретная книга - магическая, она может обратить внимание путешественника на определенную страницу в нужное время.\n\nКнига крайне популярна не только лишь из-за её содержания, но и из-за красиво выведенной надписи "Не паникуй!" на обложке.

items.journal.guidepage.name=вырванная страница справочника
items.journal.guidepage.desc=Вырванная страница из справочника путешественника.\n\nБольшая часть текста слишком мелкая, чтобы прочесть её издалека, но можно вполне разглядеть заголовок:\n\n_"%s"_


###keys

items.keys.key.locksword=Вы чувствуете, как ключ-меч становится еще могущественнее когда поглощает оставшуюся магию ключа.

items.keys.goldenkey.name=золотой ключ
items.keys.goldenkey.desc=У этого ключа очень маленькая и изящная бородка. Возможно, это ключ от какого-то сундука?

items.keys.crystalkey.name=Хрустальный ключ
items.keys.crystalkey.desc=Вырезанные из цельного куска хрусталя, изгибы этого ключа мерцают в темноте. Может, он откроет что-то сделанное из хрусталя?

items.keys.ironkey.name=железный ключ
items.keys.ironkey.desc=Бородка этого ключа уже изношена, а кожаный ремешок очень старый. Интересно, какую дверь им можно открыть?

items.keys.skeletonkey.name=ключ-скелет
items.keys.skeletonkey.desc=Этот ключ выглядит весьма внушительно - его навершие сделано в форме черепа. Возможно, им можно открыть столь же внушительную дверь.



###potions
###potions
items.potions.potion.ac_drink=ВЫПИТЬ
items.potions.potion.turquoise=бирюзовое зелье
items.potions.potion.crimson=багряное зелье
items.potions.potion.azure=лазурное зелье
items.potions.potion.jade=зелёное зелье
items.potions.potion.golden=золотистое зелье
items.potions.potion.magenta=пурпурное зелье
items.potions.potion.charcoal=серое зелье
items.potions.potion.ivory=белёсое зелье
items.potions.potion.skyblue=лазурное зелье
items.potions.potion.deepyellow=жёлтое зелье
items.potions.potion.amber=янтарное зелье
items.potions.potion.bistre=коричневое зелье
items.potions.potion.indigo=фиолетовое зелье
items.potions.potion.silver=серебристое зелье
items.potions.potion.unknown_desc=Этот пузырёк содержит какое-то зелье. Интересно, что будет, если его выпить или разбить?
items.potions.potion.harmful=Вредное зелье!
items.potions.potion.beneficial=Полезное зелье
items.potions.potion.yes=Да, все правильно
items.potions.potion.no=Нет, я передумал
items.potions.potion.sure_drink=Вы уверены, что хотите выпить это зелье? Возможно, стоит кинуть им в кого-нибудь другого.
items.potions.potion.sure_throw=Вы уверены, что хотите бросить это зелье? Возможно, его лучше выпить.
items.potions.potion.shatter=Бутыль разлетается на мелкие осколки, а её содержимое безо всякого эффекта растекается по полу.
items.potions.potion$placeholder.name=зелье
items.potions.potion$seedtopotion.name=Случайное Зелье

items.potions.alchemicalcatalyst.name=алхимический катализатор
items.potions.alchemicalcatalyst.desc=Магическая жидкость в этом тонком сосуде сделана из очищенной эссенции зелья. Она прозрачна и переливается всеми цветами радуги. \n\nЭтот катализатор в основном используется как алхимический ингредиент, но если его выпить или бросить, то он сработает как случайное зелье.

items.potions.potionofexperience.name=зелье Опыта
items.potions.potionofexperience.desc=Это зелье содержит концентрированный опыт множества сражений. Если его выпить, ваш уровень будет немедленно повышен.
items.potions.potionofexperience.descx=Это зелье содержит концентрированную злобу множества сражений. Если его выпить, ваша жизненная энергия будет высосана на некоторое время.

items.potions.potionoffrost.name=зелье Холода
items.potions.potionoffrost.desc=При контакте с воздухом этот химикат мгновенно испаряется, замораживая всех, кто попал в облако его паров.

items.potions.potionofhaste.name=зелье Ускорения
items.potions.potionofhaste.namex=зелье Замедления
items.potions.potionofhaste.energetic=Вы чувствуете прилив энергии!
items.potions.potionofhaste.energy_speed=Вы чувствуете, как из вас вытягивается энергия!
items.potions.potionofhaste.desc=Глоток этой удивительно сладкой жидкости наполнит вас огромной энергией, ненадолго позволив перемещаться гораздо быстрее.
items.potions.potionofhaste.descx=Глоток этой жутко горькой жидкости наполнит вас огромными колючками, ненадолго покалечив ваше тело.\n\nЕсли на текущем этаже есть красный часовой, он будет действовать намного быстрее.

items.potions.potionofhealing.name=зелье Исцеления
items.potions.potionofhealing.heal=Ваши раны начинают заживать.
items.potions.potionofhealing.desc=Этот эликсир стремительно заживляет любые раны и моментально исцеляет многие недуги.

items.potions.potionofinvisibility.name=зелье Невидимости
items.potions.potionofinvisibility.namex=зелье Провокации
items.potions.potionofinvisibility.invisible=Вы видите, как ваши руки становятся невидимыми!
items.potions.potionofinvisibility.notinvisible=Вы не можете стать невидимым!
items.potions.potionofinvisibility.descx=Выпив это зелье, вы не сможете стать невидимы для противников. Но от вкуса зелья заревете, привлекая внимание врагов.
items.potions.potionofinvisibility.desc=Выпив это зелье, вы станете совершенно невидимы для противников на какое-то время. Впрочем, если вы попробуете кого-то атаковать или использовать палочку или свиток на глазах у противника, невидимость рассеется.

items.potions.potionoflevitation.name=зелье Левитации
items.potions.potionoflevitation.float=Вы взмываете в воздух!
items.potions.potionoflevitation.desc=Если выпить этот занятный состав, то некоторое время вы будете парить в воздухе и сможете пересечь пропасть или перелететь через ловушку.\n\nЕсли бросить это зелье, оно создаст облако неочищенного газа, дезориентирующего любого, кто в него попадёт.

items.potions.potionofliquidflame.name=зелье Алхимического огня
items.potions.potionofliquidflame.desc=Этот сосуд содержит нестабильный реактив, который при малейшем контакте с воздухом резко загорается, поджигая всё вокруг.

items.potions.potionofmindvision.name=зелье Ментального зрения
items.potions.potionofmindvision.namex=зелье Ментальной слепоты
items.potions.potionofmindvision.see_mobs=Вы каким-то образом можете чувствовать присутствие других существ!
items.potions.potionofmindvision.see_none=Вы каким-то образом понимаете, что на этом уровне подземелья нет никого, кроме вас.
items.potions.potionofmindvision.desc=Глоток этого зелья помогает настроить ваш разум на психические частоты других существ, позволяя вам определять местоположение других существ сквозь любые препятствия.\n\nТакже в этом состоянии вы можете видеть сквозь ближайшие стены и двери.
items.potions.potionofmindvision.descx=Глоток этого зелья помешает настроить ваш разум на психические частоты других существ, не позволяя вам определять местоположение других существ сквозь любые препятствия.
items.potions.potionofmindvision.no_eye=Вы не можете почувствовать присутствие других существ!
items.potions.potionofmindvision.can't_see_mobs=Вы не можете почувствовать присутствие других существ!
items.potions.potionofmindvision.can't_see_none=Вы не можете определить, кто находится прямо сейчас на этом уровне.


items.potions.potionofparalyticgas.name=зелье Парализующего газа
items.potions.potionofparalyticgas.desc=При контакте с открытым воздухом жидкость в этой бутыли испарится, превращаясь в обездвиживающий жёлтый газ. Любой, кто вдохнёт его, будет мгновенно парализован, теряя возможность сопротивляться до тех пор, пока облако не развеется.\n\nЭто зелье лучше кидать во врагов, находящихся на расстоянии.

items.potions.potionofpurity.name=зелье Очищения
items.potions.potionofpurity.freshness=Вы чувствуете, что на вас неожиданно пахнуло свежим воздухом.
items.potions.potionofpurity.protected=Некое подобие защитной пленки обволакивает вас!
items.potions.potionofpurity.desc=Этот магический реагент способен моментально нейтрализовать все вредоносные газы в большой зоне. Выпив его, вы получите временный иммунитет к газам любого рода.

items.potions.potionofstrength.name=зелье Силы
items.potions.potionofstrength.namex=зелье Слабости
items.potions.potionofstrength.msg_1=+1 сила
items.potions.potionofstrength.msg_2=По вашему телу распространяется новоприобретённая сила.
items.potions.potionofstrength.esg_1=-1 сила, +3 точности
items.potions.potionofstrength.esg_2=Едкая жидкость проникает в ваши мышцы, делая их слабее, но при этом более энергичными...
items.potions.potionofstrength.desc=Это редкое зелье влияет на мускулатуру всего вашего тела, навсегда увеличивая вашу силу на единицу.
items.potions.potionofstrength.descx=Это редкое зелье влияет на мускулатуру всего вашего тела, навсегда уменьшая вашу силу на единицу. Однако вы можете тренировать свое тело от токсичности, навсегда увеличивая вашу точность на три единицы.

items.potions.potionoftoxicgas.name=зелье Токсического газа
items.potions.potionoftoxicgas.desc=Разбивание или раскупоривание этого герметичного флакона заставит его содержимое взорваться смертоносным облаком отравляющего газа. Возможно, лучше бросить это зелье в кого-то, находящегося на расстоянии, а не открывать его самому.

items.potions.brews.unstablebrew.name=нестабильный экстракт
items.potions.brews.unstablebrew.desc=Этот волшебный напиток переливается цветами радуги.\n\nКогда его выпьют или бросят, он активирует эффект случайного зелья. Эффект зелья, скорее всего, будет соответствовать эффекту экстракта.



###brews
items.potions.brews.aquabrew.name=экстракт Водянистости
items.potions.brews.aquabrew.desc=Если его разбить, то этот экстракт высвободит водный всплеск в точке приземления. Оно достаточно мощное, чтобы нанести урон огненным существам, но оно также затопит местность вокруг, потушит пламя и откинет врагов, которые оказались рядом со всплеском.
items.potions.brews.aquabrew.salt=Если цель находится на грязи, первоначальный эффект не подействует на это место, но заставит воду испариться по всей местности в радиусе 3x3 и превратит все клетки в обычные, а также на некоторое время воспламеняет свое окружение.

items.potions.brews.causticbrew.name=экстракт Едкой слизи
items.potions.brews.causticbrew.desc=Если разбить этот экстракт, то он покроет всех вокруг чрезвычайно едкой кислотой. Кислота будет наносить урон всем, кто попадёт под неё, пока её не смоют водой.

items.potions.brews.blizzardbrew.name=экстракт Снежного вихря
items.potions.brews.blizzardbrew.desc=Если его разбить, то этот экстракт выпустит на свободу вихрь замораживающей пурги, который будет быстро распространяться подобно газам.

items.potions.brews.infernalbrew.name=экстракт Адского пламени
items.potions.brews.infernalbrew.desc=Если его разбить, то этот экстракт выпустит на свободу бушующее адское пламя, которое будет быстро распространяться подобно газам.

items.potions.brews.shockingbrew.name=экстракт Грозового облака
items.potions.brews.shockingbrew.desc=Если его разбить, то этот экстракт выпустит на свободу электрический шторм на большом пространстве вокруг того места, где был разбит экстракт.



###elixirs
items.potions.elixirs.elixirofarcanearmor.name=эликсир Мистической брони
items.potions.elixirs.elixirofarcanearmor.desc=Данный эликсир дарует выпившему длительное сопротивление магическому урону.

items.potions.elixirs.elixirofaquaticrejuvenation.name=эликсир Водной регенерации
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Этот эликсир содержит в себе остатки Слизня, смешанные с лечебным зельем. Вместо моментального исцеления он дарует выпившему его способность восстанавливать здоровье при соприкосновении с водой.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=водная регенерация
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Вы временно получили способности Слизня к регенерации.\n\nНаходясь в воде, вы восстанавливаете небольшое количество здоровья каждый ход. Эффект приостанавливается, когда у вас полное здоровье или вы находитесь вне воды.\n\nЛечения осталось: %d.

items.potions.elixirs.elixirofdragonsblood.name=эликсир Крови дракона
items.potions.elixirs.elixirofdragonsblood.desc=Будучи выпитым, эликсир наделит героя силой огня, протекающей по его венам. Этот эффект подарит ему иммунитет к огню и позволит поджигать врагов своими ударами.

items.potions.elixirs.elixiroffeatherfall.name=эликсир Антигравитации
items.potions.elixirs.elixiroffeatherfall.light=Вы чувствуете себя легким, как пёрышко!
items.potions.elixirs.elixiroffeatherfall.desc=Этот эликсир дарует частичный контроль над гравитацией, позволяя выпившему его падать в пропасти без риска для здоровья. Времени действия эликсира хватает только на одно применение.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=антигравитация
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Вы под эффектом эликсира Антигравитации, который позволяет вам падать в пропасти и не получить урон! Эффект пропадет, когда оно будет использовано, или по истечению времени.\n\nОсталось ходов: %s.


items.potions.elixirs.elixirofhoneyedhealing.name=эликсир Медового исцеления
items.potions.elixirs.elixirofhoneyedhealing.desc=Этот эликсир не только исцеляет раны, но ещё и очень сладкий! Он немного утоляет голод, если его выпить. Но можно и бросить его в союзника, чтобы вылечить его раны.\n\nС помощью этого эликсира можно укротить тех существ, которые любят мёд.

items.potions.elixirs.elixiroficytouch.name=эликсир Ледяного касания
items.potions.elixirs.elixiroficytouch.desc=Тот, кто выпьет такой эликсир, сможет высасывать тепло из врагов одним своим прикосновением. Это даст полный иммунитет к холоду, а также позволит накладывать окоченение своими физическими атаками.

items.potions.elixirs.elixirofmight.name=эликсир Могущества
items.potions.elixirs.elixirofmight.msg_1=+1 сила, +%d ОЗ
items.potions.elixirs.elixirofmight.msg_2=По вашему телу распространяется новоприобретённая сила.
items.potions.elixirs.elixirofmight.desc=Это мощное зелье растечётся по вашим мышцам, навсегда увеличив вашу силу на одно очко и здоровье на %d очков. Бонус к здоровью зависит зависит от вашего максимального здоровья, но при получении уровней будет постепенно спадать.
items.potions.elixirs.elixirofmight$htboost.name=увеличение запаса здоровья
items.potions.elixirs.elixirofmight$htboost.desc=Вы чувствуете непривычную силу и живучесть.\n\nВаше максимальное здоровье увеличено на долгое время. Когда вы получаете уровни, этот бонус будет понемногу снижаться.\n\nУвеличение жизни на данный момент: %d.\nУровней осталось: %d.
items.potions.elixirs.elixirofmight.msg=По вашему телу распространяется новоприобретённая сила, теперь у вас %d силы!



items.potions.elixirs.elixiroftoxicessence.name=эликсир Зловония
items.potions.elixirs.elixiroftoxicessence.desc=Этот эликсир дарует выпившему токсическую силу. Испивший будет источать токсичный газ, а так же будет невосприимчив к отравлению и токсичному газу даже чуть дольше, чем длится эффект.

###exotic potions
items.potions.exotic.exoticpotion.turquoise=особое бирюзовое зелье
items.potions.exotic.exoticpotion.crimson=особое багряное зелье
items.potions.exotic.exoticpotion.azure=особое лазурное зелье
items.potions.exotic.exoticpotion.jade=особое зелёное зелье
items.potions.exotic.exoticpotion.golden=особое золотистое зелье
items.potions.exotic.exoticpotion.magenta=особое пурпурное зелье
items.potions.exotic.exoticpotion.charcoal=особое серое зелье
items.potions.exotic.exoticpotion.ivory=особое белёсое зелье
items.potions.exotic.exoticpotion.amber=особое янтарное зелье
items.potions.exotic.exoticpotion.bistre=особое коричневое зелье
items.potions.exotic.exoticpotion.indigo=особое фиолетовое зелье
items.potions.exotic.exoticpotion.silver=особое серебристое зелье
items.potions.exotic.exoticpotion.unknown_desc=Этот округлый пузырёк содержит странную разноцветную жидкость, совсем не похожую на обычные зелья. Интересно, что будет, если его выпить или разбить?
items.potions.exotic.exoticpotion.warning=Вы действительно хотите отменить использование этого зелья? Оно все равно будет истрачено.
items.potions.exotic.exoticpotion.yes=Да, я уверен
items.potions.exotic.exoticpotion.no=Нет, я передумал

items.potions.exotic.potionofcleansing.name=зелье Избавления
items.potions.exotic.potionofcleansing.desc=Этот мощный реагент способен полностью нейтрализовать любые вредные воздействия. Его можно применять как внутрь, так и просто в кого-нибудь бросить.
items.potions.exotic.potionofcleansing$cleanse.name=очищенные
items.potions.exotic.potionofcleansing$cleanse.desc=Этот персонаж имеет временный иммунитет против любых вредных эффектов!\n\nХодов осталось: %s.

items.potions.exotic.potionofcorrosivegas.name=зелье Коррозийного газа
items.potions.exotic.potionofcorrosivegas.desc=Бросок или откупоривание этой находящейся под давлением бутыли спровоцирует формирование из содержимого облака едкого газа цвета ржавчины. Его концентрация, однако, будет невысока и облако не слишком долго продержится.

items.potions.exotic.potionofdragonsbreath.name=зелье Драконьего дыхания
items.potions.exotic.potionofdragonsbreath.prompt=Выберите цель
items.potions.exotic.potionofdragonsbreath.desc=Этот пузырёк содержит необычный реактив, который мгновенно воспламеняется при смешении со слюной. Вовремя выплюнув жидкость, вы сможете выпускать пламя изо рта!

items.potions.exotic.potionofearthenarmor.name=зелье Природной брони
items.potions.exotic.potionofearthenarmor.desc=Вместо того, чтобы парализовать, эта жидкость заставляет кожу затвердеть, что временно наделит вас природной бронёй.

items.potions.exotic.potionofdivineinspiration.name=зелье Небесного вдохновения
items.potions.exotic.potionofdivineinspiration.no_more_points=Вы не можете получить больше бонусных очков таланта.
items.potions.exotic.potionofdivineinspiration.select_tier=Выберите уровень талантов к которому будут добавлены два очка. Уровень должен быть открытым.
items.potions.exotic.potionofdivineinspiration.bonus=+2 очка талантов!
items.potions.exotic.potionofdivineinspiration.desc=Будучи святой энергией в жидкой форме, это зелье наделит выпившего двумя дополнительным очками талантов того уровня, который он выберет.\n\nЭто зелье может быть использовано единожды для каждого уровня талантов.

items.potions.exotic.potionofmagicalsight.name=зелье Волшебного взора
items.potions.exotic.potionofmagicalsight.desc=После того, как вы это выпьете, ваши чувства ненадолго обострятся до невероятного уровня, увеличивая дальность обзора и позволяя видеть сквозь стены!

items.potions.exotic.potionofmastery.name=зелье Мастерства
items.potions.exotic.potionofmastery.prompt=Освоить предмет
items.potions.exotic.potionofmastery.weapon_easier=Вашим оружием стало проще пользоваться!
items.potions.exotic.potionofmastery.armor_easier=Ваша броня становится легче!
items.potions.exotic.potionofmastery.desc=Вместо того, чтобы увеличивать силу, это зелье настраивает мышцы на определенный предмет. Это упростит использование этого предмета, как если бы пьющий практиковался с ним и развил мышечную память.\n\nДля использования выбранного оружия или доспехов потребуется на 2 единицы силы меньше. Это зелье можно использовать только один раз для каждого предмета.

items.potions.exotic.potionofshielding.name=зелье Защиты
items.potions.exotic.potionofshielding.desc=Вместо того, чтобы исцелять, это зелье создаёт волшебный барьер вокруг выпившего. Этот барьер может поглотить значительное количество повреждений.

items.potions.exotic.potionofshroudingfog.name=зелье Густого тумана
items.potions.exotic.potionofshroudingfog.desc=При контакте с воздухом жидкость в этом пузырьке превратится в густой клубящийся туман, полностью блокирующий обзор.

items.potions.exotic.potionofsnapfreeze.name=зелье Заморозки
items.potions.exotic.potionofsnapfreeze.desc=Химикаты в этом зелье моментально реагируют с воздухом, мгновенно замораживая и обездвиживая всех вокруг.

items.potions.exotic.potionofstamina.name=зелье Выносливости
items.potions.exotic.potionofstamina.desc=Глоток этой странно сладковатой жидкости дарует длительный прилив энергии, надолго увеличивая скорость перемещения.

items.potions.exotic.potionofstormclouds.name=зелье Грозовых туч
items.potions.exotic.potionofstormclouds.desc=Если бросить это зелье, оно образует быстро распространяющееся облако концентрированного пара, конденсат которого опустится на окрестности. Большая часть местности будет затоплена, огненные существа получат урон, пламя потушится, а ловушки выйдут из строя и сломаются.



###quest items
items.quest.ceremonialcandle.name=ритуальная свеча
items.quest.ceremonialcandle.desc=Несколько свеч, слепившихся в одну из-за использования.\n\nСами по себе они бесполезны, но если использовать их в определенной последовательности, они способны сконцентрировать энергию, необходимую для ритуала призыва.

items.quest.corpsedust.name=прах мертвеца
items.quest.corpsedust.chill=Холодок пробегает по вашей спине.
items.quest.corpsedust.desc=Эта кучка праха не сильно отличается от любой другой в этом подземелье, но вы чувствуете таящуюся в ней темную энергию.\n\nПожалуй, лучше от неё избавиться, да как можно скорее.

items.quest.darkgold.name=руда тёмного золота
items.quest.darkgold.you_now_have=Теперь у вас есть %d руды тёмного золота.
items.quest.darkgold.desc=Этот металл называется темным не из-за его цвета (который не отличается от обычного золота), а из-за того, что при воздействии солнечного света он плавится.\n\nДумаю, не стоит говорить, что темное золото не очень-то ценится городскими жителями.

items.quest.dwarftoken.name=дворфский жетон
items.quest.dwarftoken.desc=По неизвестным причинам многие дворфы и некоторые из их творений носят с собой эти маленькие кусочки металла. Может быть, это какие-то украшения или опознавательные символы... Кто их поймет, этих бородатых.

items.quest.embers.name=пепел элементаля
items.quest.embers.desc=Особый вид пепла, который можно получить только с молодых огненных элементалей. Даже сейчас он излучает тепло.

items.quest.gooblob.name=сгусток слизи
items.quest.gooblob.desc=Желеобразный комочек, оставшийся после Слизня. Похоже на большой желейный шарик, но вы бы не рискнули попробовать его на вкус.\n\nСам по себе он бесполезен, но может проявить свои свойства в комбинации с зельем или бомбой. В крайнем случае, его можно просто продать или конвертировать в энергетические кристаллы.

items.quest.metalshard.name=проклятый осколок
items.quest.metalshard.desc=Ржавый осколок проклятого металла - это всё, что осталось от DM-300. Вы чувствуете в нём скрытую тёмную магию.\n\nСам по себе он бесполезен, но может проявить свои свойства в сочетании с бомбой или свитком. В крайнем случае, его можно просто продать или конвертировать в энергетические кристаллы.

items.quest.pickaxe.name=кирка
items.quest.pickaxe.ac_mine=ДОБЫТЬ
items.quest.pickaxe.no_vein=Рядом нет жил тёмного золота.
items.quest.pickaxe.ability_name=пробить
items.quest.pickaxe.ability_desc=Дуэлянт может _пробить_ врага киркой. Это гарантирует попадание, добавляет уязвимость на 3 хода и наносит в 2 раза больше урона врагам с жёсткой кожей.
items.quest.pickaxe.desc=Это прочный и тяжелый инструмент для дробления камней. Вам не нужно экипировать кирку, чтобы добывать при помощи неё, а в крайнем случае её можно использовать как оружие.


items.quest.ratskull.name=череп гигантской крысы
items.quest.ratskull.desc=Удивительно огромный крысиный череп. Из него вышел бы неплохой трофей, если бы вам было куда его вешать.



###rings
items.rings.ring.garnet=кольцо с гранатом
items.rings.ring.ruby=кольцо с рубином
items.rings.ring.topaz=кольцо с топазом
items.rings.ring.emerald=кольцо с изумрудом

items.rings.ring.onyx=кольцо с ониксом
items.rings.ring.opal=кольцо с опалом
items.rings.ring.tourmaline=кольцо с турмалином
items.rings.ring.sapphire=кольцо с сапфиром

#items.rings.ring.amethyst=紫水晶戒指
#items.rings.ring.quartz=石英戒指

items.rings.ring.agate=绿松石戒指
items.rings.ring.diamond=琥珀戒指

items.rings.ring.equip_cursed=Кольцо болезненно сжимает ваш палец!
items.rings.ring.unknown_desc=Эта круглая полоска металла украшена сверкающим драгоценным камнем. Кто знает, что будет, если её надеть?
items.rings.ring.known=Это %s
items.rings.ring.identify=Вы достаточно долго знакомы с кольцом, чтобы опознать его.
items.rings.ring.cursed_worn=Ваше кольцо проклято, вы не в силах его снять.
items.rings.ring.curse_known=Вы чувствуете, что это кольцо скрывает в себе какую-то темную магию.
items.rings.ring.not_cursed=Это кольцо не проклято.

items.rings.selectablering.name = таинственное кольцо
items.rings.selectablering.desc = Вы чувствуете, что это кольцо источает особую магию, и похоже, в ваших руках оно способно превратится другое случайное кольцо.
items.rings.selectablering.ac_spawn = ПРЕВРАТИТЬ
items.rings.selectablering$ringsetting.create = Превратить
items.rings.selectablering$ringsetting.cancel = Отменить

items.rings.ringofaccuracy.name=кольцо меткости
items.rings.ringofaccuracy.stats=Пока это кольцо надето, оно будет увеличивать точность на _%s%%._
items.rings.ringofaccuracy.typical_stats=Пока это кольцо надето, оно должно будет увеличивать точность на _%s%%._
items.rings.ringofaccuracy.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают точность на _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Усиление точности
items.rings.ringofaccuracy.desc=Это кольцо повышает вашу сосредоточенность, снижая шансы врагов уклониться от атаки. Проклятое кольцо, напротив, будут увеличивать шанс промахнуться.

items.rings.ringofarcana.name=кольцо волшебства
items.rings.ringofarcana.stats=Пока это кольцо надето, оно будет увеличивать силу зачарований и рун на _%s %%._
items.rings.ringofarcana.typical_stats=Пока это кольцо надето, оно обычно увеличивает силу зачарований и рун на _%s%%._
items.rings.ringofarcana.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают силу зачарований и рун на _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Усиление волшебства
items.rings.ringofarcana.desc=Это кольцо усиливает магические зачарования на оружии и руны на броне, включая проклятия! Сначала это увеличивает шанс активации, а затем увеличивает силу эффекта, как только шанс активации достигает 100%. Вместо этого проклятое кольцо ослабит зачарования, руны и проклятия.

items.rings.ringofelements.name=кольцо стихий
items.rings.ringofelements.stats=Пока это кольцо надето, оно будет давать _%s%%_ защиты от стихий.
items.rings.ringofelements.typical_stats=Пока это кольцо надето, оно должно будет давать _%s%%_ защиты от стихий.
items.rings.ringofelements.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе дают _%s%%_ защиты от стихий.
items.rings.ringofelements.upgrade_stat_name_1=Сопротивление
items.rings.ringofelements.desc=Это кольцо обеспечивает сопротивление большинству стихийных и магических эффектов, уменьшая урон и длительность дебаффов. Естественно, проклятое кольцо вместо этого усилит силу негативных эффектов.

items.rings.ringofenergy.name=кольцо энергии
items.rings.ringofenergy.stats=При ношении это кольцо увеличит скорость заряда палочек, артефактов и героической брони на _%s%%._
items.rings.ringofenergy.typical_stats=При ношении это кольцо обычно увеличивает скорость заряда палочек, артефактов и героической брони на _%s%%._
items.rings.ringofenergy.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают скорость зарядов на _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Усиление зарядки
items.rings.ringofenergy.desc=Ваше магическое снаряжение будет быстрее заряжаться в магическом поле, излучаемом этим кольцом. Вместо этого проклятое кольцо замедлит перезарядку.

items.rings.ringofevasion.name=кольцо уклонения
items.rings.ringofevasion.stats=Пока это кольцо надето, оно будет увеличивать ваш шанс увернуться на _%s%%._
items.rings.ringofevasion.typical_stats=Пока это кольцо надето, оно должно будет увеличивать ваш шанс увернуться на _%s%%._
items.rings.ringofevasion.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают ваш шанс увернуться на _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Усиление уклонения
items.rings.ringofevasion.desc=Это кольцо ускоряет реакцию владельца, и по нему становится сложнее попасть. Проклятое кольцо, наоборот, понижает шанс увернуться.

items.rings.ringofforce.name=кольцо урона
items.rings.ringofforce.stats=При вашей текущей силе, если вы безоружны, это кольцо будет наносить _%1$d-%2$d урона,_ а если вы вооружены, урон вашого оружия увеличится на _%3$d._
items.rings.ringofforce.typical_stats=При вашей текущей силе, если вы безоружны, это кольцо должно будет наносить _%1$d-%2$d урона,_ а если вы вооружены, урон вашого оружия должен увеличится на _%3$d._
items.rings.ringofforce.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе будут наносить _%1$d-%2$d урона_ если вы безоружны или увеличат урон на _%3$d_ если вы вооружены.
items.rings.ringofforce.upgrade_stat_name_1=Безоружный урон
items.rings.ringofforce.upgrade_stat_name_2=Усиление урона оружием
items.rings.ringofforce.upgrade_stat_name_3=Урон способности
items.rings.ringofforce.ability_name=боевая стойка
items.rings.ringofforce.typical_ability_desc=Дуэлянт может встать в _боевую стойку_ при помощи кольца урона. Пока Дуэлянт находится в стойке, её атаки будут использовать кольцо урона, даже с экипированным оружием. Эти атаки обычно наносят _%1$d-%2$d урона_, а так же перенимают эффект камня баланса и зачарование оружия. Стойка замедляет восстановление зарядов оружия на 50%%.
items.rings.ringofforce.ability_desc=Дуэлянт может встать в _боевую стойку_ при помощи кольца урона. Пока Дуэлянт находится в стойке, её атаки будут использовать кольцо урона, даже с экипированным оружием. Эти атаки наносят _%1$d-%2$d урона_, а так же перенимают эффект камня баланса и зачарование оружия. Стойка замедляет восстановление зарядов оружия на 50%%.
items.rings.ringofforce.desc=Это кольцо увеличивает силу ударов владельца. Эффект не так значителен при использовании оружия, но при атаке голыми руками вы будете наносить значительно больший урон. Проклятое же кольцо, напротив, ослабит удары.
items.rings.ringofforce$brawlersstance.name=боевая стойка
items.rings.ringofforce$brawlersstance.desc=Находясь в стойке, обычные атаки Дуэлянта будут использовать экипированное Кольцо Урона даже если у неё экипировано оружие. Атаки получат дополнительный урон и будут подвержены эффектам Камня Баланса и зачарованиям оружия.\n\nПоддержание стойки помогает сфокусироваться, но уменьшает скорость перезарядки зарядов оружия на 50%.\n\nМожно встать и выйти из стойки используя Кольцо Урона, но уменьшение скорости перезарядки будет наложено даже если стойка была быстро активирована и деактивирована.

items.rings.ringoffuror.name=кольцо неистовства
items.rings.ringoffuror.stats=Пока это кольцо надето, оно будет увеличивать скорость ваших атак на _%s%%._
items.rings.ringoffuror.typical_stats=Пока это кольцо надето, оно должно будет увеличивать скорость ваших атак на _%s%%._
items.rings.ringoffuror.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают скорость ваших атак на _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Усиление скорости атаки
items.rings.ringoffuror.desc=Это кольцо порождает во владельце ярость, позволяя ему наносить удары быстрее, чем обычно. Проклятое же кольцо, напротив, будет замедлять атаки.

items.rings.ringofhaste.name=кольцо ускорения
items.rings.ringofhaste.stats=Пока это кольцо надето, оно будет увеличивать скорость передвижения на _%s%%._
items.rings.ringofhaste.typical_stats=Пока это кольцо надето, оно должно будет увеличивать скорость передвижения на _%s%%._
items.rings.ringofhaste.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают скорость передвижения на _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Усиление скорости передвижения
items.rings.ringofhaste.desc=Это кольцо снижает утомление от бега и даёт владельцу способность перемещаться быстрее человеческих возможностей. Проклятое же кольцо, напротив, уменьшает скорость передвижения.

items.rings.ringofmight.name=кольцо мощи
items.rings.ringofmight.stats=Пока это кольцо надето, оно будет увеличивать вашу силу на _%1$d_ и максимальное количество здоровья на _%2$s%%._
items.rings.ringofmight.typical_stats=Пока это кольцо надето, оно должно будет увеличивать вашу силу на _%1$d_ и максимальное количество здоровья на _%2$s%%._
items.rings.ringofmight.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают вашу силу на _%1$d_ и максимальное количество здоровья на _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=Усиление силы
items.rings.ringofmight.upgrade_stat_name_2=Усиление макс. ОЗ
items.rings.ringofmight.desc=Это кольцо улучшает физические параметры своего владельца, даруя ему повышенную силу и выносливость. Проклятое же кольцо, напротив, снижает силу и здоровье владельца.

items.rings.ringofsharpshooting.name=кольцо стрельбы
items.rings.ringofsharpshooting.stats=Пока это кольцо надето, оно будет увеличивать урон от ваших метательных оружий настолько, будто их уровень увеличен на _%1$d_, и их прочность будет увеличена на _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Пока это кольцо надето, оно должно будет увеличивать урон от ваших метательных оружий настолько, будто их уровень увеличен на _%1$d_, и их прочность будет увеличена на _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают урон от ваших метательных оружий настолько, будто их уровень увеличен на _%1$d_, и их прочность будет увеличена на _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Усиление урона от уровня
items.rings.ringofsharpshooting.upgrade_stat_name_2=Усиление прочности
items.rings.ringofsharpshooting.desc=Это кольцо улучшает меткость и глазомер владельца, увеличивая урон и срок службы любых метательных оружий. Проклятое кольцо даёт обратный эффект.

items.rings.ringoftenacity.name=кольцо живучести
items.rings.ringoftenacity.stats=Пока это кольцо надето, оно будет снижать получаемый урон не более чем на _%s%%_.
items.rings.ringoftenacity.typical_stats=Пока это кольцо надето, оно должно будет снижать получаемый урон не более чем на _%s%%._
items.rings.ringoftenacity.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе снижают получаемый урон не более чем на _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Максимальное сопротивление к урону
items.rings.ringoftenacity.desc=Будучи надетым, это кольцо позволит владельцу переживать ранения, которые в ином случае стали бы для него смертельными. Чем сильнее ранен владелец, тем сильнее будет этот эффект. Проклятое же кольцо, напротив, будет делать владельца более уязвимым к добиванию.

items.rings.ringofwealth.name=кольцо богатства
items.rings.ringofwealth.stats=Пока это кольцо надето, оно будет увеличивать вашу удачу на _%s%%._
items.rings.ringofwealth.typical_stats=Пока это кольцо надето, оно должно будет увеличивать вашу удачу на _%s%%._
items.rings.ringofwealth.combined_stats=Ваши надетые кольца объединили свою силу и теперь вместе увеличивают вашу удачу на _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Усиление удачи
items.rings.ringofwealth.desc=Это кольцо действует как магнит для сокровищ, увеличивая вероятность того, что враги и сундуки будут содержать ценные предметы. Проклятое кольцо, вместо этого, уменьшит ваши шансы получить добычу.

items.rings.ringoofretenacity.name=庇护之戒
items.rings.ringoofretenacity.desc=这枚戒指为佩戴者削弱各种外界的侵害。你受到大部分元素与魔法伤害会被削弱，而随着你的受伤程度增加，你对所有伤害的抗性都会逐步提升。被诅咒的戒指则会让你弱不禁风。

items.rings.ringoofretenacity.upgrade_stat_name_1=Сопротивление стихиям
items.rings.ringoofretenacity.upgrade_stat_name_2=Снижение получаемого урона
items.rings.ringoofretenacity.stats=佩戴这枚戒指时，你的元素抗性提升 _%1$s%%_，受伤时最大减免 _%2$s%%_ 的伤害。
items.rings.ringoofretenacity.combined_stats=你已装备的戒指正联结它们的力量，元素抗性提升 _%1$s%%_，受伤时至多减少 _%2$s%%_ 的伤害。
items.rings.ringoofretenacity.typical_stats=佩戴这枚戒指时，你的元素抗性通常会提升 _%1$s%%_，受伤时通常至多减少 _%2$s%%_ 的伤害。

items.rings.ringofaccevasion.name=集中之戒
items.rings.ringofaccevasion.desc=这枚戒指能让你在战斗中更加专注与迅捷。你的攻击会更难以闪避，同时敌人也更难击中你。被诅咒的戒指则会让你在战斗中破绽百出。
items.rings.ringofaccevasion.upgrade_stat_name_1=Усиление точности
items.rings.ringofaccevasion.upgrade_stat_name_2=Усиление уклонения
items.rings.ringofaccevasion.stats=佩戴这枚戒指时，你的精准加成 _%1$s%%_，闪避加成 _%2$s%%_。
items.rings.ringofaccevasion.combined_stats=你已装备的戒指正联结它们的力量，精准属性加成 _%1$s%%_，闪避属性加成 _%2$s%%_。
items.rings.ringofaccevasion.typical_stats=佩戴这枚戒指时，你的精准属性通常会提升 _%1$s%%_，闪避属性通常会加成 _%2$s%%_。



###scrolls
items.scrolls.scroll.ac_read=ЧИТАТЬ
items.scrolls.scroll.kaunan=свиток КЕНАЗ
items.scrolls.scroll.sowilo=свиток СОВИЛО
items.scrolls.scroll.laguz=свиток ЛАГУЗ
items.scrolls.scroll.yngvi=свиток ИНГУЗ
items.scrolls.scroll.gyfu=свиток ГЕБО
items.scrolls.scroll.raido=свиток РАЙДО
items.scrolls.scroll.isaz=свиток ИСА
items.scrolls.scroll.mannaz=свиток МАННАЗ
items.scrolls.scroll.naudiz=свиток НАУТИЗ
items.scrolls.scroll.berkanan=свиток БЕРКАНА
items.scrolls.scroll.odal=свиток ОДАЛ
items.scrolls.scroll.tiwaz=свиток ТЕЙВАЗ
items.scrolls.scroll.unknown_desc=Этот манускрипт покрыт непонятными письменами, озаглавленными неизвестной вам руной. Кто знает, что будет, если прочитать его вслух?
items.scrolls.scroll.blinded=Вы ослеплены и не можете разобрать, что написано на этом свитке.
items.scrolls.scroll.no_magic=Вы не можете использовать свитки под действием антимагии.
items.scrolls.scroll.cursed=Ваша проклятая нестабильная книга заклинаний не дает вам использовать силу этого свитка! Возможно, свиток Рассеяния все равно сможет сработать...
items.scrolls.scroll$placeholder.name=свиток

items.scrolls.inventoryscroll.warning=Вы действительно хотите отменить использование этого свитка? Он все равно будет истрачен, так как не был опознан.
items.scrolls.inventoryscroll.yes=Да, я уверен
items.scrolls.inventoryscroll.no=Нет, я передумал

items.scrolls.scrollofidentify.name=свиток Опознания
items.scrolls.scrollofidentify.inv_title=Какой предмет опознать?
items.scrolls.scrollofidentify.it_is=Ваш предмет был опознан: %s.
items.scrolls.scrollofidentify.desc=Этот свиток способен навсегда открыть все тайны одного предмета.

items.scrolls.scrolloflullaby.name=свиток Колыбельной
items.scrolls.scrolloflullaby.sooth=В воздухе раздается убаюкивающая мелодия. Вы чувствуете, что хотите спать.
items.scrolls.scrolloflullaby.desc=Чтение этого свитка вслух вызывает тихую мелодию, которая погрузит всех, кто её слышал, в глубокий волшебный сон. Для прочитавшего этот свиток и его союзников, этот сон будет оздоровляющим.

items.scrolls.scrollofmagicmapping.name=свиток Магической карты
items.scrolls.scrollofmagicmapping.layout=Теперь вы знакомы с планировкой этого уровня.
items.scrolls.scrollofmagicmapping.desc=После прочтения этого свитка в ваш разум впишется ясная картина уровня. Вам станут известны все коридоры и ловушки, в том числе скрытые. Однако местоположение предметов и существ останется неизвестным.

items.scrolls.scrollofmirrorimage.name=свиток Зеркальных копий
items.scrolls.scrollofmirrorimage.copies=Свиток сформировал зеркальные копии по вашему образу и подобию.
items.scrolls.scrollofmirrorimage.no_copies=Свиток пытается воссоздать по вашему образу зеркальные копии, но им негде появиться.
items.scrolls.scrollofmirrorimage.desc=При использовании, этот свиток создаст две зеркальных копии прочитавшего. Эти иллюзии слабее оригинала, но будут существовать до тех пор, пока не получат урон.

items.scrolls.scrollofretribution.name=свиток Возмездия
items.scrolls.scrollofretribution.blast=Свиток извергает мощную магическую энергию!
items.scrolls.scrollofretribution.desc=Этот свиток содержит могущественную магию, способную передавать свои страдания всем окружающим. Сила эффекта зависит от того, насколько мало здоровья осталось у читающего, и в крайних случаях может даже мгновенно убить большинство врагов.\n\nОднако использование свитка не проходит без последствий, ослепляя и ослабляя прочитавшего.

items.scrolls.scrollofrage.name=свиток Ярости
items.scrolls.scrollofrage.roar=Свиток издаёт яростный рёв, эхом отдающийся в подземелье!
items.scrolls.scrollofrage.desc=При прочтении вслух этот свиток издаст яростный рёв, привлекающий внимание врагов и вводящий в ярость тех, кто уже здесь.

items.scrolls.scrollofrecharging.name=свиток Перезарядки
items.scrolls.scrollofrecharging.surge=Сквозь ваше тело проходит поток энергии, заряжая ваши палочки!
items.scrolls.scrollofrecharging.desc=В этом свитке заключена чистая магическая энергия, которая при высвобождении начнёт постепенно заряжать все палочки прочитавшего.

items.scrolls.scrollofremovecurse.name=свиток Рассеяния проклятия
items.scrolls.scrollofremovecurse.inv_title=Какой предмет очищать?
items.scrolls.scrollofremovecurse.cleansed=Ваш предмет окутывает сияние, и тёмная энергия покидает его!
items.scrolls.scrollofremovecurse.not_cleansed=Ваш предмет окутывает сияние, но ничего не происходит.
items.scrolls.scrollofremovecurse.spirit=Ваш свиток освобождает измученного призрака!
items.scrolls.scrollofremovecurse.desc=Магия этого свитка позволит снять проклятие с одного оружия, кольца, палочки, доспеха или артефакта.

items.scrolls.scrollofteleportation.name=свиток Телепортации
items.scrolls.scrollofteleportation.tele=В мгновенье ока вы оказываетесь в другом месте уровня.
items.scrolls.scrollofteleportation.no_tele=Телепортация не удалась.
items.scrolls.scrollofteleportation.cant_reach=Вы не можете телепортироваться сюда.
items.scrolls.scrollofteleportation.prompt=Куда телепортироваться?
items.scrolls.scrollofteleportation.desc=Магия этого свитка мгновенно переносит прочитавшего в случайную локацию на этом же этаже. Свиток чаще всего переносит в те места, в которых прочитавший ещё не был до этого, но не может телепортировать за закрытые двери или баррикады. Однако, он способен показать скрытые двери, которые ведут в новые области.
items.scrolls.scrollofteleportation.strong_tele=Сильная магия этого места не позволяет вам телепортироваться!

items.scrolls.scrollofterror.name=свиток Ужаса
items.scrolls.scrollofterror.none=Свиток излучает яркий красный свет.
items.scrolls.scrollofterror.one=Свиток излучает яркий красный свет, и %s убегает!
items.scrolls.scrollofterror.many=Свиток излучает яркий красный свет, и монстры убегают!
items.scrolls.scrollofterror.desc=Вспышка красного света наполнит всех видимых существ ужасом и они попытаются убежать. Любой удар по убегающему врагу ослабит этот эффект.

items.scrolls.scrolloftransmutation.name=свиток Превращения
items.scrolls.scrolloftransmutation.inv_title=Превратить предмет
items.scrolls.scrolloftransmutation.nothing=Ничего не произошло.
items.scrolls.scrolloftransmutation.morph=Ваш предмет превращается во что-то другое!
items.scrolls.scrolloftransmutation.empty=Ваш артефакт превращается в кольцо!
items.scrolls.scrolloftransmutation.desc=Этот свиток содержит могущественное заклинание превращения. Если использовать на подходящем предмете, свиток превратит его в другой предмет такого же типа. При этом сохранятся все улучшения и зачарования. Свитки и зелья будут превращены в их особый эквивалент или в обратную сторону.

items.scrolls.scrolloftransmutation.bloodthirsty_areyou=Оружие, которое вы превращаете, является чрезвычайно уникальным, поэтому оно сопротивляется силе превращения. Если вы продолжите, велика вероятность того, что это оружие исчезнет. Вы действительно хотите продолжить превращение?
items.scrolls.scrolloftransmutation.bloodthirsty_areyts=Оружие, которое вы превращаете, является чрезвычайно уникальным, поэтому оно сопротивляется силе превращения. Если вы продолжите, велика вероятность того, что вместо оружия получите свиток улучшения. Вы действительно хотите продолжить превращение?
items.scrolls.scrolloftransmutation.bloodthirsty_yes=Да, я уверен!
items.scrolls.scrolloftransmutation.bloodthirsty_no=Нет, я передумал.
items.scrolls.scrolloftransmutation.bloodthirsty=Когда две силы схлестнулись, ваш свиток и оружие уничтожились. Однако рассеянная магическая энергия быстро вновь соединилась, и перед вами появился свиток улучшения!


items.scrolls.scrollofupgrade.name=свиток Улучшения
items.scrolls.scrollofupgrade.inv_title=Какой предмет улучшить?
items.scrolls.scrollofupgrade.weaken_curse=Свиток улучшения ослабляет проклятие на этом предмете.
items.scrolls.scrollofupgrade.remove_curse=Свиток улучшения развеивает проклятие на этом предмете!
items.scrolls.scrollofupgrade.desc=Этот свиток улучшит один предмет, повысив его качество. У палочки возрастёт мощь и количество зарядов, оружие и броня будут наносить и поглощать больше урона, а эффективность колец увеличится. Этот свиток способен ослабить или даже снять проклятие, хотя он и не столь эффективен, как свиток Рассеяния проклятия. \n\nМагия этого свитка, к сожалению, способна помешать или снять зачарование на оружии или рун на брони более высоких уровней. Вероятность такого эффекта начинается, если улучшать выше уровня +4, а с уровня +8 и выше такой эффект гарантирован. Если предмет закален, эти значения увеличиваются на +6 и +10, а закалка снимается всегда первой - до зачарования или руны.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=особый свиток КЕНАЗ
items.scrolls.exotic.exoticscroll.sowilo=особый свиток СОВИЛО
items.scrolls.exotic.exoticscroll.laguz=особый свиток ЛАГУЗ
items.scrolls.exotic.exoticscroll.yngvi=особый свиток ИНГУЗ
items.scrolls.exotic.exoticscroll.gyfu=особый свиток ГЕБО
items.scrolls.exotic.exoticscroll.raido=особый свиток РАЙДО
items.scrolls.exotic.exoticscroll.isaz=особый свиток ИСА
items.scrolls.exotic.exoticscroll.mannaz=особый свиток МАННАЗ
items.scrolls.exotic.exoticscroll.naudiz=особый свиток НАУТИЗ
items.scrolls.exotic.exoticscroll.berkanan=особый свиток БЕРКАНА
items.scrolls.exotic.exoticscroll.odal=особый свиток ОДАЛ
items.scrolls.exotic.exoticscroll.tiwaz=особый свиток ТЕЙВАЗ
items.scrolls.exotic.exoticscroll.unknown_desc=Этот чёрный манускрипт покрыт непонятными светящимися письменами и совсем не похож на обычные свитки. Кто знает, что будет, если прочитать его вслух?

items.scrolls.exotic.scrollofsirenssong.name=свиток Песни Сирены
items.scrolls.exotic.scrollofsirenssong.prompt=Выберите цель
items.scrolls.exotic.scrollofsirenssong.no_target=Свиток был использован без цели
items.scrolls.exotic.scrollofsirenssong.cancel=Нужно выбрать цель.
items.scrolls.exotic.scrollofsirenssong.desc=После чтения этого свитка раздастся приятная мелодия, которая зачарует и превратить одного выбранного противника в вашего постоянного союзника! Остальные враги, услышавшие мелодию, будут временно очарованы.\n\nОднако, сильные противники могут противостоять этому эффекту. При выборе их в качестве цели они будут просто очарованы.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=зачарованный
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Это существо было околдовано магией свитка очарования.\n\nТеперь это существо - ваш союзник и оно будет сражаться за вас.

items.scrolls.exotic.scrollofantimagic.name=свиток Антимагии
items.scrolls.exotic.scrollofantimagic.desc=Заклинание в этом свитке окружит вас волшебной аурой, временно блокирующей любые вредные и полезные магические эффекты. Однако способности героической брони настолько сильные, что могут работать даже под воздействием этого эффекта.

items.scrolls.exotic.scrollofchallenge.name=свиток Вызова
items.scrolls.exotic.scrollofchallenge.desc=Когда прочтён, свиток издаст громкий рёв, который привлечёт врагов к прочитавшему, создавая тем временем маленькую арену вокруг него.\n\nПока прочитавший остаётся в этой арене, он будет получать на 33% меньше урона от всех источников оного (это сопротивление будет учитываться перед всеми остальными формами сопротивлению урона), и не будет терять сытости.\n\nРазмер арены будет зависеть от размера комнаты, в котором находится прочитавший. Размер будет особенно меньше в комнатах некоторых боссов.
items.scrolls.exotic.scrollofchallenge$challengearena.name=арена вызова
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Магическая арена появилась вокруг вас, очерченную клубящимся красным туманом.\n\nПока вы стоите в тумане, ваш голод не будет увеличиваться и вы будете получать на 33%% меньше урона от всех источников оного. Если у вас есть другое сопротивление урону (например, броня), оно будет учитываться после 33%% сопротивления.\n\nХодов осталось: %d.

items.scrolls.exotic.scrollofdivination.name=свиток Предсказания
items.scrolls.exotic.scrollofdivination.nothing_left=Больше нечего опознавать!
items.scrolls.exotic.scrollofdivination.desc=Этот свиток опознает четыре случайных неопознанных предмета. Это может быть цвет зелья, руна свитка или камень кольца. Опознанные предметы необязательно будут предметами из вашего инвентаря.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Ваш свиток предсказания распознал следующие предметы:

items.scrolls.exotic.scrollofdread.name=свиток Кошмара
items.scrolls.exotic.scrollofdread.desc=Когда прочтён, свиток выпустит волну красного света, которая внушит неописуемый ужас всем врагам в поле зрения. Эффект настолько сильный, что враги попытаются удрать из подземелья без оглядки!\n\nТак же как и ужас, этот эффект ослабевает со временем, или когда враг атакован.\n\nНа врагов с сильной волей, например боссов, будет наложен обычный ужас.

items.scrolls.exotic.scrollofenchantment.name=свиток Зачарования
items.scrolls.exotic.scrollofenchantment.inv_title=Зачаровать предмет
items.scrolls.exotic.scrollofenchantment.weapon=Выберите, какое зачарование применить к вашему оружию.
items.scrolls.exotic.scrollofenchantment.armor=Выберите, какую руну нанести на вашу броню.
items.scrolls.exotic.scrollofenchantment.cancel_warn=При отмене свиток будет истрачен зря.
items.scrolls.exotic.scrollofenchantment.cancel=Отменить
items.scrolls.exotic.scrollofenchantment.desc=Этот свиток наполнит оружие или броню мощной волшебной энергией. Прочитавший даже сможет в некоторой степени контролировать тип накладываемого зачарования.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Да, я уверен
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Нет, я передумал

items.scrolls.exotic.scrollofforesight.name=свиток Предвидения
items.scrolls.exotic.scrollofforesight.desc=В разум прочитавшего этот свиток с предельной ясностью начнет поступать информация об окружающей местности. Это позволит автоматически обнаруживать любые секреты в радиусе своего поиска.

items.scrolls.exotic.scrollofmetamorphosis.name=свиток Метаморфозы
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Выберите талант для преобразования.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Выберите новый талант на замену преобразованному.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=Преобразовать талант
items.scrolls.exotic.scrollofmetamorphosis.desc=Этот свиток содержит мощную магию трансмутации, которая будет применена к заклинателю вместо предмета. Магия этого свитка позволит вам выбрать талант и заменить его одним из четырех талантов других классов такого же уровня.\n\nЭтот эффект может применяться только к талантам класса, не талантам подклассов или способностям брони. Таланты, которые вы не можете использовать не будут даны для выбора.

items.scrolls.exotic.scrollofmysticalenergy.name=свиток Мистической энергии
items.scrolls.exotic.scrollofmysticalenergy.desc=Необузданная магическая сила, заключенная в этом манускрипте, при высвобождении будет в течение некоторого времени заряжать экипированные артефакты.

items.scrolls.exotic.scrollofpassage.name=свиток Прохода
items.scrolls.exotic.scrollofpassage.desc=Заклинание на этом пергаменте мгновенно переносит читателя в ближайшую область на первом этаже над ними. Очень удобно для быстрого доступа в магазин.

items.scrolls.exotic.scrollofprismaticimage.name=свиток Зеркальной копии
items.scrolls.exotic.scrollofprismaticimage.desc=Заклятие в этом свитке создаст радужную копию прочитавшего. Эта иллюзия имеет меньший урон и живучесть, но примерно такую же защиту, что и оригинал.\n\nКопия появляется только при встрече с врагами, скрываясь из виду всё остальное время.\n\nЕсли радужная копия уже существует, она будет полностью исцелена.

items.scrolls.exotic.scrollofpsionicblast.name=свиток Ментального удара
items.scrolls.exotic.scrollofpsionicblast.ondeath=Ментальный удар разрывает ваш разум...
items.scrolls.exotic.scrollofpsionicblast.desc=Этот свиток содержит невероятную разрушительную энергию, которая может быть направлена на уничтожение разумов видимых существ.\n\nОтдача, однако, настолько велика, что прочитавший также получит урон, будет ослеплён и ослаблен. Чем больше целей поразит свиток, тем меньше урона будет получено.



###spells
items.spells.unstablespell.name=нестабильное заклинание
items.spells.unstablespell.desc=Это маленький черный квадратный кристалл с движущимися руническими символами, начертанными на каждой из его поверхностей.\n\nПри активации он вызывает эффект случайного свитка. Эффект свитка будет более ориентирован на сражение, если в вашем поле зрения есть враги, и менее, если врагов нет.

items.spells.alchemize.name=Трансмутация
items.spells.alchemize.prompt=Расщепить предмет
items.spells.alchemize.desc=Это заклинание содержит силы трансмутации, схожие с иными в алхимическом котле. Каждое заклинание позволяет превратить предмет (или несколько предметов) в золото или алхимическую энергию.\n\nНесколько готовых заклинаний Трансмутации продаётся в магазинах, но намного больше можно сделать с помощью алхимии, соединив в котле семя, рунный камень и немного алхимической энергии.
items.spells.alchemize$wndalchemizeitem.sell=Превратить в %d золота
items.spells.alchemize$wndalchemizeitem.sell_1=Превратить 1 в %d золота
items.spells.alchemize$wndalchemizeitem.sell_all=Превратить всё в %d золота
items.spells.alchemize$wndalchemizeitem.energize=Превратить в %d энергии
items.spells.alchemize$wndalchemizeitem.energize_1=Превратить 1 в %d энергии
items.spells.alchemize$wndalchemizeitem.energize_all=Превратить всё в %d энергии
items.spells.alchemize.refoge=Вы успешно превратили: 
items.spells.alchemize.no_desc=Ромбовидный кристалл утратил свой блеск, так как некая таинственная сила в нем, мешает ему получать алхимическую энергию.\n\nВозможно, это вызвано воздействием таинственной силы, исходящей из мироздания Испытания боссами.\n\n_Недоступно в режиме Испытания боссами_

items.spells.aquablast.name=Водяной шар
items.spells.aquablast.desc=Это заклинание создаст водный всплеск в точке приземления. Оно достаточно мощное, чтобы нанести урон огненным существам, но оно также затопит местность вокруг, потушит пламя и откинет врагов, которые оказались рядом со всплеском.

items.spells.arcanecatalyst.name=мистический катализатор
items.spells.arcanecatalyst.desc=Этот комок золотистой пыли является очищенной сущностью свитка. Он сверкает в темноте подземелья.\n\nЭтот катализатор в основном используется как алхимический ингредиент, но если его магию использовать напрямую, то он сработает как случайный свиток.

items.spells.beaconofreturning.name=Маяк возвращения
items.spells.beaconofreturning.preventing=Сильная магия этого места не позволяет вам использовать заклинание!
items.spells.beaconofreturning.preventing_2=Сильная магия ведьмы темного пламени не позволяет вам использовать заклинание!
items.spells.beaconofreturning.creatures=Психическая аура близлежащих существ не позволяет вам телепортироваться.
items.spells.beaconofreturning.set=Маяк был установлен в данном месте.
items.spells.beaconofreturning.wnd_body=Установка перезапишет место установки.\n\nВозвращение вернёт вас в последнее установленное место.
items.spells.beaconofreturning.wnd_set=Установить
items.spells.beaconofreturning.wnd_return=Вернуться
items.spells.beaconofreturning.desc_set=Маяк установлен где-то на %d этаже.
items.spells.beaconofreturning.desc=Это сложное заклинание позволит пользователю вернуться в установленную местность, вне зависимости от расстояния. Заклинание тратится только при возвращении, оно может быть установлено сколько угодно раз. Но помните, что оно вернёт вас только в последнюю установленную точку. Это заклинание не действует на подслоях.

items.spells.curseinfusion.name=Проклятие
items.spells.curseinfusion.inv_title=Проклясть предмет
items.spells.curseinfusion.desc=Это заклинание наделит предмет вашей экипировки той же тёмной магией, что когда-то жила в DM-300. Любые зачарования или руны будут развеяны, а предмет станет проклят.\n\nОружия, доспехи и палочки при этом получат бонусы к уровню улучшения, но этот бонус исчезнет, если снять проклятие с предмета. Этот бонус нельзя применить повторно.

items.spells.featherfall.name=Антигравитация
items.spells.featherfall.light=Вы чувствуете себя легким, как пёрышко!
items.spells.featherfall.desc=Это заклинание дарует частичный контроль над гравитацией, позволяя падать в пропасти без риска для здоровья. Времени действия заклинания хватает только на одно применение.
items.spells.featherfall$featherbuff.name=антигравитация
items.spells.featherfall$featherbuff.desc=Вы под эффектом заклинания Антигравитации, который позволяет вам падать в пропасти и не получить урон! Эффект пропадет, когда оно будет использовано, или по истечению времени.\n\nОсталось ходов: %s.

items.spells.spell.ac_cast=ПРИМЕНИТЬ
items.spells.spell.no_magic=Вы не можете использовать заклинания под действием антимагии.

items.spells.magicalinfusion.name=Зачарование
items.spells.magicalinfusion.inv_title=Какой предмет зачаровать?
items.spells.magicalinfusion.infuse=Ваш предмет наполнен мистической энергией!
items.spells.magicalinfusion.desc=Это заклинание практически аналогично свитку улучшения, но его энергия более стабильна.\n\nПри улучшении этим заклинанием оружия или доспеха, оно никогда не сотрет зачарование или руну, включая проклятья.

items.spells.magicalporter.name=Транспортация
items.spells.magicalporter.inv_title=Переместить предмет
items.spells.magicalporter.nowhere=Тебе некуда переносить предмет.
items.spells.magicalporter.desc=Это заклинание позволяет телепортировать любую вещь, но не к торговцу, а ко входу на этаже следующего босса.

items.spells.phaseshift.name=Искажение
items.spells.phaseshift.no_target=Здесь нечего телепортировать.
items.spells.phaseshift.desc=Это хаотичное заклинание телепортирует свою цель в случайную точку этажа и оглушит её на продолжительный период. Однако, сильные враги, оглушение не получат. Оно может быть направлено как на себя, так и на кого-то другого.

items.spells.reclaimtrap.name=Конвертация
items.spells.reclaimtrap.no_trap=Тут нет ловушек.
items.spells.reclaimtrap.desc_trap=Сейчас это заклинание имеет такой же эффект, что и _%s._
items.spells.reclaimtrap.desc=Это заклинание содержит остатки механической энергии DM-300. При использовании на активную ловушку, сила ловушки будет поглощена заклинанием, что позволит вам активировать эффект ловушки в любом месте, на ваш выбор.\n\nТем не менее, некоторые ловушки могут работать не во всех местах, а заклинание может хранить только одну ловушку за раз.

items.spells.recycle.name=Переработка
items.spells.recycle.inv_title=Переработать предмет
items.spells.recycle.recycled=Предмет был переработан в: %s.
items.spells.recycle.desc=Заклинание содержит слабую версию магии трансмутации. Пускай это не работает на экипировке, это заклинание может превратить свиток, зелье, семя, рунный камень или дротик с наконечником в случайный предмет того же типа.
items.spells.summonelemental.name=вызов элементаля
items.spells.summonelemental.ac_imbue=НАДЕЛИТЬ
items.spells.summonelemental.summon_limit=Вы можете иметь только одного призванного элементаля.
items.spells.summonelemental.imbue_prompt=Наделить предмет
items.spells.summonelemental.desc=Это заклинание проводит энергию элементального пепла, использованного при изготовлении, и позволяет вам призвать союзного элементаля сражаться за вас! Только один элементаль может существовать одновременно, но заклинание можно использовать снова, чтобы призвать элементаля к вам.
items.spells.summonelemental.desc_newborn=Заклинание в данный момент не наделено, и призовёт _молодого элементаля_ без дальнобойной атаки. Вы можете использовать опознанное Зелье Алхимического огня, Зелье Холода, Свиток Перезарядки или Свиток Превращения, для наполнения заклинания, чтобы в будущем призывать сильного элементаля!
items.spells.summonelemental.desc_fire=Заклинание сейчас горячее на ощупь. Оно будет вызывать _огненного элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.
items.spells.summonelemental.desc_frost=Заклинание сейчас холодное на ощупь. Оно будет вызывать _ледяного элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.
items.spells.summonelemental.desc_shock=Заклинание сейчас излучает статическую энергию. Оно будет вызывать _электрического элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.
items.spells.summonelemental.desc_chaos=Заклинание сейчас излучает хаотическую энергию. Оно будет вызывать _хаотического элементаля_. Вы можете наделить заклинание другим предметом, но оно потеряет текущее наполнение.

items.spells.targetedspell.prompt=Выберите цель
items.spells.targetedspell.inv_title=Какой предмет зачаровать?

items.spells.telekineticgrab.name=Телекинетический захват
items.spells.telekineticgrab.cant_grab=Вы не можете схватить это.
items.spells.telekineticgrab.no_target=Здесь нечего хватать.
items.spells.telekineticgrab.desc=Это заклинание позволяет захватывать все объекты на расстоянии или даже все застрявшее во враге метательное оружие!\n\nНо его нельзя использовать на чужих предметах или сундуках.

items.spells.wildenergy.name=дикая энергия
items.spells.wildenergy.desc=Это заклинание содержит часть проклятой энергии, которая питала DM-300. При активации оно перезарядит ваши палочки и экипированные артефакты, но вызовет случайный эффект, как если бы вы использовали проклятую палочку. Впрочем, вы всё же сможете выбрать направление выстрела.


###runestones
items.stones.inventorystone.ac_use=ПРИМЕНИТЬ

items.stones.runestone$placeholder.name=рунный камень

items.stones.stoneofaggression.name=камень Агрессии
items.stones.stoneofaggression.desc=Если бросить этот камень в кого-либо, все находящиеся рядом враги будут вынуждены атаковать этого персонажа в течение короткого времени.\n\nЕсли использовать его на врага, то магия действует всего несколько мгновений, если же использовать его на себе или на союзнике, она действует значительно дольше.
items.stones.stoneofaggression$aggression.name=метка агрессии

items.stones.stoneofaugmentation.name=камень Баланса
items.stones.stoneofaugmentation.inv_title=Балансировать предмет
items.stones.stoneofaugmentation.desc=Этот рунный камень обладает могучими чарами, которые могут балансировать экипировку, увеличивая одно из свойств за счёт другого.\n\nДля оружия он позволяет улучшить либо урон, либо скорость атаки.\n\nДля доспехов он позволяет улучшить либо защиту, либо уклонение.
items.stones.stoneofaugmentation$wndaugment.choice=Что вы хотели бы улучшить?
items.stones.stoneofaugmentation$wndaugment.speed=Скорость
items.stones.stoneofaugmentation$wndaugment.damage=Урон
items.stones.stoneofaugmentation$wndaugment.evasion=Уклонение
items.stones.stoneofaugmentation$wndaugment.defense=Защита
items.stones.stoneofaugmentation$wndaugment.none=Убрать балансирование
items.stones.stoneofaugmentation$wndaugment.cancel=Я передумал

items.stones.stoneofblast.name=камень Взрыва
items.stones.stoneofblast.desc=Этот рунный камень моментально взорвётся при броске. Прямо как бомба, взрыв нанесёт урон всем, кто находится рядом.

items.stones.stoneofblink.name=камень Перемещения
items.stones.stoneofblink.desc=Если бросить этот рунный камень на пол, то он перенесёт своего владельца на место своего падения.

items.stones.stoneofclairvoyance.name=камень Ясновидения
items.stones.stoneofclairvoyance.desc=Этот камень мгновенно откроет все клетки в очень большой области вокруг того места, куда он был брошен. Этому эффекту не препятствуют даже стены.

items.stones.stoneofdeepsleep.name=камень Непробудного сна
items.stones.stoneofdeepsleep.desc=Этот камень, брошенный во врага, погрузит его в глубокий магический сон. Такой сон нельзя потревожить, пока враг не получил какой-либо урон.

items.stones.stoneofdisarming.name=камень Обезвреживания
items.stones.stoneofdisarming.desc=Этот рунный камень содержит магию, которая способна обезвредить вредоносные ловушки, спрятанные в подземелье. Он может обезвредить до 9 ловушек вокруг того места, куда будет брошен.

items.stones.stoneofenchantment.name=камень Зачарования
items.stones.stoneofenchantment.inv_title=Зачаровать предмет
items.stones.stoneofenchantment.weapon=Ваше оружие светится в темноте!
items.stones.stoneofenchantment.armor=Ваша броня светится в темноте!
items.stones.stoneofenchantment.desc=Этот рунный камень содержит зачаровывающую магию. В отличие от аналогичных свитков, он не может быть использован для улучшения предметов. Но зато может наложить на оружие или броню случайное зачарование, наделив предмет новыми силами.
items.stones.stoneofenchantment.seal=Ваша печать светится в темноте!

items.stones.stoneoffear.name=камень Страха
items.stones.stoneoffear.desc=Этот камень так сильно испугает персонажа, в которого он был брошен, что ему захочется убраться куда подальше. Любой урон, нанесённый убегающему, снизит длительность эффекта.

items.stones.stoneofflock.name=камень Стада
items.stones.stoneofflock.desc=Этот рунный камень на короткое время призовёт стадо волшебных овец в том месте, куда он был брошен.

items.stones.stoneofintuition.name=камень Интуиции
items.stones.stoneofintuition.inv_title=Выберите предмет
items.stones.stoneofintuition.desc=Этот рунный камень содержит ослабленную версию той магии, что присутствует в свитках опознания. Вместо того, чтобы напрямую раскрыть секреты предмета, он воздействует на вашу интуицию, позволяя угадать назначение зелья или свитка.
items.stones.stoneofintuition.break_info=Вы можете использовать камень интуиции дважды, прежде чем он сломается, _ваше следующее использование не потратит камень_.
items.stones.stoneofintuition.break_warn=Вы ранее использовали камень интуиции, потому _ваше следующее использование потратит камень_.
items.stones.stoneofintuition$wndguess.text=Угадай тип неопознанного предмета. Если отгадаешь, то он будет опознан!
items.stones.stoneofintuition$wndguess.correct=Вы угадали. Предмет был опознан!
items.stones.stoneofintuition$wndguess.incorrect=Вы не угадали.
items.stones.stoneofintuition$wndguess.break=Камень интуиции рассыпался в пыль...

items.stones.stoneofshock.name=камень Шока
items.stones.stoneofshock.desc=Этот рунный камень вызывает электрический взрыв, который ненадолго оглушает все ближайшие цели и дает заряд волшебной палочки за каждую цель, которая была задета.

###wands
items.wands.cursedwand.ondeath=Вас убил ваш собственный %s.
items.wands.cursedwand.nothing=Ничего не произошло.
items.wands.cursedwand.mass_invuln=Яркий свет извергается из вашей палочки!
items.wands.cursedwand.petrify=Вы внезапно замерзаете на месте!
items.wands.cursedwand.grass=Вокруг вас внезапно появляются заросли травы!
items.wands.cursedwand.fire=Вы чувствуете запах гари...
items.wands.cursedwand.transmogrify_wand=Ваша палочка превратилась в другой предмет!
items.wands.cursedwand.transmogrify_other=Ваш предмет превращается во что-то другое!
items.wands.cursedwand.disguise=Ваш облик меняется у вас на глазах!
items.wands.cursedwand.supernova=Раскаленный шар энергии начинает расти. Лучше бежать!
items.wands.cursedwand.supernova_positive=Пылающий энергетический шар начинает расти, но кажется безопасным.
items.wands.cursedwand.sinkhole=Почва вокруг вас начинает обрушиваться!
items.wands.cursedwand.sinkhole_positive=Почва начинает обрушиваться, но кажется довольно твёрдой под вашими ногами.
items.wands.cursedwand.gravity=Гравитация тянет в случайных направлениях!
items.wands.cursedwand.gravity_positive=Гравитация тянет в случайных направлениях, но не касается вас.
items.wands.cursedwand.gravity_end=Гравитационный хаос закончился.

items.wands.damagewand.upgrade_stat_name_1=Магический урон

items.wands.wand.ac_zap=ИСПОЛЬЗОВАТЬ
items.wands.wand.fizzles=Ваша палочка искрит. Видимо, у нее кончились заряды.
items.wands.wand.no_holo=Вред внутреннего демона, повлиял на ваш рассудок, поэтому ваша магическая сила рассевается, даже не успев сконцентрироваться...
items.wands.wand.no_magic=Вы не можете использовать палочки под действием антимагии.
items.wands.wand.self_target=Нельзя выбрать себя в качестве цели!
items.wands.wand.identify=Вы достаточно долго знакомы с палочкой, чтобы опознать ее.
items.wands.wand.resin_one=Палочка получила _1 уровень_ от магической смолы.
items.wands.wand.resin_many=Палочка получила _%d уровня_ от магической смолы.
items.wands.wand.cursed=Эта палочка проклята, ее сила хаотична и непредсказуема.
items.wands.wand.not_cursed=Эта палочка не проклята.
items.wands.wand.curse_discover=Этот %s проклят!
items.wands.wand.prompt=Выберите цель
items.wands.wand$placeholder.name=палочка

items.wands.wandofblastwave.name=палочка Взрывной волны
items.wands.wandofblastwave.staff_name=посох Взрывной волны
items.wands.wandofblastwave.ondeath=Вы убили себя собственной палочкой Взрывной волны...
items.wands.wandofblastwave.desc=Эта палочка с золотой отделкой и навершием из черного самоцвета сделана из мрамора. Довольно увесистая.
items.wands.wandofblastwave.typical_stats_desc=Эта палочка выпускает заряд, создающий мощный взрыв в точке удара. Взрыв обычно наносит _%1$d-%2$d урона,_ и способен отправить большинство врагов в полёт.
items.wands.wandofblastwave.stats_desc=Эта палочка выпускает заряд, создающий мощный взрыв в точке удара. Взрыв наносит _%1$d-%2$d урона,_ и способен отправить большинство врагов в полёт.
items.wands.wandofblastwave.upgrade_stat_name_2=Отталкивание
items.wands.wandofblastwave.bmage_desc=Когда _%s_ поражает парализованного противника зарядом из посоха Взрывной волны, это поглотит паралич и нанесет дополнительный магический урон. У этой способности есть небольшая перезарядка при использовании на одном враге.
items.wands.wandofblastwave.eleblast_desc=Стихийный взрыв с посохом взрывной волны наносит 67% урона и сбивает всех врагов за пределами области взрыва.

items.wands.wandofcorrosion.name=палочка Коррозии
items.wands.wandofcorrosion.staff_name=посох Коррозии
items.wands.wandofcorrosion.desc=Мертвенно-бледная рукоять этой палочки украшена сияющим драгоценным камнем ярко-оранжевого цвета.
items.wands.wandofcorrosion.stats_desc=При использовании эта палочка стреляет зарядом, который взрывается в облако крайне едкого газа в месте попадания. Урон, наносимый этим газом, растет в зависимости от того, сколько времени цель находилась в облаке, начиная с _%d ед. урона._
items.wands.wandofcorrosion.upgrade_stat_name_1=Урон коррозии
items.wands.wandofcorrosion.upgrade_stat_name_2=Объём газа
items.wands.wandofcorrosion.bmage_desc=Когда _%s_ %s, у посоха Коррозии появляется шанс покрыть едкой слизью врага.
items.wands.wandofcorrosion.eleblast_desc=Стихийный взрыв с посохом коррозии накладывает на врагов 4 хода коррозии, которая начинается с 6 урона.

items.wands.wandofcorruption.name=палочка Порчи
items.wands.wandofcorruption.staff_name=посох Порчи
items.wands.wandofcorruption.already_corrupted=Эта цель уже под вашим контролем.
items.wands.wandofcorruption.desc=Даже без маленького черепа на навершии можно понять, что эта вещь не для всяких рук - палочка просто источает темную магию.
items.wands.wandofcorruption.stats_desc=Эта палочка выпускает разряд Порчи, пытаясь подчинить врагов вашей воле. В противном случае, палочка наложит на цель случайный негативный эффект. Но чем больше негативных эффектов на цели, тем больше шансов на то, что она будет подчинена.
items.wands.wandofcorruption.upgrade_stat_name_1=Сила порчи
items.wands.wandofcorruption.upgrade_stat_name_2=Длительность ослабления
items.wands.wandofcorruption.bmage_desc=Когда _%s_ %s, у посоха Порчи появляется шанс спровоцировать буйство у врага.
items.wands.wandofcorruption.eleblast_desc=Стихийный взрыв с посохом порчи накладывает на врагов 5 ходов буйства.

items.wands.wandofdisintegration.name=палочка Дезинтеграции
items.wands.wandofdisintegration.staff_name=посох Дезинтеграции
items.wands.wandofdisintegration.desc=Эта палочка сделана из цельного куска обсидиана, внутри которого течет фиолетовый свет, заканчивающийся у навершия. Она мерцает разрушительной энергией, ожидая, когда ей воспользуются.
items.wands.wandofdisintegration.stats_desc=Палочка испускает луч, пронзающий любые препятствия на своём пути. Дальность луча увеличивается с улучшением палочки. Луч наносит _%1$d-%2$d урона,_ и чем больше луч пронзает врагов и препятствий, тем больше дополнительный урон.
items.wands.wandofdisintegration.upgrade_stat_name_2=Максимальная дистанция
items.wands.wandofdisintegration.bmage_desc=Когда _%s_, использует посох Дезинтеграции, дальность атаки увеличивается так, будто в нём есть зачарование проекции.
items.wands.wandofdisintegration.eleblast_desc=Стихийный взрыв с посохом дезинтеграции наносит 100% урона и пробивает стены насквозь.

items.wands.wandoffireblast.name=палочка Огненной вспышки
items.wands.wandoffireblast.staff_name=посох Огненной вспышки
items.wands.wandoffireblast.desc=Эта палочка сделана из лакированного красного дерева с навершием в виде золотого листа, из-за чего выглядит, как королевский скипетр. Она шипит и искрит, готовая выпустить свою неудержимую магию.
items.wands.wandoffireblast.stats_desc=При использовании эта палочка выпускает конус огня. Его следующая поглотит _%1$d зарядов_ и нанесёт _%2$d-%3$d урона_. Чем больше зарядов используется, тем больше и сильнее эффект.
items.wands.wandoffireblast.upgrade_stat_name_1=Урон 1 заряда
items.wands.wandoffireblast.upgrade_stat_name_2=Урон 2 заряда
items.wands.wandoffireblast.upgrade_stat_name_3=Урон 3 заряда
items.wands.wandoffireblast.bmage_desc=Когда _%s_ %s, у посоха Огненной вспышки появляется шанс, что произойдёт взрыв, который нанесет урон врагам и поглотит весь огонь поблизости! Чем больше огня вокруг врага, тем больше этот шанс.
items.wands.wandoffireblast.eleblast_desc=Стихийный взрыв с посохом огненной вспышки наносит 100% урона, прорывается через открытые двери и поджигает врагов и местность.

items.wands.wandoffrost.name=палочка Холода
items.wands.wandoffrost.staff_name=посох Холода
items.wands.wandoffrost.desc=Кажется, эта палочка сделана из какого-то волшебного льда. Она становится ярче около навершия. На ощупь довольно холодная, но ваша рука почему-то остается тёплой.
items.wands.wandoffrost.stats_desc=Эта палочка стреляет в ваших врагов потоком льда, нанося _%1$d-%2$d урона_ и замораживает их. В воде эффект сильнее. Замороженные враги, получают меньше урона от этой палочки.
items.wands.wandoffrost.upgrade_stat_name_2=Длительность окоченения
items.wands.wandoffrost.bmage_desc=Когда _%s_ %s, у посоха Холода появляется шанс моментально заморозить противника. Чем более охлажден противник, тем больше этот шанс.
items.wands.wandoffrost.eleblast_desc=Стихийный взрыв с посохом холода наносит 100% урона, замораживает врагов и тушит пожары.

items.wands.wandoflightning.name=палочка Молний
items.wands.wandoflightning.staff_name=посох Молний
items.wands.wandoflightning.ondeath=Вы убили себя собственной палочкой Молний...
items.wands.wandoflightning.desc=Эта палочка сделана из цельного металла, из-за чего она довольно тяжёлая. На навершии есть два зубца, между которыми проскакивают электрические дуги.
items.wands.wandoflightning.stats_desc=Эта палочка испускает мощные молнии, которые пронизывают все, против чего они направлены, и причиняют _%1$d-%2$d урона_. Это электричество переходит на близкие персонажи и свободнее распространяется в воде. Молнии из этой палочки могут нанести вам вред, но не затрагивают ваших союзников.
items.wands.wandoflightning.bmage_desc=Когда _%s_ %s, посох Молний имеет шанс дать эффект электрической зарядки на 10 ходов. Будучи заряженным маг невосприимчив к электрическому урону и его молнии будут бить дальше.
items.wands.wandoflightning.eleblast_desc=Стихийный взрыв с посохом молнии наносит 100% урона, оглушает врагов на 5 ходов и электризует воду.
items.wands.wandoflightning$lightningcharge.name=электрически заряжен
items.wands.wandoflightning$lightningcharge.desc=%s сейчас заряжен энергией, что даёт ему иммунитет к его посоху Молний и увеличивает дальность атаки молнией.\n\nХодов осталось: %s.

items.wands.wandoflivingearth.name=палочка Живой земли
items.wands.wandoflivingearth.staff_name=посох Живой земли
items.wands.wandoflivingearth.desc=Эта палочка сделана из странного камня с полосами светящейся желтой энергии. Камни, кажется, слегка сдвигаются, когда вы держите палочку, как будто они чувствуют вашу руку.
items.wands.wandoflivingearth.stats_desc=Эта палочка создает снаряды из магических камней, нанося _%1$d-%2$d урона._ Затем камни возвращаются к владельцу палочки, чтобы создать вокруг него броню. Если брони достаточно, то при следующем использовании палочки она превратится в каменного стража.
items.wands.wandoflivingearth.upgrade_stat_name_2=Макс. ОЗ стража
items.wands.wandoflivingearth.upgrade_stat_name_3=Блокирование стража
items.wands.wandoflivingearth.bmage_desc=Когда _%s_ %s, посох Живой земли возвращает часть нанесенного урона в виде каменной брони.
items.wands.wandoflivingearth.eleblast_desc=Стихийный взрыв с посохом живой земли наносит 50% урона и лечит активного земляного стража за каждого пораженного врага.
items.wands.wandoflivingearth$rockarmor.name=каменная броня
items.wands.wandoflivingearth$rockarmor.desc=Магические камни окружают ваше тело и пытаются защитить вас при вражеской атаке, уменьшая урон по вам на 50%%. Броня снижается при поглощении урона.\n\nБрони осталось: %1$d\n\nЕсли на вашем теле достаточно камня, то следующее использование вашей палочки Живой земли заставит камни собраться в стража, который будет сражаться за вас.\n\nНужно брони для призыва стража: %2$d.
items.wands.wandoflivingearth$earthguardian.name=земляной страж
items.wands.wandoflivingearth$earthguardian.desc=Камни из вашей палочки живой земли превратились в защитного земляного стража! Этот каменный защитник будет атаковать ближайших врагов, что заставит их атаковать стража вместо вас. Когда все угрозы поблизости исчезнут, страж вновь сформируется вокруг вас и вернется, когда вы в следующий раз воспользуетесь своей палочкой.
items.wands.wandoflivingearth$earthguardian.wand_info=Защитная сила стража связана с уровнем вашей палочки. На данный момент он блокирует _%1$d-%2$d урона._

items.wands.wandofmagicmissile.name=палочка Магической стрелы
items.wands.wandofmagicmissile.staff_name=посох Магической стрелы
items.wands.wandofmagicmissile.desc=Довольно простая палочка, стреляющая стрелами чистой магической энергии. Хоть палочка и не обладает какими-либо особыми эффектами, она имеет довольно много доступных зарядов и может на некоторое время усилить другие палочки после улучшения.
items.wands.wandofmagicmissile.stats_desc=Каждый выстрел из этой палочки наносит _%1$d-%2$d урона_ и на некоторое время усиливает другие палочки, если она улучшена.
items.wands.wandofmagicmissile.bmage_desc=Когда _%s_ %s, посох Магической стрелы частично заражает все палочки.
items.wands.wandofmagicmissile.eleblast_desc=Стихийный взрыв с посохом магической стрелы наносит 50% урона и дает магу 15 ходов перезарядки.
items.wands.wandofmagicmissile$magiccharge.name=магический заряд
items.wands.wandofmagicmissile$magiccharge.desc=Палочка Магической стрелы наполнила ваши палочки энергией, увеличив их уровень.\n\nВаши палочки улучшены на: +%d.\n\nХодов осталось: %s.

items.wands.wandofprismaticlight.name=палочка Чистого света
items.wands.wandofprismaticlight.staff_name=посох Чистого света
items.wands.wandofprismaticlight.desc=Эта палочка сделан из цельного куска прозрачного хрусталя. Она напоминает длинный кусок гладкого стекла. Цветные лучики света играют у навершия, стремясь вырваться вперёд.
items.wands.wandofprismaticlight.stats_desc=Эта палочка испускает луч света, наносящий _%1$d-%2$d урона_ и ослепляющий врагов. Свет также пронзает тьму подземелья, раскрывая скрытые двери и ловушки. Демоны и нежить загорятся чистым пламенем этой палочки, получая значительно больше урона.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Шанс ослепления
items.wands.wandofprismaticlight.upgrade_stat_name_3=Длительность света
items.wands.wandofprismaticlight.bmage_desc=Когда _%s_ %s, посох Чистого света временно калечит противника, увеличивая длительность эффекта в зависимости от уровня посоха.
items.wands.wandofprismaticlight.eleblast_desc=Стихийный взрыв с посохом чистого света наносит 67% урона, раскрывает местность и ослепляет врагов на 5 ходов.

items.wands.wandofregrowth.name=палочка Восстановления
items.wands.wandofregrowth.staff_name=посох Восстановления
items.wands.wandofregrowth.desc=Эта искусно обработанная палочка сделана из тонкого и искусно обработанного дерева. Каким-то образом дерево всё ещё живое и имеет ярко-зелёную окраску, как сердцевина молодого дерева. "Когда угасает жизнь, всегда начинается новая жизнь... Вечный цикл всегда остается!"
items.wands.wandofregrowth.stats_desc=При использовании эта палочка выстрелит зарядом возрождающей энергии в конусовидной области, взывая траву, корни и редкие растения к жизни. Следующее использование поглотит _%1$d зарядов_. Чем больше зарядов потребляет эта палочка, тем больше и сильнее становится эффект.
items.wands.wandofregrowth.degradation=После использования еще _%d зарядов_ эта палочка перестанет производить растения и новую траву. Это ограничение можно повысить, повышая свой уровень или уровень палочки.
items.wands.wandofregrowth.upgrade_stat_name_1=Травы за заряд
items.wands.wandofregrowth.upgrade_stat_name_2=Общий лимит травы
items.wands.wandofregrowth.bmage_desc=Когда _%s_ %s, посох Восстановления наделяет Травяным исцелением пропорционально нанесенному урону, если враг или владелец стоит на траве.
items.wands.wandofregrowth.eleblast_desc=Стихийный взрыв с посохом восстановления опутывает врагов и беспорядочно выращивает траву в области взрыва.
items.wands.wandofregrowth$dewcatcher.name=Росянка
items.wands.wandofregrowth$dewcatcher.desc=Росянки - удивительные растения, наполняющиеcя волшебной росой. Чтобы не привлекать внимание, они маскируются под траву, но их выдают наполненные росой выпуклости.
items.wands.wandofregrowth$seedpod.name=Семяловка
items.wands.wandofregrowth$seedpod.desc=Семяловки - это волшебные растения, которые производят семена других видов растений, вместо своих собственных. Каким-то образом им удается распространяться, несмотря на отсутствие собственных семян.
items.wands.wandofregrowth$lotus.name=Золотой Лотос
items.wands.wandofregrowth$lotus.desc=Золотой лотос — это мистическое растение, которое может быть вызвано только мощной палочкой восстановления. Его аура усиливает все растения и их эффекты, но он быстро сжигает свою энергию и скоропостижно умирает.
items.wands.wandofregrowth$lotus.wand_info=Этот лотос был создан палочкой Восстановления, усиленной на _%1$d_. Эффекты всех растений _работают моментально_, если они были посажены на клетку с персонажем. Кроме того, есть _%2$d%% шанс_ получить семя с растения, а также смазанные дротики будут использовать на _%3$d%% меньше прочности_.

items.wands.wandoftransfusion.name=палочка Трансфузии
items.wands.wandoftransfusion.staff_name=посох Трансфузии
items.wands.wandoftransfusion.error=Ваша палочка не может излечивать боссов или использовать свой эффект, когда находится на 5 этаже!
items.wands.wandoftransfusion.ondeath=Вы убились собственной палочкой Трансфузии...
items.wands.wandoftransfusion.charged=Ваш посох заряжен жизненной энергией вашего противника!
items.wands.wandoftransfusion.desc=Хотя эта палочка довольно проста на вид, она выделяется за счёт пурпурного оттенка и угольно-чёрного камня на ее навершии.
items.wands.wandoftransfusion.stats_desc=При использовании на союзниках или очарованных врагах эта палочка забирает _%1$d здоровья пользователя_, чтобы вылечить или защитить союзника на _%2$d здоровья._ При использовании на врагов палочка на короткое время зачаровывает их, одновременно применяя _%3$d защиты_ к пользователю. Враждебная нежить получит _%4$d-%5$d урона_ вместо того, чтобы быть очарованной.
items.wands.wandoftransfusion.upgrade_stat_name_1=Исцеление союзника
items.wands.wandoftransfusion.upgrade_stat_name_2=Самозащита
items.wands.wandoftransfusion.upgrade_stat_name_3=Урон по нежити
items.wands.wandoftransfusion.bmage_desc=Когда _%s_ %s, посох Трансфузии наделяет щитом, и следующее применение этого посоха не отнимает здоровья.
items.wands.wandoftransfusion.eleblast_desc=Стихийный взрыв с посохом трансфузии очаровывает врагов, лечит союзников и наносит 100% урона нежити.

items.wands.wandofwarding.name=палочка Стражей
items.wands.wandofwarding.staff_name=посох Стражей
items.wands.wandofwarding.no_more_wards=Ваша палочка не может поддерживать большее количество стражей.
items.wands.wandofwarding.bad_location=Вы не можете разместить здесь стража.
items.wands.wandofwarding.desc=Это короткая металлическая палочка с ярко-фиолетовым драгоценным камнем, парящим возле ее наконечника.
items.wands.wandofwarding.stats_desc=Вместо того, чтобы наносить прямой урон, эта палочка будет призывать стражей и часовых. Стражи могут быть размещены в любом видимом для вас месте, даже через стены. Эта палочка имеет только _%d ед. энергии_ на поддержку стражей.
items.wands.wandofwarding.upgrade_stat_name_1=Урон стража
items.wands.wandofwarding.upgrade_stat_name_2=Энергия стража
items.wands.wandofwarding.bmage_desc=Когда _%s_ %s, у посоха Стражей, появляется шанс исцелить всех стражей.
items.wands.wandofwarding.eleblast_desc=Стихийный взрыв с посохом стражей лечит всех часовых в зоне взрыва.
items.wands.wandofwarding$ward.desc_generic_ward=Этот страж будет автоматически атаковать любого врага, что попадет в его поле зрения.\n\nИспользование палочки стражей на вашего стража улучшит его.\n\nСтражи атакуют ограниченное количество раз, а затем исчезают.
items.wands.wandofwarding$ward.desc_generic_sentry=Этот часовой обладает такой же боевой мощью, что и страж, но имеет очки здоровья вместо установленного количества зарядов. Он напоминает драгоценный камень на кончике вашей палочки стражей.\n\nИспользование палочки стражей на вашего часового улучшит и исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку стражей.
items.wands.wandofwarding$ward.name_1=малый страж
items.wands.wandofwarding$ward.desc_1=Этот стандартный страж будет автоматически атаковать любого врага, что попадет в его поле зрения, нанося _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего стража улучшит его.\n\nЭтот страж атакует лишь раз, а затем исчезнет.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого стража.
items.wands.wandofwarding$ward.name_2=средний страж
items.wands.wandofwarding$ward.desc_2=Этот улучшенный страж имеет более сложное поведение и способен атаковать несколько раз. Каждая атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего стража улучшит его.\n\nЭтот страж атакует три раза, а затем исчезнет.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого стража.
items.wands.wandofwarding$ward.name_3=большой страж
items.wands.wandofwarding$ward.desc_3=Этот максимально улучшенный страж способен атаковать большее количество раз, чем его предшественники. Каждая атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего стража улучшит его.\n\nЭтот страж атакует пять раз, а затем исчезнет.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого стража.
items.wands.wandofwarding$ward.name_4=малый часовой
items.wands.wandofwarding$ward.desc_4=Этот небольшой часовой обладает такой же боевой мощью, что и большой страж, но имеет очки здоровья вместо установленного количества зарядов. Он напоминает драгоценный камень на кончике вашей палочки стражей. Каждая его атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки стражей на вашего часового улучшит и исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку стражей.\n\nПалочка стражей использует _%3$d ед. энергии_ для поддержания этого часового.
items.wands.wandofwarding$ward.name_5=средний часовой
items.wands.wandofwarding$ward.desc_5=Этот улучшенный часовой больше и немного прочнее, чем малый часовой. Каждая его атака будет наносить _%1$d-%2$d урона._\n\nИспользование палочки Стражей на вашего часового улучшит и исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку Стражей.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого часового.
items.wands.wandofwarding$ward.name_6=большой часовой
items.wands.wandofwarding$ward.desc_6=Этот максимально улучшенный часовой значительно прочнее, чем его предшественники. Каждая его атака будет наносить _%1$d-%2$dурона._\n\nИспользование палочки Стражей на вашего часового исцелит его.\n\nЧасовой будет тратить немного здоровья каждый раз, когда атакует врага, но его можно вылечить, используя палочку Стражей.\n\nПалочка Стражей использует _%3$d ед. энергии_ для поддержания этого часового.
items.wands.wandofwarding$ward.dismiss_title=Отозвать этого стража?
items.wands.wandofwarding$ward.dismiss_body=Вы можете уничтожить этого стража, если больше не хотите, чтобы ваша палочка тратила энергию на его поддержку.\n\nОтозвать этого стража?
items.wands.wandofwarding$ward.dismiss_confirm=Да
items.wands.wandofwarding$ward.dismiss_cancel=Нет

items.wands.selectablewand.name = таинственная палочка
items.wands.selectablewand.desc = Вы чувствуете, что эта палочка источает особую магию, и похоже, в ваших руках она способна превратится другую случайную палочку.
items.wands.selectablewand.ac_spawn = ПРЕВРАТИТЬ
items.wands.selectablewand$wandsetting.create = Превратить
items.wands.selectablewand$wandsetting.cancel = Отменить

###weapon curses
items.weapon.curses.annoying.name=%s болтливости
items.weapon.curses.annoying.msg_1=О-О-О, МЫ ЩАС БУДЕМ ДРАТЬСЯ?!
items.weapon.curses.annoying.msg_2=ДА, ВДАРЬ ИМ!
items.weapon.curses.annoying.msg_3=ЭЙ, ПОСЛУШАЙ!
items.weapon.curses.annoying.msg_4=МЫ УЖЕ У БОССА?!
items.weapon.curses.annoying.msg_5=ОЙ, НЕ МАХАЙ МНОЙ ТАК СИЛЬНО!
items.weapon.curses.annoying.msg_6=УМРИ, БУКАШКА!
items.weapon.curses.annoying.msg_7=УУУУУУУУУУУУУУУХ!
items.weapon.curses.annoying.msg_8=ДАВАЙ ПЕРЕДОХНЕМ!?
items.weapon.curses.annoying.msg_9=БАЦ, ХАХА!
items.weapon.curses.annoying.msg_10=ДОБРОТНЫЙ УДАР!
items.weapon.curses.annoying.msg_11=Я не собирался быть оружием, я хотел просто быть топором дровосека.
items.weapon.curses.annoying.msg_12=Не забывайте: чрезмерная самоуверенность это медленный и коварный убийца.
items.weapon.curses.annoying.msg_13=ВСЕ ВАША БАЗА ПРИНАДЛЕЖАТЬ НАМ!
items.weapon.curses.annoying.desc=Болтливое оружие способно разговаривать. Точнее, оно ОБОЖАЕТ разговаривать, чем нередко может привлечь излишнее внимание.
items.weapon.curses.annoying.elestrike_desc=Стихийный удар с проклятием болтливости с вероятностью 20% может привести в бешенство каждого врага в радиусе действия на 6 ходов.

items.weapon.curses.dazzling.name=%s ослепления
items.weapon.curses.dazzling.desc=Ослепляющие орудия иногда создают вспышку света, ослепляющую всех, кто её увидит.
items.weapon.curses.dazzling.elestrike_desc=Стихийный удар с проклятием ослепления с вероятностью 50% ослеплит всех врагов в радиусе действия на 6 ходов.

items.weapon.curses.displacing.name=%s телепортации
items.weapon.curses.displacing.desc=Оружие телепортации наполнено непредсказуемой магией, оно может переместить врага в случайное место.
items.weapon.curses.displacing.elestrike_desc=Стихийный удар с проклятием телепортации с вероятностью 50% переносит каждого врага в радиусе действия.

items.weapon.curses.explosive.name=%s подрыва
items.weapon.curses.explosive.warm=Тепло...
items.weapon.curses.explosive.hot=Горячо!
items.weapon.curses.explosive.desc=Взрывные орудия накапливают заряд и взрываются, нанося урон носителю и врагу.
items.weapon.curses.explosive.desc_cool=Ваше орудие холодное.
items.weapon.curses.explosive.desc_warm=Ваше орудие накапливает энергию и становится теплее...
items.weapon.curses.explosive.desc_hot=Ваше орудие горячее! Оно вот-вот взорвется!
items.weapon.curses.explosive.elestrike_desc=Стихийный удар с проклятием подрыва с вероятностью 50% взрывает случайного врага в радиусе действия.


items.weapon.curses.friendly.name=%s дружелюбия
items.weapon.curses.friendly.desc=Оружия дружелюбия больше всего подходят пацифистам, иногда накладывая чары, предотвращающие конфликт.
items.weapon.curses.friendly.elestrike_desc=Стихийный удар с проклятием дружелюбия с вероятностью 50% может очаровать всех врагов в радиусе действия на 6 ходов.

items.weapon.curses.polarized.name=%s поляризации
items.weapon.curses.polarized.desc=Поляризованное оружие при атаке наносит либо на 50% больше урона, либо не наносит урона вообще.
items.weapon.curses.polarized.elestrike_desc=Стихийный удар с проклятием поляризации с вероятностью 50% наносит 24-36 урона каждому врагу в радиусе действия.

items.weapon.curses.sacrificial.name=%s страданий
items.weapon.curses.sacrificial.desc=Оружие страданий требует крови атакующего за то, что само наносит урон. Чем здоровее атакующий, тем больше крови оно потребует.
items.weapon.curses.sacrificial.elestrike_desc=Стихийный удар с проклятием страданий даёт герою и каждому врагу в радиусе действия кровотечение на 12 здоровья.

items.weapon.curses.exhausting.name=%s утомляемости
items.weapon.curses.exhausting.desc=Оружие утомляемости требует больше сил для его использования, и поэтому его владелец периодически может чувствовать слабость.

items.weapon.curses.fragile.name=%s кристаллизации
items.weapon.curses.fragile.desc=Кристаллизованное оружие почти так же мощно, как и любое другое, но его эффективность быстро быстро снижается в процессе использования.

items.weapon.curses.wayward.name=%s упрямства
items.weapon.curses.wayward.desc=Оружие упрямства иногда уводит ваши удары в сторону. Эта магия действует некоторое время после её активации, но может быть рассеяна при нанесении удара этим орудием.
items.weapon.curses.wayward.elestrike_desc=Стихийный удар с проклятьем упрямства имеет 50% шанс активироваться на каждом враге в радиусе действия на 6 ходов.
items.weapon.curses.wayward$waywardbuff.name=упрямство
items.weapon.curses.wayward$waywardbuff.desc=Магия вашего орудия упрямости активировалась, из-за чего нанести удар будет сложно некоторое время. Однако это не влияет на гарантированные атаки, например неожиданные атаки. Успешная атака с помощью этого орудия уберет этот эффект.\n\nОсталось ходов: %s.

###enchantments
items.weapon.enchantments.blazing.name=%s пламени
items.weapon.enchantments.blazing.desc=Эти чары заставляют оружие извергать пламя, поджигая врагов и нанося дополнительный урон противникам, которые уже горят.

items.weapon.enchantments.blocking.name=%s обороны
items.weapon.enchantments.blocking.desc=Это зачарование усиливает вашу способность защищаться после атаки с помощью этого оружия.
items.weapon.enchantments.blocking$blockbuff.name=оборона
items.weapon.enchantments.blocking$blockbuff.desc=Зачарование обороны на вашем оружии ненадолго усилило вашу броню щитом!\n\nБонус к броне: 0-%d.\n\nОсталось ходов: %s.

items.weapon.enchantments.blooming.name=%s цветения
items.weapon.enchantments.blooming.desc=При каждом ударе цветущим оружием есть шанс, что рядом с целью вырастет трава.

items.weapon.enchantments.chilling.name=%s холода
items.weapon.enchantments.chilling.desc=Враги, пораженные этим зачарованием, коченеют от холода, их скорость атаки и передвижения снижается.

items.weapon.enchantments.kinetic.name=%s инерции
items.weapon.enchantments.kinetic.desc=Когда оружие инерции убивает врага, оно сохраняет избыточный урон чтобы добавить его к следующей успешной атаке.
items.weapon.enchantments.kinetic$conserveddamage.name=инерция
items.weapon.enchantments.kinetic$conserveddamage.desc=Ваше оружие сохранило избыточный урон от предыдущего убийства и добавит его к вашей следующей атаке. Со временем, этот бонус будет постепенно уменьшаться.\n\nСохраненный урон: %d.

items.weapon.enchantments.corrupting.name=%s подчинения
items.weapon.enchantments.corrupting.desc=Это мощное зачарование обладает способностью подчинять врагов вашей воле. Когда враг убит этим оружием, есть вероятность, что вместо смерти он будет подчинен.

items.weapon.enchantments.elastic.name=%s отталкивания
items.weapon.enchantments.elastic.desc=Отталкивающее оружие дает шанс отбросить противника на некоторое расстояние.

items.weapon.enchantments.grim.name=%s погибели
items.weapon.enchantments.grim.desc=Это могущественное зачарование имеет силы мгновенно прикончить врага. Чем он слабее - тем выше вероятность срабатывания.

items.weapon.enchantments.lucky.name=%s удачи
items.weapon.enchantments.lucky.desc=Убитые оружием удачи враги могут оставлять дополнительные трофеи.

items.weapon.enchantments.precise.name=%s точности
items.weapon.enchantments.precise.desc=Точное оружие имеет шанс гарантированно поразить противника, несмотря ни на что.

items.weapon.enchantments.projecting.name=%s проекции
items.weapon.enchantments.projecting.desc=С этим зачарованием оружие ближнего боя сможет бить дальше, а дальнего - проходить сквозь ближайшие стены.

items.weapon.enchantments.shocking.name=%s молний
items.weapon.enchantments.shocking.desc=Разряды электричества от оружия молний наносят дополнительный урон врагам поблизости.

items.weapon.enchantments.unstable.name=%s хаоса
items.weapon.enchantments.unstable.desc=Это зачарование излучает хаотическую энергию, давая непредвиденный результат при каждой атаке.

items.weapon.enchantments.vampiric.name=%s вампиризма
items.weapon.enchantments.vampiric.desc=Это могущественное зачарование с каждым ударом вытягивает жизненные силы врагов и передает их владельцу. Чем меньше здоровья у того, кто его носит, тем сильнее этот эффект.

items.weapon.enchantments.haloblazing.name=%s фосфорности
items.weapon.enchantments.haloblazing.desc=Эти чары заставляют оружие извергать фосфорное пламя, поджигая врагов и нанося дополнительный урон противникам, которые уже горят.

items.weapon.enchantments.deadbomb.name=%s правосудия
items.weapon.enchantments.deadbomb.desc=Это зачарование высвобождает мощь правосудия из оружия, помечая одного врага и преобразуя его %s%% максимального здоровья в равное количество физического урона всем видимым врагам после смерти помеченной цели.
items.weapon.enchantments.deadbomb$targetdead.name=метка обреченного
items.weapon.enchantments.deadbomb$targetdead.desc=Только смерть способна принести облегчение.\n\nНоситель с данной меткой получает не умирая огромный урон от первой атаки, а если вторая атака применена оружием с зачарованием правосудия, она мгновенно убивает цель и активирует последующий эффект.

items.weapon.enchantments.crushing.name=%s разрушения
items.weapon.enchantments.crushing.desc=Это зачарование доводит своего владельца до безумия, заставляя взрывную энергию вырываться из оружия, нанося урон в определенной области и иногда даже калеча противника.
items.weapon.enchantments.crushing.kill=%2$s: почувствуй взрыв, %1$s! Сегодня твоя погибель, ха-ха-ха-ха...
items.weapon.enchantments.crushing.kill1=%2$s: знаешь, %1$s! Я не буду притворятся, я знаменитый бог разрушения...
items.weapon.enchantments.crushing.kill3=%2$s: убирайся, пока я не досчитал до трёх, %1$s! 3! Ба-бах!...
items.weapon.enchantments.crushing.kill4=%2$s: я - смерть разрушитель миров, %1$s!
items.weapon.enchantments.crushing.kill5=%2$s: слушай сюда, %1$s! Отправь эту посылку своим соплеменникам, пусть знают что со мной шутки плохи!
items.weapon.enchantments.crushing.kill6=%2$s: теперь я твой заклятый враг, %1$s! Передавай привет чертям в аду!

items.weapon.enchantments.timereset.name=%s возврата
items.weapon.enchantments.timereset.desc=Это зачарование вызывает ударную волну на врагов в пределах видимости, заставляя их игнорировать действия героя в течение нескольких ходов, и способно накладывать эффект рассудка с вредом внутреннего демона.

###melee weapons
items.weapon.melee.assassinsblade.name=клинок убийцы
items.weapon.melee.assassinsblade.stats_desc=Это оружие эффективнее при скрытных атаках.
items.weapon.melee.assassinsblade.desc=Небольшое волнистое лезвие из обсидиана. Несмотря на лёгкий вес, оно неудобно в применении, но смертоносно при точном ударе.

items.weapon.melee.battleaxe.name=боевой топор
items.weapon.melee.battleaxe.stats_desc=Это довольно меткое оружие.
items.weapon.melee.battleaxe.desc=Огромное стальное лезвие этого топора позволяет наносить удары с устрашающей силой.

items.weapon.melee.crossbow.name=арбалет
items.weapon.melee.crossbow.stats_desc=Это оружие, будучи экипированным, увеличивает урон от дротиков и даже наделяет их своим зачарованием.
items.weapon.melee.crossbow.desc=Замысловатое оружие, позволяющее стрелять дротиками со значительной силой. Хоть арбалет и не предназначен для ближнего боя, но его вес и прочность позволяют использовать его как дубину.
items.weapon.melee.crossbow.ability_name=заряженный выстрел
items.weapon.melee.crossbow.ability_desc=Дуэлянт может подготовить _заряженный выстрел_ из арбалета. Эта способность активируется мгновенно и гарантирует попадание следующего дротика по врагу, применяя все эффекты атаки в радиусе 5х5 клеток и продлевая эффекты от смазанных дротиков.
items.weapon.melee.crossbow.typical_ability_desc=Дуэлянт может подготовить _заряженный выстрел_ из арбалета. Эта способность активируется мгновенно и гарантирует попадание следующего дротика по врагу, применяя все эффекты атаки в радиусе 5х5 клеток и продлевая эффекты от смазанных дротиков.
items.weapon.melee.crossbow$chargedshot.name=заряженный выстрел
items.weapon.melee.crossbow$chargedshot.desc=艾诺琳娜正将能量集中于她的弩上。她用弩发射的下一发飞镖必定会命中，并在 5*5 的区域内触发它的涂药效果和弩的附魔效果。飞镖的增益效果只会影响友方，而负面效果只会作用于敌方。\n\n涂药飞镖也会在使用充能射击时获得 4 次额外的耐久。艾诺琳娜不能使用这个武技来让飞镖的增益对她自己生效。

items.weapon.melee.dagger.name=кинжал
items.weapon.melee.dagger.stats_desc=Это оружие эффективнее при скрытных атаках.
items.weapon.melee.dagger.desc=Простой деревянный кинжал с изношенной деревянной рукоятью.
items.weapon.melee.dagger.ability_name=спрятаться
items.weapon.melee.dagger.typical_ability_desc=Дуэлянт с кинжалом может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 5 клеток и обычно даёт _%d хода невидимости._
items.weapon.melee.dagger.ability_desc=艾诺琳娜握持匕首时可以_潜行_。这个武技能够使艾诺琳娜立即闪现最多5格远，并给予_%d回合隐形_。
items.weapon.melee.dagger.upgrade_ability_stat_name=武技持续时间
items.weapon.melee.dagger.discover_hint=某位英雄初始携带该物品。

items.weapon.melee.dirk.name=кортик
items.weapon.melee.dirk.stats_desc=Это оружие эффективнее при скрытных атаках.
items.weapon.melee.dirk.desc=Кортик длиннее обычного кинжала, поэтому позволяет наносить более глубокие раны.

items.weapon.melee.flail.name=кистень
items.weapon.melee.flail.stats_desc=这件武器不太精准。\n这件武器不能用来偷袭。
items.weapon.melee.flail.desc=Шипастый шар на цепи, присоединённой к рукояти. Крайне неуклюжее оружие, но сокрушительное при точном попадании.

items.weapon.melee.gauntlet.name=парные клинки
items.weapon.melee.gauntlet.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона.
items.weapon.melee.gauntlet.stats_desc=Это очень быстрое оружие.\n\nЭто оружие блокирует от 0 до %d урона.
items.weapon.melee.gauntlet.desc=碧绿的宝石加上纯黑的宝石再加上_矮人工匠—Mr.LunRes的_精湛技艺，造就了这个无与伦比的产物。它可以在攻击的时候有几率对敌人造成{鬼磷燃烧{效果，但同时会让攻击者有概率{获得3回合的眩晕{效果。不过，这个_武器的潜能_无比强大，因此它_需要的力量_也更加强大。如果武器等级+3以上，则没有反噬效果。

items.weapon.melee.glaive.name=глефа
items.weapon.melee.glaive.stats_desc=Это довольно медленное оружие.\nЭто оружие имеет повышенную дальность атаки.
items.weapon.melee.glaive.desc=Крупное древковое оружие с длинным клинком на конце.

items.weapon.melee.gloves.name=шипованные перчатки
items.weapon.melee.gloves.stats_desc=这是一套很快的武器。
items.weapon.melee.gloves.desc=Эти шипованные перчатки не обеспечивают никакой защиты, но они выступают в качестве неплохого оружия, оставляя руки свободными.

items.weapon.melee.greataxe.name=секира
items.weapon.melee.greataxe.stats_desc=Это невероятно тяжёлое оружие.
items.weapon.melee.greataxe.desc=Предназначенный для ношения на плече, этот массивный топор настолько же опасен, насколько тяжёл.

items.weapon.melee.greatshield.name=ростовой щит
items.weapon.melee.greatshield.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.greatshield.stats_desc=Это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.greatshield.desc=Больше похожий на переносную стену, этот гигантский лист металла обеспечивает отличную защиту, но не слишком подходит для нападения.

items.weapon.melee.greatsword.name=двуручный меч
items.weapon.melee.greatsword.ability_name=рассечь
items.weapon.melee.greatsword.typical_ability_desc=Дуэлянт может _рассечь_ врага двуручным мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.greatsword.ability_desc=艾诺琳娜可以用巨剑_顺劈_敌人，造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在5回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.greatsword.desc=Внушительный клинок этого меча придает его взмахам огромную силу.

items.weapon.melee.handaxe.name=ручной топор
items.weapon.melee.handaxe.stats_desc=Это довольно меткое оружие.
items.weapon.melee.handaxe.desc=Лёгкий топор, часто применяемый для рубки деревьев. Его широкое топорище неплохо справится и с врагами.
items.weapon.melee.handaxe.ability_name=мощный удар
items.weapon.melee.handaxe.typical_ability_desc=Дуэлянт может совершить _мощный удар_ ручным топором. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.handaxe.ability_desc=艾诺琳娜可以用手斧使出_重击_。这用尽全力的一击如果是在伏击敌人，则会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。

items.weapon.melee.knuckles.name=кастет
items.weapon.melee.knuckles.stats_desc=Это очень быстрое оружие.
items.weapon.melee.knuckles.desc=Кусок железа, хорошо подходящий к кулаку. Способен придать дополнительный вес вашим аргументам в любом споре.

items.weapon.melee.longsword.name=длинный меч
items.weapon.melee.longsword.desc=Длинный бритвенно-острый клинок этого меча успокаивающе блестит, хотя из-за своего размера он довольно тяжёл.

items.weapon.melee.mace.name=булава
items.weapon.melee.mace.stats_desc=Это довольно меткое оружие.
items.weapon.melee.mace.desc=Железное навершие этого оружия способно нанести значительные повреждения.

items.weapon.melee.magesstaff.name=посох Мага
items.weapon.melee.magesstaff.ac_imbue=НАДЕЛИТЬ
items.weapon.melee.magesstaff.ac_zap=ИСПОЛЬЗОВАТЬ
items.weapon.melee.magesstaff.prompt=Выберите палочку
items.weapon.melee.magesstaff.imbue=Вы используете %s для того, чтобы наделить ваш посох его силой.
items.weapon.melee.magesstaff.preserved=Предыдущая палочка была сохранена!
items.weapon.melee.magesstaff.preserved_resin=Предыдущая палочка была превращена в магическую смолу.
items.weapon.melee.magesstaff.conflict=Взаимодействие несовместимой магии развеивает зачарование на вашем посохе!
items.weapon.melee.magesstaff.id_first=Сперва вам нужно опознать эту палочку.
items.weapon.melee.magesstaff.no_wands=Вы не можете использовать такую палочку.
items.weapon.melee.magesstaff.cursed=Вы не можете использовать проклятую палочку.
items.weapon.melee.magesstaff.imbue_desc=Вы уверены, что хотите наделить свой посох силой этой палочки?\n\nЕсли наделяемая палочка имеет тот же или более высокий уровень, что и посох, посох унаследует уровень этой палочки плюс одно из его собственных улучшений.\n\nТаким образом, получится посох _%d уровня_.
items.weapon.melee.magesstaff.imbue_lost=Палочка, силой которой в данный момент наполнен ваш посох, _будет потеряна_.
items.weapon.melee.magesstaff.imbue_talent=Палочка, силой которой в данный момент наполнен ваш посох, _будет возвращена как +0_.
items.weapon.melee.magesstaff.yes=Да, я уверен
items.weapon.melee.magesstaff.no=Нет, я передумал
items.weapon.melee.magesstaff.desc=Созданный самим Магом, этот посох является уникальным волшебным оружием, которое может быть наделено силой любой палочки.
items.weapon.melee.magesstaff.ac_dismiss = РАССЕЯТЬ МИНИ-СОЛНЦЕ
items.weapon.melee.magesstaff.no_wand=Сейчас посох не имеет особой магии, его нужно _наделить силой палочки,_ чтобы получить возможность использовать заклинания.
items.weapon.melee.magesstaff.has_wand=Сейчас этот посох наделён той же силой, что и _%s._
items.weapon.melee.magesstaff.cursed_wand=Посох проклят, что делает его магию хаотичной и случайной.
items.weapon.melee.magesstaff.bd_desc=имеет выученный талант Многообразный удар
items.weapon.melee.magesstaff.bk_desc=атакует цель в ближнем бою

items.weapon.melee.meleeweapon.stats_known=Это оружие ближнего боя _%1$d-го уровня_ наносит _%2$d-%3$d ед. урона_ и требует _%4$d очков силы_ для эффективного использования.
items.weapon.melee.meleeweapon.stats_unknown=Это оружие ближнего боя _%1$d-го уровня_ обычно наносит _%2$d-%3$d ед. урона_ и требует _%4$d очков силы_ для эффективного использования.
items.weapon.melee.meleeweapon.probably_too_heavy=Вероятно, это оружие будет слишком тяжело для вас.
items.weapon.melee.meleeweapon.stats_desc=
items.weapon.melee.meleeweapon.cs=Способность (НЗП)

items.weapon.melee.shortsword.name=короткий меч
items.weapon.melee.shortsword.desc=Довольно короткий меч, всего на несколько дюймов длиннее кинжала.

items.weapon.melee.quarterstaff.name=боевой посох
items.weapon.melee.quarterstaff.stats_desc=Это оружие блокирует от 0 до 2 урона.
items.weapon.melee.quarterstaff.desc=Посох из крепкого дерева с нехилыми железными набалдашниками на обоих концах.

items.weapon.melee.roundshield.name=круглый щит
items.weapon.melee.roundshield.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.roundshield.stats_desc=Это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.roundshield.desc=Этот большой щит хорошо защищает от ударов и, в трудную минуту, может даже послужить вместо оружия.

items.weapon.melee.sai.name=клинок вампира
items.weapon.melee.sai.desc=Красноватая рукоять указывает на то, что это не то оружие, которым могут пользоваться обычные люди. Превосходно подходит для уничтожения врагов шквалом порезов, но немного уступает по точности.
items.weapon.melee.sai.attacker=Резкий удар, возвращает вам кровь!
items.weapon.melee.sai.stats_info=这是一套很快但很不精准的武器，持有时，你在迅猛一击的时将可以吸血!你上次吸血的结果为_%s_点
items.weapon.melee.sai.full=У вас сполна своей кровы!
items.weapon.melee.sai.success=%s делает резкий удар, возвращая себе кровь!

items.weapon.melee.scimitar.name=скимитар
items.weapon.melee.scimitar.stats_desc=Это довольно быстрое оружие.
items.weapon.melee.scimitar.desc=Широкий изогнутый клинок. Его форма позволяет наносить быстрые, но менее сильные атаки.
f
items.weapon.melee.spear.name=копьё
items.weapon.melee.spear.stats_desc=Это довольно медленное оружие.\nЭто оружие имеет повышенную дальность атаки.
items.weapon.melee.spear.desc=Тонкая длинная палка с куском заостренного железа на конце.
items.weapon.melee.spear.ability_name=пронзить
items.weapon.melee.spear.typical_ability_desc=艾诺琳娜用长矛_刺退_在射程内但不与艾诺琳娜相邻的敌人，造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
items.weapon.melee.spear.ability_desc=艾诺琳娜用长矛_刺退_在射程内但不与艾诺琳娜相邻的敌人，造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。

items.weapon.melee.sword.name=меч
items.weapon.melee.sword.desc=Прекрасно сбалансированный меч. Не очень большой, но всё же длиннее короткого меча.

items.weapon.melee.withewoodsword.name=меч из белого дерева
items.weapon.melee.withewoodsword.desc=Большой меч, отличающийся величественным и достойным внешним видом, изготовлен из бруса белой древесины.\n\nВсякий противник перед ним, скорее всего, будет в ужасе, оглушен и подожжён. Эти эффекты становиться все мощнее по мере повышения уровня оружия. Однако, если уровень оружие меньше +3, атаки будут иногда иметь и обратный эффект.
items.weapon.melee.warhammer.stats_desc=Это довольно меткое оружие.

items.weapon.melee.icelingsword.name=ледяной кинжал
items.weapon.melee.icelingsword.stats_desc=这把武器拥有_惊人的攻击距离_，和极其精准的精准度，并且可能对_敌人造成冻伤效果_。
items.weapon.melee.icelingsword.desc=Простой и довольно меткий кинжал, долгие годы подвергался воздействию морозной среде подземелья, благодаря чему и приобрел свою новую особенность.
items.weapon.melee.icelingsword.ability_name=хлестнуть
items.weapon.melee.icelingsword.ability_desc=艾诺琳娜可以用冰澪匕首_狠抽_她周围的所有敌人。这一武技一般会对当前每个处于攻击距离内的敌人都造成_%1$d~%2$d点伤害_，并且必定命中。
items.weapon.melee.icelingsword.typical_ability_desc=艾诺琳娜可以用冰澪匕首_狠抽_她周围的所有敌人。这一武技对当前每个处于攻击距离内的敌人都造成_%1$d~%2$d点伤害_，并且必定命中。

items.weapon.melee.wornshortsword.name=изношенный короткий меч
items.weapon.melee.wornshortsword.desc=Довольно короткий меч, уже сильно изношенный из-за длительного использования. Он слабее и немного легче обычного короткого меча лучшего состояния.

items.weapon.melee.merchantsword.name=商人佩剑
items.weapon.melee.merchantsword.desc=它通常作为商人之间用来互相证明身份的道具，但在应急情况下你也可以把它当做武器。\n\n这把武器目前可以使地摊商品_全面降价%s%%_，最高降价90%%。
items.weapon.melee.merchantsword.ability_name=劫掠
items.weapon.melee.merchantsword.typical_ability_desc=艾诺琳娜可用商人佩剑_劫掠_一个敌人。对目标造成_100%伤害_，最终加成不超过200%。如果此次攻击击杀了一个单位，那么额外掉落一份基于_层数的金币_。
items.weapon.melee.merchantsword.ability_desc=艾诺琳娜可用商人佩剑进入_劫掠_。对目标造成_%s%%伤害_，最终加成不超过_200%%_。如果此次攻击击杀了一个单位，那么额外掉落一份基于_层数的金币_。

items.weapon.melee.spikedwheel.name = шипастое колесо
items.weapon.melee.spikedwheel.desc = Когда колёса в идеальном состоянии, а шасси сломано.\n\nЭто оружие дополнительно блокирует и наносит _%1$d-%2$d_ ед. урона.

items.weapon.melee.regicide.name = цареубийца
items.weapon.melee.regicide.desc = Оно всегда возвращается в руки того, кого оно избрало.

###melee weapons
items.weapon.melee.assassinsblade.ability_name=спрятаться
items.weapon.melee.assassinsblade.ability_desc=Дуэлянт с клинком убийцы может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 4 клеток и даёт 1 ход невидимости, но стоит 2 заряда оружия.

items.weapon.melee.battleaxe.ability_name=мощный удар
items.weapon.melee.battleaxe.ability_desc=Дуэлянт может совершить _мощный удар_ боевым топором. Эта сильная атака при точном ударе наносит на 35% больше урона и ошеломляет цель на 5 ходов, снижая её точность и уклонение на 50%. Обычное использование способности поглотит 2 заряда оружия, в то время как неожиданная атака не потратит энергию.

items.weapon.melee.legend.kingaxe.ability_name=ренессанс
items.weapon.melee.legend.kingaxe.ability_desc=Дуэлянт может совершить _ренессанс_ королевской секирой. Эта сильная атака при точном ударе наносит на 65% больше урона и ошеломляет цель на 5 ходов, снижая её точность и уклонение на 50%. Обычное использование способности поглотит 2 заряда оружия, в то время как неожиданная атака не потратит энергию.

items.weapon.melee.dirk.ability_name=спрятаться
items.weapon.melee.dirk.ability_desc=Дуэлянт с кортиком может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 5 клеток и даёт 1 ход невидимости, но стоит 2 заряда оружия.

items.weapon.melee.flail.ability_name=вращать
items.weapon.melee.flail.spin_warn=Вы больше не можете вращать кистень.
items.weapon.melee.flail.ability_desc=Дуэлянт может _вращать_ кистень, чтобы увеличить его силу на короткое время. Пока действует этот эффект, атаки кистенью наносят +33% дополнительного урона и гарантированно попадают в цель. Раскрутка длится три хода. Начать крутить кистень стоит 2 заряда оружия.

items.weapon.melee.flail$spinabilitytracker.name=вращение
items.weapon.melee.flail$spinabilitytracker.desc=Дуэлянт раскручивает свой кистень, увеличивая урон следующей атаки этим оружием. Каждое вращение занимает 1 ход, но увеличивает урон на 33%%. Раскрученный кистень гарантированно попадет в цель.\n\nТекущий бонус к урону: %1$d%%.\nХодов осталось: %2$s.

items.weapon.melee.gauntlet.ability_name=двойной удар
items.weapon.melee.gauntlet.ability_desc=Дуэлянт может совершить _двойной удар_ клинками. Эта атака гарантированно попадёт в цель и нанесет на 35% больше урона за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием за последние 5 ходов.

items.weapon.melee.glaive.ability_name=пронзить
items.weapon.melee.glaive.ability_desc=Дуэлянт, используя наконечник глефы, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака наносит на 30% урона больше, отталкивает противника и гарантированно попадает в цель.

items.weapon.melee.gloves.ability_name=двойной удар
items.weapon.melee.gloves.ability_desc=Дуэлянт может совершить _двойной удар_ шипованными перчатками. Эта атака гарантированно попадёт в цель и нанесет на 45% больше урона за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием за последние 5 ходов.

items.weapon.melee.greataxe.ability_name=возмездие
items.weapon.melee.greataxe.ability_desc=Дуэлянт может совершить _удар возмездия_ секирой, если у неё меньше 50% здоровья. Эта уничтожающая всё и вся атака гарантированно попадает в цель и наносит на 50% урона больше.

items.weapon.melee.dairikyan.ability_name=кровь за кровь
items.weapon.melee.dairikyan.ability_desc=Дуэлянт может совершить _кровь за кровь_ боевыми топорами, если у неё меньше 40% здоровья. Эта уничтожающая всё и вся атака гарантированно попадает в цель и наносит на 20% урона больше, а сам Дуэлянт имеет 10% шанс получить адреналин на 3 хода.

items.weapon.melee.greatshield.ability_name=защититься
items.weapon.melee.greatshield.ability_desc=Дуэлянт может _защитить_ себя ростовым щитом, становясь полностью неуязвимой к следующей физической или магической атаке в течение 10 ходов.

items.weapon.melee.skyshield.ability_name=защититься
items.weapon.melee.skyshield.ability_desc=Дуэлянт может _защитить_ себя треугольным щитом, становясь полностью неуязвимой к следующей физической или магической атаке в течение 4 ходов.



items.weapon.melee.katana.name=катана
items.weapon.melee.katana.stats_desc=Это оружие блокирует от 0 до 3 урона.
items.weapon.melee.katana.ability_name=выпад
items.weapon.melee.katana.ability_desc=Дуэлянт с катаной может сделать _выпад_ в сторону врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, наносит ему на 35% больше урона и гарантированно попадает в цель.
items.weapon.melee.katana.desc=Тонкий меч с большой металлической гардой над рукоятью.

items.weapon.melee.longsword.ability_name=рассечь
items.weapon.melee.longsword.ability_desc=Дуэлянт может _рассечь_ врага длинным мечом. Эта атака наносит на 23% урона больше и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.

items.weapon.melee.meleeweapon.ac_ability=СПОСОБНОСТЬ
items.weapon.melee.meleeweapon.ability_occupied=Это место занято.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Урон способности
items.weapon.melee.meleeweapon.ability_need_equip=Вы должны экипировать это оружие, чтобы использовать его способность.
items.weapon.melee.meleeweapon.ability_low_str=Вы недостаточно сильны чтобы использовать способность этого оружия.
items.weapon.melee.meleeweapon.ability_no_charge=У вас недостаточно энергии чтобы использовать эту способность.
items.weapon.melee.meleeweapon.ability_cant_use=Вы не можете использовать эту способность сейчас.
items.weapon.melee.meleeweapon.ability_no_target=Там нет цели.
items.weapon.melee.meleeweapon.ability_target_range=Эта цель недосягаема.
items.weapon.melee.meleeweapon.ability_bad_position=Эта цель недосягаема.
items.weapon.melee.meleeweapon.prompt=Выберите Цель
items.weapon.melee.meleeweapon.swap=Поменять Оружия
items.weapon.melee.meleeweapon.ability_not_desc=Данная способность находится в разработке, ожидайте её в будущих обновлениях!
items.weapon.melee.meleeweapon.swap_full=Вы не можете делать это с полным инвентарем.
items.weapon.melee.meleeweapon.swap_cannot=主手武器已与你融为一体，无法进行切换！

items.weapon.melee.shortsword.ability_name=рассечь
items.weapon.melee.shortsword.ability_desc=Дуэлянт может _рассечь_ врага коротким мечом. Эта атака наносит на 30% урона больше и гарантированно попадает. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.

items.weapon.melee.quarterstaff.ability_name=встать в стойку
items.weapon.melee.quarterstaff.ability_desc=Дуэлянт может принять _защитную стойку_ со своим боевым посохом. Стойка удваивает шанс уклонения на 5 ходов и активируется мгновенно, но стоит 2 заряда оружия.

items.weapon.melee.quarterstaff$defensivestance.name=стоит в стойке
items.weapon.melee.quarterstaff$defensivestance.desc=Дуэлянт использует свой боевой посох для защиты от ударов и выстрелов. Пока она в своей стойке, шанс уклонения от атак утроен.\n\nХодов осталось: %s.

items.weapon.melee.rapier.name=шпага
items.weapon.melee.rapier.stats_desc=Это оружие блокирует от 0 до 1 урона.
items.weapon.melee.rapier.ability_name=выпад
items.weapon.melee.rapier.ability_desc=Дуэлянт может шпагой сделать _выпад_ во врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.weapon.melee.rapier.desc=Тонкий и длинный меч, который обеспечивает защиту взамен на рубящую силу.

items.weapon.melee.roundshield.ability_name=защититься
items.weapon.melee.roundshield.ability_desc=Дуэлянт может _защитить_ себя круглым щитом, становясь полностью неуязвимой к следующей физической или магической атаке в течение 8 ходов.

items.weapon.melee.roundshield$guardtracker.name=защищается
items.weapon.melee.roundshield$guardtracker.guarded=под защитой
items.weapon.melee.roundshield$guardtracker.desc=Дуэлянт подготовила свой щит в ожидании атак. Она неуязвима к следующим физическим или магическим атакам.\n\nХодов осталось: %s.

items.weapon.melee.sai.ability_name=двойной удар
items.weapon.melee.sai.ability_desc=艾诺琳娜可以使用吸血鬼刀进行_连击_。这次攻击必定命中，并且艾诺琳娜在前 5 回合之内，每使用近战或者投掷武器成功命中一次，这次攻击的伤害就增加 %s%%。

items.weapon.melee.sai$combostriketracker.name=двойной удар
items.weapon.melee.sai$combostriketracker.desc=Дуэлянт совершает комбо, которое может быть использовано для увеличения урона от способности "двойной удар". Засчитывается каждый удар, нанесенный оружием ближнего боя или метательным оружием в течение последних 5 ходов.\n\nКоличество попаданий: %d.


items.weapon.melee.scimitar.ability_name=танец меча
items.weapon.melee.scimitar.ability_desc=艾诺琳娜可用弯刀进入_剑舞_。进入这个姿态不消耗时间，并使艾诺琳娜一般在_%d回合_内_攻击速度+60%%_且_精准+50%%_。

items.weapon.melee.scimitar$sworddance.name=танец меча
items.weapon.melee.scimitar$sworddance.desc=艾诺琳娜正以一种舞蹈的形式展开疾风骤雨般的攻击。当这个架势激活时，她的_攻击速度增加 60%%_ （在使用弯刀的情况下刚好足以一回合攻击两次），且具有_  +25%% 的命中率_。\n\n剩余回合数：%s

items.weapon.melee.sickle.name=серп
items.weapon.melee.sickle.stats_desc=这是一把很不精准的武器。
items.weapon.melee.sickle.ability_name=жатва
items.weapon.melee.sickle.ability_desc=Дуэлянт с серпом может совершить _разрез_, нанося смертельные раны всем попавшим под удар врагам. Эта разрушительная атака вызывает кровотечение, равное 110% урона, и гарантированно попадает в цель. Активация способности поглотит 2 заряда оружия.
items.weapon.melee.sickle.desc=Ручной сельскохозяйственный инструмент, который можно использовать как мощное, но громоздкое оружие.

items.weapon.melee.withewoodsword.ability_name=мощный удар
items.weapon.melee.withewoodsword.ability_desc=Дуэлянт может совершить _мощный удар_ мечом. Эта сильная атака при точном ударе наносит на 40% больше урона и ошеломляет цель на 5 ходов, снижая ее точность и уклонение на 50%. Обычное использование способности поглотит 2 заряда оружия, в то время как неожиданная атака не потратит энергию.
items.weapon.melee.withewoodsword.typical_ability_desc=Дуэлянт может совершить _мощный удар_ мечом. Эта сильная атака при точном ударе обычно наносит на 40%% больше урона и ошеломляет цель на 5 ходов, снижая ее точность и уклонение на 50%. Обычное использование способности поглотит 2 заряда оружия, в то время как неожиданная атака не потратит энергию.


items.weapon.melee.warscythe.name=боевая коса
items.weapon.melee.warscythe.stats_desc=Это довольно неточное оружие.
items.weapon.melee.warscythe.ability_name=жатва
items.weapon.melee.warscythe.typical_ability_desc=Дуэлянт может совершить _разрез_ боевой косой. Эта разрушительная атака гарантированно попадает по врагу и обычно наносит _%d урона_. Этот урон применяется как кровотечение, если цель не имеет иммунитет.
items.weapon.melee.warscythe.ability_desc=艾诺琳娜可以用战镰来_收割_敌人，这破坏性的一击必定命中，并会造成_%d点伤害_。若敌人不免疫流血，则造成的伤害会转化为等值流血效果。
items.weapon.melee.warscythe.desc=Это крупный и громоздкий инструмент был усилен так, чтобы он лучше справлялся с уничтожением врагов, а не со сбором урожая.

items.weapon.melee.magictorch.ability_name=мощный удар
items.weapon.melee.magictorch.ability_desc=Дуэлянт может совершить _мощный удар_ волшебным факелом. Эта сильная атака при точном ударе наносит на 30% больше урона и ошеломляет цель на 6 ходов, снижая ее точность и уклонение на 50%. Обычное использование способности поглотит 4 заряда оружия, в то время как неожиданная атака не потратит энергию.

items.weapon.melee.wornshortsword.ability_name=рассечь
items.weapon.melee.wornshortsword.ability_desc=Дуэлянт может _рассечь_ врага изношенным коротким мечом. Эта атака наносит на 33% урона больше и гарантированно попадает. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.




###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=адреналиновый дротик
items.weapon.missiles.darts.adrenalinedart.desc=Эти дротики покрыты веществом на основе Скорополоха, которое увеличивает скорость передвижения и атаки союзников или ненадолго снижает скорость передвижения врагов. Сам дротик всё ещё наносит урон врагам, но для союзников он безопасен.

items.weapon.missiles.darts.blindingdart.name=ослепляющий дротик
items.weapon.missiles.darts.blindingdart.desc=Эти дротики, покрытые веществом на основе Слепняка, на некоторое время ослепляют жертву. Но они не дезориентируют её, так что противник запомнит ваше последнее известное местонахождение.

items.weapon.missiles.darts.chillingdart.name=замораживающий дротик
items.weapon.missiles.darts.chillingdart.desc=Эти дротики, покрытые веществом на основе Ледяной лилии, замораживают цель при попадании.

items.weapon.missiles.darts.cleansingdart.name=очищающий дротик
items.weapon.missiles.darts.cleansingdart.desc=Наконечник этих дротиков покрыт веществом на основе Магорозы, которое временно делает союзников невосприимчивыми ко всем негативным эффектам или снимает положительные эффекты с врагов. Враги могут даже ненадолго забыть, что они нападают на вас или убегают от вас. Сам дротик по-прежнему вреден для врагов, но не причинит вреда союзникам.

items.weapon.missiles.darts.dart.name=дротик
items.weapon.missiles.darts.dart.ac_tip=СМАЗАТЬ
items.weapon.missiles.darts.dart.prompt=Выберите семя
items.weapon.missiles.darts.dart.tip_title=Смазанные дротики
items.weapon.missiles.darts.dart.tip_desc=Один или два дротика можно отварить с семенами для того, чтобы покрыть их соответствующим составом. Составы стираются после одного попадания, но каждый из них имеет свой, уникальный эффект.\n\nСмазав дротик с этими семенами, вы получите _%s._
items.weapon.missiles.darts.dart.tip_all=Смазать %1$d дротиков %2$d семенами
items.weapon.missiles.darts.dart.tip_two=Смазать 2 дротика с 1 семенем
items.weapon.missiles.darts.dart.tip_one=Смазать 1 дротик с 1 семенем
items.weapon.missiles.darts.dart.tip_cancel=Отменить
items.weapon.missiles.darts.dart.desc=Эти простые деревянные стержни с заострённым наконечником сбалансированы так, что даже легкое движение кистью способно отправить их на значительное расстояние. Они могут быть смазаны семенами для получения дополнительных эффектов при попадании.
items.weapon.missiles.darts.dart.unlimited_uses=Однако, несмотря на их простую конструкцию, дротики не сломаются никогда.

items.weapon.missiles.darts.displacingdart.name=телепортирующий дротик
items.weapon.missiles.darts.displacingdart.desc=Эти дротики, покрытые веществом на основе Ведьминого стебля, телепортируют цель назад на короткое расстояние.

items.weapon.missiles.darts.healingdart.name=исцеляющий дротик
items.weapon.missiles.darts.healingdart.desc=Эти дротики, покрытые веществом на основе Солнечника, ускоряют выздоровление цели. Сам дротик всё ещё наносит урон врагам, для союзников, однако, он безопасен.

items.weapon.missiles.darts.holydart.name=освященный дротик
items.weapon.missiles.darts.holydart.desc=Эти дротики, покрытые веществом на основе Звездоцвета, которое наполняют цель святой энергией. Союзники и обычные враги получат благословение, но такие враги, как нежить или демон, получат большой урон. Сам дротик всё еще наносит урон врагам, для союзников, однако, он безопасен.

items.weapon.missiles.darts.incendiarydart.name=поджигающий дротик
items.weapon.missiles.darts.incendiarydart.desc=Эти дротики, покрытые веществом на основе Огнецвета, при попадании загораются ярким пламенем.

items.weapon.missiles.darts.paralyticdart.name=парализующий дротик
items.weapon.missiles.darts.paralyticdart.desc=Эти дротики, покрытые веществом на основе Земляного корня, на некоторое время парализуют жертву.

items.weapon.missiles.darts.poisondart.name=отравленный дротик
items.weapon.missiles.darts.poisondart.desc=Эти дротики, покрытые веществом на основе Грустномоха, отравляют цель при попадании.

items.weapon.missiles.darts.rotdart.name=гнилостный дротик
items.weapon.missiles.darts.rotdart.desc=Эти коварные дротики покрыты веществом на основе гнилоягоды, разъедающим всё, чего коснётся кончик дротика. Сильные противники будут сопротивляться большей части эффекта, но коррозия достаточно сильна, чтобы убить большую часть обычных монстров. Эти дротики сохраняют эффект дольше, чем другие, однако длительность эффекта не может быть увеличена.

items.weapon.missiles.darts.shockingdart.name=электрический дротик
items.weapon.missiles.darts.shockingdart.desc=Эти дротики, покрытые веществом на основе Грозовой лозы, при попадании ударят цель электрическим разрядом.

items.weapon.missiles.darts.tippeddart.ac_clean= ОЧИСТИТЬ
items.weapon.missiles.darts.tippeddart.clean_title=Очищенные дротики
items.weapon.missiles.darts.tippeddart.clean_desc=Это действие очистит дротик от эффекта семени, нанесенного на него, превратив его обратно в обычный дротик.
items.weapon.missiles.darts.tippeddart.clean_all=Очистить все
items.weapon.missiles.darts.tippeddart.clean_one=Очистить один
items.weapon.missiles.darts.tippeddart.cancel=Отменить
items.weapon.missiles.darts.tippeddart.durability=Смазанные дротики постепенно становятся обычными дротиками при использовании.
items.weapon.missiles.darts.tippeddart.uses_left=Осталось _%d/%d_ бросков перед тем, как один из дротиков потеряет эффект.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Но эти настолько хороши, что могут использоваться вечно._
items.weapon.missiles.darts.tippeddart.about_to_break=Ваш дротик скоро потеряет эффект.


items.weapon.missiles.bolas.name=болас
items.weapon.missiles.bolas.desc=Это необычное метательное оружие наносит не слишком много урона, но зато замедляет передвижение цели при попадании.

items.weapon.missiles.boomerang.name=бумеранг
items.weapon.missiles.boomerang.desc=Этот плоский изогнутый деревянный снаряд вернется к хозяину, если кинуть его во врага.
items.weapon.missiles.boomerang.durability=Благодаря своей конструкции, бумеранг не изнашивается при использовании.

items.weapon.missiles.fishingspear.name=рыболовное копьё
items.weapon.missiles.fishingspear.desc=Маленькие метательные копья, предназначенные для рыбалки. Вполне годятся и в качестве импровизированного оружия.

items.weapon.missiles.forcecube.name=силовой куб
items.weapon.missiles.forcecube.ondeath=Вы убили себя собственным Силовым Кубом...
items.weapon.missiles.forcecube.desc=Это странное оружие достаточно мало для того, чтобы держать его в руке, но невероятно тяжелое. При броске оно создаст ударную волну, нанося урон всем, кто стоит рядом.

items.weapon.missiles.heavyboomerang.name=тяжелый бумеранг
items.weapon.missiles.heavyboomerang.desc=Этот увесистый бумеранг трудно использовать эффективно, однако он наносит значительный урон. Через несколько ходов он вернется обратно в то место, откуда его бросили.

items.weapon.missiles.javelin.name=пилум
items.weapon.missiles.javelin.desc=Эти увесистые метательные копья сбалансированы так, чтобы удерживать остриё точно впереди, пока оно пронзает воздух.

items.weapon.missiles.kunai.name=кунаи
items.weapon.missiles.kunai.desc=Эти маленькие ножи невероятно опасны в умелых руках. Это оружие наиболее эффективно при скрытных атаках.

items.weapon.missiles.missileweapon.stats=Это метательное оружие _%1$d-го уровня_ наносит _%2$d-%3$d_ ед. урона и требует _%4$d очков силы_ для эффективного использования.
items.weapon.missiles.missileweapon.distance=Шанс попадания этим оружием уменьшается, если использовать его в ближнем бою.
items.weapon.missiles.missileweapon.durability=Метательные оружия постепенно изнашиваются при использовании.
items.weapon.missiles.missileweapon.uses_left=Осталось _%d/%d_ бросков перед тем, как сломается один предмет.
items.weapon.missiles.missileweapon.unlimited_uses=_Но эти настолько хороши, что могут использоваться вечно._
items.weapon.missiles.missileweapon.about_to_break=Брошенное вами оружие вот-вот сломается.
items.weapon.missiles.missileweapon$placeholder.name=метательное оружие

items.weapon.missiles.shuriken.name=сюрикен
items.weapon.missiles.shuriken.desc=Заточенные в форме звёздочек кусочки металла. Они мало весят и удобно использовать на ходу - один сюрикен можно метнуть сразу после перемещения.

items.weapon.missiles.throwingspike.name=метательная игла
items.weapon.missiles.throwingspike.desc=Эти крайне острые иглы предназначены для метания во врагов на расстоянии. Они не особо сильны, но сделаны полностью из металла, что обеспечивает их высокую прочность.

items.weapon.missiles.throwingclub.name=метательная дубина
items.weapon.missiles.throwingclub.desc=Это незамысловатое оружие, по сути, является просто большим камнем на палке. Хотя он и не особо сильное, но его твердое каменное навершие обеспечивает особенную прочность и не даёт ему застрять в теле противника.

items.weapon.missiles.throwinghammer.name=метательный молот
items.weapon.missiles.throwinghammer.desc=Эти здоровенные молоты предназначены для метания во врага. Хотя им немного недостаёт урона, их гладкая цельнометаллическая конструкция обеспечивает особенную прочность и не даёт им застрять в теле противника.

items.weapon.missiles.throwingknife.name=метательный нож
items.weapon.missiles.throwingknife.desc=Эти легковесные ножи сбалансированы так, чтобы по дугообразной траектории попадать прямо в цель. Наиболее эффективны против ничего не подозревающих противников.

items.weapon.missiles.throwingspear.name=метательное копьё
items.weapon.missiles.throwingspear.desc=Эти лёгкие и тонкие копья явно предназначены для метания, а не ближнего боя.

items.weapon.missiles.throwingstone.name=метательный камень
items.weapon.missiles.throwingstone.desc=Эти камни отшлифованы так, чтобы их можно было бросать сильнее обычных камней. Несмотря на добротное изготовление, они всё же не являются надёжным оружием.

items.weapon.missiles.tomahawk.name=томагавк
items.weapon.missiles.tomahawk.desc=Эти метательные топоры имеют зазубренные края, из-за чего их сложновато использовать. Но, зато, попадание таким оружием вызовет сильное кровотечение.

items.weapon.missiles.trident.name=трезубец
items.weapon.missiles.trident.desc=Массивные метательные копья с тремя смертоносными зубцами на конце. Мощные, но тяжеловатые.

items.weapon.missiles.streamerknife.name=метательный нефритовый кинжал
items.weapon.missiles.streamerknife.desc=Это легкий и прочный метательный нож с острым лезвием, полностью вырезанный из нефрита. При броске в землю или существо, испускает ослепительный свет, ослепляющий всех вокруг, но при этом обязательно теряет 1 прочность.\n\nЭто оружие не может быть улучшено для повышения прочности.
items.weapon.missiles.streamerknife.ondeath=Вы были ослеплены и убили себя собственным метательным кинжалом...

items.weapon.missiles.redblock.name=красный кирпич
items.weapon.missiles.redblock.desc=Это осталось со времен строительства этого места? Даже с легким броском может сотрясти разум врага, оглушив на некоторое время, а его размер не даёт ему застрять в теле противника.\n\nЭто довольно медленное оружие.


items.weapon.spiritbow.name=Лук Духов
items.weapon.spiritbow.ac_shoot=ВЫСТРЕЛ
items.weapon.spiritbow.prompt=Выберите цель
items.weapon.spiritbow.stats=Лук не может быть улучшен напрямую, но вместо этого он будет постепенно улучшаться с получением новых уровней. На данном уровне, его стрелы будут наносить _%1$d-%2$d урона_ и требовать _%3$d очков силы_ для эффективного использования.
items.weapon.spiritbow.desc=Лук сделан из древнего волшебного дерева. Тетива лука и узоры светятся слабым голубоватым светом. Натянув тетиву, лук создаст волшебную стрелу, которую можно выпустить во врага.

items.weapon.weapon.identify=Вы достаточно долго знакомы с оружием, чтобы опознать его.
items.weapon.weapon.too_heavy=Из-за недостаточной силы, точность и скорость ваших атак с этим оружием будут снижены. Кроме того, вы не сможете совершать неожиданные атаки данным оружием.
items.weapon.weapon.excess_str=Благодаря избыточной силе, ваши атаки данным оружием будут наносить до _%d ед. доп. урона._
items.weapon.weapon.incompatible=Взаимодействие несовместимой магии развеяло зачарование на этом оружии!
items.weapon.weapon.cursed_worn=Поскольку это оружие проклято, вы не в силах убрать его.
items.weapon.weapon.cursed=Вы чувствуете, что это оружие скрывает в себе какую-то темную магию.
items.weapon.weapon.not_cursed=Это оружие не проклято.
items.weapon.weapon.faster=Это оружие сбалансировано, чтобы увеличивать _скорость._
items.weapon.weapon.stronger=Это оружие сбалансировано, чтобы увеличивать _урон._
items.weapon.weapon.enchanted=Наложено _%s._
items.weapon.weapon$enchantment.enchant=зачарование
items.weapon.weapon.hardening_gone=Закалка на этом оружии стерлась!
items.weapon.weapon.weak_cursed=Даже несмотря на то, что это оружие проклято, вы можете убрать его.
items.weapon.weapon.enchant_hardened=Подверглось _закалке._
items.weapon.weapon.hardened_no_enchant=Это оружие прошло _закалку,_ но сейчас на нём не наложено зачарование.

###misc items
items.amulet.name=Кристальное сердце
items.amulet.ac_end=ЗАКОНЧИТЬ ИГРУ
items.amulet.rankings_desc=Получено Кристальное сердце



items.amulet.desc=Победив древнего бога, вы обнаружили Кристальное сердце. Однако пути вперед больше нет. Может быть, это путешествие подошло к концу?
items.amulet.title=???
items.amulet.end_message1=Вы отважный путешественник, раз приняли мое испытание.
items.amulet.end_message2=%s, я открою тебе секрет. Когда-то я был человеком, но именно ради нее и всего, что мне дорого, я оказался здесь.
items.amulet.end_message3=Но мир зачастую более волшебные, чем ты думаешь. Прежде чем принять это испытание, ты когда-нибудь задумывался о смерти?
items.amulet.end_message4=Ненужно слов, я уже дал 2 свитка розы, надеюсь, они помогут тебе.
items.amulet.end_message5=Мой разум постепенно разрушается, но мы еще увидимся, удачи тебе, %s.


items.amulet.desc_origins=Похоже в ваших руках то самое Кристальное сердце из легенд, наконец-то можно вернуться на поверхность и одеть его триумвирату. В любом случае, теперь вы настоящий герой, не так ли?
items.amulet.desc_ascent=Воля кристального сердца стремительно распространяется, сможете ли вы пройти это испытание?


items.jamulet.name=Кристальное сердце
items.jamulet.ac_end=ЗАКОНЧИТЬ ИГРУ
items.jamulet.rickroll=Очевидно, Йог и Рикролл объединились, чтобы обмануть вас! На самом деле это не сердце, и ваше путешествие только начинается! Если ты зол, ты можешь уничтожить эту фотографию!
items.jamulet.rankings_desc=Получено Кристальное сердце
items.jamulet.desc=Победив древнего бога, вы обнаружили Кристальное сердце. Однако пути вперед больше нет. Может быть, это путешествие подошло к концу?

items.ankh.name=анх
items.ankh.ac_bless=ОСВЯТИТЬ
items.ankh.bless=Вы благославляете анх волшебной водой.
items.ankh.desc=Этот древний символ дарует возможность возродиться после смерти. Большинство ваших предметов будет сохранено на месте смерти, и их можно будет подобрать, когда вы вернетесь на это место. Используя полный бурдюк с водой, можно освятить анх, придав ему дополнительные силы.
items.ankh.desc_blessed=Древний символ бессмертия даёт возможность возродиться после смерти. Анх освящён и обладает большей силой. Анх пожертвует собой, чтобы спасти вас от смерти.

items.arcaneresin.name=магическая смола
items.arcaneresin.ac_apply=ИСПОЛЬЗОВАТЬ
items.arcaneresin.level_too_high=Эта палочка слишком сильна, смола не может её улучшить.
items.arcaneresin.not_enough=Недостаточно магической смолы!
items.arcaneresin.apply=Вы обволакиваете палочку смолой, делая её мощнее!
items.arcaneresin.desc=Этот порошок переливается всеми цветами от белого до фиолетового. Он может быть использован как усилитель магических свойств предмета, например, палочек.\n\nУлучшение палочек смолой потратит вплоть до трёх единиц, основываясь на изначальном уровне палочки. Смола может улучшить палочку до уровня +3.\n\nОднако, улучшения с помощью смолы стираются свитками улучшения и подобными предметами, а также слиянием с посохом мага.

items.brokenseal.name=сломанная печать
items.brokenseal.ac_affix=ПРИКРЕПИТЬ
items.brokenseal.prompt=Выберите броню
items.brokenseal.inscribed=На печати начертана _%s._
items.brokenseal.unknown_armor=Сперва вам нужно опознать эту броню.
items.brokenseal.degraded_armor=Эта броня в ужасно плохом состоянии.
items.brokenseal.cursed_armor=Невозможно прикрепить печать к проклятой броне.
items.brokenseal.affix=Вы прикрепили печать к броне!
items.brokenseal.desc=Восковая печать, прикреплённая к броне как символ отваги. Все знаки со временем стёрлись и печать треснула посередине.\n\nБудучи памятью о доме, эта печать укрепляет воина. Когда он её носит, он медленно накапливает поверх своего здоровья щит, который зависит от качества его брони.\n\nПечать можно _прикрепить к броне_, а так же переместить на другую. Она способна перенести один уровень улучшения, если улучшение было наложено на броню с печатью.
items.brokenseal.choose_title=Выберите руну
items.brokenseal.choose_desc=И эта броня и сломанная печать несут руну. Выберите, какую руну необходимо сохранить. \n\nОбратите внимание, что если вы выберите руну, которая сейчас на броне, печать не сможет перенести ее позже.

items.dewdrop.name=капля росы
items.dewdrop.heal=+%d ОЗ
items.dewdrop.shield=+%d ЩИТ
items.dewdrop.both=+%1$d ОЗ, +%2$d ЩИТ
items.dewdrop.already_full=Вы и так здоровы.
items.dewdrop.desc=Кристально чистая капля росы.\n\nБлагодаря магии этого места чистая вода обладает слабыми исцеляющими способностями.

items.equipableitem.unequip_cursed=Вы не можете снять проклятый предмет!
items.equipableitem.ac_equip=НАДЕТЬ
items.equipableitem.ac_unequip=СНЯТЬ

items.energycrystal.name=Энергетический кристалл
items.energycrystal.desc=Коллекция маленьких магических кристаллов, наполненных алхимической энергией.\n\nЭти кристаллы самый частый ингредиент в алхимических рецептах и могут быть получены в алхимическом котле путём расщепления расходных предметов.

items.gold.name=золото
items.gold.desc=Кучка золотых монет. Собирайте их, чтобы затем потратить в магазине.
items.gold.ling=Конвертировано в %d купонов

items.heap.for_sale=%1$d зол.: %2$s
items.heap.steal_angry=商人对你的行为十分生气，因此这件物品的价格翻了数倍。若尝试继续偷窃，商人可能会拒绝把物品卖给你。
items.heap.steal_sealed=商人对你的贪得无厌十分失望，已将此事反馈给峡谷总部，并且不再售卖这件物品。
items.heap.steal_price_up=商人十分生气，这件物品的价格翻了三倍！
items.heap.steal_price_mid=商人的怒火更盛，这件物品的价格涨到了六倍！
items.heap.steal_price_max=商人的怒火难以平息，这件物品的价格已经涨到了九倍！

items.heap.for_ice=%1$d коб.: %2$s
items.heap.for_dot=%1$d куп.: %2$s
items.heap.chest=Сундук
items.heap.chest_desc=Вы не узнаете, что там, пока не откроете!
items.heap.golden_chest=地里掘出来的金宝箱
items.heap.golden_chest_desc=Вы не узнаете, что там, пока не откроете!
items.heap.locked_chest=Запертый сундук
items.heap.locked_chest_desc=Вы не узнаете, что там, пока не откроете! Но для этого вам понадобится золотой ключ.
items.heap.crystal_chest=Хрустальный сундук
items.heap.crystal_chest_desc=Внутри вы видите _%s_. Но, чтобы открыть этот сундук, вам потребуется хрустальный ключ.
items.heap.artifact=артефакт
items.heap.wand=палочку
items.heap.ring=кольцо
items.heap.unknow=неизвестный предмет
items.heap.tomb=Могила
items.heap.tomb_desc=В этой древней могиле может лежать что-то полезное, но её владелец вряд ли ждёт гостей.
items.heap.skeleton=Куча костей
items.heap.skeleton_desc=Это всё, что осталось от неудачливого путешественника. Пожалуй, стоит проверить, вдруг там есть что-то ценное.
items.heap.remains=Останки героя
items.heap.remains_desc=Это всё, что осталось от одного из твоих предшественников. Пожалуй, стоит проверить, вдруг там есть что-то ценное.
items.heap.warning=Во время осмотра вы нашли зелье алхимического огня, подобрав его, вы оказались в центре гробницы...

items.heap.wtomb=Бледная могила
items.heap.wtomb_desc=Эта могила отличается от других могил, интуиция подсказывает вам, что не стоит её раскапывать.

items.honeypot.name=горшок с мёдом
items.honeypot.ac_shatter=РАЗБИТЬ
items.honeypot.desc=Этот большой горшок только по краям обмазан мёдом, а внутри живёт огромная пчела! Этот вид больших пчёл обычно живёт в ульях, может, горшок - разновидность ловушки для пчёл? Пчела неплохо чувствует себя внутри, однако, когда вы туда заглядываете, она начинает угрожающе жужжать.
items.honeypot$shatteredpot.name=расколотый горшок с мёдом
items.honeypot$shatteredpot.desc=Горшок расколот. Липкий мёд не даёт ему развалиться, но и тот скоро засохнет.\n\nХотя горшок разбит, пчела всё ещё его защищает.

items.item.prompt=Выберите цель для броска
items.item.ac_drop=ВЫЛОЖИТЬ
items.item.ac_throw=БРОСИТЬ
items.item.rankings_desc=Убит (%s)
items.item.curse=проклятие
items.item.custom_note=На предмете есть заметка: "_%s_"

items.item.dev_desc=

items.kindofmisc.unequip_title=Необходимо снять один предмет
items.kindofmisc.unequip_message=Сначала вы должны снять один из предметов. Выберите предмет для замены.
items.kindofweapon.which_equip_msg=В какой слот для оружия вы бы хотели надеть этот предмет?\n\nЧемпион атакует своим основным оружием, но может использовать способности дополнительного. Оба оружия имеют свои собственные заряды.\n\nЧемпион может мгновенно поменять местами основное и дополнительное оружия.
items.kindofweapon.which_equip_primary=Основное (%s)
items.kindofweapon.which_equip_secondary=Дополнительное (%s)
items.kindofweapon.empty=пусто
items.kindofweapon.equip_cursed=Ваша рука непроизвольно вцепляется в оружие.
items.kindofweapon.swift_equip=Вы быстро надели ваше оружие.
items.kindofweapon.stats_armor_desc=这件武器能格挡 %1$d~%2$d 点伤害。

items.kingscrown.name=Корона Короля дворфов
items.kingscrown.ac_wear=НОСИТЬ
items.kingscrown.naked=К сожалению, корона не сможет преобразить ваше нижнее бельё.
items.kingscrown.upgraded=Корона ярко светится, а затем распадается, трансформируя вашу броню!
items.kingscrown.ratgraded=Лапы Крысиного Короля ярко светятся, когда твоя броня преображается!
items.kingscrown.desc=Корона последнего короля дворфов, она светится и излучает магическую силу.\n\nПри ношении корона передаст свою магическую мощь вашей броне, превращая ее в _уникальную эпическую броню со специальными способностями._ Новая броня сохранит все свойства оригинальной.

items.liquidmetal.name=жидкий металл
items.liquidmetal.ac_apply=ИСПОЛЬЗОВАТЬ
items.liquidmetal.prompt=Выберите метательное оружие
items.liquidmetal.already_fixed=Это метательное оружие уже в превосходном состоянии!
items.liquidmetal.apply=Вы используете %d жидкого металла для починки вашего метательного оружия.
items.liquidmetal.desc=Если нанести эту магическую жидкость на метательное оружие, то трещины и просечки, возникшие от использования, заглаживаются и метательное оружие восстановится до идеального состояния!\n\nДля оружия с редкостью 1 уровня потребуется 10 жидкого металла для полного восстановления, для оружия с редкостью 5 уровня потребуется 30. Каждое улучшение удваивает требуемое количество металла.\n\nЖидкий металл нельзя использовать для починки наконечников на дротиках.

items.lostbackpack.name=потерянный рюкзак
items.lostbackpack.desc=Этот рюкзак - ничто иное, как ваш утерянный инвентарь! Возьмите его, чтобы вернуть все утерянные предметы.

items.merchantsbeacon.name=маяк торговца
items.merchantsbeacon.ac_use=ПРОДАЖА
items.merchantsbeacon.desc=Это странная дворфийская технология позволяет общаться на расстоянии.\n\nПри активации этот маяк позволит вам продать вещи в Пиксель-Маркет из любой точки подземелья.\n\nМагии маяка хватит всего на одно использование, так что используйте его с умом.

items.stylus.name=мистический грифель
items.stylus.ac_inscribe=НАЧЕРТАТЬ
items.stylus.prompt=Выберите доспех
items.stylus.identify=Сперва вам нужно опознать эту броню.
items.stylus.cursed=Магия грифеля не работает на проклятой броне.
items.stylus.inscribed=Вы нанесли начертание грифелем на своей броне.
items.stylus.desc=Этот грифель сделан из тёмного, очень твёрдого камня и он явно не так прост, как кажется. С его помощью вы можете начертить магическую руну на вашей броне, однако вы не сможете выбрать, какую именно - грифель решит это за вас.

items.tengusmask.name=маска Тенгу
items.tengusmask.ac_wear=НОСИТЬ
items.tengusmask.used=Маска распадается, передавая вам свою силу!
items.tengusmask.desc=Эта маска упала с лица Тенгу после его смерти, и вы чувствуете огромную магическую силу, исходящую от неё. Была ли маска источником силы Тенгу?\n\nПри ношении маска передаст вам свою огромную силу, что позволит вам _выбрать подкласс своего героя._\n\nКакой подкласс вы выберете?
items.tengusmask.not_apply=Маска Тенгу отвернула вас и просто исчезла…

items.torch.name=факел
items.torch.ac_light=ЗАЖЕЧЬ
items.torch.lanterfireactive=Ваш факел поглотил фонарь и будет применён как %1$s%% топливо при его заправке.
items.torch.mustload=Вы не можете использовать факел, пока есть другие эффекты дающие свет!
items.torch.desc=Верный спутник героя, разгоняющий тьму, когда подземелье становится слишком мрачным.
items.torch.youmustload=Сперва вам необходимо зажечь фонарь, чтобы использовать его в качестве топлива.
items.torch.youshield=Вы исследовали все глубины подземелья, теперь факел способен накладывать 15 ед. тайного щита.
items.torch.youshield2=Вы не можете использовать факел, пока есть эффект тайного щита.
items.waterskin.name=бурдюк
items.waterskin.ac_drink=ВЫПИТЬ
items.waterskin.collected=Вы собираете каплю росы в свой бурдюк.
items.waterskin.full=Ваш бурдюк заполнен!
items.waterskin.empty=Ваш бурдюк пуст!
items.waterskin.desc=Контейнер для жидкости, сделанный из кожи и бечевки, запечатанный деревянной пробкой.
items.waterskin.desc_water=Прямо сейчас в бурдюке есть лишь обычная вода. Однако наверняка в подземелье есть что-то, что можно было бы хранить в бурдюке кроме воды.
items.waterskin.desc_heal=Сейчас в бурдюке хранится целебная вода. Чем полнее бурдюк, тем больше здоровья вы восстановите, выпив из него. Вы выпьете ровно столько, сколько вам нужно.
items.waterskin.desc_full=Полный бурдюк, кажется, излучает какую-то энергию. Возможно, ей получится благословить какой-то другой предмет, дарующий жизнь.

items.amulet.ascent_title=Воля кристалла
items.amulet.ascent_desc=Вы начинаете ощущать великую и ужасную силу, излучаемую волей кристалла. Восхождение обратно через подземелье в качестве смертного может оказаться сложнее, чем вы думали!\n\nЕсли вы продолжите восхождение с кристальным сердцем, подземелье станет более опасным, телепорты между этажами будут отключены, и вы сможете выиграть игру только, если выберетесь из подземелья, побеждая врагов!\n\nВы можете пока оставить кристальное сердце здесь, если хотите подняться, не начиная это испытание, или активировать его для восхождения, чтобы завершить игру в обычном режиме.
items.amulet.ascent_yes=Продолжить!
items.amulet.ascent_no=Остановиться сейчас

items.amulet.xascent_title=Запутанный мир пал...
items.amulet.xascent_desc=После победы над Йог-Зотом запутанный мир стал в опасности и начал разрушаться повсюду. Когда ты уже подумал, что вот-вот упадешь в пропасть, Няруко подхватила тебя...
items.amulet.xascent_yes=Вернуться в город
items.amulet.xascent_no=Остаться еще немного...

items.dlcitem.bossrushbloodgold.name=Кровавая золотая монета [BossRush]
items.dlcitem.bossrushbloodgold.desc=Да, это то самое коварное и опасное место, где обосновались чудовища, о которых я упоминал ранее.\n\nЕсли ты желаешь отправится туда, я окажу тебе кое-какой поддержкой в пути.
items.dlcitem.bossrushbloodgold.dlc_desc=Этот контент DLC содержит три основные сложности:\n\nА. Легкая - отражение первоначала\n1. Обычные характеристики, стандартное Испытание боссами.\n2. Дается бонус к общему снижению урона на 20%, но не позволяет использовать способности из _книг_.\n\nB. Средняя - отражение испытания\n1. Стандартная сложность Испытания боссами, где сражайтесь с многими боссами.\n2. Боссы получают случайный эффект _мутации_.\n3. На 15-м и 17-м этажах становится другая местность, появляется _тень_ и _небесный слизень_.\n\nC. Сложная - отражение чистилища\n1. Боссы получают два случайных эффекта _мутации и чемпиона_.\n2. На 15-м и 17-м этажах становится другая местность, появляется _тень_ и _небесный слизень_.\n\nEX. Нереальная - отражение кошмаров (расширений контент)\n1. Боссы получают _иммунитет к ужасу_, два случайных эффекта _мутации и чемпиона_.\n2. На 15-м и 17-м этажах становится другая местность, монстры генерируются на этажах снабжения, но не возрождаются.\n\nПримечание: кобальтовые монеты нельзя получить в режиме Испытания боссами.
items.dlcitem.bossrushbloodgold.ac_read=Подробная информация
items.dlcitem.bossrushbloodgold.rankings_desc=Исследователь мира боссов

items.dlcitem.rushmobscrollofrandom.name=Свиток Золотой бабочки [RandMode]
items.dlcitem.rushmobscrollofrandom.desc=Магия свитка Золотой бабочки очень сильна, в этом поручении тебе предстоит воспользоваться его силой, чтобы приступить к глубокому исследованию.\n\nПусть тебе улыбнется удача, смело двигаясь вперед с благословением Золотой бабочки!!!
items.dlcitem.rushmobscrollofrandom.dlc_desc=В этом расследовании на вас будет влиять сила свитка Золотой бабочки.\n\n1. На каждом этаже появляется _колодец изменчивости_.\n2. У входа в каждый регион появляется таинственный NPC. Он оценит ваши поступки и вознаградит вас соответствующим способом.\n3. Начиная со 2-го этажа, боссы, с которым ваш герой столкнется, больше не фиксированные, может появиться любой _босс_. (Кроме _финального босса_)\n4. На первом этаже появится крупный магазин _Насехуэй_, в котором будет продаваться эликсир Могущества и зелье Мастерства.\n5. Все превращаемые предметы могут быть преобразованы. Поговорите с таинственным NPC и используйте новую механику превращения Золотой бабочки.\n6. Артефакты, кольца, палочки, аксессуары, оружие получают эффект свитка улучшения при первом преобразовании на каждом этаже нового региона.\n7. Появление _новых_ врагов, а артефакты теперь могут повторятся!\n\nОкунитесь в атмосферу волшебства _Золотой бабочки_!
items.dlcitem.rushmobscrollofrandom.ac_read=Подробная информация
items.dlcitem.rushmobscrollofrandom.rankings_desc=Изменчивое путешествие
items.dlcitem.rushmobscrollofrandom.recycled=В вашем рюкзаке засияло магия золотой бабочки... Вам кажется, что мир изменился в одно мгновение...
items.dlcitem.rushmobscrollofrandom.mode=Изменчивость


items.wands.wandoffirebolt.name={палочка Фосфорного пламени{

items.weapon.melee.assassinsblade.typical_ability_desc=Дуэлянт с клинком убийцы может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 3 клеток и обычно даёт _%d хода невидимости._
items.weapon.melee.battleaxe.typical_ability_desc=Дуэлянт может совершить _мощный удар_ боевым топором. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.

items.weapon.melee.dirk.typical_ability_desc=Дуэлянт с кортиком может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 4 клеток и обычно даёт _%d хода невидимости._

items.weapon.melee.flail.typical_ability_desc=Дуэлянт может _вращать_ кистень, чтобы увеличить его силу на короткое время. Обычно, пока кистень вращается, следующая атака им может вплоть до 3 раз получить _+%d дополнительного урона_. Вращающийся кистень гарантированно попадает в цель. Только начать крутить кистень стоит заряд оружия.

items.weapon.melee.glaive.typical_ability_desc=Дуэлянт, используя наконечник глефы, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака обычно наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.

items.weapon.melee.gloves.typical_ability_desc=Дуэлянт может совершить _двойной удар_ шипованными перчатками. Эта атака гарантированно попадёт в цель и обычно наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием за последние 5 ходов.

items.weapon.melee.greataxe.typical_ability_desc=Дуэлянт может совершить _удар возмездия_ секирой, если у неё меньше 50%% здоровья. Эта уничтожающая всё и вся атака обычно наносит _%1$d-%2$d урона_, гарантированно попадает в цель и моментальна, если убивает врага.

items.weapon.melee.greatshield.typical_ability_desc=Дуэлянт может _защитить_ себя ростовым щитом, становясь полностью неуязвимой к физическим и магическим атакам обычно в течение _%d ходов_. Как только Дуэлянт заблокирует атаку, но контратака в ответ или использование магии разрушит её защиту.



items.weapon.melee.katana.typical_ability_desc=Дуэлянт с катаной может сделать _выпад_ в сторону врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, обычно нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.

items.weapon.melee.longsword.typical_ability_desc=Дуэлянт может _рассечь_ врага длинным мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, это происходит мгновенно, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.

items.weapon.melee.rapier.typical_ability_desc=Дуэлянт может шпагой сделать _выпад_ во врага, который находится на расстоянии в 1 клетку. Выпад сближает с противником, обычно нанося ему _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.weapon.melee.roundshield.typical_ability_desc=Дуэлянт может _защитить_ себя круглым щитом, становясь полностью неуязвимой к физическим и магическим атакам обычно в течение _%d ходов_. Как только Дуэлянт заблокирует атаку, атакование в ответ или использование магии разрушит её защиту.
items.weapon.melee.runicblade.typical_ability_desc=Дуэлянт может совершить _рунический удар_ рунным клинком. Атака гарантированно попадает по цели и обычно увеличивает на _+%d%% силу зачарования._
items.weapon.melee.sai.typical_ability_desc=Дуэлянт может совершить _двойной удар_, используя сай. Эта атака гарантированно попадёт в цель и обычно наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием за последние 5 ходов.

items.weapon.melee.scimitar.typical_ability_desc=Дуэлянт со скимитаром в руках может исполнить боевой _танец с мечом_. Активация этой способности не требует времени и дарует Дуэлянту +60%% к скорости атаки и +50%% к точности. Обычно эффект продолжается _%d ходов._
items.weapon.melee.sickle.typical_ability_desc=Дуэлянт может совершить _разрез_ серпом. Эта разрушительная атака гарантированно попадает по врагу и обычно наносит _%d урона_. Этот урон применяется как кровотечение, если цель не имеет иммунитет.

items.weapon.melee.wornshortsword.typical_ability_desc=Дуэлянт может _рассечь_ врага изношенным коротким мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.

items.weapon.melee.gauntlet.typical_ability_desc=Дуэлянт может совершить _двойной удар_ каменной перчаткой. Эта атака гарантированно попадёт в цель и обычно наносит на _%d больше урона_ за каждый раз, когда Дуэлянт удачно попала в противника в ближнем бою или метательным оружием за последние 5 ходов.


items.quest.dragonwater.name=слеза дракона
items.quest.dragonwater.desc=Эта капля слезы, стекла с лавового дракона перед его смертью, благодаря силе древних драконов, одна капля способна дополна заполнить бурдюк, чтобы использовать эту магическую жидкость для излечивания ран.\n\nСлезы драконов очень хрупкие, поэтому их невозможно хранить в рюкзаке. Их можно либо выпить напрямую, либо вылить в бурдюк.

#### Hollow
items.potions.potionofholywater.name=бутылек со святой водой
items.potions.potionofholywater.desc=Интересно, для чего в старинном замке нужна святая вода? Возможно эта жидкость, способна помочь ослабить здешних монстров в замке. Просто нужно попробовать бросить её в кого-нибудь!
items.potions.potionofholywater.zombie_noreset=Святая вода очистила магию воскрешающую Франкенштейна, и теперь его тело обретет покой!
items.potions.potionofholywater.hollow=Святая вода очистила монстра в Зале Всех Святых, но поскольку проклятие внутри монстра было слишком сильным, это вызвало обратный эффект со смертельным исходом!
items.potions.potionofholywater.vampire_reset=Вампир вознесся на небеса под действием святой воды...

items.quest.soulcrack.name=осколок души
items.quest.soulcrack.desc=Над подземельем тихо возвысилась кровавая луна, которая своими лучами подвергает некоторых врагов странным мутациям, оставляя при их смерти осколки душ.\n\nСоберите пять осколков душ, чтобы войти в синергию с таинственным миром для прохода в стараний замок, который появляется под покровом кровавой луны...

items.quest.soulcrack$redsoulcrack.name=высокомерный осколок души
items.quest.soulcrack$redsoulcrack.desc=Над подземельем тихо возвысилась кровавая луна, которая своими лучами подвергает некоторых врагов странным мутациям, оставляя при их смерти осколки душ.\n\nСоберите пять осколков душ, чтобы войти в синергию с таинственным миром для прохода в стараний замок, который появляется под покровом кровавой луны...\n\n<#F00>Стремление к совершенству и одержимость собой, ведущая к чрезмерному самолюбию, а также чувство превосходства над другими - это высокомерность. <RGB>

items.quest.soulcrack$yellowsoulcrack.name=нерадивый осколок души
items.quest.soulcrack$yellowsoulcrack.desc=Над подземельем тихо возвысилась кровавая луна, которая своими лучами подвергает некоторых врагов странным мутациям, оставляя при их смерти осколки душ.\n\nСоберите пять осколков душ, чтобы войти в синергию с таинственным миром для прохода в стараний замок, который появляется под покровом кровавой луны...\n\n<#FFFF00>Стремление к легкости и удобству, избегая любые неприятности - это нерадивость. <RGB>

items.quest.soulcrack$bluesoulcrack.name=алчный осколок души
items.quest.soulcrack$bluesoulcrack.desc=Над подземельем тихо возвысилась кровавая луна, которая своими лучами подвергает некоторых врагов странным мутациям, оставляя при их смерти осколки душ.\n\nСоберите пять осколков душ, чтобы войти в синергию с таинственным миром для прохода в стараний замок, который появляется под покровом кровавой луны...\n\n<#0FF>Стремление к неконтролируемой жажда к наживе - корень всех зол, ибо практически каждое преступление в этом мире, связанное с деньгами совершаются из-за алчности. <RGB>

items.quest.soulcrack$greensoulcrack.name=мстительный осколок души
items.quest.soulcrack$greensoulcrack.desc=Над подземельем тихо возвысилась кровавая луна, которая своими лучами подвергает некоторых врагов странным мутациям, оставляя при их смерти осколки душ.\n\nСоберите пять осколков душ, чтобы войти в синергию с таинственным миром для прохода в стараний замок, который появляется под покровом кровавой луны...\n\n<#0F0>Стремление к мести исходит из самой - ярости, ненависти и гнева, что приводит к эмоциональному срыву и непреодолимому желанию отомстить. <RGB>

items.quest.soulcrack$pinksoulcrack.name=вожделеющий осколок души
items.quest.soulcrack$pinksoulcrack.desc=Над подземельем тихо возвысилась кровавая луна, которая своими лучами подвергает некоторых врагов странным мутациям, оставляя при их смерти осколки душ.\n\nСоберите пять осколков душ, чтобы войти в синергию с таинственным миром для прохода в стараний замок, который появляется под покровом кровавой луны...\n\n<#FF1493>Стремление к плотским утехам обычно обусловлено чрезмерному желанию к сексуальному удовольствию, особенно когда жизнь становится беспечной в сытости и тепле, появляется похоть. <RGB>

items.quest.hollow.pacmanquest$antiattack.name=время контратаки
items.quest.hollow.pacmanquest$antiattack.desc=А сейчас пора поиграть в кошки-мышки! Во время контратаки призраки будут держаться от вас на расстоянии, и вы можете атаковать их, чтобы заработать дополнительные очки.\n\nХодов осталось: %s.

items.quest.hollow.pacmanquest$randomitemplus.name=обновление предметов
items.quest.hollow.pacmanquest$randomitemplus.desc=На карте периодически появляются высокоуровневые предметы в точках снабжения. Если к моменту пополнения запасов, точка снабжения пустует, она будет автоматически заполнена предметом.\n\nХодов осталось до пополнения: %s


items.quest.hollow.starcrystal.name=хрустальная звезда
items.quest.hollow.starcrystal.desc=Преодолейте пропасть времени и пространства, чтобы заново пережить то решающее сражение в звёздах.\n\nВозьмите этот предмет на 31-й этаж, выбрав временную линию «Багряный театр», чтобы вновь воссоздать сцену того финального сражения…

items.quest.hollow.pacmanquest$smallpoint.name=фасоль
items.quest.hollow.pacmanquest$smallpoint.desc=Фасоль дает дополнительно 10 очков.

items.quest.hollow.pacmanquest$bigpoint.name=соя
items.quest.hollow.pacmanquest$bigpoint.desc=Соя дает дополнительно 50 очков и активирует контратаку на 30 ходов!


items.quest.hollow.pacmanquest$chocolate.name=шоколад
items.quest.hollow.pacmanquest$chocolate.desc=Этот шоколад слегка горьковатый, но при этом имеет насыщенный вкус, смешанного молока.\n\nПри получении дает <#FF1493>300 очков. <RGB>

items.quest.hollow.pacmanquest$lollipop.name=леденец
items.quest.hollow.pacmanquest$lollipop.desc=В такой критический момент не хочется медленно рассасывать их - хочется просто откусить кусочек!\n\nПри получении дает <#FF1493>200 очков. <RGB>

items.quest.hollow.pacmanquest$sugarbomb.name=бомба
items.quest.hollow.pacmanquest$sugarbomb.desc=Отойдите, сейчас взорвется!\n\nПри получении дает <#FF1493>200 очков, <RGB>и отправляет обратно в тюрьму, случайно выбранного _призрака_.

items.quest.hollow.pacmanquest$gumdrop.name=мармелад
items.quest.hollow.pacmanquest$gumdrop.desc=Благодаря насыщенной джемовой начинке это самые лучшие жевательные конфеты.\n\nПри получении дает <#FF1493>300 очков. <RGB>


items.quest.hollow.pacmanquest$toffee.name=ириска
items.quest.hollow.pacmanquest$toffee.desc=Сладкие молочные конфеты - как раз то, что нужно в такой момент, не так ли?\n\nПри получении дает <#FF1493>500 очков. <RGB>

### SHPD BIRDAY
items.keys.greenkey.name=изумрудный ключ
items.keys.greenkey.desc=Каждый август свет истинного создателя подземелья пронизывает все подземелья в параллельных мирах, которые он сотворил, чтобы преподнести щедрые дары.\n\nЭтот ключ открывает легендарный изумрудный сундук, дающий награду из параллельных миров.

items.heap.green_chest=изумрудный сундук
items.heap.green_chest_desc=Каждый август свет истинного создателя подземелья пронизывает все подземелья в параллельных мирах, которые он сотворил.\n\nЧтобы открыть сундук и получить доступ к сокровищам, вам нужен изумрудный ключ.

items.scrolls.exotic.scrollofgolems.name=свиток Колосса
items.scrolls.exotic.scrollofgolems.inv_title=Выберите оружие или доспех
items.scrolls.exotic.scrollofgolems.golem=Вокруг вашего оружия появился голем!
items.scrolls.exotic.scrollofgolems.desc=Этот древний свиток часто используется тёмными генералами, испытывающими нехватку войск. Если использовать на подходящем оружии или доспехе, он сотворит живую статую, облачённую в это снаряжение. Статуя будет предана своему создателю и после своей смерти всегда оставляет экипированное оружие.\n\nИспользование свитка на проклятом оружии, поглотит темную магию статуей, значительно ослабив её боевую силу.

items.food.fantong.rattail.name=крысиный хвост
items.food.fantong.rattail.desc=Тело грызуна представляло собой массу протухшего мяса, как будто оно было замариновано в зловониях канализации, однако его хвост выглядел таким сочным.

items.food.fantong.bonesoup.name=костный бульон
items.food.fantong.bonesoup.desc=Шедевр из костей и мяса, который при томлении на медленном огне извлекает из костей питательные вещества и магические свойства, смешиваясь со сладостью мяса в бульоне, словно они созданы дополнять друг друга.\n\nСвежий, аппетитный и вкусный! Этот насыщенный бульон укрепляет кости и тело.
items.food.fantong.bonesoup.effect=Выпив горячий бульон, вы чувствуете как кожа становится грубее!

items.food.fantong.zakosoup.name=рыбный суп
items.food.fantong.zakosoup.desc=Это восточное блюдо представляет собой рыбное мясо, полностью пропитанное в бульоне, приправленным лишь небольшим количеством масла и солью, а затем украшается кориандром, что позволяет сохранить максимально естественный вкус рыбы!\n\nВ этом подземелье нет ничего лучше, чем вкусить глоток горячего и вкусного рыбного супа, который также способствует восстановлению потерянного здоровья.
items.food.fantong.zakosoup.effect=Вы чувствуете себя так комфортно, как будто ваше тело погрузилось в горячий источник.

items.food.qiecake.name=баклажановые оладьи
items.food.qiecake.desc=С приближением Фестиваля призраков оладьи из баклажанов считаются обязательным традиционным угощением. Считается, что их поедание повышает сопротивляемость к ядам и укрепляет защитные способности.

items.food.ricecake.name=рисовая лепешка
items.food.ricecake.desc=Во время Фестиваля призраков рисовые лепешки - популярная традиционная еда. Считается, что их поедание дарует магическую защиту.


#### 破碎武器魔绫化 即部分破碎武器在魔绫这边定位尴尬
items.weapon.melee.spdtomlpd.ritualsword.name=церемониальный кинжал
items.weapon.melee.spdtomlpd.ritualsword.desc=Некогда этот кинжал долгое время использовался епископом для проведения религиозных ритуалов.\n\nЭто оружие невосприимчиво к проклятиям и повышает эффективность жертвоприношений. \nЭтому оружию достаточно всего одного жертвоприношения, чтобы завершить ритуал, который обычно требует больше жертвоприношений.
items.weapon.melee.spdtomlpd.ritualsword.sacrifice=Когда вы нанесли врагу смертельный удар церемониальным кинжалом, таинственная сила полностью заполнила алтарь...
items.weapon.melee.spdtomlpd.ritualsword.typical_ability_desc=艾诺琳娜可以用仪式短剑_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在_5回合_内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.spdtomlpd.ritualsword.ability_name=рассечь
items.weapon.melee.spdtomlpd.ritualsword.ability_desc=艾诺琳娜可以用仪式短剑_顺劈_敌人。造成_ +30% 伤害_并且必定命中。如果顺劈击杀了一名敌人，艾诺琳娜可在_ 5 回合_内额外使用一次无消耗顺劈。

items.weapon.melee.spdtomlpd.treelist.name=кусок древесины
items.weapon.melee.spdtomlpd.treelist.desc=Заросшее дерево, которое долгое время впитывало различную магию, из-а чего теперь само стремится поглотить любую угасающую магическую энергию, чтобы поддерживать свой рост.\n\nЭто оружие поглощает потерянную жизненную энергию от жизненного щита (оно не может поглощать другие щиты, и такие как тайный барьер.), накапливая _%s ед_ своего максимального щита. Атаки оружия также накапливают _%s ед. щита_. Этот щит рассеивается каждый _1 ход_.
items.weapon.melee.spdtomlpd.treelist$treebarrier.name=древесный барьер
items.weapon.melee.spdtomlpd.treelist$treebarrier.desc=Текущий щит: %d.\nМаксимальный щит: %d.\n\nБарьер, который вот-вот должен был рассеется, был поглощен и задействован для создания жизненного щита. Когда текущее значение щита достигнет своего максимума, его избыток рассеется.

items.weapon.melee.spdtomlpd.treelist$treebarrst.name=жизненный щит
items.weapon.melee.spdtomlpd.treelist$treebarrst.desc=Рассеивающая энергия оберегает вас!\n\nЖизненная энергия, накопленная в куске древесины, полностью высвободилась, чтобы защитить вас. Неиспользованная энергия со временем поглощается обратно в древесину.\n\nОсталось жизненной энергии: %s.

items.weapon.melee.spdtomlpd.treelist.ac_barrier=использовать как щит
items.weapon.melee.spdtomlpd.treelist.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.spdtomlpd.treelist.stats_desc=Это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.spdtomlpd.treelist.ability_name=встать в стойку
items.weapon.melee.spdtomlpd.treelist.ability_desc=Дуэлянт может принять _защитную стойку_ со своим куском древесины. Стойка удваивает шанс уклонения на 5 ходов и активируется мгновенно, но стоит 2 заряда оружия.
items.weapon.melee.spdtomlpd.treelist.typical_ability_desc=Дуэлянт может принять _защитную стойку_ со своим куском древесины. Стойка не требует времени на активацию и утраивает её уклонение обычно на _%d ходов_.
items.weapon.melee.spdtomlpd.treelist$defensivestance.name=стоит в стойке
items.weapon.melee.spdtomlpd.treelist$defensivestance.desc=Дуэлянт использует свой кусок древесины для защиты от ударов и выстрелов. Пока она в своей стойке, шанс уклонения от атак утроен.\n\nХодов осталось: %s.

items.weapon.melee.spdtomlpd.tragiccode.name=свод скорби
items.weapon.melee.spdtomlpd.tragiccode.desc=В этой книге содержатся поистине трагические события, в том числе о том, как людей заставляли есть сырое мясо монстров в период нехватки пищи, как они умирали от постепенного окаменения, вплоть до того как их превращали в неразумных металлических существ.
items.weapon.melee.spdtomlpd.tragiccode.identify=После убийства врага свод случайным образом опознал предмет (%s) в вашем рюкзаке.
items.weapon.melee.spdtomlpd.tragiccode.typical_stats_desc=Это оружие обычно при убийстве врага с _%s%% шансом_, опознает случайный предмет в вашем инвентаре.
items.weapon.melee.spdtomlpd.tragiccode.stats_desc=Это оружие при убийстве врага с _%s%% шансом_, опознает случайный предмет в вашем инвентаре.
items.weapon.melee.spdtomlpd.tragiccode.ability_name=рассечь
items.weapon.melee.spdtomlpd.tragiccode.ability_desc=Дуэлянт может _рассечь_ врага сводом скорби. Эта атака наносит на 27% урона больше и гарантированно попадает. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.spdtomlpd.tragiccode$cleavetracker.name=рассекание
items.weapon.melee.spdtomlpd.tragiccode$cleavetracker.desc=Дуэлянт готова продолжать рассекать врагов! Следующее рассекание не будет требовать заряд оружия.\n\nХодов осталось: %s.
items.weapon.melee.spdtomlpd.tragiccode.typical_ability_desc=Дуэлянт может _рассечь_ врага сводом скорби. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.

items.weapon.melee.spdtomlpd.reedpipe.name=пастуший рожок
items.weapon.melee.spdtomlpd.reedpipe.desc=Эхо пастушьей флейты всегда затихает у старой деревушке, именно там зародилась её судьба.
items.weapon.melee.spdtomlpd.reedpipe.stats_desc=Это оружие обладает необычайной дальностью атаки, но каждая _1 клетка_ расстояния до цели, уменьшает на <#f00>10% наносимый урон. <RGB>Это оружие наносить только _магический урон_.
items.weapon.melee.spdtomlpd.reedpipe.ability_name=мощный удар
items.weapon.melee.spdtomlpd.reedpipe.ability_desc=艾诺琳娜可以用牧笛使出_重击_。这用尽全力的一击如果是在伏击敌人，则会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.spdtomlpd.reedpipe.typical_ability_desc=Дуэлянт может совершить _мощный удар_ пастушьим рожком. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.

items.weapon.melee.spdtomlpd.break.name=меч падшего войска
items.weapon.melee.spdtomlpd.break.desc=Дети, дождитесь меня...
items.weapon.melee.spdtomlpd.break.typical_stats_desc=通常装备这件武器时，你对生命值低于_50%%的敌人_造成的所有伤害+30%%，如果你直接使用破军进行攻击，_增伤效果将被提升至+100%%_。
items.weapon.melee.spdtomlpd.break.stats_desc=装备这件武器时，你对_生命值低于50%%的敌人_造成的所有伤害_+%s%%_，如果你直接使用破军进行攻击，增伤效果将_提升至%s%%_。
items.weapon.melee.spdtomlpd.break.ability_name=защититься
items.weapon.melee.spdtomlpd.break.ability_desc=Дуэлянт может _защитить_ себя мечом падшего войска, становясь полностью неуязвимой к следующей физической или магической атаке в течение 10 ходов.

items.quest.timeflower.name=цветок времени
items.quest.timeflower.desc=Заколка для волос, которую носили долгое время, словно впитала в себя частичку времени.

items.quest.timeflower$plusflower.name=цветок времени
items.quest.timeflower$plusflower.desc=一份留给你的礼物。\n\n“<#FF0000>继续预借时间吧，无需疑虑，我们有取之不尽的未来呢<RGB>”

items.quest.timeflower.ac_active=ИСПОЛЬЗОВАТЬ
items.quest.timeflower.used=Вы сорвали нить времени с цветка.
items.quest.timeflower.not_used=Вы использовали цветок, но ничего не произошло.

items.quest.deepredflower.name=алая лилия
items.quest.deepredflower.desc=Одинокая красная лилия, ничего особенного.
items.quest.deepredflower.ac_active=ПРИМЕНИТЬ
#items.quest.deepredflower.used=你将花轻轻插在久住的发梢。
items.quest.deepredflower.used=Кусуми мягко улыбнулась и жестом намекнула передать ей цветок.
items.quest.deepredflower.not_used=Вы использовали цветок, но ничего не произошло.

#### 五周年特殊物品
items.fiveyears.selectkeys.name=таинственный ключ
items.fiveyears.selectkeys.desc=С помощью этого волшебного ключа вы можете сформировать нужный вам ключ, кроме того, который отпирает запертый выход с уровня.
items.fiveyears.selectkeys.ac_spawn=СФОРМИРОВАТЬ КЛЮЧ
items.fiveyears.selectkeys$wandsetting.create=Сформировать
items.fiveyears.selectkeys$wandsetting.cancel=Отменить

items.scrolls.exotic.scrollofblessgotend.name=свиток Благословения
items.scrolls.exotic.scrollofblessgotend.desc=Прочитав этот свиток, вы временно благословите своё оружие или броню. Ваше экипированное оружие или броня иметь дополнительный +1 уровень до тех пор, пока вы не победите главного босса этого региона.
items.scrolls.exotic.scrollofblessgotend.weapon=Благословить оружие
items.scrolls.exotic.scrollofblessgotend.armor=Благословить броню

items.weapon.melee.magesstaff$wndmagehand.cant_equip=Вы должны снять палочку перед тем как помещать её в волшебную руку.
items.weapon.melee.magesstaff$wndmagehand.cant_unidentified=Вы не можете помещать неопознанные палочки в волшебную руку.

items.quest.backgokey.name=книга возврата
items.quest.backgokey.desc=当你做好准备后，便要与雪凛峡谷告别了……\n\n如果不想进行商店抢劫，使用该道具返回，但同时本局不能继续抢劫。
items.quest.backgokey.ac_interlevel_tp=Вернуться в подземелье
items.quest.backgokey.dead=Вы отказались от испытания, и теперь не можете в этом путешествии грабить...
items.quest.backgokey.not=Вы не можете вернуться в таинственный каньон, так как книга полностью утратила свою энергию, и теперь стала простым сувениром с напоминанием о том месте.

items.oldsunshadow.name=отголосок воспоминаний
items.oldsunshadow.desc=Этот кристалл имеет бесчисленное множество граней, каждая из которых, кажется, проецирует различные образы - некоторые из пережитых вами событий, другие из миров, не затронутых вашим путешествием... Даже от одного взгляда кружится голова. Внутри него также бурлит таинственная энергия, делая его слегка теплым на ощупь...\n\nЕсли у вас хватит смелости посмотреть на него прямо, огромная сила кристалла перейдет в ваше тело, давая вам возможность выбрать свой подкласс.\n\nНеужели вы действительно не помните свое прошлое?
items.oldsunshadow.ac_wear=ВСМОТРЕТЬСЯ
items.oldsunshadow.not_apply=Отголосок воспоминаний отвергнул вас и просто исчез…
items.oldsunshadow.used=Вы взглянули прямо в кристалл, и тут же в ваше тело проникнула таинственная сила...

items.artifacts.timekeepershourglass$timefreezestats.name=заморозка времени
items.artifacts.timekeepershourglass$timefreezestats.desc=Время застыло вокруг вас, позволяя выполнять действия мгновенно. Эффект будет действовать, пока вы его не отмените или когда у часов закончится энергия. Атака или магия также прервут эффект часов.
items.artifacts.talismanofforesight$foresightstats.name=предвидение
items.artifacts.talismanofforesight$foresightstats.desc=Вы сильно нервничаете, будто рядом есть незримая опасность.
items.artifacts.capeofthorns$thornsstats.name=шипы
items.artifacts.capeofthorns$thornsstats.desc=Ваш плащ излучает энергию, окружая вас отражающим полем!\n\nВо время действия эффекта весь получаемый урон снижен. К тому же, если атакующий стоит рядом с вами, он получит обратно отражённый урон.
items.artifacts.cloakofshadows$cloakstealthstats.name=маскировка
items.artifacts.cloakofshadows$cloakstealthstats.desc=Укрывшись под плащом теней, вы получили временную невидимость. Вы останетесь скрыты, пока не отмените эффект или у плаща не иссякнет энергия.\n\nВ этом состоянии враги не атакуют и не преследуют вас. Атака или использование магии (например, свитка или палочки) немедленно рассеет невидимость.

items.quest.bloodredflower.name=кровавая лилия
items.quest.bloodredflower.desc=Этот цветок, поранивший вас, почти полностью высосал из вас жизненную энергию и теперь расцветает в своей зловещей красе. Судя по всему, он признал вас своим хозяином, так что, возможно, вы сможете воспользоваться его силой.\n\n_Пролитие крови:_ расходует половину текущего здоровья владельца для зарядки цветка жизненной энергией, той же величины. Невозможно совершить, если запас энергии цветка достиг максимума.\n_Извлечение экстракта:_ мгновенно расходует всю жизненную энергию цветка для восстановления здоровья владельца до уровня, израсходованной энергии цветка.\n\n<#94527E>Текущая жизненная энергия цветка: %s/%s.
items.quest.bloodredflower.ac_active=ИЗВЛЕЧЬ ЭКСТРАКТ
items.quest.bloodredflower.ac_blood=ПРОЛИТЬ КРОВЬ
items.quest.bloodredflower.heal=Жизненная энергия в кровавой лилии перетекла в ваше тело, и вы чувствуете себя отдохнувшим.
items.quest.bloodredflower.blood=Вы порезали палец, и кровь потекла на кровавую лилию.
items.quest.bloodredflower.blood_no=Жизненная энергия, заключенная в кровавой лилии, уже в избытке, поэтому сейчас вы не можете пожертвовать свою кровь.
items.quest.bloodredflower.blood_not=Вы слишком слабы, кровавая лилия отказалась принять ваше жертвоприношение кровью.


items.quest.easteregg.name=复活节彩蛋
items.quest.easteregg.desc=一枚装饰精美的复活节彩蛋，蕴藏着春日的惊喜与未知的魔力。\n\n使用它即可开启随机馈赠：\n_-_ 小概率获得精英祝福\n_-_ 大概率收获随机的地牢宝物\n_-_ 极小概率会唤醒彩蛋中潜藏的生灵\n\n复活节快乐！！！
items.quest.easteregg.ac_kitem=砸开！

### 魔剑士-新英雄
items.weapon.melee.imperialexorcism.name=императорский меч изгнания демонов
items.weapon.melee.imperialexorcism.desc=Магический меч, дарованный Императрицей Падкого Хлада, в котором запечатана часть силы ледяного демона.\n\nЭто оружие дополнительно наносит _1-3 урона_ по окоченелой или замороженной цели.

items.weapon.missiles.magicflyblade.name=магический метательный клинок
items.weapon.missiles.magicflyblade.stats=Это уникальное метательное оружие наносит _%1$d-%2$d_ ед. урона и требует _%3$d очков силы_ для эффективного использования.
items.weapon.missiles.magicflyblade.desc=Этот магический клинок был выкован королевскими кузнецами и зачарован чародеями Империи Падкого Хлада, применив множество передовых магических технологий, чтобы показать величие магического ремесла Империи Падкого Хлада.
items.weapon.missiles.magicflyblade.distance=Это оружие управляется магией Мечника и получает дополнительный бонус к _точности_ при атаке целей на расстоянии, и даже не теряет её в _ближнем бою_. В отличие от другого метательного оружия, оно не изнашивается при использовании. Если после броска у Мечника ещё остается магическая сила, он автоматически тратит _1 ед. магической силы_, чтобы вернуть оружие себе. (этот действие не тратит ход).

### 特殊书籍
items.books.questbookslist.tombreachbook.name=записи обследования древней гробницы
items.books.questbookslist.tombreachbook.desc=致古墓探索测试员：\n阅览本手记即可解锁古墓测试区域，抵达11层后，场景将切换为古墓秘境。\n\n本道具仅限内部测试使用，正式版前会更换全新开启方式，上线前将完成全流程核验测试。
items.books.questbookslist.tombreachbook.ac_read=Тестовый запуск
items.books.questbookslist.tombreachbook.author=Группа тестирования MLPD
items.books.questbookslist.tombreachbook.action=Локация «Тайны древних гробниц» активирована! Перейдите на 11-й этаж или сбросьте его, чтобы загрузить соответствующую локацию.

###TOMB
items.food.tomb.gravemeat.name=гнилое мясо
items.food.tomb.gravemeat.desc=Это кусок мяса, который еще не успел сильно протухнуть, и можно превратить в обычное мясо с помощью алхимии, но в сыром виде оно едва пригодно для употребления, хотя если хотите попробуйте его так на свой страх и риск.
items.food.tomb.gravemeat.eat_msg=Во рту застыл смрад гниющего мяса, а его холод пронизывает живот…
items.food.tomb.gravemeat.poison=Мощный токсин из гниющего мяса проник по горлу во все части тела, отравив вас!
items.food.tomb.gravemeat.vertigo=Гнилостный запах ударил в голову, и перед глазами всё закружилось, и вас охватило головокружение!
items.food.tomb.gravemeat.corrosion=Гнилостная слизь, выделяемая гниющим мясом, прилипла к коже и непрерывно разъедает ваше тело!
items.food.tomb.gravemeat.weakness=Гнилой запах лишает вас сил, обременяя все тело слабостью!
items.food.tomb.gravemeat.downlevel=Жизненная энергия в теле подавлена гнилостным запахом, снижая временно эффективность экипировки!

items.food.tomb.frozengravemeat.name=замороженное гнилое мясо
items.food.tomb.frozengravemeat.desc=Это кусок насквозь промороженного гнилого мяса. Хотя неясно, почему кто-то решил, что заморозка снизит его токсичность, но это действительно в какой-то мере сработало, и если удалить подгнившие участки, на вкус оно довольно вкусное.
items.food.tomb.frozengravemeat.eat_msg=Ледяной холод во рту не смог заглушить остатки гниющего запаха, а пронизывающий холод распространился из пищевода по всему телу.
items.food.tomb.frozengravemeat.poison=Токсины из замороженного гнилого мяса разъедают ваше тело!
items.food.tomb.frozengravemeat.vertigo=Закружилась голова!
items.food.tomb.frozengravemeat.corrosion=Гнилостная слизь прилипла к коже!
items.food.tomb.frozengravemeat.heal=Замороженное мясо таит слабую жизненную энергию, способствующую заживлению ран!
items.food.tomb.frozengravemeat.invisible=Холод окутывает все ваше тело, и вы становитесь невидимым!
items.food.tomb.frozengravemeat.barskin=Толстая и твердая кора покрывает всё тело, наделяя вас дубовой кожей!

items.food.tomb.cookgravemeat.name=прожаренное гнилое мясо
items.food.tomb.cookgravemeat.desc=После прожарки на сильном огне гнилое мясо приобрело вид, напоминающий кожу; оно прожарилось, а его токсичность немного снизилась, благодаря чему оно стало хоть как-то съедобным.
items.food.tomb.cookgravemeat.eat_msg=Запах дыма и гари не смог заглушить неприятный запах гнили, а сухое, жесткое жареное мясо проскользнуло по горлу в желудок.
items.food.tomb.cookgravemeat.poison=Токсины от жареного гнилого мяса, просочились по всему телу, медленно разъедая организм!
items.food.tomb.cookgravemeat.vertigo=Дым, пронизанный гнилостным запахом, ударил в голову, вызвав головокружение и тяжесть!


items.potions.elixirs.ghostlingelixir.name=эликсир Фосфорного пламени
items.potions.elixirs.ghostlingelixir.desc=结合了磷火的不稳定性质，和无序结晶与升级卷轴的强大力量。你可以使用鬼磷秘药来冲刷3x3范围内的_投掷武器/近战武器/护甲_。\n\n如果在附魔火焰中有英雄存在，则还会给英雄提供<#FF0>8回合无敌<RGB>。

items.quest.killswarm.name=инсектицид
items.quest.killswarm.desc=Если вы столкнулись с проблемой чрезмерно агрессивных мух в версии 0.9.5.0, воспользуйтесь этим. Используйте не более двух раз.
items.quest.killswarm.ac_kill=ДЕЗИНФИЦИРОВАТЬ





