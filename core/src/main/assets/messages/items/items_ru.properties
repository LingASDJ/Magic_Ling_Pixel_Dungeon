items.artifacts.masterthievesarmband.desc=Этот фиолетовый нарукавник из бархата несёт на себе знак мастера воровского дела. Вам он не принадлежит, равно как и прошлому владельцу.
items.artifacts.masterthievesarmband.desc_cursed=Проклятый нарукавник впивается в ваше запястье, и каким-то странным образом ваш мешочек с золотом начинает становиться легче...
items.artifacts.masterthievesarmband.desc_worn=Вы чувствуете, как нарукавник на вашем запястье заряжается силой, чем больше опыта вы приобретаете. Эту силу вы можете использовать для того, чтобы грабить магазины или врагов! <#f00> Однако учтите: Лена, ведьма Темного пламени - покровительница торговцев. Она ненавидит воровство - поступок, который выводит её из себя куда сильнее, чем открытый грабёж! <RGB>\n\nОграбление врагов происходит моментально, они на короткое время теряют ориентацию, и у вас появляется шанс получить любой предмет, который у них имеется. Эта сила более действительна против не подозревающих ничего врагов. Повторная попытка ограбить одного и того же врага не прибавляет шансов успеха в ограблении.


