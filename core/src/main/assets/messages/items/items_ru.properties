items.artifacts.capeofthorns.name=шипастый плащ
items.artifacts.capeofthorns.desc=Груда металлических листов, оставшихся от DM-720, собралась в грубый плащ. В нём таится какая-то энергия, быть может, часть сил DM-720?
items.artifacts.capeofthorns.ac_thorns=СИЛОВОЕ ПОЛЕ
items.artifacts.capeofthorns.ac_thorns_cancel=ОТКЛЮЧИТЬ ЩИТ
items.artifacts.capeofthorns.thorns_equip=Вам необходимо надеть плащ, чтобы его использовать.
items.artifacts.capeofthorns.thorns_cancel=Вы самолично отключили силовое поле, и потребление энергии для щита прекратилось.
items.artifacts.capeofthorns.thorns=Плащ излучает накопленную энергию, защищая владельца силовым полем.
items.artifacts.capeofthorns.thorns_wait=Для активации силового поля требуется не менее 10% энергии.
items.artifacts.capeofthorns.thorns_cursed=Вы не можете использовать проклятый шипастый плащ.
items.artifacts.capeofthorns.desc_cursed=Проклятый шипастый плащ плотно обволок ваше тело, из-за чего ваши раны заживают еще труднее.
items.artifacts.capeofthorns.thorns_active=Ваш шипастый плащ уже активирован, поэтому его пока нельзя активировать повторно.

items.artifacts.capeofthorns$thornstime.name=силовое поле из шипов
items.artifacts.capeofthorns$thornstime.desc=斗篷在你周围辐射出能量，形成了一道偏斜力场！\n\n以当前等级，你将每次有可能减免_%s%%~%s%%_的伤害。\n\n当敌人试图伤害你时，原始伤害将反弹给攻击者，并使其流血不止。\n\n同时，以你为中心、_%s格半径_的圆形范围内的所有敌人，都会受到荆棘的绞杀，持续受到物理伤害并陷入流血状态。\n\n荆棘力场剩余持续时间：%s回合
items.artifacts.capeofthorns$thornstime.no_charge=Ваш шипастый плащ полностью разрядился.
items.artifacts.capeofthorns$thornstime.levelup=Ваш шипастый плащ стал сильнее!
items.artifacts.capeofthorns$thornstime.block=Получаемый урон снижен на %s ед.


items.artifacts.chaliceofblood.name=кровавая чаша
items.artifacts.chaliceofblood.ac_prick=УКОЛОТЬСЯ
items.artifacts.chaliceofblood.yes=Да, я знаю, что я делаю
items.artifacts.chaliceofblood.no=Нет, я передумал
items.artifacts.chaliceofblood.tip=Обратите внимание, что Кровавая чаша должна быть не экипирована, если хотите использовать её в алхимии.
items.artifacts.chaliceofblood.prick_warn=С каждым использованием чаша забирает всё больше вашей жизненной энергии и может с лёгкостью вас убить.\n\nВы уверены, что хотите предложить ей ещё?
items.artifacts.chaliceofblood.onprick=Вы роняете каплю своей крови в чашу, отдавая ей часть своей жизненной энергии.
items.artifacts.chaliceofblood.ondeath=Чаша осушила вас до конца...
items.artifacts.chaliceofblood.desc=Блестящая серебряная чаша с острыми кристаллами на кромке.
items.artifacts.chaliceofblood.desc_cursed=Эта чаша проклята и не позволит выпустить себя из рук. Её влияние замедляет естественное заживление ран.
items.artifacts.chaliceofblood.desc_1=Держа чашу в руках, вы чувствуете странное желание уколоть себя этими острыми кристаллами.
items.artifacts.chaliceofblood.desc_2=На дне чаши виднеется немного крови, вам кажется, что она возвращает часть энергии вам. Вам всё ещё хочется поранить себя, хоть вы знаете, что это больно.
items.artifacts.chaliceofblood.desc_3=Чаша до краёв наполнена вашей энергией. Вы чувствуете, как она возвращает её вам.
items.artifacts.chaliceofblood.desc_4=\n\nПримерный урон наносимый чашей: 
items.artifacts.chaliceofblood.desc_5=\n\nОбратите внимание, что чаша 0-го уровня наносит 1 урон, а сам урон может бить нейтрализован различными видами защиты.

items.artifacts.cloakofshadows.name=плащ теней
items.artifacts.cloakofshadows.ac_stealth=УКРЫТЬСЯ
items.artifacts.cloakofshadows.cooldown=Плащу требуется ещё %d ходов для перезарядки.
items.artifacts.cloakofshadows.cursed=Вы не можете использовать проклятый плащ.
items.artifacts.cloakofshadows.no_charge=Ваш плащ недостаточно заряжен, чтобы его можно было использовать.
items.artifacts.cloakofshadows.desc=Бесценный волшебный плащ, много лет назад украденный Разбойником из королевской оружейной. Носящий плащ может на короткое время становиться невидимым.\n\nЧем больше плащ используется. тем сильнее он становится, позволяя Разбойнику становиться невидимым чаще и на больший срок.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Ваш плащ полностью разрядился.
items.artifacts.cloakofshadows$cloakstealth.levelup=Ваш плащ стал сильнее!
items.artifacts.cloakofshadows$cloakstealth.name=маскировка
items.artifacts.cloakofshadows$cloakstealth.desc=Укрывшись под плащом теней, вы получили временную невидимость. Вы останетесь скрыты, пока не отмените эффект или у плаща не иссякнет энергия.\n\nВ этом состоянии враги не атакуют и не преследуют вас. Атака или использование магии (например, свитка или палочки) немедленно рассеет невидимость.\n\nХодов осталось: %d.
items.artifacts.cloakofshadows.ac_bloodbat=СОРАТНИК

items.artifacts.driedrose.name=засохшая роза
items.artifacts.driedrose.ac_summon=ПРИЗВАТЬ
items.artifacts.driedrose.sorry=Путешественник, прости, но мне пора к своей возлюбленной...
items.artifacts.driedrose.ac_direct=НАПРАВИТЬ
items.artifacts.driedrose.ac_outfit=СНАРЯДИТЬ
items.artifacts.driedrose.no_spawned=Сильная магия этого места не позволяет вам вызывать призраков.
items.artifacts.driedrose.spawned=Вы уже призвали призрака.
items.artifacts.driedrose.no_charge=Ваша роза ещё не заряжена.
items.artifacts.driedrose.cursed=Вы не можете использовать проклятую розу.
items.artifacts.driedrose.no_space=Рядом с вами нет свободного места.
items.artifacts.driedrose.charged=Ваша роза полностью заряжена!
items.artifacts.driedrose.desc=Не та ли это роза, о которой упоминал тот призрак перед тем как исчезнуть? Кажется, в ней есть какая-то духовная сила. Возможно, с её помощью можно призвать дух того погибшего воина...
items.artifacts.driedrose.desc_no_quest=Старая засохшая роза, которая каким-то образом уцелела через столько лет.\n\nВы чувствуете, что в ней теплится какая-то сила, однако понятия не имеете, как эту силу использовать.
items.artifacts.driedrose.desc_hint=Не хватает нескольких лепестков. Наверное, роза станет могущественнее, если их вернуть.
items.artifacts.driedrose.desc_cursed=Проклятая роза оплетает вашу руку. От неё сильно веет холодом.
items.artifacts.driedrose.desc_weapon=Оружие призрака: %s.
items.artifacts.driedrose.desc_armor=Броня призрака: %s.
items.artifacts.driedrose.desc_strength=Сила призрака: %s.
items.artifacts.driedrose$petal.name=засохший лепесток
items.artifacts.driedrose$petal.no_rose=У вас нет розы, к которой можно прикрепить этот лепесток.
items.artifacts.driedrose$petal.no_room=Для этого лепестка не осталось места, вы его выбрасываете.
items.artifacts.driedrose$petal.maxlevel=Теперь все лепестки на месте!
items.artifacts.driedrose$petal.levelup=Вы прикрепляете лепесток к розе.
items.artifacts.driedrose$petal.desc=Хрупкий высушенный лепесток. Как он оказался здесь в целости и сохранности?
items.artifacts.driedrose$wndghosthero.title=Экипировка призрака
items.artifacts.driedrose$wndghosthero.desc=Призрак не особенно силен сам по себе, но он достаточно осязаем, чтобы носить оружие и доспехи. Он сможет использовать их точно так же, как и вы.\n\nВ данный момент призрак может экипировать вещи, требующие не более _%d ед. силы._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Выберите оружие
items.artifacts.driedrose$wndghosthero.armor_prompt=Выберите доспехи
items.artifacts.driedrose$wndghosthero.cant_unique=Призрак не способен использовать уникальные предметы.
items.artifacts.driedrose$wndghosthero.cant_unidentified=Вам ничего толком не известно об этом предмете.
items.artifacts.driedrose$wndghosthero.cant_cursed=Призрак не станет использовать проклятый предмет.
items.artifacts.driedrose$wndghosthero.cant_strength=Призрак слишком слаб для того, чтобы это использовать.

##ghost hero
items.artifacts.driedrose$ghosthero.name=печальный призрак
items.artifacts.driedrose$ghosthero.def_verb=избегает

items.artifacts.driedrose$ghosthero.hello=И снова здравствуй, %s.
items.artifacts.driedrose$ghosthero.introduce=Мой дух связан с этой розой. Она была очень дорога мне - это подарок от очень важного для меня человека, чью любовь я оставил на поверхности.\n\nЯ не могу к нему вернуться, но благодаря тебе у меня появился второй шанс завершить свой путь. Я отвечу на твой зов и буду биться за тебя, когда смогу.\n\nПока роза у тебя, я могу слышать твой голос, таким образом ты можешь использовать её, чтобы направить меня издалека.\n\nНадеюсь, ты справишься там, где не справился я...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Эти джунгли когда-то были безопасны, люди даже жили тут во время зимы.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Интересно, что случилось с теми, кто патрулировал это место?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=У меня была семья на поверхности. Я надеюсь, что они в безопасности.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Стражники не смогли одолеть этих монстров... Но, может, это сможем мы.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Если даже джунгли настолько опасны, боюсь представить, что творится ниже...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Что заставило этих крыс и крабов вырасти до таких размеров?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Я слышал разные истории об этом месте, но ни одной хорошей.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Это место всегда было скорее лабиринтом, чем тюрьмой.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Боюсь даже представить, что тут началось, когда это место объявили заброшенным.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Похоже на то, что и заключенные, и стражники превратились в монстров.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Что же могло вернуть этих мертвецов к жизни?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Эти люди не должны были закончить вот так...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Здесь не было ни людей, ни дворфов в течении очень долгого времени.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Что могло заставить дворфов покинуть золотые рудники?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Жалко, что всё золото здесь будет бесполезным на поверхности.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Существа в этих пещерах мутировали, прямо как в джунглях.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Даже летучие мыши здесь стали кровожадными.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Ни следа горного оборудования, неужели дворфы все разворовали?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Дворфы были трудолюбивыми, но жадными.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Значит, столица дворфов действительно пала.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Надеюсь, что город наверху никогда таким не станет.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Дворфы не должны выглядеть настолько бледными.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Я не знаю, что хуже - дворфы или их творения.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Похоже, дворфы сейчас такие же безмозглые монстры.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Что это за место?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Это место вызывает ужас...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=О чём думали дворфы, играясь с такой силой?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Монстры здесь будто не из нашего мира, откуда они взялись?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Ты чувствуешь это? За нами будто что-то наблюдает.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Слава богу, здесь есть факелы, тут так темно!

#克里弗斯之果
items.artifacts.driedrose$ghosthero.seen_crivuefruit_1=Похоже, это и есть главный виновник разрастающегося леса...
items.artifacts.driedrose$ghosthero.seen_crivuefruit_2=Мы должны избавится от этого сорняка.
items.artifacts.driedrose$ghosthero.seen_crivuefruit_3=Пришел час, яблоку раздора ответить за содеянное!

items.artifacts.driedrose$ghosthero.seen_mimick_1=Это же Король мимиков, не так ли? Кто же мог подумать, что под ледяной тюрьмой таится такая ужасающая сила...
items.artifacts.driedrose$ghosthero.seen_mimick_2=Похоже, ты убил много мимиков, и их повелитель не рад этому.
items.artifacts.driedrose$ghosthero.seen_mimick_3=Поговаривают, именно он король всех мимиков, но обрел человекоподобный облик от долгого извращения магией.

items.artifacts.driedrose$ghosthero.seen_tengu_1=Единственный оставшийся заключенный - смертельный убийца. Ну конечно...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Мы в ловушке!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Я слышал ужасные истории об этой маске...

items.artifacts.driedrose$ghosthero.seen_dm720_1=Неужели это то самое оружие дворфов для устранения катастрофы?
items.artifacts.driedrose$ghosthero.seen_dm720_2=Я слышал DM720, экспериментальная модель DM300, но самое страшное не это, а сумасшедший водитель внутри.
items.artifacts.driedrose$ghosthero.seen_dm720_3=Повезло, что в свое время дворфы построили лишь несколько таких машин, и то один из них уже давно забыл свои обязанности.

items.artifacts.driedrose$ghosthero.seen_dm300_1=Только дворфы могли создать шахтерскую машину и оставить её убивать незваных гостей.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Эта штука огромна...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Как эта штука оставалась активной так долго?

items.artifacts.driedrose$ghosthero.seen_girl_1=Я чувствую в этой девушке огромную силу, похоже, она та самая потерянная ледяная принцесса.
items.artifacts.driedrose$ghosthero.seen_girl_2=Когда-то ледяная принцесса отправилась сюда очистить это место, но вместо этого подалась его контролю.
items.artifacts.driedrose$ghosthero.seen_girl_3=Когда-то она была в самом расцвете сил, но стала ведьмой. Это напоминает мне о том, что я тоже уже давно не человек.

items.artifacts.driedrose$ghosthero.seen_king_1=Когда люди говорят, что власть развращает, это именно то, что они имеют в виду.
items.artifacts.driedrose$ghosthero.seen_king_2=Теперь он больше лич, чем король.
items.artifacts.driedrose$ghosthero.seen_king_3=Даже после смерти дворфы подчиняются своему хозяину.

items.artifacts.driedrose$ghosthero.seen_yog_1=Ох, это не выглядит хорошо.
items.artifacts.driedrose$ghosthero.seen_yog_2=Так вот как выглядит бог?
items.artifacts.driedrose$ghosthero.seen_yog_3=Это будет больно...

items.artifacts.driedrose$ghosthero.seen_doge_1=%s, быстрее убегай, это что-то из самого пекла.
items.artifacts.driedrose$ghosthero.seen_doge_2=О нет, это существо более могущественнее, древнего бога! %s, я сделаю все, что в моих силах, чтобы тебе помочь.
items.artifacts.driedrose$ghosthero.seen_doge_3=Его окружает запах смерти...

items.artifacts.driedrose$ghosthero.seen_frgirl_1=Это страж заснеженного каньона?
items.artifacts.driedrose$ghosthero.seen_frgirl_2==У меня такое ощущение, что она очень злая...
items.artifacts.driedrose$ghosthero.seen_frgirl_3=Она делает воздух все более странным...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Удачи...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Устал...пока что...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Я вернусь...
