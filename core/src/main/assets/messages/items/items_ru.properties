items.thanks.huntingcarnival.name=狩猎狂欢
items.thanks.huntingcarnival.desc=每回合，三位狙击手朝本层随机敌人发射各自的箭矢；每个敌人每回合只会被1种箭选为目标。\n剩余回合：%d，三位狙击手冷却：%d / %d / %d 回合

items.thanks.huntingcarnival.frost_hit_0=狙击手帕列托：打中了！去看医生吧。
items.thanks.huntingcarnival.frost_hit_1=Ледяной выстрел: Ага! В следующий раз получше прячься!
items.thanks.huntingcarnival.frost_hit_2=Ледяной выстрел: Вот и все! Теперь ему не уйти.

