items.armor.armor.stats_desc=

items.scrolls.extra.scrollofteletation.inv_title=Превратить предмет
items.scrolls.extra.scrollofteletation.name=превращение Золотой бабочки
items.scrolls.extra.scrollofteletation.desc=Этот свиток внешне очень схож на свиток Золотой бабочки, но имеет похожий эффект, что и у свитка Превращения. При использовании свиток превращает любой предмет, улучшая и проклиная при этом. \n\nИнтересно, можно ли с помощью его сделать зелье +1?\n\nУчтите, покидая 0 этаж, свиток автоматически исчезнет...

items.scrolls.extra.scrollofsoul.name=灵魂卷轴
items.scrolls.extra.scrollofsoul.desc=这张卷轴拥有着恐怖的灵魂力量，足以使阅读者获得强大而持久的力量，获得_%s回合升灵_\n\n但由于失去了制作者的魔力蕴养，会快速失去效力_每携带20回合，给予的升灵回合数额外减少1回合_\n由于这张卷轴有专属标识，所以无需被鉴定。
items.scrolls.extra.scrollofsoul$upgradesoul.name=升灵
items.scrolls.extra.scrollofsoul$upgradesoul.desc=免疫所有负面效果_饥饿、遗物带来的效果除外_，攻速和移速x2\n\n效果持续期间每击杀一只怪物，永久提升 2%% 攻击力与 2%% 免伤，免伤提升上限 90%%\n\n剩余效果时间：%s回合\n攻击增幅：%s%%\n免伤增幅：%s%%


items.quest.devitem.magicbook.name=неиссякаемый сборник историй
items.quest.devitem.magicbook.desc=На нем записано много незавершенных историй, некоторые только начались, а некоторые близки к концу. Судя по временным меткам, указанным на страницах книги, создается впечатление, что кто-то дополняет те истории каждый день. \n\nНа последней странице кем-то оставлены несколько слов, которые, очевидно, были написаны только что: _«Все кто это читает, пожелайте мне счастливого дня рождения, мяу!!!»_\n\nНошение этого предмета дает особые эффекты при движении ночью. Период действия с 14.05 по 21.05 каждого года (по григорианскому календарю).

items.quest.skinitem$skin_wa.name=Спортивный костюм
items.quest.skinitem$skin_wa.desc=Один из личных нарядов Воина, светло-голубой наряд символизирует его оптимистичный и жизнерадостный характер, можно с уверенностью сказать, что в подземелье будет очень комфортно в этом наряде.

items.quest.skinitem$skin_ma.name=Экзотический костюм
items.quest.skinitem$skin_ma.desc=Один из личных нарядов Мага, таинственный фасон создает некое неуловимое ощущение, очаровательного и привлекательное чувство, проникающее повсюду, даже монстры впадают в оцепенение увидев его.

items.quest.skinitem$skin_ra.name=Теневой костюм
items.quest.skinitem$skin_ra.desc=Один из личных нарядов Разбойника, считается что это облачение отлично подошло под её внешней вид, когда она решила сбрить волосы, еще будучи в королевской семьи. Это облачение также является её единственным королевским нарядом.

items.quest.skinitem$skin_ha.name=Ведьмовский костюм
items.quest.skinitem$skin_ha.desc=Один из личных нарядов Охотницы, который подражает внешнему виду некого человека, а королевские монеты в её руке создают впечатление, что она действительно владеет ведьмовской магией, но на самом деле секретным оружием является её владение волшебным луком.

items.quest.skinitem$skin_da.name=Неизвестная ошибка
items.quest.skinitem$skin_da.desc=???, Что это такое? Странная одежда Дуэлянта, которая как считается, называется «Заполнителем».

items.quest.skinitem$skin_wb.name=Саяка Мики
items.quest.skinitem$skin_wb.desc=Играйте за «Саяка Мики», девочку-волшебницу из Puella Magi Madoka Magica.

items.quest.skinitem$skin_mb.name=Мадока Канамэ
items.quest.skinitem$skin_mb.desc=Играйте за «Мадока Канамэ», девочку-волшебницу из Puella Magi Madoka Magica.

items.quest.skinitem$skin_rb.name=Хомура Акэми
items.quest.skinitem$skin_rb.desc=Играйте за «Хомура Акэми», девочку-волшебницу из Puella Magi Madoka Magica.

items.quest.skinitem$skin_hb.name=Мами Томоэ
items.quest.skinitem$skin_hb.desc=Играйте за «Мами Томоэ», девочку-волшебницу из Puella Magi Madoka Magica.

items.quest.skinitem$skin_db.name=Кёко Сакура
items.quest.skinitem$skin_db.desc=Играйте за «Кёко Сакура», девочку-волшебницу из Puella Magi Madoka Magica.

items.quest.skinitem$skin_wc.name=платье «Белоснежная роза»
items.quest.skinitem$skin_wc.desc=Среди переливающихся багряных и лазурных оттенков наряда, и опущенного окровавленного лезвия алебарды, на вечернем пиру расцветет белоснежная роза в глазах публики.

items.quest.skinitem$skin_mc.name=学院时光
items.quest.skinitem$skin_mc.desc=茉莉就读于法师学院时的制服，在校时，她是数一数二的魔法尖子生。传闻她常独自待在图书馆最深处，研读那些失传已久的古老法术……

items.quest.skinitem$skin_rc.name=платье «Сумеречное пиршество»
items.quest.skinitem$skin_rc.desc=Под этой приветливой улыбкой, скрывается предательство, и когда обнажится смертоносный клинок, этой ночью прольется кровь.

items.quest.skinitem$skin_hc.name=皮肤投稿
items.quest.skinitem$skin_hc.desc=Этот скин был удален из-за ряда причин. Если у вас есть оригинальные скины, которые вы хотите предложить, свяжитесь с командой разработчиков Magic Ling.

items.quest.skinitem$skin_dc.name=女仆红狐
items.quest.skinitem$skin_dc.desc=炉边煮好了咖啡，主人，要不要来一杯歇歇？

items.quest.skinitem$skin_dd.name=埃及艳后
items.quest.skinitem$skin_dd.desc=大漠热风裹挟着金饰微光，绿洲的女王在此等候你的到来。

items.quest.skinitem$skin_md.name=寂夜余温
items.quest.skinitem$skin_md.desc=星海决战后的黎明，它从梦魇中脱身，发现枕边多了一件从未见过的衣服。衣料上依稀残留的温度，来自一位已消散于位面缝隙的故人——此世星图，再无她的坐标。


###trinkets
items.trinkets.chaoticcenser.name=хаотичное кадило
items.trinkets.chaoticcenser.desc=Побывав в котле какое-то время, это кадило для благовоний начало создавать дым само по себе! Эти газы накапливаются и будут выбрасываться из кадила в произвольных направлениях и полуслучайных интервалах. Судя по всему, оно способно производить все виды газов, но положение, в котором они вылетают, похоже, больше в ваших интересах.
items.trinkets.chaoticcenser.typical_stats_desc=Обычно этот аксессуар будет производить поблизости вредный газ каждые _%d_ ходов. Газ появляется чаще, когда поблизости враги, и меньше в тесных пространствах. При более высоких уровнях эти газы будут более экзотическими и мощными.
items.trinkets.chaoticcenser.stats_desc=На данном уровне этот аксессуар будет производить поблизости вредный газ каждые _%d_ ходов. Газ появляется чаще, когда поблизости враги, и меньше в тесных пространствах. При более высоких уровнях эти газы будут более экзотическими и мощными.

items.trinkets.dimensionalsundial.name=межпространственные солнечные часы
items.trinkets.dimensionalsundial.warning=Солнечные часы перестали отбрасывать тень. Вы ощущаете тревогу.
items.trinkets.dimensionalsundial.desc=Эти портативные солнечные часы каким-то образом способны отбрасывать тень в глубинах подземелья, даже если вы не держите их правильно. Еще более странно положение тени, которая, похоже, не имеет никакого отношения к солнцу в этом мире. Когда тень не отбрасывается, кажется, что солнечные часы привлекают опасность.
items.trinkets.dimensionalsundial.typical_stats_desc=Обычно этот аксессуар уменьшает количество противников днём (8:00-20:00) на _%1$d%%_ и увеличивает ночью (20:00-8:00) на _%2$d%%_.
items.trinkets.dimensionalsundial.stats_desc=На данном уровне этот аксессуар уменьшает количество противников днём (8:00-20:00) на _%1$d%%_ и увеличивает ночью (20:00-8:00) на _%2$d%%_.

items.trinkets.exoticcrystals.name=экзотические кристаллы
items.trinkets.exoticcrystals.desc=Эти мелкие розоватые кристаллы имеют такую же форму, что и кристаллы алхимической энергии. Хотя их и нельзя напрямую использовать для получения энергии, те, видимо, каким-то образом влияют на зелья и свитки, которые вы находите.
items.trinkets.exoticcrystals.typical_stats_desc=Обычно этот аксессуар будет заменять _%s%%_ появляющихся зелий и свитков их особыми версиями. Эффект не затрагивает зелья Силы, свитки Улучшения и предметы, которые требуются для решения головоломок.
items.trinkets.exoticcrystals.stats_desc=На текущем уровне этот аксессуар будет заменять _%s%%_ появляющихся зелий и свитков их особыми версиями. Эффект не затрагивает зелья Силы, свитки Улучшения и предметы, которые требуются для решения головоломок.

items.trinkets.eyeofnewt.name=глаз тритона
items.trinkets.eyeofnewt.desc=Этот золотисто-черный глаз тритона — обычный ингредиент, теперь превращённый в аксессуар. Глаз, по-видимому, ухудшает зрение в обмен на то, что позволяет видеть вещи по-другому.
items.trinkets.eyeofnewt.typical_stats_desc=Обычно этот аксессуар уменьшает дальность обзора на _%1$s%%_, но также даёт возможность ментально видеть врагов в пределах _%2$d_ клеток.
items.trinkets.eyeofnewt.stats_desc=На текущем уровне этот аксессуар уменьшит дальность обзора на _%1$s%%_, но также даст возможность ментально видеть врагов в пределах _%2$d_ клеток.

items.trinkets.mimictooth.name=зуб мимика
items.trinkets.mimictooth.desc=Видимо, этот огромный клык вырвали у неудачливого мимика. Кажется, он каким-то образом влияет на мимиков, из-за чего они появляются чаще и становятся опаснее.
items.trinkets.mimictooth.typical_stats_desc=Обычно этот аксессуар призывает мимиков в _%1$s_ раз чаще, но сделает их обнаружить, а также увеличит выпадение предметов с них. Кроме того, на каждом уровне будет шанс появления очень скрытных эбонитовых мимиков, равный _%2$s%%_.
items.trinkets.mimictooth.stats_desc=На данном уровне этот аксессуар призывает мимиков в _%1$s_ раз чаще, но сделает их сложнее обнаружить, а также увеличит выпадение предметов с них. Кроме того, на каждом уровне будет шанс появления очень скрытных эбонитовых мимиков, равный _%2$s%%_.

items.trinkets.mossyclump.name=комок мха
items.trinkets.mossyclump.desc=Этот сгусток мокрого мха остаётся влажным, как сильно вы бы его не сжимали. Судя по всему, он магически связан с самим подземельем, из-за чего вода и трава будут появляться чаще.
items.trinkets.mossyclump.typical_stats_desc=Как правило, из-за этого аксессуара _%d%%_ обычных этажей заполняются водой или травой.\n\nУлучшение этого аксессуара требует очень большого количества энергии.
items.trinkets.mossyclump.stats_desc=На текущем текущем уровне этот аксессуар заполнит _%d%%_ обычных этажей либо водой, либо травой.\n\nУлучшение этого аксессуара требует очень большого количества энергии.

items.trinkets.parchmentscrap.name=обрывок пергамента
items.trinkets.parchmentscrap.desc=Этот маленький клочок пергамента выглядит так, будто его вырезали из свитка. Он сохранил часть своей магии, и, похоже, влияет на оружие и доспехи, найденные в подземелье.
items.trinkets.parchmentscrap.typical_stats_desc=Как правило, этот аксессуар делает зачарования и руны _%d_ обычными, а проклятия на оружии и доспехах _%s_ такими же обычными. Проклятия на палочки, кольца или артефакты не действуют.\n\nУлучшение этого аксессуара требует очень большого количества энергии.
items.trinkets.parchmentscrap.stats_desc=На текущем уровне этот аксессуар сделает зачарования и руны _%d_ обычными, а проклятия на оружии и доспехах _%s_ такими же обычными. Проклятия на палочки, кольца или артефакты не действуют.\n\nУлучшение этого аксессуара требует очень большого количества энергии.

items.trinkets.petrifiedseed.name=окаменевшее семя
items.trinkets.petrifiedseed.desc=Это семя превратилось в окаменелость либо в результате медленных геологических процессов, либо с помощью магии. Похоже, что семя магическим образом влияет на флору подземелья, иногда заменяя семена растений руническими камнями.
items.trinkets.petrifiedseed.typical_stats_desc=Этот аксессуар сделает так, что из растоптанной травы будут выпадать рунные камни вместо семян в _%1$s%%_ случаев. Он так же увеличит шанс выпадения предметов из высокой травы на _%2$s%%_.
items.trinkets.petrifiedseed.stats_desc=На текущем уровне этот аксессуар сделает так, что из растоптанной травы будут выпадать рунные камни вместо семян в _%1$s%%_ случаев. Он так же увеличит шанс выпадения предметов из высокой травы на _%2$s%%_.

items.trinkets.ratskull.name=череп крысы
items.trinkets.ratskull.desc=Этот жутковатый аксессуар не намного больше черепа обычной крысы, что является большой редкостью в этом подземелье. Магическое влияние черепа, похоже, привлекает более редких обитателей подземелья, заставляя их появляться гораздо чаще.
items.trinkets.ratskull.typical_stats_desc=Как правило, этот аксессуар увеличит шанс появления особых врагов в _%d_ раз. Однако череп в два раза менее эффективен в привлечении кристаллических мимиков и живых статуй.
items.trinkets.ratskull.stats_desc=На текущем уровне этот аксессуар увеличит шанс появления особых врагов в _%d_ раз. Однако череп в два раза менее эффективен в привлечении кристаллических мимиков и живых статуй.

items.trinkets.saltcube.name=куб соли
items.trinkets.saltcube.desc=Этот крупный кристалл соли был вырезан в форме почти идеального куба, и ему каким-то образом удалось слить половину воды из алхимического котла вместо того, чтобы раствориться. Кажется, что это волшебным образом обезвоживает и сохраняет пищу, которую вы едите, продлевая чувство сытости, но также уменьшая восстановление вашего здоровья, когда вы не голодаете.
items.trinkets.saltcube.typical_stats_desc=Как правило, этот аксессуар увеличит ваше время сытости на _%1$s%%_, но уменьшит эффективность восстановления здоровья на _%2$s%%_.
items.trinkets.saltcube.stats_desc=На текущем уровне этот аксессуар увеличит ваше время сытости на _%1$s%%_, но уменьшит эффективность восстановления здоровья на _%2$s%%_.

items.trinkets.crackedspyglass.name=сломанная подзорная труба
items.trinkets.crackedspyglass.desc=Этот ручной телескоп был бы демонстрацией великой и тонкой работы, не будь у него трещины в передней линзе. Подзорная труба, кажется, помогает, раскрывая новые предметы в подземелье. Но из-за ее изъяна, раскрытые предметы не очень просто увидеть!
items.trinkets.crackedspyglass.typical_stats_desc=Обычно этот аксессуар имеет _%1$s%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса.
items.trinkets.crackedspyglass.stats_desc=На текущем уровне этот аксессуар имеет _%1$s%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса.
items.trinkets.crackedspyglass.stats_desc_upgraded=На текущем уровне этот аксессуар имеет _100%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса, а также _%1$s%% шанс_ на создание второго дополнительного скрытого предмета.

items.trinkets.ferrettuft.name=мех хорька
items.trinkets.ferrettuft.desc=Пучок шелковистого белого меха хорька, скреплённый лаймово-зелёной лентой, завязанной в бант. Хорьки известны своим проворством, озорством и отсутствием добросовестности. Часть этой энергии исходит от аксессуара, увеличивая уклонение всего вокруг.
items.trinkets.ferrettuft.typical_stats_desc=Обычно этот аксессуар увеличивает уклонение всех персонажей на _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=На текущем уровне этот аксессуар увеличивает уклонение всех персонажей на _%1$s%%_.

items.trinkets.shardofoblivion.name=осколок небытия
items.trinkets.shardofoblivion.desc=После варки в алхимическом котле этот маленький осколок проклятого металла превратился в... ничто? Кажется, что свет огибает его, и он парит на месте, когда вы его не держите. Осколок, похоже, волшебным образом черпает силу из вашего невежества, так что, наверное, лучше не думать об этом слишком много.
items.trinkets.shardofoblivion.typical_stats_desc=Как правило, этот аксессуар увеличит шанс выпадения сокровищ из врагов на 12,5%% за каждый неопознанный предмет, что вы экипировали или недавно использовали, вплоть до _%d предметов_. Осколок так же предотвращает автоматическое опознание экипировки, но его можно использовать, чтобы вручную опознать предметы, которые готовы к этому.
items.trinkets.shardofoblivion.stats_desc=На текущем уровне этот аксессуар увеличит шанс выпадения сокровищ из врагов на 12.5%% за каждый неопознанный предмет, что вы экипировали или недавно использовали, вплоть до _%d предметов_. Осколок так же предотвращает автоматическое опознание экипировки, но его можно использовать, чтобы вручную опознать предметы, которые готовы к этому.
items.trinkets.shardofoblivion.ac_identify=ОПОЗНАТЬ
items.trinkets.shardofoblivion.identify_prompt=Опознать предмет
items.trinkets.shardofoblivion.identify_ready=Предмет %s готов стать опознанным.
items.trinkets.shardofoblivion.identify_not_yet=Этот предмет ещё не готов быть опознанным.
items.trinkets.shardofoblivion.identify=Вы опознали предмет!
items.trinkets.shardofoblivion$wandusetracker.name=Использована неопознанная палочка
items.trinkets.shardofoblivion$wandusetracker.desc=Вы недавно использовали неопознанную волшебную палочку, которая на некоторое время считается частью неопознанного снаряжения, используемого осколком небытия.\n\nХодов осталось: %s.

items.trinkets.thirteenleafclover.name=тринадцатилистный клевер
items.trinkets.thirteenleafclover.desc=Каким-то образом при варке в алхимическом котле у этого клевера выросла куча дополнительных листьев! На самом деле не совсем понятно, приносит ли этот аксессуар удачу или нет, возможно, этот клевер сделает вашу удачу более хаотичной?
items.trinkets.thirteenleafclover.typical_stats_desc=Обычно, при нанесении и блокировке урона, игра чаще выбирает средние значения. Как правило, этот аксессуар имеет шанс в _%d%%_ изменить это, выбирая значения ближе к максимуму и минимуму.\n\nЭтот аксессуар требует относительно мало энергии для улучшения.
items.trinkets.thirteenleafclover.stats_desc=Обычно, при нанесении и блокировке урона, игра чаще выбирает средние значения. На данном уровне этот аксессуар имеет шанс в _%d%%_ изменить это, выбирая значения ближе к максимуму и минимуму.\n\nЭтот аксессуар требует относительно мало энергии для улучшения.

items.trinkets.trapmechanism.name=механизм ловушки
items.trinkets.trapmechanism.desc=Основной механизм одной из ловушек в подземелье, аккуратно вырезанный в полу, чтобы его можно было переносить. Кажется, что он магическим образом связан с самим подземельем, что делает местность более опасной для вас и обитателей подземелья. 
items.trinkets.trapmechanism.typical_stats_desc=Как правило, этот аксессуар повысит шанс появления этажей с ловушками или пропастями на _%d%%_.\n\nЭтот аксессуар требует относительно мало энергии для улучшения.
items.trinkets.trapmechanism.stats_desc=На данном уровне этот аксессуар повысит шанс появления этажей с ловушками или пропастями на _%d%%_.\n\nЭтот аксессуар требует относительно мало энергии для улучшения.

items.trinkets.vialofblood.name=флакон крови
items.trinkets.vialofblood.desc=Этот тонкий флакон содержит кровь какого-то обитателя подземелья, она медленно перемещается, когда вы вращаете флакон. Похоже, что это волшебным образом усиливает целебные эффекты, но также их замедляет.
items.trinkets.vialofblood.typical_stats_desc=Как правило, этот аксессуар увеличивает общее количество здоровья, которое вы получаете, выпивая целебные зелья, бурдюки с водой или колодцы здоровья, на _%1$s%%_. Однако эти лечебные эффекты также проявляются медленнее, восстанавливая максимум _%2$s_ здоровья за ход (это зависит от уровня героя).
items.trinkets.vialofblood.stats_desc=На текущем уровне этот аксессуар увеличит общее количество здоровья, которое вы получаете, выпивая целебные зелья, бурдюки с водой или колодцы здоровья, на _%1$s%%_. Однако эти лечебные эффекты также будут проявляться медленнее, восстанавливая максимум _%2$s_ здоровья за ход (это зависит от уровня героя).

items.trinkets.wondrousresin.name=чудотворная смола
items.trinkets.wondrousresin.desc=Эта мерцающая голубая смола, по-видимому, содержит в себе дистиллированную эссенцию магии проклятой палочки. Магия алхимического котла, видимо, несколько стабилизировала ее, и теперь она воздействует на ваши палочки.
items.trinkets.wondrousresin.typical_stats_desc=Как правило, это аксессуар сделает эффекты проклятой палочки нейтральными или положительными в _%1$s%%_ случаев, а так же при выстрелах не проклятыми палочками, те будут в _%2$s%%_ случаев выстреливать нейтральным или положительным проклятым зарядом.\n\nУлучшение этого аксессуара требует относительно большого количества энергии.
items.trinkets.wondrousresin.stats_desc=На текущем уровне это аксессуар сделает эффекты проклятой палочки нейтральными или положительными в _%1$s%%_ случаев, а так же при выстрелах не проклятыми палочками, те будут в _%2$s%%_ случаев выстреливать нейтральным или положительным проклятым зарядом.\n\nУлучшение этого аксессуара требует относительно большого количества энергии.

items.trinkets.trinketcatalyst.name=магический катализатор
items.trinkets.trinketcatalyst.window_text=Как только вы добавляете катализатор, вода в котле начинает сиять. Выберите один из предметов, чтобы наполнить его энергией и превратить в магический аксессуар.
items.trinkets.trinketcatalyst.desc=Этот золотистый комок пыли сверкает во тьме подземелья. Такой катализатор можно объединить с небольшим количеством алхимической энергии, чтобы создать уникальный аксессуар.\n\nАксессуары дают различные эффекты, которые помогают немного разнообразить подземелье и его обитателей. Аксессуары можно улучшить при помощи энергии, чтобы сделать их эффекты более сильными. Если вы хотите полностью избавиться от их эффектов, то аксессуары достаточно просто выбросить.
items.trinkets.trinketcatalyst$randomtrinket.name=случайный аксессуар
items.trinkets.trinketcatalyst$randomtrinket.desc=Один из предметов, находящихся поблизости, спрятан в мешочке, который вы не можете открыть.\n\nВ процессе алхимии мешочек растворится, но вы не узнаете, какой аксессуар получите, пока не сделаете его!

items.trinkets.trinket$placeholder.name=аксессуар

###FD
items.quest.lingjing.name=призма
items.quest.lingjing.desc=Когда призма находится вашем в рюкзаке, она накладывает 75 единиц щита каждые 20 ходов при полном здоровье.\n\nЭффект призмы действует до тех пор, пока не достигнута максимальная глубина после 10 этажа.

items.quest.smalllightheader.name=мерцающий путеводитель
items.quest.smalllightheader.desc=Удачные эксперименты приводят к хорошим результатам, и этот малютка, появившийся на свет из алхимического котла, помогает отыскивать своему владельцу вход на следующий этаж.
items.quest.smalllightheader.ac_summonfish=ПРИЗВАТЬ
items.quest.smalllightheader.thanks=_-_ Дизайн: Шуй Иньдэн.\n_-_ Тематика: Алхимический рай.\n_-_ Награда: _Премия Цзинхун_ - Первое место.\n_-_ [Соревнование: 1-й конкурс DIY за кубок Цзинхун. [


items.quest.clearcrystal.name=тусклый осколок чистого кристалла
items.quest.clearcrystal.desc=До сих пор не ясно, для какой цели может служит осколок, найденный в могиле красных мечей...

items.quest.clearhstal.name=синий осколок чистого кристалла
items.quest.clearhstal.desc=После сражения с лавовым драконом ранее тусклый осколок стал светлым... Что это может означать?

items.quest.dragonheart.name=Сердце Лавового дракона 
items.quest.dragonheart.desc=Сердце лавового дракона все еще немного горячо на ощупь.\n\nНа нем также остались некие следы порчи...

items.weapon.melee.dragonshiled.name=чешуя дракона
items.weapon.melee.dragonshiled.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.dragonshiled.stats_desc=Это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.dragonshiled.desc=Часть чешуи лавового дракона, тепло которое никогда не рассеивается. К счастью, задняя сторона чешуи не очень горячая и её можно использовать в качестве щита. Когда вы держите её в руке, вы ощущаете, как вас защищает таинственная магия.
items.weapon.melee.dragonshiled.ability_name=защититься
items.weapon.melee.dragonshiled.ability_desc=艾诺琳娜可以用龙血鳞片_最终护卫_自己，在 10 回合内完全抵挡下一次针对自己的物理或魔法攻击。

#### THANKS-第一届惊鸿杯 ####
items.weapon.melee.thanks.grilledherring.name=жареная сельдь
items.weapon.melee.thanks.grilledherring.desc=Его зажаренный аромат переполняет воздух, он такой сочный и теплый. Хоть это и выглядит очень аппетитно, вы почти уверены, что это действительно оружие, а не обычная зажаренная рыба на гриле.
items.weapon.melee.thanks.grilledherring.typical_stats_desc=Вы можете откусывать эту жареную селедку _%d раз_, чтобы получить 50 сытости, и после того, как все её съедобные места пропадут, она превратится в рыбную кость.\n\nЭто оружие можно есть, только когда оно _опознано и не проклято._ }\nКаждое улучшение увеличивает её размер на еще 1 укус. }
items.weapon.melee.thanks.grilledherring.ac_eatfish=ОТКУСИТЬ
items.weapon.melee.thanks.grilledherring.eat_msg=Это оружие такое ароматное, что вы не удержались и откусили кусочек. Хотя оно и не наполнило ваш желудок, но оно по крайней мере, утолило голод...
items.weapon.melee.thanks.grilledherring.stats_desc=Аромат рыбы был настолько аппетитный, что вы не сдержали свой голод, и после от её осталась только рыбная кость. Хотя она уже не такая острая, как раньше, её атаки теперь способны вызвать кровотечение с { 50% уроном от нанесенного урона { по противнику. }\n\nЕсли улучшить оружие сейчас, улучшение увеличит её размер для еще 1 укуса. }
items.weapon.melee.thanks.grilledherring.thanks=_-_ Дизайн: W.\n_-_ Тематика: Закаленная сталь.\n_-_ Награда: _Премия Цзинхун_ - Первое место.\n_-_ [Соревнование: 1-й конкурс DIY за кубок Цзинхун. [
items.weapon.melee.thanks.grilledherring.ability_name=рассечь
items.weapon.melee.thanks.grilledherring.typical_ability_desc=艾诺琳娜可以用烤鲱鱼_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在2回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.thanks.grilledherring.ability_desc=艾诺琳娜可以用烤鲱鱼_顺劈_敌人，造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在5回合内额外使用一次不消耗充能数的顺劈。

#支援信号套组
items.thanks.distresssignalnesting.name=набор сигналов поддержки
items.thanks.distresssignalnesting.desc=一支由三位传奇狙击手组成的狙击小队在这一带兜售这些装备。\n当你点亮其中的水晶并向天燃放可用的信号弹时，她们便会在暗处助你一臂之力。出场费就是这个小盒的售价。\n请她们出手需要消耗_500_金币。
items.thanks.distresssignalnesting.level_0=一个装有一颗魔法水晶的橡木盒。燃放信号弹之前记得先点亮水晶，不然不作数。\n商店老板会为你升级它。\n信号弹可由液火药剂、浮空药剂与紊乱魔药炼制而成。
items.thanks.distresssignalnesting.level_1=По сравнению со обычной шкатулкой, в дополнение к тому, что хрусталь в шкатулке стал более прозрачным, края деревянной шкатулки также стали инкрустированными золотыми узорами.
items.thanks.distresssignalnesting.level_2=Шкатулка из красного дерева с тонкой резьбой, внутри которой лежит красный магический кристалл, обернутый бархатом.
items.thanks.distresssignalnesting.level_3=Хрустальная шкатулка с тонкой резьбой, внутри которой лежит красный магический кристалл, обернутый бархатом. На обратной стороне шкатулки указано, что они предоставляют специальную скрытую упаковку для платинового коллекционного издания.

items.thanks.distresssignalnesting.spawn_flare_bag=一些信号弹不知从何处飞来钻进了你的背包
items.thanks.distresssignalnesting.spawn_flare_foot=一些信号弹不知从何处飞来摔在了你的脚旁

items.thanks.distresssignalnesting.ac_fire=燃放信号弹
items.thanks.distresssignalnesting.fire_0=Замораживающий снайпер: Замедленная цель не убежит!
items.thanks.distresssignalnesting.fire_1=狙击手玛多：收到信号，我们正在赶来的路上。
items.thanks.distresssignalnesting.fire_2=狙击手萨伽：怎么又要上工……

items.thanks.distresssignalnesting.ac_hunt=激活狩猎狂欢
items.thanks.distresssignalnesting.hunt=狙击手帕列托：我最喜欢的环节！来了！\n狙击手玛多：指令接收，正在前往清理现场。\n狙击手萨伽：……想回家睡觉……

items.thanks.distresssignalnesting.no_charge=信号弹已用完，请填装新的信号弹。
items.thanks.distresssignalnesting.hunt_unavailable=狩猎狂欢需要+2及以上等级且至少拥有1点充能。
items.thanks.distresssignalnesting.need_to_equip=你必须先装备这个道具。
items.thanks.distresssignalnesting.no_gold=金币不足，无法支付出场费。
items.thanks.distresssignalnesting.no_kinggold=时空金卷不足，无法支付出场费。
items.thanks.distresssignalnesting.castle_unavailable=古堡区域无法使用支援信号套组。
items.thanks.distresssignalnesting.castle_note=她们无法支援现世以外的地方。
items.thanks.distresssignalnesting.thanks=_-_ 设计：Hacko'Tacko\n\n_-_ 赛道：炼金乐园\n\n_-_ 奖项：_惊鸿奖_--赛道第一名\n\n_-_ [赛年：第一届惊鸿杯DIY大赛[

#信号弹
items.thanks.flarebullet.name=сигнальная ракета
items.thanks.flarebullet.desc=发射信号弹，她们看见你的支援请求信号后便会立刻赶来。\n可由液火药剂、浮空药剂与紊乱魔药炼制而成
items.thanks.flarebullet.ac_load=填装
items.thanks.flarebullet.no_device=尚未持有支援信号套组
items.thanks.flarebullet.full_charge=魔法水晶能量充盈，拒绝了来自信号弹的充能
items.thanks.flarebullet.load_success=信号弹化作粉末融化进了魔法水晶中

#狙击手的援护
items.thanks.snipersupport.name=снайперская поддержка
items.thanks.snipersupport.desc=Каждые 4 хода случайный противник в пределах вашего зрения получает выстрел от снайпера; тип урона выбирается случайным образом из трех вариантов, а величина урона зависит от текущего этажа. Если к моменту завершения перезарядки в поле зрения нет противников, эффект срабатывает в тот момент, когда враг появляется в поле зрения.\n\nОсталось выстрелов: %d.\nОсталось ходов до перезарядки: %s.

items.thanks.snipersupport.frost_hit_0=Замораживающий снайпер: Замедленная цель не убежит!
items.thanks.snipersupport.frost_hit_1=Замораживающий снайпер: Ага! В следующий раз получше прячься!
items.thanks.snipersupport.frost_hit_2=Замораживающий снайпер: Вот и все! Теперь ему не уйти.

items.thanks.snipersupport.shock_hit_0=Электризующий снайпер: Удачное попадание!
items.thanks.snipersupport.shock_hit_1=Электризующий снайпер: Меткое попадание в цель!
items.thanks.snipersupport.shock_hit_2=Электризующий снайпер: Отличное попадание в противника!
items.thanks.snipersupport.shock_player_0=Электризующий снайпер: Ой, это вы здесь?… Простите.

items.thanks.snipersupport.burn_hit_0=Поджигающий снайпер: Попал. Хорошо бы и отдохнуть…
items.thanks.snipersupport.burn_hit_1=Поджигающий снайпер: Попал. Надо было взять с собой побольше припасов…
items.thanks.snipersupport.burn_hit_2=Поджигающий снайпер: Попал. Может, пора вернуться?

