#天界画笔
items.thanks.celestialbrush.name=天界画笔
items.thanks.celestialbrush.desc=这支画笔散发着已然消逝的颜色，据说唯有它能画出失落的神明：因为神明死亡后，它身上的颜色也将无处可觅。
items.thanks.celestialbrush.ac_paint=作画
items.thanks.celestialbrush.ac_ink=上墨
items.thanks.celestialbrush.prompt_flame_target=请选择烈焰墙释放的目标位置
items.thanks.celestialbrush.thanks=_-_ 设计：霜晨\n\n_-_ 赛道：秘器研究\n\n_-_ 奖项：_飞燕奖_--赛道第二名\n\n_-_ [赛年：第一届惊鸿杯DIY大赛[

items.thanks.celestialbrush.desc_need=或许运用这支画笔本身的魔力能够创造一些“画作”，不过它目前的魔力尚未完全恢复。或许你应当献上你对过往的敬意……
items.thanks.celestialbrush.desc_maxed=运用这支画笔本身的魔力能够创造一些“画作”，它目前的魔力已完全恢复。你已献上你的所有敬意，现在一切失落的颜色已再次出现于笔端。
items.thanks.celestialbrush.desc_cursed=画笔中恶意的魔力使你陷于已逝的回忆，对周围一切的感知变得格外迟钝。（鉴定速度减半，陷阱感知减半，视野-1）

items.thanks.celestialbrush.paint_title=选择画作
items.thanks.celestialbrush.paint_desc=消耗 1 点充能，释放一种已逝的颜色：
items.thanks.celestialbrush.paint_flame=古焰之色
items.thanks.celestialbrush.paint_frost=严冬之色
items.thanks.celestialbrush.paint_sky=天际之色

items.thanks.celestialbrush.flame=毫末抹开灼人的火焰。
items.thanks.celestialbrush.frost=毫末晕染出银装素裹。
items.thanks.celestialbrush.sky=毫末洒下昏暗的天色。

items.thanks.celestialbrush.prompt_frost_target=请选择暴风雪释放的目标位置

items.thanks.celestialbrush.prompt_lv0=画笔正在索取寒冷的回忆，请献上冰爆魔药
items.thanks.celestialbrush.prompt_lv1=画笔正在索取可怖的回忆，请献上精良的武器\n最低2阶+2升级
items.thanks.celestialbrush.prompt_lv2=画笔正在索取诞生前的回忆，请献上自己的一部分（20点生命上限）
items.thanks.celestialbrush.prompt_lv3=画笔正在索取骄盛的回忆，请献上精良的戒指（至少+2升级）

items.thanks.celestialbrush.prompt_lv2_title=献祭自身
items.thanks.celestialbrush.prompt_lv2_desc=画笔正在索取诞生前的回忆，献上自己的一部分（消耗20点生命上限）。\n你确定要这么做吗？
items.thanks.celestialbrush.confirm_yes=献祭
items.thanks.celestialbrush.confirm_no=Отменить

items.thanks.celestialbrush.hex=你正陷入回忆中无法自拔，恐怕不能这样做了。
items.thanks.celestialbrush.not_enough_hp=你的生命力不足以支撑这次献祭……
items.thanks.celestialbrush.invalid_item=画笔对此物毫无兴趣。
items.thanks.celestialbrush.upgrade_hp=你的一部分使画笔回想起了人类诞生前的过去；\n等你回过神来，你全身已经冷的打颤。
items.thanks.celestialbrush.upgrade_1=这瓶药剂中的寒冷使画笔回想起了那寒冷的过去；\n等你回过神来，魔药已成为回忆。
items.thanks.celestialbrush.upgrade_2=这把武器的锋芒使画笔回想起了那残酷的过去；\n等你回过神来，这把武器连同它的锋芒已成为回忆。
items.thanks.celestialbrush.upgrade_4=这件晶莹剔透的戒指使画笔回想起了诸神仍存时的过去；\n等你回过神来，戒指与它的色彩已成为回忆；\n但画笔已再度散发应有的光芒。

items.thanks.celestialbrush.no_charge=画笔已经耗尽了所有魔力……
items.thanks.celestialbrush.cursed=画笔的魔力被恶念扭曲，你无法集中精神作画……
items.thanks.celestialbrush.unequipped=你需要先装备画笔……
############THANKS############

items.weapon.melee.seekingspear.name=копьё искателя
items.weapon.melee.seekingspear.stats_desc=Это оружие имеет крайне смертоносную атаку.\nЭто оружие имеет дополнительную дальность атаки и обладает критическим ударом.
items.weapon.melee.seekingspear.desc=Багровое лезвие копя, кажется, так и жаждет крови, и вы еще больше убедитесь в этом, когда рукоять станет тревожить ваши руки.
items.weapon.melee.seekingspear.crit=Крит. удар
items.weapon.melee.seekingspear.ability_name=пронзить
items.weapon.melee.seekingspear.ability_desc=艾诺琳娜可以用寻觅长枪_刺退_在射程内但不与艾诺琳娜相邻的敌人，造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
items.weapon.melee.seekingspear.typical_ability_desc=艾诺琳娜可以用寻觅长枪_刺退_在射程内但不与艾诺琳娜相邻的敌人，一般造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
items.weapon.melee.seekingspear.prompt=选择射程内的目标

### 墓志铭
items.heap.grave=Могила героя
items.heap.rip=Покойся с Миром
bones.here_lies_nameless=Здесь захоронен неизвестный: %s, у которого всего лишь простая могила.
bones.here_lies_named=Здесь похоронен: %1$s.
bones.pacifist=Его запомнили как миротворца, который даже перед ликом смерти не убил ни одной души. Таким не место в подземелье...
bones.rats=Почтенный крысобой, который убил %d врагов перед своей смертью. Это всё, на что он был способен?
bones.crabs=Почтенный крушитель крабов, который убил %d врагов перед своей смертью. Возможно, ему следовало прибегнуть к магии...
bones.undead=Он олицетворял страх среди скелетов, сумел убить %d врагов перед своей смертью. И в итоге, сам стал одним из них...
bones.thieves=Преследователь безумных воров, который убил %d врагов перед своей смертью. Не смейте красть его вещи!
bones.bats=Душитель летучих мышей, который убил %d врагов перед своей смертью. И у летающих существ есть когти!
bones.brutes=Крушитель гнолл-громил, который убил %d врагов перед своей смертью. Спокойствие приносит благо, а ярость только боль.
bones.monks=Познавший искусство дворф-монахов, сумел убить %d врагов перед своей смертью. Видимо, не до конца освоил их искусство...
bones.golems=Разрушитель творений дворфов, сумел убить %d врагов перед своей смертью. Если бы и он мог призывать каких-то существ...
bones.demons=Легендарный охотник на демонов, который убил %d врагов перед своей смертью. Он стал героем, внесший вклад во спасение мира.
bones.yog=Бросивший вызов Богу демонов, сумел убить %d врагов перед своей смертью. Интересно, о чем подумает преемник, когда увидит бога?
bones.forgot_nukecole=Печально, что в предсмертный момент, он забыл про волшебную бутылочку Ядер-колы, подаренную Королем драконов.
bones.forgot_watersoul=К несчастью, когда он был на грани жизни и смерти, он забыл про эликсир Водяного духа, а ведь он мог бы использовать его силу, чтобы обмануть смерть.
bones.forgot_waterskin=Очень жаль, что он забил о своем бурдюке с водой, когда находился на грани смерти. Или эта вещь используется для полива цветов?
bones.forgot_potion=Так досадно, что, находясь перед лицом к смерти, он забыл выпить свои лечебные зелья. Хотя их у него было в достатке.
bones.rest_in_peace=Он оставил все нажитое в этом мире перед тем, как покинуть его навсегда. Надеясь, что другому герою не придется постичь его трагическую судьбу.

items.food.pasty.fish_name=рыба на пару с лотосом
items.food.pasty.fish_desc=Рыба на пару, волшебно поданная на зелени. В это время года есть традиция сохранять кусочек рыбы на потом, поэтому вы оставите немного объедков, вместо того, чтобы съесть всё сразу.\n\nСчастливого Лунного Нового Года!

items.food.pasty$fishleftover.name=рыбные объедки
items.food.pasty$fishleftover.eat_msg=На вкус так себе.
items.food.pasty$fishleftover.desc=Немного остатков рыбы после вашего предыдущего приёма пищи. Вы в любой момент можете съесть их, чтобы слегка восполнить сытость.

items.food.pasty.qk_name=цинминго
items.food.pasty.qk_desc=Цинминго - зеленые пампушки, которые маслянистые и зеленые, как нефрит, липкие, мягкие и ароматные, их так и хочется съесть все за один раз. Трудно даже себе представить, что такая прекрасная еда существует в подземелье.\n\nЦинмин - праздник, где мы отдаем дань уважения нашим предкам для благодарности. Пусть их души упокоятся с миром на небесах. Мы помним и двигаемся вперед. Так мы с уважением почитаем прошлое, чтобы встретить светлое будущее.\n\n– «Праздник Цинмин»\n\n_При употреблении вы получите ментальное зрение и тайный барьер._

items.food.pasty$qingkong.name=остатки цинминго
items.food.pasty$qingkong.eat_msg=На вкус так себе.
items.food.pasty$qingkong.desc=Немного остатков зеленых пампушек после вашего предыдущего приёма пищи. \n\nВы в любой момент можете съесть их, чтобы слегка восполнить сытость.\n\n_При употреблении вы получите ментальное зрение и тайный барьер._

items.food.pasty$riceliquor.name=рисовое вино
items.food.pasty$riceliquor.eat_msg=Этот насыщенный вкус вина долго чествуется во рту.
items.food.pasty$riceliquor.desc=Фарфоровый кувшин для вина с пробкой, обмотанной красной тканью. Это не крепкий алкогольный напиток, а свежеприготовленное рисовое вино с сладким привкусом.\n\nВыпив этот напиток, можно слегка восполнить сытость и немного восстановить здоровья.\n\n«Не ищи истину в вине», - сказал тот, кто протянул вам кувшин с вином.

### 特别货币
items.icecyanbluesquarecoin.name=кобальтовая монета
items.icecyanbluesquarecoin.desc=Специальная валюта Империи Падкого Хлада, выпущенная по приказу императрицы «Лэнг», под названием «Ледяной империал», считается, что ими обладают только те, кто сильные мира сего.\n\nЭта валюта может использоваться для разной особой торговли и является основной валютой обращения для поддержания стабильной работы фонда триумвирата поверхности.
items.icecyanbluesquarecoin.no=Примечание: если вы находитесь в режиме разработчика или специальном режиме, кобальтовые монеты не будут добавлены в ваше хранилище.

items.quest.anyskinselect.name=ваучер на приобретение одежды
items.quest.anyskinselect.desc=Этот сертификат выпущен в честь официального запуска пробной версии <#FF8400>журнала событий игры FireBase. <RGB>Его можно обменять на любой скин, и он будет всегда появляться на 0-м этаже до момента обмена.\n\nПосле использования в любом файле сохранения он будет автоматически уничтожен в других файлах сохранений.

items.quest.anyskinselect$anyskincustomselect.name=梦想通讯器
items.quest.anyskinselect$anyskincustomselect.desc=源自异度时空的神秘通讯器，器身刻有时装商人肖像，持有者可跨越时空联络商人，自由兑换一份任意时装。
items.quest.anyskinselect$anyskincustomselect.ac_conect=花瓣传讯

items.kinggold.name=золотой купон
items.kinggold.desc=Эти золотые купоны, напечатанные из очень тонкого мягкого металла, гладкого на ощупь. На них одной стороне изображена голова Рона, а на другой - логотип Торговой палаты. В наше время золотые монеты уже не являются лучшей валютой торговцев, но если у вас есть такие купоны, они с радостью окажут вам некоторую помощь, если вы найдете хоть одну из этих «чудесных» карточек.\n\nИх можно использовать для обмена некоторых полезных предметов в магазинах, расположенных в разных измерениях и времени. В каком-то смысле эта вещь гораздо ценнее золотых монет.\n\nОни пропитаны ароматом торгового лорда и ведьмой темного пламени, возможно, именно поэтому торговцы так охотно принимают их.\n\nКурс обмена: 50 золота = 1 купон, 5 одинаковых предметов = 1 купон.
items.kinggold.ling=Получено %d купонов

### 特别武器
items.weapon.melee.legend.clearsword.name=чистильщик
items.weapon.melee.legend.clearsword.desc=Лезвие этого серпа длиннее и больше, чем у обычного серпа, как будто оно создано для того, чтобы косить врагов, как сорняки.\n\nЭто довольно медленное оружие с низкой точностью.
items.weapon.melee.legend.clearsword.ability_name=жатва душ
items.weapon.melee.legend.clearsword.ability_desc=Дуэлянт может совершить _жатву душ_ чистильщиком. Эта атака гарантированно наносит 125% магического урона всем видимым врагам в радиусе 7x7 клеток, накладывая уязвимость и ослабление на 10 ходов, но стоит 3 заряда.
items.weapon.melee.legend.clearsword.xdesc=_Это легендарное оружие._\n_-_ Атака имеет шанс вызвать _кровотечение 15+2*на процент уровня, наносящее 10% от значения урона в виде кровотечения._\n_-_ _Чем ниже уровень здоровья владельца, тем выше наносимый урон до максимального значения на _33% дополнительного урона_.\n_-_ Убийство врага восстанавливает его максимальное здоровье на _2+0,5*за процент уровня_. Определенный процент от максимального здоровья врага, _за исключением боссов_.

items.weapon.melee.legend.forestbow.name=лесной арбалет
items.weapon.melee.legend.forestbow.desc=Друиды сотворили особенный арбалет, который вливает в свои стрелы природную магию. Как и обычный арбалет, он с чуть меньшей силой усиливает урон от дротиков, но сам менее пригоден для ближнего боя.
items.weapon.melee.legend.forestbow.stats_desc=Это оружие, будучи экипированным, увеличивает урон от дротиков и даже наделяет их своим зачарованием.
items.weapon.melee.legend.forestbow.no_unlock=<#33BB33>致敬破碎地牢和像素地牢，是他们创造了地牢世界，因此该武器仅需90钴币即可解锁此传说武器！<RGB>
items.weapon.melee.legend.forestbow.ability_name=благословение леса
items.weapon.melee.legend.forestbow.ability_desc=Дуэлянт может подготовить _благословение леса_ из арбалета. Эта способность активируется мгновенно и гарантирует попадание следующего дротика по врагу, применяя все эффекты атаки в радиусе 5х5 клеток и продлевая эффекты от смазанных дротиков. Урон от дротиков немного уменьшенный по сравнению с оригинальным заряженным выстрелом.
items.weapon.melee.legend.forestbow.xdesc=_Это легендарное оружие._\n_-_ Урон от дротика увеличен до 3 + уровень снаряжения ~ 6 + уровень снаряжения × 2,5.\n_-_ Каждый выпущенный дротик имеет (15+4*уровень)% шанс нанести врагу один из эффектов: отравление, ослепление или окоченение на [3+(уровень/4)] ходов. Если оружие имеет +9 или выше, оно наносит два эффекта.
items.weapon.melee.legend.forestbow$chargedshot.name=благословение леса
items.weapon.melee.legend.forestbow$chargedshot.desc=Дуэлянт концентрируется и усиливает свой лесной арбалет. Следующий дротик гарантированно попадёт по врагу, применяя все эффекты и зачарования в радиусе 5х5 клеток. Полезные эффекты дротиков будут применяться только к союзникам, а вредные - только к врагам.\n\nСмазанные дротики будут иметь 4 дополнительных применения при стрельбе благословением леса. Дуэлянт не может применить эту способность, чтобы использовать дротики с положительными эффектами на себя.

items.weapon.melee.legend.moondao.name=лунные клинки
items.weapon.melee.legend.moondao.desc=Эти парные кленки с лезвием в форме полумесяца, имеют настолько быстрые взмахи. что как только попадают в жизненно точку врага, делает этот удар смертоносным.
items.weapon.melee.legend.moondao.stats_info=Это оружие более эффективно во время скрытных атак и 100% замораживает цель при успешной скрытой атаке. Это парное оружие имеет высокую скорость атаки. Это оружие обладает зачарованием обороны при атаке.
items.weapon.melee.legend.moondao.ability_name=тайный удар
items.weapon.melee.legend.moondao.ability_desc=Дуэлянт может совершить _тайный удар_ лунным клинком, если у неё меньше 80% здоровья. Эта уничтожающая всё и вся атака гарантированно попадает в цель и наносит на 40% урона больше, а сам Дуэлянт получает _10 тайного щита._

items.weapon.melee.legend.ricesword.name=рисовый большой меч
items.weapon.melee.legend.ricesword.desc=В этом оружии можно почувствовать аромат клейкого риса, исходящего от этого меча, а свойства самого меча изменяется в зависимости от вашего голода.\n\nЭто оружие имеет дополнительную дальность атаки.
items.weapon.melee.legend.ricesword.ability_name=мощный удар
items.weapon.melee.legend.ricesword.ability_desc=艾诺琳娜可以用糯米大剑使出_重击_。这用尽全力的一击如果是在伏击敌人，则会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。
items.weapon.melee.legend.ricesword.typical_ability_desc=艾诺琳娜可以用糯米大剑使出_重击_。这用尽全力的一击如果是在伏击敌人，则一般会造成_%1$d~%2$d点伤害_并施加5回合的恍惚，使其精准与闪避均降低50%%。重击必定命中，但若非伏击则只会造成普通的伤害。

items.weapon.melee.whiteblastsword.name=шпага белогривой волны
items.weapon.melee.whiteblastsword.desc=寒光闪闪，洁玉守心，你能感受到其上的坚定与希望。\n这把武器在攻击一定次数后能够释放强大的技能，造成一定伤害并能施加一些效果。
items.weapon.melee.whiteblastsword.action_name=Белогривая волна
items.weapon.melee.whiteblastsword.quest_start_prompt=Наносит физический урон вокруг героя, равный атаке 120%% ед. силы, оглушая всех врагов в пределах на 8 ходов, затем отравляя на %s ед. всех оглушенных врагов.
items.weapon.melee.whiteblastsword.open_attack=Применить способность
items.weapon.melee.whiteblastsword.not=Пока не применять
items.weapon.melee.whiteblastsword.roll1=Мой свет шпаги очистит зло!
items.weapon.melee.whiteblastsword.roll2=Моя шпага рассечет даже волну!
items.weapon.melee.whiteblastsword.roll3=Мое сердце вынесет свой приговор.
items.weapon.melee.whiteblastsword.ability_name=逐浪突刺
items.weapon.melee.whiteblastsword.typical_ability_desc=艾诺琳娜可用白浪刺剑对至多3格内的敌人使出_逐浪突刺_。这一击会向前突进，一般会造成_%1$d~%2$d点伤害_，沿途所有敌人都会被穿透伤害，且必定命中。\n\n该技能会消耗 2 点充能，如果本次击杀了敌人且无AOE连锁伤害，则不消耗充能。
items.weapon.melee.whiteblastsword.ability_desc=艾诺琳娜可用白浪刺剑对至多3格内的敌人使出_逐浪突刺_。这一击会向前突进，造成_%1$d~%2$d点伤害_，沿途所有敌人都会被穿透伤害，且必定命中。\n\n该技能会消耗 2 点充能，如果本次击杀了敌人且无AOE连锁伤害，则不消耗充能。
items.weapon.melee.whiteblastsword.prompt=选择3格内的目标
items.weapon.melee.whiteblastsword.ability_no_target=没有有效的目标！
items.weapon.melee.whiteblastsword.ability_target_range=目标过远！技能最多只能攻击3格内的敌人！

items.weapon.melee.legend.saiplus.name=хладный кинжал
items.weapon.melee.legend.saiplus.desc=От кинжала исходит убийственная аура, которая так же устрашающая, как и сам бог смерти.
items.weapon.melee.legend.saiplus.success=%s делает смертельную атаку, возвращая вам здоровье!
items.weapon.melee.legend.saiplus.stats_info=Это оружие наносит больше урона во время скрытных атак, и имеет шанс восстановить здоровье, если она прошла успешна. Это оружие накладывает зачарование погибели у врагов с низким здоровьем.
items.weapon.melee.legend.saiplus.ability_name=спрятаться
items.weapon.melee.legend.saiplus.typical_ability_desc=艾诺琳娜握持肃杀时可以_潜行_。这个武技能够使艾诺琳娜立即闪现最多4格远，并一般给予_%d回合隐形_。
items.weapon.melee.legend.saiplus.ability_desc=艾诺琳娜握持肃杀时可以_潜行_。这个武技能够使艾诺琳娜立即闪现最多4格远，并给予_%d回合隐形_。
items.weapon.melee.legend.saiplus.upgrade_ability_stat_name=武技持续时间

items.weapon.melee.legend.goldlonggun.name=золотое копьё
items.weapon.melee.legend.goldlonggun.desc=堤喀眷顾之人才能找到的武器，给予使用者无与伦比的祝福。\n\n这个武器有额外的攻击距离。\n这个武器有50%-100%的伤害修正\n这个武器对恶魔与亡灵会额外造成33%的伤害
items.weapon.melee.legend.goldlonggun.bless_desc=这个武器在命中非相邻的敌人时，获得_%d回合_的赐福
items.weapon.melee.legend.goldlonggun.typical_bless_desc=这个武器在命中非相邻的敌人时，获得_%d回合_的赐福
items.weapon.melee.legend.goldlonggun.ability_name=золотое пронзание
items.weapon.melee.legend.goldlonggun.ability_desc=Дуэлянт, используя наконечник золотого копья, может _пронзить_ врага насквозь. Это гарантирует попадание, добавляет уязвимость на 2 хода и наносит в 2 раза больше урона врагам с жёсткой кожей. Если враг мгновенно умирает, то она получает в дар некое количество золота!
items.weapon.melee.legend.goldlonggun.gold=Убив врага золотим пронзанием, и вы получаете %d золота.
items.weapon.melee.legend.goldlonggun.ability_target_range=Эта цель слишком далеко...

items.books.questbookslist.hollowcitybook.name=Неподписанное приглашение
items.books.questbookslist.hollowcitybook.desc=Приглашаем все желающих посетить старинный замок на карнавальное пиршество.
items.books.questbookslist.hollowcitybook.ac_read=ПРОЧИТАТЬ
items.books.questbookslist.hollowcitybook.quest_start_no=Прочитать приглашение можно только на 26 этаже!

items.quest.unsignedinvitationletter.name=Неподписанное пригласительное письмо
items.quest.unsignedinvitationletter.desc=На приглашении нет подписи, только какие-то странные символы. Вы пока не в силах сломать печать, чтобы открыть приглашение, поэтому у вас есть только единственные решение взять его с собой.
items.quest.unsignedinvitationletter.rankings_desc=Концовка замка: Потерян в реке Стикс
items.quest.unsignedinvitationletter.hollow_city_1=После сражения на реке Стикс я %s почувствовал, что меня все больше тянет к старинному замку. Кровавая луна все еще висела высоко над поверхностью, и это был ещё не конец. Но я решил что лучше покинуть это место...

levels.hollow.zerohallsbosslevel$baddream.rankings_desc=Концовка замка: Мрачное сновидение
levels.hollow.zerohallsbosslevel$baddream.dream=Все это оказалось сном, и вы наконец-то проснулись от этого кошмара...

items.weapon.melee.icedewvialsword.name=ледяной меч божественной росы
items.weapon.melee.icedewvialsword.desc=Находится в разработке, ожидайте его в будущих обновлениях!

items.quest.randomchest.name=ящик с сюрпризом
items.quest.randomchest.desc=Неизвестно, что там внутри, но можно узнать открыв его! 
items.quest.randomchest.ac_kitem=ПОПЫТАТЬ УДАЧУ!
items.quest.randomchest.look_msg=Вы открыли ящик с сюрпризом.

items.quest.blessingnecklace.name=благословение ожерелье
items.quest.blessingnecklace.desc=Простое освещённое ожерелье, которое имеет схожие свойства с освящённым анхом.


items.quest.red.name=белая роза
items.quest.red.desc=В этом опасном и мрачном подземелье эта белая роза словно пронзает окружающую тьму, демонстрируя вам настоящую  силу «Любви».
items.quest.red.ac_interlevel_tp=Вернуться назад

items.potions.potionofpurity$potionofpurityling.name=зелье Нейтрализации токсического газа
items.potions.potionofpurity$potionofpurityling.desc=Извлекая зелье из костей, вы вдруг осознаете, что до вас здесь побывали другие путешественники, но, к сожалению, они не смогли выжить.\n\nЭто зелье, нейтрализующее отравляющий газ, было изготовлено другими путешественниками путем извлечения эссенции из растений джунглей, поэтому оно способно нейтрализовать любые опасные и ядовитые гази, даже в самых глубоких частях джунглей.\n\nНадеюсь, вы сможете унаследовать дух и волю других путешественников и полностью искоренить опухоль этих джунглей!

items.quest.devitem.crystalling.name=хрустальное ожерелье
items.quest.devitem.crystalling.desc=Под этим сине-пурпурным ожерельем свисает осколок кристалла, и когда свет проникает сквозь эту призму, его сердцевина как будто тоже излучает свет.\n\nСогласно сказаниям, Ин Линг создала этот мир с помощью Священного сердца, а затем разделила половину своей силы между тремя посланниками и попросила их превратить другую половину в Кристальное сердце.\n\nСамо Священное сердце не имеет физической формы, и даже Кристальное сердце никто не видел на самом деле, но по описанию легенд, люди воссоздали его виде ожерелья.\n\nУже после такие ожерелье стали делать на день рождения Ин Линга, стремясь получить благословение у божественного творца.\n\nДаже вы зная, что кристалл на нем символический, держа его в руках, чувствуйте в своей душе умиротворение.\n\n_Вы можете ощутить на нем дыхание Лин, поэтому ношение этого ожерелья способно помочь вашим ранам быстрее затянуться._

items.quest.devitem.crystalling.active=\n\nЭто предмет главного разработчика Ling команды MLPD, по случаю его дня рождения.\n\nВремя действия бонуса:  22.8-25.8 (по календарю)
items.quest.devitem.crystalling.end=\n\nДень рождения разработчика Ling завершился, и бонусы для этого предмета теперь не работают.
items.quest.devitem.crystalling.last=\n\nСегодня последний день, когда действуют бонусы ожерелья, не упустите возможность воспользоваться ими.

items.quest.redwhiterose.name=красная и белая роза
items.quest.redwhiterose.desc=Они так и не ушли с ними, эти два бутона роз так и не были достойны их...\n\nЧувства не нуждаются в носителе, а воля не требует доказательств.\n\nИ вы никогда не сдавайтесь.

items.weapon.melee.fiveren.name=лунный пирог с орехами
items.weapon.melee.fiveren.stats_desc=Это довольно медленное оружие.\nЭто оружие имеет повышенную дальность атаки.\nЭто оружие может разъедать врага.
items.weapon.melee.fiveren.desc=Самый твердый лунный пирог - это лунный пирог орехами!\n\nПоздравляем с прохождением события «Праздник середины осени»! Теперь в подземелье могут появляться лунные пироги с орехами.
items.weapon.melee.fiveren.desc_alt=中秋佳节，祝各位玩家节日快乐。\n\n月饼在古代由来已久，其实月饼最初的原型叫“饼饵”。\n贾公谚：“以酒燚为饼，若今起胶饼”。随着时间的推移，月饼已由当初的家庭手工制作逐渐变成了一种专业化生产，品种不断增多，质量不断提高，明清时已发展成为传统的糕点形式。
items.weapon.melee.fiveren.ability_name=пронзить
items.weapon.melee.fiveren.typical_ability_desc=艾诺琳娜用五仁月饼_刺退_在射程内但不与艾诺琳娜相邻的敌人，造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
items.weapon.melee.fiveren.ability_desc=艾诺琳娜用五仁月饼_刺退_在射程内但不与艾诺琳娜相邻的敌人，造成_%1$d~%2$d点伤害_，将敌人击退且必定命中。
### 传奇武器

items.weapon.melee.legend.legendweapon.typical_stats_desc=Это легендарное оружие _%1$s-го уровня,_ имеет способность:  %2$s\nЭта способность обычно наносит _%3$s-%4$s ед. урона._
items.weapon.melee.legend.legendweapon.stats_desc=Это легендарное оружие _%1$s-го уровня,_ имеет способность: %2$s\nЭта способность наносит _%3$s-%4$s ед. урона._

items.weapon.melee.legend.diedcrossbow.name=ручная баллиста
items.weapon.melee.legend.diedcrossbow.desc=Это баллиста, способна с высокой скоростью выпускать одновременно несколько стрел. Она может оказаться очень тяжелой, для тех у кого недостаточно сил, что может привести к осечке устройства и нанести вред такому владельцу. Но благодаря своему размеру может также быть полезна в ближнем бою.
items.weapon.melee.legend.diedcrossbow.xdesc=_特技：战术扇形爆炸弩炮_\n\n充能完毕时，可以发射爆炸弩炮。发射后需要重新装填，通过升级可以减少装填的时间。\n\n在发射的尽头或遭遇敌对目标时立刻产生_5x5_的爆炸并造成范围伤害。每次爆炸完毕后弩炮需要_重新装填_。弩炮伤害会根据自身等级成长。 \n\n 这件武器在装备后会大幅提升飞镖的伤害。它甚至还能把自身的附魔赋予射出去的飞镖。
items.weapon.melee.legend.diedcrossbow.ac_king=Взрывной выстрел
items.weapon.melee.legend.diedcrossbow.no_cooldown=Ваша баллиста перезаряжается, обождите некоторое время...
items.weapon.melee.legend.diedcrossbow.no_equip=Вы должны экипировать баллисту, чтобы её использовать. Если у вас подкласс чемпиона, вам нужно переключиться на основное оружие, чтобы её использовать.
items.weapon.melee.legend.diedcrossbow.ondeath=Вас разорвало на куски взрывом баллисты...

items.weapon.melee.legend.diedcrossbow.ability_name=заряженный выстрел
items.weapon.melee.legend.diedcrossbow.ability_desc=艾诺琳娜可以使用重型弩炮准备好_充能射击_。这个武技会立即生效，使下一发飞镖必定命中，其击中效果将会在 5*5 的范围内触发，并且涂药飞镖会更加耐用。
items.weapon.melee.legend.diedcrossbow.charge_ready=弩炮蓄力完成！下一发飞镖将触发强化效果。
items.weapon.melee.legend.diedcrossbow$chargedshot.name=заряженный выстрел
items.weapon.melee.legend.diedcrossbow$chargedshot.desc=弩炮处于蓄力状态。\n下一发飞镖必定命中，命中后在5×5范围扩散涂药效果。\n负面效果仅针对敌人，增益效果仅作用友军，不会对你自身生效。\n涂药飞镖额外获得4点使用耐久。

items.weapon.melee.sdbsword.name=алмазный большой меч
items.weapon.melee.sdbsword.desc=拟态之王的佩剑，由钻石制成的大剑，漂亮而致命。\n上面附带了一丝拟态之王的魔力，虽然在一定程度上限制了它，但似乎也带来了不错的效果。\n这是一件相当缓慢的武器，有固定的2距攻击距离，在不同的攻击距离下有特殊效果，无法额外增加攻击距离。
items.weapon.melee.sdbsword.ability_name=裂晶飞击
items.weapon.melee.sdbsword.ability_no_target=那里没有任何目标或者没有有效的目标！
items.weapon.melee.sdbsword.typical_ability_desc=艾诺琳娜可以用钻石大剑击飞贴身的敌人，此次_攻击+30%伤害_，_击退3格并一定命中_，若敌人被击至墙体上则_自动消耗一回合追加一次远程魔法攻击_。
items.weapon.melee.sdbsword.ability_desc=艾诺琳娜可以用钻石大剑击飞贴身的敌人，此次_攻击+30%伤害，击退3格并一定命中_，若敌人被击至墙体上则_自动消耗一回合追加一次远程魔法攻击_。

items.weapon.melee.sdbsword.knock_wall_hit=%s被裂晶重击撞向墙体，你趁势追加一记魔法斩击！

items.quest.sakafishsketon.name=останки сакабамбасписа
items.quest.sakafishsketon.desc=Тело этого бедного существа сильно обветшало от многолетнего пребывания в глубинах. Похоже, оно просто хочет вернуться на поверхность, чтобы еще хоть раз взглянуть на... \n\nВернувшись из древних руин, вы обнаружили, что в этих останках таится некая жизненная энергия, но ей чего-то не хватает, возможно, этому маленькому существу нужна вода. Ведь вода - это источник жизни.\n\nМожет, поэтому предмет так ценится торговцами.

items.quest.sakafishsketon.saka=Снова вернуть к жизни?
items.quest.sakafishsketon.wnd_body=В этом маленьком существе, все еще чествуется жизненная энергия, которая всеми силами питается вернуть это бренное тело к жизни.\n\nЕсли вы хотите, чтобы это существо обрело новую жизнь, полейте на его останки зелье исцеления.
items.quest.sakafishsketon.wnd_set=Помочь обрести жизнь!
items.quest.sakafishsketon.wnd_return=Оставить все как есть...

items.quest.sakafishsketon.you_must_potion=Вам нужно иметь в рюкзаке хотя бы одно зелье исцеления, чтобы сделать это.

items.quest.sakafishsketon.saka2=Снова отнять жизнь?
items.quest.sakafishsketon.wnd2_body=Вы уверены, что хотите снова умертвить это маленькое и безобидное существо?\n\nКонечно, вы получите с него что-то, но тогда, вы долгое время не сможете возвратить его к жизни.
items.quest.sakafishsketon.wnd2_set=Да, хочу казнить
items.quest.sakafishsketon.wnd2_return=Нет, пусть живет

items.quest.sakafishsketon.ac_summonfish=ОЖИВИТЬ
items.quest.sakafishsketon.ac_summonfishdied=УМЕРТВИТЬ
items.quest.sakafishsketon.you_active=Вы чувствуете, как останки излучают тускло-желтоватое свечение...
items.quest.sakafishsketon.pets_died=Перед тем, как существо исчезло, вы замечаете, что во рту у него находился камень.
items.quest.sakafishsketon$cooldownstonerecharge.name=восполнение жизненной энергии
items.quest.sakafishsketon$cooldownstonerecharge.desc=Поскольку вы умертвили маленького сакабамбасписа, потребуется некоторое время, чтобы он снова накопил жизненную энергию.\n\nОсталось ходов: %s.
items.quest.sakafishsketon.charged=Останки сакабамбасписа накопили жизненную энергию!

items.quest.dogstick.name=狗哨
items.quest.dogstick.desc=一个精致的狗哨。这件物品对于商人似乎有很高的吸引力。\n\n你感受到了这个狗哨与某个存在之间的联系，只要你吹响，它就会听见。
items.quest.dogstick.dog=吹响狗哨？
items.quest.dogstick.wnd_body=这头小犬找到了你，你只需要给予一瓶烈焰药水，它会很乐意跟在你的身边，见证你的冒险。
items.quest.dogstick.wnd_set=Дать зелье
items.quest.dogstick.wnd_return=Пока не давать
items.quest.dogstick.you_must_potion=你的背包中至少携带一瓶烈焰药水才能继续操作。
items.quest.dogstick.dog2=暂时分开？
items.quest.dogstick.wnd2_body=你确定要与小刻耳柏洛斯暂时分开吗？这头小犬似乎并不想离开你……
items.quest.dogstick.wnd2_set=残忍分开
items.quest.dogstick.wnd2_return=我舍不得
items.quest.dogstick.ac_summondog=ПРИЗВАТЬ
items.quest.dogstick.ac_summondogdied=遣返
items.quest.dogstick.you_active=你手捧着烈焰药水并吹响狗哨，赤焰骤然腾起，一头小刻耳柏洛斯在焰影中若隐若现……
items.quest.dogstick.pets_died=伴随着轻微的呜咽声，小刻耳柏洛斯的身形在烈焰中渐渐淡去……
items.quest.dogstick$cooldownstonerecharge.name=火种冷却
items.quest.dogstick$cooldownstonerecharge.desc=由于你刚刚已经让小刻耳柏洛斯离开，现在需要一段时间来让它重新打起精神。\n\n剩余充能时长:%s回合.
items.quest.dogstick.charged=你的小刻耳柏洛斯充满了活力！

items.food.redcrab.name=варёный краб
items.food.redcrab.desc=Этот подарок от девушки, судя по цвету, краб уже приготовлен и выглядит довольно аппетитно. При употреблении может помочь утолить чувство голода.

items.food.sakameat.name=сакабамбасписное филе 
items.food.sakameat.desc=Ох... осмотрев тушу древнего существа, вам стало понятно что его мясо, может бить все еще съедобным для вас.
items.food.sakameat.oks=Вы чувствуете, как в ваше тело приходит вдохновение!

items.wands.wandofanmy.name=палочка Контроля
items.wands.wandofanmy.desc=Эта палочка управляется таинственной энергией, которая вынуждает монстров подземелья (_кроме боссов_) подчиняться её владельцу, когда достаточно энергии.\n\nЭта палочка не может бить улучшена или выброшена, но исчезает вместе с таинственной энергией, когда она рассеется...
items.wands.wandofanmy.stats_desc=Эта палочка испускает волну контролирующую разум, без причинения урона, но могут мгновенно взять под контроль монстра, превращая его в союзника.
items.wands.wandofanmy.error=Ваша палочка может повлиять на босса.

items.wands.wandofanmy$allytorestart.name=подконтрольное сознание
items.wands.wandofanmy$allytorestart.desc=Подконтрольность может быть лучшим способом освобождения, возможно, нам не следует враждовать с людьми...
items.wands.wandofanmy$allytorestartok.name=подконтрольное сознание

items.books.questbookslist.dimandbook.name=книга королевского поединка
items.books.questbookslist.dimandbook.action=Вы бросили вызов неизвестному врагу, удачи!
items.books.questbookslist.dimandbook.desc=Ты... убивал... моих сородичей... А теперь желаешь... Бросить мне вызов... Чтобы сразиться со мной?\n\nВы чувствуете непостижимую силу в этой книге, убедитесь, что вы полностью готовы к битве, прежде чем бросать вызов.
items.books.questbookslist.dimandbook.fuck_desc=Ты уже не раз побеждал моих сородичей, а теперь желаешь сразиться со мной. Я очень восхищаюсь твоей смелостью и силой, поэтому хочу сам проверить, на что ты способен.\n\nТы можешь отправиться на священное поле битвы и вступить в рыцарский поединок за честь. На арене соревнуются до сильнейшего, чтобы определить истинного победителя.\n\nЕсли ты примешь вызов, это будет легендарная битва. Я с нетерпением жду твоей решимости.

items.books.questbookslist.hollowcitybook.author=
items.books.questbookslist.dimandbook.author=

items.books.questbookslist.dimandbook.ac_read=ПРИНЯТ ВЫЗОВ
items.books.questbookslist.dimandbook.action_s=Похоже, эта книга сгорела из-за того, что противнику не хватило сил, чтобы принять вызов...\n\nЕсли вы хотите бросить вызов, вам необходимо прочитать эту книгу до того, как спуститесь на 10-й этаж!

items.books.bookslist.testbooks.name=Неуязвимость
items.books.bookslist.testbooks.desc=Активация этой способности дарует постоянный эффект неуязвимости, а повторное применение отменяет этот эффект.
items.books.bookslist.testbooks.ac_read=АКТИВИРОВАТЬ
items.books.bookslist.testbooks.author=Автор: Ling.
items.books.bookslist.testbooks.godmode_on=Режим неуязвимости: включен!
items.books.bookslist.testbooks.godmode_off=Режим неуязвимости: выключен!


items.quest.mime$gold_one.name=полумесяц с нефритом
items.quest.mime$gold_one.desc=Драгоценный предмет из другого мира, по форме напоминающий полумесяц с драгоценным камнем в центре. К сожалению, он не способен воплотить свои заложение возможности в этом мире. Но его драгоценной внешней красоты достаточно, чтобы заинтересовать торговцев.

items.quest.mime$gold_two.name=изумруд
items.quest.mime$gold_two.desc=Драгоценные камни зачастую способны накапливать энергию, и этот не исключение. Такую драгоценность можно хорошо продать торговцам или просто носить с собой для других целей.\n\n_При ношении такого предмета в рюкзаке, владелец может стать невидимым, если его здоровье упадет ниже 20%._
items.quest.mime$goldtwocooldown.name=охлаждение изумруда
items.quest.mime$goldtwocooldown.desc=Вы недавно использовали этот пассивную способность и должны подождать, прежде чем использовать её снова.\n\nХодов осталось: %s.

items.quest.mime$gold_three.name=таинственный песок
items.quest.mime$gold_three.desc=Творение иного мира, словно затягивает за собой время, когда смотришь на сыпучий песок с пылью. На первый взгляд это выгладить на обычный мусор, но на самом деле имеет сильную ценность у торговцев.\n\n_При ношении такого предмета в рюкзаке, владелец увеличивает скорость передвижения на 20%._

items.quest.mime$gold_four.name=печать с синей гравировкой
items.quest.mime$gold_four.desc=Предмет белых эпох, излучает странную энергетику, а синяя гравировка, вроде бы что-то сообщает, но символы так давно затерлись, что их уже невозможно прочесть. Поэтому, только его старинный вид представляет ценность у торговцев.

items.quest.mime$gold_five.name=Сердце Бога-Творца
items.quest.mime$gold_five.desc=Этот оберег был вырезан в честь Бога-Творца. Сейчас их уже давно никто не делает и не помнит, и возможно, это единственный экземпляр из существующих. Но в нем все еще чувствуется сила Бога-Творца. Такую древность можно хорошо продать торговцам или просто носить с собой, чтобы получить благословение Бога-Творца.\n\n_При ношении такого предмета в рюкзаке, владелец удваивает эффект исцеления, а если его здоровье упадет ниже 1/4, он на некоторое время становится неуязвимым, обретая гнев божественного творца. (Этот предмет всегда срабатывает раньше Анха)_

# 倒悬的生命树 - 武器本体
items.weapon.melee.lifetreesword.name=Ветвь Древа Жизни
items.weapon.melee.lifetreesword.desc=克里弗斯之果破碎时，四周的藤蔓缠结在暴露出的种子上形成剑的形状。剑身触碰到生物时会汲取他们的生命力提供给种子，期待着它再次结出猩红的果实\n\n这是一个比较精准的武器。\n\n特别说明：每次攻击可汲取生命能量，攒满能量即可释放特殊技能。\n\n当前能量：%s/%s
items.weapon.melee.lifetreesword.ac_summon=ПРИЗВАТЬ РАСТЕНИЕ
items.weapon.melee.lifetreesword.prompt=Выберите место для призыва
items.weapon.melee.lifetreesword.no_charge=У оружия недостаточно энергии, чтобы использовать уникальную способность.
items.weapon.melee.lifetreesword.bad_pos=Вы не можете разместить здесь растение!
items.weapon.melee.lifetreesword.nolongrange=Вы не можете на таком расстоянии призвать растение.
items.weapon.melee.lifetreesword$placeholder.error=Обратите внимание, что Ветвь Древа Жизни должна быть не экипирована, если хотите использовать её в алхимии.
items.weapon.melee.lifetreesword$lifetreant.name=Растение-людоед
items.weapon.melee.lifetreesword$lifetreant.desc=Эти ожившие растения в джунглях стали необычайно агрессивными, когда в джунглях произошли странные изменения. Они зачастую распыляют яд на посторонних существ, а сам яд чрезвычайно едкий и очень опасен. Само тело их очень гибкое, поэтому такое растение лучшее убивать, встречая врасплох.
items.weapon.melee.lifetreesword.ability_name=рассечь
items.weapon.melee.lifetreesword.typical_ability_desc=Дуэлянт может _рассечь_ врага ветвью древа жизни. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 2 ходов.
items.weapon.melee.lifetreesword.ability_desc=Дуэлянт может _рассечь_ врага ветвью древа жизни. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.

items.wands.wand.summon=Выберите место для призыва

items.food.crivusfruitsfood.name=недозревший фрукт
items.food.crivusfruitsfood.desc=Фрукты, выпавшие с «плода Клиффорда», обладают легким привкусом крови.
items.food.crivusfruitsfood.eat_msg2=Этот ароматный фрукт, оставляет кисло-сладкое послевкусие крови...

items.quest.crivusfruitsflake.name=кровавый обломок плода
items.quest.crivusfruitsflake.desc=Когда плод Клиффорда был уничтожен, он разлетелся на множество кусков во все стороны, оставив за собой эти несъедобные обломки. \n\nСам по себе он бесполезен, но длительное воздействие магии наделило его загадочной силой, которая стала привлекать внимание торговцев, по этой причине его свойства можно применить в алхимии для создания особых предметов. В крайнем случае, его можно просто продать или конвертировать в энергетические кристаллы.

items.weapon.melee.legend.kingaxe.name=королевская секира
items.weapon.melee.legend.kingaxe.stats_desc=Это очень меткое оружие.
items.weapon.melee.legend.kingaxe.desc=Оружие, которое служило Торину при жизни, на удивление на его лезвие все еще остаются темные пятна крови. Торин был солдатом, воином, героем, но даже у него бывали случаи, когда он оказывался в безвыходном положении. Похоже, вы нашли общую связь с этим оружием, возможно, это из-за того, что вы идете по тому же пути\n\nКаждая атака накапливает очки, достигая 5 очков его следующая атака меняется на обычную + урон от заклинаний, накладывая владельцу эффект небытия на 5 ходов (урон от заклинаний составляет 25% от общего урона).\n\nНакоплено очков: 
items.weapon.melee.legend.kingaxe$armornofear.name=небытие
items.weapon.melee.legend.kingaxe$armornofear.desc=Сила небытия охватывает вас, и, находясь в нем, вы получаете снижение урона на 30%%.\n\nХодов осталось: %s.


# 高阶法杖
items.wands.hightwand.wandofhighthunderstorm.name=палочка Штормовой молний
items.wands.hightwand.wandofhighthunderstorm.staff_name=посох Штормовой молний
items.wands.hightwand.wandofhighthunderstorm.ondeath=Вы убили себя собственной палочкой Штормовой молний...
items.wands.hightwand.wandofhighthunderstorm.desc=Эта палочка сделана из таинственного кристалла и палочки молний, а также других алхимических ингредиентов. На навершии он украшен фиолетовым камнем где есть два зубца, между которыми проскакивают электрические дуги.
items.wands.hightwand.wandofhighthunderstorm.stats_desc=Эта палочка выпускает поблизости водяной туман, а также испускает очень мощные молнии, которые пронизывают все, против чего они направлены, и причиняют _%1$d-%2$d урона_. Это электричество переходит на близкие персонажи и свободнее распространяется в воде. Молнии из этой палочки могут вызвать цепную реакцию молнии или нанести вам вред, но не затрагивают ваших союзников.
items.wands.hightwand.wandofhighthunderstorm.bmage_desc=Когда _%s_ %s, посох Штормовой молнии имеет шанс дать эффект электрической зарядки на 10 ходов, наделяя при этом тайным барьером. Будучи заряженным маг невосприимчив к электрическому урону и его молнии будут бить дальше.
items.wands.hightwand.wandofhighthunderstorm.eleblast_desc=Стихийный взрыв с посохом штормовой молнии наносит 15% урона, оглушает врагов на 8 ходов и электризует воду.

items.wands.hightwand.wandofbluefuck.name=палочка Фосфорного пламени
items.wands.hightwand.wandofbluefuck.staff_name=посох Фосфорного пламени
items.wands.hightwand.wandofbluefuck.desc=Эта палочка сделана из соснового дерева и покрытf небесно-голубой краской, придавая ей величественный вид. Её наконечник шипит и искрит, стремясь высвободить свою могущественную магию.
items.wands.hightwand.wandofbluefuck.stats_desc=При использовании эта палочка выпускает конус фосфорного огня. Его следующая поглотит _%1$d зарядов_ и нанесёт _%2$d-%3$d урона_. Чем больше зарядов используется, тем больше и сильнее эффект.
items.wands.hightwand.wandofbluefuck.bmage_desc=当_%s_以鬼磷法杖%s，有概率吸收所有邻近的磷火并制造出一场超新星爆炸，不仅能造成大量伤害，还能让敌人幻惑与失明，并且自身获得4回合磷火审判！与敌人相邻的磷火越多，触发该效果的概率越高。\n\n同时在击杀敌人时，有概率让它复活为“亡魂残躯-鬼磷”，立刻找到附近的敌人造成自爆产生3x3磷火效果。（这个效果有50回合冷却）
items.wands.hightwand.wandofbluefuck$fireboomskull.name=фосфорный мертвец
items.wands.hightwand.wandofbluefuck$fireboomskull.desc=Вы воскресили убитого врага, и отныне он сражается на вашей стороне.\n\nОн взрывается при приближении к врагу, образуя облако фосфорного газа размером 3x3, но если поблизости находится герой или союзник, он мгновенно умирает.
items.wands.hightwand.wandofbluefuck$fireboomskullspawncooldown.name=перезарядка воскрешения фосфорного мертвеца
items.wands.hightwand.wandofbluefuck$fireboomskullspawncooldown.desc=Вы недавно призвали мертвеца, поэтому потребуется время, прежде чем призвать его снова.\n\nХодов осталось: %s.

items.wands.wandofgodice.name=палочка Леденящего порыва
items.wands.wandofgodice.staff_name=посох Леденящего порыва
items.wands.wandofgodice.desc=这根法杖的蔚蓝色色主干顶端镶嵌着一颗明亮的金色宝石。\n\n它能发射出冰冻冲击波，在目标点产生暴风雪，在这个范围内所有目标移速和攻速都会降低。\n\n如果暴风雪下有水地块，则_冻结效率会翻倍_，如果遇到精英或者领袖敌人，则本次产生暴风雪后还会在目标点产生一次电击效果。
items.wands.wandofgodice.normal_desc=这根法杖的蔚蓝色色主干顶端镶嵌着一颗明亮的金色宝石。\n\n它能发射出冰冻冲击波，在目标点产生暴风雪，在这个范围内所有目标的移速和攻速都会降低。\n\n如果暴风雪下有水地块，一般情况下，则使其上的生物的_冻结效率翻倍_，如果遇到精英或者领袖敌人，则本次产生暴风雪后还会在目标点产生一次电击效果。
items.wands.wandofgodice.stats_desc=Эта палочка наносит _%1$d-%2$d урона_.
items.wands.wandofgodice.bmage_desc=Когда _%s_ %s, у посоха Ледяного хлада, есть шанс активировать зачарование удачи.
items.wands.wandofgodice.eleblast_desc=Стихийный взрыв с посохом леденящего порыва наносит 100% урона, вызывает снежную бурю и тушит пожары.


items.wands.hightwand.wandofvenom.name=палочка Ядовитого тумана
items.wands.hightwand.wandofvenom.staff_name=посох Ядовитого тумана
items.wands.hightwand.wandofvenom.desc=Эта палочка вырезана из фиолетово-золотистого древа и его навершие украшено ярко-зеленым драгоценным камнем.
items.wands.hightwand.wandofvenom.stats_desc=При использовании эта палочка стреляет зарядом, который взрывается в облако алого газа в месте попадания, испуская крайне едкий газ. Урон, наносимый этим газом, растет в зависимости от того, сколько времени цель находилась в облаке, начиная с _%1$d ед. урона,_ и продолжит накапливать токсины.\n\nКогда совокупный урон от облака достигнет _%2$d единиц_, он будет ослеплять носителя, и достигнув _%3$d единиц_, он начнет парализовать цель.\n\nПрием зелья исцеления или избавления может очистить накопленные токсины. Сильные враги выйдя из облака, очищаются от накопленных токсинов.
items.wands.hightwand.wandofvenom.bmage_desc=Когда _%s_ %s, у посоха Ядовитого тумана, есть шанс излучения хаотической энергии, как у зачарования хаоса и обладает определенным эффектом заряда.

items.wands.wandofsun.name = палочка Палящего солнца
items.wands.wandofsun.ac_dismiss = РАССЕЯТЬ МИНИ-СОЛНЦЕ
items.wands.wandofsun.dissun = Мини-солнце вышло из под контроля!
items.wands.wandofsun.solid = В этом месте нельзя призвать мини-солнце.
items.wands.wandofsun.staff_name = посох Палящего солнца
items.wands.wandofsun.stats_desc=Эта палочка призывает миниатюрное солнце в указанное место. Мини-солнце открывает обзор в области 7х7 вокруг него, и наносит _%1$d-%2$d урона_ окружающим врагам.\n\nВраги, находящиеся внутри мини-солнца, получают дополнительный урон от других мини-солнц.\n\nУрон, наносимый мини-солнцем, зависит от расстояния к противнику.
items.wands.wandofsun.bmage_desc=Когда _%s_ %s, посох Палящего солнца может продлить действие всех существующих мини-солнц на один ход.
items.wands.wandofsun.hassun = Вы рассеяли это мини-солнце.
items.wands.wandofsun.no_more_suns = Эта палочка не может контролировать больше мини-солнц.
items.wands.wandofsun$minisun.desc = \n\nВ этом месте находится мини-солнце, и оно будет существовать еще %d ходов.\n\n(Из-за технической трудности, это солнце не сохраняется в подземелье после выхода из игры.)
items.wands.wandofsun.desc = Первый человек, который попытался перенести солнце под землю, не осознавал того, что нежить и демоны не устрашатся ложного солнца.
items.wands.wandofsun.thanks=_-_ Дизайн: Цай Юйлу.\n_-_ Тематика: Волшебный час.\n_-_ Награда: _Премия Цзинхун_ - Первое место.\n_-_ [Соревнование: 1-й конкурс DIY за кубок Цзинхун. [


