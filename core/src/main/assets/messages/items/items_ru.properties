items.weapon.melee.spdtomlpd.staffofmyriadthings.and_more=...и т. д. %1$d
items.weapon.melee.spdtomlpd.staffofmyriadthings.bonus=Текущие усиление: урон +%1$d, точность +%2$d.
items.weapon.melee.spdtomlpd.staffofmyriadthings.ability_name=сияние мириад

# 晨星 MorningStar messages
items.weapon.melee.spdtomlpd.morningstar.name=булава утренней звезды
items.weapon.melee.spdtomlpd.morningstar.desc=Возможно, именно от этого излучающего холодного блеска, эта булава и получила свое название.
items.weapon.melee.spdtomlpd.morningstar.stats_desc=Это оружие поочередно накладывает на противника эффект ослабления, уязвимости, головокружения и ослепления на _%s_ ходов.
items.weapon.melee.spdtomlpd.morningstar.dev_desc=Атака этого оружия поочередно накладывает на противников эффект ослабления, уязвимости, головокружения и ослепления на 2+0,3*уровень (округляется в меньшую сторону) ходов.
items.weapon.melee.spdtomlpd.morningstar.ability_name=небесная звезда

# 钉入矛 NailingSpear messages
items.weapon.melee.spdtomlpd.nailingspear.name=пригвождающее копьё
items.weapon.melee.spdtomlpd.nailingspear.desc=Это копьё способно прочно пригвоздить врага к стене.
items.weapon.melee.spdtomlpd.nailingspear.stats_desc=Это оружие наносит на 30% больше урона, когда в радиусе 3×3 от противника находится стена.

# 门板 DoorPlank messages
items.weapon.melee.spdtomlpd.doorplank.name=дверная панель
items.weapon.melee.spdtomlpd.doorplank.desc=С таким тяжелым оружием, кажется, можно вложить всю свою силу в один удар.
items.weapon.melee.spdtomlpd.doorplank.stats_desc=%1$s\nЭто оружие наносит дополнительный чистый урон, равный (%2$d%%) от вашего максимального здоровья.
items.weapon.melee.spdtomlpd.doorplank.typical_stats_desc=%1$s\nОбычно это оружие наносит дополнительный чистый урон, равный (%2$d%%) от вашего максимального здоровья.
items.weapon.melee.spdtomlpd.doorplank.executed=Добит
items.weapon.melee.spdtomlpd.doorplank.ability_cannot_execute=Оставшееся здоровье цели не ниже вашего, поэтому вы не можете её добить!

