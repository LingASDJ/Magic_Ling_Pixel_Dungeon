items.weapon.melee.spdtomlpd.southpointsword.5g=Стоило лишь последовать за острием этого клинка, как туман рассеялся, открывая путнику взор впереди.

# 德诺尔镰刀 DenorScythe messages
items.weapon.melee.spdtomlpd.denorscythe.name=денорская коса
items.weapon.melee.spdtomlpd.denorscythe.desc=На рукоятке этого серпа, изготовленного в Деноре, которое славится своими искусными танцами, даже заботливо выгравирована напоминание о том, как следует выполнять взмах.
items.weapon.melee.spdtomlpd.denorscythe.stats_desc=Это оружие одновременно наносить удар по всем врагам, увеличивая скорость атаки на 66%, когда в радиусе атаки находятся три или более врагов.
items.weapon.melee.spdtomlpd.denorscythe.ability_name=танец лезвия
items.weapon.melee.spdtomlpd.denorscythe$extendedreach.name=танец лезвия
items.weapon.melee.spdtomlpd.denorscythe$extendedreach.desc=Действует %1$s ходов, увеличивая дальность атаки косы %2$d.
items.weapon.melee.spdtomlpd.denorscythe.ability_desc=Дуэлянт может совершить _танец клинков_ денорской косой.   Эта способность увеличивает радиус атаки на 1 клетку и действует 10+(уровень×2) ходов, не тратя ход, но стоит 2 заряда оружия.

# 深海骑士的锚 DeepseaKnightAnchor messages
items.weapon.melee.spdtomlpd.deepseaknightanchor.name=якорь глубоководного рыцаря
items.weapon.melee.spdtomlpd.deepseaknightanchor.desc=Огромный якорь, наделенный божественной защитой Тайной Принцессы, способный сокрушить даже самые прочные предметы, в конце концов оказался погруженным в морских глубинах.
items.weapon.melee.spdtomlpd.deepseaknightanchor.stats_desc=Это оружие при успешном попадании по противнику снимает все негативные эффекты.
items.weapon.melee.spdtomlpd.deepseaknightanchor.ability_name=возмущение
items.weapon.melee.spdtomlpd.deepseaknightanchor.ability_desc=Дуэлянт может совершить _возмущение_ якорем глубоководного рыцаря. Эта способность дает адреналин на 5+за уровень ходов, не тратя ход, но стоит 3 заряда оружия.

# 铲子 Shovel messages
