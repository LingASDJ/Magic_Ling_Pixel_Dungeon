items.weapon.melee.washcrime.name=кусаригама искупитель грехов
items.weapon.melee.washcrime.desc=На конце железной цепи привязан огромный серп, который уже покрылся ржавчиной от { пятен крови. {\n\nАтаки этого оружия способны высвободить | неупокоенние души | для помощи в бою, и могут | калечить | врагов. Урон оружия увеличивается от количества убитых врагов, но перестает расти достигнув определенной отметки.\n\n_Это оружие имеет повышенную дальность атаки, и очень медленную скорость атаки._
items.weapon.melee.washcrime$diedghost.name=неупокоенная душа
items.weapon.melee.washcrime$diedghost.desc=Умертвенное тело уже давно кормит червей, но его душа так и не обрела покой, посему некое сознание так и подчиняется воле своего хозяина, пока не найдет свою истинную смерть.
items.weapon.melee.washcrime.ability_name=хлестнуть
items.weapon.melee.washcrime.ability_desc=Дуэлянт может _хлестнуть_ кусаригамой всех врагов вокруг. Эта способность наносит _%1$d-%2$d урона_, атакует всех врагов в зоне действия кусаригами и гарантированно попадает в цель.
items.weapon.melee.washcrime.typical_ability_desc=Дуэлянт может _хлестнуть_ кусаригамой всех врагов вокруг. Эта способность обычно наносит _%1$d-%2$d урона_, атакует всех врагов в зоне действия кусаригами и гарантированно попадает в цель.

items.weapon.melee.bloodthirstythorn.name=кровожаждущие шипы
items.weapon.melee.bloodthirstythorn.desc=Колючки Древа Жизни, оставленные после разлагающейся крови. Отказавшись от последнего остатка порядка, осталось лишь насилие и хаос...\n\n- Атаки могут накладывать на врага { кровотечение и ужас. {\n- Содержит такую же механику улучшения, как у кровавой чаши.\n\n_Это очень меткое оружие._
items.weapon.melee.bloodthirstythorn.stats_desc=Эти шипы больше не сопротивляются вам, похоже, они как-то изменились.
items.weapon.melee.bloodthirstythorn.stats_descx=\n\nЭти шипы выросли до своего предела и теперь воздадут должное.
items.weapon.melee.bloodthirstythorn.good=Ваша жизненная энергия полностью проникла в шипы, и за вашу преданность вы получите { проклятую, кровавую чашу 1-3 уровня. {

items.weapon.melee.bloodthirstythorn.ac_prick=УКОЛОТЬСЯ
items.weapon.melee.bloodthirstythorn.yes=Да, я знаю, что я делаю
items.weapon.melee.bloodthirstythorn.no=Нет, я передумал
items.weapon.melee.bloodthirstythorn.prick_warn=С каждым использованием шипы забирают всё больше вашей жизненной энергии и могут с лёгкостью вас убить.\n\nВы уверены, что хотите предложить им ещё?
items.weapon.melee.bloodthirstythorn.onprick=Уколов палец об кошмарное колючее растение, вы отдаете ему часть своей жизненной энергии.
items.weapon.melee.bloodthirstythorn.ondeath=Кошмарное колючее растение осушило вас до конца...
items.weapon.melee.bloodthirstythorn.ability_name=свирепый удар
items.weapon.melee.bloodthirstythorn.typical_ability_desc=Дуэлянт может совершить _свирепый удар_ кровожаждущими шипами. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Свирепый удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.bloodthirstythorn.ability_desc=Дуэлянт может совершить _свирепый удар_ кровожаждущими шипами. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Свирепый удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.

items.weapon.melee.magictorch.name=волшебный факел
items.weapon.melee.magictorch.desc=Бушующее пламя, пожирающее серый кристалл, кажется, некогда не погаснет. \n\nЭтот факел при попадании всегда поджигает цель, и обеспечивает владельца постоянным постоянным эффектом освещения.\n_Этим оружием нельзя осуществить неожиданную атаку, и оно довольно неточное._
items.weapon.melee.magictorch.mustload=Эффект факела не будет активирован, пока у вас есть другие эффекты освещения.

items.weapon.melee.magictorch$magiclight.name=волшебный источник света
items.weapon.melee.magictorch$magiclight.desc=Магический факел излучает постоянный источник света, обеспечивая обычный свет в радиусе 2/3 клеток.

