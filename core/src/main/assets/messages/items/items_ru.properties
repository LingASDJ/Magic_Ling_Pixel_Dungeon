items.artifacts.magneticcrown.no_enemy_in_range=Поблизости есть враги, но эффект притягивания действует только на противников в пределах радиуса действия; вблизи выбранной позиции подходящих нет подходящих врагов!
items.artifacts.magneticcrown.no_vision=Это место нельзя выбрать, вы не видите эту область!

items.artifacts.commrelay.name=радиостанция DM100 (НЗП)
items.artifacts.commrelay.desc=Удивительное работающее устройство радиосвязи с прилагающей к ней инструкцией, а также содержит функцию авторизации.\n\nПохоже, кто-то оставил радиочастоту Гильдии наемников для получения их услуг за золото.
items.artifacts.commrelay.ac_call=АВТОРИЗАЦИЯ
items.artifacts.commrelay.ac_supp=СНАБЖЕНИЕ
items.artifacts.commrelay.ac_merc=НАЕМНИК

items.artifacts.commrelay.call_title=Система резервного снабжения!
items.artifacts.commrelay.call_desc=Добро пожаловать обладателей радиостанции DM100 в систему резервных поставок.\n\nПожалуйста, введите динамический код для авторизации с торговой палатой на поверхности, чтобы получить допуск к дальнейшему использованию системы.
items.artifacts.commrelay.confirm=Авторизация
items.artifacts.commrelay.cancel=Отмена
items.artifacts.commrelay.call_success=Авторизация прошла успешно, добро пожаловать в систему обслуживания радиостанции DM100.
items.artifacts.commrelay.call_fail=Авторизация не выполнена, введенный вами код неверен, пожалуйста, попытайтесь ввести код еще раз.

items.artifacts.commrelay.merc=Ваш наемник уже прибыл сюда.
items.artifacts.commrelay.boss=Вы не можете использовать здесь артефакт.
items.artifacts.commrelay.unequipped=Вам необходимо экипировать артефакт, прежде чем вы сможете его использовать!
items.artifacts.commrelay.unuseable=Вы думаете, что так, он будет работать?
items.artifacts.commrelay.no_money=Вы не можете использовать артефакт, не имея нужного золота!
items.artifacts.commrelay.already_cursed=Мы не будем подчиняться вам!
items.artifacts.commrelay.desc_1=Удивительное и работающее устройство радиосвязи с прилагающей к ней инструкцией.
items.artifacts.commrelay.desc_2=Прочитав которую можно разобраться с его функциями.\n\n
items.artifacts.commrelay.desc_3=Похоже, в нем имеется радиочастота Гильдии наемников, где они предоставляют свои услуги за золото.
items.artifacts.commrelay.desc_cursed=Проклятая радиостанция сама включилась и посылает громкий статическое треск, эхом разносящееся по подземелью.
items.artifacts.commrelay.desc_low_level=Вы связавшись по рации с наемниками, сумели договориться получить поддержку, если потратите золото на активацию их транспортера материи.
items.artifacts.commrelay.desc_high_level=Кто-то удаленно отправляет вам радиосообщения: «Предлагаем снабжение за 5000 золота или наемника за 3500 золота».
items.artifacts.commrelay.desc_work_well=Вы в хороших отношениях с гильдией, и теперь они охотно предлагают свои услуги за меньшую плату.
items.artifacts.commrelay.item_tip=Торговая палата с поверхности предоставила вам резервный запас.
items.artifacts.commrelay.item_pos=Выберите место для доставки

items.artifacts.wraithamulet.name=амулет из темного золота
items.artifacts.wraithamulet.desc=Этот амулет был когда-то оберегом у молодой девушки, исследовавшей здешние места, но с тех пор, как она исчезла в подземелье, он был оставлен здесь...\n\nБудучи предметом иного мира, он способен скрывать владельца, частично перенося его в "мир духов".\n\nКогда у амулета достаточно энергии, он может мгновенно перемещать к врагу и совершать покушение, наносящее { смертельный урон. { Но если это босс, то он получит _25% урона от максимального здоровья_.
items.artifacts.wraithamulet.ghost=Ваше тело становится прозрачным, как будто вы исчезаете.
items.artifacts.wraithamulet.cooddown=Ваш амулет восстанавливает энергию для повторного использования.
items.artifacts.wraithamulet.nochareup=Ваш амулет недостаточно заряжен, чтобы его можно было использовать.
items.artifacts.wraithamulet.cursed=Девичья обида воедино слились с проклятой магией, сковав вашу душу в амулете, не позволяя вам использовать его истинную силу.\n\n_Проклятый амулет лишает возможности употреблять зелья и периодически высасывает жизненную энергию владельца._

items.artifacts.wraithamulet.ac_ghost=ИСЧЕЗНУТЬ
items.artifacts.wraithamulet.ac_darkkill=ПОКУШАТЬСЯ
items.artifacts.wraithamulet.noequip=Вам необходимо надеть амулет, чтобы его использовать.
items.artifacts.wraithamulet.must_nocursed=Вы не можете использовать проклятый амулет.
items.artifacts.wraithamulet.drink_cursed=Проклятый амулет создает невидимый барьер, не позволяющий вам выпивать зелья, посылая вам голоса проклятой девы.

items.artifacts.wraithamulet$wraithrecharge.ondeath=Ваша душа полностью высосана амулетом...
items.artifacts.wraithamulet$wraithrecharge.cursed=Ваша душа останется в нем навсегда...
items.artifacts.wraithamulet$wraithrecharge.rankings_desc=Опустошён амулетом из темного золота...
items.artifacts.wraithamulet$wraithrecharge.ghoststong=Ваш амулет стал еще более могущественнее.

items.artifacts.wraithamulet$1.selectkill=Выберите цель для покушения
items.artifacts.wraithamulet$1.far=Эта цель находится слишком далеко.
items.artifacts.wraithamulet$1.rooted=Вы неспособны совершить покушение, пока ваше тело оплетено.
items.artifacts.wraithamulet$1.notthere=Там нет цели!
items.artifacts.wraithamulet$1.notthere2=Вы неспособны совершить покушение на спящего мимика.
items.artifacts.wraithamulet$1.notnpc=Вы неспособны совершить покушение на NPC!
items.artifacts.wraithamulet$1.killmobs=Это существо было успешно казнено вашим покушением!
items.artifacts.wraithamulet$1.killboss=Этот босс сильно пострадал от вашего покушения!
items.artifacts.wraithamulet$1.gold=Вы неспособны совершить покушение, пока находитесь в лабиринте сокровищ.
items.artifacts.wraithamulet$1.died=Отправляйся в ад!
items.artifacts.wraithamulet$1.koss=И что с того, что он босс?
###bags
items.bags.bag.name=рюкзак

items.bags.potionbandolier.name=пояс для зелий
items.bags.potionbandolier.desc=Этот широкий пояс надевается на грудь, как патронташ. В нём много маленьких кармашков для бутыльков с зельями.\n\nКарманы достаточно плотные для того, чтобы не дать бутылькам потрескаться от холода.

items.bags.scrollholder.name=футляр для свитков
items.bags.scrollholder.desc=Похоже, раньше этот футляр использовался для хранения астрономических карт, но и для свитков и книг он вполне подойдёт. Здесь есть даже несколько боковых отделений, которые прекрасно подойдут для ваших заклинаний, мистических грифелей и магической смолы.\n\nПохоже, этот футляр огнеупорен, так что сможет защитить ваши свитки от огня.

items.bags.velvetpouch.name=бархатный мешочек
items.bags.velvetpouch.desc=В этой небольшой сумочке из бархата можно хранить множество мелких предметов, таких как семена и рунные камни.

items.bags.magicalholster.name=волшебный чехол
items.bags.magicalholster.desc=Этот зачарованный чехол, сделанный из шкуры какого-то экзотического зверя, позволяет хранить в нем оружие, доспехи и различные предметы.\n\nДостаточно просто запустить руку в чехол, и вы всегда достанете именно то, что искали.\n\nБлагодаря магии чехла, хранящиеся в нём палочки будут перезаряжаться немного быстрее, а метательные оружия будут дольше служить.



###bombs
items.bombs.arcanebomb.name=фосфорная бомба
items.bombs.arcanebomb.desc=Эта бомба наполнена соединением на основе фосфора. Её взрыв будет схож с атакой накачавшегося Слизня, который наносит _%1$d-%2$d магического урона_ всем кто находится в пределах 2 клеток. Кроме того, всем кто находится в радиусе действия, накладывается кратковременный эффект фосфорного пламени.
items.bombs.arcanebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.bomb.name=бомба
items.bombs.bomb.ac_lightthrow=ПОДЖЕЧЬ И БРОСИТЬ
items.bombs.bomb.snuff_fuse=Вы спешно задуваете фитиль бомбы.
items.bombs.bomb.ondeath=Вас разорвало взрывной волной...
items.bombs.bomb.rankings_desc=Убит взрывом
items.bombs.bomb.desc=Довольно крупная бомба, под завязку начиненная черным порохом. Взрыв этой бомбы наносит _%1$d-%2$d урона_ всему, что находится рядом с ней, и разрушает некоторую прилегающую местность или предметы.
items.bombs.bomb.desc_fuse=Похоже, что фитиль будет гореть несколько ходов, если его зажечь.
items.bombs.bomb.desc_burning=Фитиль горит, лучше избавиться от бомбы или затушить его!
items.bombs.bomb$doublebomb.name=две бомбы
items.bombs.bomb$doublebomb.desc=Две здоровенные пороховые бомбы по цене одной!

items.bombs.firebomb.name=зажигательная бомба
items.bombs.firebomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве наносить _%1$d-%2$d урона_ на большей области, поджигая всё в радиусе 2 клеток от точки взрыва.
items.bombs.firebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.flashbang.name=световая граната
items.bombs.flashbang.desc=Это бомба была модифицирована таким образом, чтобы при взрыве излучить звуковую вспышку света с электрическим разрядом. Сам взрыв наносит _%1$d-%2$d урона_ всем кто находится в пределах 2 клеток, и дополнительно наносит электричеством 25%% урона, оглушая на 10 ходов.
items.bombs.flashbang.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.frostbomb.name=замораживающая бомба
items.bombs.frostbomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве наносить _%1$d-%2$d урона_ на большой области, создавая облако замораживающего газа в радиусе 2 клеток.
items.bombs.frostbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.shockbomb.name=громовая бомба
items.bombs.shockbomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве выпустит электрический шторм в радиусе 3 клеток, нанося _%1$d–%2$d урона_ всем в зоне действия и накладывая паралич, продолжительность которого также уменьшается с увеличением расстояния. Кроме того, взрыв порождает небольшую грозу, охватывающую область 3x3 клетки.
items.bombs.shockbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.holybomb.name=освящённая бомба
items.bombs.holybomb.desc=Это бомба была модифицирована таким образом, чтобы при взрыве излучать вспышки святой энергии. Сам взрыв наносит _%1$d-%2$d урона_ всем кто находится в пределах 2 клеток, а если под него попадает нежить или демон, они получают дополнительно 50%% урона от святой энергии.
items.bombs.holybomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.noisemaker.name=шумовая бомба
items.bombs.noisemaker.desc=Эта модифицированная бомба будет безостановочно издавать шум, когда фитиль догорит. Если что-либо коснется бомбы, она тут же взорвется и нанесет _%1$d-%2$d урона_ всем кто в радиусе 2 клеток!
items.bombs.noisemaker.desc_burning=Генератор шума тикает, взрыв произойдет, если что-либо приблизится на достаточное расстояние!
items.bombs.noisemaker.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.smokebomb.name=дымовая бомба
items.bombs.smokebomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве высвобождать облако газа. Она нанесет _%1$d-%2$d урона_ и распространит окутывающий туман в радиусе 2 клеток от точки взрыва.
items.bombs.smokebomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.regrowthbomb.name=восстанавливающая бомба
items.bombs.regrowthbomb.desc=Эта модифицированная бомба вместо взрыва разбрызгивает в радиусе 3 клеток особый исцеляющий состав, провоцирующий ускоренный рост трав и растений, а так же лечащий вас и ваших союзников, будто вы выпили зелье исцеления.
items.bombs.regrowthbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.shrapnelbomb.name=осколочная бомба
items.bombs.shrapnelbomb.desc=Эта бомба была наполнена осколками DM-300, которые разлетятся во все стороны при взрыве, нанося _%1$d-%2$d урона_ всем в огромном радиусе вокруг бомбы. Лучше будет спрятаться за что-нибудь перед тем, как она взорвётся...
items.bombs.shrapnelbomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

items.bombs.woollybomb.name=шерстяная бомба
items.bombs.woollybomb.desc=Эта бомба создаст широкое поле волшебных овец после взрыва, который наносит _%1$d-%2$d урона_ всему, что находится в пределах 2 клеток. Они не позволят кому-либо пройти, и будут стоять очень долго! Правда, в присутствии сильных врагов овцы буду исчезать быстрее, и их можно отогнать при взаимодействии с ними.
items.bombs.woollybomb.discover_hint=Вы можете создать этот предмет с помощью алхимии.

###prop

items.props.prop.rareness=Эта безделушка _%s-го уровня,_ содержит %s воздействие.

items.props.prop.bad=<#DD0101> негативное <RGB>
items.props.prop.good=_положительное_
items.props.prop.chaos=<#EE8E1C> хаотичное <RGB>

###Good Prop
items.props.starsachet.name=саше с звездоцветом
items.props.starsachet.desc=Мешочек с благовониями, изготовленный из драгоценных цветов Звездоцвета, которые до сих пор источают особый аромат. Их аромат позволяет чувствовать себя более осознанным.\n\nДает в каждом новом регионе владельцу, постоянный бонус на <#E5579A> 1/2/3/4/5/6 <RGB> к точности и уклонению.

items.props.rapidearthroot.name=растущий землекорень
items.props.rapidearthroot.desc=Особая разновидность Землекореня, которая лучше растет и более живуча, чем обычный Землекорень, но имеет не такие мощные корни, как у обычного. Тем не менее, в столь среде, как подземелье, где бушует магия, он может оказаться полезным в нужный момент.\n\nКаждые <#E5579A> 100 ходов <RGB> дает его владельцу дубовую кожу, равную текущему этажу, но каждые <#E5579A> 10 ходов <RGB> ослабевает её броню.

items.props.portablewhetstone.name=точильный камень
items.props.portablewhetstone.desc=Этот специальный точильный камень не только мал и удобен в переноске, но и отличается уникальным дизайном, позволяя  своему обладателю довольно «изящно» ремонтировать свое оружие в кратчайшие сроки. Его единственным недостатком является то, что этот камень не очень прочный.\n\nДает в каждом новом регионе владельцу, постоянный бонус на <#E5579A> 2/3/4/5/7/9 <RGB> к наносимому физическому урону.

items.props.newstem.name=ожившая ветвь
items.props.newstem.desc=Мертвая ветка с ростками, мечтает о том дне, когда она снова расцветёт.\n\nВосстанавливает <#E5579A> +1 ОЗ <RGB> каждые 10 ходов, когда у владельца не сильный голод.

items.props.luckyglove.name=счастливые перчатки
items.props.luckyglove.desc=Легендарные перчатки Бога азарта, которые, по слухам, он носил их во всех крупнейших казино, и не знал поражений. Пока не раскрылось то, что эти перчатки имеют многослойную структуру...\n\nДает владельцу <#E5579A> 15% шанс, <RGB> не потратить золотые монеты при покупке предметов.

items.props.emotionalaggregation.name = совокупность решимости
items.props.emotionalaggregation.desc = Немало путешественников побывало в подземелье, и большинство из них трагически сгинули где-то в его глубинах... Их непоколебимая воля перед смертью, через какое-то время слилась воедино, сформировав эту совокупность.\n\nДает владельцу <#E5579A> 10% шанс <RGB> проигнорировать атаку противника, когда он должен получить урон.

items.props.armorscalesofbzmdr.name= чешуя доспеха
items.props.armorscalesofbzmdr.desc = От этой чешуи исходит узнаваемый запах, напоминающий вам знакомого человека (Bzmdr), которого вы иногда видели в таверне. Вот только, помнится, он никогда не носил доспехи с подобной чешуей...\n\nДает в каждом новом регионе владельцу, постоянное снижение на <#E5579A> 1/2/3/4/5 <RGB> к получаемому урону.

items.props.deliciousrecipe.name = полезные рецепты
items.props.deliciousrecipe.desc = Интересно, если следовать этому рецепту: «Положите в кастрюлю немного мяса призрачной пираньи, добавьте немного травы солнечника, несколько стеблей магорозы и варите на медленном огне в течение 30 минут» действительно ли, получится народное блюдо?\n\nКаждый раз, когда его владелец расходует <#E5579A> алхимическую энергию <RGB> в алхимии, он получает <#E5579A> +2 алхимических кристалла. <RGB>
items.props.deliciousrecipe.reduce = Вы следовали рецепту, и в последний момент извлекли источник магической энергии... Но алхимический процесс все равно прошел успешно! Просто всегда присутствует ощущение, что что-то не так...

items.props.emotionalaggregation.block = Когда на вас собирались напасть, вы почувствовали, как теплый поток обхватил ваше тело... И вы на мгновение стали неуязвимы к этой атаке!

items.props.knightstabbingsword.name = рыцарская шпага
items.props.knightstabbingsword.desc = Эта шпага была объектом веры для многих поколений - и, возможно, остаётся им по сей день. А, сможете ли вы поверить в её силу?\n\nДает владельцу после уклонения <#E5579A> 40% шанс <RGB> не потратит ход при следующей атаке.
items.props.knightstabbingsword.attack = Ваша вера в шпагу получила одобрение; следующая атака не расходует ход.

items.props.luckyglove.lucky = Пока вы торговались с продавцом, ваши перчатки сами собой кое-что стащили для вас...


items.props.wenstudyingpaperone.name = рукопись исследования среды
items.props.wenstudyingpaperone.desc = «Местная природа изменилась куда сильнее, чем где-либо еще… Неужели виной тому влияние так называемой  "Магии"? Непонятно, требуется провести более тщательное расследование».\n\nПри потери здоровья владелец получает временной пузырь на <#E5579A> 2 хода, <RGB> а если здоровье опускается ниже <#E5579A> 50%, <RGB> он вместо этого получает временной пузырь на <#E5579A> 5 ходов. <RGB> Этот эффект имеет перезарядку в <#E5579A> 7 ходов <RGB> и не может быть активирован уроном получаемым от голода.

items.props.monocular.name = монокулярный телескоп
items.props.monocular.desc = Очень странный монокуляр, который выглядит так, будто его сделали из бинокля... Неужели ли эта штука действительно работает?\n\nКогда владелец попадает <#E5579A> метательным оружием <RGB> по противнику, оно дополнительно нанесет <#E5579A> 1-3 ед. урона, <RGB> и повысит точность на <#E5579A> 20% <RGB> за каждую <#E5579A> клетку <RGB> расстояния до противника.

items.props.yanstudyingpapertwo.name =рукопись исследования местности
items.props.yanstudyingpapertwo.desc = «После двух вылазок осмотра местности стало очевидно, что пространственная связь между этим местом и Расколотым царством не такая уж и далекая, и можно даже сказать, что "очень близка". Подтверждением служат несколько чужаков, замеченных мной с другой стороны от входа в подземелье, которые не должны здесь существовать. Исходя из своего опыта, думаю нужно расспросить местных жителей, а также задуматься о временном ночлеге в гостинице на время поисков».\n\nКаждые <#E5579A> 30 ходов <RGB> дает владельцу ускорение на <#E5579A> 5 ходов. <RGB>

//TODO
items.props.killeye.name=око охотника
items.props.killeye.desc=Единственный глаз сохранившейся из древних времен какого-то ужасного охотника, даже не потерял свой первичный вид спустя тысячелетия. Этот глаз обречен вечно следить за своей добычей... Вам повезло, что его взор не направлен на вас.\n\nВсе <#E5579A> неожиданные атаки <RGB> владельца игнорируют физическую защиту противника и эффекты снижающие урон, а каждые <#E5579A> 13/12/11/10/9/8 ходов <RGB> его следующая атака становится <#E5579A> неожиданной. <RGB>

items.props.purerouge.name=драгоценная пудра
items.props.purerouge.desc=Достаточно лишь один кокетливый взгляд с улыбкой, чтобы красота шести дворцов померкла перед ней.\n\nКогда владелец получает первый урон от противника или совершает неожиданную атаку по противнику на него накладывается эффект очарования и сглаза на 5 ходов. Также существует <#E5579A> 5%% шанс <RGB> замены этих эффектов на постоянную зачарованность. Этот шанс увеличивается на <#E5579A> 7,5%% <RGB> с каждой неудачной попыткой и снижается на 5%% при успехе.\n\nТекущий шанс зачарованности: %s%%.
items.props.purerouge.pure_charm=Необыкновенный аромат пудры очаровал: %s.

items.props.faintglimmer.name=безупречное сияние
items.props.faintglimmer.light=Безупречное сияние излучает чистую энергию, противодействуя %s негативным эффектам. В настоящий момент осталось %s зарядов мерцающей защиты.



### Bad Prop
items.props.brokenbone.name = сломанная кость
items.props.brokenbone.desc = Неизвестные останки какого-то несчастного путешественника. На нижней, обломанной части кости видны отчетливые следы пятен от воды. Что же ему пришлось пережить...\n\nДает владельцу при сражении с монстрами, снижение удачи на <#52B9D8> 30%. <RGB>

items.props.dirt_knifestand.name=грязные ножны
items.props.dirt_knifestand.desc=Интересно, а что же там внутри, мелькает... Ой нет, не стоило этого делать!\n\nОбременяет владельца постепенной потерей здоровья, когда он находится в состоянии <#52B9D8> легкого голода <RGB> (эффект вдвое ниже, чем при сильном голоде), а при <#52B9D8> сильном голоде <RGB> утраивает, теряемое за раз здоровье.

items.props.rustedgoldcoin.name =потускневшая золотая монета
items.props.rustedgoldcoin.desc =Хотя в подземелье все повсеместно используют золотые  монеты, ни одно государство или королевство на самом деле не использует золото в качестве валюты. Хотя неизвестно, из какого материала была сделана монета, но находясь в подземелье она покрылась ржавчиной.\n\nОбременяет своего владельца к потери золотых монет на <#52B9D8> 15%, <RGB> однако получаемая сумма, не может бить меньше 1 монеты.

items.props.confusedmiemietalisman.name = талисман безумной овцы
items.props.confusedmiemietalisman.desc = Возможно, первоначально создатель талисмана задумывал использовать волшебную овцу для своей защиты. Но, судя по всему, он оказался не очень умен в создании оберегов...\n\nКаждые <#52B9D8> 135 ходов <RGB> вызывает вокруг владельца толпу магических овец в радиусе 5x5 (аналогично овечьей ловушке), и после срабатывания перезаряжается 135 ходов. За <#52B9D8> 10 ходов <RGB> до срабатывания издает предупреждающий звук мекающей овцы.
items.props.confusedmiemietalisman.sheep = Ваш талисман внезапно испустил яркий свет...
items.props.confusedmiemietalisman.warning_start=Ваш талисман излучает красное свечение, и вы чувствуете, что вот-вот что-то произойдёт...
items.props.confusedmiemietalisman.warning=Красное свечение талисмана становится все ярче! Вы чувствуете, что через %d ходов произойдет что-то ужасное!

items.props.bottlewraith.name = призрак в бутылке
items.props.bottlewraith.desc =Магическая бутылка, внутри которой заключен мстительный дух, излучающий ауру, притягивающую множество подобных ему сущностей.\n\nПри каждом спуске владельца на новый этаж, случайным образом призывает <#52B9D8> от 1 до (количество этажей / 2) призраков (но не менее 1) <RGB> в различных местах текущего этажа.

items.props.blockingdrug.name=ингибитор
items.props.blockingdrug.desc=Даже безобидное ношение этого пузырька с таблетками ухудшает кровообращение в теле, затрудняя пассивную регенерацию здоровья.\n\nСнижает владельцу естественное восстановление здоровья на <#52B9D8> 20%. <RGB>

items.props.heartofcrystalfractal.name = кошмар кристального сердца
items.props.heartofcrystalfractal.desc = Небеса и земля погрузились во тьму, все живое охвачено безумием, а в ушах слышится зловещий шепот, всюдусущая злоба, исходящая из безграничной дали, ласкает землю, словно играя с любимой игрушкой… Именно такое видение открывается вашему разуму.\n\n Снижает владельцу уклонение на <#52B9D8> 15%. <RGB>


items.props.thegriefofspeechless.name = дневник немого
items.props.thegriefofspeechless.desc = Пожелтевший дневник, наполненный бедами и печалью человека с врожденной немотой.\n\nОбременяет владельца при чтении свитков (кроме свитка улучшения) <#52B9D8> 15% шансом, <RGB> что свиток не подействует.
items.props.thegriefofspeechless.grief = Ваш свиток внезапно вспыхнул ярким светом, а затем сгорел.

items.props.terrordoll.name = жуткая кукла
items.props.terrordoll.desc =Очень жуткая кукла, от которой постоянно не уходит ощущение, будто она все время наблюдает за вами.\n\nОбременяет владельца, снижая точность на <#52B9D8> 75%, <RGB> и активирует у атакующей палочки <#52B9D8> 10% шанс <RGB> не нанести урон.
items.props.terrordollb.name = страшная кукла
items.props.terrordollb.desc =Очень страшная кукла, от которой постоянно не уходит ощущение, будто она все время следит за вами.\n\nЭта кукла выглядит немного иначе...\n\nОбременяет владельца, снижая точность на <#52B9D8> 75%, <RGB> и активирует у атакующей палочки <#52B9D8> 10% шанс <RGB> не нанести урон.
items.props.terrordoll.terror = В вашем сердце внезапно вспыхивает необъяснимый страх.
items.props.cloakfragmentsofbzmdr.name = обрывок плаща
items.props.cloakfragmentsofbzmdr.desc = Когда вы подняли в подземелье, этот клочок черной ткани, он показался вам на удивление знакомым (Bzmdr). Неся его с собой, вы чувствуете, как кто-то за вами наблюдает, заставляя вас постоянно оглядываться по сторонам...\n\nДает в каждом новом регионе владельцу, постоянное снижение на <#52B9D8> 1/3/6/9/15 <RGB> к наносимому урону.
items.props.emotionalaggregationb.name = совокупность обиды
items.props.emotionalaggregationb.desc = Немало путешественников побывало в подземелье, и большинство из них трагически погибли где-то внутри его стен... Их сильная обида перед смертью, через какое-то время слилась воедино, сформировав эту совокупность. Даже просто храня её в рюкзаке, вас не покидает чувство глубокого отчаяния...\n\nДает в каждом новом регионе владельцу, постоянное повышение на <#52B9D8> 1/3/5/7/9 <RGB> к получаемому физическому урону.


items.props.wenstudyingpapertwo.name = рукопись исследования межпространства
items.props.wenstudyingpapertwo.desc = «Кто бы мог предположить... Что пространственные аномалии  внутри подземелья будут настолько непредсказуемы. А те так называемые подземные джунгли - не что иное, как окутанные магией осколки островков, зависшие в межпространственном хаосе. Реальное расположение тюрьмы и пещер здесь совершенно противоположно друг другу. Зачастую мы не спускаемся вниз, а скорее... поднимаемся наверх. После исследования природы здешней магии, мне стало очевидно, что в здешнем подземелье скрыто нечто большее, чем просто вышедшее из-под контроля Кристальное сердце.»\n\nКаждые <#52B9D8> 30 ходов <RGB> накладывает владельцу cглаз на <#52B9D8> 20 ходов. <RGB>
items.props.yanstudyingpaperone.name = рукопись исследования телепортации
items.props.yanstudyingpaperone.lost = Как только вы собрались идти дальше, вы вдруг ощущаете, как ваш рюкзак стал легче...

items.props.noteofbzmdr.name =  заметки путешественника
items.props.noteofbzmdr.desc = Письмена записанные внутри, не принадлежит ни к одной из известных цивилизаций. Что же это за язык?\n\nДальность обзора всех монстров увеличивается на <#52B9D8> 25%, <RGB> и при этом любые их атаки ослабевают источник <#52B9D8> освещения <RGB> владельца. Если нет ни одного источника освещения, монстры наносят на <#52B9D8> 25% <RGB> больше урона владельцу.

items.props.stardust.name = звездная пыль


items.props.brokenring.name = сломанное кольцо
items.props.brokenring.desc = Легенды гласят, что будучи целостным, оно могло пленить любое существо в мире. Но даже в сломанном состоянии, оно по-прежнему способно обременять вас.\n\nКогда уровень здоровья владельца становится равным или ниже <#52B9D8> 60%/40%/20% <RGB> от максимального, он поочередно блокирует слоты для <#52B9D8> артефактов, колец и брони. <RGB> Если уровень здоровья владельца восстанавливается выше до указанного порога, блокировка <#52B9D8> соответствующего слота <RGB> пропадает.
items.props.brokenring.lock =Сломанное кольцо заблокировало слот основного снаряжения, теперь размещенные в нем предметы не дают эффекта.
items.props.brokenring.bound_desc = Этот предмет находится под воздействием сломанного кольца и не может оказать никакого эффекта.
items.props.brokenring.ac_release = Снимите с себя бремя, чтобы освободиться от оков.
items.props.brokenring.released = Оковы сломанного кольца были разрушены.
items.thanks.brokenringartifactbind.cursed=Похоже, его не снять? Возможно, оно проклято...
items.thanks.brokenringarmorbind.cursed=Похоже, его не снять? Возможно, оно проклято...
items.thanks.brokenringmiscbind.cursed=Похоже, его не снять? Возможно, оно проклято...
items.thanks.brokenringringbind.cursed=Похоже, его не снять? Возможно, оно проклято...

items.props.freecrack.name=межпространственные осколки
items.props.freecrack.warning_start=Межпространственные осколки дрожат…
items.props.freecrack.warning=Межпространственные осколки стали искажаться; через <#52B9D8> %d <RGB> ходов они телепортируют вас в другое место!

#### Chaos
items.props.deadoralive.name=решимость смерти
items.props.deadoralive.desc=Смерть находит даже героев: будь то из-за нелепой ошибки или из-за скупости к лечебным зельям, когда жизнь висит на волоске.\n\nУвеличивает <#C42B1C> наносимый и получаемый <RGB> урон владельца на <#C42B1C> +10%. <RGB>

items.props.dreamseed.name=семя грёз
items.props.dreamseed.desc=Я вознес молитву богам, прося светлое будущее.\n\nИ Боги ответили: «Лишь в грёзах можно обрести то что ищешь».\n\nПри первом спуске владельца на новый этаж, создает рядом с лестницей случайным образом <#F1521E> 1 монстра или предмет. <RGB> (Включает экипировку и расходники; исключает уникальные предметы и безделушки; все шансы равны)

items.props.catgirlcosplay.name=косплей костюм кошко-девочки
items.props.catgirlcosplay.desc=_-_ Ты хочешь поиграть со мной? (мяу) Я же тебе говорила, что у меня это плохо получается. (мяу) Если после игры ты скажешь, что я плохо играю, я тебя зарежу! (мяу)\n_-_ Что такое сахарок? (мяу) Думаешь, я сладкий? (мяу) Спасибо, ты тоже очень сладкая! (мяу)\n_-_ Что, у тебя появились другая кошечка! (мяу) Я тебя зарежу! (мяу) Я тебя зарежу! (мяу)\n\nКаждое действие владельца имеет <#E5579A> 3,25% <RGB> шанс издать мяуканье, которое с <#E5579A> 50% <RGB> шансом ослепляет врагов в радиусе 7x7, а всех спящих врагов с <#E5579A> 50% шансом <RGB> пробуждает в этой области, накладывая им адреналин на 1 ход.



items.props.trash.name= мусор (потерявшая силу безделушка)
items.props.trash.trash = Сяое: Похоже, этот вид магии исчерпал себя...

###food
items.food.berry.name=подземельная ягода
items.food.berry.eat_msg=Эта ягода была вкусной!
items.food.berry.desc=Это небольшая ягода, найденная охотницей среди растительности. Ее можно очень быстро съесть, она восполняет небольшое количество сытости, а также может содержать полезное семя!

items.food.blandfruit.name=пустофрукт
items.food.blandfruit.cooked=сваренный пустофрукт
items.food.blandfruit.sunfruit=солнцефрукт
items.food.blandfruit.rotfruit=гнилофрукт
items.food.blandfruit.earthfruit=землефрукт
items.food.blandfruit.blindfruit=бледнофрукт
items.food.blandfruit.firefruit=огнефрукт
items.food.blandfruit.icefruit=хладофрукт
items.food.blandfruit.fadefruit=мыслефрукт
items.food.blandfruit.sorrowfruit=кислофрукт
items.food.blandfruit.stormfruit=грозофрукт
items.food.blandfruit.dreamfruit=магофрукт
items.food.blandfruit.starfruit=звёздофрукт
items.food.blandfruit.swiftfruit=скорофрукт

items.food.blandfruit.halofruit=фосфофрукт
items.food.blandfruit.lightfruit=грозофрукт

items.food.blandfruit.raw=Вы не в силах заставить себя съесть его сырым.
items.food.blandfruit.desc=Не имеет ни вкуса, ни запаха. Может, если его сварить с чем-то ещё, он станет получше?
items.food.blandfruit.desc_cooked=Во время варки в котле этот фрукт разбух и даже впитал в себя некоторые свойства ингредиентов, с которыми был сварен. Он будет обладать свойствами любого зелья, которому соответствовало семя.
items.food.blandfruit.desc_eat=Похоже, теперь его можно есть!
items.food.blandfruit.desc_throw=Похоже, что он может взорваться, если его бросить.
items.food.blandfruit$chunks.name=остатки пустофрукта
items.food.blandfruit$chunks.desc=Пустофрукт лопнул при ударе, развалившись на несколько небольших кусков.\n\nНесмотря на то, что они немного испачканы, они выглядят вполне съедобными.

items.food.chargrilledmeat.name=прожаренное мясо
items.food.chargrilledmeat.desc=Пахнет как неплохой стейк.

items.food.food.name=рацион пищи
items.food.food.ac_eat=СЪЕСТЬ
items.food.food.eat_msg=Эта еда была просто превосходна!
items.food.food.desc=Ничего особенного - вяленое мясо, немного сухариков и всё такое.

items.food.hollow.sugar.name=желейные конфеты
items.food.hollow.sugar.eat_msg=Конфеты сладкие и вкусные, они определенно нравятся юным ведьмочкам!
items.food.hollow.sugar.desc=Эти конфеты очень сладкие, возможно, их тоже любят ведьмочки!
items.food.hollow.sugar.no_love=Ведьмочка все еще кажется неудовлетворенной, возможно, ей нужно больше сладостей, чтобы удовлетворить её аппетит.
items.food.hollow.sugar.love=Ей так понравились ваши сладости, что теперь она будет следовать с вами, чтобы защищать вас!

items.food.hollow.gelatin.name=желатин
items.food.hollow.gelatin.eat_msg=Конфеты сладкие и вкусные, они определенно нравятся юным ведьмочкам!
items.food.hollow.gelatin.desc=Сырье, используемое для производства желейных конфет, которое позволяет готовому продукту придавать форму. \n\nВ крайней необходимости, если вы очень голодны, его можно съесть для снятия усталости, вызванной голодом.

items.food.hollow.sugar_block.name=сахар
items.food.hollow.sugar_block.desc=Сырье, используемое для производства желейных конфет, которое придает готовому продукту сладость и восхитительный вкус. \n\nВ крайней необходимости, если вы очень голодны, его можно съесть для снятия усталости, вызванного голодом.

items.food.hollow.whitesugar_b.name=мальтит
items.food.hollow.whitesugar_b.desc=Сырье, используемое для производства желейных конфет, которое придает готовому продукту жевательную и гладкую текстуру.\n\nВ крайней необходимости, если вы очень голодны, его можно съесть для снятия усталости, вызванного голодом.

items.quest.unlessflower$unlessflowertime.name=божественное вмешательство благословения Юцзи
items.quest.unlessflower$unlessflowertime.desc=Цветочный венок, который она вам вручила, уберег вас от этого смертельного удара; однако, поскольку сама она не принадлежала к этому миру, её вмешательство, спасло вас, нарушив законы этого мира. Ваша жизнь стремительно угасает, растворяясь в сознании этого мира... Быть может, лишь вновь _преодолев жизнь и смерть, вы сумеете по-настоящему обмануть мир и искупить свою вину._.\n\nКаждый ход ваш запас здоровья уменьшается на 1 ОЗ, блокируя ваше восстановление, а все любые негативные эффекты пропадают.\n\nВо время действия эффекта <#FF0000> восстановление здоровья полностью прекращается, а использование лечебных предметов, напротив, приведет к отравлению! <RGB>

items.quest.unlessflower.name=венок бессмертия
items.quest.unlessflower.desc=Похоже, это венок, сплетённый из неведомых цветов и прочных, гибких лиан. Когда его надевают на голову, его вес практически не ощущается.\n\nПри срабатывании восстанавливает все показатели до максимума, снимает все негативные эффекты и накладывает эффект «Божественное вмешательство», которое каждый ход уменьшает запас здоровья на 1 ОЗ, и блокирует его восстановление, снимая постоянно все негативные эффекты. Считается, что он обладает наивысшим уровнем Благословения Юцзи. Эффект пропадает, когда уровень здоровья достигает к 0.

#//High
items.quest.hollow.allsearchiquest$hollowcityprops.name=статуэтка старинного замка
items.quest.hollow.allsearchiquest$hollowcityprops.desc=Эта миниатюрная скульптура, создана по образцу настоящего старинного замка, она настолько детализирована и точна, что позволяет лучше ознакомится с окружающей местности вашего местоположения.

items.quest.hollow.allsearchiquest$hollowgoldcards.name=золотая карта
items.quest.hollow.allsearchiquest$hollowgoldcards.desc=Это скрытая карта, которая, по легенде, встречается одна на десять тысяч, что делает её ярким свидетельством чего-то бесценного и недоступного.

items.quest.hollow.allsearchiquest$hollowlantern.name=светильник джека
items.quest.hollow.allsearchiquest$hollowlantern.desc=Тыквенный фонарь сияющий как драгоценный камень. Внешняя оболочка холодная и гладкая на ощупь, а сам фонарь удивительно легкий. Трудно догадаться, из какого материала он действительно создан.

#//Moddle Price Items
items.quest.hollow.allsearchiquest$crystalheartchoco.name=шоколадное сердечко
items.quest.hollow.allsearchiquest$crystalheartchoco.desc=Съедобный шоколад, изготовленный по точной копии Кристального сердца - его форма хоть и передается, но не его суть.

items.quest.hollow.allsearchiquest$createworldheartmodel.name=форма сердца Бога-Творца
items.quest.hollow.allsearchiquest$createworldheartmodel.desc=Форма, изготовленная по форме сердца Бога-Творца. Люди едят угощение в форме сердца, чтобы символизировать получение благодати Бога-Творца.

items.quest.hollow.allsearchiquest$ghostbluemodel.name=форма печати с синей гравировкой
items.quest.hollow.allsearchiquest$ghostbluemodel.desc=Форма, имитирующая печать с синей гравировкой. Однажды шайка людей попыталась изготовить поддельные печати, чтобы обмануть торговцев, но в итоге потерпела неудачу.\n\nЭтот коллекционный предмет имеет высокую ценность.

items.quest.hollow.allsearchiquest$greendammodel.name=форма полумесяца с нефритом
items.quest.hollow.allsearchiquest$greendammodel.desc=Форма, изображающая изумруд в форме полумесяца. По сравнению с другими формами, лунные пряники в форме полумесяца более популярны среди людей.

items.quest.hollow.allsearchiquest$greenstingmodel.name=минифигурка лесного духа
items.quest.hollow.allsearchiquest$greenstingmodel.desc=Эта фигурка была изготовлена по образу рассказа путешественника, чудом сбежавшего из подземелья. По иронии судьбы, в дальнейшем он сошёл с ума. Хотя фигурка оказалась популярной среди детей, этот инцидент придает ей страшный и жуткий вид.

#//Low Price Items 低价值物品
items.quest.hollow.allsearchiquest$theater_cards.name=билет в театр
items.quest.hollow.allsearchiquest$theater_cards.desc=Таинственный предмет, который неожиданно появляется рядом с определенными людьми; говорят, что никто из тех, кто принял приглашение, так и не вернулся живым...\n\nВ связи с этим Империи Падкого Хлада выпустила уведомление, в котором говорилось, что все пригласительные билеты должны изъяты и отданы в отдел расследований империи.

items.quest.hollow.allsearchiquest$hollow_sugars.name=хэллоуинские конфеты
items.quest.hollow.allsearchiquest$hollow_sugars.desc=Путешественники, возвратившиеся после исследования старинного замка, часто раздают детям такие сладости. Изначально конфеты принадлежали начинающим ведьмочкам, и, скорее всего, они же их и изготовляют.

items.quest.hollow.allsearchiquest$green_prism.name=изумрудная призма
items.quest.hollow.allsearchiquest$green_prism.desc=Зеленый драгоценный камень, выгравированный в форме призмы, наверняка имеет большую ценность в мире смертных.

items.quest.hollow.allsearchiquest$gnoll_wood.name=резной деревянный гнолл
items.quest.hollow.allsearchiquest$gnoll_wood.desc=В свободное время стража в канализации занимались простым творчеством, создавая фигурки гноллов, и в последствии эти работы, стали популярными на самой поверхности...

items.quest.hollow.allsearchiquest$four_kids.name=печать четырех заветов
items.quest.hollow.allsearchiquest$four_kids.desc=Основополагающие принципы трёх великих империй: баланс благосостояния населения, идеологии, дипломатии и религии. При вступлении в должность каждый чиновник получает данную печать, символизируя важность соблюдения этих принципов.\n\nОднако ныне в этом неспокойном мире больше нет места так называемой концепции миролюбивого мировоззрения, что является одной из причин, по которой эти печати были утеряны и разбросаны.

items.food.frozencarpaccio.name=замороженное мясо
items.food.frozencarpaccio.invis=Вы видите, как ваши руки становятся невидимыми!
items.food.frozencarpaccio.hard=Вы чувствуете, что ваша кожа затвердела!
items.food.frozencarpaccio.refresh=Освежающе!
items.food.frozencarpaccio.better=Вы чувствуете себя лучше!
items.food.frozencarpaccio.desc=Это кусок насквозь промороженного мяса. Его можно есть, только нарезая тонкими ломтиками, как карпаччо. Впрочем, так оно получается на вкус даже лучше, чем обычно.
items.food.frozencarpaccio.descx=Это кусок насквозь промороженного мяса, обладает магической силой. Его можно есть, только нарезая тонкими ломтиками, как карпаччо. Впрочем, так оно получается на вкус даже лучше, чем обычно.

items.food.phantommeat.name=призрачное мясо
items.food.phantommeat.desc=Большой и блестящий полупрозрачный стейк, вырезанный из призрачной пираньи. Это волшебное мясо не нуждается в приготовлении и обладает рядом защитных свойств в дополнение большой питательности. Одного кусочка хватит, чтобы полностью насытить вас, затянуть раны и излечить от вредных эффектов. Кроме того, мясо сделает вас невидимым и наложит эффект дубовой кожи.

items.food.meatpie.name=мясной пирог
items.food.meatpie.eat_msg=Это было чертовски вкусно!
items.food.meatpie.eat_msg_1=+1 сила
items.food.meatpie.eat_msg_2=По вашему телу распространяется новоприобретённая сила.

items.food.meatpie.eat_msg_4=Примечание: на этажах боссов дается только основной бонус от мясного пирога.

items.food.meatpie.eat_msg_3=Получаемая сила от пирога, достигла предела, текущий максимальный предел получения силы на этом этаже: %d.

items.food.meatpie.desc=Аппетитный пирог, полный вкусного мяса. Такое лакомство способно насытить куда лучше любой другой пищи.
items.food.meatpie.descx=Аппетитный пирог, полный вкусного мяса, которое похоже, содержит в себе огромную силу. Такое лакомство насытить куда лучше любой другой пищи.\n\nПри каждом употреблении существует _%s%%_  шанс навсегда получить _+1 к силе_, но этот шанс будет постепенно снижаться по мере увеличения вашей силы.\n\nВ каждом регионе существует ограничение на количество получаемой силы.\n\nТекущий предел силы: _%s/%s_.

items.food.mysterymeat.name=загадочное мясо
items.food.mysterymeat.eat_msg=Эта еда была какой-то странной на вкус.
items.food.mysterymeat.hot=Ой! Горячо!
items.food.mysterymeat.legs=Вы не чувствуете своих ног!
items.food.mysterymeat.not_well=Вы чувствуете себя не очень хорошо.
items.food.mysterymeat.stuffed=Вы наелись.
items.food.mysterymeat.desc=Ешьте на свой страх и риск!
items.food.mysterymeat$placeholder.name=мясо

items.food.pasty.pasty=пирог
items.food.pasty.pie=тыквенный пирог
items.food.pasty.cane=новогодний леденец
items.food.pasty.pasty_desc=Настоящий корнуэльский пирог с начинкой из говядины и картофеля. Восхитительно!
items.food.pasty.pie_desc=Здоровенный кусок тыквенного пирога! Его сладкий и пряный вкус способен не только полностью утолить голод, но и восстановить немного здоровья.\n\nСчастливого Дня Всех Святых!
items.food.pasty.cane_desc=Огромная сладкая карамельная трость! Она достаточно большая для того, чтобы полностью утолить голод, а избыток сахара может ещё и добавить энергии для ваших волшебных палочек.\n\nС праздником!

items.food.smallration.name=урезанный рацион
items.food.smallration.eat_msg=На вкус так себе.
items.food.smallration.desc=Он выглядит как обычный рацион, но поменьше.
items.food.smallration.descx=Он выглядит иначе, чем обычный рацион, но побольше.

items.food.smallration$blackmoon.name=маленький лунный пирог
items.food.smallration$blackmoon.desc=Этот маленький лунный пирог, похоже, настолько плохо выпекли, что даже одна сторона обуглилась, а на самом тесте криво написаны несколько слов, которые невозможно разобрать. \n\nДаже не понятно, что в нем внутри...\n\nНачинка чем-то напоминает затвердевшее карри и пахнет немного странно, но вполне, должен быть съедобным.
items.food.smallration$blackmoon.eat_msg=Удивительно, начинка по вкусу напоминает печеный картофель и весьма вкусная.

items.food.stewedmeat.name=тушёное мясо
items.food.stewedmeat.eat_msg=На вкус так себе.
items.food.stewedmeat.desc=Тушёное мясо очищено от любой инфекции и паразитов. Его можно спокойно есть.


##journal items
items.journal.documentpage.name=вырванная страница
items.journal.documentpage.desc=Эту страницу, кажется, вырвали из какой-то книги. Чтобы разобрать, что на ней написано, придётся её подобрать.

items.journal.alchemypage.name=вырванная страница учебника алхимии
items.journal.alchemypage.desc=Вырванная страница из учебника алхимии.\n\nБольшая часть текста слишком мелкая, чтобы прочесть её издалека, но можно вполне разглядеть заголовок:\n\n_"%s"_

items.journal.guidebook.name=альманах путешественника
items.journal.guidebook.hint=В вашем путеводителе есть советы для вас!
items.journal.guidebook.desc=Путеводитель путешественника, забытый тут кем-то, кто решил, что приключения - не его удел. Эта конкретная книга - магическая, она может обратить внимание путешественника на определенную страницу в нужное время.\n\nКнига крайне популярна не только лишь из-за её содержания, но и из-за красиво выведенной надписи "Не паникуй!" на обложке.

items.journal.guidepage.name=вырванная страница справочника
items.journal.guidepage.desc=Вырванная страница из справочника путешественника.\n\nБольшая часть текста слишком мелкая, чтобы прочесть её издалека, но можно вполне разглядеть заголовок:\n\n_"%s"_


###keys

items.keys.key.locksword=Вы чувствуете, как ключ-меч становится еще могущественнее когда поглощает оставшуюся магию ключа.

items.keys.goldenkey.name=золотой ключ
items.keys.goldenkey.desc=У этого ключа очень маленькая и изящная бородка. Возможно, это ключ от какого-то сундука?

items.keys.crystalkey.name=Хрустальный ключ
items.keys.crystalkey.desc=Вырезанные из цельного куска хрусталя, изгибы этого ключа мерцают в темноте. Может, он откроет что-то сделанное из хрусталя?

items.keys.ironkey.name=железный ключ
items.keys.ironkey.desc=Бородка этого ключа уже изношена, а кожаный ремешок очень старый. Интересно, какую дверь им можно открыть?

items.keys.skeletonkey.name=ключ-скелет
items.keys.skeletonkey.desc=Этот ключ выглядит весьма внушительно - его навершие сделано в форме черепа. Возможно, им можно открыть столь же внушительную дверь.



###potions
###potions
items.potions.potion.ac_drink=ВЫПИТЬ
items.potions.potion.turquoise=бирюзовое зелье
items.potions.potion.crimson=багряное зелье
items.potions.potion.azure=лазурное зелье
items.potions.potion.jade=зелёное зелье
items.potions.potion.golden=золотистое зелье
items.potions.potion.magenta=пурпурное зелье
items.potions.potion.charcoal=серое зелье
items.potions.potion.ivory=белёсое зелье
items.potions.potion.skyblue=лазурное зелье
items.potions.potion.deepyellow=жёлтое зелье
items.potions.potion.amber=янтарное зелье
items.potions.potion.bistre=коричневое зелье
items.potions.potion.indigo=фиолетовое зелье
items.potions.potion.silver=серебристое зелье
items.potions.potion.unknown_desc=Этот пузырёк содержит какое-то зелье. Интересно, что будет, если его выпить или разбить?
items.potions.potion.harmful=Вредное зелье!
items.potions.potion.beneficial=Полезное зелье
items.potions.potion.yes=Да, все правильно
items.potions.potion.no=Нет, я передумал
items.potions.potion.sure_drink=Вы уверены, что хотите выпить это зелье? Возможно, стоит кинуть им в кого-нибудь другого.
items.potions.potion.sure_throw=Вы уверены, что хотите бросить это зелье? Возможно, его лучше выпить.
items.potions.potion.shatter=Бутыль разлетается на мелкие осколки, а её содержимое безо всякого эффекта растекается по полу.
items.potions.potion$placeholder.name=зелье
items.potions.potion$seedtopotion.name=Случайное Зелье

items.potions.alchemicalcatalyst.name=алхимический катализатор
items.potions.alchemicalcatalyst.desc=Магическая жидкость в этом тонком сосуде сделана из очищенной эссенции зелья. Она прозрачна и переливается всеми цветами радуги. \n\nЭтот катализатор в основном используется как алхимический ингредиент, но если его выпить или бросить, то он сработает как случайное зелье.

items.potions.potionofexperience.name=зелье Опыта
items.potions.potionofexperience.desc=Это зелье содержит концентрированный опыт множества сражений. Если его выпить, ваш уровень будет немедленно повышен.
items.potions.potionofexperience.descx=Это зелье содержит концентрированную злобу множества сражений. Если его выпить, ваша жизненная энергия будет высосана на некоторое время.

items.potions.potionoffrost.name=зелье Холода
items.potions.potionoffrost.desc=При контакте с воздухом этот химикат мгновенно испаряется, замораживая всех, кто попал в облако его паров.

items.potions.potionofhaste.name=зелье Ускорения
items.potions.potionofhaste.namex=зелье Замедления
items.potions.potionofhaste.energetic=Вы чувствуете прилив энергии!
items.potions.potionofhaste.energy_speed=Вы чувствуете, как из вас вытягивается энергия!
items.potions.potionofhaste.desc=Глоток этой удивительно сладкой жидкости наполнит вас огромной энергией, ненадолго позволив перемещаться гораздо быстрее.
items.potions.potionofhaste.descx=Глоток этой жутко горькой жидкости наполнит вас огромными колючками, ненадолго покалечив ваше тело.\n\nЕсли на текущем этаже есть красный часовой, он будет действовать намного быстрее.

items.potions.potionofhealing.name=зелье Исцеления
items.potions.potionofhealing.heal=Ваши раны начинают заживать.
items.potions.potionofhealing.desc=Этот эликсир стремительно заживляет любые раны и моментально исцеляет многие недуги.

items.potions.potionofinvisibility.name=зелье Невидимости
items.potions.potionofinvisibility.namex=зелье Провокации
items.potions.potionofinvisibility.invisible=Вы видите, как ваши руки становятся невидимыми!
items.potions.potionofinvisibility.descx=Выпив это зелье, вы не сможете стать невидимы для противников. Но от вкуса зелья заревете, привлекая внимание врагов.
items.potions.potionofinvisibility.desc=Выпив это зелье, вы станете совершенно невидимы для противников на какое-то время. Впрочем, если вы попробуете кого-то атаковать или использовать палочку или свиток на глазах у противника, невидимость рассеется.

items.potions.potionoflevitation.name=зелье Левитации
items.potions.potionoflevitation.float=Вы взмываете в воздух!
items.potions.potionoflevitation.desc=Если выпить этот занятный состав, то некоторое время вы будете парить в воздухе и сможете пересечь пропасть или перелететь через ловушку.\n\nЕсли бросить это зелье, оно создаст облако неочищенного газа, дезориентирующего любого, кто в него попадёт.

items.potions.potionofliquidflame.name=зелье Алхимического огня
items.potions.potionofliquidflame.desc=Этот сосуд содержит нестабильный реактив, который при малейшем контакте с воздухом резко загорается, поджигая всё вокруг.

items.potions.potionofmindvision.name=зелье Ментального зрения
items.potions.potionofmindvision.namex=зелье Ментальной слепоты
items.potions.potionofmindvision.see_mobs=Вы каким-то образом можете чувствовать присутствие других существ!
items.potions.potionofmindvision.see_none=Вы каким-то образом понимаете, что на этом уровне подземелья нет никого, кроме вас.
items.potions.potionofmindvision.desc=Глоток этого зелья помогает настроить ваш разум на психические частоты других существ, позволяя вам определять местоположение других существ сквозь любые препятствия.\n\nТакже в этом состоянии вы можете видеть сквозь ближайшие стены и двери.
items.potions.potionofmindvision.descx=Глоток этого зелья помешает настроить ваш разум на психические частоты других существ, не позволяя вам определять местоположение других существ сквозь любые препятствия.
items.potions.potionofmindvision.no_eye=Вы не можете почувствовать присутствие других существ!
items.potions.potionofmindvision.can't_see_mobs=Вы не можете почувствовать присутствие других существ!
items.potions.potionofmindvision.can't_see_none=Вы не можете определить, кто находится прямо сейчас на этом уровне.


items.potions.potionofparalyticgas.name=зелье Парализующего газа
items.potions.potionofparalyticgas.desc=При контакте с открытым воздухом жидкость в этой бутыли испарится, превращаясь в обездвиживающий жёлтый газ. Любой, кто вдохнёт его, будет мгновенно парализован, теряя возможность сопротивляться до тех пор, пока облако не развеется.\n\nЭто зелье лучше кидать во врагов, находящихся на расстоянии.

items.potions.potionofpurity.name=зелье Очищения
items.potions.potionofpurity.freshness=Вы чувствуете, что на вас неожиданно пахнуло свежим воздухом.
items.potions.potionofpurity.protected=Некое подобие защитной пленки обволакивает вас!
items.potions.potionofpurity.desc=Этот магический реагент способен моментально нейтрализовать все вредоносные газы в большой зоне. Выпив его, вы получите временный иммунитет к газам любого рода.

items.potions.potionofstrength.name=зелье Силы
items.potions.potionofstrength.namex=зелье Слабости
items.potions.potionofstrength.msg_1=+1 сила
items.potions.potionofstrength.msg_2=По вашему телу распространяется новоприобретённая сила.
items.potions.potionofstrength.esg_1=-1 сила, +3 точности
items.potions.potionofstrength.esg_2=Едкая жидкость проникает в ваши мышцы, делая их слабее, но при этом более энергичными...
items.potions.potionofstrength.desc=Это редкое зелье влияет на мускулатуру всего вашего тела, навсегда увеличивая вашу силу на единицу.
items.potions.potionofstrength.descx=Это редкое зелье влияет на мускулатуру всего вашего тела, навсегда уменьшая вашу силу на единицу. Однако вы можете тренировать свое тело от токсичности, навсегда увеличивая вашу точность на три единицы.

items.potions.potionoftoxicgas.name=зелье Токсического газа
items.potions.potionoftoxicgas.desc=Разбивание или раскупоривание этого герметичного флакона заставит его содержимое взорваться смертоносным облаком отравляющего газа. Возможно, лучше бросить это зелье в кого-то, находящегося на расстоянии, а не открывать его самому.

items.potions.brews.unstablebrew.name=нестабильный экстракт
items.potions.brews.unstablebrew.desc=Этот волшебный напиток переливается цветами радуги.\n\nКогда его выпьют или бросят, он активирует эффект случайного зелья. Эффект зелья, скорее всего, будет соответствовать эффекту экстракта.



###brews
items.potions.brews.aquabrew.name=экстракт Водянистости
items.potions.brews.aquabrew.desc=Если его разбить, то этот экстракт высвободит водный всплеск в точке приземления. Оно достаточно мощное, чтобы нанести урон огненным существам, но оно также затопит местность вокруг, потушит пламя и откинет врагов, которые оказались рядом со всплеском.
items.potions.brews.aquabrew.salt=Если цель находится на грязи, первоначальный эффект не подействует на это место, но заставит воду испариться по всей местности в радиусе 3x3 и превратит все клетки в обычные, а также на некоторое время воспламеняет свое окружение.

items.potions.brews.causticbrew.name=экстракт Едкой слизи
items.potions.brews.causticbrew.desc=Если разбить этот экстракт, то он покроет всех вокруг чрезвычайно едкой кислотой. Кислота будет наносить урон всем, кто попадёт под неё, пока её не смоют водой.

items.potions.brews.blizzardbrew.name=экстракт Снежного вихря
items.potions.brews.blizzardbrew.desc=Если его разбить, то этот экстракт выпустит на свободу вихрь замораживающей пурги, который будет быстро распространяться подобно газам.

items.potions.brews.infernalbrew.name=экстракт Адского пламени
items.potions.brews.infernalbrew.desc=Если его разбить, то этот экстракт выпустит на свободу бушующее адское пламя, которое будет быстро распространяться подобно газам.

items.potions.brews.shockingbrew.name=экстракт Грозового облака
items.potions.brews.shockingbrew.desc=Если его разбить, то этот экстракт выпустит на свободу электрический шторм на большом пространстве вокруг того места, где был разбит экстракт.



###elixirs
items.potions.elixirs.elixirofarcanearmor.name=эликсир Мистической брони
items.potions.elixirs.elixirofarcanearmor.desc=Данный эликсир дарует выпившему длительное сопротивление магическому урону.

items.potions.elixirs.elixirofaquaticrejuvenation.name=эликсир Водной регенерации
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Этот эликсир содержит в себе остатки Слизня, смешанные с лечебным зельем. Вместо моментального исцеления он дарует выпившему его способность восстанавливать здоровье при соприкосновении с водой.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=водная регенерация
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Вы временно получили способности Слизня к регенерации.\n\nНаходясь в воде, вы восстанавливаете небольшое количество здоровья каждый ход. Эффект приостанавливается, когда у вас полное здоровье или вы находитесь вне воды.\n\nЛечения осталось: %d.

items.potions.elixirs.elixirofdragonsblood.name=эликсир Крови дракона
items.potions.elixirs.elixirofdragonsblood.desc=Будучи выпитым, эликсир наделит героя силой огня, протекающей по его венам. Этот эффект подарит ему иммунитет к огню и позволит поджигать врагов своими ударами.

items.potions.elixirs.elixiroffeatherfall.name=эликсир Антигравитации
items.potions.elixirs.elixiroffeatherfall.light=Вы чувствуете себя легким, как пёрышко!
items.potions.elixirs.elixiroffeatherfall.desc=Этот эликсир дарует частичный контроль над гравитацией, позволяя выпившему его падать в пропасти без риска для здоровья. Времени действия эликсира хватает только на одно применение.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=антигравитация
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Вы под эффектом эликсира Антигравитации, который позволяет вам падать в пропасти и не получить урон! Эффект пропадет, когда оно будет использовано, или по истечению времени.\n\nОсталось ходов: %s.


items.potions.elixirs.elixirofhoneyedhealing.name=эликсир Медового исцеления
items.potions.elixirs.elixirofhoneyedhealing.desc=Этот эликсир не только исцеляет раны, но ещё и очень сладкий! Он немного утоляет голод, если его выпить. Но можно и бросить его в союзника, чтобы вылечить его раны.\n\nС помощью этого эликсира можно укротить тех существ, которые любят мёд.

items.potions.elixirs.elixiroficytouch.name=эликсир Ледяного касания
items.potions.elixirs.elixiroficytouch.desc=Тот, кто выпьет такой эликсир, сможет высасывать тепло из врагов одним своим прикосновением. Это даст полный иммунитет к холоду, а также позволит накладывать окоченение своими физическими атаками.

items.potions.elixirs.elixirofmight.name=эликсир Могущества
items.potions.elixirs.elixirofmight.msg_1=+1 сила, +%d ОЗ
items.potions.elixirs.elixirofmight.msg_2=По вашему телу распространяется новоприобретённая сила.
items.potions.elixirs.elixirofmight.desc=Это мощное зелье растечётся по вашим мышцам, навсегда увеличив вашу силу на одно очко и здоровье на %d очков. Бонус к здоровью зависит зависит от вашего максимального здоровья, но при получении уровней будет постепенно спадать.
items.potions.elixirs.elixirofmight$htboost.name=увеличение запаса здоровья
items.potions.elixirs.elixirofmight$htboost.desc=Вы чувствуете непривычную силу и живучесть.\n\nВаше максимальное здоровье увеличено на долгое время. Когда вы получаете уровни, этот бонус будет понемногу снижаться.\n\nУвеличение жизни на данный момент: %d.\nУровней осталось: %d.
items.potions.elixirs.elixirofmight.msg=По вашему телу распространяется новоприобретённая сила, теперь у вас %d силы!



items.potions.elixirs.elixiroftoxicessence.name=эликсир Зловония
items.potions.elixirs.elixiroftoxicessence.desc=Этот эликсир дарует выпившему токсическую силу. Испивший будет источать токсичный газ, а так же будет невосприимчив к отравлению и токсичному газу даже чуть дольше, чем длится эффект.

###exotic potions
items.potions.exotic.exoticpotion.turquoise=особое бирюзовое зелье
items.potions.exotic.exoticpotion.crimson=особое багряное зелье
items.potions.exotic.exoticpotion.azure=особое лазурное зелье
items.potions.exotic.exoticpotion.jade=особое зелёное зелье
items.potions.exotic.exoticpotion.golden=особое золотистое зелье
items.potions.exotic.exoticpotion.magenta=особое пурпурное зелье
items.potions.exotic.exoticpotion.charcoal=особое серое зелье
items.potions.exotic.exoticpotion.ivory=особое белёсое зелье
items.potions.exotic.exoticpotion.amber=особое янтарное зелье
items.potions.exotic.exoticpotion.bistre=особое коричневое зелье
items.potions.exotic.exoticpotion.indigo=особое фиолетовое зелье
items.potions.exotic.exoticpotion.silver=особое серебристое зелье
items.potions.exotic.exoticpotion.unknown_desc=Этот округлый пузырёк содержит странную разноцветную жидкость, совсем не похожую на обычные зелья. Интересно, что будет, если его выпить или разбить?
items.potions.exotic.exoticpotion.warning=Вы действительно хотите отменить использование этого зелья? Оно все равно будет истрачено.
items.potions.exotic.exoticpotion.yes=Да, я уверен
items.potions.exotic.exoticpotion.no=Нет, я передумал

items.potions.exotic.potionofcleansing.name=зелье Избавления
items.potions.exotic.potionofcleansing.desc=Этот мощный реагент способен полностью нейтрализовать любые вредные воздействия. Его можно применять как внутрь, так и просто в кого-нибудь бросить.
items.potions.exotic.potionofcleansing$cleanse.name=очищенные
items.potions.exotic.potionofcleansing$cleanse.desc=Этот персонаж имеет временный иммунитет против любых вредных эффектов!\n\nХодов осталось: %s.

items.potions.exotic.potionofcorrosivegas.name=зелье Коррозийного газа
items.potions.exotic.potionofcorrosivegas.desc=Бросок или откупоривание этой находящейся под давлением бутыли спровоцирует формирование из содержимого облака едкого газа цвета ржавчины. Его концентрация, однако, будет невысока и облако не слишком долго продержится.

items.potions.exotic.potionofdragonsbreath.name=зелье Драконьего дыхания
items.potions.exotic.potionofdragonsbreath.prompt=Выберите цель
items.potions.exotic.potionofdragonsbreath.desc=Этот пузырёк содержит необычный реактив, который мгновенно воспламеняется при смешении со слюной. Вовремя выплюнув жидкость, вы сможете выпускать пламя изо рта!

items.potions.exotic.potionofearthenarmor.name=зелье Природной брони
items.potions.exotic.potionofearthenarmor.desc=Вместо того, чтобы парализовать, эта жидкость заставляет кожу затвердеть, что временно наделит вас природной бронёй.

items.potions.exotic.potionofdivineinspiration.name=зелье Небесного вдохновения
items.potions.exotic.potionofdivineinspiration.no_more_points=Вы не можете получить больше бонусных очков таланта.
items.potions.exotic.potionofdivineinspiration.select_tier=Выберите уровень талантов к которому будут добавлены два очка. Уровень должен быть открытым.
items.potions.exotic.potionofdivineinspiration.bonus=+2 очка талантов!
items.potions.exotic.potionofdivineinspiration.desc=Будучи святой энергией в жидкой форме, это зелье наделит выпившего двумя дополнительным очками талантов того уровня, который он выберет.\n\nЭто зелье может быть использовано единожды для каждого уровня талантов.

items.potions.exotic.potionofmagicalsight.name=зелье Волшебного взора
items.potions.exotic.potionofmagicalsight.desc=После того, как вы это выпьете, ваши чувства ненадолго обострятся до невероятного уровня, увеличивая дальность обзора и позволяя видеть сквозь стены!

items.potions.exotic.potionofmastery.name=зелье Мастерства
items.potions.exotic.potionofmastery.prompt=Освоить предмет
items.potions.exotic.potionofmastery.weapon_easier=Вашим оружием стало проще пользоваться!
items.potions.exotic.potionofmastery.armor_easier=Ваша броня становится легче!
items.potions.exotic.potionofmastery.desc=Вместо того, чтобы увеличивать силу, это зелье настраивает мышцы на определенный предмет. Это упростит использование этого предмета, как если бы пьющий практиковался с ним и развил мышечную память.\n\nДля использования выбранного оружия или доспехов потребуется на 2 единицы силы меньше. Это зелье можно использовать только один раз для каждого предмета.

items.potions.exotic.potionofshielding.name=зелье Защиты
items.potions.exotic.potionofshielding.desc=Вместо того, чтобы исцелять, это зелье создаёт волшебный барьер вокруг выпившего. Этот барьер может поглотить значительное количество повреждений.

items.potions.exotic.potionofshroudingfog.name=зелье Густого тумана
items.potions.exotic.potionofshroudingfog.desc=При контакте с воздухом жидкость в этом пузырьке превратится в густой клубящийся туман, полностью блокирующий обзор.

items.potions.exotic.potionofsnapfreeze.name=зелье Заморозки
items.potions.exotic.potionofsnapfreeze.desc=Химикаты в этом зелье моментально реагируют с воздухом, мгновенно замораживая и обездвиживая всех вокруг.

items.potions.exotic.potionofstamina.name=зелье Выносливости
items.potions.exotic.potionofstamina.desc=Глоток этой странно сладковатой жидкости дарует длительный прилив энергии, надолго увеличивая скорость перемещения.

items.potions.exotic.potionofstormclouds.name=зелье Грозовых туч
items.potions.exotic.potionofstormclouds.desc=Если бросить это зелье, оно образует быстро распространяющееся облако концентрированного пара, конденсат которого опустится на окрестности. Большая часть местности будет затоплена, огненные существа получат урон, пламя потушится, а ловушки выйдут из строя и сломаются.



###quest items
items.quest.ceremonialcandle.name=ритуальная свеча
items.quest.ceremonialcandle.desc=Несколько свеч, слепившихся в одну из-за использования.\n\nСами по себе они бесполезны, но если использовать их в определенной последовательности, они способны сконцентрировать энергию, необходимую для ритуала призыва.

items.quest.corpsedust.name=прах мертвеца
items.quest.corpsedust.chill=Холодок пробегает по вашей спине.
items.quest.corpsedust.desc=Эта кучка праха не сильно отличается от любой другой в этом подземелье, но вы чувствуете таящуюся в ней темную энергию.\n\nПожалуй, лучше от неё избавиться, да как можно скорее.

items.quest.darkgold.name=руда тёмного золота
items.quest.darkgold.you_now_have=Теперь у вас есть %d руды тёмного золота.
items.quest.darkgold.desc=Этот металл называется темным не из-за его цвета (который не отличается от обычного золота), а из-за того, что при воздействии солнечного света он плавится.\n\nДумаю, не стоит говорить, что темное золото не очень-то ценится городскими жителями.

items.quest.dwarftoken.name=дворфский жетон
items.quest.dwarftoken.desc=По неизвестным причинам многие дворфы и некоторые из их творений носят с собой эти маленькие кусочки металла. Может быть, это какие-то украшения или опознавательные символы... Кто их поймет, этих бородатых.

items.quest.embers.name=пепел элементаля
items.quest.embers.desc=Особый вид пепла, который можно получить только с молодых огненных элементалей. Даже сейчас он излучает тепло.

items.quest.gooblob.name=сгусток слизи
items.quest.gooblob.desc=Желеобразный комочек, оставшийся после Слизня. Похоже на большой желейный шарик, но вы бы не рискнули попробовать его на вкус.\n\nСам по себе он бесполезен, но может проявить свои свойства в комбинации с зельем или бомбой. В крайнем случае, его можно просто продать или конвертировать в энергетические кристаллы.

items.quest.metalshard.name=проклятый осколок
items.quest.metalshard.desc=Ржавый осколок проклятого металла - это всё, что осталось от DM-300. Вы чувствуете в нём скрытую тёмную магию.\n\nСам по себе он бесполезен, но может проявить свои свойства в сочетании с бомбой или свитком. В крайнем случае, его можно просто продать или конвертировать в энергетические кристаллы.

items.quest.pickaxe.name=кирка
items.quest.pickaxe.ac_mine=ДОБЫТЬ
items.quest.pickaxe.no_vein=Рядом нет жил тёмного золота.
items.quest.pickaxe.ability_name=пробить
items.quest.pickaxe.ability_desc=Дуэлянт может _пробить_ врага киркой. Это гарантирует попадание, добавляет уязвимость на 3 хода и наносит в 2 раза больше урона врагам с жёсткой кожей.
items.quest.pickaxe.desc=Это прочный и тяжелый инструмент для дробления камней. Вам не нужно экипировать кирку, чтобы добывать при помощи неё, а в крайнем случае её можно использовать как оружие.


items.quest.ratskull.name=череп гигантской крысы
items.quest.ratskull.desc=Удивительно огромный крысиный череп. Из него вышел бы неплохой трофей, если бы вам было куда его вешать.



###rings
items.rings.ring.garnet=кольцо с гранатом
items.rings.ring.ruby=кольцо с рубином
items.rings.ring.topaz=кольцо с топазом
items.rings.ring.emerald=кольцо с изумрудом

items.rings.ring.onyx=кольцо с ониксом
items.rings.ring.opal=кольцо с опалом
items.rings.ring.tourmaline=кольцо с турмалином
items.rings.ring.sapphire=кольцо с сапфиром

