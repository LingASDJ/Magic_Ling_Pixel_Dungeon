items.weapon.melee.voidsword.ability_name=奇点坍缩
items.weapon.melee.voidsword.ability_desc=艾诺琳娜可以用虚空剑释放_奇点坍缩_技能。这一武技在指定位置放置_1个奇点_，奇点会持续定身_%1$s范围_内的敌人，并且每回合会使范围内的所有敌人和物品向奇点方向_强制位移一格_。奇点每回合都会摧毁与他相邻或重叠的物品，接触奇点的非boss单位会直接死亡，boss单位会受到_%2$d的真实伤害_随后摧毁奇点。\n\n需要消耗<#F00>全部武技充能（至少需要3点）<RGB>，奇点至多持续%3$d回合。
items.weapon.melee.voidsword.typical_ability_desc=艾诺琳娜可以用虚空剑释放_奇点坍缩_技能。这一武技在指定位置放置_1个奇点_，奇点会持续定身_%1$s范围_内的敌人，并且每回合会使范围内的所有敌人和物品向奇点方向_强制位移一格_。奇点每回合都会摧毁与他相邻或重叠的物品，接触奇点的非boss单位会直接死亡，boss单位会受到_%2$d的真实伤害_随后摧毁奇点。\n\n需要消耗<#F00>全部武技充能（至少需要3点）<RGB>，奇点至多持续%3$d回合。

