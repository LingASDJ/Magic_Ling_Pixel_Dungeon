# 迅捷剑 QuickSword mssages
items.weapon.melee.spdtomlpd.quicksword.name=рапира
items.weapon.melee.spdtomlpd.quicksword.desc=Этот клинок такой лёгкий, что выскакивает из ножен, как ветер.\n\n«Помедленнее? Что за шутки! В мире боевых искусств скорость определяет всё!»
items.weapon.melee.spdtomlpd.quicksword.stats_desc=За каждые 3%% увеличения вашей скорости передвижения урон этого оружия возрастает на 1%%, текущее увеличение урона: _%1$s_ (максимум: _%2$s_).
items.weapon.melee.spdtomlpd.quicksword.ability_name=стремительный удар
items.weapon.melee.spdtomlpd.quicksword.typical_ability_desc=Дуэлянт может совершить _стремительный удар_ рапирой. Эта атака не тратит ход по врагу, расходуя _2 заряда_. Эту способность _нельзя применять несколько раз подряд_.
items.weapon.melee.spdtomlpd.quicksword.ability_desc=Дуэлянт может совершить _стремительный удар_ рапирой. Эта атака не тратит ход по врагу, расходуя _2 заряда_. Эту способность _нельзя применять несколько раз подряд_.
items.weapon.melee.spdtomlpd.quicksword.ability_chain_limit=Стремительный удар нельзя применять несколько раз подряд!
items.weapon.melee.spdtomlpd.quicksword.dev_desc=Максимальное увеличение (уровень оружия +1)×50%.

# 诅咒之刃 CursedBlade messages
items.weapon.melee.spdtomlpd.cursedblade.name=проклятый клинок
items.weapon.melee.spdtomlpd.cursedblade.desc=Клинок, скованный зловещим проклятием. Это смертоносное оружие, жаждет плату плотью и кровью в обмен на могущество, увеличивая в равной степени наносимый и получаемый владельцем урон.
items.weapon.melee.spdtomlpd.cursedblade.stats_desc=Текущий множитель проклятия: %d.
items.weapon.melee.spdtomlpd.cursedblade.ability_name=подавление клинка
items.weapon.melee.spdtomlpd.cursedblade.typical_ability_desc=Дуэлянт может _подавить_ проклятый клинок. Эта способность временно подавляет действие проклятия на _20 ходов_. Повторное применение этой способности прерывает подавление (без расхода заряда).
items.weapon.melee.spdtomlpd.cursedblade.ability_desc=Дуэлянт может _подавить_ проклятый клинок. Эта способность временно подавляет действие проклятия на _20 ходов_. Повторное применение этой способности прерывает подавление (без расхода заряда).
items.weapon.melee.spdtomlpd.cursedblade$cursedsword.name=подавление клинка
items.weapon.melee.spdtomlpd.cursedblade$cursedsword.desc=Зловещая магия временно подавлена, и эффект усиления урона в обе стороны, оказываемый проклятым клинком, пока не действует.\n\nХодов осталось: %s.
items.weapon.melee.spdtomlpd.cursedblade.dev_desc=(Удваивается каждые 5 уровней, максимум до 65536)

# 弑君 KillKing messages
items.weapon.melee.spdtomlpd.killking.name=цареубийца
items.weapon.melee.spdtomlpd.killking.desc=Оно всегда возвращается в руки того, кому по праву принадлежит.
items.weapon.melee.spdtomlpd.killking.stats_desc=Скрытные атаки меняют наносимый урон на %1$d-%2$d. \nПревращение не заменяет его на другое оружие, а повышает его уровень редкости на +1.
items.weapon.melee.spdtomlpd.killking.transmute_upgraded=Уровень редкости цареубийцы возвысился!
items.weapon.melee.spdtomlpd.killking.ability_name=дымовая засада

# 尖刺轮盘 SpikedChakram messages
items.weapon.melee.spdtomlpd.spikedchakram.name=шипастое колесо
