items.artifacts.electricalsmoke.desc = Даже в этом месте, кто-то не может избавится от вредной привычки...\n\nВы чувствуете, что он хочет овладеть силой экстракта грозового облака и свитка перезарядки.
items.artifacts.electricalsmoke.prompt = Выберите зелье
items.artifacts.electricalsmoke.withpotiona = Магическая сила, заключенная в этом артефакте, в настоящий момент содержит эффект: 
items.artifacts.electricalsmoke.withpotionb = Таким образом, его дым не только затуманивает зрение, но и содержит свойства вышеперечисленных зелий.
items.artifacts.electricalsmoke.withpotionc =  (Урон от коррозии не увеличивается)
