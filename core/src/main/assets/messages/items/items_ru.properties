items.books.bookslist.deepbloodbooks.anmazing=Разгадав тайну книги, вы познали силу враждебности!

items.books.bookslist.grasskingbooks.name=книга «Кодекс Священных джунглей»
items.books.bookslist.grasskingbooks.desc=1. В случае стихийного бедствия или техногенной катастрофы, ненужно паниковать. У нас достаточно сил, чтобы защитить вас.\n\n2. Просим всех жителей, держатся подальше в лесу от цветочного сада, который является залом совещаний поверхностных властителей высшего совета.\n\n...5. Пожалуйста, приводите своих новорожденных детей к цветочному источнику для крещения, чтобы они смогли обрести магическую силу.\n\n...7. Чужестранцы, путешественники или переселенцы, пожалуйста не вмешивайтесь во то, что кажется вам унизительным, высокомерным, бездушным, безжалостным, эгоистичным и неравноправным, все, что здесь происходит, естественно, не пытайтесь что-то изменить и чтите наш образ жизни.\n\n8. Другие правила будут добавлены на тринадцатом собрании высшего совета.
items.books.bookslist.grasskingbooks.author=-Автор: Peony Lohua.
items.books.bookslist.grasskingbooks.ac_read=ПРОЧИТАТЬ
items.books.bookslist.grasskingbooks.blees=Прочитав книгу, вы чувствуете вдохновение!
items.books.bookslist.grasskingbooks.anmazing=Разгадав тайну книги, вы познали силу бесстрашия!

items.books.bookslist.brokenbooks.name=книга «Странный отчет случившегося»
items.books.bookslist.brokenbooks.desc=Книга вся испачкана пятнами воды и грязью, а ярко-красные буквы «Случай с пожаром» и страница с пометкой «Следователи» кажутся немного выцветшими.\n\nВыживший: «Пламя бушевало в этом подземелье, пожирая все, что можно было проглотить… включая людей. Это могла быть только магия, вызванная самой магией!»\n\n...Результаты нашего расследования показывают, что осмотрев: обгоревший пол, остатки свитков и оплавленные стеклянные флаконы с зельями практически исключают возможность случайного возгорания.\n\n...Команда «α» нашла нарукавную повязку с расплавленным металлом, которая, как оказалось, содержит остатки магии пламени.
items.books.bookslist.brokenbooks.author=-Автор: неизвестный.
items.books.bookslist.brokenbooks.ac_read=ПРОЧИТАТЬ
items.books.bookslist.brokenbooks.blees=Прочитав книгу, вы чувствуете вдохновение!
items.books.bookslist.brokenbooks.anmazing=Разгадав тайну книги, вы познали силу героя!

items.books.bookslist.magicgirlbooks.name=книга «Дневник таинственной ведьмы»
items.books.bookslist.magicgirlbooks.desc=(Первые несколько страниц, похоже, были вырваны.) ...Прошел третий день после пожара, и я, как обычно, открыла окно.\n\nВ комнату хлынула магия, похожая на скверну, и я никак не могла ей сопротивляться...\n\nПрежде чем меня поглотила эта магия, еще овладев моим телом, мне нужно было что-нибудь придумать, что могло бы ей противостоять...\n\nГрядет время ненависти, заговоров, таинств и мор. (Почерк последних нескольких строк, кажется, похож на другого человека)
items.books.bookslist.magicgirlbooks.author=-Автор: Rin.
items.books.bookslist.magicgirlbooks.ac_read=ПРОЧИТАТЬ
items.books.bookslist.magicgirlbooks.blees=Прочитав книгу, вы чувствуете вдохновение!
items.books.bookslist.magicgirlbooks.anmazing=Разгадав тайну книги, вы познали силу вдохновения!

items.books.bookslist.nokingmobbooks.name=книга «Расследование перемен»
items.books.bookslist.nokingmobbooks.desc=В последнее время на поверхности постоянно ощущалась какая-то сила, идущая из-под земли, и мне было приказано спуститься под землю, чтобы провести расследование.\n\nКогда я туда спустился, неожиданно обнаружил для себя нечто удивительное.\n\nКрысы умеют разговаривать, новые неизвестные существа и и очень умные монстры. Однако, все это не имеет никакого отношения к пожару.\n\nКто же стоит за всем этим? Кто настоящий виновник этих перемен?\n\nЯ продолжу исследовать, пока не найду ответы.
items.books.bookslist.nokingmobbooks.author=-Автор: Demain-Pixel.
items.books.bookslist.nokingmobbooks.ac_read=ПРОЧИТАТЬ
items.books.bookslist.nokingmobbooks.blees=Прочитав книгу, вы чувствуете вдохновение!
items.books.bookslist.nokingmobbooks.anmazing=Разгадав тайну книги, вы познали силу фосфора!

#MLPDPLAYBOOKS
items.books.playbookslist.moneymorebooks.name=писание «Бог богатства»
items.books.playbookslist.moneymorebooks.desc=_Кольцо богатства_ - лучшее кольцо в своем роде с неограниченными возможностями, оно способно дать вам все, что вы захотите! Скорее поклонитесь ему!\n\nПомните: приверженцы не могут контролировать _рост богатства_, поэтому им не следует отдавать { все улучшения { кольцу богатства. В противном случае они не смогут продолжать исследовать подземелье.\n\nПопробуйте надеть { призраку { броню с { проклятием копирования { и у вас появится целая армия.
items.books.playbookslist.moneymorebooks.author=-Автор: _Confused._
items.books.playbookslist.moneymorebooks.ac_read=НЗП

items.books.playbookslist.pinkrandombooks.name=эссе «Тихое небо»
items.books.playbookslist.pinkrandombooks.desc=В девятый день сентября в горах виднелись хризантемы, когда я взбирался высоко и глядел вдаль, вспоминая о Фэнчай. Почему в осенью пору прохладный ветер, так навевает грусть? Что внутри рождает тоску...
items.books.playbookslist.pinkrandombooks.author=-Автор: _Goo Stuff._
items.books.playbookslist.pinkrandombooks.ac_read=НЗП

items.books.playbookslist.deyizibooks.name=книга «Мы - Унион Берлин»
items.books.playbookslist.deyizibooks.desc=По ту сторону гор и морей существует небольшой стадион. На этом стадионе играет группа невероятно профессиональных футболистов. Это команда Унион из Берлина, несмотря на то, что она только что вышла в первый дивизион, у команды есть уверенность, двигаться вперед.\n\nПутешественники, да благословит вас железная воля клуба Униона Берлин.
items.books.playbookslist.deyizibooks.author=-Автор: _Pedro._
items.books.playbookslist.deyizibooks.ac_read=НЗП

items.books.playbookslist.bzmdrbooks.name=книга «Тайна прохождения подземелий».
items.books.playbookslist.bzmdrbooks.desc=Цель подземелья - как можно скорее пройти его, но в нем так много поворотов, я просто беру Лук Духов и стреляю вслепую, прямо с первых этажей до древнего бога, используя маневр 360%, затем переключаюсь на монаха, использую посох Коррозии, чтобы убивать всех мелких врагов в подземелье, собирая вещи, продаю все артефакты, и затем продолжаю стрелять, стрелять, стрелять, стрелять!
items.books.playbookslist.bzmdrbooks.author=-Автор: _Bzmdr._
items.books.playbookslist.bzmdrbooks.ac_read=НЗП

items.mainbooks.desc=Тяжесть книги не дает вам открыть её, но если вы этого не сделаете, то не сможете познать её силу.
items.mainbooks.readed=Вы уже читали эту книгу, так что вам не нужно повторно прочитывать её содержимое.
items.mainbooks.no=Когда вы собираетесь прочитать книгу, какая-то сила мешает вам перелистывать страницы, похоже, кто-то хочет, чтобы вы вынесли книгу из подземелья, а не читали её.

#MLPD
items.scrolls.exotic.scrollofroseshiled.null=свиток Розы
items.scrolls.exotic.scrollofroseshiled.name=свиток Розы
items.scrolls.exotic.scrollofroseshiled.desc=В этом свитке заключена магия _Богини Роз_, которая способна сотворить вокруг прочитавшего _нерушимый барьер_, временно блокирующий прямой урон.\n\nПоскольку этот свиток имеет особый знак, его не требуется опознавать на подлинность.

items.food.alldrink.name=целебный напиток
items.food.alldrink.eat_msg=Вы чувствуете, как в жилах течет насыщенней кровь.
items.food.alldrink.desc=Этот восхитительный напиток, можно получить благодаря смешиванию трех зелий исцеления. Поэтому выпивший его, сможет излечивать свои раны и будет ощущать насыщение некоторое время.

items.scrolls.scrollofflamecursed.name=свиток Проклятого огня
items.scrolls.scrollofflamecursed.desc=Этот свиток может вызвать крайне опасное леденящее пламя, которое способно нанести смертоносный урон всем врагам в поле зрения.\n\nПоскольку этот свиток имеет особый знак, его не нужно проверять на подлинность.
items.scrolls.scrollofflamecursed.none=Свиток излучает яркий прозрачный синий свет.
items.scrolls.scrollofflamecursed.one=Свиток излучает яркий прозрачный синий свет, и %s поджигается!
items.scrolls.scrollofflamecursed.many=Свиток излучает яркий прозрачный синий свет, и монстры поджигаются!
items.scrolls.scrollofflamecursed.null=свиток Проклятого огня

items.potions.exotic.potionofholyfuror.name=зелье Священного благословения
items.potions.exotic.potionofholyfuror.desc=Этот эликсир содержит божественную энергию сконцентрированную в жидкой форме, вкусив его можно благословить себя на длительное время.

items.weapon.melee.magicbluesword.name=рунный клинок
items.weapon.melee.magicbluesword.stats_desc=Урон этого оружия гораздо сильнее возрастает при улучшении.
items.weapon.melee.magicbluesword.desc=Загадочное оружие из дальней страны со светло-голубым лезвием.

items.wands.wandofscale.name=палочка Ужасного шторма
items.wands.wandofscale.staff_name=посох Ужасного шторма
items.wands.wandofscale.desc=Эта палочка с фиолетовой отделкой и навершием из ярко-черного камня.
items.wands.wandofscale.stats_desc=Эта палочка испускает ужасающие звуковые волны, наносящие _%1$d-%2$d урона_ и заставляют ближайших врагов разбегаться во все стороны. Она также способна вызывать шторм, делающий все окружающие ловушки обезвреженными, наводняя местность водой.
items.wands.wandofscale.bmage_desc=Когда _%s_ %s, у посоха Ужасного шторма появляется шанс вызвать кровотечение у врага.
items.wands.wandofscale.eleblast_desc=Стихийный взрыв с посохом ужасного шторма.

items.quest.goldbao.name=золотое сокровище
items.quest.goldbao.desc=То самое сокровище, которое охранялось алмазным королем мимиков, как говорят, имеет особую ценность у торговцев.\n\nНесмотря ни на что, будет ли сокровище в ваших руках, стоимость предмета может варьироваться у торговцев, так как они могут менять её в любой момент.

items.weapon.melee.skyshield.name=треугольный щит
items.weapon.melee.skyshield.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.skyshield.stats_desc=Это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.skyshield.desc=Этот щит сотворен «Империей Падкого Хлада», был разработан под личным контролем императрицы.

items.weapon.melee.junglepoison.name=меч жало джунглей
items.weapon.melee.junglepoison.desc=从克璃诺斯之果身上拆下的一根强壮枝条，蕴含了极强的毒性以及那些触手的力量。挥舞起来很顺手，不过却不怎么锋利。\n这把武器在攻击时可对目标叠加中毒，当中毒积累到一定程度还会有额外效果。\n\n这是一件很快的武器。
items.weapon.melee.junglepoison.ability_name=丛林缠绕
items.weapon.melee.junglepoison.ability_desc=艾诺琳娜可用丛林毒刺使出丛林缠绕，这一武技一般可以使视野范围内的_所有敌人0回合_的虚弱与缠绕，被武技命中的敌人叠加_10层_中毒，需要消耗4点武技充能。
items.weapon.melee.junglepoison.typical_ability_desc=艾诺琳娜可用丛林毒刺使出丛林缠绕，这一武技可以使视野范围内的_所有敌人%s回合_的虚弱与缠绕，被武技命中的敌人叠加_%s层_中毒，需要消耗4点武技充能。

items.weapon.melee.icesan.name=ледяной веер бога
items.weapon.melee.icesan.desc=«Невежды, вашему будущему придет забвение! И в этот миг наступит _временная заморозка_!»\n\nИменно такое _писание _, выгравировано на этом веере, интересно насколько мощен этот божественный веер? Увы вам не дано это познать, но вы догадываетесь, что эта вещь не для смертного!

items.weapon.missiles.klin.name=бумеранг (эксклюзивная версия)
items.weapon.missiles.klin.desc=Этот плоский изогнутый деревянный снаряд вернется к хозяину, если кинуть его во врага.
items.weapon.missiles.klin.durability=Благодаря своей конструкции, бумеранг не изнашивается при использовании.

items.weapon.melee.blackdog.name=коготь черной собаки
items.weapon.melee.blackdog.desc=Узрите, как я безумно царапаю!

items.potions.potionofnowater.name=реагент негашеной извести
items.potions.potionofnowater.desc=Это реагент содержит крайне сильную реакцию при контакте водой, таким образом при броске его в _водянистую местность_, он может высушить всю воду в радиусе от _8_ до _3х3_ клеток.\n\nНо его недостатком является то, что его бурная реакция _выделает много тепла_, которого может бить достаточно, чтобы _воспламенить окружающую местность_, но к счастью его еще можно использовать как _ослепляющий эффект_ бросая пузырек во врага.\n\nЭтот рецепт придумала волшебница Пачули Нолидж. \n<#00ff00>Код заимствован из мода: Satori's Pixel Dungeon.<RGB>

items.superdewvial.name=сосуд для росы
items.superdewvial.desc=Этот флуоресцентный сосуд для капель росы может вмещать до 200 капель росы, так как имеет максимальную вместимость в 200 капель. Поэтому он способен до десяти раз освятить анх!
items.superdewvial.ac_drink=ВЫПИТЬ
items.superdewvial.value=%+d ОЗ
items.superdewvial.collected=Вы собираете росу в сосуд.
items.superdewvial.full=Ваш сосуд для росы заполнен!
items.superdewvial.empty=Ваш сосуд для росы пуст!

items.bags.bookbag.name=кожаный портфель
items.bags.bookbag.desc=Эта сумка для книг из натуральной кожи, похоже очень старая раз скопила столько пыли, но к счастью она может вмещать в себя довольно много книг.
items.bags.lingbag.name=рюкзак Мёбиуса
items.bags.lingbag.desc=Весьма загадочный рюкзак, который предположительно изготовленный специально для героя самым хозяином старинного замка.\n\nВ него могут храниться предметы имеющие исключительную ценность.
items.bags.herbbag.name=продуктовый мешочек
items.bags.herbbag.desc=Небольшая сумка для удобного хранения еды.

items.bags.kingbag.name=полевой рюкзак
items.bags.kingbag.desc=Большой рюкзак, специально созданный на основе давно утраченной таинственной магии Империей Падкого Хлада для хранения оружия ближнего боя и доспехов.
items.bags.propbag.name = рюкзак для безделушек
items.bags.propbag.desc = Небольшой рюкзак для всяких безделушек.


items.weapon.melee.hollow.deathrongboat.name=весло Харона
items.weapon.melee.hollow.deathrongboat.desc=如果你的脚下是水面，则对此次攻击目标的攻击伤害将传导至水面上的所有敌人，每扩大一格，伤害就丢失%s%%。\n\n这件武器比较精准\n\n小船儿荡起双桨，让我们推开波浪~\n\n<#FFA500>渊落古堡外传击败刻耳柏洛斯限定武器，再次感谢你游玩魔绫的首个外传。<RGB>
items.weapon.melee.hollow.deathrongboat.ability_name=жатва
items.weapon.melee.hollow.deathrongboat.typical_ability_desc=艾诺琳娜可以用船桨来_收割_敌人，这破坏性的一击必定命中，一般会造成_%d点伤害_。若敌人不免疫流血，则造成的伤害会转化为等值流血效果。
items.weapon.melee.hollow.deathrongboat.ability_desc=艾诺琳娜可以用船桨来_收割_敌人，这破坏性的一击必定命中，并会造成_%d点伤害_。若敌人不免疫流血，则造成的伤害会转化为等值流血效果。

items.weapon.missiles.crossreback.name=крестовидный бумеранг
items.weapon.missiles.crossreback.desc=Это метательное оружие при попадании в противника создает электрический барьер, который существует %s хода и наносит %s урона каждый ход всем противникам, находящиеся в пределах действия барьера.\n\nДа свершится правосудие! Еретики понесут наказание!\n\n<#FFA500>Легенда о замке Бездны: ограниченное оружие, открывающееся после получения медали «Священное правосудие». Благодарим вас за прохождение первого побочного сюжета в Magic Ling Pixel Dungeon. <RGB>
items.weapon.missiles.crossreback$electricity.desc=Здесь сверкают электрические разряды, но они не причинят вам вреда.

items.weapon.melee.kingsword.name=国王大剑
items.weapon.melee.kingsword.desc=矮人国王的仪式用剑，对于矮人来说是一把十足的重剑，就算如此你挥舞它也需要费一番力气。\n\n这是一件相当缓慢的武器，对亡灵与精英敌人可以造成更高的伤害。每次攻击还有一定几率对目标施加易伤。

items.weapon.melee.kingsword.ability_name=亡灵号召
items.weapon.melee.kingsword.ability_desc=艾诺琳娜可以用国王大剑使出_亡灵号召_，此次_攻击+%s%%伤害_，_必定命中_且召唤一个普通矮人单位，并与系命，且一般_有%s%%概率_额外召唤一个随机亡灵单位，需要消耗2点武技充能。
items.weapon.melee.kingsword.typical_ability_desc=艾诺琳娜可以用国王大剑使出_亡灵号召_，此次_攻击%s%%伤害_，_必定命中_且召唤一个普通矮人单位，并与系命，_有%s%%概率_额外召唤一个随机亡灵单位，需要消耗2点武技充能。

items.weapon.melee.locksword.name=ключ-меч
items.weapon.melee.locksword.desc=Утерянный божественный меч в форме гигантского ключа из загадочной страны. Поговаривают, такой меч может получать опыт, поглощая энергию других ключей, а также открывает особые места потребляя энергию. Интересно, насколько это правда?\n\nЕсли в рюкзаке несколько таких мечей, магическая сила ключа будет поглощена в первый поднятый ключ-меч.\n\nПолучений опыт:
items.weapon.melee.locksword.stats_desc=Это оружие меняет свою форму, наделяя его зачарованием хаоса и увеличивая фиксированный урон, когда достигает определенной отметки при накоплении опыта от собранных ключей.
items.weapon.melee.locksword.ac_interlevel_tp=ДРЕВНИЕ РУИНЫ
items.weapon.melee.locksword.go_interlevel=Изучение Древних руин
items.weapon.melee.locksword.go_desc=На этом дивном мече выгравированы странные символы, и похоже, каждый из них символизирует какое-то слово.\n\nВас заинтересовал символ «A», возможно это слово античный, тут вам приходить мысль о древних руин. Вы бы хотели побивать там наяву?\n\nВы можете отправиться туда в любой момент, но если у ключ-меча не будет достаточно энергии, он может утратить часть наделенных свойств, после вашего прибытия.
items.weapon.melee.locksword.okay=Да, я хочу отправиться
items.weapon.melee.locksword.cancel=Нет, я передумал

items.weapon.melee.locksword.ability_name=отмычка
items.weapon.melee.locksword.ability_desc=Дуэлянт может совершить _отмычку_ ключ-мечом. Эта уничтожающая всё и вся атака гарантированно попадает в цель и наносит на 40% урона больше и активирует зачарование хаоса, а сам Дуэлянт получает на 40 ходов _всевидящее око,_ которое может напрямую отпирать железные или хрустальные двери, затрачивая 5 зарядов.


items.weapon.melee.boomsword.name=бомбокинжал
items.weapon.melee.boomsword.desc=Это волшебное оружие сочетает в себе бомбы и кинжалы...\n\nЧто же получится если соединить бомбу с кинжалом?\n_«Бомбокинжал»_
items.weapon.melee.boomsword.stats_desc=Это оружие накапливает энергию при убийстве врагов и при накоплении получает случайную бомбу. Улучшение оружия, способствует к накапливанию энергии и разблокировки более мощных бомб.
items.weapon.melee.boomsword.has_ammo=Количество бомб: _%d/%d_.\nСледующая бомба: _%s_.
items.weapon.melee.boomsword.ac_zap=МЕТНУТЬ БОМБУ
items.weapon.melee.boomsword.needs_ammo=У бомбокинжала закончились бомбы. Убивайте врагов, чтобы зарядить оружие.
items.weapon.melee.boomsword.ammo_ready=Бомбокинжал зарядился, и получил: %s.
items.weapon.melee.boomsword.no_ammo=У бомбокинжала закончились бомбы. Убивайте врагов, чтобы получить бомбы.
items.weapon.melee.boomsword$1.cant_reach=Вы не можете метнуть бомбу в это место!
items.weapon.melee.boomsword.ammo_added=Вы получили бомбу для бомбокинжала!
items.weapon.melee.boomsword.ability_name=спрятаться
items.weapon.melee.boomsword.typical_ability_desc=艾诺琳娜握持炸弹匕首时可以_潜行_。这个武技能够使艾诺琳娜立即闪现最多5格远，并一般给予_%d回合隐形_。
items.weapon.melee.boomsword.ability_desc=艾诺琳娜握持炸弹匕首时可以_潜行_。这个武技能够使艾诺琳娜立即闪现最多5格远，并给予_%d回合隐形_。
items.weapon.melee.boomsword.upgrade_ability_stat_name=武技持续时间

items.weapon.melee.dairikyan.name=варварские боевые топоры
items.weapon.melee.dairikyan.stats_desc=这对武器极快。
items.weapon.melee.dairikyan.desc=Два крепких и мощных боевых топора одинакового размера для более быстрой рубки.

items.weapon.melee.redbloodmoon.name=пылающий меч красного дьявола
items.weapon.melee.redbloodmoon.desc=Внутри этого меча чувствуется какой-то странный шепчущий голос. Согласно древним летописям, это, скорее всего, тот самый пылающий меч красного дьявола! Этот меч способен призвать подконтрольных стражей, которые известны своей способностью сжигать все вокруг!\n\nПризывает до 2 стражей за уровень, только по-настоящему освоив оружие, вы сможете разблокировать им мощные способности. Стражи призываются только если экипировано оружие, но при его снятии все призванные стражи перестают существовать!
items.weapon.melee.redbloodmoon$redmagicdied.name=страж следопыт-огнеметатель
items.weapon.melee.redbloodmoon$redmagicdied.desc=Эти подконтрольные марионетки, когда-то были стражами хрустального города, но благодаря вашему усердию, сейчас они сражаются по вашу сторону. Теперь, когда вы стали их новым хозяином, они обязаны защищать вас до самой смерти!\n\nИз-за нестабильной природы призрака каждая успешная атака наносит ему некоторый урон, отнимая здоровье.
items.weapon.melee.redbloodmoon.ability_name=рассечь
items.weapon.melee.redbloodmoon.typical_ability_desc=艾诺琳娜可以用红魔炽剑_顺劈_敌人。这一般会造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在2回合内额外使用一次不消耗充能数的顺劈。
items.weapon.melee.redbloodmoon.ability_desc=艾诺琳娜可以用红魔炽剑_顺劈_敌人，造成_%1$d~%2$d点伤害_且必定命中。如果顺劈击杀了一名敌人，这一击将不消耗时间，并且艾诺琳娜可在5回合内额外使用一次不消耗充能数的顺劈。

###armor curses
items.armor.curses.antientropy.name=%s анти-энтропии
items.armor.curses.antientropy.desc=Проклятие анти-энтропии работает против законов вселенной, втягивая энергию в носителя из его окружения. Оно слегка поджигает носителя, но замораживает все вокруг!

items.armor.curses.bulk.name=%s неповоротливости
items.armor.curses.bulk.desc=Доспех неповоротливости выглядит внушительнее обычного, но защищает ничуть не лучше. Более того, больший размер только мешает проходить через двери.

items.armor.curses.corrosion.name=%s коррозии
items.armor.curses.corrosion.desc=Из доспехов коррозии выделяется едкая жидкость и всё вокруг покрывается липкой кислотой.

items.armor.curses.displacement.name=%s телепортации
items.armor.curses.displacement.desc=Проклятие телепортации пытается защитить своего владельца от опасности, перенося его на новое место при получении повреждений. Впрочем, его эффект является скорее помехой, потому что способен телепортировать владельца по всему уровню.

items.armor.curses.metabolism.name=%s метаболизма
items.armor.curses.metabolism.desc=Проклятие метаболизма ускоряет работу организма своего владельца, ускоряя как скорость регенерации, так и скорость истощения.

items.armor.curses.multiplicity.name=%s копирования
items.armor.curses.multiplicity.desc=Доспех, на который наложено проклятие копирования, способен доставить немало проблем. Иногда удар по такому доспеху создаст копию владельца, но с таким же успехом он может создать и копию атакующего!

items.armor.curses.overgrowth.name=%s цветения
items.armor.curses.overgrowth.desc=Доспех цветения покрыт различными растениями. Хоть это и выглядит красиво, но никак не улучшает защиту, а в бою эти растения будут активироваться в случайном порядке!

items.armor.curses.stench.name=%s зловония
items.armor.curses.stench.desc=Доспех, на который наложено проклятие зловония, способен испускать облака ядовитого газа, опасного как для владельца, так и для всех, кто окажется рядом.

items.armor.curses.stone.name=%s гранита
items.armor.curses.stone.desc=磐岩诅咒沉重的魔法包裹了整个铠甲让穿戴者无法闪避，但是穿戴者的每点闪避会使其获得 0.75%% 受伤减免，与其它减伤效果共同计算后的最终减伤至多不超过 75%%。\n\n_-_ 当前闪避：%s\n_-_ 当前减伤：%s%%（上限75%%）


###glyphs
items.armor.glyphs.affection.name=%s очарования
items.armor.glyphs.affection.desc=Эта могущественная руна способна подчинить разум атакующего, временно очаровывая его.

items.armor.glyphs.antimagic.name=%s антимагии
items.armor.glyphs.antimagic.desc=Эта могущественная руна позволяет доспеху защищать своего носителя от магических атак. Количество поглощаемого урона не зависит от уровня редкости доспеха.

items.armor.glyphs.brimstone.name=%s жара
items.armor.glyphs.brimstone.desc=Эта руна защищает носителя и его вещи от языков пламени, давая полную неуязвимость к огню.

items.armor.glyphs.camouflage.name=%s маскировки
items.armor.glyphs.camouflage.desc=Эта руна позволяет своему владельцу становится незаметным на фоне высокой травы, даруя ему кратковременную невидимость.

items.armor.glyphs.entanglement.name=%s опутывания
items.armor.glyphs.entanglement.desc=Эта руна наращивает земляную броню вокруг носителя, поглощая урон, но такая броня разрушится, если носитель сдвинется с места.

items.armor.glyphs.flow.name=%s амфибии
items.armor.glyphs.flow.desc=Эта руна манипулирует течением воды вокруг владельца, значительно увеличивая его скорость передвижения в воде.

items.armor.glyphs.obfuscation.name=%s темноты
items.armor.glyphs.obfuscation.desc=Доспех, на который нанесена эта руна, размывает очертания владельца, делая его менее заметным.

items.armor.glyphs.potential.name=%s напряжения
items.armor.glyphs.potential.rankings_desc=Погиб из-за руны напряжения
items.armor.glyphs.potential.desc=Эта руна накапливает энергию при попадании по ней, заряжая палочки носителя при активации.

items.armor.glyphs.repulsion.name=%s отталкивания
items.armor.glyphs.repulsion.desc=Эта руна способна отразить силу удара в сторону атакующего, отталкивая его назад.

items.armor.glyphs.swiftness.name=%s скорости
items.armor.glyphs.swiftness.desc=Эта руна увеличивает скорость владельца, но только, пока вблизи нет врага.

items.armor.glyphs.thorns.name=%s шипов
items.armor.glyphs.thorns.desc=Эта могущественная руна вызывает кровотечение у тех, кто посмел поднять руку на владельца.

items.armor.glyphs.viscosity.name=%s вязкости
items.armor.glyphs.viscosity.deferred=отложено %d
items.armor.glyphs.viscosity$defereddamage.name=отложенный урон
items.armor.glyphs.viscosity$defereddamage.ondeath=Вы погибли от отложенного урона...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Погиб от отложенного урона
items.armor.glyphs.viscosity$defereddamage.desc=Урон наносится постепенно, вместо того, чтобы наноситься сразу.\n\nОсталось ходов с отложенным уроном: %d.
items.armor.glyphs.viscosity.desc=Руна способна накапливать получаемый носителем урон, отдавая его со временем, а не весь сразу.



###armor
items.armor.armor.ac_detach=ОТКРЕПИТЬ
items.armor.armor.weak_cursed=Даже несмотря на то, что броня проклята, вы можете снять её.
items.armor.armor.detach_seal=Вы открепили печать от брони.
items.armor.armor.equip_cursed=Броня больно сжимает ваше тело.
items.armor.armor.identify=Вы использовали ваш доспех достаточно долго для того, чтобы опознать его.
items.armor.armor.incompatible=Взаимодействие разных типов магии стерло руну с этой брони!
items.armor.armor.curr_absorb=Эта броня поглощает _%1$d-%2$d урона_ за удар и требует _%3$d очков силы_ для комфортного использования.
items.armor.armor.avg_absorb=Как правило, такая броня поглощает _%1$d-%2$d урона_ за удар и требует _%3$d очков силы_ для комфортного использования.
items.armor.armor.too_heavy=Вы недостаточно сильны для того, чтобы носить эту броню, поэтому в ней ваша защита, уклонение и скорость передвижения будут понижены.
items.armor.armor.probably_too_heavy=Вероятно, эта броня будет слишком тяжела для вас.
items.armor.armor.excess_str=Благодаря избыточной силе вы _лучше уклоняетесь_ в этой броне.
items.armor.armor.evasion=Этот доспех сбалансирован, чтобы увеличивать _уклонение._
items.armor.armor.defense=Этот доспех сбалансирован, чтобы увеличивать _защиту._
items.armor.armor.inscribed=Носит начертание _%s._
items.armor.armor.cursed_worn=Ваша броня проклята, и вы не в силах снять её.
items.armor.armor.cursed=Вы чувствуете недобрую магию, таящуюся в этой броне.
items.armor.armor.not_cursed=Эта броня не проклята.
items.armor.armor.seal_attached=Сломанная печать воина прикреплена к этой броне, она дает до _%d щита_.
items.armor.armor$glyph.glyph=руны
items.armor.armor$glyph.killed=%s убила вас...

items.armor.classarmor.ac_ability=ВЫБЕРИТЕ СПОСОБНОСТЬ
items.armor.classarmor.ac_transfer=ПЕРЕНОС
items.armor.classarmor.transfer_title=Перенести Броню
items.armor.classarmor.transfer_desc=Магия короны короля дворфов может быть перенесена на другую броню. Заметьте, что прошлая броня будет уничтожена в процессе.
items.armor.classarmor.transfer_prompt=Выберете Броню
items.armor.classarmor.transfer_cancel=Отменить
items.armor.classarmor.not_trans=По неизвестным причинам %s, не может перенять способности.
items.armor.classarmor.transfer_complete=Свойства вашей героической брони были перенесены!
items.armor.classarmor.no_ability=Ваша броня не имеет способности в данный момент, вы можете выбрать одну из них!
items.armor.classarmor.not_equipped=Вам надо надеть эту броню, чтобы использовать даруемые ей способности!
items.armor.classarmor.low_charge=У брони недостаточно заряда, чтобы использовать ее особые способности!
items.armor.classarmor.charge_use=Применяя способность сейчас, вы потратите _%s_ заряда.

items.armor.clotharmor.name=тканая броня
items.armor.clotharmor.desc=Эта легкая броня обеспечивает минимальную защиту. Лучше, чем ничего.

items.armor.huntressarmor.name=плащ героя
items.armor.huntressarmor.no_enemies=Нет врагов в поле зрения
items.armor.huntressarmor.desc=Пока Охотница носит этот плащ, она может использовать особую способность.

items.armor.leatherarmor.name=кожаная броня
items.armor.leatherarmor.desc=Броня из выделанной шкуры какого-то животного. Она не так легка, как тканевая, но зато обеспечивает большую защиту.

items.armor.magearmor.name=мантия героя
items.armor.magearmor.desc=В этом великолепном одеянии Маг может использовать особую способность.

items.armor.mailarmor.name=кольчужная броня
items.armor.mailarmor.desc=Переплетенные металлические кольца позволяют сочетать хорошую защиту с достаточной гибкостью.

items.armor.platearmor.name=латная броня
items.armor.platearmor.desc=Эти толстые металлические пластины, скрепленные в один доспех, способны обеспечить несравнимую защиту тому, кто в силах вынести их невероятную тяжесть.

items.armor.lamellararmor.name=ламеллярная броня
items.armor.lamellararmor.desc=Броня, состоящая из множества прямоугольных пластин, выстроенных в ряд, обеспечивают надежную защиту для путешественников, способных выдержать её вес.

items.armor.roguearmor.name=одежда героя
items.armor.roguearmor.desc=Надевая это темное одеяние, Разбойник может использовать особую способность.

items.armor.scalearmor.name=пластинчатая броня
items.armor.scalearmor.desc=Вшитые в кожаный жилет железные полоски создают гибкую, но надежную броню.

items.armor.warriorarmor.name=латная броня героя
items.armor.warriorarmor.desc=Пока надеты тяжёлые латные доспехи, Воин может использовать особую способность.

items.armor.duelistarmor.name=нагрудник героя
items.armor.duelistarmor.desc=Пока надеты эти броня и плащ, Дуэлянт может использовать особую способность.


### custom armor
items.armor.custom.ancityarmor.name=панцирная броня
items.armor.custom.ancityarmor.desc=Панцирь брони, срезанный с гигантского тела донного хищника, хоть и выглядит она очень массивной, но на деле очень легкая.\n\n_Эта броня имеет хорошее уклонение_, и является уникальной, из-за чего не может быть изменена короной.
items.armor.custom.ancityarmor.ac_custom=Отравленный туман
items.armor.glyphs.alowglyph.ancitystone.name=древней печати
items.armor.glyphs.alowglyph.ancitystone.desc=Эта мощная и уникальная печать делает человека, использующего ее, невосприимчивым к ядовитому газу, кислотной коррозии и эффектам отравления.\n\nПечать - это мощная благословляющая сигилла, которая может сосуществовать с другими печатями.
items.armor.glyphs.alowglyph.ancitystone.alowglyph=печати
items.armor.custom.ancityarmor.no_charge=У брони недостаточно заряда, чтобы использовать ее особую способность!

###artifacts
items.artifacts.alchemiststoolkit.name=набор алхимика
items.artifacts.alchemiststoolkit.ac_brew=СВАРИТЬ
items.artifacts.alchemiststoolkit.ac_energize=РАЗЛОЖИТЬ
items.artifacts.alchemiststoolkit.not_ready=Ваш набор алхимика ещё не разогрелся.
items.artifacts.alchemiststoolkit.cursed=Проклятый набор алхимика препятствует использованию алхимии!
