items.artifacts.electricalsmoke.die = Последствие плохой привычки... Вы обнаружили: «Как дым исчез, и ваше тело тоже».
items.artifacts.electricalsmoke.desc_normal = Дым покрывает потолок... Вы обнаружили: «Теплый пар в своих легких».
items.artifacts.electricalsmoke.desc_cursed = Осмотрев с завязанными глазами... Вы обнаружили: «Выделяющийся газ».
items.artifacts.electricalsmoke.desc_noequip_normal = Осмотрев исходящий дым. Вы обнаружили: «Расслабляющий пар!».
items.artifacts.electricalsmoke.desc_noequip_cursed = Чествуется отвращение... Вы обнаружили: «Притягивающее зло».
items.artifacts.electricalsmoke.desc_noidentify = На первый взгляд это... Вы обнаружили: «Выглядит как поделка».
items.artifacts.electricalsmoke.low_charge = У вашей электронной сигарете недостаточно заряда.
