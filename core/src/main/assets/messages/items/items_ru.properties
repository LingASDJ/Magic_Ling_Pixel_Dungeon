items.artifacts.masterthievesarmband.no_steal=这名敌人身上没有可偷取的东西。
items.artifacts.masterthievesarmband.stole_item=你偷到了：%s。
items.artifacts.masterthievesarmband.failed_steal=这次偷窃一无所获。
items.artifacts.masterthievesarmband.level_up=你的腕套变得更强了！
items.artifacts.masterthievesarmband.desc=这副紫色丝绒腕套，是盗贼大师的信物。它本不属于你，就连你击败的原持有者，也并非它真正的主人。
items.artifacts.masterthievesarmband.desc_cursed=受诅咒的腕套紧紧箍在你的手腕上，你隐约感觉自己的钱袋正一点点变轻……
items.artifacts.masterthievesarmband.desc_worn=每当获取经验，腕套内部便会积蓄力量。你不仅能用它在洗劫敌人，还能在商店行窃！<#f00>但是注意，浊焰魔女莲娜是商人的守护者，她痛恨偷窃，这种行为比明抢更易激怒她！<RGB>\n\n窃取敌人随身物品不会消耗行动，还能短暂迷惑目标。偷窃有概率获得敌人身上任意物品；偷袭未察觉你的敌人时，偷窃成功率更高。反复偷窃同一个敌人，不会提升赃物获取概率。


items.artifacts.sandalsofnature.name=сандалии природы
