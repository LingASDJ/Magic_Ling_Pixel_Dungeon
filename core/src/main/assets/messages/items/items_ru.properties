#### 五周年特殊物品
items.fiveyears.selectkeys.name=таинственный ключ
items.fiveyears.selectkeys.desc=С помощью этого волшебного ключа вы можете сформировать нужный вам ключ, кроме того, который отпирает запертый выход с уровня.
items.fiveyears.selectkeys.ac_spawn=СФОРМИРОВАТЬ КЛЮЧ
items.fiveyears.selectkeys$wandsetting.create=Сформировать
items.fiveyears.selectkeys$wandsetting.cancel=Отменить

items.scrolls.exotic.scrollofblessgotend.name=свиток Благословения
items.scrolls.exotic.scrollofblessgotend.desc=Прочитав этот свиток, вы временно благословите своё оружие или броню. Ваше экипированное оружие или броня иметь дополнительный +1 уровень до тех пор, пока вы не победите главного босса этого региона.
items.scrolls.exotic.scrollofblessgotend.weapon=Благословить оружие
items.scrolls.exotic.scrollofblessgotend.armor=Благословить броню

items.weapon.melee.magesstaff$wndmagehand.cant_equip=Вы должны снять палочку перед тем как помещать её в волшебную руку.
items.weapon.melee.magesstaff$wndmagehand.cant_unidentified=Вы не можете помещать неопознанные палочки в волшебную руку.

items.quest.backgokey.name=книга возврата
items.quest.backgokey.desc=Когда вы будете готовы, придет время попрощаться с заснеженным каньоном...\n\nЕсли вы не хотите грабить магазин, воспользуйтесь этим предметом, чтобы вернуться, однако тогда вы больше не сможете ограбить магазин в этой игре.
items.quest.backgokey.ac_interlevel_tp=Вернуться в подземелье
items.quest.backgokey.dead=Вы отказались от испытания, и теперь не можете в этом путешествии грабить...
items.quest.backgokey.not=Вы не можете вернуться в таинственный каньон, так как книга полностью утратила свою энергию, и теперь стала простым сувениром с напоминанием о том месте.
items.quest.backgokey.cannot_send=Вы не можете воспользоваться книгой возврата, когда текущий этаж закрыт.

items.oldsunshadow.name=отголосок воспоминаний
items.oldsunshadow.desc=Этот кристалл имеет бесчисленное множество граней, каждая из которых, кажется, проецирует различные образы - некоторые из пережитых вами событий, другие из миров, не затронутых вашим путешествием... Даже от одного взгляда кружится голова. Внутри него также бурлит таинственная энергия, делая его слегка теплым на ощупь...\n\nЕсли у вас хватит смелости посмотреть на него прямо, огромная сила кристалла перейдет в ваше тело, давая вам возможность выбрать свой подкласс.\n\nНеужели вы действительно не помните свое прошлое?
items.oldsunshadow.ac_wear=ВСМОТРЕТЬСЯ
items.oldsunshadow.not_apply=Отголосок воспоминаний отвергнул вас и просто исчез…
items.oldsunshadow.used=Вы взглянули прямо в кристалл, и тут же в ваше тело проникнула таинственная сила...

items.artifacts.timekeepershourglass$timefreezestats.name=заморозка времени
items.artifacts.timekeepershourglass$timefreezestats.desc=Время застыло вокруг вас, позволяя выполнять действия мгновенно. Эффект будет действовать, пока вы его не отмените или когда у часов закончится энергия. Атака или магия также прервут эффект часов.
items.artifacts.talismanofforesight$foresightstats.name=предвидение
items.artifacts.talismanofforesight$foresightstats.desc=Вы сильно нервничаете, будто рядом есть незримая опасность.
items.artifacts.capeofthorns$thornsstats.name=шипы
items.artifacts.capeofthorns$thornsstats.desc=Ваш плащ излучает энергию, окружая вас отражающим полем!\n\nВо время действия эффекта весь получаемый урон снижен. К тому же, если атакующий стоит рядом с вами, он получит обратно отражённый урон.
items.artifacts.cloakofshadows$cloakstealthstats.name=маскировка
items.artifacts.cloakofshadows$cloakstealthstats.desc=Укрывшись под плащом теней, вы получили временную невидимость. Вы останетесь скрыты, пока не отмените эффект или у плаща не иссякнет энергия.\n\nВ этом состоянии враги не атакуют и не преследуют вас. Атака или использование магии (например, свитка или палочки) немедленно рассеет невидимость.

items.quest.bloodredflower.name=кровавая лилия
items.quest.bloodredflower.desc=Этот цветок, поранивший вас, почти полностью высосал из вас жизненную энергию и теперь расцветает в своей зловещей красе. Судя по всему, он признал вас своим хозяином, так что, возможно, вы сможете воспользоваться его силой.\n\n_Пролитие крови:_ расходует половину текущего здоровья владельца для зарядки цветка жизненной энергией, той же величины. Невозможно совершить, если запас энергии цветка достиг максимума.\n_Извлечение экстракта:_ мгновенно расходует всю жизненную энергию цветка для восстановления здоровья владельца до уровня, израсходованной энергии цветка. <#94527E> \n\nТекущая жизненная энергия цветка: %s/%s.
items.quest.bloodredflower.ac_active=ИЗВЛЕЧЬ ЭКСТРАКТ
items.quest.bloodredflower.ac_blood=ПРОЛИТЬ КРОВЬ
items.quest.bloodredflower.heal=Жизненная энергия в кровавой лилии перетекла в ваше тело, и вы чувствуете себя отдохнувшим.
items.quest.bloodredflower.blood=Вы порезали палец, и кровь потекла на кровавую лилию.
items.quest.bloodredflower.blood_no=Жизненная энергия, заключенная в кровавой лилии, уже в избытке, поэтому сейчас вы не можете пожертвовать свою кровь.
items.quest.bloodredflower.blood_not=Вы слишком слабы, кровавая лилия отказалась принять ваше жертвоприношение кровью.


items.quest.easteregg.name=пасхальное яйцо
items.quest.easteregg.desc=Изысканно украшенное пасхальное яйцо, таящее в себе весенние сюрпризы и отблеск неведомой магии.\n\nИспользуйте его, чтобы активировать случайный подарок:\n_-_ Небольшой шанс наложить благословение чемпиона\n_-_ Высокий шанс получить случайный предмет из подземелья\n_-_ Малый шанс пробудить существо, скрытое в яйце\n\nСчастливой Пасхи!
items.quest.easteregg.ac_kitem=РАЗБИТЬ

### 魔剑士-新英雄
items.weapon.melee.imperialexorcism.name=императорский меч изгнания демонов
items.weapon.melee.imperialexorcism.desc=Магический меч, дарованный Императрицей Падкого Хлада, в котором запечатана часть силы ледяного демона.\n\nЭто оружие дополнительно наносит _1-3 урона_ по окоченелой или замороженной цели.

items.weapon.missiles.magicflyblade.name=магический метательный клинок
items.weapon.missiles.magicflyblade.stats=Это уникальное метательное оружие наносит _%1$d-%2$d_ ед. урона и требует _%3$d очков силы_ для эффективного использования.
items.weapon.missiles.magicflyblade.desc=Этот магический клинок был выкован королевскими кузнецами и зачарован чародеями Империи Падкого Хлада, применив множество передовых магических технологий, чтобы показать величие магического ремесла Империи Падкого Хлада.
items.weapon.missiles.magicflyblade.distance=Это оружие управляется магией Мечника и получает дополнительный бонус к _точности_ при атаке целей на расстоянии, и даже не теряет её в _ближнем бою_. В отличие от другого метательного оружия, оно не изнашивается при использовании. Если после броска у Мечника ещё остается магическая сила, он автоматически тратит _1 ед. магической силы_, чтобы вернуть оружие себе. (этот действие не тратит ход).

### 特殊书籍
items.books.questbookslist.tombreachbook.name=записи обследования древней гробницы
items.books.questbookslist.tombreachbook.desc=Вниманию тестировщиков по исследованию гробницы:\n\nПрочтение этой записки открывает доступ к тестовой зоне «Древние гробницы». По достижении 11-го этажа окружающая локация сменится на «Тайны древних гробниц».\n\nДанный предмет предназначен исключительно для целей внутреннего тестирования. До выхода официальной версии способ его активации будет полностью изменен, а весь игровой процесс подвергнется полному тестированию перед запуском.
items.books.questbookslist.tombreachbook.ac_read=Тестовый запуск
items.books.questbookslist.tombreachbook.author=Группа тестирования MLPD
items.books.questbookslist.tombreachbook.action=Локация «Тайны древних гробниц» активирована! Перейдите на 11-й этаж или сбросьте его, чтобы загрузить соответствующую локацию.

###TOMB
items.food.tomb.gravemeat.name=гнилое мясо
items.food.tomb.gravemeat.desc=Это кусок мяса, который еще не успел сильно протухнуть, и можно превратить в обычное мясо с помощью алхимии, но в сыром виде оно едва пригодно для употребления, хотя если хотите попробуйте его так на свой страх и риск.
items.food.tomb.gravemeat.eat_msg=Во рту застыл смрад гниющего мяса, а его холод пронизывает живот…
items.food.tomb.gravemeat.poison=Мощный токсин из гниющего мяса проник по горлу во все части тела, отравив вас!
items.food.tomb.gravemeat.vertigo=Гнилостный запах ударил в голову, и перед глазами всё закружилось, и вас охватило головокружение!
items.food.tomb.gravemeat.corrosion=Гнилостная слизь, выделяемая гниющим мясом, прилипла к коже и непрерывно разъедает ваше тело!
items.food.tomb.gravemeat.weakness=Гнилой запах лишает вас сил, обременяя все тело слабостью!
items.food.tomb.gravemeat.downlevel=Жизненная энергия в теле подавлена гнилостным запахом, снижая временно эффективность экипировки!

items.food.tomb.frozengravemeat.name=замороженное гнилое мясо
items.food.tomb.frozengravemeat.desc=Это кусок насквозь промороженного гнилого мяса. Хотя неясно, почему кто-то решил, что заморозка снизит его токсичность, но это действительно в какой-то мере сработало, и если удалить подгнившие участки, на вкус оно довольно вкусное.
items.food.tomb.frozengravemeat.eat_msg=Ледяной холод во рту не смог заглушить остатки гниющего запаха, а пронизывающий холод распространился из пищевода по всему телу.
items.food.tomb.frozengravemeat.poison=Токсины из замороженного гнилого мяса разъедают ваше тело!
items.food.tomb.frozengravemeat.vertigo=Закружилась голова!
items.food.tomb.frozengravemeat.corrosion=Гнилостная слизь прилипла к коже!
items.food.tomb.frozengravemeat.heal=Замороженное мясо таит слабую жизненную энергию, способствующую заживлению ран!
items.food.tomb.frozengravemeat.invisible=Холод окутывает все ваше тело, и вы становитесь невидимым!
items.food.tomb.frozengravemeat.barskin=Толстая и твердая кора покрывает всё тело, наделяя вас дубовой кожей!

items.food.tomb.cookgravemeat.name=прожаренное гнилое мясо
items.food.tomb.cookgravemeat.desc=После прожарки на сильном огне гнилое мясо приобрело вид, напоминающий кожу; оно прожарилось, а его токсичность немного снизилась, благодаря чему оно стало хоть как-то съедобным.
items.food.tomb.cookgravemeat.eat_msg=Запах дыма и гари не смог заглушить неприятный запах гнили, а сухое, жесткое жареное мясо проскользнуло по горлу в желудок.
items.food.tomb.cookgravemeat.poison=Токсины от жареного гнилого мяса, просочились по всему телу, медленно разъедая организм!
items.food.tomb.cookgravemeat.vertigo=Дым, пронизанный гнилостным запахом, ударил в голову, вызвав головокружение и тяжесть!


items.potions.elixirs.ghostlingelixir.name=эликсир Фосфорного пламени
items.potions.elixirs.ghostlingelixir.desc=Этот эликсир сочетает в себе нестабильные свойства зелья фосфорного огня и могущественную силу нестабильного заклинания и свитков улучшения, которую можно использовать, чтобы наделить особыми свойствами метательное оружие, оружие ближнего боя или доспехи в пределах области 3x3.\n\nЕсли герой находится внутри фосфорного пламени, он также получает <#FF0> неуязвимость <RGB> на 8 ходов.

items.quest.killswarm.name=инсектицид
items.quest.killswarm.desc=Если вы столкнулись с проблемой чрезмерно агрессивных мух в версии 0.9.5.0, воспользуйтесь этим. Используйте не более двух раз.
items.quest.killswarm.ac_kill=ДЕЗИНФИЦИРОВАТЬ

# 重阳节
items.potions.bottledmarigoldwine.name=хризантемовое вино
items.potions.bottledmarigoldwine.desc=Изысканный напиток, приготовленный из золотистых хризантем, расцветающих осенью. Древние верили, что хризантемы способствуют долголетию, так выпивший его одарит себя благословением, продлевая свою жизнь на некоторое время.\n\nСодержащийся в нём алкоголь также придаст вам лёгкое опьянение. Не переусердствуйте!

items.potions.alcoholmixture.name=спиртовая смесь
items.potions.alcoholmixture.desc=Довольно нестабильная смесь на основе этанола, источающая резкий запах спирта, вряд ли кому-то захочется такое пить. Скорее всего, от этого напитка вы не опьянеете, но после его употребления вас наверняка начнёт шатать.\n\nПри броске содержащийся в смеси спирт быстро испаряется, насыщая окружающий воздух парами алкоголя.

items.potions.legacywine.name=фамильное вино
items.potions.legacywine.desc=Согласно легенде, это священное вино было собственноручно приготовлено одним из мудрецов Священного леса в качестве подношения для молитвы о мире и процветании во все мире. \n\nВам посчастливилось узнать рецепт приготовления этого хризантемового вина, требующий немалого времени и терпения. Быть может, благодаря своему мастерству в алхимии, вы сумеете создать вино похожего качества.\n\nВыпив его, вы получите более длительное благословение хризантемы.\n\nТорговцы наверняка проявят большой интерес к этому редкому и ценному товару.

items.potions.molotovcocktail.name=коктейль Молотова


##### MLPD custom keys (preserved from project) #####
items.quest.devitem.crystalling.active=\n\nЭто предмет главного разработчика Ling команды MLPD, по случаю его дня рождения.\n\nВремя действия бонуса:  22.8-25.8 (по календарю)
items.quest.devitem.crystalling.end=\n\nДень рождения разработчика Ling завершился, и бонусы для этого предмета теперь не работают.
items.quest.devitem.crystalling.last=\n\nСегодня последний день, когда действуют бонусы ожерелья, не упустите возможность воспользоваться ими.
items.potions.potionofinvisibility.notinvisible=Вы не можете стать невидимым!
