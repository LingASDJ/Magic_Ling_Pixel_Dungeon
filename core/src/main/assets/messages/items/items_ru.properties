# 滴落者 TheDrip messages
items.weapon.melee.spdtomlpd.thedrip.name=капельщик
items.weapon.melee.spdtomlpd.thedrip.desc=С этого клинка непрерывно стекают прозрачные капли воды, медленно смывая пятна крови с лезвия.
items.weapon.melee.spdtomlpd.thedrip.stats_desc=Это оружие затапливает клетку водой, если его владелец остается на одной и той же клетке 2 хода подряд.
items.weapon.melee.spdtomlpd.thedrip.ability_name=небесное наводнение

# 驱魔重锤 ExorcistMaul messages
items.weapon.melee.spdtomlpd.exorcistmaul.name=тяжелый молот изгнания
items.weapon.melee.spdtomlpd.exorcistmaul.desc=Грозное оружие против атакующих в ближнем бою заклинателей.
items.weapon.melee.spdtomlpd.exorcistmaul.stats_desc=Это оружие при успешном попадании по цели накладывает щит, который действует 3 хода и дарует иммунитет к одной магической атаке, а каждое попадание обновляет его действие.
items.weapon.melee.spdtomlpd.exorcistmaul$qumohudun.name=изгоняющий щит
items.weapon.melee.spdtomlpd.exorcistmaul$qumohudun.desc=Действует %1$s ходов, и исчезает после отражения одной магической атаки.
items.weapon.melee.spdtomlpd.exorcistmaul.ability_name=развеивание магии
items.weapon.melee.spdtomlpd.exorcistmaul.ability_desc=Дуэлянт может совершить _развеивание магии_ тяжелым молотом изгнания. Эта способность дает мгновенно иммунитет к магии на 10 ходов, расходуя _3 заряда оружия_.
items.weapon.melee.spdtomlpd.exorcistmaul.typical_ability_desc=Дуэлянт может совершить _развеивание магии_ тяжелым молотом изгнания. Эта способность дает мгновенно иммунитет к магии на 10 ходов, расходуя _3 заряда оружия_.

# 断生者 LifeCutter messages
items.weapon.melee.spdtomlpd.lifecutter.name=душегубитель
items.weapon.melee.spdtomlpd.lifecutter.desc=Смертельное оружие казни, способное без труда рассечь человека пополам.
items.weapon.melee.spdtomlpd.lifecutter.stats_desc=Это оружие при успешном попадании может рассечь врага (кроме боссов) надвое, подобно рою мух. Каждое попадание разделяет врага на две части; исходник, и его копия получают половину текущего запаса здоровья, и имеют вдвое сниженный максимальный запас здоровья.
items.weapon.melee.spdtomlpd.lifecutter.ability_name=рассечь пополам
items.weapon.melee.spdtomlpd.lifecutter.prompt=Выберите цель

# 万象之杖 StaffofMyriadThings messages
items.weapon.melee.spdtomlpd.staffofmyriadthings.name=посох мириад
items.weapon.melee.spdtomlpd.staffofmyriadthings.desc=Чтобы он по-настоящему засиял во всем своем великолепии, его нужно наполнить всем многообразием мира.
items.weapon.melee.spdtomlpd.staffofmyriadthings.stats_desc=Это оружие усиливает свой урон на 0-1 , и точность на 1 за каждое убийство им уникального врага.
items.weapon.melee.spdtomlpd.staffofmyriadthings.killed_none=Пока не убил ни одного врага.
