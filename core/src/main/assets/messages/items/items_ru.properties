items.thanks.huntingcarnival.shock_hit_1=Электромагнитный выстрел: Меткое попадание в цель!
items.thanks.huntingcarnival.shock_hit_2=Электромагнитный выстрел: Отличное попадание в противника!

items.thanks.huntingcarnival.burn_hit_0=Поджигающий снайпер: Попал. Хорошо бы и отдохнуть…
