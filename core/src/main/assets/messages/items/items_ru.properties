items.jokings.hornofplentybomb.desc=Рог изобилия, набитый порохом… Судя по всему, его можно использовать как бомбу, чтобы при взрыве разрушать местность или объекты, нанося _%1$d-%2$d урона_ всем находящимся поблизости целям.
