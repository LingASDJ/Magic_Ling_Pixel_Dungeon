items.jokings.hornofplentyricebomb.desc=Рог изобилия, набитый порохом и… рисом? Судя по всему, его можно использовать как бомбу, чтобы при взрыве разрушать местность или объекты, нанося _%1$d-%2$d урона_ всем находящимся поблизости целям.\n\nПохоже, он наделен некой магией, превращающей врагов в пищу...

