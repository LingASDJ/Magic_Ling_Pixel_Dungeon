items.weapon.melee.spdtomlpd.doomsdayscepter.name=скипетр рока
items.weapon.melee.spdtomlpd.doomsdayscepter.desc=В этом деревянном скипетре дремлет взрывная энергия; судя по всему, его можно использовать подобно свитку.
items.weapon.melee.spdtomlpd.doomsdayscepter.stats_desc=Это оружие, когда экипировано отнимает 1 уровень улучшения при применении ментального удара.
items.weapon.melee.spdtomlpd.doomsdayscepter.ac_burst=МЕНТАЛЬНЫЙ УДАР
items.weapon.melee.spdtomlpd.doomsdayscepter.need_equip=Сперва вам нужно экипировать скипетр рока.
items.weapon.melee.spdtomlpd.doomsdayscepter.no_level=Текущий уровень скипетра рока недостаточен для применения ментального удара.
