items.lightblack.oillantern.ac_burn = РАЗЖЕЧЬ

items.lightblack.oillantern.ac_auto=АВТОЗАПРАВКА ВКЛ
items.lightblack.oillantern.ac_nuto=АВТОЗАПРАВКА ВЫКЛ
items.lightblack.oillantern.auto=Имеющиеся пузырки с маслом и факелы, отныне будут автоматически заправляться в фонарь.
items.lightblack.oillantern.no_auto=Имеющиеся пузырки с маслом и факелы, отныне не будут автоматически заправляться в фонарь.

items.lightblack.oillantern.lanternosoul=Вы не можете зажечь фонарь, пока потерян рюкзак.
items.lightblack.oillantern.lantermostic=Вы не можете использовать фонарь, пока есть другие эффекты дающие свет!

items.lightblack.oillantern.lanterneedsx=Вашему фонарю нужны пузырьки с маслом, чтобы заправить его.
items.lightblack.oillantern.lanterneedsxs=Вашему фонарю нужна маслянистая жидкость для заправки.
items.lightblack.oillantern.lanterdied=Ваш фонарь потух!
items.lightblack.oillantern.lanteroff=Вы погасили фонарь.
items.lightblack.oillantern.lanteron=Вы зажгли фонарь.
items.lightblack.oillantern.lanterreload=Вы добавили в фонарь немного масла, и он стал немного ярче.
items.lightblack.oillantern.lanterneed=У вас недостаточно пузырьков с маслом для заправки фонаря.
items.lightblack.oillantern.lanterneeds=Вам нужен еще пузырек с маслом для заправки фонаря.
items.lightblack.oillantern.black=Ваш фонарь полностью погас и нуждается в розжиге, чтобы зажечь его вновь...
items.lightblack.oillantern.must=В вашем рюкзаке нет фонаря, чтобы заправить его.

items.artifacts.goldiron.name=позолоченный молот (НЗП)
items.artifacts.goldiron.ac_stonegold=stonegold
items.artifacts.goldiron.ac_onedingyi=onedingyi
items.artifacts.goldiron.ac_condontxa=condontxa
items.artifacts.goldiron.desc=Когда-то это был молот тролля-кузнеца, и в нем заключена магическая сила.\n\nА поскольку вы случайно потеряли кирку тролля, он поручил вам убить его темную сторону.\n\nТеперь, когда вы выполнили поручение тролля, этот магический молот был отдан вам троллем как дар...

items.bombs.laserpython.name=кристальная бомба
items.bombs.laserpython.desc=Эта взрывное устройство в виде кристалла, при броске взрывается в указанном месте, чтобы создать кристаллический пилон с автоматическим лазером.
items.bombs.laserpython.didnot_pick=Вы не можете забрать этот предмет...

items.food.pasty.moon=лунный пирог
items.food.pasty.moonling=Вкус лунного пирога навевает тёплые воспоминание и это придает вам радость.
items.food.pasty.moon_desc=Лунные пироги символизируют воссоединение и счастье. Употребляя такую пищу в этот праздничное время, опасное подземелье также наполнится радостной атмосферой такого замечательного праздника.\n\nСчастливого Праздника середины осени, %s!

items.scrolls.exotic.scrollofpolymorph.name=свиток Полиморфа
items.scrolls.exotic.scrollofpolymorph.desc=Этот секретный свиток содержит мощную магию трансформации. При её задействовании все видимые противники превратятся в волшебных овец!\n\nЗаклинание необратимо, так что предметы в инвентарях пострадавших будут потеряны. Кроме того, боссы способны устоять перед данным эффектом.

items.potions.elixirs.watersoul.name=эликсир Водяного духа
items.potions.elixirs.watersoul.desc=Этот эликсир, благодаря сочетанию зелья исцеления и замороженного мяса, может временно дать иммунитет к проклятию воды, а также его целебные и насыщающие свойства, накладывают эффект лечения и немного утоляют голод.\n\nКроме того выпив его, можно моментально снять все отрицательные эффекты наложенные «Проклятием бога воды».\n\nПри активации испытания «Фармакофобия», употребление 3 таких эликсира, прекратит наложения лечения, а последующие применение будет давать только привычные бонусы.

items.food.lightfood.name=сияющий онигири
items.food.lightfood.eat_msg=Эта еда имеет великолепный вкус!
items.food.lightfood.desc=Этот рисовый шарик получился в результате смешивания замороженного мяса и семян молниоцвета, а также рациона пищи. Такая еда способна не только исцелить героя, но и мгновенно утолить голод и вдобавок одарит благословением грома.

items.food.cake.name=клубничный кремовый торт
items.food.cake.eat_good=Вы чувствуете, энергию стимулирующую свой потенциал, дающую +1 силу!
items.food.cake.eat_good2=Вы уже получили свой потенциал от этой энергии, поэтому она преобразуется в барьер.
items.food.cake.desc=Торт - самая редкая пища в подземелье, съев его можно мгновенно снять все негативные эффекты и предать себе бодрость. Также такой торт имеет крайне малый шанс стимулировать скрытый потенциал...

items.food.switch.name=волшебный сэндвич
items.food.switch.desc=Такой сэндвич может быстро утолить голод и дать некий магический барьер, но недостаток в том, что другая еда, может стать не такой вкусной, после его употребления.


items.food.ricedumplings.eat_msg_good=Этот рис такой вкусный, когда есть начинка!\nВы чувствуете, как некая сила полностью очистила ваше тело.

items.food.ricedumplings$ricedumplingsred.name=цзунцзы с засахаренными финиками
items.food.ricedumplings$ricedumplingsred.desc=Цзунцзы - символ праздничного, поэтому съев их можно насытится и мгновенно избавиться от большинства негативных эффектов, причем разные цзунцзы имеют свои особые эффекты.\n\nВкусив такой цзунцзы, можно получить эффект лечения. При активации испытания «Фармакофобия», эффекта отравления не будет, а само лечение будет уменьшено вдвое. [\n\nС праздником! [

items.food.ricedumplings$ricedumplingspink.name=цзунцзы с бобовой пастой
items.food.ricedumplings$ricedumplingspink.desc=Цзунцзы - символ праздничного, поэтому съев их можно насытится и мгновенно избавиться от большинства негативных эффектов, причем разные цзунцзы имеют свои особые эффекты.\n\nВкусив такой цзунцзы, можно получить эффект магической брони. [\n\nС праздником! [

items.food.ricedumplings$ricedumplingsorange.name=цзунцзы с семенами лотоса
items.food.ricedumplings$ricedumplingsorange.desc=Цзунцзы - символ праздничного, поэтому съев их можно насытится и мгновенно избавиться от большинства негативных эффектов, причем разные цзунцзы имеют свои особые эффекты.\n\nВкусив такой цзунцзы, можно получить эффект перезарядки артефактов. [\n\nС праздником! [

items.food.ricedumplings$ricedumplingslink.name=цзунцзы с соленым желтком
items.food.ricedumplings$ricedumplingslink.desc=Цзунцзы - символ праздничного, поэтому съев их можно насытится и мгновенно избавиться от большинства негативных эффектов, причем разные цзунцзы имеют свои особые эффекты.\n\nВкусив такой цзунцзы, можно получить эффект увеличения силы. [\n\nС праздником! [

items.food.ricedumplings$ricedumplingsbottle.name=цзунцзы с вяленой свининой
items.food.ricedumplings$ricedumplingsbottle.desc=Цзунцзы - символ праздничного, поэтому съев их можно насытится и мгновенно избавиться от большинства негативных эффектов, причем разные цзунцзы имеют свои особые эффекты.\n\nВкусив такой цзунцзы, можно получить постоянный бонус к силе, пропитаться землей и фосфорным огнем. [\n\nС праздником! [


items.weapon.missiles.darts.halodart.name=фосфорный дротик
items.weapon.missiles.darts.halodart.desc=Эти дротики, покрытые веществом на основе Пламецвета, при попадании загораются ярким фосфорным пламенем.

items.weapon.missiles.darts.lightdart.name=сияющий дротик
items.weapon.missiles.darts.lightdart.desc=Эти дротики, покрытые веществом на основе Молниоцвета, благословляют цель при попадании.

items.scrolls.exotic.scrollofaffection.name=свиток Очарования
items.scrolls.exotic.scrollofaffection.desc=При прочтении этот свиток издаст соблазняющий смех, который очарует всех, кто его услышит.

items.scrolls.exotic.scrollofconfusion.name=свиток Замешательства
items.scrolls.exotic.scrollofconfusion.desc=При прочтении вслух этот свиток наложит чары на всех в зоне видимости, ослепляя и дезориентируя их.

items.scrolls.exotic.scrollofpetrification.name=свиток Окаменения
items.scrolls.exotic.scrollofpetrification.desc=Вспышка красного света наполнит разумы всех существ в поле зрения таким сильным ужасом, что они просто застынут на месте.

items.potions.exotic.potionofdragonkingbreath.name=龙王吐息合剂
items.potions.exotic.potionofdragonkingbreath.prompt=选择要燃磷的位置
items.potions.exotic.potionofdragonkingbreath.desc=瓶子内奇特的化合物会在接触口腔后爆燃。迅速吐出液体就能让使用者从口中喷射磷火！

items.potions.elixirs.elixirofdragonking.name=эликсир Королевского дракона
items.potions.elixirs.elixirofdragonking.desc=Будучи выпитым, эликсир наделит героя силой фосфорного огня, протекающей по его венам. Этот эффект подарит ему иммунитет к любому огню и позволит поджигать врагов своими ударами, накладывая на них фосфорный огонь.

items.potions.potionofliquidflamex.name=зелье Фосфорного огня
items.potions.potionofliquidflamex.desc=Этот сосуд содержит сверхнестабильный реактив, который при малейшем контакте с воздухом резко загорается, поджигая всё вокруг.\n\n_Оно опаснее и смертоноснее, чем обычное зелье алхимического огня!_


items.potions.potionoflightningshiledx.name=зелье Молнии
items.potions.potionoflightningshiledx.desc=Это зелье сочетает в себе комплексный электризованный химикат и свойства молниоцвета, позволяя владельцу получить полный иммунитет к электричеству на некоторое время.


#MLPDSHOPREADYGO!!!
items.food.potionoflightningshiled.name=молниезащитный отвар
items.food.potionoflightningshiled.desc=Глоток этой электризованной сладкой жидкости наполнит вас огромной энергией, ненадолго получив полную неуязвимость к электричеству. 
items.food.potionoflightningshiled.ac_oat=ВЫПИТЬ
items.food.potionoflightningshiled.look_msg=Вы чувствуете, как электрический ток проходит по всему телу...

items.potions.exotic.potionoflightstromcloud.name=зелье Грозовых молний
items.potions.exotic.potionoflightstromcloud.desc=Странная и нестабильная энергия, таящаяся внутри пузырька, исходит от энергии грома и молнии, которая позволяет своему обладателю на какое-то время обрести возможность повелевать громовой молнией, становясь самым _громовержцем_.

