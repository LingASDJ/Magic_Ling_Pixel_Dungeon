items.books.bookslist.elementyearbooks.anmazing=Разгадав тайну книги, вы познали силу стихий!

items.books.bookslist.icecitybooks.name=книга «Путешествие в Заледенелое святилище»
items.books.bookslist.icecitybooks.desc=Это большой город, расположенный в бывших ледниковых землях, которые, похоже, пережили период сильных холодов, и сейчас я могу стоять на этой земле.\n\nСейчас городом управляет таинственный человек. Все жители здесь ведут спокойный образ жизни и, кажется, довольны своей работой. Зимой, когда снежные дни и вот-вот конец декабря, жители проводят торжественную церемонию и всегда устраивают праздник.\n\nИ похоже, все давно забыли о том, что произошло триста лет назад...
items.books.bookslist.icecitybooks.author=-Автор: LunRes.
items.books.bookslist.icecitybooks.ac_read=ПРОЧИТАТЬ
items.books.bookslist.icecitybooks.blees=Прочитав книгу, вы чувствуете вдохновение!
items.books.bookslist.icecitybooks.anmazing=Разгадав тайну книги, вы познали силу огня!

items.books.bookslist.deepbloodbooks.name=книга «Бездна Демонического города»
items.books.bookslist.deepbloodbooks.desc=Эта книга предназначена только для справки и может содержать много личных мыслей.\n\n...В демонический город пришла некая молодая девушка, и ей удалось вновь возродить его. ...Три дня спустя группа расследовавшая подземелье прислала отчет о сильном магическом всплеске в глубине подземелья.\n\nНазвание подземелья: ???.\nМагическая сила: DEAD.\nПредпринятые меры: Нет.\nОценка опасности: DEADNOBACK.\n...Вышеуказанный отчет об оценке предназначен только для справки.
items.books.bookslist.deepbloodbooks.author=-Автор: Dr.BloodMoon.
items.books.bookslist.deepbloodbooks.ac_read=ПРОЧИТАТЬ
items.books.bookslist.deepbloodbooks.blees=Прочитав книгу, вы чувствуете вдохновение!
items.books.bookslist.deepbloodbooks.anmazing=Разгадав тайну книги, вы познали силу враждебности!

items.books.bookslist.grasskingbooks.name=книга «Кодекс Священных джунглей»
items.books.bookslist.grasskingbooks.desc=1. В случае стихийного бедствия или техногенной катастрофы, ненужно паниковать. У нас достаточно сил, чтобы защитить вас.\n\n2. Просим всех жителей, держатся подальше в лесу от цветочного сада, который является залом совещаний поверхностных властителей высшего совета.\n\n...5. Пожалуйста, приводите своих новорожденных детей к цветочному источнику для крещения, чтобы они смогли обрести магическую силу.\n\n...7. Чужестранцы, путешественники или переселенцы, пожалуйста не вмешивайтесь во то, что кажется вам унизительным, высокомерным, бездушным, безжалостным, эгоистичным и неравноправным, все, что здесь происходит, естественно, не пытайтесь что-то изменить и чтите наш образ жизни.\n\n8. Другие правила будут добавлены на тринадцатом собрании высшего совета.
items.books.bookslist.grasskingbooks.author=-Автор: Peony Lohua.
items.books.bookslist.grasskingbooks.ac_read=ПРОЧИТАТЬ
