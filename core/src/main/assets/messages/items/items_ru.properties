items.armor.armor.stats_desc=

items.scrolls.extra.scrollofteletation.inv_title=Превратить предмет
items.scrolls.extra.scrollofteletation.name=превращение Золотой бабочки
items.scrolls.extra.scrollofteletation.desc=Этот свиток внешне очень схож на свиток Золотой бабочки, но имеет похожий эффект, что и у свитка Превращения. При использовании свиток превращает любой предмет, улучшая и проклиная при этом. \n\nИнтересно, можно ли с помощью его сделать зелье +1?\n\nУчтите, покидая 0 этаж, свиток автоматически исчезнет...

items.scrolls.extra.scrollofsoul.name=свиток Души
items.scrolls.extra.scrollofsoul.desc=Этот свиток таит в себе ужасающую мощь души, достаточной для того, чтобы дать читателю могущественную и длительную силу, даруя на _%s ходов_ возвышения души.\n\nОднако без подпитки магией создателя он стремительно утрачивает свою силу, поэтому _каждые 20 ходов, длительность эффекта сокращается на 1 ход_.\n\nПоскольку этот свиток отмечен особым знаком, его не требуется опознавать на подлинность.
items.scrolls.extra.scrollofsoul$upgradesoul.name=вознесение души
items.scrolls.extra.scrollofsoul$upgradesoul.desc=Наделяет иммунитетом ко всем негативным эффектам (_за исключением голода и потерянного рюкзака_), и удваивает скорость атаки и передвижения.\n\nПостоянно увеличивает атаку на 2%% и снижение урона на 2%%, но останавливается достигнув своего максимума на 90%%.\n\nХодов осталось: %s.\nБонус к атаке: %s%%.\nБонус к снижению урона: %s%%.


items.quest.devitem.magicbook.name=неиссякаемый сборник историй
items.quest.devitem.magicbook.desc=На нем записано много незавершенных историй, некоторые только начались, а некоторые близки к концу. Судя по временным меткам, указанным на страницах книги, создается впечатление, что кто-то дополняет те истории каждый день. \n\nНа последней странице кем-то оставлены несколько слов, которые, очевидно, были написаны только что: _«Все кто это читает, пожелайте мне счастливого дня рождения, мяу!!!»_\n\nНошение этого предмета дает особые эффекты при движении ночью. Период действия с 14.05 по 21.05 каждого года (по григорианскому календарю).

items.quest.skinitem$skin_wa.name=Спортивный костюм
items.quest.skinitem$skin_wa.desc=Один из личных нарядов Воина, светло-голубой наряд символизирует его оптимистичный и жизнерадостный характер, можно с уверенностью сказать, что в подземелье будет очень комфортно в этом наряде.

items.quest.skinitem$skin_ma.name=Экзотический костюм
items.quest.skinitem$skin_ma.desc=Один из личных нарядов Мага, таинственный фасон создает некое неуловимое ощущение, очаровательного и привлекательное чувство, проникающее повсюду, даже монстры впадают в оцепенение увидев его.

items.quest.skinitem$skin_ra.name=Теневой костюм
items.quest.skinitem$skin_ra.desc=Один из личных нарядов Разбойника, считается что это облачение отлично подошло под её внешней вид, когда она решила сбрить волосы, еще будучи в королевской семьи. Это облачение также является её единственным королевским нарядом.

items.quest.skinitem$skin_ha.name=Ведьмовский костюм
items.quest.skinitem$skin_ha.desc=Один из личных нарядов Охотницы, который подражает внешнему виду некого человека, а королевские монеты в её руке создают впечатление, что она действительно владеет ведьмовской магией, но на самом деле секретным оружием является её владение волшебным луком.

items.quest.skinitem$skin_da.name=Неизвестная ошибка
items.quest.skinitem$skin_da.desc=???, Что это такое? Странная одежда Дуэлянта, которая как считается, называется «Заполнителем».

items.quest.skinitem$skin_wb.name=Саяка Мики
items.quest.skinitem$skin_wb.desc=Играйте за «Саяка Мики», девочку-волшебницу из Puella Magi Madoka Magica.

items.quest.skinitem$skin_mb.name=Мадока Канамэ
items.quest.skinitem$skin_mb.desc=Играйте за «Мадока Канамэ», девочку-волшебницу из Puella Magi Madoka Magica.

items.quest.skinitem$skin_rb.name=Хомура Акэми
items.quest.skinitem$skin_rb.desc=Играйте за «Хомура Акэми», девочку-волшебницу из Puella Magi Madoka Magica.

items.quest.skinitem$skin_hb.name=Мами Томоэ
items.quest.skinitem$skin_hb.desc=Играйте за «Мами Томоэ», девочку-волшебницу из Puella Magi Madoka Magica.

items.quest.skinitem$skin_db.name=Кёко Сакура
items.quest.skinitem$skin_db.desc=Играйте за «Кёко Сакура», девочку-волшебницу из Puella Magi Madoka Magica.

items.quest.skinitem$skin_wc.name=Белоснежная роза
items.quest.skinitem$skin_wc.desc=Среди переливающихся багряных и лазурных оттенков наряда, и опущенного окровавленного лезвия алебарды, на вечернем пиру расцветет белоснежная роза в глазах публики.

items.quest.skinitem$skin_mc.name=Академические воспоминания
items.quest.skinitem$skin_mc.desc=Униформа, которую магичка носила, когда училась в Магической академии, где была одной из лучших учениц. Ходили слухи, что она частенько уединялась в самых дальних уголках библиотеки, изучая древние заклинания, которые давно считались утраченными...

items.quest.skinitem$skin_rc.name=Сумеречное пиршество
items.quest.skinitem$skin_rc.desc=Под этой приветливой улыбкой, скрывается предательство, и когда обнажится смертоносный клинок, этой ночью прольется кровь.

items.quest.skinitem$skin_hc.name=Образец скина
items.quest.skinitem$skin_hc.desc=Этот скин был удален из-за ряда причин. Если у вас есть оригинальные скины, которые вы хотите предложить, свяжитесь с командой разработчиков Magic Ling.

items.quest.skinitem$skin_dc.name=Горничная лисичка⁠
items.quest.skinitem$skin_dc.desc=Кофе у камина уже готово! Не желаете ли отдохнуть и выпить чашечку, господин?

items.quest.skinitem$skin_dd.name=Клеопатра
items.quest.skinitem$skin_dd.desc=Горячий ветер пустыни доносит едва уловимый блеск золотых украшений, королева оазиса ждет вашего прибытия.

items.quest.skinitem$skin_md.name=Тихая ночь
items.quest.skinitem$skin_md.desc=На рассвете, после решающей битвы среди звезд, главный герой очнулся от кошмара и обнаружил рядом с подушкой незнакомый наряд. Слабое, еще не угасшее тепло ткани напоминало о давней подруге, исчезнувшей в разломе между мирами, которую больше не встретить среди звезд.

items.quest.skinitem$skin_wf.name=Девушка-кролик 
items.quest.skinitem$skin_wf.desc=В иной реальности, где нет магии и проклятия, а царят современные технологии и безграничные возможности. Среди сияния неоновых огней она больше не облачается в боевые доспехи, наслаждается обретенным теплом обыденной жизни.

###trinkets
items.trinkets.chaoticcenser.name=хаотичное кадило
items.trinkets.chaoticcenser.desc=Побывав в котле какое-то время, это кадило для благовоний начало создавать дым само по себе! Эти газы накапливаются и будут выбрасываться из кадила в произвольных направлениях и полуслучайных интервалах. Судя по всему, оно способно производить все виды газов, но положение, в котором они вылетают, похоже, больше в ваших интересах.
items.trinkets.chaoticcenser.typical_stats_desc=Обычно этот аксессуар будет производить поблизости вредный газ каждые _%d_ ходов. Газ появляется чаще, когда поблизости враги, и меньше в тесных пространствах. При более высоких уровнях эти газы будут более экзотическими и мощными.
items.trinkets.chaoticcenser.stats_desc=На данном уровне этот аксессуар будет производить поблизости вредный газ каждые _%d_ ходов. Газ появляется чаще, когда поблизости враги, и меньше в тесных пространствах. При более высоких уровнях эти газы будут более экзотическими и мощными.

items.trinkets.dimensionalsundial.name=межпространственные солнечные часы
items.trinkets.dimensionalsundial.warning=Солнечные часы перестали отбрасывать тень. Вы ощущаете тревогу.
items.trinkets.dimensionalsundial.desc=Эти портативные солнечные часы каким-то образом способны отбрасывать тень в глубинах подземелья, даже если вы не держите их правильно. Еще более странно положение тени, которая, похоже, не имеет никакого отношения к солнцу в этом мире. Когда тень не отбрасывается, кажется, что солнечные часы привлекают опасность.
items.trinkets.dimensionalsundial.typical_stats_desc=Обычно этот аксессуар уменьшает количество противников днём (8:00-20:00) на _%1$d%%_ и увеличивает ночью (20:00-8:00) на _%2$d%%_.
items.trinkets.dimensionalsundial.stats_desc=На данном уровне этот аксессуар уменьшает количество противников днём (8:00-20:00) на _%1$d%%_ и увеличивает ночью (20:00-8:00) на _%2$d%%_.

items.trinkets.exoticcrystals.name=экзотические кристаллы
items.trinkets.exoticcrystals.desc=Эти мелкие розоватые кристаллы имеют такую же форму, что и кристаллы алхимической энергии. Хотя их и нельзя напрямую использовать для получения энергии, те, видимо, каким-то образом влияют на зелья и свитки, которые вы находите.
items.trinkets.exoticcrystals.typical_stats_desc=Обычно этот аксессуар будет заменять _%s%%_ появляющихся зелий и свитков их особыми версиями. Эффект не затрагивает зелья Силы, свитки Улучшения и предметы, которые требуются для решения головоломок.
items.trinkets.exoticcrystals.stats_desc=На текущем уровне этот аксессуар будет заменять _%s%%_ появляющихся зелий и свитков их особыми версиями. Эффект не затрагивает зелья Силы, свитки Улучшения и предметы, которые требуются для решения головоломок.

items.trinkets.eyeofnewt.name=глаз тритона
items.trinkets.eyeofnewt.desc=Этот золотисто-черный глаз тритона — обычный ингредиент, теперь превращённый в аксессуар. Глаз, по-видимому, ухудшает зрение в обмен на то, что позволяет видеть вещи по-другому.
items.trinkets.eyeofnewt.typical_stats_desc=Обычно этот аксессуар уменьшает дальность обзора на _%1$s%%_, но также даёт возможность ментально видеть врагов в пределах _%2$d_ клеток.
items.trinkets.eyeofnewt.stats_desc=На текущем уровне этот аксессуар уменьшит дальность обзора на _%1$s%%_, но также даст возможность ментально видеть врагов в пределах _%2$d_ клеток.

items.trinkets.mimictooth.name=зуб мимика
items.trinkets.mimictooth.desc=Видимо, этот огромный клык вырвали у неудачливого мимика. Кажется, он каким-то образом влияет на мимиков, из-за чего они появляются чаще и становятся опаснее.
items.trinkets.mimictooth.typical_stats_desc=Обычно этот аксессуар призывает мимиков в _%1$s_ раз чаще, но сделает их обнаружить, а также увеличит выпадение предметов с них. Кроме того, на каждом уровне будет шанс появления очень скрытных эбонитовых мимиков, равный _%2$s%%_.
items.trinkets.mimictooth.stats_desc=На данном уровне этот аксессуар призывает мимиков в _%1$s_ раз чаще, но сделает их сложнее обнаружить, а также увеличит выпадение предметов с них. Кроме того, на каждом уровне будет шанс появления очень скрытных эбонитовых мимиков, равный _%2$s%%_.

items.trinkets.mossyclump.name=комок мха
items.trinkets.mossyclump.desc=Этот сгусток мокрого мха остаётся влажным, как сильно вы бы его не сжимали. Судя по всему, он магически связан с самим подземельем, из-за чего вода и трава будут появляться чаще.
items.trinkets.mossyclump.typical_stats_desc=Как правило, из-за этого аксессуара _%d%%_ обычных этажей заполняются водой или травой.\n\nУлучшение этого аксессуара требует очень большого количества энергии.
items.trinkets.mossyclump.stats_desc=На текущем текущем уровне этот аксессуар заполнит _%d%%_ обычных этажей либо водой, либо травой.\n\nУлучшение этого аксессуара требует очень большого количества энергии.

items.trinkets.parchmentscrap.name=обрывок пергамента
items.trinkets.parchmentscrap.desc=Этот маленький клочок пергамента выглядит так, будто его вырезали из свитка. Он сохранил часть своей магии, и, похоже, влияет на оружие и доспехи, найденные в подземелье.
items.trinkets.parchmentscrap.typical_stats_desc=Как правило, этот аксессуар делает зачарования и руны _%d_ обычными, а проклятия на оружии и доспехах _%s_ такими же обычными. Проклятия на палочки, кольца или артефакты не действуют.\n\nУлучшение этого аксессуара требует очень большого количества энергии.
items.trinkets.parchmentscrap.stats_desc=На текущем уровне этот аксессуар сделает зачарования и руны _%d_ обычными, а проклятия на оружии и доспехах _%s_ такими же обычными. Проклятия на палочки, кольца или артефакты не действуют.\n\nУлучшение этого аксессуара требует очень большого количества энергии.

items.trinkets.petrifiedseed.name=окаменевшее семя
items.trinkets.petrifiedseed.desc=Это семя превратилось в окаменелость либо в результате медленных геологических процессов, либо с помощью магии. Похоже, что семя магическим образом влияет на флору подземелья, иногда заменяя семена растений руническими камнями.
items.trinkets.petrifiedseed.typical_stats_desc=Этот аксессуар сделает так, что из растоптанной травы будут выпадать рунные камни вместо семян в _%1$s%%_ случаев. Он так же увеличит шанс выпадения предметов из высокой травы на _%2$s%%_.
items.trinkets.petrifiedseed.stats_desc=На текущем уровне этот аксессуар сделает так, что из растоптанной травы будут выпадать рунные камни вместо семян в _%1$s%%_ случаев. Он так же увеличит шанс выпадения предметов из высокой травы на _%2$s%%_.

items.trinkets.ratskull.name=череп крысы
items.trinkets.ratskull.desc=Этот жутковатый аксессуар не намного больше черепа обычной крысы, что является большой редкостью в этом подземелье. Магическое влияние черепа, похоже, привлекает более редких обитателей подземелья, заставляя их появляться гораздо чаще.
items.trinkets.ratskull.typical_stats_desc=Как правило, этот аксессуар увеличит шанс появления особых врагов в _%d_ раз. Однако череп в два раза менее эффективен в привлечении кристаллических мимиков и живых статуй.
items.trinkets.ratskull.stats_desc=На текущем уровне этот аксессуар увеличит шанс появления особых врагов в _%d_ раз. Однако череп в два раза менее эффективен в привлечении кристаллических мимиков и живых статуй.

items.trinkets.saltcube.name=куб соли
items.trinkets.saltcube.desc=Этот крупный кристалл соли был вырезан в форме почти идеального куба, и ему каким-то образом удалось слить половину воды из алхимического котла вместо того, чтобы раствориться. Кажется, что это волшебным образом обезвоживает и сохраняет пищу, которую вы едите, продлевая чувство сытости, но также уменьшая восстановление вашего здоровья, когда вы не голодаете.
items.trinkets.saltcube.typical_stats_desc=Как правило, этот аксессуар увеличит ваше время сытости на _%1$s%%_, но уменьшит эффективность восстановления здоровья на _%2$s%%_.
items.trinkets.saltcube.stats_desc=На текущем уровне этот аксессуар увеличит ваше время сытости на _%1$s%%_, но уменьшит эффективность восстановления здоровья на _%2$s%%_.

items.trinkets.crackedspyglass.name=сломанная подзорная труба
items.trinkets.crackedspyglass.desc=Этот ручной телескоп был бы демонстрацией великой и тонкой работы, не будь у него трещины в передней линзе. Подзорная труба, кажется, помогает, раскрывая новые предметы в подземелье. Но из-за ее изъяна, раскрытые предметы не очень просто увидеть!
items.trinkets.crackedspyglass.typical_stats_desc=Обычно этот аксессуар имеет _%1$s%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса.
items.trinkets.crackedspyglass.stats_desc=На текущем уровне этот аксессуар имеет _%1$s%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса.
items.trinkets.crackedspyglass.stats_desc_upgraded=На текущем уровне этот аксессуар имеет _100%% шанс_ создать дополнительный скрытый предмет на каждом этаже без босса, а также _%1$s%% шанс_ на создание второго дополнительного скрытого предмета.

items.trinkets.ferrettuft.name=мех хорька
items.trinkets.ferrettuft.desc=Пучок шелковистого белого меха хорька, скреплённый лаймово-зелёной лентой, завязанной в бант. Хорьки известны своим проворством, озорством и отсутствием добросовестности. Часть этой энергии исходит от аксессуара, увеличивая уклонение всего вокруг.
items.trinkets.ferrettuft.typical_stats_desc=Обычно этот аксессуар увеличивает уклонение всех персонажей на _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=На текущем уровне этот аксессуар увеличивает уклонение всех персонажей на _%1$s%%_.

items.trinkets.shardofoblivion.name=осколок небытия
items.trinkets.shardofoblivion.desc=После варки в алхимическом котле этот маленький осколок проклятого металла превратился в... ничто? Кажется, что свет огибает его, и он парит на месте, когда вы его не держите. Осколок, похоже, волшебным образом черпает силу из вашего невежества, так что, наверное, лучше не думать об этом слишком много.
items.trinkets.shardofoblivion.typical_stats_desc=Как правило, этот аксессуар увеличит шанс выпадения сокровищ из врагов на 12,5%% за каждый неопознанный предмет, что вы экипировали или недавно использовали, вплоть до _%d предметов_. Осколок так же предотвращает автоматическое опознание экипировки, но его можно использовать, чтобы вручную опознать предметы, которые готовы к этому.
items.trinkets.shardofoblivion.stats_desc=На текущем уровне этот аксессуар увеличит шанс выпадения сокровищ из врагов на 12.5%% за каждый неопознанный предмет, что вы экипировали или недавно использовали, вплоть до _%d предметов_. Осколок так же предотвращает автоматическое опознание экипировки, но его можно использовать, чтобы вручную опознать предметы, которые готовы к этому.
items.trinkets.shardofoblivion.ac_identify=ОПОЗНАТЬ
items.trinkets.shardofoblivion.identify_prompt=Опознать предмет
items.trinkets.shardofoblivion.identify_ready=Предмет %s готов стать опознанным.
items.trinkets.shardofoblivion.identify_not_yet=Этот предмет ещё не готов быть опознанным.
items.trinkets.shardofoblivion.identify=Вы опознали предмет!
items.trinkets.shardofoblivion$wandusetracker.name=Использована неопознанная палочка
items.trinkets.shardofoblivion$wandusetracker.desc=Вы недавно использовали неопознанную волшебную палочку, которая на некоторое время считается частью неопознанного снаряжения, используемого осколком небытия.\n\nХодов осталось: %s.

items.trinkets.thirteenleafclover.name=тринадцатилистный клевер
items.trinkets.thirteenleafclover.desc=Каким-то образом при варке в алхимическом котле у этого клевера выросла куча дополнительных листьев! На самом деле не совсем понятно, приносит ли этот аксессуар удачу или нет, возможно, этот клевер сделает вашу удачу более хаотичной?
items.trinkets.thirteenleafclover.typical_stats_desc=Обычно, при нанесении и блокировке урона, игра чаще выбирает средние значения. Как правило, этот аксессуар имеет шанс в _%d%%_ изменить это, выбирая значения ближе к максимуму и минимуму.\n\nЭтот аксессуар требует относительно мало энергии для улучшения.
items.trinkets.thirteenleafclover.stats_desc=Обычно, при нанесении и блокировке урона, игра чаще выбирает средние значения. На данном уровне этот аксессуар имеет шанс в _%d%%_ изменить это, выбирая значения ближе к максимуму и минимуму.\n\nЭтот аксессуар требует относительно мало энергии для улучшения.

items.trinkets.trapmechanism.name=механизм ловушки
items.trinkets.trapmechanism.desc=Основной механизм одной из ловушек в подземелье, аккуратно вырезанный в полу, чтобы его можно было переносить. Кажется, что он магическим образом связан с самим подземельем, что делает местность более опасной для вас и обитателей подземелья. 
items.trinkets.trapmechanism.typical_stats_desc=Как правило, этот аксессуар повысит шанс появления этажей с ловушками или пропастями на _%d%%_.\n\nЭтот аксессуар требует относительно мало энергии для улучшения.
items.trinkets.trapmechanism.stats_desc=На данном уровне этот аксессуар повысит шанс появления этажей с ловушками или пропастями на _%d%%_.\n\nЭтот аксессуар требует относительно мало энергии для улучшения.

items.trinkets.vialofblood.name=флакон крови
items.trinkets.vialofblood.desc=Этот тонкий флакон содержит кровь какого-то обитателя подземелья, она медленно перемещается, когда вы вращаете флакон. Похоже, что это волшебным образом усиливает целебные эффекты, но также их замедляет.
items.trinkets.vialofblood.typical_stats_desc=Как правило, этот аксессуар увеличивает общее количество здоровья, которое вы получаете, выпивая целебные зелья, бурдюки с водой или колодцы здоровья, на _%1$s%%_. Однако эти лечебные эффекты также проявляются медленнее, восстанавливая максимум _%2$s_ здоровья за ход (это зависит от уровня героя).
items.trinkets.vialofblood.stats_desc=На текущем уровне этот аксессуар увеличит общее количество здоровья, которое вы получаете, выпивая целебные зелья, бурдюки с водой или колодцы здоровья, на _%1$s%%_. Однако эти лечебные эффекты также будут проявляться медленнее, восстанавливая максимум _%2$s_ здоровья за ход (это зависит от уровня героя).

items.trinkets.wondrousresin.name=чудотворная смола
items.trinkets.wondrousresin.desc=Эта мерцающая голубая смола, по-видимому, содержит в себе дистиллированную эссенцию магии проклятой палочки. Магия алхимического котла, видимо, несколько стабилизировала ее, и теперь она воздействует на ваши палочки.
items.trinkets.wondrousresin.typical_stats_desc=Как правило, это аксессуар сделает эффекты проклятой палочки нейтральными или положительными в _%1$s%%_ случаев, а так же при выстрелах не проклятыми палочками, те будут в _%2$s%%_ случаев выстреливать нейтральным или положительным проклятым зарядом.\n\nУлучшение этого аксессуара требует относительно большого количества энергии.
items.trinkets.wondrousresin.stats_desc=На текущем уровне это аксессуар сделает эффекты проклятой палочки нейтральными или положительными в _%1$s%%_ случаев, а так же при выстрелах не проклятыми палочками, те будут в _%2$s%%_ случаев выстреливать нейтральным или положительным проклятым зарядом.\n\nУлучшение этого аксессуара требует относительно большого количества энергии.

items.trinkets.trinketcatalyst.name=магический катализатор
items.trinkets.trinketcatalyst.window_text=Как только вы добавляете катализатор, вода в котле начинает сиять. Выберите один из предметов, чтобы наполнить его энергией и превратить в магический аксессуар.
items.trinkets.trinketcatalyst.desc=Этот золотистый комок пыли сверкает во тьме подземелья. Такой катализатор можно объединить с небольшим количеством алхимической энергии, чтобы создать уникальный аксессуар.\n\nАксессуары дают различные эффекты, которые помогают немного разнообразить подземелье и его обитателей. Аксессуары можно улучшить при помощи энергии, чтобы сделать их эффекты более сильными. Если вы хотите полностью избавиться от их эффектов, то аксессуары достаточно просто выбросить.
items.trinkets.trinketcatalyst$randomtrinket.name=случайный аксессуар
items.trinkets.trinketcatalyst$randomtrinket.desc=Один из предметов, находящихся поблизости, спрятан в мешочке, который вы не можете открыть.\n\nВ процессе алхимии мешочек растворится, но вы не узнаете, какой аксессуар получите, пока не сделаете его!

items.trinkets.trinket$placeholder.name=аксессуар

###FD
items.quest.lingjing.name=призма
items.quest.lingjing.desc=Когда призма находится вашем в рюкзаке, она накладывает 75 единиц щита каждые 20 ходов при полном здоровье.\n\nЭффект призмы действует до тех пор, пока не достигнута максимальная глубина после 10 этажа.

items.quest.smalllightheader.name=мерцающий путеводитель
items.quest.smalllightheader.desc=Удачные эксперименты приводят к хорошим результатам, и этот малютка, появившийся на свет из алхимического котла, помогает отыскивать своему владельцу вход на следующий этаж.
items.quest.smalllightheader.ac_summonfish=ПРИЗВАТЬ
items.quest.smalllightheader.thanks=_-_ Дизайн: Шуй Иньдэн.\n_-_ Тематика: Алхимический рай.\n_-_ Награда: _Премия Фэйянь_ - Второе место. [ \n_-_ Соревнование: 1-й конкурс DIY за кубок Цзинхун. [


items.quest.clearcrystal.name=тусклый осколок чистого кристалла
items.quest.clearcrystal.desc=До сих пор не ясно, для какой цели может служит осколок, найденный в могиле красных мечей...

items.quest.clearhstal.name=синий осколок чистого кристалла
items.quest.clearhstal.desc=После сражения с лавовым драконом ранее тусклый осколок стал светлым... Что это может означать?

items.quest.dragonheart.name=Сердце Лавового дракона 
items.quest.dragonheart.desc=Сердце лавового дракона все еще немного горячо на ощупь.\n\nНа нем также остались некие следы порчи...

items.weapon.melee.dragonshiled.name=чешуя дракона
items.weapon.melee.dragonshiled.typical_stats_desc=Обычно это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.dragonshiled.stats_desc=Это оружие блокирует от 0 до %d урона. Этот блок зависит от уровня оружия.
items.weapon.melee.dragonshiled.desc=Часть чешуи лавового дракона, тепло которое никогда не рассеивается. К счастью, задняя сторона чешуи не очень горячая и её можно использовать в качестве щита. Когда вы держите её в руке, вы ощущаете, как вас защищает таинственная магия.
items.weapon.melee.dragonshiled.ability_name=защититься
items.weapon.melee.dragonshiled.ability_desc=Дуэлянт может _защитить_ себя чешуей дракона, становясь полностью неуязвимой к следующей физической или магической атаке в течение 10 ходов.

#### THANKS-第一届惊鸿杯 ####
items.weapon.melee.thanks.grilledherring.name=жареная сельдь
items.weapon.melee.thanks.grilledherring.desc=Его зажаренный аромат переполняет воздух, он такой сочный и теплый. Хоть это и выглядит очень аппетитно, вы почти уверены, что это действительно оружие, а не обычная зажаренная рыба на гриле.
items.weapon.melee.thanks.grilledherring.typical_stats_desc=Вы можете откусывать эту жареную селедку _%d раз_, чтобы получить 50 сытости, и после того, как все её съедобные места пропадут, она превратится в рыбную кость.\n\nЭто оружие можно есть, только когда оно _опознано и не проклято._ }\nКаждое улучшение увеличивает её размер на еще 1 укус. }
items.weapon.melee.thanks.grilledherring.ac_eatfish=ОТКУСИТЬ
items.weapon.melee.thanks.grilledherring.eat_msg=Это оружие такое ароматное, что вы не удержались и откусили кусочек. Хотя оно и не наполнило ваш желудок, но оно по крайней мере, утолило голод...
items.weapon.melee.thanks.grilledherring.stats_desc=Аромат рыбы был настолько аппетитный, что вы не сдержали свой голод, и после от её осталась только рыбная кость. Хотя она уже не такая острая, как раньше, её атаки теперь способны вызвать кровотечение с { 50% уроном от нанесенного урона { по противнику. }\n\nЕсли улучшить оружие сейчас, улучшение увеличит её размер для еще 1 укуса. }
items.weapon.melee.thanks.grilledherring.thanks=_-_ Дизайн: W.\n_-_ Тематика: Закаленная сталь.\n_-_ Награда: _Премия Цзинхун_ - Первое место. [ \n_-_ Соревнование: 1-й конкурс DIY за кубок Цзинхун. [
items.weapon.melee.thanks.grilledherring.ability_name=рассечь
items.weapon.melee.thanks.grilledherring.typical_ability_desc=Дуэлянт может _рассечь_ врага жареной сельдью. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
items.weapon.melee.thanks.grilledherring.ability_desc=Дуэлянт может _рассечь_ врага жареной сельдью. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.

#支援信号套组
items.thanks.distresssignalnesting.name=набор сигналов поддержки
items.thanks.distresssignalnesting.desc=Отряд из трех легендарных снайперов продавало это снаряжение в этом районе. \n\nКогда вы подожжёте кристалл и запускаете в небо имеющиеся ракету, они выйдут из тени к вам на помощь. Плата за вызов - стоимость этой маленькой шкатулки. Их поддержка стоит _500 золотых монет_.
items.thanks.distresssignalnesting.level_0=Дубовая шкатулка с волшебным кристаллом. Не забудьте активировать кристалл перед запуском сигнальной ракеты, иначе это будет в пустую.\nТорговец может улучшит его для вас.\nСигнальные ракеты можно изготовить из зелья алхимического огня, зелья левитации и нестабильного экстракта.
items.thanks.distresssignalnesting.level_1=По сравнению со обычной шкатулкой, в дополнение к тому, что хрусталь в шкатулке стал более прозрачным, края деревянной шкатулки также стали инкрустированными золотыми узорами.
items.thanks.distresssignalnesting.level_2=Шкатулка из красного дерева с тонкой резьбой, внутри которой лежит красный магический кристалл, обернутый бархатом.
items.thanks.distresssignalnesting.level_3=Хрустальная шкатулка с тонкой резьбой, внутри которой лежит красный магический кристалл, обернутый бархатом. На обратной стороне шкатулки указано, что они предоставляют специальную скрытую упаковку для платинового коллекционного издания.

items.thanks.distresssignalnesting.spawn_flare_bag=Откуда ни возьмись прилетели сигнальные ракеты и угодили прямо в ваш рюкзак.
items.thanks.distresssignalnesting.spawn_flare_foot=Откуда ни возьмись прилетели сигнальные ракеты и упали прямо у ваших ног.

items.thanks.distresssignalnesting.ac_fire=ЗАПУСТИТЬ РАКЕТУ
items.thanks.distresssignalnesting.fire_0=Cнайпер Парето: Замедленная цель не убежит!
items.thanks.distresssignalnesting.fire_1=Cнайпер Мадо: Сигнал получен, мы в пути.
items.thanks.distresssignalnesting.fire_2=Cнайпер Сага: Эх, опять работа...

items.thanks.distresssignalnesting.ac_hunt=АКТИВИРОВАТЬ ОХОТУ
items.thanks.distresssignalnesting.hunt=Снайпер Парето: Моя любимая часть! Погнали!\nСнайпер Мадо: Приказ принят, выдвигаюсь на место для зачистки.\nСнайпер Сага: ...А я просто хочу домой, поспать...

items.thanks.distresssignalnesting.no_charge=Сигнальные ракеты закончились; пожалуйста, зарядите новые.
items.thanks.distresssignalnesting.hunt_unavailable=Для применения охоты требуется уровень +2 и выше, а также как минимум 1 заряд.
items.thanks.distresssignalnesting.need_to_equip=Сперва вам нужно экипировать этот предмет.
items.thanks.distresssignalnesting.no_gold=Недостаточно золотых монет, чтобы оплатить плату за вызов.
items.thanks.distresssignalnesting.no_kinggold=Недостаточно золотых купонов, чтобы оплатить плату за вызов.
items.thanks.distresssignalnesting.castle_unavailable=Набор сигналов поддержки нельзя использовать в старинном замке.
items.thanks.distresssignalnesting.castle_note=Они не могут оказывать поддержку за пределами мира смертных.
items.thanks.distresssignalnesting.thanks=_-_ Дизайн: Hacko'Tacko.\n_-_ Тематика: Алхимический рай.\n_-_ Награда: _Премия Цзинхун_ - Первое место. [ \n_-_ Соревнование: 1-й конкурс DIY за кубок Цзинхун. [

#信号弹
items.thanks.flarebullet.name=сигнальная ракета
items.thanks.flarebullet.desc=Запустите сигнальную ракету, чтобы запросить поддержку, увидев ваш сигнал о помощи, они сразу же придут к вам на помощь.\n\nВы можете создать предмет с помощью зелья алхимического огня, зелья левитации и нестабильного экстракта.
items.thanks.flarebullet.ac_load=ЗАРЯДИТЬ
items.thanks.flarebullet.no_device=Вы пока не обладаете набором сигналов поддержки.
items.thanks.flarebullet.full_charge=Магический кристалл был полон энергии и отказался заряжаться от сигнальной ракеты.
items.thanks.flarebullet.load_success=Сигнальная ракета рассыпалась в порошок и растворилась в магическом кристалле.

#狙击手的援护
items.thanks.snipersupport.name=снайперская поддержка
items.thanks.snipersupport.desc=Каждые 4 хода случайный противник в пределах вашего зрения получает выстрел от снайпера; тип урона выбирается случайным образом из трех вариантов, а величина урона зависит от текущего этажа. Если к моменту завершения перезарядки в поле зрения нет противников, эффект срабатывает в тот момент, когда враг появляется в поле зрения.\n\nОсталось выстрелов: %d.\nОсталось ходов до перезарядки: %s.

items.thanks.snipersupport.frost_hit_0=Cнайпер Парето: Замедленная цель не убежит!
items.thanks.snipersupport.frost_hit_1=Cнайпер Парето: Ага! В следующий раз получше прячься!
items.thanks.snipersupport.frost_hit_2=Cнайпер Парето: Вот и все! Теперь ему не уйти.

items.thanks.snipersupport.shock_hit_0=Cнайпер Мадо: Удачное попадание!
items.thanks.snipersupport.shock_hit_1=Cнайпер Мадо: Меткое попадание в цель!
items.thanks.snipersupport.shock_hit_2=Cнайпер Мадо: Отличное попадание в противника!
items.thanks.snipersupport.shock_player_0=Cнайпер Мадо: Ой, это вы здесь?… Простите.

items.thanks.snipersupport.burn_hit_0=Cнайпер Сага: Попал. Хорошо бы и отдохнуть…
items.thanks.snipersupport.burn_hit_1=Cнайпер Сага: Попал. Надо было взять с собой побольше припасов…
items.thanks.snipersupport.burn_hit_2=Cнайпер Сага: Попал. Может, пора вернуться?

#狩猎狂欢
items.thanks.huntingcarnival.name=развлекающая охота
items.thanks.huntingcarnival.desc=Каждый ход трое снайперов стреляют своими стрелами по случайным врагам на текущем этаже; но каждый 1 ход противник становится целью только для одного типа стрел.\n\nХодов осталось: %d.\nХодов до восстановления снайперов: %d/%d/%d.

items.thanks.huntingcarnival.frost_hit_0=Снайпер Парето: Попал! Иди зализывай раны.
items.thanks.huntingcarnival.frost_hit_1=Cнайпер Парето: Ага! В следующий раз получше прячься!
items.thanks.huntingcarnival.frost_hit_2=Cнайпер Парето: Вот и все! Теперь ему не уйти.

items.thanks.huntingcarnival.shock_hit_0=Cнайпер Мадо: Удачное попадание!
items.thanks.huntingcarnival.shock_hit_1=Cнайпер Мадо: Меткое попадание в цель!
items.thanks.huntingcarnival.shock_hit_2=Cнайпер Мадо: Отличное попадание в противника!

items.thanks.huntingcarnival.burn_hit_0=Cнайпер Сага: Попал. Хорошо бы и отдохнуть…
items.thanks.huntingcarnival.burn_hit_1=Cнайпер Сага: Попал. Надо было взять с собой побольше припасов…
items.thanks.huntingcarnival.burn_hit_2=Cнайпер Сага: Попал. Может, пора вернуться?

items.thanks.trackableelectricity.desc=Здесь сверкают электрические разряды.
items.thanks.trackableelectricity.onedeath=Вы умерли от электрического тока...

#天界画笔
items.thanks.celestialbrush.name=небесная кисть
items.thanks.celestialbrush.desc=Эта кисть излучает цвета, давно канувшие в небытие. Поговаривают, что только она способна изобразить утраченных богов: ведь после смерти бога, его олицетворяющий цвет, которым он был овеян, также исчезает без следа.
items.thanks.celestialbrush.ac_paint=РИСОВАТЬ
items.thanks.celestialbrush.ac_ink=ЗАПРАВИТЬ
items.thanks.celestialbrush.prompt_flame_target=Выберите место для огненной стены
items.thanks.celestialbrush.thanks=_-_ Дизайн: Шуан Чэнь.\n_-_ Тематика: Секретное оружие.\n_-_ Награда: _Премия Фэйянь_ - Второе место. [ \n_-_ Соревнование: 1-й конкурс DIY за кубок Цзинхун. [

items.thanks.celestialbrush.desc_need=Возможно, магию самой кисти можно использовать для создания каких-то «рисунков», хотя её энергия ещё не до конца восстановилась. Может быть, вам стоит отдать дань уважения прошлому...
items.thanks.celestialbrush.desc_maxed=Используя присущую этой кисти магию, вы можете создавать «рисунки» так, как её волшебная сила полностью восстановлена. Выразив глубочайшее почтение, вы видите, как на кончике кисти вновь сияют все утраченные цвета.
items.thanks.celestialbrush.desc_cursed=Проклятая магия кисти сковывает вас воспоминаниями о прошлом, существенно притупляя восприятие окружающего мира. (Скорость опознания предметов и обнаружения ловушек снижена вдвое, а дальность обзора уменьшена на 1 клетку.)

items.thanks.celestialbrush.paint_title=Выбор рисунка
items.thanks.celestialbrush.paint_desc=Потратьте 1 заряд, чтобы высвободить один из утраченных цветов:
items.thanks.celestialbrush.paint_flame=Цвет древнего огня
items.thanks.celestialbrush.paint_frost=Цвет суровой зимы
items.thanks.celestialbrush.paint_sky=Цвет небосвода

items.thanks.celestialbrush.flame=Моток кисти взмахом разжигает обжигающее пламя.
items.thanks.celestialbrush.frost=Моток кисти укутывают местность зимним пейзажем.
items.thanks.celestialbrush.sky=Моток кисти окутал угасающий небосвод мглой.

items.thanks.celestialbrush.prompt_frost_target=Выберите место для метели

items.thanks.celestialbrush.prompt_lv0=Кисть желает воспоминание о холоде; предложите экстракт Снежного вихря.
items.thanks.celestialbrush.prompt_lv1=Кисть желает воспоминание о ужасе; преподнесите в дар искусное оружие. (Минимум 2-го уровня с +2 улучшением)
items.thanks.celestialbrush.prompt_lv2=Кисть желает воспоминание до её зарождения; пожертвуйте частью себя. (Ценой 20 максимального здоровья)
items.thanks.celestialbrush.prompt_lv3=Кисть желает воспоминание о роскоши; преподнесите в дар прекрасное кольцо. (Минимум с +2 улучшением)

items.thanks.celestialbrush.prompt_lv2_title=Самопожертвование
items.thanks.celestialbrush.prompt_lv2_desc=Кисть пытается восстановить воспоминания о времени до своего зарождения, заставляя вас отдать часть себя (ценой 20 максимального запаса здоровья).\n\nВы уверены, что хотите это сделать?
items.thanks.celestialbrush.confirm_yes=Пожертвовать
items.thanks.celestialbrush.confirm_no=Отменить

items.thanks.celestialbrush.hex=Вы настолько погрузились в свои воспоминания, что, не можете этого сделать.
items.thanks.celestialbrush.not_enough_hp=Вашей жизненной энергии недостаточно, чтобы принести жертву…
items.thanks.celestialbrush.invalid_item=Кисть не проявила интереса к этому предмету.
items.thanks.celestialbrush.upgrade_hp=Часть вас пробудила в кисти воспоминание о том прошлом, которое предшествовало появлению человечества;\nКогда вы опомнились, все ваше тело задрожало от холода.
items.thanks.celestialbrush.upgrade_1=Холод, заключённый в этом флаконе, пробудил в кисти воспоминание о том холодном прошлом;\nКогда вы опомнились, зелье уже растворилось в вашей памяти.
items.thanks.celestialbrush.upgrade_2=Острота лезвия этого оружия, пробудила в кисти воспоминание о том жестоком прошлом;\nКогда вы опомнились, острота этого оружия уже растворилась в вашей памяти.
items.thanks.celestialbrush.upgrade_4=Изысканное и сияющее кольцо пробудило в кисти воспоминание о том прошлом, когда боги ещё существовали;\nКогда вы опомнились, кольцо и его окрас уже растворилось в вашей памяти.\nИ всё же кисть вновь обрела свой истинный, ослепительный блеск.

items.thanks.celestialbrush.no_charge=Кисть исчерпала всю свою магическую силу…
items.thanks.celestialbrush.cursed=Магия кисти искажена темными мыслями, и вы не в силах сосредоточиться на рисовании…
items.thanks.celestialbrush.unequipped=Вам необходимо взять кисть в руки, чтобы её использовать.
############THANKS############

items.weapon.melee.seekingspear.name=копьё искателя
items.weapon.melee.seekingspear.stats_desc=Это оружие имеет крайне смертоносную атаку.\nЭто оружие имеет повышенную дальность атаки и обладает критическим ударом.
items.weapon.melee.seekingspear.desc=Багровое лезвие копья словно жаждет крови, и когда наконечник копья задрожал в ваших руках, вы еще больше убедитесь в этом.
items.weapon.melee.seekingspear.crit=Крит. удар
items.weapon.melee.seekingspear.ability_name=пронзить
items.weapon.melee.seekingspear.ability_desc=Дуэлянт, используя наконечник копья искателя, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.weapon.melee.seekingspear.typical_ability_desc=Дуэлянт, используя наконечник копья искателя, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака обычно наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.weapon.melee.seekingspear.prompt=Выберите цель в пределах досягаемости

### 墓志铭
items.heap.grave=Могила героя
items.heap.rip=Покойся с Миром
bones.here_lies_nameless=Здесь захоронен неизвестный: %s, у которого всего лишь простая могила.
bones.here_lies_named=Здесь похоронен: %1$s.
bones.pacifist=Его запомнили как миротворца, который даже перед ликом смерти не убил ни одной души. Таким не место в подземелье...
bones.rats=Почтенный крысобой, который убил %d врагов перед своей смертью. Это всё, на что он был способен?
bones.crabs=Почтенный крушитель крабов, который убил %d врагов перед своей смертью. Возможно, ему следовало прибегнуть к магии...
bones.undead=Он олицетворял страх среди скелетов, сумел убить %d врагов перед своей смертью. И в итоге, сам стал одним из них...
bones.thieves=Преследователь безумных воров, который убил %d врагов перед своей смертью. Не смейте красть его вещи!
bones.bats=Душитель летучих мышей, который убил %d врагов перед своей смертью. И у летающих существ есть когти!
bones.brutes=Крушитель гнолл-громил, который убил %d врагов перед своей смертью. Спокойствие приносит благо, а ярость только боль.
bones.monks=Познавший искусство дворф-монахов, сумел убить %d врагов перед своей смертью. Видимо, не до конца освоил их искусство...
bones.golems=Разрушитель творений дворфов, сумел убить %d врагов перед своей смертью. Если бы и он мог призывать каких-то существ...
bones.demons=Легендарный охотник на демонов, который убил %d врагов перед своей смертью. Он стал героем, внесший вклад во спасение мира.
bones.yog=Бросивший вызов Богу демонов, сумел убить %d врагов перед своей смертью. Интересно, о чем подумает преемник, когда увидит бога?
bones.forgot_nukecole=Печально, что в предсмертный момент, он забыл про волшебную бутылочку Ядер-колы, подаренную Королем драконов.
bones.forgot_watersoul=К несчастью, когда он был на грани жизни и смерти, он забыл про эликсир Водяного духа, а ведь он мог бы использовать его силу, чтобы обмануть смерть.
bones.forgot_waterskin=Очень жаль, что он забил о своем бурдюке с водой, когда находился на грани смерти. Или эта вещь используется для полива цветов?
bones.forgot_potion=Так досадно, что, находясь перед лицом к смерти, он забыл выпить свои лечебные зелья. Хотя их у него было в достатке.
bones.rest_in_peace=Он оставил все нажитое в этом мире перед тем, как покинуть его навсегда. Надеясь, что другому герою не придется постичь его трагическую судьбу.

items.food.pasty.fish_name=рыба на пару с лотосом
items.food.pasty.fish_desc=Рыба на пару, волшебно поданная на зелени. В это время года есть традиция сохранять кусочек рыбы на потом, поэтому вы оставите немного объедков, вместо того, чтобы съесть всё сразу.\n\nСчастливого Лунного Нового Года!

items.food.pasty$fishleftover.name=рыбные объедки
items.food.pasty$fishleftover.eat_msg=На вкус так себе.
items.food.pasty$fishleftover.desc=Немного остатков рыбы после вашего предыдущего приёма пищи. Вы в любой момент можете съесть их, чтобы слегка восполнить сытость.

items.food.pasty.qk_name=цинминго
items.food.pasty.qk_desc=Цинминго - зеленые пампушки, которые маслянистые и зеленые, как нефрит, липкие, мягкие и ароматные, их так и хочется съесть все за один раз. Трудно даже себе представить, что такая прекрасная еда существует в подземелье.\n\nЦинмин - праздник, где мы отдаем дань уважения нашим предкам для благодарности. Пусть их души упокоятся с миром на небесах. Мы помним и двигаемся вперед. Так мы с уважением почитаем прошлое, чтобы встретить светлое будущее.\n\n– «Праздник Цинмин»\n\n_При употреблении вы получите ментальное зрение и тайный барьер._

items.food.pasty$qingkong.name=остатки цинминго
items.food.pasty$qingkong.eat_msg=На вкус так себе.
items.food.pasty$qingkong.desc=Немного остатков зеленых пампушек после вашего предыдущего приёма пищи. \n\nВы в любой момент можете съесть их, чтобы слегка восполнить сытость.\n\n_При употреблении вы получите ментальное зрение и тайный барьер._

items.food.pasty$riceliquor.name=рисовое вино
items.food.pasty$riceliquor.eat_msg=Этот насыщенный вкус вина долго чествуется во рту.
items.food.pasty$riceliquor.desc=Фарфоровый кувшин для вина с пробкой, обмотанной красной тканью. Это не крепкий алкогольный напиток, а свежеприготовленное рисовое вино с сладким привкусом.\n\nВыпив этот напиток, можно слегка восполнить сытость и немного восстановить здоровья.\n\n«Не ищи истину в вине» - сказал тот, кто протянул вам кувшин с вином.

### 特别货币
items.icecyanbluesquarecoin.name=кобальтовая монета
items.icecyanbluesquarecoin.desc=Специальная валюта Империи Падкого Хлада, выпущенная по приказу императрицы «Лэнг», под названием «Ледяной империал», считается, что ими обладают только те, кто сильные мира сего.\n\nЭта валюта может использоваться для разной особой торговли и является основной валютой обращения для поддержания стабильной работы фонда триумвирата поверхности.
items.icecyanbluesquarecoin.no=Примечание: если вы находитесь в режиме разработчика или специальном режиме, кобальтовые монеты не будут добавлены в ваше хранилище.

items.quest.anyskinselect.name=ваучер на приобретение одежды
items.quest.anyskinselect.desc=Этот сертификат выпущен в честь официального запуска пробной версии <#FF8400> журнала игровых событий в FireBase. <RGB> Его можно обменять на любой скин, и он будет всегда появляться на 0-м этаже до момента обмена.\n\nПосле использования в любом файле сохранения он будет автоматически уничтожен в других файлах сохранений.

items.quest.anyskinselect$anyskincustomselect.name=коммуникатор преображения
items.quest.anyskinselect$anyskincustomselect.desc=Таинственное устройство связи из иного измерения, украшенное портретом торговца модой. Его обладатель может связаться с торговцем сквозь пространство и время, чтобы выменять его на любой выбранный наряд.
items.quest.anyskinselect$anyskincustomselect.ac_conect=СВЯЗАТЬСЯ

items.kinggold.name=золотой купон
items.kinggold.desc=Эти золотые купоны, напечатанные из очень тонкого мягкого металла, гладкого на ощупь. На них одной стороне изображена голова Рона, а на другой - логотип Торговой палаты. В наше время золотые монеты уже не являются лучшей валютой торговцев, но если у вас есть такие купоны, они с радостью окажут вам некоторую помощь, если вы найдете хоть одну из этих «чудесных» карточек.\n\nИх можно использовать для обмена некоторых полезных предметов в магазинах, расположенных в разных измерениях и времени. В каком-то смысле эта вещь гораздо ценнее золотых монет.\n\nОни пропитаны ароматом торгового лорда и ведьмой темного пламени, возможно, именно поэтому торговцы так охотно принимают их.\n\nКурс обмена: 50 золота = 1 купон, 5 одинаковых предметов = 1 купон.
items.kinggold.ling=Получено %d купонов

### 特别武器
items.weapon.melee.legend.clearsword.name=чистильщик
items.weapon.melee.legend.clearsword.desc=Лезвие этого серпа длиннее и больше, чем у обычного серпа, как будто оно создано для того, чтобы косить врагов, как сорняки.\n\nЭто довольно медленное оружие с низкой точностью.
items.weapon.melee.legend.clearsword.ability_name=жатва душ
items.weapon.melee.legend.clearsword.ability_desc=Дуэлянт может совершить _жатву душ_ чистильщиком. Эта атака гарантированно наносит 125% магического урона всем видимым врагам в радиусе 7x7 клеток, накладывая уязвимость и ослабление на 10 ходов, но стоит 3 заряда оружия.
items.weapon.melee.legend.clearsword.xdesc=_Это легендарное оружие._\n_-_ Атака имеет шанс вызвать кровотечение _15+2*на процент от уровня_, наносящее _10%_ урона в виде кровотечения.\n_-_ Чем ниже уровень здоровья владельца, тем выше наносимый урон вплоть до максимума в _33%_ дополнительного урона. \n_-_ Убийство врага восстанавливает его  максимальное здоровье на _2+0,5*на процент от уровня_. Определенный процент от максимального здоровья врага, _за исключением боссов_.

items.weapon.melee.legend.forestbow.name=лесной арбалет
items.weapon.melee.legend.forestbow.desc=Друиды сотворили особенный арбалет, который вливает в свои стрелы природную магию. Как и обычный арбалет, он с чуть меньшей силой усиливает урон от дротиков, но сам менее пригоден для ближнего боя.
items.weapon.melee.legend.forestbow.stats_desc=Это оружие, будучи экипированным, увеличивает урон от дротиков и даже наделяет их своим зачарованием.
items.weapon.melee.legend.forestbow.no_unlock=<#33BB33>В знак уважения к Shattered Dungeon и Pixel Dungeon, создателям мира подземелий, это легендарное оружие можно разблокировать всего за 90 кобальтовых монет! <RGB>
items.weapon.melee.legend.forestbow.ability_name=благословение леса
items.weapon.melee.legend.forestbow.ability_desc=Дуэлянт может подготовить _благословение леса_ из арбалета. Эта способность активируется мгновенно и гарантирует попадание следующего дротика по врагу, применяя все эффекты атаки в радиусе 5х5 клеток и продлевая эффекты от смазанных дротиков. Урон от дротиков немного уменьшенный по сравнению с оригинальным заряженным выстрелом.
items.weapon.melee.legend.forestbow.xdesc=_Это легендарное оружие._\n_-_ Урон от дротика увеличен до 3 + уровень снаряжения ~ 6 + уровень снаряжения × 2,5.\n_-_ Каждый выпущенный дротик имеет (15+4*уровень)% шанс нанести врагу один из эффектов: отравление, ослепление или окоченение на [3+(уровень/4)] ходов. Если оружие имеет +9 или выше, оно наносит два эффекта.
items.weapon.melee.legend.forestbow$chargedshot.name=благословение леса
items.weapon.melee.legend.forestbow$chargedshot.desc=Дуэлянт концентрируется и усиливает свой лесной арбалет. Следующий дротик гарантированно попадёт по врагу, применяя все эффекты и зачарования в радиусе 5х5 клеток. Полезные эффекты дротиков будут применяться только к союзникам, а вредные - только к врагам.\n\nСмазанные дротики будут иметь 4 дополнительных применения при стрельбе благословением леса. Дуэлянт не может применить эту способность, чтобы использовать дротики с положительными эффектами на себя.

items.weapon.melee.legend.moondao.name=лунные клинки
items.weapon.melee.legend.moondao.desc=Эти парные кленки с лезвием в форме полумесяца, имеют настолько быстрые взмахи. что как только попадают в жизненно точку врага, делает этот удар смертоносным.
items.weapon.melee.legend.moondao.stats_info=Это оружие более эффективно во время скрытных атак и 100% замораживает цель при успешной скрытой атаке. Это парное оружие имеет высокую скорость атаки. Это оружие обладает зачарованием обороны при атаке.
items.weapon.melee.legend.moondao.ability_name=тайный удар
items.weapon.melee.legend.moondao.ability_desc=Дуэлянт может совершить _тайный удар_ лунным клинком, если у неё меньше 80% здоровья. Эта уничтожающая всё и вся атака гарантированно попадает в цель и наносит на 40% урона больше, а сам Дуэлянт получает _10 тайного щита._

items.weapon.melee.legend.ricesword.name=рисовый большой меч
items.weapon.melee.legend.ricesword.desc=В этом оружии можно почувствовать аромат клейкого риса, исходящего от этого меча, а свойства самого меча изменяется в зависимости от вашего голода.\n\nЭто оружие имеет повышенную дальность атаки.
items.weapon.melee.legend.ricesword.ability_name=мощный удар
items.weapon.melee.legend.ricesword.ability_desc=Дуэлянт может совершить _мощный удар_ рисовым большим мечом. Эта концентрированная атака наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.
items.weapon.melee.legend.ricesword.typical_ability_desc=Дуэлянт может совершить _мощный удар_ рисовым большим мечом. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если враг был застигнут врасплох, а также ошеломляет его на 5 ходов, чем снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если он не застает врага врасплох.

items.weapon.melee.whiteblastsword.name=шпага белогривой волны
items.weapon.melee.whiteblastsword.desc=Оружие, которым когда-то владел инквизитор, обладает _огромной силой_, что достаточно одного лишь прикосновения к нему, чтобы наполнить себя непоколебимой решимостью.
items.weapon.melee.whiteblastsword.action_name=Приговор
items.weapon.melee.whiteblastsword.quest_start_prompt=Подбрасывает в воздух всех врагов на 2 хода в радиусе 8 клеток от себя, после чего гарантированно наносит 3 попадающих удара.
items.weapon.melee.whiteblastsword.open_attack=Применить способность
items.weapon.melee.whiteblastsword.not=Пока не применять
items.weapon.melee.whiteblastsword.roll1=Мой свет шпаги очистит зло!
items.weapon.melee.whiteblastsword.roll2=Моя шпага рассечет даже волну!
items.weapon.melee.whiteblastsword.roll3=Мое сердце вынесет свой приговор.
items.weapon.melee.whiteblastsword.ability_name=порыв ветра
items.weapon.melee.whiteblastsword.typical_ability_desc=Дуэлянт может совершить _порыв ветра_ используя шпагу белогривой волны против врага в пределах 1 клетки.  Эта способность подбрасывает цель в воздух на один ход и наносит два удара, которые гарантированно достигают цели, но стоит 2 заряда оружия.
items.weapon.melee.whiteblastsword.ability_desc=Дуэлянт может совершить _порыв ветра_ используя шпагу белогривой волны против врага в пределах 1 клетки.  Эта способность подбрасывает цель в воздух на один ход и наносит два удара, которые гарантированно достигают цели, но стоит 2 заряда оружия.
items.weapon.melee.whiteblastsword.prompt=Выберите цель в пределах досягаемости
items.weapon.melee.whiteblastsword.ability_no_target=Неподходящая цель!
items.weapon.melee.whiteblastsword.co=готово

items.weapon.melee.legend.saiplus.name=хладный кинжал
items.weapon.melee.legend.saiplus.desc=От кинжала исходит убийственная аура, которая так же устрашающая, как и сам бог смерти.
items.weapon.melee.legend.saiplus.success=%s делает смертельную атаку, возвращая вам здоровье!
items.weapon.melee.legend.saiplus.stats_info=Это оружие наносит больше урона во время скрытных атак, и имеет шанс восстановить здоровье, если она прошла успешна. Это оружие накладывает зачарование погибели у врагов с низким здоровьем.
items.weapon.melee.legend.saiplus.ability_name=спрятаться
items.weapon.melee.legend.saiplus.typical_ability_desc=Дуэлянт с хладным кинжалом может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 4 клеток и обычно даёт _%d хода невидимости._
items.weapon.melee.legend.saiplus.ability_desc=Дуэлянт с хладным кинжалом может _спрятаться_. Эта способность позволяет мгновенно совершить скачок до 4 клеток и даёт _%d хода невидимости._
items.weapon.melee.legend.saiplus.upgrade_ability_stat_name=Длительность Способности

items.weapon.melee.legend.goldlonggun.name=золотое копьё
items.weapon.melee.legend.goldlonggun.desc=Оружие, которое встречается лишь тем, кому благоволит Тихея, даруя владельцу небывалую благодать.\n\nЭто оружие имеет повышенную дальность атаки.\nЭто оружие имеет разброс урона на 50%-100%.\nЭто оружие наносит 33% дополнительного урона демонам и нежити.
items.weapon.melee.legend.goldlonggun.bless_desc=Это оружие при попадании в не стоящего вплотную врага, дает на _%d ходов_ благословение.
items.weapon.melee.legend.goldlonggun.typical_bless_desc=Это оружие при попадании в не стоящего вплотную врага, обычно дает на _%d ходов_ благословение.
items.weapon.melee.legend.goldlonggun.ability_name=золотое пронзание
items.weapon.melee.legend.goldlonggun.ability_desc=Дуэлянт, используя наконечник золотого копья, может _пронзить_ врага насквозь. Это гарантирует попадание, добавляет уязвимость на 2 хода и наносит в 2 раза больше урона врагам с жёсткой кожей. Если враг мгновенно умирает, то она получает в дар некое количество золота!
items.weapon.melee.legend.goldlonggun.gold=Убив врага золотим пронзанием, и вы получаете %d золота.
items.weapon.melee.legend.goldlonggun.ability_target_range=Эта цель слишком далеко...

items.books.questbookslist.hollowcitybook.name=Неподписанное приглашение
items.books.questbookslist.hollowcitybook.desc=Приглашаем все желающих посетить старинный замок на карнавальное пиршество.
items.books.questbookslist.hollowcitybook.ac_read=ПРОЧИТАТЬ
items.books.questbookslist.hollowcitybook.quest_start_no=Прочитать приглашение можно только на 26 этаже!

items.quest.unsignedinvitationletter.name=Неподписанное пригласительное письмо
items.quest.unsignedinvitationletter.desc=На приглашении нет подписи, только какие-то странные символы. Вы пока не в силах сломать печать, чтобы открыть приглашение, поэтому у вас есть только единственные решение взять его с собой.
items.quest.unsignedinvitationletter.rankings_desc=Концовка замка: Потерян в реке Стикс
items.quest.unsignedinvitationletter.hollow_city_1=После сражения на реке Стикс я %s почувствовал, что меня все больше тянет к старинному замку. Кровавая луна все еще висела высоко над поверхностью, и это был ещё не конец. Но я решил что лучше покинуть это место...

levels.hollow.zerohallsbosslevel$baddream.rankings_desc=Концовка замка: Мрачное сновидение
levels.hollow.zerohallsbosslevel$baddream.dream=Все это оказалось сном, и вы наконец-то проснулись от этого кошмара...

items.weapon.melee.icedewvialsword.name=ледяной меч божественной росы
items.weapon.melee.icedewvialsword.desc=Находится в разработке, ожидайте его в будущих обновлениях!

items.quest.randomchest.name=ящик с сюрпризом
items.quest.randomchest.desc=Неизвестно, что там внутри, но можно узнать открыв его! 
items.quest.randomchest.ac_kitem=ПОПЫТАТЬ УДАЧУ!
items.quest.randomchest.look_msg=Вы открыли ящик с сюрпризом.

items.quest.blessingnecklace.name=благословение ожерелье
items.quest.blessingnecklace.desc=Простое освещённое ожерелье, которое имеет схожие свойства с освящённым анхом.


items.quest.red.name=белая роза
items.quest.red.desc=В этом опасном и мрачном подземелье эта белая роза словно пронзает окружающую тьму, демонстрируя вам настоящую  силу «Любви».
items.quest.red.ac_interlevel_tp=Вернуться назад

items.potions.potionofpurity$potionofpurityling.name=зелье Нейтрализации токсического газа
items.potions.potionofpurity$potionofpurityling.desc=Извлекая зелье из костей, вы вдруг осознаете, что до вас здесь побывали другие путешественники, но, к сожалению, они не смогли выжить.\n\nЭто зелье, нейтрализующее отравляющий газ, было изготовлено другими путешественниками путем извлечения эссенции из растений джунглей, поэтому оно способно нейтрализовать любые опасные и ядовитые гази, даже в самых глубоких частях джунглей.\n\nНадеюсь, вы сможете унаследовать дух и волю других путешественников и полностью искоренить опухоль этих джунглей!

items.quest.devitem.crystalling.name=хрустальное ожерелье
items.quest.devitem.crystalling.desc=Под этим сине-пурпурным ожерельем свисает осколок кристалла, и когда свет проникает сквозь эту призму, его сердцевина как будто тоже излучает свет.\n\nСогласно сказаниям, Ин Линг создала этот мир с помощью Священного сердца, а затем разделила половину своей силы между тремя посланниками и попросила их превратить другую половину в Кристальное сердце.\n\nСамо Священное сердце не имеет физической формы, и даже Кристальное сердце никто не видел на самом деле, но по описанию легенд, люди воссоздали его виде ожерелья.\n\nУже после такие ожерелье стали делать на день рождения Ин Линга, стремясь получить благословение у божественного творца.\n\nДаже вы зная, что кристалл на нем символический, держа его в руках, чувствуйте в своей душе умиротворение.\n\n_Вы можете ощутить на нем дыхание Лин, поэтому ношение этого ожерелья способно помочь вашим ранам быстрее затянуться._

items.quest.redwhiterose.name=красная и белая роза
items.quest.redwhiterose.desc=Они так и не ушли с ними, эти два бутона роз так и не были достойны их...\n\nЧувства не нуждаются в носителе, а воля не требует доказательств.\n\nИ вы никогда не сдавайтесь.

items.weapon.melee.fiveren.name=лунный пирог с орехами
items.weapon.melee.fiveren.stats_desc=Это довольно медленное оружие.\nЭто оружие имеет повышенную дальность атаки.\nЭто оружие может разъедать врага.
items.weapon.melee.fiveren.desc=Самый твердый лунный пирог - это лунный пирог орехами!\n\nПоздравляем с прохождением события «Праздник середины осени»! Теперь в подземелье могут появляться лунные пироги с орехами.
items.weapon.melee.fiveren.desc_alt=Поздравляем всех с Праздником середины осени.\n\nИстория лунных пирогов берет свое начало еще с древних времен, когда их еще называли просто «Лепешками» и лепили в ручную в кругу семьи, а для закваски теста, тогда использовали вино. Но со временем на празднике воссоединения, их стали именовать «Тортом воссоединения», так как дарились они друзьям и родственникам. Некоторые делали их в форме жабы или кролика из лунного дворца. Так они превратились из домашней выпечки ручной работы в традиционную форму выпечки с различной начинкой.
items.weapon.melee.fiveren.ability_name=пронзить
items.weapon.melee.fiveren.typical_ability_desc=Дуэлянт, используя лунный пирог с орехами, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака обычно наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
items.weapon.melee.fiveren.ability_desc=Дуэлянт, используя лунный пирог с орехами, может _пронзить_ врага в зоне досягаемости, но не стоящего вплотную. Эта атака наносит _%1$d-%2$d урона_, отталкивает противника и гарантированно попадает в цель.
### 传奇武器

items.weapon.melee.legend.legendweapon.typical_stats_desc=Это легендарное оружие _%1$s-го уровня,_ имеет способность:  %2$s\nЭта способность обычно наносит _%3$s-%4$s ед. урона._
items.weapon.melee.legend.legendweapon.stats_desc=Это легендарное оружие _%1$s-го уровня,_ имеет способность: %2$s\nЭта способность наносит _%3$s-%4$s ед. урона._

items.weapon.melee.legend.diedcrossbow.name=ручная баллиста
items.weapon.melee.legend.diedcrossbow.desc=Это баллиста, способна с высокой скоростью выпускать одновременно несколько стрел. Она может оказаться очень тяжелой, для тех у кого недостаточно сил, что может привести к осечке устройства и нанести вред такому владельцу. Но благодаря своему размеру может также быть полезна в ближнем бою.
items.weapon.melee.legend.diedcrossbow.xdesc=_Особая способность: взрывной выстрел._\n\nКогда баллиста полностью заряжена, она может выстрелить стрелу, которая при приземлении или попадании взрывается, нанося урон по площади в радиусе _5x5_ клеток, а мощность взрывного урона зависит от уровня улучшений.\n\nКаждый взрывной выстрел из оружия требует _перезарядку_, которая может сокращаться, при улучшении оружия.\n\nЭто оружие значительно повышает урон, когда стреляет дротиками. Оно также накладывает свои собственные зачарования на дротики, которыми стреляет.
items.weapon.melee.legend.diedcrossbow.ac_king=Взрывной выстрел
items.weapon.melee.legend.diedcrossbow.no_cooldown=Ваша баллиста перезаряжается, обождите некоторое время...
items.weapon.melee.legend.diedcrossbow.no_equip=Вы должны экипировать баллисту, чтобы её использовать. Если у вас подкласс чемпиона, вам нужно переключиться на основное оружие, чтобы её использовать.
items.weapon.melee.legend.diedcrossbow.ondeath=Вас разорвало на куски взрывом баллисты...

items.weapon.melee.legend.diedcrossbow.ability_name=заряженный выстрел
items.weapon.melee.legend.diedcrossbow.ability_desc=Дуэлянт может подготовить _заряженный выстрел_ из ручной баллисты. Эта способность активируется мгновенно и гарантирует попадание следующего дротика по врагу, применяя все эффекты атаки в радиусе 5х5 клеток и продлевая эффекты от смазанных дротиков.
items.weapon.melee.legend.diedcrossbow.charge_ready=Баллиста полностью заряжена! Следующий дротик активирует эффект усиления.
items.weapon.melee.legend.diedcrossbow$chargedshot.name=заряженный выстрел
items.weapon.melee.legend.diedcrossbow$chargedshot.desc=Баллиста заряжается.\n\nСледующий дротик всегда попадёт в цель, распространяя в области 5x5 эффект смазанных дротиков.\n\nНегативные эффекты действуют только на врагов, а положительные применяются только на союзников; они не действуют на самого героя.\n\nСмазанные дротики будут иметь 4 дополнительных применения при стрельбе заряженным выстрелом.

items.weapon.melee.sdbsword.name=алмазный большой меч
items.weapon.melee.sdbsword.desc=Меч Короля мимиков - огромный красивый и смертоносный клинок, целиком выточенный из алмаза. Этот меч наделен частицей магии Короля мимиков, которая слегка ограничивает его возможности, но наделяет неплохими эффектами.\n\nЭто довольно медленное оружие с фиксированной дальностью атаки на 2 клетки. Оно обладает особыми эффектами, зависящими от расстояния до цели, но не способно увеличивать дальность своей атаки.
items.weapon.melee.sdbsword.ability_name=высвобождение кристаллов
items.weapon.melee.sdbsword.ability_no_target=Там нет цели или нет подходящей!
items.weapon.melee.sdbsword.typical_ability_desc=Дуэлянт может _высвободить кристаллы_ алмазным большим мечом. Эта атака наносит на _30% больше урона_, отталкивает противника на _3 клетки_ и гарантированно попадает в цель. Если противника отбрасывает к стене, Дуэлянт автоматически тратит ход на совершение  _дальнобойной магической атаки_.
items.weapon.melee.sdbsword.ability_desc=Дуэлянт может _высвободить кристаллы_ алмазным большим мечом. Эта атака обычно наносит на _30% больше урона_, отталкивает противника на _3 клетки_ и гарантированно попадает в цель. Если противника отбрасывает к стене, Дуэлянт автоматически тратит ход на совершение _дальнобойной магической атаки_.

items.weapon.melee.sdbsword.knock_wall_hit=После того как осколки кристаллов отбросили %s к стене, вы воспользовались моментом и нанесли ответный магический удар!

items.quest.sakafishsketon.name=останки сакабамбасписа
items.quest.sakafishsketon.desc=Тело этого бедного существа сильно обветшало от многолетнего пребывания в глубинах. Похоже, оно просто хочет вернуться на поверхность, чтобы еще хоть раз взглянуть на... \n\nВернувшись из древних руин, вы обнаружили, что в этих останках таится некая жизненная энергия, но ей чего-то не хватает, возможно, этому маленькому существу нужна вода. Ведь вода - это источник жизни.\n\nМожет, поэтому предмет так ценится торговцами.

items.quest.sakafishsketon.saka=Снова вернуть к жизни?
items.quest.sakafishsketon.wnd_body=В этом маленьком существе, все еще чествуется жизненная энергия, которая всеми силами питается вернуть это бренное тело к жизни.\n\nЕсли вы хотите, чтобы это существо обрело новую жизнь, полейте на его останки зелье исцеления.
items.quest.sakafishsketon.wnd_set=Помочь обрести жизнь!
items.quest.sakafishsketon.wnd_return=Оставить все как есть...

items.quest.sakafishsketon.you_must_potion=Вам нужно иметь в рюкзаке хотя бы одно зелье исцеления, чтобы сделать это.

items.quest.sakafishsketon.saka2=Снова отнять жизнь?
items.quest.sakafishsketon.wnd2_body=Вы уверены, что хотите снова умертвить это маленькое и безобидное существо?\n\nКонечно, вы получите с него что-то, но тогда, вы долгое время не сможете возвратить его к жизни.
items.quest.sakafishsketon.wnd2_set=Да, хочу казнить
items.quest.sakafishsketon.wnd2_return=Нет, пусть живет

items.quest.sakafishsketon.ac_summonfish=ОЖИВИТЬ
items.quest.sakafishsketon.ac_summonfishdied=УМЕРТВИТЬ
items.quest.sakafishsketon.you_active=Вы чувствуете, как останки излучают тускло-желтоватое свечение...
items.quest.sakafishsketon.pets_died=Перед тем, как существо исчезло, вы замечаете, что во рту у него находился камень.
items.quest.sakafishsketon$cooldownstonerecharge.name=восполнение жизненной энергии
items.quest.sakafishsketon$cooldownstonerecharge.desc=Поскольку вы умертвили маленького сакабамбасписа, потребуется некоторое время, чтобы он снова накопил жизненную энергию.\n\nХодов осталось: %s.
items.quest.sakafishsketon.charged=Останки сакабамбасписа накопили жизненную энергию!

items.quest.dogstick.name=собачий свисток
items.quest.dogstick.desc=Искусно сделанный свисток для собак. Этот предмет, похоже, представляет большой интерес для торговцев.\n\nВы ощущаете связь между этим свистком и неким существом; когда вы в него подуете, оно услышит его звучание.
items.quest.dogstick.dog=Подуть в собачий свисток?
items.quest.dogstick.wnd_body=Этот щенок отыскал вас; просто дайте ему зелье алхимического огня, и он с радостью последует за вами, сопровождая вас в ваших приключениях.
items.quest.dogstick.wnd_set=Дать зелье
items.quest.dogstick.wnd_return=Пока не давать
items.quest.dogstick.you_must_potion=Вам нужно иметь в рюкзаке хотя бы одно зелье алхимического огня, чтобы сделать это.
items.quest.dogstick.dog2=Временно расстаться?
items.quest.dogstick.wnd2_body=Вы уверены, что хотите прогнать маленького Цербера? Похоже, этот щенок не желает отходить от вас ни на шаг...
items.quest.dogstick.wnd2_set=Да, прогнать прочь
items.quest.dogstick.wnd2_return=Нет, не прогонять
items.quest.dogstick.ac_summondog=ПРИЗВАТЬ
items.quest.dogstick.ac_summondogdied=ПРОГНАТЬ
items.quest.dogstick.you_active=Вы взяли в руки зелье алхимического огня и дунули в собачий свисток - вдруг взвилось багровое пламя, и в огненном сиянии мелькнул маленький Цербер…
items.quest.dogstick.pets_died=Силуэт маленького Цербера постепенно исчез в пламени, оставляя за собой слабый скулеж…
items.quest.dogstick$cooldownstonerecharge.name=восстановление доверия
items.quest.dogstick$cooldownstonerecharge.desc=Поскольку вы прогнали маленького Цербера, потребуется некоторое время, чтобы он вернул к вам доверие.\n\nХодов осталось: %s.
items.quest.dogstick.charged=Маленький Цербер снова доверяет вам!

items.food.redcrab.name=варёный краб
items.food.redcrab.desc=Этот подарок от девушки, судя по цвету, краб уже приготовлен и выглядит довольно аппетитно. При употреблении может помочь утолить чувство голода.

items.food.sakameat.name=сакабамбасписное филе 
items.food.sakameat.desc=Ох... осмотрев тушу древнего существа, вам стало понятно что его мясо, может бить все еще съедобным для вас.
items.food.sakameat.oks=Вы чувствуете, как в ваше тело приходит вдохновение!

items.wands.wandofanmy.name=палочка Контроля
items.wands.wandofanmy.desc=Эта палочка управляется таинственной энергией, которая вынуждает монстров подземелья (_кроме боссов_) подчиняться её владельцу, когда достаточно энергии.\n\nЭта палочка не может бить улучшена или выброшена, но исчезает вместе с таинственной энергией, когда она рассеется...
items.wands.wandofanmy.stats_desc=Эта палочка испускает волну контролирующую разум, без причинения урона, но могут мгновенно взять под контроль монстра, превращая его в союзника.
items.wands.wandofanmy.error=Ваша палочка может повлиять на босса.

items.wands.wandofanmy$allytorestart.name=подконтрольное сознание
items.wands.wandofanmy$allytorestart.desc=Подконтрольность может быть лучшим способом освобождения, возможно, нам не следует враждовать с людьми...
items.wands.wandofanmy$allytorestartok.name=подконтрольное сознание

items.books.questbookslist.dimandbook.name=книга королевского поединка
items.books.questbookslist.dimandbook.action=Вы бросили вызов неизвестному врагу, удачи!
items.books.questbookslist.dimandbook.desc=Ты... убивал... моих сородичей... А теперь желаешь... Бросить мне вызов... Чтобы сразиться со мной?\n\nВы чувствуете непостижимую силу в этой книге, убедитесь, что вы полностью готовы к битве, прежде чем бросать вызов.
items.books.questbookslist.dimandbook.fuck_desc=Ты уже не раз побеждал моих сородичей, а теперь желаешь сразиться со мной. Я очень восхищаюсь твоей смелостью и силой, поэтому хочу сам проверить, на что ты способен.\n\nТы можешь отправиться на священное поле битвы и вступить в рыцарский поединок за честь. На арене соревнуются до сильнейшего, чтобы определить истинного победителя.\n\nЕсли ты примешь вызов, это будет легендарная битва. Я с нетерпением жду твоей решимости.

items.books.questbookslist.hollowcitybook.author=
items.books.questbookslist.dimandbook.author=

items.books.questbookslist.dimandbook.ac_read=ПРИНЯТ ВЫЗОВ
items.books.questbookslist.dimandbook.action_s=Похоже, эта книга сгорела из-за того, что противнику не хватило сил, чтобы принять вызов...\n\nЕсли вы хотите бросить вызов, вам необходимо прочитать эту книгу до того, как спуститесь на 10-й этаж!

items.books.bookslist.testbooks.name=Неуязвимость
items.books.bookslist.testbooks.desc=Активация этой способности дарует постоянный эффект неуязвимости, а повторное применение отменяет этот эффект.
items.books.bookslist.testbooks.ac_read=АКТИВИРОВАТЬ
items.books.bookslist.testbooks.author=Автор: Ling.
items.books.bookslist.testbooks.godmode_on=Режим неуязвимости: включен!
items.books.bookslist.testbooks.godmode_off=Режим неуязвимости: выключен!


items.quest.mime$gold_one.name=полумесяц с нефритом
items.quest.mime$gold_one.desc=Драгоценный предмет из другого мира, по форме напоминающий полумесяц с драгоценным камнем в центре. К сожалению, он не способен воплотить свои заложение возможности в этом мире. Но его драгоценной внешней красоты достаточно, чтобы заинтересовать торговцев.

items.quest.mime$gold_two.name=изумруд
items.quest.mime$gold_two.desc=Драгоценные камни зачастую способны накапливать энергию, и этот не исключение. Такую драгоценность можно хорошо продать торговцам или просто носить с собой для других целей.\n\n_При ношении такого предмета в рюкзаке, владелец может стать невидимым, если его здоровье упадет ниже 20%._
items.quest.mime$goldtwocooldown.name=охлаждение изумруда
items.quest.mime$goldtwocooldown.desc=Вы недавно использовали этот пассивную способность и должны подождать, прежде чем использовать её снова.\n\nХодов осталось: %s.

items.quest.mime$gold_three.name=таинственный песок
items.quest.mime$gold_three.desc=Творение иного мира, словно затягивает за собой время, когда смотришь на сыпучий песок с пылью. На первый взгляд это выгладить на обычный мусор, но на самом деле имеет сильную ценность у торговцев.\n\n_При ношении такого предмета в рюкзаке, владелец увеличивает скорость передвижения на 20%._

items.quest.mime$gold_four.name=печать с синей гравировкой
items.quest.mime$gold_four.desc=Предмет белых эпох, излучает странную энергетику, а синяя гравировка, вроде бы что-то сообщает, но символы так давно затерлись, что их уже невозможно прочесть. Поэтому, только его старинный вид представляет ценность у торговцев.

items.quest.mime$gold_five.name=Сердце Бога-Творца
items.quest.mime$gold_five.desc=Этот оберег был вырезан в честь Бога-Творца. Сейчас их уже давно никто не делает и не помнит, и возможно, это единственный экземпляр из существующих. Но в нем все еще чувствуется сила Бога-Творца. Такую древность можно хорошо продать торговцам или просто носить с собой, чтобы получить благословение Бога-Творца.\n\n_При ношении такого предмета в рюкзаке, владелец удваивает эффект исцеления, а если его здоровье упадет ниже 1/4, он на некоторое время становится неуязвимым, обретая гнев божественного творца. (Этот предмет всегда срабатывает раньше Анха)_

# 倒悬的生命树 - 武器本体
items.weapon.melee.lifetreesword.name=Ветвь Древа Жизни
items.weapon.melee.lifetreesword.desc=Когда плод Клиффорда раскололся, все его окружающие лозы сплелись вокруг раскрывшегося семени, образовав форму меча. Таким образом, этот меч касаясь существ, поглощает их жизненную силу подпитывая семя, в надежде на то, что он снова принесет еще один алый плод.\n\nЭто довольно меткое оружие.\n\nЭто оружие накапливает жизненную энергию своими атаками, и накопив достаточно, позволяет применить уникальную способность.\n\nНакоплено энергии: %s/%s.
items.weapon.melee.lifetreesword.ac_summon=ПРИЗВАТЬ РАСТЕНИЕ
items.weapon.melee.lifetreesword.prompt=Выберите место для призыва
items.weapon.melee.lifetreesword.no_charge=У оружия недостаточно энергии, чтобы использовать уникальную способность.
items.weapon.melee.lifetreesword.bad_pos=Вы не можете разместить здесь растение!
items.weapon.melee.lifetreesword.nolongrange=Вы не можете на таком расстоянии призвать растение.
items.weapon.melee.lifetreesword$placeholder.error=Обратите внимание, что Ветвь Древа Жизни должна быть не экипирована, если хотите использовать её в алхимии.
items.weapon.melee.lifetreesword$lifetreant.name=Растение-людоед
items.weapon.melee.lifetreesword$lifetreant.desc=Эти ожившие растения в джунглях стали необычайно агрессивными, когда в джунглях произошли странные изменения. Они зачастую распыляют яд на посторонних существ, а сам яд чрезвычайно едкий и очень опасен. Само тело их очень гибкое, поэтому такое растение лучшее убивать, встречая врасплох.
items.weapon.melee.lifetreesword.ability_name=рассечь
items.weapon.melee.lifetreesword.typical_ability_desc=Дуэлянт может _рассечь_ врага ветвью древа жизни. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 2 ходов.
items.weapon.melee.lifetreesword.ability_desc=Дуэлянт может _рассечь_ врага ветвью древа жизни. Эта атака наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.

items.wands.wand.summon=Выберите место для призыва

items.food.crivusfruitsfood.name=недозревший фрукт
items.food.crivusfruitsfood.desc=Фрукты, выпавшие с «плода Клиффорда», обладают легким привкусом крови.
items.food.crivusfruitsfood.eat_msg2=Этот ароматный фрукт, оставляет кисло-сладкое послевкусие крови...

items.quest.crivusfruitsflake.name=кровавый обломок плода
items.quest.crivusfruitsflake.desc=Когда плод Клиффорда был уничтожен, он разлетелся на множество кусков во все стороны, оставив за собой эти несъедобные обломки. \n\nСам по себе он бесполезен, но длительное воздействие магии наделило его загадочной силой, которая стала привлекать внимание торговцев, по этой причине его свойства можно применить в алхимии для создания особых предметов. В крайнем случае, его можно просто продать или конвертировать в энергетические кристаллы.

items.weapon.melee.legend.kingaxe.name=королевская секира
items.weapon.melee.legend.kingaxe.stats_desc=Это очень меткое оружие.
items.weapon.melee.legend.kingaxe.desc=Оружие, которое служило Торину при жизни, на удивление на его лезвие все еще остаются темные пятна крови. Торин был солдатом, воином, героем, но даже у него бывали случаи, когда он оказывался в безвыходном положении. Похоже, вы нашли общую связь с этим оружием, возможно, это из-за того, что вы идете по тому же пути\n\nКаждая атака накапливает очки, достигая 5 очков его следующая атака меняется на обычную + урон от заклинаний, накладывая владельцу эффект небытия на 5 ходов (урон от заклинаний составляет 25% от общего урона).\n\nНакоплено очков: 
items.weapon.melee.legend.kingaxe$armornofear.name=небытие
items.weapon.melee.legend.kingaxe$armornofear.desc=Сила небытия охватывает вас, и, находясь в нем, вы получаете снижение урона на 30%%.\n\nХодов осталось: %s.


# 高阶法杖
items.wands.hightwand.wandofhighthunderstorm.name=палочка Штормовой молний
items.wands.hightwand.wandofhighthunderstorm.staff_name=посох Штормовой молний
items.wands.hightwand.wandofhighthunderstorm.ondeath=Вы убили себя собственной палочкой Штормовой молний...
items.wands.hightwand.wandofhighthunderstorm.desc=Эта палочка сделана из таинственного кристалла и палочки молний, а также других алхимических ингредиентов. На навершии он украшен фиолетовым камнем где есть два зубца, между которыми проскакивают электрические дуги.
items.wands.hightwand.wandofhighthunderstorm.stats_desc=Эта палочка выпускает поблизости водяной туман, а также испускает очень мощные молнии, которые пронизывают все, против чего они направлены, и причиняют _%1$d-%2$d урона_. Это электричество переходит на близкие персонажи и свободнее распространяется в воде. Молнии из этой палочки могут вызвать цепную реакцию молнии или нанести вам вред, но не затрагивают ваших союзников.
items.wands.hightwand.wandofhighthunderstorm.bmage_desc=Когда _%s_ %s, посох Штормовой молнии имеет шанс дать эффект электрической зарядки на 10 ходов, наделяя при этом тайным барьером. Будучи заряженным маг невосприимчив к электрическому урону и его молнии будут бить дальше.
items.wands.hightwand.wandofhighthunderstorm.eleblast_desc=Стихийный взрыв с посохом штормовой молнии наносит 15% урона, оглушает врагов на 8 ходов и электризует воду.

items.wands.hightwand.wandofbluefuck.name=палочка Фосфорного пламени
items.wands.hightwand.wandofbluefuck.staff_name=посох Фосфорного пламени
items.wands.hightwand.wandofbluefuck.desc=Эта палочка сделана из соснового дерева и покрыта небесно-голубой краской, придавая ей величественный вид. Её наконечник шипит и искрит, стремясь высвободить свою могущественную магию.
items.wands.hightwand.wandofbluefuck.stats_desc=При использовании эта палочка выпускает конус фосфорного огня. Его следующая поглотит _%1$d зарядов_ и нанесёт _%2$d-%3$d урона_. Чем больше зарядов используется, тем больше и сильнее эффект.
items.wands.hightwand.wandofbluefuck$fireboomskull.name=фосфорный мертвец
items.wands.hightwand.wandofbluefuck$fireboomskull.desc=Вы воскресили убитого врага, и отныне он сражается на вашей стороне.\n\nОн взрывается при приближении к врагу, образуя облако фосфорного газа размером 3x3, но если поблизости находится герой или союзник, он мгновенно умирает.
items.wands.hightwand.wandofbluefuck$fireboomskullspawncooldown.name=перезарядка воскрешения фосфорного мертвеца
items.wands.hightwand.wandofbluefuck$fireboomskullspawncooldown.desc=Вы недавно призвали мертвеца, поэтому потребуется время, прежде чем призвать его снова.\n\nХодов осталось: %s.

items.wands.wandofgodice.name=палочка Леденящего порыва
items.wands.wandofgodice.staff_name=посох Леденящего порыва
items.wands.wandofgodice.desc=Эта палочка с лазурным стержнем, украшена сверкающим золотым камнем.\n\nЭта палочка выпускает ледяную ударную волну, которая создает снежную метель в указанной области, замедляя скорость передвижения и атаку всех существ в зоне действия\n\nЕсли под метелью находится вода, она _усиливает заморозку_ существ в этой области, а если метель попадает на элитного врага или босса, она сотворяет электрический разряд внутри цели.
items.wands.wandofgodice.normal_desc=Эта палочка с лазурным стержнем, украшена сверкающим золотым камнем.\n\nЭта палочка выпускает ледяную ударную волну, которая создает снежную метель в указанной области, замедляя скорость передвижения и атаку всех существ в зоне действия\n\nЕсли под метелью находится вода, обычно она _усиливает заморозку_ существ в этой области, а если метель попадает на элитного врага или босса, она сотворяет электрический разряд внутри цели.
items.wands.wandofgodice.stats_desc=Эта палочка наносит _%1$d-%2$d урона_.
items.wands.wandofgodice.bmage_desc=Когда _%s_ %s, у посоха Ледяного хлада, есть шанс активировать зачарование удачи.
items.wands.wandofgodice.eleblast_desc=Стихийный взрыв с посохом леденящего порыва наносит 100% урона, вызывает снежную бурю и тушит пожары.


items.wands.hightwand.wandofvenom.name=палочка Ядовитого тумана
items.wands.hightwand.wandofvenom.staff_name=посох Ядовитого тумана
items.wands.hightwand.wandofvenom.desc=Эта палочка вырезана из фиолетово-золотистого древа и его навершие украшено ярко-зеленым драгоценным камнем.
items.wands.hightwand.wandofvenom.stats_desc=При использовании эта палочка стреляет зарядом, который взрывается в облако алого газа в месте попадания, испуская крайне едкий газ. Урон, наносимый этим газом, растет в зависимости от того, сколько времени цель находилась в облаке, начиная с _%1$d ед. урона,_ и продолжит накапливать токсины.\n\nКогда совокупный урон от облака достигнет _%2$d единиц_, он будет ослеплять носителя, и достигнув _%3$d единиц_, он начнет парализовать цель.\n\nПрием зелья исцеления или избавления может очистить накопленные токсины. Сильные враги выйдя из облака, очищаются от накопленных токсинов.
items.wands.hightwand.wandofvenom.bmage_desc=Когда _%s_ %s, у посоха Ядовитого тумана, есть шанс излучения хаотической энергии, как у зачарования хаоса и обладает определенным эффектом заряда.

items.wands.wandofsun.name = палочка Палящего солнца
items.wands.wandofsun.ac_dismiss = РАССЕЯТЬ МИНИ-СОЛНЦЕ
items.wands.wandofsun.dissun = Мини-солнце вышло из под контроля!
items.wands.wandofsun.solid = В этом месте нельзя призвать мини-солнце.
items.wands.wandofsun.staff_name = посох Палящего солнца
items.wands.wandofsun.stats_desc=Эта палочка призывает миниатюрное солнце в указанное место. Мини-солнце открывает обзор в области 7х7 вокруг него, и наносит _%1$d-%2$d урона_ окружающим врагам.\n\nВраги, находящиеся внутри мини-солнца, получают дополнительный урон от других мини-солнц.\n\nУрон, наносимый мини-солнцем, зависит от расстояния к противнику.
items.wands.wandofsun.bmage_desc=Когда _%s_ %s, посох Палящего солнца может продлить действие всех существующих мини-солнц на один ход.
items.wands.wandofsun.hassun = Вы рассеяли это мини-солнце.
items.wands.wandofsun.no_more_suns = Эта палочка не может контролировать больше мини-солнц.
items.wands.wandofsun$minisun.desc = \n\nВ этом месте находится мини-солнце, и оно будет существовать еще %d ходов.\n\n(Из-за технической трудности, это солнце не сохраняется в подземелье после выхода из игры.)
items.wands.wandofsun.desc = Первый человек, который попытался перенести солнце под землю, не осознавал того, что нежить и демоны не устрашатся ложного солнца.
items.wands.wandofsun.thanks=_-_ Дизайн: Цай Юйлу.\n_-_ Тематика: Волшебный час.\n_-_ Награда: _Премия Цзинхун_ - Первое место. [ \n_-_ Соревнование: 1-й конкурс DIY за кубок Цзинхун. [


###MLPD
items.lightblack.oilpotion.name= пузырек с маслом
items.lightblack.oilpotion.desc=Внутри содержится вещество, необходимое для заправки фонаря, поэтому до того, как фонарь погаснет, его всегда можно дозаправить этим веществом, чтобы фонарь снова засиял ярким светом.
items.lightblack.oilpotion.ac_refill=ЗАПРАВИТЬ


items.lightblack.oillantern.name = переносной фонарь
items.lightblack.oillantern.desc = Этот из закаленного стекла фонарь - незаменимая вещь в темном подземелье. Даже в самых темных местах подземельях этот простой фонарь будет освещать вам путь, если конечно у вас есть пузырьки с маслом для поддержания его огня. Он будет лучшим спутником, когда вам станет совсем в невмоготу.\n\nСейчас в фонарь помещено _%1$s_ запасных пузырьков с маслом и _%2$s_ фитилей из факелов, которые пополняют масло в фонаре для поддержания его света.\n\nГорючесть факела зависит от максимальной достигнутой глубины и количества взятых испытаний:\n\nТекущая глубина спуска: _%3$s_ этаж.\nТекущая горючесть факела: _%4$s%%_ (гарантировано не менее 10%% горючести).
items.lightblack.oillantern.ac_light = ЗАЖЕЧЬ
items.lightblack.oillantern.ac_snuff = ПОГАСИТЬ
items.lightblack.oillantern.ac_refill = ЗАПРАВИТЬ
items.lightblack.oillantern.ac_burn = РАЗЖЕЧЬ

items.lightblack.oillantern.ac_auto=АВТОЗАПРАВКА ВКЛ
items.lightblack.oillantern.ac_nuto=АВТОЗАПРАВКА ВЫКЛ
items.lightblack.oillantern.auto=Имеющиеся пузырки с маслом и факелы, отныне будут автоматически заправляться в фонарь.
items.lightblack.oillantern.no_auto=Имеющиеся пузырки с маслом и факелы, отныне не будут автоматически заправляться в фонарь.

items.lightblack.oillantern.lanternosoul=Вы не можете зажечь фонарь, пока потерян рюкзак.
items.lightblack.oillantern.lantermostic=Вы не можете использовать фонарь, пока есть другие эффекты дающие свет!

items.lightblack.oillantern.lanterneedsx=Вашему фонарю нужны пузырьки с маслом, чтобы заправить его.
items.lightblack.oillantern.lanterneedsxs=Вашему фонарю нужна маслянистая жидкость для заправки.
items.lightblack.oillantern.lanterdied=Ваш фонарь потух!
items.lightblack.oillantern.lanteroff=Вы погасили фонарь.
items.lightblack.oillantern.lanteron=Вы зажгли фонарь.
items.lightblack.oillantern.lanterreload=Вы добавили в фонарь немного масла, и он стал немного ярче.
items.lightblack.oillantern.lanterneed=У вас недостаточно пузырьков с маслом для заправки фонаря.
items.lightblack.oillantern.lanterneeds=Вам нужен еще пузырек с маслом для заправки фонаря.
items.lightblack.oillantern.black=Ваш фонарь полностью погас и нуждается в розжиге, чтобы зажечь его вновь...
items.lightblack.oillantern.must=В вашем рюкзаке нет фонаря, чтобы заправить его.

items.artifacts.goldiron.name=позолоченный молот (НЗП)
items.artifacts.goldiron.ac_stonegold=stonegold
items.artifacts.goldiron.ac_onedingyi=onedingyi
items.artifacts.goldiron.ac_condontxa=condontxa
items.artifacts.goldiron.desc=Когда-то это был молот тролля-кузнеца, и в нем заключена магическая сила.\n\nА поскольку вы случайно потеряли кирку тролля, он поручил вам убить его темную сторону.\n\nТеперь, когда вы выполнили поручение тролля, этот магический молот был отдан вам троллем как дар...

items.bombs.laserpython.name=кристальная бомба
items.bombs.laserpython.desc=Эта взрывное устройство в виде кристалла, при броске взрывается в указанном месте, чтобы создать кристаллический пилон с автоматическим лазером.
items.bombs.laserpython.didnot_pick=Вы не можете забрать этот предмет...

items.food.pasty.moon=лунный пирог
items.food.pasty.moonling=Вкус лунного пирога навевает тёплые воспоминание и это придает вам радость.
items.food.pasty.moon_desc=Лунные пироги символизируют воссоединение и счастье. Употребляя такую пищу в этот праздничное время, опасное подземелье также наполнится радостной атмосферой такого замечательного праздника.\n\nСчастливого Праздника середины осени, %s!

items.scrolls.exotic.scrollofpolymorph.name=свиток Полиморфа
items.scrolls.exotic.scrollofpolymorph.desc=Этот секретный свиток содержит мощную магию трансформации. При её задействовании все видимые противники превратятся в волшебных овец!\n\nЗаклинание необратимо, так что предметы в инвентарях пострадавших будут потеряны. Кроме того, боссы способны устоять перед данным эффектом.

items.potions.elixirs.watersoul.name=эликсир Водяного духа
items.potions.elixirs.watersoul.desc=Этот эликсир, благодаря сочетанию зелья исцеления и замороженного мяса, может временно дать иммунитет к проклятию воды, а также его целебные и насыщающие свойства, накладывают эффект лечения и немного утоляют голод.\n\nКроме того выпив его, можно моментально снять все отрицательные эффекты наложенные «Проклятием бога воды».\n\nПри активации испытания «Фармакофобия», употребление 3 таких эликсира, прекратит наложения лечения, а последующие применение будет давать только привычные бонусы.

items.food.lightfood.name=сияющий онигири
items.food.lightfood.eat_msg=Эта еда имеет великолепный вкус!
items.food.lightfood.desc=Этот рисовый шарик получился в результате смешивания замороженного мяса и семян молниоцвета, а также рациона пищи. Такая еда способна не только исцелить героя, но и мгновенно утолить голод и вдобавок одарит благословением грома.

items.food.cake.name=клубничный кремовый торт
items.food.cake.eat_good=Вы чувствуете, энергию стимулирующую свой потенциал, дающую +1 силу!
items.food.cake.eat_good2=Вы уже получили свой потенциал от этой энергии, поэтому она преобразуется в барьер.
items.food.cake.desc=Торт - самая редкая пища в подземелье, съев его можно мгновенно снять все негативные эффекты и предать себе бодрость. Также такой торт имеет крайне малый шанс стимулировать скрытый потенциал...

items.food.switch.name=волшебный сэндвич
items.food.switch.desc=Такой сэндвич может быстро утолить голод и дать некий магический барьер, но недостаток в том, что другая еда, может стать не такой вкусной, после его употребления.


items.food.ricedumplings.eat_msg_good=Этот рис такой вкусный, когда есть начинка!\nВы чувствуете, как некая сила полностью очистила ваше тело.

items.food.ricedumplings$ricedumplingsred.name=цзунцзы с засахаренными финиками
items.food.ricedumplings$ricedumplingsred.desc=Цзунцзы - символ праздничного, поэтому съев их можно насытится и мгновенно избавиться от большинства негативных эффектов, причем разные цзунцзы имеют свои особые эффекты.\n\nВкусив такой цзунцзы, можно получить эффект лечения. При активации испытания «Фармакофобия», эффекта отравления не будет, а само лечение будет уменьшено вдвое. [\n\nС праздником! [

items.food.ricedumplings$ricedumplingspink.name=цзунцзы с бобовой пастой
items.food.ricedumplings$ricedumplingspink.desc=Цзунцзы - символ праздничного, поэтому съев их можно насытится и мгновенно избавиться от большинства негативных эффектов, причем разные цзунцзы имеют свои особые эффекты.\n\nВкусив такой цзунцзы, можно получить эффект магической брони. [\n\nС праздником! [

items.food.ricedumplings$ricedumplingsorange.name=цзунцзы с семенами лотоса
items.food.ricedumplings$ricedumplingsorange.desc=Цзунцзы - символ праздничного, поэтому съев их можно насытится и мгновенно избавиться от большинства негативных эффектов, причем разные цзунцзы имеют свои особые эффекты.\n\nВкусив такой цзунцзы, можно получить эффект перезарядки артефактов. [\n\nС праздником! [

items.food.ricedumplings$ricedumplingslink.name=цзунцзы с соленым желтком
items.food.ricedumplings$ricedumplingslink.desc=Цзунцзы - символ праздничного, поэтому съев их можно насытится и мгновенно избавиться от большинства негативных эффектов, причем разные цзунцзы имеют свои особые эффекты.\n\nВкусив такой цзунцзы, можно получить эффект увеличения силы. [\n\nС праздником! [

items.food.ricedumplings$ricedumplingsbottle.name=цзунцзы с вяленой свининой
items.food.ricedumplings$ricedumplingsbottle.desc=Цзунцзы - символ праздничного, поэтому съев их можно насытится и мгновенно избавиться от большинства негативных эффектов, причем разные цзунцзы имеют свои особые эффекты.\n\nВкусив такой цзунцзы, можно получить постоянный бонус к силе, пропитаться землей и фосфорным огнем. [\n\nС праздником! [


items.weapon.missiles.darts.halodart.name=фосфорный дротик
items.weapon.missiles.darts.halodart.desc=Эти дротики, покрытые веществом на основе Пламецвета, при попадании загораются ярким фосфорным пламенем.

items.weapon.missiles.darts.lightdart.name=сияющий дротик
items.weapon.missiles.darts.lightdart.desc=Эти дротики, покрытые веществом на основе Молниоцвета, благословляют цель при попадании.

items.scrolls.exotic.scrollofaffection.name=свиток Очарования
items.scrolls.exotic.scrollofaffection.desc=При прочтении этот свиток издаст соблазняющий смех, который очарует всех, кто его услышит.

items.scrolls.exotic.scrollofconfusion.name=свиток Замешательства
items.scrolls.exotic.scrollofconfusion.desc=При прочтении вслух этот свиток наложит чары на всех в зоне видимости, ослепляя и дезориентируя их.

items.scrolls.exotic.scrollofpetrification.name=свиток Окаменения
items.scrolls.exotic.scrollofpetrification.desc=Вспышка красного света наполнит разумы всех существ в поле зрения таким сильным ужасом, что они просто застынут на месте.

items.potions.exotic.potionofdragonkingbreath.name=зелье Дыхания королевского дракона
items.potions.exotic.potionofdragonkingbreath.prompt=Выберите место для поджога
items.potions.exotic.potionofdragonkingbreath.desc=Этот пузырёк содержит необычный реактив, который мгновенно воспламеняется при смешении со слюной. Вовремя выплюнув жидкость, вы сможете выпускать фосфорное пламя изо рта!

items.potions.elixirs.elixirofdragonking.name=эликсир Королевского дракона
items.potions.elixirs.elixirofdragonking.desc=Будучи выпитым, эликсир наделит героя силой фосфорного огня, протекающей по его венам. Этот эффект подарит ему иммунитет к любому огню и позволит поджигать врагов своими ударами, накладывая на них фосфорный огонь.

items.potions.potionofliquidflamex.name=зелье Фосфорного огня
items.potions.potionofliquidflamex.desc=Этот сосуд содержит сверхнестабильный реактив, который при малейшем контакте с воздухом резко загорается, поджигая всё вокруг.\n\n_Оно опаснее и смертоноснее, чем обычное зелье алхимического огня!_


items.potions.potionoflightningshiledx.name=зелье Молнии
items.potions.potionoflightningshiledx.desc=Это зелье сочетает в себе комплексный электризованный химикат и свойства молниоцвета, позволяя владельцу получить полный иммунитет к электричеству на некоторое время.


#MLPDSHOPREADYGO!!!
items.food.potionoflightningshiled.name=молниезащитный отвар
items.food.potionoflightningshiled.desc=Глоток этой электризованной сладкой жидкости наполнит вас огромной энергией, ненадолго получив полную неуязвимость к электричеству. 
items.food.potionoflightningshiled.ac_oat=ВЫПИТЬ
items.food.potionoflightningshiled.look_msg=Вы чувствуете, как электрический ток проходит по всему телу...

items.potions.exotic.potionoflightstromcloud.name=зелье Грозовых молний
items.potions.exotic.potionoflightstromcloud.desc=Странная и нестабильная энергия, таящаяся внутри пузырька, исходит от энергии грома и молнии, которая позволяет своему обладателю на какое-то время обрести возможность повелевать громовой молнией, становясь самым _громовержцем_.

# EndingBlade v3.0 messages
items.weapon.melee.endingblade.name=клинок исхода
items.weapon.melee.endingblade.desc=Запретный клинок, окутанный темным пламенем. Каждый его взмах пожирает душу владельца. Однажды взяв его руки, отпустить его уже невозможно.

items.weapon.melee.endingblade.ac_perfect_shot=ЗАТВОР
items.weapon.melee.endingblade.ac_actor_entry=ПОГЛОЩЕНИЕ НЕБЕС
items.weapon.melee.endingblade.ac_ready_wrap=ОТСНЯТЫЕ

items.weapon.melee.endingblade.invalid_target=Неподходящая цель.
items.weapon.melee.endingblade.level_desc=Текущий уровень: +%d
items.weapon.melee.endingblade.upgrade_cooldown=Перезарядка улучшения...
items.weapon.melee.endingblade.upgrade_ready=Доступна возможность улучшения!
items.weapon.melee.endingblade.trial_mode_active=\nРежим «Страшный суд» активирован, все монстры стали сильнее!
items.weapon.melee.endingblade.current_effects=Эффекты текущего уровня:
items.weapon.melee.endingblade.effect_l1=Каждые 15 ходов накладывает на владельца горение на 1 ход и добавляет 5% к порчи.
items.weapon.melee.endingblade.effect_l4_6=Ментальное зрение 4 клетки, 25% шанс мгновенного убийства.
