items.weapon.melee.icefishsword.typical_ability_desc=Дуэлянт может _рассечь_ врага замороженным рыба-мечом. Эта атака обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если, рассекая противника, Дуэлянт убивает его, то она может использовать эту атаку ещё раз бесплатно на протяжении 5 ходов.
