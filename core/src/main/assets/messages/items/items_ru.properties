items.artifacts.electricalsmoke.conversation_ghost = Проблеск истинны... Вы обнаружили: «Что ему нравятся весенние розы!».
items.artifacts.electricalsmoke.conversation_light = Хоть, свет солнца освещает лампу... Вы обнаружили: «Что, здесь все также темно».

