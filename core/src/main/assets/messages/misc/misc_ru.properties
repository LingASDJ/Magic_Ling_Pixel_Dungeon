paswordbadges$badge.spicealboss.desc=Вам удалось одолеть Йог-Зота, с чем еще вам предстоит столкнуться следующий раз? Вы не узнаете этого, пока продолжите свой путь дальше!

paswordbadges$badge.drawf_head.title=Конец Былой Эпохи
paswordbadges$badge.drawf_head.desc=Вы сумели одолеть Полководца Дворфов и освободили его от проклятия.

paswordbadges$badge.brcler.title=Начало после Конца
paswordbadges$badge.brcler.desc=Ваше исследование Испытания боссами подошло к концу, но до разгадки краха вам еще далеко...

paswordbadges$badge.reset_day.title=Вновь узрел свет солнца?
paswordbadges$badge.reset_day.desc=Вы сумели вынести останки таинственного существа из подземелья, и тем самым осуществили его заветное желание.

paswordbadges$badge.take_item.title=Кладоискатель
paswordbadges$badge.take_item.desc=Вы отыскали три спрятанных сокровища в лабиринте сокровищ, поняв то, что дуэль с Королем мимиков не единственное предназначение этого места.

paswordbadges$badge.big_x.title=Неожиданный мутант
paswordbadges$badge.big_x.desc=Генетические мутации открывают путь к чему-то неизведанному! Вы стали свидетелем появления мутантов в подземелье, а также усвоили урок, что шутки с мутантами плохи...\n\nНаграда: случайная броня на 0-м этаже. (на прилавке в гостинице)

paswordbadges$badge.exsg.title=Сильного духом не сломить
paswordbadges$badge.exsg.desc=Испорченные зелья были всего лишь иллюзией, но вы все равно смогли выстоять это!\n\nНаграда: дополнительные 3 кобальтовые монеты (автоматически начисляются после прохождения 5 этажей) и 400 золота в каждой игре.

