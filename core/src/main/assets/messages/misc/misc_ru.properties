badges$badge.champion_1x.title=Осваивающееся чемпион
badges$badge.champion_1x.desc=Пройдите игру с 1 испытанием или больше\n\nДаже проклятие перевоплощения подземелья не помешает вам исследовать его.

badges$badge.champion_2x.title=Отважный чемпион
badges$badge.champion_2x.desc=Пройдите игру с 3 испытаниями или больше\n\nПостоянное исследование границ перевоплощения подземелья - символ вашей храбрости.

badges$badge.champion_3x.title=Неукротимый чемпион
badges$badge.champion_3x.desc=Пройдите игру с 6 испытаниями или больше\n\nВыдержав суровые испытания в подземелье, ваши невероятные подвиги узнает весь мир.

badges$badge.champion_4x.title=Несдающийся чемпион
badges$badge.champion_4x.desc=Пройдите игру с 8 испытаниями или больше\n\nНезависимо от исхода, ваши стремление покажет Божеству, на что вы горазды. Возможно, так вы в будущем предстанете перед ним воочию.

badges$badge.champion_5x.title=Неодолимый чемпион
badges$badge.champion_5x.desc=Пройдите игру с 10 испытаниями или больше\n\nВаши убеждения и репутацию узнают все, что даже привлечет внимание могущественных сил этого мира. Именно так вам откроется путь для нового путешествия.

badges$badge.kill_slmking.title=Уничтожитель слизи
badges$badge.kill_slmking.desc=Победите Принца слизней, живущего в изменчивом кристалле.

badges$badge.kill_dm720.title=Воин привыкший к взрывам
badges$badge.kill_dm720.desc=Победите DM-720 и его водителя в ледяной пещере.\n\nНаграда: Юэхуа дает дополнительные заклинания проклятия и разблокируется возможность получения артефакта Шипастый плащ.

badges$badge.death_from_glyph.title=Неизбежная смерть
badges$badge.death_from_glyph.desc=Умрите от отложенного урона

badges$badge.unlock_mage.title=Маг разблокирован!
badges$badge.unlock_mage.desc=Разблокируйте Мага, использовав свиток Улучшения
badges$badge.unlock_rogue.title=Разбойник разблокирован!
badges$badge.unlock_rogue.desc=Разблокируйте Разбойника, совершив 10 неожиданных атак за одну игру
badges$badge.unlock_huntress.title=Охотница разблокирована!
badges$badge.unlock_huntress.desc=Разблокируйте Охотницу, 10 раз попав метательным оружием во врагов в течение одной игры

badges$badge.kill_sm.title=Дуэль с Мимиком
badges$badge.kill_sm.desc=Примите вызов Короля мимиков и победите его, чтобы получить его уважение. Это должен быть честный поединок!

badges$badge.rlpt.title=Расколотый мир на части
badges$badge.rlpt.desc=Начните испытание Фрагментация и пройдите игру завершив основной сюжет игры.

badges$badge.storm.title=Приближение бури
badges$badge.storm.desc=Завладев Кристальным сердцем и покинув подземелье, небо вокруг героя внезапно потемнело, раздав гром и молнии.\n\nХранители у входа в подземелье просят вас отправиться в Империю Падкого Хлада, чтобы встретиться с ней. Похоже, это еще не конец.

badges$badge.kill_mg.title=Элегия Льда и Снега
badges$badge.kill_mg.desc=Постарайтесь её одолеть в стране льдов, чтобы она пришла в себя.\n\nНаграда: в подземелье иногда будет появляться эксклюзивная палочка.

badges$badge.kill_apple.title=Искоренение Ядовитого плода
badges$badge.kill_apple.desc=Убейте жуткое растение, которое обосновалось в глубинах джунглей.

badges$badge.nyz_shop.title=Задобренный торговец
badges$badge.nyz_shop.desc=Приобретайте предметы в терминале, чтобы Няруко сама захотела поселится на 0-м этаже!\n\nНаграда: Няруко поселится на 0-м этаже, скидка 10% для кобальтовых монет на 0-м этаже и дополнительно 320 золотых.

