badges$badge.kill_dog.title=Перед ликом Злобной собаки
badges$badge.kill_dog.desc=«Ведь это просто собака из потустороннего мира, чего тут бояться?»\n\n_Победите Цербера, посланника ада._

paswordbadges$badge.pink_ling.title=Знакомство с Божественной Лин
paswordbadges$badge.pink_ling.desc=В снежной гостинице вы встретили бывшее воплощение божественного сознания, чья сила уже не так велика, как раньше, но она все еще охраняет это место...

paswordbadges$badge.whatsup.title=Запутанное начало
paswordbadges$badge.whatsup.desc=Ну и ну! Отлично! У вас это получилось!\n\n(Не всё то золото, что блестит)

badges$badge.kill_clsister.title=Уничтожение Ядовитого плода
badges$badge.kill_clsister.desc=Убейте мутировавшее растение, которое обосновалось в глубинах джунглей.\n\nСтаршая сестра «Клиффорда».\n\nРазблокирует генерацию предмета: Меч жало джунглей.

badges$badge.kill_fire_dragon.title=Как приручить дракона
badges$badge.kill_fire_dragon.desc=Победите лавового дракона, летающего в глубинах джунглей.\n\nСудьба дракона уже предрешена, и участь джунглей стремительно меняется...\n\nНаграда: Фаина поселится в городе.

paswordbadges$badge.king_isto.title=Мирный договор Королевского двора
paswordbadges$badge.king_isto.desc=Жил как великий герой, а погиб героем среди призраков.\n\nРазблокирует генерацию предмета: Королевская секира.

paswordbadges$badge.hero_clre.title=Знак храбрости
paswordbadges$badge.hero_clre.desc=Bzmdr стал свидетелем вашей храбрости, и теперь вы можете раскрыть еще более мрачную сторону Запутанного мира.\n\nТеперь Bzmdr в запутанном мире дает дополнительный подарок.



challenges.no_food=На диете
challenges.no_food_desc=Еды и так мало, а вам надо еще и следить за вашими порциями питания!\n\n- Еда и рог изобилия имеют лишь треть голодоутоляющего эффекта.\n- Другие источники насыщения работают без изменений.
challenges.no_armor=Эксгибиционизм
challenges.no_armor_desc=Вам необходимо будет иметь веру в себя, так как от брони мало толку!\n\n- Увеличение защиты у брони значительно снижено при её улучшении.\n- Защитные свойства земляного стража также значительно снижены.
challenges.no_healing=Фармакофобия
challenges.no_healing_desc=Разумеется, зелье исцеления - полезная штука, но, к сожалению, у вас аллергия!\n\n- Зелье исцеления и все предметы, сделанные из него, а также солнцефрукт отравляют героя вместо того, чтобы его исцелять.\n- Нестабильные экстракты не могут, в зависимости от случая, отравлять или исцелять героя.\n- Эти предметы будут работать нормально для других персонажей.
challenges.no_herbalism=Бесплодная земля
challenges.no_herbalism_desc=Похоже, в этом проклятом подземелье не осталось ни капли чистой воды...\n\n- Удалена роса\n- Удалены растения\n- Семена не будут прорастать
challenges.swarm_intelligence=Единый разум
challenges.swarm_intelligence_desc=Осторожнее, монстры в подземелье стали умнее!\n\n- Если вас заметят, то все существа поблизости узнают ваше местоположение
challenges.darkness=Во тьме
challenges.darkness_desc=Это же всё-таки подземелье!\n\n- Дальность зрения сильно снижена\n- На каждом этаже можно найти факел\n- Свет от факела длится меньше
challenges.no_scrolls=Неграмотность
challenges.no_scrolls_desc=Одну из рун стало сложнее найти. И, разумеется, самую полезную из них.\n\n- Удалена половина свитков улучшения
rankings$record.something=Убит неизвестно чем

challenges.aquaphobia=Мутная вода
challenges.aquaphobia_desc=Вся вода в подземелье стала мутной из-за загрязнений от обитающих в ней существ, и теперь она несет опасность.\n\n_-_ Вода превращается в грязь при хождении по ней, и перемещение по ней накладывает на героя отрицательный эффект, а действия большинства негативных эффектов, влияющих на тело героя будут иметь не менее 5 ходов.\n_-_ При создании водной местности существует 80% шанс, что она превратится в обычную местность.\n_-_ На каждом этаже появляется дополнительная комната с пираньями.\n_-_ В обычные магазины добавляется Реагент негашеной извести.

challenges.champion_enemies=Вражеские чемпионы
challenges.champion_enemies_desc=Вы не единственный, кто может повышать свой уровень!\n\n- У регулярных противников есть один шанс из восьми возникнуть со специальным эффектом чемпиона.\n- Чемпионы просыпаются, если они возникают в спящем состоянии.\n- Чемпионы не чувствительны к порче.\n\nСуществует девять видов противников-чемпионов:\n_Пылающий (оранжевый):_ причиняет +25% урона в ближнем бою, загорается при попадании, нечувствителен к огню, распространяет пламя при смерти, не может поджечь клетки с водой.\n_Проецирующий (фиолетовый):_ причиняет +25% урона в ближнем бою, +4 радиуса в ближнем бою.\n_Антимагический (зеленый):_ получает -25% урона и дополнительно снижает урон от заклинаний на 50%.\n_Гигантский (синий):_ получает -75% урона, +1 радиуса в ближнем бою, не может проходить по тоннелям.\n_Вдохновленный (желтый):_ +200% меткости, +200% уклонения.\n_Растущий (красный):_ имеет +20% меткости, уклонения, урона, и эффективное здоровье. Растет на 1% каждый третий ход.\n_Фосфорный (небесно-голубой):_ причиняет +15% урона в ближнем бою, загорается фосфором при попадании, нечувствителен к обычному и фосфорному огню, распространяет пламя при смерти, не может поджечь клетки с водой.\n_Страдающий (темно-фиолетовый):_ причиняет +25% урона в ближнем бою, при потери половины здоровья,  получаемый урон наносится постепенно.

actors.char.aquaphobia=Вас ранит вода!
challenges.pro=}Режим разработчика}
challenges.pro_desc=Специальный режим для тестировщиков и разработчиков.\n\n1. Возможность подниматься и спускаться по лестнице когда угодно.\n2. Возможность призвать любых существ.\n3. Множество специальных предметов.\n4. Герой будет 30 уровня и кучей золота.\n\n(Примечание: этот режим отключает получение медалей).
challenges.traditional = Реализм - T1
challenges.hard = Сказочность - T2
challenges.warning = Путешествие - T3
challenges.test = Тестирование - Отладка

challenges.rlpt = Фрагментация
challenges.rlpt_desc=Таинственная сила, бушующая под землей, постепенно развращает это место, превращая его в очередной кошмар.\n\nНачиная с 6-го этажа, на двух последних этажах каждого региона (например, на 8-м и 9-м этаже) существует шанс встретить элитных монстров или врагов из предыдущих регионов.\n\nКроме того, вы встретите множество новых монстров, каждый из которых весьма опасен, вынуждая героя остерегаться на каждом шагу.\n\nСписок особых монстров:\n1. Теневой вор (регион 2)\n2. Следопыт-стрелок (регион 3)\n3-A. Огненный призрак (регион 4), элитник: Алый грабитель\n3-B. Альтернативный элементаль: Фосфорная душа.\n4. Доктор ужаса (регион 5) в образе саморазрушения.\n\n(Баланс: это испытание становится недействительным, если включен режим Золотой бабочки, но оно будет засчитано в количестве активированных испытаний.)

challenges.sbsg = Мутированность
challenges.sbsg_desc=Таинственная магия подземелья вызвала мутацию у некоторых существ.\n\nВсе существа становятся другими из-за мутации клеток, делая исследование подземелий более сложным.\n\nСуществует шесть видов мутировавших противников с равным шансом появления, за исключением взрывной мутации, которая имеет 5% шанс:\n_Неудачный мутант:_ скорость передвижения увеличена на _30%_, и наносит на _35%_ меньше урона.\n_Взрывной мутант:_ скорость передвижения уменьшена на _50%_, наносит на _30%_ меньше урона, и при смерти наносит _взрывной урон_.\n_Совершенный мутант:_ скорость передвижения увеличена на _50%_, наносит на _25%_ больше урона, и получает на _10%_ меньше урона.\n_Опасный мутант:_ наносит на _20%_ больше урона, имеет _10%_ шанс вызвать кровотечение атакой, и при смерти _5%_ шанс отправить сигнал тревоги на текущем этаже.\n_Туманный мутант:_ наносит на _10%_ меньше урона, дальность атаки _+1_. и имеет _10%_ шанс вызвать головокружение атакой.\n_Фазовый мутант:_ случайным образом телепортируется, если _4 раза_ попадает атакой по своему противнику, и медленно _восстанавливает здоровье_, когда находится вне поле зрения противника.\n\n_Примечание:_ если активировано испытание «Вражеские чемпионы», эффекты мутаций и чемпионов могут одновременно присутствовать на одном и том же монстре.\n\nТакже монстры с измененной скоростью передвижения больше не получают бонус от испытания «Запутанного мира». На эффект «Взрывной мутант», не действуют все эффекты влияющие на скорость передвижения, в противном случае они будут с измененной скоростью.

challenges.exsg = Испорченное зелье
challenges.exsg_desc=Зелья:\n- Зелье Силы заменено на зелье Слабости. Но действует как обычное, когда сила героя ниже 11 очков.\n- Зелье Ментального заменено на зелье Ментальной слепоты.\n- Зелье Невидимости заменено на зелье Провокации.\n- Зелье Ускорения заменено на зелье Замедления. Однако, это не влияет на красного часового.\n\nЕда:\n- Мясной пирог: дает скорость на 8 ходов и с неким шансом +1 очко силы.\n\n_(Имеет предел на получение силы, который увеличивается от прохождения подземелья, большой этаж/предел (1/2/3/4/5 этаж, 1/2/2/1/1 раз)_\n\nОстальное:\n- Продвинутые зелья _(особые/экстракты/эликсиры)_ не затрагиваются.\n- По неясной причине, большинство положительных зелий, окажутся вам ядовитыми!\n- Хоть и ваше воображение делает зелья ядовитыми, но еду очень полезной! \n- Кроме того, в подземелье появятся торговые автоматы, в которых будут продаваться более качественные вещи.

challenges.warling = Арена противостояния (откл.)
challenges.warling_desc=Судя по всему, вы так достали монстров, что теперь некоторые стали хитрее.\n\nВраги, с которыми вы столкнетесь, будут умнее или глупее (по 50% шанс на каждого).\n\n1. Глупее враги в основном следуют за умными врагами, за своими родичами (т.е. крысы за крысами).\n2. Умные враги стараются убежать от противника, когда здоровье становится меньше или равно 50%, и стараются искать полезные растения, получая различные усиления, а также делают участки с водной местностью, в то время как глупые враги наступают на растения совершенно случайно.\n3. (После 12 этажа) Умные враги при появлении имеют 10% шанс превратиться в _кислотного мутанта_.\n4. Умные враги создают арену после обнаружения игрока, _кроме боссов, NPC и врагов на подслоях_.

challenges.morelevel=Переменность
challenges.morelevel_desc=Под влиянием времени в подземелье постепенно появляется все больше странных мест... Кто знает, на что вы наткнетесь, исследуя подземелье в этот раз? \n\nАктивация этого испытания увеличивает стандартную частоту появления редких монстров на 10%.\n\nДобавляет 6 новых и 1 особый тип разновидностей местностей на этажах:\n_-_ Этаж с шипами: увеличивает значительное количество ловушек. Но больше не появляются обычные этажи с ловушками.\n_-_ Гигантский этаж: становится больше местности, монстров и ресурсов. Но больше не появляются огромные этажи.\n_-_ Бесплодный этаж: уменьшает количество врагов и припасов на этаже, но с врагов выпадают дополнительные ресурсы.\n_-_ Элитный этаж: привлекает особых врагов на этаж, которые не находятся в состоянии сна.\n_-_ Этаж с кристаллом: особая комната, которая периодически накладывает на врагов различные положительные эффекты.\n_-_ Этаж с колодцами: содержит три колодца и уменьшает скорость появление монстров. Вы можете выбрать только один колодец из трех, так как при использовании одного все остальные теряют свой эффект.\n_-_ Босс-этаж: создает фиксированные этажи с другими боссами.\n_-_Секретный 4-й босс-этаж: Небесный слизень.\n_-_Секретный 8-й босс-этаж: Небесное возмездие.

challenges.dhxd =Угасающий свет
challenges.dhxd_desc=灯火指引着前进的道路，提灯引路，灯火前行！\n\n_此挑战对常规灯火机制进行了增强。\n常规灯火机制在你的挑战数量≥10时自动启用，且不视为一个挑战。详情说明长按这个挑战的按钮可查阅。_\n\n挑战说明：\n1.灯火值的最大值降低至72\n2.在低于30灯火值后，稀有敌人的生成概率全局提升35%\n3.商店贩卖的灯油将更少，且价格更加昂贵\n4.如果灯火值低于10，将周期性传送本层敌人在英雄附近，让英雄周期性流失生命\n5.如果灯火值低于20，所有敌人的近战攻击均有可能造成灯火能量降低\n6.如果同时开启“没入黑暗”挑战，灯火值周期扣减额外+2\n7.灯火值较低时死亡，会导致黑暗中滋生自己的暗影。暗影会随着你的等级提升变得更强\n8.灯火值低于25时，普通怪物不再掉落物品\n\n<#F00>注意：若不同时开启“没入黑暗”挑战，此挑战将变得极其困难！<RGB>

challenges.dhxd_moredesc=地牢深处的黑暗仍在蔓延。在这暗无天日的绝地，提灯成为了你唯有的光源。\n\n1.追加道具：提灯&灯油。提灯由角色初始携带，灯油在商店中出售。灯油和火把都可以为提灯补充燃料。\n\n2.灯火值机制：灯火值会在点燃提灯时逐渐上升，在提灯熄灭时周期性下降。\n\n3.祝福和诅咒\n维持较高的灯火水平进入新的区域会获得随机的纯洁祝福。当灯火值低于一定阈值时，祝福会消失并追加魔女诅咒。\n魔女诅咒被施加后便不会自行消散，祝福消失后也无法重新取得，直到你进入新的区域。

challenges.cs=Запутанный мир
challenges.cs_desc=Кажется, что время вышло из-под контроля. Вас засасывает во временной вихрь, где вы неоднократно перевоплощаетесь. Очутитесь в опасном мире будущего, где почти нет ресурсов, а все враги могущественны и жестоки.\n\nЗдесь вы - герой, а все остальные - обычные люди. Тут, представлен конца света, где все ресурсы давно исчерпаны, остались только развалины и иллюзии, образованные бесконечной скверной, в этом мире можно легко умереть, из-за любой не осторожности.\n\nЭто место не подается здравому смыслу, здесь не действует обычный правила смены дня и ночи. Делая этот мир еще опасней В этом обреченном путешествии вам нужно будет тщательно обдумывать каждый шаг, находить скудные ресурсы и стараться изо всех сил исследовать этот запутанный мир, чтобы выжить.\n\nИзменения мира:\n_-_ 1. Генерация предметов в подземелье будет существенно уменьшена, изменится местность, а некоторые начальные предметы на 0-м этаже будут удалены.\n_-_ 2. Все враги изначально пробуждены, но их станет меньше, и все они будут чемпионами. Поскольку слабые были устранены сильнейшими.\n_-_ 3. Появляются дополнительные специальные комнаты снабжения на некоторых этажах.\n_-_ 4. Урон всех врагов на этажах боссов увеличивается в 1,25 раза.\n_-_ 5. Смена дня и ночи, теперь некоторые монстры становятся более агрессивнее ночью.\n_-_ 6. Монстры с 3 по 24 уровень имеют 25% шанс получить особый эффект: Печать Запутанного мира.\n_-_ 7. Скорость передвижения героя увеличится на 10%.

challenges.no_armorx = Эта земля не привередлива к поеданию брони, отличающейся от тканевой, и поэтому автоматически удаляется не тканевая броня при ее обнаружении.


kill=\n_Снежная ведьма:_\n_-_ +25% здоровья.\n_-_ Еще больше слуг призывает на воде.\n_-_ При поражении обязательно выпадет амулет из темного золота.\n_Полководец Дворфов:_\n_-_ Смертоносные атаки используются чаще.\n_-_ +50% здоровья.\n_-_ При поражении обязательно выпадет амулет священной природы.\n_Король слизней:_\n_-_ +100% здоровья.\n_-_ Сильнее урон и более высокая скорость.\n_-_ В начале дополнительно призывает: гнолла-трикстера, древнего краба, вонючую крысу и темного слизня.\n_-_ При поражении обязательно выпадают слизневые перчатки.\n_DM-720:_\n_-_ Приобретает новые способности.\n_-_ При поражении обязательно выпадет DM150 терминал контроля. [еще не завершен]

challenges.stronger_bosses=Злые боссы
challenges.stronger_bosses_desc=Это испытание делает борьбу с боссом еще более сложной! Вы столкнетесь с более могущественными боссами. А также получите дополнительные очки, монеты и дополнительное выпадение предметов!!!\n\nПримечание. «Испытание боссами» активируется по умолчанию для Злых боссов, но некоторые эксклюзивные боссы не получают этот бонус. }\n\nПервый регион: Священные джунгли. }\n\n_A. Плод Клиффорда:_\n_-_ Фаза 1: броня щупалец значительно увеличивается, все их атаки наносят урон от заклинаний, и задержка атак составляет 4 хода.\n_-_ Фаза 2: появляются два чистокристаллических элементаля, а количество дополнительных метательных оружий уменьшается.\n_-_ Фаза 3: уменьшается количество зелий очищения, и появляются две улучшенные версии призрачных пираний.\n_-_ Местность меняется, и появляются две дополнительные бомбы.\n_-_ Дополнительная награда в виде 10 кобальтовых монет.\n\n_B. Цветок Окраха (НЗП):_\n_-_ Скоро будет. [\n\nВторой регион: Ледяная тюрьма. [\n\n_A. Тенгу:_\n_-_ Здоровье +25%.\n_-_ Фаза 1: ловушки гораздо смертоноснее.\n_-_ Фаза 2: способности противника используются чаще.\n_-_ Дополнительная награда в виде 10 кобальтовых монет.\n\n_B. Король мимиков:_\n_-_ Каждое подобранное сокровище делает босса сильнее.\n_-_ Кристалл периодически дает боссу щит, и увеличивает его здоровье.\n_-_ Мистический портал способен перемещаться, и он активно избегает игрока.\n_-_ В лабиринт сокровищ находится ​​молодой облик Короля мимиков и эбонитовый мимик (непрозрачность на 45%).\n_-_ Босс получает треть от вашей брони, когда изображает вас, или 7 ед. брони, если у цели 0 ед. брони.\n_-_ Начальная атака увеличена на 15%, а способность с кровотечением становится более смертоносным.\n_-_ Босс способен отбрасывать противника, кода достигнута третья фаза карты. \n_-_ Дополнительная награда в виде 40 кобальтовых монет.\n\n_C. Теневой Тенгу (НЗП):_\n_-_ Скоро будет. ]\n\nТретий регион: Ледяные пещеры. ]\n\n_A. DM-300:_\n_-_ Здоровье +75%.\n_-_ Высоковольтная опора с увеличенными характеристиками и их становится больше.\n_-_ Способности противника чаще и сильнее.\n_-_ DM-300 ещё быстрее, пока сверх-заряжен.\n_-_ После победы выпадет случайное кольцо.\n\n_B. DM-720 (НЗП):_\n_-_ Здоровье +50%.\n_-_ Древний следопыт имеет уменьшений урон наносимых атак и вылазит когда остается {2 опоры{.\n_-_ Все высоковольтные опоры имеют вдвое уменьшенное здоровье и теперь нужно их уничтожать.\n_-_ Пока не уничтожен DM-720, древний следопыт{полностью неуязвим{.\n_-_ Меняется местность.\n_-_ Больше наград после битвы.\n\n_C. Снежная ведьма (НЗП):_\n_-_ Скоро будет. |\n\nЧетвертый регион: Руины столицы. |\n\n_A. Король Дворфов:_\n_-_ Здоровье +50%.\n_-_ Приспешники становятся еще сильнее.\n_-_ Фаза 1: более быстрые способности противника и призыв приспешников.\n_-_ Фаза 2: дополнительный призов Ледяного голема и бронированного гнолла у которого будет на 62,5% больше здоровья.\n_-_ Фаза 3: 2х здоровья, более быстрый призыв.\n_-_ Фаза 4: добавляет 20% к максимальному запасу щита.\n\n_B. Генерал Дворфов (НЗП):_\n_-_ Скоро будет. [\n\nПятый регион: Предместье демонов. [\n\n_A. Йог-Джева:_\n_-_ Две Длани вызываются одновременно.\n_-_ +60% урона лазером.\n_-_ Более сильные личинки.\n_-_ Фаза 2: дополнительный призов замороженной и фосфорной Длани.\n\n_B. Беспредельный ужас - Воля кристалла (НЗП):_\n_-_ Скоро будет. *\n\nДополнительные регионы: Боссы. *\n\n_Древние руины - Сакабамбаспис_\n_-_ Значительно уменьшена дальность обзора.\n_-_ Способности Сакабамбасписа более смертоносны.\nЛавовая пещера - Лавовый дракон\n_-_ Видоизмененная местность карты.\n_-_ Каждая 4-я атака притягивает элементалей за собой.\n_-_ Фаза 2: увеличивает время неуязвимости, но восстанавливает по 80 ОЗ.

paswordbadges$badge.unlock_ricesword.title=Путь к Злакам
paswordbadges$badge.unlock_ricesword.desc=_Рисовый большой меч_ - теперь генерируется в игре.

paswordbadges$badge.kill_yogsts.title=Врата серебряного ключа
paswordbadges$badge.kill_yogsts.desc=Вы прошли испытание Тавела Ат'Умра и заполучили Серебряный ключ.\n\nНаграда: при повторном диалоге с Паопао, можно получить свиток предсказания. (расходует лимит предметов при взаимодействий с NPC)

challenges.nomore= К сожалению, для этого испытания больше нет дополнительных механик!

challenges.blood_died=Новообращённый вампир
challenges.blood_died_desc=Вы приняли дар кровы и стали новым членом в клане вампиров. Теперь вы жаждете крови, чествуя неконтролируемую силу внутри себя...\n\n_-_ Ваш герой жаждет <#f00>крови. <RGB>Начиная с 3-го этажа, когда ваш герой не находится на этаже босса, он не может <#0f0>пассивно восстанавливать здоровье, <RGB>и вместо этого постепенно теряет его, а жажда крови становится все сильнее по мере продвижения в глубь подземелья.\n_-_ Каждая физическая атака героя имеет эффект высасывающий <#f00>20%-45% здоровья <RGB>от текущего урона, и дает 10% шанс нанести <#f00>двойной урон <RGB>при атаке противника оружием ближнего боя.\n_-_ Лечебный эффект зелья исцеления _значительно снижен_.\n_-_ Удалены <#0f0>семена солнечника <RGB>и <#f00>кровавая чаша. <RGB>
challenges.no_challenge=_В этом сохранении испытания не включены._

paswordbadges$badge.allchsx.title=Хрустальный десерт
paswordbadges$badge.allchsx.desc=Вам удалось выбраться из обреченного подземелья, и теперь глава гильдии путешественников приглашает вас на банкет!\n\nВы прошли игру с 13 испытаниями или больше, и теперь \nглава гильдии путешественников приготовит для вас мороженое «Хрустальное сердце» в знак благодарности за ваше удачное путешествие по подземелью.\n\n_Максимально пройдено испытаний: %s._

paswordbadges$badge.godchsx.title=Орден Храма
paswordbadges$badge.godchsx.desc=Вы успешно прошли испытание и вернулись на поверхность. Орден поверхности наградил вас медалью Храма.\n\nВы прошли игру с 15 испытаниями или больше, теперь вас ждёт богатство и слава, но это только начало...\n\n_Максимально пройдено испытаний: %s._

paswordbadges$badge.vamghost_dead.title=Священное правосудие
paswordbadges$badge.vamghost_dead.desc=Вы убили вампира применив бутылек со святой водой.

paswordbadges$badge.sugar_friendly.title=Сладость или Гадость
paswordbadges$badge.sugar_friendly.desc=В одной игре вы задобрили трех начинающих ведьмочек сделав их своими союзниками, изготавливая <#FF1493>конфеты. <RGB>

paswordbadges$badge.ghost_hunter.title=Охотник за привидениями
paswordbadges$badge.ghost_hunter.desc=Во время действия контратаки в мини-игре Pac-Man все призраки были возвращены обратно в тюрьму.

badges$badge.kill_mores.title=Грёзы наяву
badges$badge.kill_mores.desc=Когда вы внезапно просыпаетесь в постели, ясность сновидения еще долгое время не дает вам прийти в себя после сна. Интересно, это было наяву или всего лишь сон?\n\nПоздравляем с завершением альтернативной и истинной концовки замка бездны!\n\n_Награда: разблокирован эксклюзивный скин для мага «Молчаливая ведьма»._

paswordbadges$badge.dog_touch.title=Поглаживание собаки
paswordbadges$badge.dog_touch.desc=Повторное прикосновение взорвало его!

paswordbadges$badge.hell_back.title=Возвращение из Ада
paswordbadges$badge.hell_back.desc=Воскресили внутри трещины франкенштейна.

paswordbadges$badge.time_circle.title=Бесконечный круговорот
paswordbadges$badge.time_circle.desc=Прошлое или будущее — какой из этих путей был вашим?

paswordbadges$badge.flower_home.title=Попутная дорога
paswordbadges$badge.flower_home.desc=«Пока жива юность - близкие люди остаются рядом»\n\n_Даже когда перед вами %s предстоит испытание, вы никогда не идете на поводу у смерти._

badges$badge.endblade.title=Всесожженный исход
badges$badge.endblade.desc=Пройдите игру в режиме Золотой бабочки, экипировав предмет клинок исхода, и переживите в течение 720 ходов «Окончательный приговор» обладая клинком исхода, уровня не ниже +15.

badges$badge.sky_dead.title=Праведник небес
badges$badge.sky_dead.desc=Победите Небесное возмездие под затопленной камерой тюрьмы! Пусть оно обретет истинное освобождение!

badges$badge.good_maker.title=Беспомощный старец
badges$badge.good_maker.desc=Выполните все задания, порученные у старого чародея, чтобы он отблагодарил своего благодетеля.\n\nНаграда: случайное кольцо на 0-м этаже. (на прилавке в гостинице)

badges$badge.sakafish.title=Отыскавший древнее существо
badges$badge.sakafish.desc=Победите загадочное древнее существо, обитающее в тенистом водоёме.

badges$badge.alonecity.title=Последняя ода
badges$badge.alonecity.desc=Даже в хаотичном и неумолимом времени будущего вы сумеете преодолеть тяжесть обстоятельств. Одержав победу над Богом вы почувствуете забытьё, но проснувшись, обнаружите, что все вернулось на круги своя. Все вокруг, станет таким настоящим...\n\n_Завершите испытание Запутанный мир._

badges$badge.kill_firegirl.title=Крещение Священным Огнем
badges$badge.kill_firegirl.desc=Пройдите испытание у ведьмы в заснеженном каньоне, чтобы добиться её признания.

badges$badge.war_rip.title=Пристанище воина
badges$badge.war_rip.desc=Время стирает все, но подвиги героев мир никогда не забивает.\n\nДжунгли очищаться, и мы обязательно снова встретимся, мои товарищи по оружию.

badges$badge.kill_dwmaster.title=Последний полководец
badges$badge.kill_dwmaster.desc=Победите Полководца Дворфов в хаотичной временной линии Испытании боссами.

badges$badge.kill_spboss.title=Охотник за боссами
badges$badge.kill_spboss.desc=Путешествуйте по запутанной паутине временных линий, чтобы победить Йог-Зота и покончить с угрозой, нависшей над всеми временными линиями.

badges$badge.bossrush.title=Концовка Испытания боссами - Начало после Конца
badges$badge.bossrush.desc=Даже после того, как Йог-Зот будет повержен, разрушенная временная линия не сможет избежать участи обнуления. Всё сущее вернется в небытие, ожидая начала нового цикла.

badges$badge.kill_dwg.title=Видение падшего дворфа
badges$badge.kill_dwg.desc=Он уже никогда не покинет этот мир. Он есть прошлое и будущее...

badges$badge.kill_fishking.title=Трагическая туша
badges$badge.kill_fishking.desc=Победите Предка Пираньи и принесите мир в ледяные пещеры.

badges$badge.exsg_win.title=Сильного духом не сломить
badges$badge.exsg_win.desc=Испорченные зелья были всего лишь иллюзией, но вы все равно смогли выстоять это!\n\nНаграда: дополнительные 3 кобальтовые монеты (автоматически начисляются после прохождения 5 этажей) и 400 золота в каждой игре.

badges$badge.rlpt_win.title=Неожиданный мутант
badges$badge.rlpt_win.desc=Генетические мутации открывают путь к чему-то неизведанному! Вы стали свидетелем появления мутантов в подземелье, а также усвоили урок, что шутки с мутантами плохи...\n\nНаграда: случайная броня на 0-м этаже. (на прилавке в гостинице)
