badges$badge.woc_money_girl.desc=Найдите сюрприз комнату в старинном замке.

badges$badge.master.title=Восходящая звезда
badges$badge.master.desc=Получите общую оценку S исполнения, в первом выступлении из трех основного шоу.

badges$badge.master_two.title=Известный актер
badges$badge.master_two.desc=Получите общую оценку S исполнения, в двух выступлениях из трех основного шоу.

badges$badge.master_three.title=Оскар за лучшую мужскую роль
