paswordbadges$badge.zqj_ghost.desc=Вы выполнили специальное задание у печального призрака во время «Праздника середины осени». [\n\nТы потрясающий, дружище. [

paswordbadges$badge.night_cat.title=Бессонная ночь
paswordbadges$badge.night_cat.desc=Вы единожды прошли игру в ночное время суток. [\n\nВы всегда думаете, вот еще чуть-чуть поиграю, а затем пойду спать... А потом удивлены, почему сейчас семь утра! [

paswordbadges$badge.pray_legend.title =Золотая легендарная карта!
paswordbadges$badge.pray_legend.desc =Вы получили легендарную или более высшую награду, когда произнесли Молитву.

paswordbadges$badge.pray_mythology.title=Мифическое сокровище
paswordbadges$badge.pray_mythology.desc=Оно такое искрящее и блестящее! Это же мифик!\n\nВы получили мифическую награду, когда произнесли Молитву.

