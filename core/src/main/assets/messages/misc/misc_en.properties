challenges.aquaphobia=_Sludge water_
challenges.aquaphobia_desc=The water has been polluted by the city above__, now you are _blinded_ and _crippled_ when you touch it. \nAt the same time, you can start to get _10 quicklime ideal reagents_! _
challenges.blood_died=Blood Died
challenges.blood_died_desc=You signed a contract with him and became a member of the vampire clan. You are thirsty for blood and the power of chaos...\n\n_-_You are thirsty for <#f00>blood<RGB>. Starting from the 3rd level, when you are not on the boss level, you will not <#0f0>recover your life<RGB> naturally, but will gradually lose it. As you explore deeper, this power becomes more and more dangerous.\n_-_Each of your physical attacks has a <#f00>blood-sucking effect: 20%-45% of the current damage<RGB>, and there is a 10% chance of causing <#f00>double damage<RGB> when attacking the enemy with melee weapons\n_-_The healing effect of the healing potion is greatly reduced\n_-_In this mode, <#0f0>Sunflower Seed<RGB> and <#f00>Blood Grail<RGB> are removed
challenges.champion_enemies=_Hostile champions_
challenges.champion_enemies_desc=You're not the only one who can level up!\n\n- Regular enemies have a 1/8 chance to spawn with a special champion buff.\n- Champions wake up if they spawn asleep\n- The hero knows when a champion spawns\n- Champions are immune to corruption\n\nThere are seven types of champion enemy:\n_Blazing (orange):_ +25% melee damage, ignites on hit, immune to fire, spreads flames on death\n_Projecting (purple):_ +25% melee damage, can attack anything they see\n_Antimagic (green):_ -25% damage taken, immune to magical effects\n_Giant (blue):_ -75% damage taken, +1 melee range, cannot move into tunnels\n_Blessed (yellow):_ +200% accuracy, +200% evasion\n_Growing (red):_ +20% accuracy, evasion, damage, and effective HP. Increases by 1% every 3 turns.\n_Ghost Ling (Sky Blue): _ Melee damage +65% with Phosphorus Fire effect, immune to fire and Phosphorus Fire, ignites the surrounding area upon death.
challenges.cs=Final Scene - Lonely City
challenges.cs_desc=Time seems to be out of control. You are sucked into a time and space vortex, and reincarnate here repeatedly. \n\nLost in a dangerous future world. In this world, resources are becoming increasingly scarce, and the enemies are powerful and cruel. \n\nHere, although you are a hero, everyone here is an ordinary person. The scene of doomsday emerges here, and resources have long been exhausted. Only debris and phantoms formed by endless miasma are left. If you are not careful, you may die. \n\nHere, which cannot be explained by common sense, the law of day and night is also silently going on. This will also bring greater challenges. In this dangerous journey, you need to choose your actions carefully, find scarce resources, and try your best to explore this lonely city and survive. \n\nChallenge description: \n_-_1. The generation of dungeon items is greatly reduced, the terrain of the 0th floor is changed, and most of the supplies are removed. \n_-_2. All enemies have elite or mutant attributes greatly improved\n(If the pre-challenge is not opened, the refresh rare monsters will be greatly improved)\n_-_3. The enemies are awake at the beginning. The enemies are rare but all of them are elite. Because the weak ones have been eliminated by the survival of the fittest. \n_-_4. Special supply rooms are added to some floors\n_-_5. The damage of all leader-level enemies is increased to 1.25x. \n_-_6. Day and night change, some monsters are more aggressive at night. \n_-_7. From the 3rd to the 24th floor, the monsters have a 25% chance of having a special buff: Lonely City Mark. \n8. The movement speed of the Lonely City hero is increased by 10%.
challenges.darkness=Into darkness
challenges.darkness_desc=It is a dungeon after all!\n\n- Regular visible distance dramatically reduced\n- A torch appears on each floor\n- Light buff lasts for less time
challenges.dhxd=Candle Fire Road
challenges.dhxd_desc=Lights guide the way forward. Lanterns lead the way. Lights lead the way! [This is a special mechanism for you must open more than 3 Challenges that than work, but you can also open it directly!]
challenges.dhxd_moredesc=General mechanics of the road ahead\n\n1. Added blessing of lights and witch's curse mechanics. The lights will decrease as you go deeper into the building\n2. If you die under low lights, you will have a mental breakdown and create your own shadow. As your level increases, the shadow will become stronger.\n3. Added lanterns and lamp oil. Use these items properly to survive in the blessing of lights! If you are unfortunately cursed by the witch, you will not fall into despair.\nThe lights are not extinguished, and hope is still there. Lanterns lead the way, and the lights move forward!
challenges.exsg=Potion Illness
challenges.exsg_desc=Potion Illness Rules?\n-PotionOfStrength Strength:-1\n-PotionOfMindVision NoEye:5 Round\n-Stealth potion roars immediately after drinking\n-Bleed for 6 rounds immediately after drinking the experience medicine\n-After drinking the super fast potion, you will be cripple for 8 rounds immediately\n==========================\nGet 8 rounds of extreme speed immediately after eating small rations\n Upgrade immediately after eating stew  \n Get an arcane shield after eating frozen raw meat\n Get 8 rounds of extreme speed and+1 strength immediately after eating whole meat pancake  \n Don't know why, most good potions are poisonous! \n Some potions are completely in DeBuff, but the food will be very useful
challenges.hard=Valhalla Mode - T2
challenges.morelevel=Unpredictable
challenges.morelevel_desc=Dungeons have gradually developed more terrains over time. Who knows what you will encounter when exploring the dungeon this time? \n\nAdded 6 new terrain perceptions and 1 special terrain perception. \n\n_-_Sword Mountain and Fire Sea Layer: Traps have increased significantly. And the regular trap layer will no longer appear in Unpredictable. \n\n_-_Super Giant Layer: The terrain becomes larger and more monsters, and the resources become more abundant. And the regular large layer will no longer appear in Unpredictable. \n\n_-_Empty City Strategy Layer: The number of enemies and supplies on this layer is reduced and lowered. Defeating enemies has a chance to get extra resource rewards. \n\n_-_Elite Strong Enemy Layer: Special enemies will definitely spawn on this layer, and these enemies will not sleep. \n\n_-_Blood Crystal Layer: There is an extra room on this layer, which will periodically give enemies various buffs. \n\n_-_Three Wells Blessing Layer: Fixed three wells appear on this layer, and the monster spawning speed is slightly reduced. \n\n_-_Special leader layer: fixed number of layers appear\n_-_Secret 4th layer - Boss: Sticky Goo\n_-_Secret 8th layer - Boss: Heavenly Punishment
challenges.no_armor=Faith is my armor
challenges.no_armor_desc=You'll need faith in yourself, as your armor won't do much!\n\n- Base blocking power reduced for all armor except cloth\n- All armor now gains very little blocking when upgraded\n- Earthen guardian's defensive power is also significantly reduced.
challenges.no_armorx=This land is not picky about armor other than cloth. If any non-cloth armor is detected, it will be automatically removed.
challenges.no_challenge=This save has no challenges enabled
challenges.no_food=On diet
challenges.no_food_desc=Food's already scarce, but you have to watch your portions as well!\n\n- Food and the horn of plenty are one third as effective at satisfying hunger\n- Other sources of satiety are unaffected
challenges.no_healing=Pharmacophobia
challenges.no_healing_desc=Healing potions sure are handy, unfortunately you're allergic!\n\n- Potions of healing, and items made using potions of healing, poison the hero instead of healing them\n- Alchemical catalysts cannot randomly poison or heal the hero\n- These items still work normally for other characters
challenges.no_herbalism=Barren land
challenges.no_herbalism_desc=There seems to be no clean water left in this accursed dungeon...\n\n- Dew drops are removed\n- Plants are removed\n- Seeds still appear, but will not take root
challenges.no_scrolls=Forbidden runes
challenges.no_scrolls_desc=A certain rune is harder to find. Unfortunately, it's always the most useful one.\n\n- Half of the dungeon's upgrades scrolls are removed
challenges.nomore=Sorry, no more bonus mechanics for this challenge!
challenges.pro=_Developer mode_
challenges.pro_desc=Annotated version? \nStarting with _almost all items_! At the same time, you will not be able to pass the level!
challenges.rlpt=Fragmented
challenges.rlpt_desc=The magic of the dungeon is eroding this place, and reality is nothing but a nightmare. \n\nAfter defeating the boss on the fifth floor, all floors and monsters will be random! ! ! \n\nSpecial Instructions: The Rogue opening cloak is replaced with 5 invisibility potions. \n\nEnable this challenge, you can get 3 free resurrection chances.
challenges.sbsg=Mutant Behemoth
challenges.sbsg_desc=Humans recall the fear of being dominated by giants\n- All creatures mutate hormones to become larger, but some become smaller due to some other adverse effect. \n- The size of the creature determines their movement speed, defense, evasion and melee damage. \n- Your extreme hunger will also become more deadly. 
challenges.stronger_bosses=Badder bosses
challenges.stronger_bosses_desc=This challenge makes defeating the Boss even more challenging!\n\nOnce activated, you'll encounter even more powerful Bosses,\n\nas well as extra points, permanent currency rewards, and better loot!!!\n\nWhat are you waiting for? Start your adventure now!!!\n\nNote: Boss Rush is automatically activated by default for certain bosses, and some BR-exclusive bosses do not have this bonus.\n\n <#ff0000>First Area - Sacred Forest Layer<RGB>\n\n_A. Fruit of Cleaves (Enhanced Effect Preview):_\n\n_-_ Global Phase:\n\n_-_ Terrain changes, two additional bomb supplies appear\n\n_-_ Phase 1:\n\n_-_ Vine armor is greatly increased throughout the battle, all attacks become spell damage, attack delay is increased to 4 turns\n\n_-_ Phase 2:\n\n_-_ Two Pure Crystal Elementals appear, throwing weapon supplies are greatly reduced\n\n_-_ Phase 3:\n\n_-_ Purification potion supply is greatly reduced, and two enhanced Phantom Fish appear\n\n_-_ Cobalt Coin Bonus Reward: 10\n\n_B. Flower of Okrach (Enhanced Effect Preview - WIP):_\nComing Soon\n\n <#ff00FF>Second Area - Ice Prison Layer<RGB>\n\n_A. Tengu (Enhanced Effect Preview):_\n\n_-_ Health +25%\n\n_-_ Phase 1:\n\n_-_ Traps are more deadly\n\n_-_ Phase 2:\n\n_-_ Skill frequency is higher\n\n_-_  Cobalt Coin Bonus: 10\n\n_B. King of Mimicry (Enhanced Effect Preview):_\n\n_-_ The King of Mimicry becomes stronger with each treasure pickup.\n\n_-_ The Crystal Tower periodically grants the King of Mimicry an Arcane Shield effect and significantly increases its health.\n\n_-_ The Treasure Labyrinth adds the King of Mimicry's juvenile form and the Ebony Mimic (opause increased to 45%).\n\n_-_ When the King of Mimicry mimics your appearance, it gains one-third of your total armor. If the target has 0 armor, it gains a fixed 7 armor.\n\n_-_ The King of Mimicry's basic attack damage is increased by 15%, and its bleed skill is more lethal.\n\n_-_ The King of Mimicry has a chance to inflict a small knockback effect after the third phase of the map.\n\n_-_ Cobalt Coin Bonus: 40\n\n_C. Dark Tengu (Enhanced Effect Preview - WIP)_\nComing Soon\n\n <#ffff00>Third Area - Ice Cavern Layer<RGB>\n\n_A. DM-300 (Enhanced Effect Preview):_\n\n_-_ Global Phase:\n\n_-_  Health +75%\n\nEnergy Towers are more robust. More energy towers need to be destroyed.\n\nSkill frequency is higher and more powerful.\n\nMovement speed is higher when overloaded.\n\nDefeat the enemy and it will always drop a random ring.\n\nB.DM-720 (Enhanced Effect Preview):\n\nGlobal Phase: Mech Health +50%\n\nAutopilot: The Blood Moon Hunter Elder will enter the battlefield when 2 towers remain, but its own attack damage will be reduced.\n\nIndestructible: Requires all energy towers to be destroyed; energy tower health is halved.\n\nUndistracted: The Blood Moon Hunter is completely invincible until the DM-720 is destroyed.\n\nRuthless Terrain: The terrain is different.\n\n More rewards after battle\n\n_C. Ice Witch - Winterbell (Enhanced Effect Preview - WIP):_\nComing Soon\n\n|Fourth Area - Ruins of the Wasteland|\n\n_A. Dwarf King (Enhanced Effect Preview):_\n\n_-_ Global Phase\n\n_-_ Health +50%\n\n_-_ Summoned minions are stronger throughout the battle\n\n_-_ Phase 1: Higher skill and summoning frequency\n\n_-_ Phase 2: Additional Frost Golem and Heavy Armored Jackal summoned; Heavy Armored Jackal has only 62.5% of its original health.\n\n_-_ Phase 3: Health +100%, higher summoning frequency\n\n_-_ Phase 4: Final battle adds a shield equal to 20% of maximum health.\n\n_B. Dwarf General (Enhanced Effect Preview - WIP): Coming Soon_\n\n <#00ffff>Fifth Area - Demon Suburbs<RGB>\n\n_A. Yog-Dzewa (Enhanced Effect Preview):_\n\n_-_ Summon two Ancient Fists simultaneously!\n\n _-_ Second phase additionally summons Frost and Ghostly Fist\n\n_-_ Laser attack damage +60%\n\n_-_ Summons more powerful minions\n\n_B. Extreme Fear - Crystal Will (Enhanced Effect Preview - WIP):_ _ Coming Soon\n\n*Extra Area - EX Boss* Ancient Ruins - Sakaban Turtle\n\n_-_ Map vision greatly reduced\n\n_-_ Sakaban Turtle's skills are more deadly\n\nScorching Cave - Lava Dragon\n\n_-_ Map terrain changes\n\n_-_ After every 4 attacks, directly captures the element on the field\n\n_-_ Second phase invulnerability time is longer, but health recovery is only 80.
challenges.swarm_intelligence=Swarm intelligence
challenges.swarm_intelligence_desc=Watch out, the dungeon monsters are getting smarter!\n\n- When an enemy notices you, nearby enemies are drawn to that location
challenges.test=Debug - Mod
challenges.traditional=Vanilla Mode - T1
challenges.warling=Tactical confrontation (offline)
challenges.warling_desc=Apparently, the monster has had enough of you, and now, you're not going to be better off.\n\nEnemies you encounter will be smarter or dumber (50% each)\n\n1. Dull enemies will follow smart enemies most of the time, and their races must be the same (that is, rats and mice)\n\n2. When the blood volume is less than or equal to 50% and the enemy is out of the battle, smart enemies will look for beneficial plants around them and obtain various benefits and update the land to water terrain, while dull enemies will step on the plants completely randomly.\n\n3. (After level 12) Smart enemies have a 10% chance of turning into mutated acid liquid when spawned. Kids, I _crash_\n\n45. Smart enemies will build an arena after discovering the player_Except Boss, NPC, and sub-layers_
challenges.warning=Danger Mode - T3
kill=\n_Ice Witch:_\n_-_+25% HP\n_-_ More minions summoned from water\n- Will definitely drop the Purple Gem Amulet when defeated\n_Dwarf Master:_\n_-_ More frequent deadly skills\n_-_ +50% HP\n- Will definitely drop the Nature's Holy Amulet when defeated\n_Slime King:_\n_-_ +100% HP\n_-_ Higher damage, faster speed\n_-_ Additional summons of Jackal Trickster, Giant Claw Crab, Rancid Rat, and Corrupted Slime at the start\n_-_ Will definitely drop the Gel Gloves when defeated\n_DM720:_\n_-_ Gain new skills\n_-_ Will definitely drop the DM150 Control Terminal when defeated [Not yet completed]
paswordbadges$badge.allchsx.desc=You have emerged from the end of the dungeon. Where will you go next?\n\nOpen more than 13 challenges and clear them. The three giants on the surface have invited you to go to a more dangerous surface.\n\n_Your current highest challenge record: %s. _
paswordbadges$badge.allchsx.title=Doomsday Test - Heart of Trial
paswordbadges$badge.big_x.desc=Gene mutation unlocks the game! You have witnessed the mutants in the dungeon, and also seen the truth that playing with fire will get you burned...\n\nBadge Reward: Random Armor (at the counter of the innkeeper)
paswordbadges$badge.big_x.title=Mutation Storm
paswordbadges$badge.blood_king.desc=You have passed His test, and now you are one of the new blood clan members.\n\nBadge Reward:\nA <#f00>Blood Clan Book <RGB> is generated near the Luobai Shop on the -0th floor. It can resist a fatal attack before the 15th floor, and cause a fatal attack to all enemies on this floor. (Except Boss)\nActively use it to gain invincibility for 10 rounds, and immediately restore all health points.
paswordbadges$badge.blood_king.title=The new blood king
paswordbadges$badge.brcler.desc=BR's investigation has finally come to an end, but the crisis is still far away...
paswordbadges$badge.brcler.title=Starting from One
paswordbadges$badge.dog_touch.desc=If you touch it again, it will explode! ! !
paswordbadges$badge.dog_touch.title=Touch it aaa again
paswordbadges$badge.drawf_head.desc=Defeat the dwarven warrior and free him from the curse.
paswordbadges$badge.drawf_head.title=The End of the Old Times
paswordbadges$badge.exsg.desc=Potion hysteria is just an illusion, you still persevered! \n\nBadge rewards: 3 extra cobalt coins per game (automatically settled after defeating 5 layers), 400 extra gold coins per game
paswordbadges$badge.exsg.title=A serious disease is like a fool
paswordbadges$badge.firegirl.desc=Destroy the Holy Fire Witch of Snow Riven Canyon and let her accept you.
paswordbadges$badge.firegirl.title=Holy Fire Hymn
paswordbadges$badge.ghost_hunter.desc=In a counterattack moment from the Pac-Man mini-game, all the ghosts are driven back to prison.
paswordbadges$badge.ghost_hunter.title=Ghost Hpunter
paswordbadges$badge.godchsx.desc=You have successfully broken through the ultimate test and returned to the surface. The Surface Alliance has awarded you the Temple Medal.\n\nOpen more than 15 challenges and pass the level. A life of prosperity and wealth is coming to you, but this is just the beginning...\n\n_Your current highest challenge pass record: %s pick. _
paswordbadges$badge.godchsx.title=Badge of the Temple
paswordbadges$badge.godd_make.desc=He has completed all the tasks entrusted by the old stick maker. Now, it is time for him to repay his benefactor. \n\nBadge Reward: Random Ring (at the counter of the innkeeper)
paswordbadges$badge.godd_make.title=Light in dark room
paswordbadges$badge.good_blue.desc=Can be hit by laser once at most when fighting Sakaban Turtle and cannot be hit by Dump Truck skill in the third stage.
paswordbadges$badge.good_blue.title=Little Blue's Approval
paswordbadges$badge.hell_back.desc=Let the Broken Dream Golem be resurrected in the crack once.
paswordbadges$badge.hell_back.title=I'm back from hell!
paswordbadges$badge.hellorworld.desc=In a chaotic future timeline, you still defeated the cruel environment. When you defeated him, you felt a blackout before your eyes. When you woke up, you found that you were back to your normal life. Everything around you was so real. \n\n_Complete the Lonely City Challenge_
paswordbadges$badge.hellorworld.title=Hymn of the End
paswordbadges$badge.hero_clre.desc=Bzmdr has witnessed your perseverance, and you can now reveal the more chaotic side of the lonely city.\n\nGucheng Bzmdr will give an additional final gift
paswordbadges$badge.hero_clre.title=Mark of the Brave
paswordbadges$badge.kill_dwg.desc=He never left. He is the past and the future.
paswordbadges$badge.kill_dwg.title=Dwarf's Vision
paswordbadges$badge.kill_fishboss.desc=Defeat the Ancestor Piranha and bring peace back to the Ice Cave.
paswordbadges$badge.kill_fishboss.title=Gotham of the Great Swarm
paswordbadges$badge.kill_yogsts.desc=Pass Tavel's test and get the Silver Key's approval\n\nReward: Interact with Bubble again to get a Precognition Scroll (consumes NPC interaction times)
paswordbadges$badge.kill_yogsts.title=Through the Silver Key Gate
paswordbadges$badge.king_isto.desc=Live as a hero, die as a ghost hero. \n\n(Permanently unlock the dwarf general's special weapon "Royal Court Peace")
paswordbadges$badge.king_isto.title=Pasword of the King
paswordbadges$badge.night_cat.desc=Clear a level at night.\n\n[One more game and then go to sleep...sleep, huh? Why is it seven in the morning?!
paswordbadges$badge.night_cat.title=Sleepless Night
paswordbadges$badge.pink_ling.desc=In the Snow View Inn, you met a former incarnation of the divine consciousness whose power is no longer as strong as before, but she is still guarding this place...
paswordbadges$badge.pink_ling.title=Meet Mio God
paswordbadges$badge.pray_legend.desc=Obtain legendary or higher level items in the prayer activity
paswordbadges$badge.pray_legend.title=Golden Legend!
paswordbadges$badge.pray_mythology.desc=You are electricity! You are light! You are the only myth! \n\nGet mythical rewards in the prayer event
paswordbadges$badge.pray_mythology.title=...The myth reappears!
paswordbadges$badge.reset_day.desc=Carry the remains of the mysterious creature out of the dungeon and fulfill its unfulfilled wish.
paswordbadges$badge.reset_day.title=Reset to the light of day?
paswordbadges$badge.saka_died.desc=Defeat the mysterious ancient creature that lives in the dark pools
paswordbadges$badge.saka_died.title=Ancient Biology Archive Investigator
paswordbadges$badge.sky_xead.desc=Execute the horror beneath the prison water dungeon! Set it free!
paswordbadges$badge.sky_xead.title=Sky Punishment Hunter
paswordbadges$badge.spicealboss.desc=You have defeated Yog-Zot. What will you encounter next? We don't know. We will wait and see!
paswordbadges$badge.spicealboss.title=The strong prey on the weak
paswordbadges$badge.sugar_friendly.desc=In one game, make a total of three trainee witches as your allies by <#FF1493>making candies<RGB>.
paswordbadges$badge.sugar_friendly.title=No candy? Just trick or treat!
paswordbadges$badge.sworddream.desc=Time will make people forget everything, but the deeds of heroes are still talked about by the world. \n\nThe jungle has been initially cleansed. We will meet again, comrades.
paswordbadges$badge.sworddream.title=Warrior's Destination
paswordbadges$badge.take_item.desc=Obtain three hidden treasures in the treasure maze. Remember, dueling is not the original intention of the Mimic King.
paswordbadges$badge.take_item.title=Treasure Seeker
paswordbadges$badge.time_circle.desc=The prisoner naively believed that one day they would meet again.
paswordbadges$badge.time_circle.title=Endless reincarnation
paswordbadges$badge.unlock_ricesword.desc=_Rice Sword_--will now spawn in the game
paswordbadges$badge.unlock_ricesword.title=The Way of Rice
paswordbadges$badge.vamghost_dead.desc=Kill the vampire with the holy water bottle.
paswordbadges$badge.vamghost_dead.title=Holy Judgment
paswordbadges$badge.whatsup.desc=Ah! Great! I won!!! \n\n(Free irregular gold coins to cut "one petal")
paswordbadges$badge.whatsup.title=A Confused Start
paswordbadges$badge.zqj_ghost.desc=Complete the Mid-Autumn Festival special mission of the Sad Ghost. \n\n[You are awesome, my beloved partner[
paswordbadges$badge.zqj_ghost.title=The Sorrow of Moonlight Separation
